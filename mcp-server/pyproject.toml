#
# EN | This is the ONLY part of Visio Sapiens allowed a third-party
# EN | dependency. Everything under vssp/ is stdlib + pyyaml, because a
# EN | Home Assistant OS box is not somewhere you ask a user to run
# EN | `pip install`. This server never goes there: it runs on a desktop,
# EN | started by an MCP client, and may depend on the MCP SDK freely.
# FR | C'est la SEULE partie de Visio Sapiens autorisee a avoir une
# FR | dependance tierce. Tout ce qui est sous vssp/ est stdlib + pyyaml,
# FR | parce qu'une machine Home Assistant OS n'est pas un endroit ou l'on
# FR | demande a un utilisateur de lancer `pip install`. Ce serveur n'y va
# FR | jamais : il tourne sur un poste de travail, demarre par un client
# FR | MCP, et peut dependre librement du SDK MCP.

[project]
name = "vssp-mcp"
version = "0.1.0"
description = "Model Context Protocol server exposing a Visio Sapiens Home Assistant instance to AI clients"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
dependencies = [
    "mcp[cli]>=2.2.0",
]

[project.scripts]
vssp-mcp = "vssp_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vssp_mcp"]

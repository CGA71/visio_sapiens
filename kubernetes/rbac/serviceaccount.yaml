apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-ci-ha-deployer
  namespace: home-assistant # Cible du déploiement
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    # "create" est indispensable pour le fonctionnement de kubectl cp (qui initie un processus exec)
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-ci-ha-binding
  namespace: home-assistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-ci-ha-deployer
subjects:
  - kind: ServiceAccount
    name: gitlab-ci-sa # Votre compte existant
    namespace: ci       # Son namespace d'origine

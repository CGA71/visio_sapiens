apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-job-ha-deployer
  namespace: homeassistant # <--- Corrigé ici.
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-job-ha-binding
  namespace: homeassistant # <--- Corrigé ici
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-job-ha-deployer
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitlab-ci-role
rules:
  - apiGroups: [""]
    # Ajout de "pods/attach" dans la liste des ressources
    resources: 
      - "pods"
      - "pods/exec"
      - "pods/attach"
      - "pods/log"
      - "services"
      - "namespaces"
      - "secrets"
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitlab-ci-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitlab-ci-role
subjects:
  - kind: ServiceAccount
    name: gitlab-ci-sa
    namespace: ci

########################################################################
# EN | Home Assistant OS as a KubeVirt VM — the ISO-PROD staging instance.
# FR | Home Assistant OS en VM KubeVirt — la preproduction ISO-PROD.
#
# EN | WHY A VM AND NOT A POD. The existing staging is a Home Assistant
# EN | CORE container in the `homeassistant` namespace. It has no
# EN | Supervisor, no /addons, no `ha` CLI - so a whole half of this
# EN | project could never be tested before production: the add-on copy
# EN | step, `ha backups new`, the add-on store, and the Supervisor
# EN | authentication route the vssp-mcp add-on depends on, which shipped
# EN | with "not verified, and it cannot be" written in its own
# EN | documentation. A real HAOS appliance closes that gap.
# EN | This is ADDITIVE. The `homeassistant` namespace stays exactly as it
# EN | is, and it has to: it is a k3s pod, so it is the only instance where
# EN | the INFRASTRUCTURE update family (host, k3s, GitLab, runner) is
# EN | applicable at all. On an appliance that family reports n/a by
# EN | design. Replacing the pod would leave that feature with nowhere to
# EN | be exercised.
# FR | POURQUOI UNE VM ET PAS UN POD. La preproduction actuelle est un
# FR | conteneur Home Assistant CORE dans le namespace `homeassistant`.
# FR | Elle n'a ni Superviseur, ni /addons, ni CLI `ha` - donc toute une
# FR | moitie de ce projet ne pouvait jamais etre testee avant la
# FR | production : l'etape de copie des add-ons, `ha backups new`, la
# FR | boutique, et la route d'authentification Superviseur dont depend
# FR | l'add-on vssp-mcp, livre avec « pas verifie, et invérifiable » ecrit
# FR | dans sa propre documentation. Une vraie machine HAOS comble ce trou.
# FR | C'est ADDITIF. Le namespace `homeassistant` reste exactement tel
# FR | quel, et il le faut : c'est un pod k3s, donc la seule instance ou la
# FR | famille de mises a jour INFRASTRUCTURE (hote, k3s, GitLab, runner)
# FR | s'applique. Sur un appareil, cette famille rapporte n/a par
# FR | conception. Remplacer le pod laisserait cette fonctionnalite sans
# FR | aucun endroit ou etre exercee.
#
# EN | TWO HOST-SIDE PREREQUISITES, both outside Kubernetes and both
# EN | needing root once:
# EN |   1. a bridge over the spare NIC, which the VM taps into
# EN |        nmcli connection add type bridge ifname br0 con-name br0 # EN |             stp no ipv4.method disabled ipv6.method ignore
# EN |        nmcli connection add type ethernet ifname enp11s0 master br0 # EN |             con-name br0-port-enp11s0
# EN |        nmcli connection up br0
# EN |   2. the dispatcher script beside this file, because k3s sets the
# EN |      FORWARD policy to DROP and bridged IPv4 is walked through it
# EN |        install -m 755 50-br0-forward # EN |             /etc/NetworkManager/dispatcher.d/50-br0-forward
# EN | Without (2) the VM gets a working IPv6 and no IPv4 at all, which
# EN | looks like a DHCP problem and is not.
# FR | DEUX PREREQUIS COTE HOTE, tous deux hors de Kubernetes et demandant
# FR | root une fois :
# FR |   1. un pont sur la carte inutilisee, ou la VM vient se brancher
# FR |      (les trois commandes nmcli ci-dessus) ;
# FR |   2. le script dispatcher a cote de ce fichier, parce que k3s met la
# FR |      politique FORWARD a DROP et que l IPv4 pontee y passe.
# FR | Sans (2), la VM obtient une IPv6 qui marche et aucune IPv4, ce qui
# FR | ressemble a un probleme de DHCP et n en est pas un.
#
# EN | Applied by apply-haos.sh beside this file, which substitutes
# EN | __HAOS_VERSION__ and checks the prerequisites first. Do not apply
# EN | this directly: the placeholder is not a valid version.
# FR | Applique par apply-haos.sh a cote, qui substitue __HAOS_VERSION__ et
# FR | verifie d'abord les prerequis. Ne pas appliquer directement : le
# FR | marqueur n'est pas une version valide.
########################################################################
apiVersion: v1
kind: Namespace
metadata:
  name: haos
  labels:
    vssp-role: staging-iso-prod
---
# EN | THE LAN, THROUGH A HOST BRIDGE. This is what makes the appliance
# EN | behave like the production one instead of like a service behind a
# EN | translated port.
# EN | The first attempt used masquerade on the pod network, published with
# EN | a NodePort. It fails for a reason that is nobody's bug: while Home
# EN | Assistant OS installs Core it serves a landing page on port 80 and
# EN | redirects :8123 there with a 307 that DROPS THE PORT. Behind a
# EN | NodePort that redirect points at the node's own port 80, which
# EN | belongs to Traefik. No amount of port publishing fixes an absolute
# EN | redirect that discards the port - the appliance has to be reachable
# EN | at its own address.
# EN | br0 is a host bridge over enp11s0, a second NIC that carries no host
# EN | address. That matters: bridging the interface the host actually uses
# EN | would mean moving 192.168.1.11 onto the bridge, on a remote machine,
# EN | which is the classic way to lock yourself out. This one enslaves an
# EN | interface that was doing nothing, so the management link is never
# EN | touched.
# EN | No `ipam` block on purpose: the CNI assigns nothing and Home
# EN | Assistant OS does its own DHCP, exactly as it would on bare metal.
# FR | LE LAN, PAR UN PONT SUR L'HOTE. C'est ce qui fait que l'appareil se
# FR | comporte comme celui de production plutot que comme un service
# FR | derriere un port traduit.
# FR | La premiere tentative utilisait masquerade sur le reseau des pods,
# FR | publie par NodePort. Elle echoue pour une raison qui n'est le bug de
# FR | personne : pendant qu'il installe Core, Home Assistant OS sert une
# FR | page d'accueil sur le port 80 et y redirige :8123 par un 307 qui
# FR | SUPPRIME LE PORT. Derriere un NodePort, cette redirection pointe sur
# FR | le port 80 du noeud, qui appartient a Traefik. Aucune publication de
# FR | port ne repare une redirection absolue qui jette le port -
# FR | l'appareil doit etre joignable a sa propre adresse.
# FR | br0 est un pont hote sur enp11s0, une seconde carte qui ne porte
# FR | aucune adresse de l'hote. C'est important : ponter l'interface que
# FR | l'hote utilise reellement obligerait a deplacer 192.168.1.11 sur le
# FR | pont, sur une machine distante, ce qui est la facon classique de
# FR | s'enfermer dehors. Celui-ci enrole une interface qui ne faisait
# FR | rien, le lien de gestion n'est donc jamais touche.
# FR | Pas de bloc `ipam` volontairement : le CNI n'attribue rien et Home
# FR | Assistant OS fait son propre DHCP, exactement comme sur du metal.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: lan
  namespace: haos
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "lan",
      "type": "bridge",
      "bridge": "br0",
      "macspoofchk": false,
      "ipam": {}
    }
---
# EN | CDI imports the official QCOW2 straight from the Home Assistant
# EN | release, decompressing the .xz on the way in. No image to build, no
# EN | registry to host - which matters here, because this GitLab has no
# EN | container registry enabled.
# EN | The disk is a standalone DataVolume rather than a dataVolumeTemplate
# EN | so that redefining the VM does not throw away a staging instance
# EN | somebody has configured. Deleting the disk has to be deliberate.
# FR | CDI importe le QCOW2 officiel directement depuis la release Home
# FR | Assistant, en decompressant le .xz au passage. Aucune image a
# FR | construire, aucun registre a heberger - ce qui compte ici, car ce
# FR | GitLab n'a pas de registre de conteneurs active.
# FR | Le disque est une DataVolume autonome plutot qu'une
# FR | dataVolumeTemplate, pour que redefinir la VM ne jette pas une
# FR | preproduction que quelqu'un a configuree. Supprimer le disque doit
# FR | etre un geste volontaire.
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: haos-disk
  namespace: haos
spec:
  source:
    http:
      url: https://github.com/home-assistant/operating-system/releases/download/__HAOS_VERSION__/haos_ova-__HAOS_VERSION__.qcow2.xz
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 64Gi
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: haos
  namespace: haos
  labels:
    app: haos
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: haos
    spec:
      domain:
        cpu:
          cores: 2
          # EN | host-passthrough rather than an emulated model: the
          # EN | appliance runs its own container engine inside, and every
          # EN | layer of emulation is paid for twice.
          # FR | host-passthrough plutot qu'un modele emule : l'appareil
          # FR | fait tourner son propre moteur de conteneurs dedans, et
          # FR | chaque couche d'emulation se paie deux fois.
          model: host-passthrough
        memory:
          guest: 4Gi
        # EN | UEFI IS MANDATORY. Home Assistant OS does not boot on legacy
        # EN | BIOS - the documentation says so in those words - and the
        # EN | OVMF build must be a NON-secureboot one. Getting this wrong
        # EN | produces a VM that starts, consumes a core, and never shows
        # EN | a login. It is the single most common reason a HAOS VM
        # EN | appears to do nothing.
        # EN | secureBoot: false also means SMM is not needed; smm is only
        # EN | required when secure boot is on.
        # FR | L'UEFI EST OBLIGATOIRE. Home Assistant OS ne demarre pas en
        # FR | BIOS legacy - la documentation le dit en ces termes - et la
        # FR | build OVMF doit etre SANS secure boot. Se tromper ici produit
        # FR | une VM qui demarre, consomme un coeur, et n'affiche jamais de
        # FR | connexion. C'est la premiere cause d'une VM HAOS qui semble
        # FR | ne rien faire.
        # FR | secureBoot: false signifie aussi que SMM est inutile ; smm
        # FR | n'est requis que si le secure boot est actif.
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            # EN | `bridge` binding, not masquerade: the VM gets a tap on
            # EN | br0 and speaks on the LAN with its own MAC, so the router
            # EN | leases it an address like any other machine in the house.
            # EN | mDNS and broadcast discovery work, which masquerade could
            # EN | never offer.
            # FR | Binding `bridge`, pas masquerade : la VM recoit un tap sur
            # FR | br0 et parle sur le LAN avec sa propre MAC, donc le
            # FR | routeur lui donne un bail comme a n'importe quelle machine
            # FR | de la maison. Le mDNS et la decouverte par diffusion
            # FR | fonctionnent, ce que masquerade ne pouvait pas offrir.
            - name: lan
              bridge: {}
      # EN | ONE interface, like production. The pod network is gone on
      # EN | purpose: two NICs would have Home Assistant OS running DHCP on
      # EN | both and choosing a default route on its own, and an appliance
      # EN | that is only sometimes on the LAN is worse than one that always
      # EN | is. Recovery if the LAN has no DHCP server is a manifest revert
      # EN | and a restart - the disk persists.
      # FR | UNE interface, comme la production. Le reseau des pods est
      # FR | retire volontairement : deux cartes feraient faire du DHCP sur
      # FR | les deux a Home Assistant OS, qui choisirait seul sa route par
      # FR | defaut, et un appareil parfois sur le LAN est pire qu'un
      # FR | appareil toujours dessus. En cas d'absence de serveur DHCP sur
      # FR | le LAN, la sortie de secours est un retour du manifeste et un
      # FR | redemarrage - le disque persiste.
      networks:
        - name: lan
          multus:
            networkName: lan
      volumes:
        - name: rootdisk
          dataVolume:
            name: haos-disk
---
# EN | NO SERVICE. There was one, publishing NodePorts, and it stopped
# EN | meaning anything the moment the VM left the pod network for the
# EN | bridge: a Service selects the virt-launcher pod, and the VM no
# EN | longer has an interface on that pod's network. It answered nothing
# EN | while looking perfectly configured, which is worse than absent.
# EN | The appliance is reached at its own LAN address, like the production
# EN | one: http://192.168.1.200:8123, ssh on 22222 once the Terminal & SSH
# EN | add-on is installed.
# FR | PAS DE SERVICE. Il y en avait un, publiant des NodePorts, et il a
# FR | cesse de signifier quoi que ce soit des que la VM a quitte le reseau
# FR | des pods pour le pont : un Service selectionne le pod virt-launcher,
# FR | et la VM n'a plus d'interface sur le reseau de ce pod. Il ne
# FR | repondait rien tout en paraissant parfaitement configure, ce qui est
# FR | pire qu'absent.
# FR | L'appareil se joint a sa propre adresse LAN, comme celui de
# FR | production : http://192.168.1.200:8123, ssh sur 22222 une fois
# FR | l'add-on Terminal & SSH installe.

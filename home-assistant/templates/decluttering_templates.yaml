########################################################################
# Visio Sapiens — Decluttering-card Templates
#
# EN | Included from every dashboard via:
# FR | Inclus depuis chaque dashboard via :
#   decluttering_templates: !include templates/decluttering_templates.yaml
#
# EN | Like button_card_templates.yaml, this file is NOT a Jinja template:
# EN | Home Assistant reads it as-is through !include, so t('key') does not
# EN | work here. Any displayed text must be passed in by the caller through
# EN | a [[variable]], already translated by the generated dashboard.
# FR | Comme button_card_templates.yaml, ce fichier n'est PAS un template
# FR | Jinja : Home Assistant le lit tel quel via !include, donc t('cle') n'y
# FR | fonctionne pas. Tout texte affiche doit etre fourni par l'appelant via
# FR | une [[variable]], deja traduit par le dashboard genere.
########################################################################

# ---------------------------------------------------------------------
# vssp_gauge
#
# EN | Neon radial gauge built on apexcharts-card. One template, N reuses,
# EN | so adding or removing a metric (Storage, Network...) is a one-line
# EN | change instead of a copied block.
# FR | Jauge radiale neon basee sur apexcharts-card. Un template, N
# FR | reutilisations : ajouter ou retirer une metrique (Storage, Network...)
# FR | est un changement d'une ligne au lieu d'un bloc recopie.
#
# EN | `name` is displayed, so pass it already translated — from the
# EN | generated dashboard, that means t('...'), never a hardcoded string.
# FR | `name` est affiche : le passer deja traduit — depuis le dashboard
# FR | genere, cela veut dire t('...'), jamais une chaine en dur.
#
# EN | USAGE / FR | UTILISATION
#   type: custom:decluttering-card
#   template: vssp_gauge
#   variables:
#     - entity: sensor.192_168_1_11_cpu_load
#     - name: CPU
#     - color: "#00E5FF"
#     - max: 100
# ---------------------------------------------------------------------
vssp_gauge:
  default:
    - color: "#00E5FF"
    - max: 100
  card:
    type: custom:apexcharts-card
    card_mod:
      style: |
        ha-card { background: transparent !important; box-shadow: none !important; border: none !important; }
    header:
      show: false
    chart_type: radialBar
    apex_config:
      chart:
        height: 140
      plotOptions:
        radialBar:
          hollow:
            size: 55%
          dataLabels:
            value:
              fontSize: 20px
              color: "#FFFFFF"
              formatter: |
                EVAL:function(v){ return Math.round(v) + '%'; }
            name:
              show: false
      colors:
        - '[[color]]'
    series:
      - entity: '[[entity]]'
        name: '[[name]]'
        max: '[[max]]'

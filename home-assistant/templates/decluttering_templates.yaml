########################################################################
# Visio Sapiens — Decluttering-card Templates
#
# EN | Included from every dashboard via:
# FR | Inclus depuis chaque dashboard via :
#   decluttering_templates: !include templates/decluttering_templates.yaml
#
# EN | Like button_card_templates.yaml, this file is NOT a Jinja template:
# EN | Home Assistant reads it as-is through !include, so t('key') does not
# EN | work here. Any displayed text must be passed in by the caller through
# EN | a [[variable]], already translated by the generated dashboard.
# FR | Comme button_card_templates.yaml, ce fichier n'est PAS un template
# FR | Jinja : Home Assistant le lit tel quel via !include, donc t('cle') n'y
# FR | fonctionne pas. Tout texte affiche doit etre fourni par l'appelant via
# FR | une [[variable]], deja traduit par le dashboard genere.
########################################################################

# ---------------------------------------------------------------------
# vssp_gauge
#
# EN | Neon radial gauge built on apexcharts-card. One template, N reuses,
# EN | so adding or removing a metric (Storage, Network...) is a one-line
# EN | change instead of a copied block.
# FR | Jauge radiale neon basee sur apexcharts-card. Un template, N
# FR | reutilisations : ajouter ou retirer une metrique (Storage, Network...)
# FR | est un changement d'une ligne au lieu d'un bloc recopie.
#
# EN | `name` is displayed, so pass it already translated — from the
# EN | generated dashboard, that means t('...'), never a hardcoded string.
# FR | `name` est affiche : le passer deja traduit — depuis le dashboard
# FR | genere, cela veut dire t('...'), jamais une chaine en dur.
#
# EN | USAGE / FR | UTILISATION
#   type: custom:decluttering-card
#   template: vssp_gauge
#   variables:
#     - entity: sensor.192_168_1_11_cpu_load
#     - name: CPU
#     - color: "#00E5FF"
#     - max: 100
# ---------------------------------------------------------------------
# ---------------------------------------------------------------------
# vssp_dashboard_row
#
# EN | ADMIN's "Dashboard regeneration" table, one row per system
# EN | dashboard (HOME/ENERGY/CORE), instead of the CREATE/REGENERATE/
# EN | DEACTIVATE trio of separate button-card tiles: 4 columns — icon,
# EN | dashboard name, a REFRESH icon (regenerate, only enabled once the
# EN | dashboard exists) and an ON/OFF pill (tap to create when off,
# EN | deactivate when on) — matching vssp_dashboard_row_header's 4
# EN | columns exactly (same widths) so header and rows line up as one
# EN | table. This template renders ONE row only, transparent, no
# EN | border of its own — the caller (admin.yaml.j2) wraps the header
# EN | plus all three rows together in a single
# EN | custom:vertical-stack-in-card, so the whole table shares one
# EN | frame instead of each row (or the header) getting its own.
# EN | Each control keeps its own confirmation dialog (regenerate
# EN | overwrites, deactivate removes from the nav rail) — that is
# EN | exactly why this is four button-cards glued into one row rather
# EN | than one button-card with hand-wired onclick/hass.callService in
# EN | custom_fields: raw JS calls bypass button-card's confirmation
# EN | entirely.
# FR | Tableau « Regeneration des dashboards » de l'ADMIN, une ligne par
# FR | dashboard systeme (HOME/ENERGY/CORE), au lieu du trio CREER/
# FR | REGENERER/DESACTIVER de tuiles button-card separees : 4 colonnes —
# FR | icone, nom du dashboard, une icone REFRESH (regenerer, active
# FR | seulement une fois le dashboard existant) et une pastille ON/OFF
# FR | (taper pour creer si eteinte, desactiver si allumee) — qui
# FR | correspondent exactement aux 4 colonnes de
# FR | vssp_dashboard_row_header (memes largeurs) pour que l'en-tete et
# FR | les lignes s'alignent comme un seul tableau. Ce template ne rend
# FR | qu'UNE ligne, transparente, sans bordure propre — l'appelant
# FR | (admin.yaml.j2) enveloppe l'en-tete et les trois lignes ensemble
# FR | dans un seul custom:vertical-stack-in-card, pour que tout le
# FR | tableau partage un seul cadre au lieu que chaque ligne (ou
# FR | l'en-tete) ait le sien.
# FR | Chaque controle garde sa propre boite de confirmation (regenerer
# FR | ecrase, desactiver retire du bandeau de nav) — c'est exactement
# FR | pourquoi ceci est quatre button-card colles en une ligne plutot
# FR | qu'un seul button-card avec onclick/hass.callService cable a la
# FR | main dans custom_fields : un appel JS brut contourne entierement
# FR | la confirmation de button-card.
#
# EN | USAGE / FR | UTILISATION
#   type: custom:decluttering-card
#   template: vssp_dashboard_row
#   variables:
#     - icon: mdi:view-dashboard
#     - title: HOME
#     - present_entity: binary_sensor.vssp_dashboard_home_present
#     - regenerate_service: script.vssp_regenerate_home_dashboard
#     - create_service: script.vssp_create_home_dashboard
#     - deactivate_service: script.vssp_deactivate_home_dashboard
#     - regenerate_confirm: "..."
#     - create_confirm: "..."
#     - deactivate_confirm: "..."
# ---------------------------------------------------------------------
vssp_dashboard_row:
  card:
    type: horizontal-stack
    cards:
      - type: custom:button-card
        show_name: false
        show_state: false
        show_label: false
        icon: '[[icon]]'
        tap_action:
          action: none
        styles:
          card:
            - background: transparent
            - box-shadow: none
            - border: none
            - width: 50px
            - padding: 14px 0
          icon:
            - color: >
                [[[
                  return states['[[present_entity]]'] && states['[[present_entity]]'].state === 'on'
                    ? 'var(--paper-item-icon-color, #00E5FF)' : '#56707E';
                ]]]
            - "--mdc-icon-size": 24px
      - type: custom:button-card
        show_icon: false
        show_state: false
        show_label: false
        name: '[[title]]'
        tap_action:
          action: none
        styles:
          card:
            - background: transparent
            - box-shadow: none
            - border: none
            - padding: 14px 0
            - justify-content: start
          name:
            - color: "var(--text-primary-color, #FFFFFF)"
            - font-size: 14px
            - font-weight: 700
            - letter-spacing: 1px
            - justify-self: start
            - text-align: left
      - type: custom:button-card
        show_name: false
        show_label: false
        icon: mdi:refresh
        variables:
          # EN | Free text, not an identifier — routed through
          # EN | button-card's own variables (plain YAML data) rather
          # EN | than interpolated straight into the [[[ ]]] JS source
          # EN | string below, because a confirm message containing an
          # EN | apostrophe (e.g. "...d'appareils...", ENERGY's) would
          # EN | otherwise terminate that JS string literal early and
          # EN | break the template.
          # FR | Texte libre, pas un identifiant — passe par les
          # FR | variables propres a button-card (donnee YAML normale)
          # FR | plutot qu'interpole directement dans la chaine source
          # FR | JS [[[ ]]] ci-dessous, car un message de confirmation
          # FR | contenant une apostrophe (ex. « ...d'appareils... »,
          # FR | celui d'ENERGY) terminerait sinon prematurement ce
          # FR | litteral JS et casserait le template.
          confirm_text: '[[regenerate_confirm]]'
        tap_action: >
          [[[
            return states['[[present_entity]]'] && states['[[present_entity]]'].state === 'on'
              ? { action: 'call-service', service: '[[regenerate_service]]',
                  confirmation: { text: variables.confirm_text } }
              : { action: 'none' };
          ]]]
        styles:
          card:
            - background: transparent
            - box-shadow: none
            - border: none
            - width: 52px
          icon:
            - color: >
                [[[
                  return states['[[present_entity]]'] && states['[[present_entity]]'].state === 'on'
                    ? 'var(--primary-color, #00E5FF)' : '#3A4A56';
                ]]]
            - "--mdc-icon-size": 22px
      - type: custom:button-card
        show_name: false
        show_label: false
        icon: >
          [[[
            return states['[[present_entity]]'] && states['[[present_entity]]'].state === 'on'
              ? 'mdi:toggle-switch' : 'mdi:toggle-switch-off-outline';
          ]]]
        variables:
          # EN | Same reasoning as the refresh button above — free text
          # EN | through variables, never straight into the JS source.
          # FR | Meme raisonnement que le bouton refresh ci-dessus —
          # FR | texte libre via variables, jamais directement dans la
          # FR | source JS.
          deactivate_confirm_text: '[[deactivate_confirm]]'
          create_confirm_text: '[[create_confirm]]'
        tap_action: >
          [[[
            return states['[[present_entity]]'] && states['[[present_entity]]'].state === 'on'
              ? { action: 'call-service', service: '[[deactivate_service]]',
                  confirmation: { text: variables.deactivate_confirm_text } }
              : { action: 'call-service', service: '[[create_service]]',
                  confirmation: { text: variables.create_confirm_text } };
          ]]]
        styles:
          card:
            - background: transparent
            - box-shadow: none
            - border: none
            - width: 52px
          icon:
            - color: >
                [[[
                  return states['[[present_entity]]'] && states['[[present_entity]]'].state === 'on'
                    ? '#00FFC3' : '#8FB6C9';
                ]]]
            - "--mdc-icon-size": 30px

# ---------------------------------------------------------------------
# vssp_dashboard_row_header
#
# EN | Column headers for the vssp_dashboard_row table above — same 4
# EN | column widths (50px / 1fr / 52px / 52px), so it lines up with
# EN | every row beneath it. The icon column gets no label (it is purely
# EN | decorative in the data rows too). Meant to be the first card
# EN | inside the same custom:vertical-stack-in-card as the three
# EN | vssp_dashboard_row cards, with a bottom border via card_mod to
# EN | set it apart from the data rows.
# FR | En-tetes de colonnes pour le tableau vssp_dashboard_row ci-dessus
# FR | — memes largeurs de colonnes (50px / 1fr / 52px / 52px), pour
# FR | s'aligner avec chaque ligne en dessous. La colonne icone n'a pas
# FR | d'etiquette (purement decorative dans les lignes de donnees
# FR | aussi). Prevu comme premiere carte a l'interieur du meme
# FR | custom:vertical-stack-in-card que les trois cartes
# FR | vssp_dashboard_row, avec une bordure basse via card_mod pour la
# FR | distinguer des lignes de donnees.
#
# EN | USAGE / FR | UTILISATION
#   type: custom:decluttering-card
#   template: vssp_dashboard_row_header
#   variables:
#     - col_dashboard: "Dashboard"
#     - col_regenerate: "Regenerate"
#     - col_active: "Active"
# ---------------------------------------------------------------------
vssp_dashboard_row_header:
  card:
    type: horizontal-stack
    card_mod:
      style: |
        :host { border-bottom: 1px solid rgba(0,229,255,0.18); }
    cards:
      - type: custom:button-card
        show_icon: false
        show_state: false
        show_label: false
        name: " "
        tap_action:
          action: none
        styles:
          card:
            - background: transparent
            - box-shadow: none
            - border: none
            - width: 50px
            - padding: 8px 0
      - type: custom:button-card
        show_icon: false
        show_state: false
        show_label: false
        name: '[[col_dashboard]]'
        tap_action:
          action: none
        styles:
          card:
            - background: transparent
            - box-shadow: none
            - border: none
            - padding: 8px 0
            - justify-content: start
          name:
            - color: "var(--secondary-text-color, #8FB6C9)"
            - font-size: 10px
            - font-weight: 700
            - letter-spacing: 1px
            - text-transform: uppercase
            - justify-self: start
            - text-align: left
      - type: custom:button-card
        show_icon: false
        show_state: false
        show_label: false
        name: '[[col_regenerate]]'
        tap_action:
          action: none
        styles:
          card:
            - background: transparent
            - box-shadow: none
            - border: none
            - width: 52px
            - padding: 8px 0
          name:
            - color: "var(--secondary-text-color, #8FB6C9)"
            - font-size: 9px
            - font-weight: 700
            - letter-spacing: .5px
            - text-transform: uppercase
            - text-align: center
            - white-space: normal
      - type: custom:button-card
        show_icon: false
        show_state: false
        show_label: false
        name: '[[col_active]]'
        tap_action:
          action: none
        styles:
          card:
            - background: transparent
            - box-shadow: none
            - border: none
            - width: 52px
            - padding: 8px 0
          name:
            - color: "var(--secondary-text-color, #8FB6C9)"
            - font-size: 9px
            - font-weight: 700
            - letter-spacing: .5px
            - text-transform: uppercase
            - text-align: center
            - white-space: normal

vssp_gauge:
  default:
    - color: "#00E5FF"
    - max: 100
  card:
    type: custom:apexcharts-card
    card_mod:
      style: |
        ha-card { background: transparent !important; box-shadow: none !important; border: none !important; }
    header:
      show: false
    chart_type: radialBar
    apex_config:
      chart:
        height: 140
      plotOptions:
        radialBar:
          hollow:
            size: 55%
          dataLabels:
            value:
              fontSize: 20px
              color: "#FFFFFF"
              formatter: |
                EVAL:function(v){ return Math.round(v) + '%'; }
            name:
              show: false
      colors:
        - '[[color]]'
    series:
      - entity: '[[entity]]'
        name: '[[name]]'
        max: '[[max]]'

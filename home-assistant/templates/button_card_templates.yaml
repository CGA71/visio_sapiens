########################################################################
# OSVision V2 — Button-Card Templates Library
# Included from every dashboard via:
#   button_card_templates: !include templates/button_card_templates.yaml
########################################################################

# ---------------------------------------------------------------------
# Base glass panel — generic container, no icon/name shown by default
# ---------------------------------------------------------------------
osvision_panel:
  show_icon: false
  show_name: false
  styles:
    card:
      - background: rgba(8,18,28,0.75)
      - border-radius: 20px
      - border: 1px solid rgba(0,229,255,0.35)
      - backdrop-filter: blur(12px)
      - box-shadow: 0 0 18px rgba(0,229,255,.18)
      - padding: 18px

# ---------------------------------------------------------------------
# Section title (used for HOME / ROOMS / SYSTEM headers)
# ---------------------------------------------------------------------
osvision_title:
  show_icon: false
  styles:
    card:
      - background: transparent
      - box-shadow: none
      - border: none
    name:
      - color: "#00E5FF"
      - font-size: 26px
      - font-weight: 700
      - letter-spacing: 3px
      - font-family: "Orbitron, sans-serif"
      - justify-self: start
      - padding-left: 4px

# ---------------------------------------------------------------------
# KPI / metric tile (label + big value), used when a numeric value
# doesn't need a full apexcharts radial gauge
# ---------------------------------------------------------------------
osvision_metric:
  show_icon: false
  styles:
    card:
      - background: rgba(0,0,0,.25)
      - border-radius: 18px
      - border: 1px solid rgba(0,229,255,.25)
      - padding: 10px
    name:
      - color: "#8FB6C9"
      - font-size: 12px
      - letter-spacing: 2px
    state:
      - color: white
      - font-size: 30px
      - font-weight: bold

# ---------------------------------------------------------------------
# Navigation bar button (HOME / ROOMS / SYSTEM / ENERGY)
# Variable `active` (true/false) must be passed per-instance:
#   template: osvision_nav_button
#   variables:
#     active: true
# ---------------------------------------------------------------------
osvision_nav_button:
  show_state: false
  styles:
    card:
      - class: '[[[ return "osv-nav-button" + (variables.active ? " active" : "") ]]]'
      - background: '[[[ return variables.active ? "rgba(0,229,255,0.14)" : "rgba(8,18,28,0.6)" ]]]'
      - border-radius: 14px
      - border: 1px solid rgba(0,229,255,0.25)
      - padding: 10px
      - transition: all .2s ease
    icon:
      - color: '[[[ return variables.active ? "#00E5FF" : "#8FB6C9" ]]]'
    name:
      - color: '[[[ return variables.active ? "#00E5FF" : "#8FB6C9" ]]]'
      - font-size: 12px

# ---------------------------------------------------------------------
# Quick action button (scenes, scripts, toggles)
# ---------------------------------------------------------------------
osvision_quick_action:
  show_state: false
  styles:
    card:
      - class: osv-quick-action
      - background: rgba(8,18,28,0.72)
      - border-radius: 16px
      - border: 1px solid rgba(0,229,255,0.22)
      - padding: 14px
    icon:
      - color: "#00E5FF"
      - "--mdc-icon-size": 26px
    name:
      - color: "#B8E8F5"
      - font-size: 12px
      - letter-spacing: 1px

# ---------------------------------------------------------------------
# Alert banner. Pass a `level` variable: "critical" | "info" | "ok"
# ---------------------------------------------------------------------
osvision_alert:
  show_icon: true
  styles:
    card:
      - class: >
          [[[
            if (variables.level === 'critical') return 'osv-alert';
            if (variables.level === 'info') return 'osv-alert info';
            return 'osv-alert ok';
          ]]]
      - text-align: left
      - justify-items: start
    icon:
      - color: >
          [[[
            if (variables.level === 'critical') return '#FF3D71';
            if (variables.level === 'info') return '#3AA7FF';
            return '#00FFC3';
          ]]]
    name:
      - color: "#FFFFFF"
      - font-size: 13px
      - justify-self: start

# ---------------------------------------------------------------------
# Room card (used later for the ROOMS view — one tile per room)
# ---------------------------------------------------------------------
osvision_room_card:
  show_state: false
  styles:
    card:
      - background: rgba(10,20,32,0.68)
      - border-radius: 20px
      - border: 1px solid rgba(0,229,255,0.20)
      - height: 110px
      - transition: transform .2s ease, box-shadow .2s ease
    icon:
      - color: "#00E5FF"
      - "--mdc-icon-size": 30px
    name:
      - color: "#FFFFFF"
      - font-size: 14px
      - letter-spacing: 1px

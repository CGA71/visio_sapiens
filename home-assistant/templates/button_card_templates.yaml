########################################################################
# Visio Sapiens — Button-Card Templates Library
# Included from every dashboard via:
#   button_card_templates: !include templates/button_card_templates.yaml
########################################################################

# ---------------------------------------------------------------------
# Base glass panel — generic container, no icon/name shown by default
# ---------------------------------------------------------------------
vssp_panel:
  show_icon: false
  show_name: false
  styles:
    card:
      - background: rgba(8,18,28,0.75)
      - border-radius: 20px
      - border: 1px solid rgba(0,229,255,0.35)
      - backdrop-filter: blur(12px)
      - box-shadow: 0 0 18px rgba(0,229,255,.18)
      - padding: 18px

# ---------------------------------------------------------------------
# Section title (used for HOME / ROOMS / SYSTEM headers)
# ---------------------------------------------------------------------
vssp_title:
  show_icon: false
  styles:
    card:
      - background: transparent
      - box-shadow: none
      - border: none
    name:
      - color: "#00E5FF"
      - font-size: 26px
      - font-weight: 700
      - letter-spacing: 3px
      - font-family: "Orbitron, sans-serif"
      - justify-self: start
      - padding-left: 4px

# ---------------------------------------------------------------------
# KPI / metric tile (label + big value), used when a numeric value
# doesn't need a full apexcharts radial gauge
# ---------------------------------------------------------------------
vssp_metric:
  show_icon: false
  styles:
    card:
      - background: rgba(0,0,0,.25)
      - border-radius: 18px
      - border: 1px solid rgba(0,229,255,.25)
      - padding: 10px
    icon:
      - color: "#00E5FF"
      - "--mdc-icon-size": 20px
    name:
      - color: "#8FB6C9"
      - font-size: 12px
      - letter-spacing: 2px
    state:
      - color: white
      - font-size: 30px
      - font-weight: bold

# ---------------------------------------------------------------------
# HUD header — page title cell (chevron-back + title + description)
#   template: vssp_page_header
#   icon: mdi:chevron-left
#   name: HOME
#   label: "Vue d'ensemble de votre système"
# ---------------------------------------------------------------------
vssp_page_header:
  show_state: false
  show_label: true
  styles:
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: 26px 1fr
      - grid-template-rows: min-content min-content
      - column-gap: 12px
      - justify-items: start
      - align-items: center
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - padding: 6px 10px
      - justify-content: start
    icon:
      - color: "#8FB6C9"
      - "--mdc-icon-size": 24px
    name:
      - color: "#FFFFFF"
      - font-size: 20px
      - font-weight: 700
      - letter-spacing: 1px
      - justify-self: start
      - font-family: "Orbitron, sans-serif"
    label:
      - color: "#8FB6C9"
      - font-size: 12px
      - justify-self: start

# ---------------------------------------------------------------------
# HUD header — alarm status cell (SKELETON: bind `entity` to your
# alarm_control_panel.* once it's decided; icon/color/label react to
# entity.state automatically: disarmed / armed_home / armed_away /
# arming / pending / triggered / unavailable).
#   template: vssp_alarm_status
#   entity: alarm_control_panel.maison
#   name: MAISON
# ---------------------------------------------------------------------
vssp_alarm_status:
  show_state: false
  show_label: true
  icon: >
    [[[
      if (!entity) return "mdi:shield-off-outline";
      switch (entity.state) {
        case "disarmed": return "mdi:shield-check";
        case "triggered": return "mdi:shield-alert";
        case "arming":
        case "pending": return "mdi:shield-sync";
        case "unavailable": return "mdi:shield-off-outline";
        default: return "mdi:shield-lock"; // armed_home / armed_away / armed_night / armed_vacation
      }
    ]]]
  label: >
    [[[
      if (!entity) return "Entité non configurée";
      switch (entity.state) {
        case "disarmed": return "Désarmée";
        case "triggered": return "DÉCLENCHÉE";
        case "armed_home": return "Armée — Maison";
        case "armed_away": return "Armée — Absence";
        case "armed_night": return "Armée — Nuit";
        case "armed_vacation": return "Armée — Vacances";
        case "arming": return "Activation…";
        case "pending": return "Alerte en attente";
        case "unavailable": return "Indisponible";
        default: return entity.state;
      }
    ]]]
  styles:
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: 26px 1fr
      - grid-template-rows: min-content min-content
      - column-gap: 12px
      - justify-items: start
      - align-items: center
    card:
      - background: rgba(0,0,0,.25)
      - border-radius: 18px
      - border: 1px solid rgba(0,229,255,.25)
      - padding: 10px 14px
      - height: 100%
    icon:
      - color: >
          [[[
            if (!entity) return "#56707E";
            if (entity.state === "disarmed") return "#00FFC3";
            if (entity.state === "triggered") return "#FF3D71";
            if (["arming","pending"].includes(entity.state)) return "#FF9800";
            return "#00E5FF";
          ]]]
      - "--mdc-icon-size": 22px
    name:
      - color: "#FFFFFF"
      - font-size: 13px
      - font-weight: 700
      - letter-spacing: 1px
      - justify-self: start
    label:
      - color: "#8FB6C9"
      - font-size: 11px
      - justify-self: start

# ---------------------------------------------------------------------
# HUD header — circular "OS" avatar / logo (right end of the header bar)
#   template: vssp_os_avatar
#   name: "OS"
# ---------------------------------------------------------------------
vssp_os_avatar:
  show_state: false
  show_icon: false
  styles:
    card:
      - width: 46px
      - height: 46px
      - min-width: 46px
      - border-radius: 50%
      - background: "radial-gradient(circle at 30% 30%, rgba(0,229,255,0.40), rgba(176,132,255,0.30) 55%, rgba(8,18,28,0.92) 100%)"
      - border: 1px solid rgba(0,229,255,0.45)
      - box-shadow: 0 0 14px rgba(0,229,255,.35)
      - display: flex
      - align-items: center
      - justify-content: center
      - padding: 0
      - margin: 0 auto
    name:
      - color: "#FFFFFF"
      - font-size: 13px
      - font-weight: 700
      - letter-spacing: 1px
      - justify-self: center

# ---------------------------------------------------------------------
# Sidebar logo/brand block — top of the vertical nav (osv-sidebar).
# Non interactive, purely decorative.
#   template: vssp_sidebar_logo
#   icon: mdi:hexagon-outline
#   name: "vssp V2"
#   label: "Smart Home OS"
# ---------------------------------------------------------------------
vssp_sidebar_logo:
  show_state: false
  show_label: true
  styles:
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: 34px 1fr
      - grid-template-rows: min-content min-content
      - column-gap: 12px
      - row-gap: 2px
      - justify-items: start
      - align-items: center
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - border-bottom: 1px solid rgba(0,229,255,0.15)
      - border-radius: 0
      - padding: 2px 8px 16px 8px
      - margin-bottom: 10px
      - cursor: default
      - pointer-events: none
    icon:
      - color: "#00E5FF"
      - "--mdc-icon-size": 30px
      - filter: drop-shadow(0 0 6px rgba(0,229,255,.5))
    name:
      - color: "#FFFFFF"
      - font-size: 16px
      - font-weight: 700
      - letter-spacing: 2px
      - font-family: "Orbitron, sans-serif"
      - justify-self: start
    label:
      - color: "#56707E"
      - font-size: 10px
      - letter-spacing: 1px
      - justify-self: start

# ---------------------------------------------------------------------
# Sidebar navigation item (HOME / CORE / ROOMS / SYSTEM / ENERGY...)
# Vertical layout: icon left, title + subtitle stacked right.
# Variables `active` (true/false) must be passed per-instance:
#   template: vssp_nav_button
#   icon: mdi:view-dashboard
#   name: HOME
#   label: "Vue d'ensemble"
#   variables:
#     active: true
# ---------------------------------------------------------------------
vssp_nav_button:
  show_state: false
  show_label: true
  card_mod:
    style: |
      ha-card:hover {
        background: rgba(0,229,255,0.25) !important;
        border: 1px solid rgba(0,229,255,0.65) !important;
        box-shadow: 0 0 18px rgba(0,229,255,.35) !important;
      }
  styles:
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: 28px 1fr
      - grid-template-rows: min-content min-content
      - column-gap: 12px
      - row-gap: 2px
      - justify-items: start
      - align-items: center
    card:
      - background: transparent
      - border-radius: 12px
      - border: 1px solid transparent
      - padding: 10px 12px
      - margin-bottom: 4px
      - width: 100%
      - justify-self: stretch
      - text-align: left
      - transition: all .45s cubic-bezier(.4,0,.2,1)
    icon:
      - color: "#8FB6C9"
      - "--mdc-icon-size": 20px
      - align-self: start
      - margin-top: 2px
    name:
      - color: "#FFFFFF"
      - font-size: 13px
      - font-weight: 600
      - letter-spacing: 0.5px
      - justify-self: start
    label:
      - color: "#56707E"
      - font-size: 10px
      - justify-self: start

# ---------------------------------------------------------------------
# Sidebar bottom branding block — placed as the LAST card of the nav
# vertical-stack, pushed to the bottom of the sidebar (margin-top: auto).
# Purely decorative, non interactive.
#   template: vssp_sidebar_brand_footer
#   icon: mdi:hexagon-outline
#   name: "vssp V2"
#   label: "SMART HOME OS"
# ---------------------------------------------------------------------
vssp_sidebar_brand_footer:
  show_state: false
  show_label: true
  styles:
    grid:
      - grid-template-areas: '"i" "n" "l"'
      - grid-template-rows: min-content min-content min-content
      - justify-items: center
      - row-gap: 4px
    card:
      - class: osv-sidebar-brand glow
      - background: transparent
      - box-shadow: none
      - border: none
      - border-top: 1px solid rgba(0,229,255,0.15)
      - border-radius: 0
      - padding: 18px 8px 6px 8px
      - margin-top: auto
      - cursor: default
      - pointer-events: none
      - text-align: center
    icon:
      - color: "#00E5FF"
      - "--mdc-icon-size": 34px
      - filter: drop-shadow(0 0 10px rgba(0,229,255,.6))
    name:
      - color: "#00E5FF"
      - font-size: 14px
      - font-weight: 700
      - letter-spacing: 2px
      - font-family: "Orbitron, sans-serif"
      - justify-self: center
      - text-shadow: 0 0 10px rgba(0,229,255,.5)
    label:
      - color: "#56707E"
      - font-size: 9px
      - letter-spacing: 2px
      - justify-self: center

# ---------------------------------------------------------------------
# Security panel — central glowing badge (icon reacts to alarm entity).
#   template: vssp_security_badge
#   entity: alarm_control_panel.maison
# ---------------------------------------------------------------------
vssp_security_badge:
  show_name: false
  show_state: false
  icon: >
    [[[
      if (!entity) return "mdi:shield-off-outline";
      switch (entity.state) {
        case "disarmed": return "mdi:shield-check";
        case "triggered": return "mdi:shield-alert";
        case "arming":
        case "pending": return "mdi:shield-sync";
        case "unavailable": return "mdi:shield-off-outline";
        default: return "mdi:shield-lock";
      }
    ]]]
  styles:
    card:
      - width: 84px
      - height: 84px
      - border-radius: 50%
      - margin: 8px auto 14px auto
      - display: flex
      - align-items: center
      - justify-content: center
      - background: >
          [[[
            if (!entity || entity.state === "disarmed") return "radial-gradient(circle at 35% 30%, rgba(0,255,195,0.35), rgba(8,18,28,0.9) 75%)";
            if (entity.state === "triggered") return "radial-gradient(circle at 35% 30%, rgba(255,61,113,0.40), rgba(8,18,28,0.9) 75%)";
            return "radial-gradient(circle at 35% 30%, rgba(0,229,255,0.35), rgba(8,18,28,0.9) 75%)";
          ]]]
      - border: >
          [[[
            if (!entity || entity.state === "disarmed") return "1px solid rgba(0,255,195,0.5)";
            if (entity.state === "triggered") return "1px solid rgba(255,61,113,0.5)";
            return "1px solid rgba(0,229,255,0.5)";
          ]]]
      - box-shadow: >
          [[[
            if (!entity || entity.state === "disarmed") return "0 0 22px rgba(0,255,195,.35)";
            if (entity.state === "triggered") return "0 0 22px rgba(255,61,113,.45)";
            return "0 0 22px rgba(0,229,255,.35)";
          ]]]
    icon:
      - color: >
          [[[
            if (!entity || entity.state === "disarmed") return "#00FFC3";
            if (entity.state === "triggered") return "#FF3D71";
            return "#00E5FF";
          ]]]
      - "--mdc-icon-size": 34px

# ---------------------------------------------------------------------
# Security panel — one status row (icon + label + dynamic state text).
# Works with any entity domain (binary_sensor on/off, alarm_control_panel...).
#   template: vssp_security_row
#   icon: mdi:door
#   name: "Portes & Fenêtres"
#   entity: binary_sensor.doors_windows
# ---------------------------------------------------------------------
vssp_security_row:
  show_state: false
  show_label: true
  label: >
    [[[
      if (!entity) return "Non configuré";
      switch (entity.state) {
        case "on": return "Actif";
        case "off": return "Inactif";
        case "unavailable": return "Indisponible";
        case "disarmed": return "Désarmée";
        case "armed_home": return "Armée — Maison";
        case "armed_away": return "Armée — Absence";
        case "triggered": return "Déclenchée";
        default: return entity.state;
      }
    ]]]
  styles:
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: 26px 1fr
      - grid-template-rows: min-content min-content
      - column-gap: 12px
      - justify-items: start
      - align-items: center
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - border-bottom: 1px solid rgba(0,229,255,0.10)
      - border-radius: 0
      - padding: 8px 4px
      - cursor: default
      - pointer-events: none
    icon:
      - color: >
          [[[
            if (!entity) return "#56707E";
            if (["on","triggered"].includes(entity.state)) return "#00E5FF";
            return "#8FB6C9";
          ]]]
      - "--mdc-icon-size": 20px
    name:
      - color: "#FFFFFF"
      - font-size: 13px
      - font-weight: 600
      - justify-self: start
    label:
      - color: "#8FB6C9"
      - font-size: 11px
      - justify-self: start

# ---------------------------------------------------------------------
# Admin panel button (Discovery / Upgrade / Delete). Pass `danger: true`
# for destructive actions (red theme instead of cyan).
#   template: vssp_admin_button
#   icon: mdi:magnify-scan
#   name: DISCOVERY
#   label: "Rechercher les nouvelles entités"
#   variables:
#     danger: false
# ---------------------------------------------------------------------
vssp_admin_button:
  show_state: false
  show_label: true
  variables:
    danger: false
  styles:
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: 30px 1fr
      - grid-template-rows: min-content min-content
      - column-gap: 12px
      - justify-items: start
      - align-items: center
    card:
      - background: rgba(8,18,28,0.72)
      - border-radius: 16px
      - border: >
          [[[ return variables.danger ? "1px solid rgba(255,61,113,0.45)" : "1px solid rgba(0,229,255,0.25)" ]]]
      - padding: 16px
      - transition: all .2s ease
    icon:
      - color: '[[[ return variables.danger ? "#FF3D71" : "#00E5FF" ]]]'
      - "--mdc-icon-size": 26px
    name:
      - color: "#FFFFFF"
      - font-size: 14px
      - font-weight: 700
      - letter-spacing: 1px
      - justify-self: start
    label:
      - color: "#8FB6C9"
      - font-size: 11px
      - justify-self: start

# ---------------------------------------------------------------------
# KPI card (Pièces actives / Alarme / Connexions...) — icône + titre +
# valeur colorée + sous-titre. Variables optionnelles :
#   variables:
#     value_color: "#3AA7FF"
#     icon_color: "#3AA7FF"
#   template: vssp_kpi_card
#   icon: mdi:door-open
#   name: PIÈCES ACTIVES
#   state: 3 / 10   (peut aussi venir d'une entité via `entity:`)
#   label: "En activité"
# ---------------------------------------------------------------------
vssp_kpi_card:
  show_state: true
  show_label: true
  styles:
    grid:
      - grid-template-areas: '"i n" "i s" "i l"'
      - grid-template-columns: 36px 1fr
      - grid-template-rows: min-content min-content min-content
      - column-gap: 14px
      - row-gap: 2px
      - justify-items: start
      - align-items: start
    card:
      - background: rgba(8,18,28,0.72)
      - border-radius: 18px
      - border: 1px solid rgba(0,229,255,0.20)
      - padding: 14px 18px
      - height: 100%
    icon:
      - color: '[[[ return variables.icon_color || "#00E5FF" ]]]'
      - "--mdc-icon-size": 26px
      - margin-top: 2px
    name:
      - color: "#FFFFFF"
      - font-size: 13px
      - font-weight: 700
      - letter-spacing: 0.5px
      - justify-self: start
    state:
      - color: '[[[ return variables.value_color || "#FFFFFF" ]]]'
      - font-size: 16px
      - font-weight: 700
      - justify-self: start
    label:
      - color: "#56707E"
      - font-size: 11px
      - justify-self: start

# ---------------------------------------------------------------------
# Status indicator card (System Status / Energy Status) — titre + voyant
# rond coloré + sous-titre. Voyant vert par defaut ; passe au rouge si
# l'entite liee (optionnelle) est dans un etat considere anormal.
#   template: vssp_status_indicator
#   name: SYSTEM STATUS
#   label: "Statut métriques CORE"
#   entity: binary_sensor.vssp_core_health   # optionnel, squelette
# ---------------------------------------------------------------------
vssp_status_indicator:
  show_state: false
  show_label: true
  icon: mdi:circle
  styles:
    grid:
      - grid-template-areas: '"n" "i" "l"'
      - grid-template-rows: min-content min-content min-content
      - row-gap: 10px
      - justify-items: start
    card:
      - background: rgba(8,18,28,0.72)
      - border-radius: 18px
      - border: 1px solid rgba(0,229,255,0.20)
      - padding: 14px 18px
      - height: 100%
    name:
      - color: "#FFFFFF"
      - font-size: 13px
      - font-weight: 700
      - letter-spacing: 0.5px
      - justify-self: start
    icon:
      - color: >
          [[[
            if (!entity) return "#00FFC3";
            return ["on","home","ok","true","problem_free"].includes(entity.state) ? "#00FFC3" : "#FF3D71";
          ]]]
      - "--mdc-icon-size": 20px
      - justify-self: start
      - filter: >
          [[[
            if (!entity || ["on","home","ok","true","problem_free"].includes(entity.state))
              return "drop-shadow(0 0 8px rgba(0,255,195,.6))";
            return "drop-shadow(0 0 8px rgba(255,61,113,.6))";
          ]]]
    label:
      - color: "#56707E"
      - font-size: 11px
      - justify-self: start

# ---------------------------------------------------------------------
# Quick action button (scenes, scripts, toggles)
# ---------------------------------------------------------------------
vssp_quick_action:
  show_state: false
  styles:
    card:
      - class: osv-quick-action
      - background: rgba(8,18,28,0.72)
      - border-radius: 16px
      - border: 1px solid rgba(0,229,255,0.22)
      - padding: 14px
    icon:
      - color: "#00E5FF"
      - "--mdc-icon-size": 26px
    name:
      - color: "#B8E8F5"
      - font-size: 12px
      - letter-spacing: 1px

# ---------------------------------------------------------------------
# Alert banner. Pass a `level` variable: "critical" | "info" | "ok"
# ---------------------------------------------------------------------
vssp_alert:
  show_icon: true
  styles:
    card:
      - class: >
          [[[
            if (variables.level === 'critical') return 'osv-alert';
            if (variables.level === 'info') return 'osv-alert info';
            return 'osv-alert ok';
          ]]]
      - text-align: left
      - justify-items: start
    icon:
      - color: >
          [[[
            if (variables.level === 'critical') return '#FF3D71';
            if (variables.level === 'info') return '#3AA7FF';
            return '#00FFC3';
          ]]]
    name:
      - color: "#FFFFFF"
      - font-size: 13px
      - justify-self: start

# ---------------------------------------------------------------------
# Room card (used later for the ROOMS view — one tile per room)
# ---------------------------------------------------------------------
vssp_room_card:
  show_state: false
  styles:
    card:
      - background: rgba(10,20,32,0.68)
      - border-radius: 20px
      - border: 1px solid rgba(0,229,255,0.20)
      - height: 110px
      - transition: transform .2s ease, box-shadow .2s ease
    icon:
      - color: "#00E5FF"
      - "--mdc-icon-size": 30px
    name:
      - color: "#FFFFFF"
      - font-size: 14px
      - letter-spacing: 1px

########################################################################
# Visio Sapiens — Templates ENERGY
#
# ⚠️  CE FICHIER N'EST PAS UN FICHIER À PART.
#     Son contenu doit être AJOUTÉ À LA FIN de :
#         home-assistant/templates/button_card_templates.yaml
#
#     Raison : Lovelace n'accepte qu'UN SEUL `button_card_templates:`
#     par dashboard. Les templates vssp_* doivent donc tous vivre
#     dans le même fichier partagé, comme pour core.yaml.
#
# Templates ajoutés :
#   vssp_section_title       Titre de panneau (« Production Solaire »)
#   vssp_energy_stat         Petit libellé + grande valeur colorée
#   vssp_energy_kpi          Tuile KPI (icône encadrée + valeur + label)
#   vssp_energy_tab          Onglet Jour / Mois / Année
#   vssp_energy_device_row   Ligne « Consommation par appareil »
#   vssp_energy_total_row    Ligne de total (pied de tableau)
#   vssp_circuit_switch      Carte circuit du tableau électrique (Shelly)
########################################################################

# ---------------------------------------------------------------------
# Titre de panneau — première ligne à l'intérieur d'un bloc verre.
#   template: vssp_section_title
#   name: "Production Solaire"
# ---------------------------------------------------------------------
vssp_section_title:
  show_icon: false
  show_state: false
  show_label: false
  styles:
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - padding: 2px 2px 10px 2px
      - justify-content: start
      - cursor: default
      - pointer-events: none
    name:
      - color: "#FFFFFF"
      - font-size: 15px
      - font-weight: 600
      - letter-spacing: 1px
      - justify-self: start
      - font-family: "Orbitron, sans-serif"

# ---------------------------------------------------------------------
# Statistique simple : libellé discret au-dessus, valeur en gros dessous.
# La couleur de la valeur est pilotée par `variables.accent`.
#   template: vssp_energy_stat
#   entity: sensor.solar_energy_today
#   label: "Aujourd'hui"
#   variables:
#     accent: "#00FFC3"
# ---------------------------------------------------------------------
vssp_energy_stat:
  show_icon: false
  show_name: false
  show_state: true
  show_label: true
  variables:
    accent: "#00FFC3"
    size: "20px"
  styles:
    grid:
      - grid-template-areas: '"l" "s"'
      - grid-template-rows: min-content min-content
      - row-gap: 3px
      - justify-items: start
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - padding: 4px 2px
      - cursor: default
      - pointer-events: none
    label:
      - color: "#8FB6C9"
      - font-size: 11px
      - letter-spacing: 0.5px
      - justify-self: start
    state:
      - color: "[[[ return variables.accent ]]]"
      - font-size: "[[[ return variables.size ]]]"
      - font-weight: 700
      - justify-self: start

# ---------------------------------------------------------------------
# Tuile KPI : icône dans un carré arrondi à gauche, valeur + label à droite.
#   template: vssp_energy_kpi
#   entity: sensor.home_energy_today
#   icon: mdi:chart-bar
#   label: "Aujourd'hui"
#   variables:
#     accent: "#00E5FF"
# ---------------------------------------------------------------------
vssp_energy_kpi:
  show_icon: true
  show_name: false
  show_state: true
  show_label: true
  variables:
    accent: "#00E5FF"
  styles:
    grid:
      - grid-template-areas: '"i s" "i l"'
      - grid-template-columns: 54px 1fr
      - grid-template-rows: min-content min-content
      - column-gap: 14px
      - justify-items: start
      - align-items: center
    card:
      - background: rgba(0,0,0,.25)
      - border-radius: 16px
      - border: 1px solid rgba(0,229,255,.16)
      - padding: 14px 16px
      - cursor: default
      - pointer-events: none
    img_cell:
      - background: "[[[ return variables.accent + '1F' ]]]"
      - border-radius: 14px
      - width: 46px
      - height: 46px
      - justify-self: start
    icon:
      - color: "[[[ return variables.accent ]]]"
      - "--mdc-icon-size": 24px
    state:
      - color: "#FFFFFF"
      - font-size: 22px
      - font-weight: 700
      - justify-self: start
    label:
      - color: "[[[ return variables.accent ]]]"
      - font-size: 12px
      - justify-self: start

# ---------------------------------------------------------------------
# Onglet de période (Jour / Mois / Année). L'état actif est déduit de
# `entity` (un input_select) comparé à `variables.period`.
# Le tap_action est déclaré CÔTÉ CARTE (dans energy.yaml), pas ici.
#   template: vssp_energy_tab
#   entity: input_select.vssp_energy_period
#   name: Jour
#   icon: mdi:weather-sunny
#   variables:
#     period: Jour
# ---------------------------------------------------------------------
vssp_energy_tab:
  show_icon: true
  show_name: true
  show_state: false
  show_label: false
  variables:
    period: Jour
  styles:
    grid:
      - grid-template-areas: '"i n"'
      - grid-template-columns: min-content min-content
      - column-gap: 6px
      - justify-items: center
      - align-items: center
    card:
      - background: >
          [[[
            return (entity && entity.state === variables.period)
              ? "rgba(0,229,255,0.22)" : "transparent";
          ]]]
      - border: >
          [[[
            return (entity && entity.state === variables.period)
              ? "1px solid rgba(0,229,255,0.55)" : "1px solid rgba(255,255,255,0.08)";
          ]]]
      - box-shadow: >
          [[[
            return (entity && entity.state === variables.period)
              ? "0 0 12px rgba(0,229,255,.28)" : "none";
          ]]]
      - border-radius: 10px
      - padding: 7px 12px
      - transition: all .25s ease
    icon:
      - color: >
          [[[
            return (entity && entity.state === variables.period) ? "#FFFFFF" : "#8FB6C9";
          ]]]
      - "--mdc-icon-size": 15px
    name:
      - color: >
          [[[
            return (entity && entity.state === variables.period) ? "#FFFFFF" : "#8FB6C9";
          ]]]
      - font-size: 12px
      - font-weight: 600

# ---------------------------------------------------------------------
# Ligne « Consommation par appareil » :
#   icône | nom + modèle | pièce | puissance instantanée | énergie du jour | chevron
#
#   template: vssp_energy_device_row
#   entity: sensor.shelly_chauffe_eau_power
#   name: "Chauffe-eau"
#   icon: mdi:water-boiler
#   variables:
#     model: "Shelly 1PM"
#     room: "Local technique"                    # pièce affichée (colonne « Pièce »)
#     energy_entity: sensor.shelly_chauffe_eau_energy_today
#     detail_entity: switch.shelly_chauffe_eau   # ouvert au tap
# ---------------------------------------------------------------------
vssp_energy_device_row:
  show_icon: true
  show_name: true
  show_state: true
  show_label: true
  variables:
    model: "Shelly Plus 1PM"
    room: ""
    energy_entity: ""
    detail_entity: ""
  label: "[[[ return variables.model ]]]"
  custom_fields:
    room: >
      [[[
        if (!variables.room)
          return '<span style="color:#56707E;font-size:12px">—</span>';
        return '<span style="color:#8FB6C9;font-size:12px">' + variables.room + '</span>';
      ]]]
    energy: >
      [[[
        const e = states[variables.energy_entity];
        if (!e || isNaN(Number(e.state)))
          return '<span style="color:#56707E;font-size:13px">—</span>';
        const v = Number(e.state).toLocaleString('fr-FR', { maximumFractionDigits: 1 });
        const u = e.attributes.unit_of_measurement || 'kWh';
        return '<span style="color:#B8E8F5;font-size:13px;font-weight:600">' + v + '</span>' +
               '<span style="color:#56707E;font-size:11px"> ' + u + '</span>';
      ]]]
    arrow: >
      <ha-icon icon="mdi:chevron-right"
               style="--mdc-icon-size:16px;color:#56707E;"></ha-icon>
  styles:
    grid:
      - grid-template-areas: '"i n room s energy arrow" "i l room s energy arrow"'
      - grid-template-columns: 36px 1fr 96px 84px 84px 18px
      - grid-template-rows: min-content min-content
      - column-gap: 8px
      - justify-items: start
      - align-items: center
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - border-bottom: 1px solid rgba(0,229,255,0.08)
      - border-radius: 0
      - padding: 9px 4px
      - transition: background .2s ease
    img_cell:
      - background: rgba(0,229,255,0.10)
      - border-radius: 10px
      - width: 30px
      - height: 30px
    icon:
      - color: "#00E5FF"
      - "--mdc-icon-size": 17px
    name:
      - color: "#FFFFFF"
      - font-size: 13px
      - font-weight: 600
      - justify-self: start
    label:
      - color: "#56707E"
      - font-size: 10px
      - justify-self: start
    state:
      - color: "#B8E8F5"
      - font-size: 13px
      - font-weight: 600
      - justify-self: end
    custom_fields:
      room:
        - justify-self: end
        - text-align: right
      energy:
        - justify-self: end
      arrow:
        - justify-self: end
        - display: flex
        - align-items: center
  card_mod:
    style: |
      ha-card:hover {
        background: rgba(0,229,255,0.06) !important;
      }

# ---------------------------------------------------------------------
# Ligne de total (pied du tableau « Consommation par appareil »).
#   template: vssp_energy_total_row
#   entity: sensor.home_power_consumption
#   name: "Consommation totale actuelle"
# ---------------------------------------------------------------------
vssp_energy_total_row:
  show_icon: false
  show_name: true
  show_state: true
  show_label: false
  styles:
    grid:
      - grid-template-areas: '"n s"'
      - grid-template-columns: 1fr auto
      - justify-items: start
      - align-items: center
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - border-top: 1px solid rgba(0,229,255,0.18)
      - border-radius: 0
      - padding: 14px 4px 4px 4px
      - cursor: default
      - pointer-events: none
    name:
      - color: "#00E5FF"
      - font-size: 13px
      - font-weight: 600
      - justify-self: start
    state:
      - color: "#00E5FF"
      - font-size: 18px
      - font-weight: 700
      - justify-self: end

# ---------------------------------------------------------------------
# Carte circuit du tableau électrique (Shelly).
# Ligne 1 : icône + nom | Ligne 2 : icône + modèle | Ligne 3 : calibre + toggle
# Le tap bascule le circuit (tap_action: toggle).
#
#   template: vssp_circuit_switch
#   entity: switch.shelly_chauffe_eau
#   name: "Chauffe-eau"
#   icon: mdi:water-boiler
#   variables:
#     model: "Shelly 1PM"
#     amp: "25A"
# ---------------------------------------------------------------------
vssp_circuit_switch:
  show_icon: true
  show_name: true
  show_state: false
  show_label: true
  variables:
    model: "Shelly 1PM"
    amp: "16A"
  label: "[[[ return variables.model ]]]"
  tap_action:
    action: toggle
  hold_action:
    action: more-info
  custom_fields:
    amp: >
      [[[
        return '<span style="color:#00E5FF;font-size:14px;font-weight:700;' +
               'font-family:Orbitron,sans-serif;">' + variables.amp + '</span>';
      ]]]
    sw: >
      [[[
        const on = entity && entity.state === 'on';
        const bg   = on ? 'rgba(0,255,195,.85)' : 'rgba(255,255,255,.12)';
        const brd  = on ? 'rgba(0,255,195,.90)' : 'rgba(255,255,255,.22)';
        const glow = on ? '0 0 12px rgba(0,255,195,.45)' : 'none';
        const knob = on ? '22px' : '2px';
        return '<div style="width:44px;height:24px;border-radius:12px;background:' + bg +
               ';border:1px solid ' + brd + ';box-shadow:' + glow +
               ';position:relative;transition:all .25s ease;">' +
               '<div style="position:absolute;top:2px;left:' + knob +
               ';width:18px;height:18px;border-radius:50%;background:#FFFFFF;' +
               'transition:all .25s ease;"></div></div>';
      ]]]
  styles:
    grid:
      - grid-template-areas: '"i n" "i l" "amp sw"'
      - grid-template-columns: 34px 1fr
      - grid-template-rows: min-content min-content min-content
      - column-gap: 10px
      - row-gap: 2px
      - justify-items: start
      - align-items: center
    card:
      - background: rgba(0,0,0,.28)
      - border-radius: 16px
      - border: >
          [[[
            return (entity && entity.state === 'on')
              ? "1px solid rgba(0,255,195,0.30)" : "1px solid rgba(0,229,255,0.14)";
          ]]]
      - padding: 14px
      - transition: all .25s ease
    img_cell:
      - background: rgba(0,229,255,0.10)
      - border-radius: 10px
      - width: 30px
      - height: 30px
    icon:
      - color: >
          [[[ return (entity && entity.state === 'on') ? "#00FFC3" : "#8FB6C9"; ]]]
      - "--mdc-icon-size": 17px
    name:
      - color: "#FFFFFF"
      - font-size: 13px
      - font-weight: 600
      - justify-self: start
    label:
      - color: "#56707E"
      - font-size: 10px
      - justify-self: start
    custom_fields:
      amp:
        - justify-self: start
        - padding-top: 10px
      sw:
        - justify-self: end
        - padding-top: 10px
  card_mod:
    style: |
      ha-card:hover {
        border-color: rgba(0,229,255,0.55) !important;
        box-shadow: 0 0 18px rgba(0,229,255,.22) !important;
      }


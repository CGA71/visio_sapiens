########################################################################
# Visio Sapiens — Button-Card Templates Library
#
# EN | Included from every dashboard via:
# FR | Inclus depuis chaque dashboard via :
#   button_card_templates: !include templates/button_card_templates.yaml
#
# EN | Lovelace accepts only ONE `button_card_templates:` key per
# EN | dashboard, so every vssp_* template must live in this single shared
# EN | file. Adding a template means appending it here, never creating a
# EN | second file.
# FR | Lovelace n'accepte qu'UNE SEULE cle `button_card_templates:` par
# FR | dashboard, donc tout template vssp_* doit vivre dans ce fichier
# FR | partage unique. Ajouter un template consiste a l'ajouter ici, jamais
# FR | a creer un second fichier.
#
# EN | THIS FILE IS NOT A JINJA TEMPLATE. Home Assistant reads it as-is
# EN | through !include, so t('key') and __T:key__ do NOT work here.
# EN | Displayed text must therefore be passed in by the caller (the
# EN | generated dashboard, which does have t()). The only exception is
# EN | number formatting, handled below through hass.locale.
# FR | CE FICHIER N'EST PAS UN TEMPLATE JINJA. Home Assistant le lit tel
# FR | quel via !include, donc t('cle') et __T:cle__ n'y fonctionnent PAS.
# FR | Le texte affiche doit donc etre fourni par l'appelant (le dashboard
# FR | genere, qui dispose de t()). Seule exception : le formatage des
# FR | nombres, traite plus bas via hass.locale.
########################################################################

# ---------------------------------------------------------------------
# EN | Base glass panel — generic container, no icon or name shown by default.
# FR | Panneau de verre de base — conteneur generique, ni icone ni nom affiches par defaut.
# ---------------------------------------------------------------------
vssp_panel:
  show_icon: false
  show_name: false
  styles:
    card:
      - background: var(--card-background-color, rgba(8,18,28,0.75))
      - border-radius: var(--ha-card-border-radius, 20px)
      - border: 1px solid rgba(0,229,255,0.35)
      - backdrop-filter: blur(12px)
      - box-shadow: 0 0 18px rgba(0,229,255,.18)
      - padding: 18px

# ---------------------------------------------------------------------
# EN | Section title (used for HOME / ROOMS / SYSTEM headers).
# FR | Titre de section (utilise pour les en-tetes HOME / ROOMS / SYSTEM).
# ---------------------------------------------------------------------
vssp_title:
  show_icon: false
  styles:
    card:
      - background: transparent
      - box-shadow: none
      - border: none
    name:
      - color: "#00E5FF"
      - font-size: 26px
      - font-weight: 700
      - letter-spacing: 3px
      - font-family: "Orbitron, sans-serif"
      - justify-self: start
      - text-align: left
      - padding-left: 4px

# ---------------------------------------------------------------------
# EN | KPI / metric tile (label + big value), used when a numeric value
# FR | Tuile KPI / metrique (libelle + grande valeur), utilisee quand une
# EN | does not need a full apexcharts radial gauge.
# FR | valeur numerique n'a pas besoin d'une jauge radiale apexcharts complete.
# ---------------------------------------------------------------------
vssp_metric:
  show_icon: false
  styles:
    card:
      - background: rgba(0,0,0,.25)
      - border-radius: var(--ha-card-border-radius, 18px)
      - border: 1px solid rgba(0,229,255,.25)
      - padding: 10px
    icon:
      - color: "var(--paper-item-icon-color, #00E5FF)"
      - "--mdc-icon-size": 20px
    name:
      - color: "var(--secondary-text-color, #8FB6C9)"
      - font-size: 12px
      - letter-spacing: 2px
    state:
      - color: var(--text-primary-color, white)
      - font-size: 30px
      - font-weight: bold

# ---------------------------------------------------------------------
# EN | HUD header — page title cell (chevron-back + title + description).
# FR | En-tete HUD — case du titre de page (chevron retour + titre + description).
# EN | The name and label come from the caller, already translated.
# FR | Le nom et le libelle viennent de l'appelant, deja traduits.
# EN |   template: vssp_page_header
# EN |   icon: mdi:chevron-left
# EN |   name: HOME
# EN |   label: "{{ t('page.home.subtitle') }}"
# ---------------------------------------------------------------------
vssp_page_header:
  show_state: false
  show_label: true
  styles:
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: 26px 1fr
      - grid-template-rows: min-content min-content
      - column-gap: 12px
      - justify-items: start
      - align-items: center
      - align-content: start
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - padding: 6px 10px
      - justify-content: start
    icon:
      - color: "#8FB6C9"
      - "--mdc-icon-size": 24px
    name:
      - color: "var(--text-primary-color, #FFFFFF)"
      - font-size: 20px
      - font-weight: 700
      - letter-spacing: 1px
      - justify-self: start
      - text-align: left
      - font-family: "Orbitron, sans-serif"
    label:
      - color: "var(--secondary-text-color, #8FB6C9)"
      - font-size: 12px
      - justify-self: start
      - text-align: left

# ---------------------------------------------------------------------
# EN | HUD header — alarm status cell. Bind `entity` to your
# FR | En-tete HUD — case d'etat de l'alarme. Lier `entity` a votre
# EN | alarm_control_panel.* — icon, colour and label react to entity.state
# FR | alarm_control_panel.* — icone, couleur et libelle reagissent a
# EN | automatically: disarmed / armed_home / armed_away / arming /
# FR | entity.state automatiquement : disarmed / armed_home / armed_away /
# EN | pending / triggered / unavailable.
# FR | arming / pending / triggered / unavailable.
# EN |   template: vssp_alarm_status
# EN |   entity: alarm_control_panel.maison
# ---------------------------------------------------------------------
vssp_alarm_status:
  show_state: false
  show_label: true
  icon: >
    [[[
      if (!entity) return "mdi:shield-off-outline";
      switch (entity.state) {
        case "disarmed": return "mdi:shield-check";
        case "triggered": return "mdi:shield-alert";
        case "arming":
        case "pending": return "mdi:shield-sync";
        case "unavailable": return "mdi:shield-off-outline";
        default: return "mdi:shield-lock"; // armed_home / armed_away / armed_night / armed_vacation
      }
    ]]]
  label: >
    [[[
      if (!entity) return "Entité non configurée";
      switch (entity.state) {
        case "disarmed": return "Désarmée";
        case "triggered": return "DÉCLENCHÉE";
        case "armed_home": return "Armée — Maison";
        case "armed_away": return "Armée — Absence";
        case "armed_night": return "Armée — Nuit";
        case "armed_vacation": return "Armée — Vacances";
        case "arming": return "Activation…";
        case "pending": return "Alerte en attente";
        case "unavailable": return "Indisponible";
        default: return entity.state;
      }
    ]]]
  styles:
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: 26px 1fr
      - grid-template-rows: min-content min-content
      - column-gap: 12px
      - justify-items: start
      - align-items: center
    card:
      - background: rgba(0,0,0,.25)
      - border-radius: var(--ha-card-border-radius, 18px)
      - border: 1px solid rgba(0,229,255,.25)
      - padding: 10px 14px
      - height: 100%
    icon:
      - color: >
          [[[
            if (!entity) return "#56707E";
            if (entity.state === "disarmed") return "#00FFC3";
            if (entity.state === "triggered") return "#FF3D71";
            if (["arming","pending"].includes(entity.state)) return "#FF9800";
            return "#00E5FF";
          ]]]
      - "--mdc-icon-size": 22px
    name:
      - color: "var(--text-primary-color, #FFFFFF)"
      - font-size: 13px
      - font-weight: 700
      - letter-spacing: 1px
      - justify-self: start
      - text-align: left
    label:
      - color: "var(--secondary-text-color, #8FB6C9)"
      - font-size: 11px
      - justify-self: start
      - text-align: left

# ---------------------------------------------------------------------
# EN | HUD header — circular "OS" avatar / logo (right end of the header bar).
# FR | En-tete HUD — avatar/logo « OS » circulaire (extremite droite du bandeau).
# EN |   template: vssp_os_avatar
# ---------------------------------------------------------------------
vssp_os_avatar:
  show_state: false
  show_icon: false
  styles:
    card:
      - width: 46px
      - height: 46px
      - min-width: 46px
      - border-radius: 50%
      - background: "radial-gradient(circle at 30% 30%, rgba(0,229,255,0.40), rgba(176,132,255,0.30) 55%, rgba(8,18,28,0.92) 100%)"
      - border: 1px solid rgba(0,229,255,0.45)
      - box-shadow: 0 0 14px rgba(0,229,255,.35)
      - display: flex
      - align-items: center
      - justify-content: center
      - padding: 0
      - margin: 0 auto
    name:
      - color: "#FFFFFF"
      - font-size: 13px
      - font-weight: 700
      - letter-spacing: 1px
      - justify-self: center

# ---------------------------------------------------------------------
# EN | Sidebar logo / brand block — top of the vertical nav rail.
# FR | Bloc logo/marque de la sidebar — haut du bandeau de navigation vertical.
# EN | Non interactive, purely decorative.
# FR | Non interactif, purement decoratif.
# EN |   template: vssp_sidebar_logo
# EN |   icon: mdi:hexagon-outline
# ---------------------------------------------------------------------
vssp_sidebar_logo:
  show_state: false
  show_label: true
  styles:
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: 34px 1fr
      - grid-template-rows: min-content min-content
      - column-gap: 12px
      - row-gap: 2px
      - justify-items: start
      - align-items: center
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - border-bottom: 1px solid rgba(0,229,255,0.15)
      - border-radius: 0
      - padding: 2px 8px 16px 8px
      - margin-bottom: 10px
      - cursor: default
      - pointer-events: none
    icon:
      - color: "#00E5FF"
      - "--mdc-icon-size": 30px
      - filter: drop-shadow(0 0 6px rgba(0,229,255,.5))
    name:
      - color: "#FFFFFF"
      - font-size: 16px
      - font-weight: 700
      - letter-spacing: 2px
      - font-family: "Orbitron, sans-serif"
      - justify-self: start
      - text-align: left
    label:
      - color: "#56707E"
      - font-size: 10px
      - letter-spacing: 1px
      - justify-self: start
      - text-align: left

# ---------------------------------------------------------------------
# EN | Sidebar navigation item (HOME / CORE / rooms / ENERGY / ADMIN...).
# FR | Element de navigation de la sidebar (HOME / CORE / pieces / ENERGY / ADMIN...).
# EN | Vertical layout: icon left, title and subtitle stacked right.
# FR | Disposition verticale : icone a gauche, titre et sous-titre empiles a droite.
# EN | `active` must be passed per instance — the generated dashboard sets
# FR | `active` doit etre passe par instance — le dashboard genere le pose
# EN | it on the entry matching the current page.
# FR | sur l'entree correspondant a la page courante.
# EN |   template: vssp_nav_button
# EN |   variables:
# EN |     active: true
# ---------------------------------------------------------------------
vssp_nav_button:
  show_state: false
  show_label: true
  card_mod:
    style: |
      ha-card:hover {
        background: rgba(0, 229, 255, 0.25) !important;
        border: 1px solid rgba(0, 229, 255, 0.65) !important;
        box-shadow: 0 0 18px rgba(0, 229, 255, 0.35) !important;
      }
  styles:
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: 28px 1fr
      - grid-template-rows: min-content min-content
      - column-gap: 12px
      - row-gap: 2px
      - justify-items: start
      - align-items: center
    card:
      # EN | `active` (set by _nav.j2 on the entry matching the current page)
      # EN | used to read var(--sidebar-selected-background-color) nowhere —
      # EN | the whole "Sidebar selected *" group of THEME tokens had no
      # EN | consumer at all, same story as name/icon below.
      # FR | `active` (pose par _nav.j2 sur l'entree correspondant a la page
      # FR | courante) ne lisait nulle part var(--sidebar-selected-background-color)
      # FR | — tout le groupe de tokens THEME « Sidebar selected * » n'avait
      # FR | aucun consommateur, meme histoire que name/icon plus bas.
      - background: >
          [[[ return variables.active ? 'var(--sidebar-selected-background-color, rgba(0,229,255,0.10))' : 'transparent'; ]]]
      - border-radius: 12px
      - border: >
          [[[ return variables.active ? '1px solid rgba(0, 229, 255, 0.35)' : '1px solid transparent'; ]]]
      - padding: 10px 12px
      - margin-bottom: 4px
      - width: 100%
      - justify-self: stretch
      - text-align: left
      - transition: all .45s cubic-bezier(.4,0,.2,1)
    icon:
      # EN | Was a literal #8FB6C9 — the THEME screen's "Sidebar icon" /
      # EN | "Sidebar selected icon" pickers changed a value nothing read.
      # FR | Etait un #8FB6C9 litteral — les selecteurs THEME « Sidebar icon »
      # FR | / « Sidebar selected icon » changeaient une valeur que rien ne lisait.
      - color: >
          [[[ return variables.active ? 'var(--sidebar-selected-icon-color, #00E5FF)' : 'var(--sidebar-icon-color, #8FB6C9)'; ]]]
      - "--mdc-icon-size": 20px
      - align-self: start
      - margin-top: 2px
    name:
      # EN | Was a literal #FFFFFF — this is the exact field reported as not
      # EN | responding to the THEME screen's "Sidebar text" / "Sidebar
      # EN | selected text" pickers.
      # FR | Etait un #FFFFFF litteral — c'est exactement le champ signale
      # FR | comme ne repondant pas aux selecteurs THEME « Sidebar text » /
      # FR | « Sidebar selected text ».
      - color: >
          [[[ return variables.active ? 'var(--sidebar-selected-text-color, #00E5FF)' : 'var(--sidebar-text-color, #FFFFFF)'; ]]]
      - font-size: 13px
      - font-weight: 600
      - letter-spacing: 0.5px
      - justify-self: start
      - text-align: left
    label:
      - color: "#56707E"
      - font-size: 10px
      - justify-self: start
      - text-align: left

# ---------------------------------------------------------------------
# EN | Sidebar bottom branding block — placed as the LAST card of the nav
# FR | Bloc de marque en bas de sidebar — place comme DERNIERE carte du
# EN | vertical-stack, pushed to the bottom (margin-top: auto).
# FR | vertical-stack de navigation, pousse en bas (margin-top: auto).
# EN | Purely decorative, non interactive.
# FR | Purement decoratif, non interactif.
# EN |   template: vssp_sidebar_brand_footer
# ---------------------------------------------------------------------
vssp_sidebar_brand_footer:
  show_state: false
  show_label: true
  styles:
    grid:
      - grid-template-areas: '"i" "n" "l"'
      - grid-template-rows: min-content min-content min-content
      - justify-items: center
      - row-gap: 4px
    card:
      - class: osv-sidebar-brand glow
      - background: transparent
      - box-shadow: none
      - border: none
      - border-top: 1px solid rgba(0,229,255,0.15)
      - border-radius: 0
      - padding: 18px 8px 6px 8px
      - margin-top: auto
      - cursor: default
      - pointer-events: none
      - text-align: center
    icon:
      - color: "#00E5FF"
      - "--mdc-icon-size": 34px
      - filter: drop-shadow(0 0 10px rgba(0,229,255,.6))
    name:
      - color: "#00E5FF"
      - font-size: 14px
      - font-weight: 700
      - letter-spacing: 2px
      - font-family: "Orbitron, sans-serif"
      - justify-self: center
      - text-shadow: 0 0 10px rgba(0,229,255,.5)
    label:
      - color: "#56707E"
      - font-size: 9px
      - letter-spacing: 2px
      - justify-self: center

# ---------------------------------------------------------------------
# EN | Security panel — central glowing badge (icon reacts to the alarm entity).
# FR | Panneau securite — badge central lumineux (l'icone reagit a l'entite d'alarme).
# EN |   template: vssp_security_badge
# ---------------------------------------------------------------------
vssp_security_badge:
  show_name: false
  show_state: false
  icon: >
    [[[
      if (!entity) return "mdi:shield-off-outline";
      switch (entity.state) {
        case "disarmed": return "mdi:shield-check";
        case "triggered": return "mdi:shield-alert";
        case "arming":
        case "pending": return "mdi:shield-sync";
        case "unavailable": return "mdi:shield-off-outline";
        default: return "mdi:shield-lock";
      }
    ]]]
  styles:
    card:
      - width: 84px
      - height: 84px
      - border-radius: 50%
      - margin: 8px auto 14px auto
      - display: flex
      - align-items: center
      - justify-content: center
      - background: >
          [[[
            if (!entity || entity.state === "disarmed") return "radial-gradient(circle at 35% 30%, rgba(0,255,195,0.35), rgba(8,18,28,0.9) 75%)";
            if (entity.state === "triggered") return "radial-gradient(circle at 35% 30%, rgba(255,61,113,0.40), rgba(8,18,28,0.9) 75%)";
            return "radial-gradient(circle at 35% 30%, rgba(0,229,255,0.35), rgba(8,18,28,0.9) 75%)";
          ]]]
      - border: >
          [[[
            if (!entity || entity.state === "disarmed") return "1px solid rgba(0,255,195,0.5)";
            if (entity.state === "triggered") return "1px solid rgba(255,61,113,0.5)";
            return "1px solid rgba(0,229,255,0.5)";
          ]]]
      - box-shadow: >
          [[[
            if (!entity || entity.state === "disarmed") return "0 0 22px rgba(0,255,195,.35)";
            if (entity.state === "triggered") return "0 0 22px rgba(255,61,113,.45)";
            return "0 0 22px rgba(0,229,255,.35)";
          ]]]
    icon:
      - color: >
          [[[
            if (!entity || entity.state === "disarmed") return "#00FFC3";
            if (entity.state === "triggered") return "#FF3D71";
            return "#00E5FF";
          ]]]
      - "--mdc-icon-size": 34px

# ---------------------------------------------------------------------
# EN | Security panel — one status row (icon + label + dynamic state text).
# FR | Panneau securite — une ligne d'etat (icone + libelle + texte d'etat dynamique).
# EN | Works with any entity domain (binary_sensor on/off, alarm_control_panel...).
# FR | Fonctionne avec n'importe quel domaine (binary_sensor on/off, alarm_control_panel...).
# EN |   template: vssp_security_row
# EN |   icon: mdi:door
# ---------------------------------------------------------------------
vssp_security_row:
  show_state: false
  show_label: true
  label: >
    [[[
      if (!entity) return "Non configuré";
      switch (entity.state) {
        case "on": return "Actif";
        case "off": return "Inactif";
        case "unavailable": return "Indisponible";
        case "disarmed": return "Désarmée";
        case "armed_home": return "Armée — Maison";
        case "armed_away": return "Armée — Absence";
        case "triggered": return "Déclenchée";
        default: return entity.state;
      }
    ]]]
  styles:
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: 26px 1fr
      - grid-template-rows: min-content min-content
      - column-gap: 12px
      - justify-items: start
      - align-items: center
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - border-bottom: 1px solid var(--divider-color, rgba(0,229,255,0.10))
      - border-radius: 0
      - padding: 8px 4px
      - cursor: default
      - pointer-events: none
    icon:
      - color: >
          [[[
            if (!entity) return "#56707E";
            if (["on","triggered"].includes(entity.state)) return "#00E5FF";
            return "#8FB6C9";
          ]]]
      - "--mdc-icon-size": 20px
    name:
      - color: "var(--text-primary-color, #FFFFFF)"
      - font-size: 13px
      - font-weight: 600
      - justify-self: start
      - text-align: left
    label:
      - color: "var(--secondary-text-color, #8FB6C9)"
      - font-size: 11px
      - justify-self: start
      - text-align: left

# ---------------------------------------------------------------------
# EN | Admin console button (Discovery / Upgrade / Generate / Delete).
# FR | Bouton de la console admin (Discovery / Upgrade / Generate / Delete).
# EN | Pass `danger: true` for destructive actions (red theme instead of cyan).
# FR | Passer `danger: true` pour les actions destructives (theme rouge au lieu de cyan).
# EN |   template: vssp_admin_button
# EN |   variables:
# EN |     danger: false
# ---------------------------------------------------------------------
vssp_admin_button:
  show_state: false
  show_label: true
  variables:
    danger: false
  styles:
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: 30px 1fr
      - grid-template-rows: min-content min-content
      - column-gap: 12px
      - justify-items: start
      - align-items: center
    card:
      - background: var(--card-background-color, rgba(8,18,28,0.72))
      - border-radius: var(--ha-card-border-radius, 16px)
      - border: >
          [[[ return variables.danger ? "1px solid rgba(255,61,113,0.45)" : "1px solid rgba(0,229,255,0.25)" ]]]
      - padding: 16px
      - transition: all .2s ease
    icon:
      - color: '[[[ return variables.danger ? "#FF3D71" : "var(--paper-item-icon-color, #00E5FF)" ]]]'
      - "--mdc-icon-size": 26px
    name:
      - color: "var(--text-primary-color, #FFFFFF)"
      - font-size: 14px
      - font-weight: 700
      - letter-spacing: 1px
      - justify-self: start
      - text-align: left
    label:
      - color: "var(--secondary-text-color, #8FB6C9)"
      - font-size: 11px
      - justify-self: start
      - text-align: left

# ---------------------------------------------------------------------
# EN | ADMIN console MENU screen — one full-width row per screen, stacked
# EN | vertically (icon | name + hint | chevron), instead of a grid of big
# EN | boxes (vssp_admin_button above). Same row shape as
# EN | vssp_energy_device_row (icon cell / stacked name+label / trailing
# EN | chevron / bottom-divider), just without that template's
# EN | room/energy columns — this one is a pure navigation link.
# EN |   template: vssp_admin_menu_row
# EN |   icon: mdi:floor-plan
# EN |   name: "Rooms"
# EN |   label: "Define rooms and floors"
# EN |   tap_action: {action: navigate, navigation_path: /visio-sapiens-admin/rooms}
# FR | Ecran MENU de la console ADMIN — une ligne pleine largeur par ecran,
# FR | empilees verticalement (icone | nom + indice | chevron), a la place
# FR | d'une grille de grosses cases (vssp_admin_button ci-dessus). Meme
# FR | forme de ligne que vssp_energy_device_row (case icone / nom+libelle
# FR | empiles / chevron final / trait de separation en bas), simplement
# FR | sans les colonnes piece/energie de ce template — celui-ci n'est
# FR | qu'un lien de navigation.
# FR |   template: vssp_admin_menu_row
# FR |   icon: mdi:floor-plan
# FR |   name: "Pieces"
# FR |   label: "Definir les pieces et etages"
# FR |   tap_action: {action: navigate, navigation_path: /visio-sapiens-admin/rooms}
# ---------------------------------------------------------------------
vssp_admin_menu_row:
  show_icon: true
  show_name: true
  show_state: false
  show_label: true
  custom_fields:
    arrow: >
      <ha-icon icon="mdi:chevron-right"
               style="--mdc-icon-size:18px;color:#56707E;"></ha-icon>
  styles:
    grid:
      - grid-template-areas: '"i n arrow" "i l arrow"'
      - grid-template-columns: 40px 1fr 20px
      - grid-template-rows: min-content min-content
      - column-gap: 12px
      - justify-items: start
      - align-items: center
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - border-bottom: 1px solid var(--divider-color, rgba(0,229,255,0.10))
      - border-radius: 0
      - padding: 14px 4px
      - transition: background .2s ease
    icon:
      - color: "var(--paper-item-icon-color, #00E5FF)"
      - "--mdc-icon-size": 22px
    name:
      - color: "var(--text-primary-color, #FFFFFF)"
      - font-size: 14px
      - font-weight: 700
      - letter-spacing: .5px
      - justify-self: start
      - text-align: left
    label:
      - color: "var(--secondary-text-color, #8FB6C9)"
      - font-size: 11px
      - justify-self: start
      - text-align: left

# ---------------------------------------------------------------------
# EN | KPI card (active rooms / alarm / connections...) — icon + title +
# FR | Carte KPI (pieces actives / alarme / connexions...) — icone + titre +
# EN | coloured value + subtitle. Optional variables:
# FR | valeur coloree + sous-titre. Variables optionnelles :
# EN |     value_color: "#3AA7FF"
# EN |     icon_color: "#3AA7FF"
# EN |   template: vssp_kpi_card
# EN | The state may also come from an entity through `entity:`.
# FR | L'etat peut aussi venir d'une entite via `entity:`.
# ---------------------------------------------------------------------
vssp_kpi_card:
  show_state: true
  show_label: true
  styles:
    grid:
      - grid-template-areas: '"i n" "i s" "i l"'
      - grid-template-columns: 36px 1fr
      - grid-template-rows: min-content min-content min-content
      - column-gap: 14px
      - row-gap: 2px
      - justify-items: start
      - align-items: start
    card:
      - background: var(--card-background-color, rgba(8,18,28,0.72))
      - border-radius: var(--ha-card-border-radius, 18px)
      - border: 1px solid rgba(0,229,255,0.20)
      - padding: 14px 18px
      - height: 100%
    icon:
      - color: '[[[ return variables.icon_color || "var(--paper-item-icon-color, #00E5FF)" ]]]'
      - "--mdc-icon-size": 26px
      - margin-top: 2px
    name:
      - color: "var(--text-primary-color, #FFFFFF)"
      - font-size: 13px
      - font-weight: 700
      - letter-spacing: 0.5px
      - justify-self: start
      - text-align: left
    state:
      - color: '[[[ return variables.value_color || "var(--text-primary-color, #FFFFFF)" ]]]'
      - font-size: 16px
      - font-weight: 700
      - justify-self: start
      - text-align: left
    label:
      - color: "var(--secondary-text-color, #56707E)"
      - font-size: 11px
      - justify-self: start
      - text-align: left

# ---------------------------------------------------------------------
# EN | Status indicator card (System Status / Energy Status) — title + round
# FR | Carte d'indicateur d'etat (System Status / Energy Status) — titre + voyant
# EN | coloured light + subtitle. Three tiers, read off entity.state:
# EN |   green  — "on"/"home"/"ok"/"true"/"problem_free" (binary_sensor-style)
# EN |   orange — "degraded"/"warning" (3-tier sensor-style, e.g. vssp_core_health)
# EN |   red    — anything else ("off", "critical", "problem", "alert"...)
# EN | A binary_sensor (two states) and a plain sensor with an "ok" /
# EN | "degraded" / "critical" string state both work unmodified — the
# EN | orange tier just never triggers for a binary_sensor, since "off" is
# EN | not in the orange list and falls through to red.
# FR | rond colore + sous-titre. Trois paliers, lus sur entity.state :
# FR |   vert   — "on"/"home"/"ok"/"true"/"problem_free" (type binary_sensor)
# FR |   orange — "degraded"/"warning" (type sensor a 3 paliers, ex.
# FR |            vssp_core_health)
# FR |   rouge  — tout le reste ("off", "critical", "problem", "alert"...)
# FR | Un binary_sensor (deux etats) et un sensor classique a etat chaine
# FR | "ok" / "degraded" / "critical" fonctionnent tous les deux sans
# FR | modification — le palier orange ne se declenche simplement jamais
# FR | pour un binary_sensor, puisque "off" n'est pas dans la liste orange
# FR | et retombe sur rouge.
# EN |   template: vssp_status_indicator
# EN |   entity: binary_sensor.vssp_core_health   # optional
# ---------------------------------------------------------------------
vssp_status_indicator:
  show_state: false
  show_label: true
  icon: mdi:circle
  variables:
    color_ok: "#00FFC3"
    color_warn: "#FFA726"
    color_bad: "#FF3D71"
  styles:
    grid:
      - grid-template-areas: '"n" "i" "l"'
      - grid-template-rows: min-content min-content min-content
      - row-gap: 10px
      - justify-items: start
    card:
      - background: var(--card-background-color, rgba(8,18,28,0.72))
      - border-radius: var(--ha-card-border-radius, 18px)
      - border: 1px solid rgba(0,229,255,0.20)
      - padding: 14px 18px
      - height: 100%
    name:
      - color: "var(--text-primary-color, #FFFFFF)"
      - font-size: 13px
      - font-weight: 700
      - letter-spacing: 0.5px
      - justify-self: start
      - text-align: left
    icon:
      - color: >
          [[[
            if (!entity) return variables.color_ok;
            if (["on","home","ok","true","problem_free"].includes(entity.state)) return variables.color_ok;
            if (["degraded","warning"].includes(entity.state)) return variables.color_warn;
            return variables.color_bad;
          ]]]
      - "--mdc-icon-size": 20px
      - justify-self: start
      - filter: >
          [[[
            if (!entity || ["on","home","ok","true","problem_free"].includes(entity.state))
              return "drop-shadow(0 0 8px rgba(0,255,195,.6))";
            if (["degraded","warning"].includes(entity.state))
              return "drop-shadow(0 0 8px rgba(255,167,38,.6))";
            return "drop-shadow(0 0 8px rgba(255,61,113,.6))";
          ]]]
    label:
      - color: "var(--secondary-text-color, #56707E)"
      - font-size: 11px
      - justify-self: start
      - text-align: left

# ---------------------------------------------------------------------
# EN | Quick action button (scenes, scripts, toggles).
# FR | Bouton d'action rapide (scenes, scripts, bascules).
# ---------------------------------------------------------------------
vssp_quick_action:
  show_state: false
  styles:
    card:
      - class: osv-quick-action
      - background: var(--card-background-color, rgba(8,18,28,0.72))
      - border-radius: var(--ha-card-border-radius, 16px)
      - border: 1px solid rgba(0,229,255,0.22)
      - padding: 14px
    icon:
      - color: "var(--paper-item-icon-color, #00E5FF)"
      - "--mdc-icon-size": 26px
    name:
      - color: "var(--secondary-text-color, #B8E8F5)"
      - font-size: 12px
      - letter-spacing: 1px

# ---------------------------------------------------------------------
# EN | Alert banner. Pass a `level` variable: "critical" | "info" | "ok".
# FR | Banniere d'alerte. Passer une variable `level` : « critical » | « info » | « ok ».
# ---------------------------------------------------------------------
vssp_alert:
  show_icon: true
  styles:
    card:
      - class: >
          [[[
            if (variables.level === 'critical') return 'osv-alert';
            if (variables.level === 'info') return 'osv-alert info';
            return 'osv-alert ok';
          ]]]
      - text-align: left
      - justify-items: start
    icon:
      - color: >
          [[[
            if (variables.level === 'critical') return '#FF3D71';
            if (variables.level === 'info') return '#3AA7FF';
            return '#00FFC3';
          ]]]
    name:
      - color: "var(--text-primary-color, #FFFFFF)"
      - font-size: 13px
      - justify-self: start

# ---------------------------------------------------------------------
# EN | Room card — one tile per room, used by the rooms overview.
# FR | Carte de piece — une tuile par piece, utilisee par la vue d'ensemble des pieces.
# ---------------------------------------------------------------------
vssp_room_card:
  show_state: false
  styles:
    card:
      - background: var(--card-background-color, rgba(10,20,32,0.68))
      - border-radius: var(--ha-card-border-radius, 20px)
      - border: 1px solid rgba(0,229,255,0.20)
      - height: 110px
      - transition: transform .2s ease, box-shadow .2s ease
    icon:
      - color: "var(--paper-item-icon-color, #00E5FF)"
      - "--mdc-icon-size": 30px
    name:
      - color: "var(--text-primary-color, #FFFFFF)"
      - font-size: 14px
      - letter-spacing: 1px

########################################################################
# Visio Sapiens — ENERGY templates
#
# EN | Templates below:
# FR | Templates ci-dessous :
#   vssp_section_title       EN | panel title       FR | titre de panneau
#   vssp_energy_stat         EN | small label + large coloured value
#                            FR | petit libelle + grande valeur coloree
#   vssp_energy_kpi          EN | KPI tile (framed icon + value + label)
#                            FR | tuile KPI (icone encadree + valeur + label)
#   vssp_energy_tab          EN | period tab        FR | onglet de periode
#   vssp_energy_device_row   EN | per-device consumption row
#                            FR | ligne de consommation par appareil
#   vssp_energy_total_row    EN | total row (table footer)
#                            FR | ligne de total (pied de tableau)
#   vssp_circuit_switch      EN | breaker-panel circuit card (Shelly)
#                            FR | carte circuit du tableau electrique (Shelly)
########################################################################

# ---------------------------------------------------------------------
# EN | Panel title — first line inside a glass block. The name is passed in
# FR | Titre de panneau — premiere ligne a l'interieur d'un bloc verre. Le nom
# EN | already translated by the caller, e.g. t('energy.panel.solar_production').
# FR | est fourni deja traduit par l'appelant, ex. t('energy.panel.solar_production').
# EN |   template: vssp_section_title
# ---------------------------------------------------------------------
vssp_section_title:
  show_icon: false
  show_state: false
  show_label: false
  styles:
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - padding: 2px 2px 10px 2px
      - justify-content: start
      - cursor: default
      - pointer-events: none
    name:
      - color: "var(--text-primary-color, #FFFFFF)"
      - font-size: 15px
      - font-weight: 600
      - letter-spacing: 1px
      - justify-self: start
      - text-align: left
      - font-family: "Orbitron, sans-serif"

# ---------------------------------------------------------------------
# EN | Sub-section title — a heading INSIDE a panel that already has one,
# FR | Titre de sous-section — un intitule A L'INTERIEUR d'un panneau qui
# EN | such as the two halves of the breaker panel. Smaller and cyan, so
# FR | en a deja un, comme les deux moities du tableau electrique. Plus
# EN | the panel title above keeps the eye first.
# FR | petit et cyan, pour que le titre du panneau garde la priorite.
# EN |   template: vssp_subsection_title
# EN |   name: "Switches"
# EN |   icon: mdi:toggle-switch-outline
# ---------------------------------------------------------------------
vssp_subsection_title:
  show_icon: true
  show_name: true
  show_state: false
  show_label: false
  styles:
    grid:
      - grid-template-areas: '"i n"'
      - grid-template-columns: min-content 1fr
      - column-gap: 7px
      - justify-items: start
      - align-items: center
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - padding: 2px 2px 10px 2px
      - cursor: default
      - pointer-events: none
    img_cell:
      - background: none
      - width: 16px
      - height: 16px
    icon:
      - color: "#00E5FF"
      - "--mdc-icon-size": 15px
    name:
      - color: "#00E5FF"
      - font-size: 11px
      - font-weight: 600
      - letter-spacing: 1.2px
      - justify-self: start
      - text-align: left
      - font-family: "Orbitron, sans-serif"

# ---------------------------------------------------------------------
# EN | Simple statistic: discreet label on top, large value below.
# FR | Statistique simple : libelle discret au-dessus, valeur en gros dessous.
# EN | The value colour is driven by `variables.accent`.
# FR | La couleur de la valeur est pilotee par `variables.accent`.
# EN |   template: vssp_energy_stat
# EN |   entity: sensor.solar_energy_today
# EN |   variables:
# EN |     accent: "#00FFC3"
# ---------------------------------------------------------------------
vssp_energy_stat:
  show_icon: false
  show_name: false
  show_state: true
  show_label: true
  variables:
    accent: "#00FFC3"
    size: "20px"
  styles:
    grid:
      - grid-template-areas: '"l" "s"'
      - grid-template-rows: min-content min-content
      - row-gap: 3px
      - justify-items: start
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - padding: 4px 2px
      - cursor: default
      - pointer-events: none
    label:
      - color: "var(--secondary-text-color, #8FB6C9)"
      - font-size: 11px
      - letter-spacing: 0.5px
      - justify-self: start
      - text-align: left
    state:
      - color: "[[[ return variables.accent ]]]"
      - font-size: "[[[ return variables.size ]]]"
      - font-weight: 700
      - justify-self: start
      - text-align: left

# ---------------------------------------------------------------------
# EN | KPI tile: icon in a rounded square on the left, value and label right.
# FR | Tuile KPI : icone dans un carre arrondi a gauche, valeur et libelle a droite.
# EN |   template: vssp_energy_kpi
# EN |   entity: sensor.home_energy_today
# EN |   icon: mdi:chart-bar
# EN |   variables:
# EN |     accent: "#00E5FF"
# ---------------------------------------------------------------------
vssp_energy_kpi:
  show_icon: true
  show_name: false
  show_state: true
  show_label: true
  variables:
    accent: "#00E5FF"
  styles:
    grid:
      - grid-template-areas: '"i s" "i l"'
      # EN | 46px = exactly the icon square, so no column is wasted; every
      # EN | pixel saved here goes to the value, which is what overflows.
      # FR | 46px = exactement le carre de l'icone, aucune colonne perdue ;
      # FR | chaque pixel gagne ici va a la valeur, c'est elle qui deborde.
      - grid-template-columns: 46px 1fr
      - grid-template-rows: min-content min-content
      - column-gap: 12px
      - justify-items: start
      - align-items: center
    card:
      - background: rgba(0,0,0,.25)
      - border-radius: var(--ha-card-border-radius, 16px)
      - border: 1px solid rgba(0,229,255,.16)
      - padding: 14px 16px
      - cursor: default
      - pointer-events: none
    img_cell:
      - background: "[[[ return variables.accent + '1F' ]]]"
      - border-radius: 14px
      - width: 46px
      - height: 46px
      - justify-self: start
    icon:
      - color: "[[[ return variables.accent ]]]"
      - "--mdc-icon-size": 24px
    state:
      - color: "var(--text-primary-color, #FFFFFF)"
      # EN | The tile is narrow. A yearly total ("1 268,825 kWh") does not fit
      # EN | at 22px and gets chopped by the ellipsis. Step the size down with
      # EN | the number of integer digits, so the whole value - thousands
      # EN | separator and unit included - always stays complete and readable.
      # FR | La tuile est etroite. Un total annuel ("1 268,825 kWh") ne tient
      # FR | pas a 22px et se fait couper par les points de suspension. On
      # FR | reduit la taille selon le nombre de chiffres entiers, pour que la
      # FR | valeur entiere - separateur de milliers et unite compris - reste
      # FR | toujours complete et lisible.
      - font-size: >
          [[[
            const v = entity ? Math.abs(parseFloat(entity.state)) : 0;
            const digits = isNaN(v) ? 1 : String(Math.floor(v)).length;
            if (digits >= 7) return "13px";
            if (digits >= 6) return "15px";
            if (digits >= 5) return "17px";
            if (digits >= 4) return "19px";
            return "22px";
          ]]]
      - font-weight: 700
      - justify-self: start
      - text-align: left
    label:
      - color: "[[[ return variables.accent ]]]"
      - font-size: 12px
      - justify-self: start
      - text-align: left

# ---------------------------------------------------------------------
# EN | Period tab. The active state is derived from `entity` (an input_select)
# FR | Onglet de periode. L'etat actif est deduit de `entity` (un input_select)
# EN | compared with `variables.period`. tap_action is declared ON THE CARD
# FR | compare a `variables.period`. Le tap_action est declare COTE CARTE
# EN | (in energy.yaml.j2), not here.
# FR | (dans energy.yaml.j2), pas ici.
# EN | CRITICAL — `period` holds an IDENTIFIER, never a label. It stays
# FR | CRITIQUE — `period` porte un IDENTIFIANT, jamais un libelle. Il reste
# EN | Day / Month / Year in every language, because it is compared with the
# FR | Day / Month / Year dans toutes les langues, car il est compare a l'etat
# EN | stored input_select state. The visible label is `name`, which the
# FR | stocke de l'input_select. Le libelle visible est `name`, que le dashboard
# EN | generated dashboard passes through t('energy.tab.day').
# FR | genere fournit via t('energy.tab.day').
# EN |   template: vssp_energy_tab
# EN |   variables:
# EN |     period: Day
# ---------------------------------------------------------------------
vssp_energy_tab:
  show_icon: true
  show_name: true
  show_state: false
  show_label: false
  variables:
    # EN | IDENTIFIER, not a label. Compared with the stored
    # EN | input_select state, so it stays English in every language.
    # FR | IDENTIFIANT, pas un libelle. Compare a l'etat stocke de
    # FR | l'input_select, il reste donc en anglais dans toutes les langues.
    period: Day
  styles:
    grid:
      - grid-template-areas: '"i n"'
      - grid-template-columns: min-content min-content
      - column-gap: 6px
      - justify-items: center
      - align-items: center
    card:
      - background: >
          [[[
            return (entity && entity.state === variables.period)
              ? "rgba(0,229,255,0.22)" : "transparent";
          ]]]
      - border: >
          [[[
            return (entity && entity.state === variables.period)
              ? "1px solid rgba(0,229,255,0.55)" : "1px solid rgba(255,255,255,0.08)";
          ]]]
      - box-shadow: >
          [[[
            return (entity && entity.state === variables.period)
              ? "0 0 12px rgba(0,229,255,.28)" : "none";
          ]]]
      - border-radius: 10px
      - padding: 7px 12px
      - transition: all .25s ease
    icon:
      - color: >
          [[[
            return (entity && entity.state === variables.period) ? "#FFFFFF" : "#8FB6C9";
          ]]]
      - "--mdc-icon-size": 15px
    name:
      - color: >
          [[[
            return (entity && entity.state === variables.period) ? "#FFFFFF" : "#8FB6C9";
          ]]]
      - font-size: 12px
      - font-weight: 600

# ---------------------------------------------------------------------
# EN | Per-device consumption row:
# FR | Ligne de consommation par appareil :
# EN | icon | name + model | room | instant power | energy today | chevron
# FR | icone | nom + modele | piece | puissance instantanee | energie du jour | chevron
# EN |   template: vssp_energy_device_row
# EN |   entity: sensor.shelly_water_heater_power
# EN |   variables:
# EN |     model: "Shelly 1PM"
# EN |     room: displayed room name, already translated by the caller
# FR |     room : nom de piece affiche, deja traduit par l'appelant
# EN |     energy_entity: sensor.shelly_water_heater_energy_today
# EN |     detail_entity: switch.shelly_water_heater   # opened on tap
# ---------------------------------------------------------------------
vssp_energy_device_row:
  show_icon: true
  show_name: true
  show_state: true
  show_label: true
  variables:
    model: "Shelly Plus 1PM"
    room: ""
    energy_entity: ""
    detail_entity: ""
  label: "[[[ return variables.model ]]]"
  custom_fields:
    room: >
      [[[
        if (!variables.room)
          return '<span style="color:var(--secondary-text-color, #56707E);font-size:12px">—</span>';
        return '<span style="color:var(--secondary-text-color, #8FB6C9);font-size:12px">' + variables.room + '</span>';
      ]]]
    energy: >
      [[[
        const e = states[variables.energy_entity];
        if (!e || isNaN(Number(e.state)))
          return '<span style="color:var(--secondary-text-color, #56707E);font-size:13px">—</span>';
        // EN | This file is not a Jinja template, so the generator cannot
        // EN | inject locale_tag here. Home Assistant exposes the user's
        // EN | own language on `hass`, which is the better source anyway:
        // EN | number formatting is a per-user preference, not a property
        // EN | of the generated dashboard. Falls back to en-US.
        // FR | Ce fichier n'est pas un template Jinja, le generateur ne
        // FR | peut donc pas y injecter locale_tag. Home Assistant expose
        // FR | la langue de l'utilisateur sur `hass`, ce qui est de toute
        // FR | facon la meilleure source : le formatage des nombres est une
        // FR | preference par utilisateur, pas une propriete du dashboard
        // FR | genere. Repli sur en-US.
        const LOCALE = (hass && hass.locale && hass.locale.language) || 'en-US';
        const v = Number(e.state).toLocaleString(LOCALE, { maximumFractionDigits: 1 });
        const u = e.attributes.unit_of_measurement || 'kWh';
        return '<span style="color:var(--secondary-text-color, #B8E8F5);font-size:13px;font-weight:600">' + v + '</span>' +
               '<span style="color:var(--secondary-text-color, #56707E);font-size:11px"> ' + u + '</span>';
      ]]]
    arrow: >
      <ha-icon icon="mdi:chevron-right"
               style="--mdc-icon-size:16px;color:#56707E;"></ha-icon>
  styles:
    grid:
      - grid-template-areas: '"i n room s energy arrow" "i l room s energy arrow"'
      - grid-template-columns: 36px 1fr 96px 84px 84px 18px
      - grid-template-rows: min-content min-content
      - column-gap: 8px
      - justify-items: start
      - align-items: center
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - border-bottom: 1px solid var(--divider-color, rgba(0,229,255,0.08))
      - border-radius: 0
      - padding: 9px 4px
      - transition: background .2s ease
    img_cell:
      - background: rgba(0,229,255,0.10)
      - border-radius: 10px
      - width: 30px
      - height: 30px
    icon:
      - color: "var(--paper-item-icon-color, #00E5FF)"
      - "--mdc-icon-size": 17px
    name:
      - color: "var(--text-primary-color, #FFFFFF)"
      - font-size: 13px
      - font-weight: 600
      - justify-self: start
      - text-align: left
    label:
      - color: "var(--secondary-text-color, #56707E)"
      - font-size: 10px
      - justify-self: start
      - text-align: left
    state:
      - color: "var(--secondary-text-color, #B8E8F5)"
      - font-size: 13px
      - font-weight: 600
      - justify-self: end
      - text-align: right
    custom_fields:
      room:
        - justify-self: end
        - text-align: right
      energy:
        - justify-self: end
        - text-align: right
      arrow:
        - justify-self: end
        - display: flex
        - align-items: center
  card_mod:
    style: |
      ha-card:hover {
        background: rgba(0,229,255,0.06) !important;
      }

# ---------------------------------------------------------------------
# EN | Total row (footer of the per-device consumption table).
# FR | Ligne de total (pied du tableau de consommation par appareil).
# EN |   template: vssp_energy_total_row
# EN |   entity: sensor.home_power_consumption
# ---------------------------------------------------------------------
vssp_energy_total_row:
  show_icon: false
  show_name: true
  show_state: true
  show_label: false
  styles:
    grid:
      - grid-template-areas: '"n s"'
      - grid-template-columns: 1fr auto
      - justify-items: start
      - align-items: center
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - border-top: 1px solid var(--divider-color, rgba(0,229,255,0.18))
      - border-radius: 0
      - padding: 14px 4px 4px 4px
      - cursor: default
      - pointer-events: none
    name:
      - color: "#00E5FF"
      - font-size: 13px
      - font-weight: 600
      - justify-self: start
      - text-align: left
    state:
      - color: "#00E5FF"
      - font-size: 18px
      - font-weight: 700
      - justify-self: end
      - text-align: right

# ---------------------------------------------------------------------
# EN | Breaker-panel circuit card (Shelly).
# FR | Carte circuit du tableau electrique (Shelly).
# EN | Row 1: icon + name | Row 2: icon + model | Row 3: rating + toggle
# FR | Ligne 1 : icone + nom | Ligne 2 : icone + modele | Ligne 3 : calibre + bascule
# EN | Tapping toggles the circuit (tap_action: toggle).
# FR | Le tap bascule le circuit (tap_action: toggle).
# EN |   template: vssp_circuit_switch
# EN |   variables:
# EN |     model: "Shelly 1PM"
# EN |     amp: "25A"
# ---------------------------------------------------------------------
vssp_circuit_switch:
  show_icon: true
  show_name: true
  show_state: false
  show_label: true
  variables:
    model: "Shelly 1PM"
    amp: "16A"
  label: "[[[ return variables.model ]]]"
  tap_action:
    action: toggle
  hold_action:
    action: more-info
  custom_fields:
    amp: >
      [[[
        return '<span style="color:#00E5FF;font-size:14px;font-weight:700;' +
               'font-family:Orbitron,sans-serif;">' + variables.amp + '</span>';
      ]]]
    sw: >
      [[[
        const on = entity && entity.state === 'on';
        const bg   = on ? 'rgba(0,255,195,.85)' : 'rgba(255,255,255,.12)';
        const brd  = on ? 'rgba(0,255,195,.90)' : 'rgba(255,255,255,.22)';
        const glow = on ? '0 0 12px rgba(0,255,195,.45)' : 'none';
        const knob = on ? '22px' : '2px';
        return '<div style="width:44px;height:24px;border-radius:12px;background:' + bg +
               ';border:1px solid ' + brd + ';box-shadow:' + glow +
               ';position:relative;transition:all .25s ease;">' +
               '<div style="position:absolute;top:2px;left:' + knob +
               ';width:18px;height:18px;border-radius:50%;background:#FFFFFF;' +
               'transition:all .25s ease;"></div></div>';
      ]]]
  styles:
    grid:
      - grid-template-areas: '"i n" "i l" "amp sw"'
      - grid-template-columns: 34px 1fr
      - grid-template-rows: min-content min-content min-content
      - column-gap: 10px
      - row-gap: 2px
      - justify-items: start
      - align-items: center
    card:
      - background: rgba(0,0,0,.28)
      - border-radius: var(--ha-card-border-radius, 16px)
      - border: >
          [[[
            return (entity && entity.state === 'on')
              ? "1px solid rgba(0,255,195,0.30)" : "1px solid rgba(0,229,255,0.14)";
          ]]]
      - padding: 14px
      - transition: all .25s ease
    img_cell:
      - background: rgba(0,229,255,0.10)
      - border-radius: 10px
      - width: 30px
      - height: 30px
    icon:
      - color: >
          [[[ return (entity && entity.state === 'on') ? "#00FFC3" : "#8FB6C9"; ]]]
      - "--mdc-icon-size": 17px
    name:
      - color: "var(--text-primary-color, #FFFFFF)"
      - font-size: 13px
      - font-weight: 600
      - justify-self: start
      - text-align: left
    label:
      - color: "var(--secondary-text-color, #56707E)"
      - font-size: 10px
      - justify-self: start
      - text-align: left
    custom_fields:
      amp:
        - justify-self: start
        - padding-top: 10px
      sw:
        - justify-self: end
        - padding-top: 10px
  card_mod:
    style: |
      ha-card:hover {
        border-color: rgba(0,229,255,0.55) !important;
        box-shadow: 0 0 18px rgba(0,229,255,.22) !important;
      }


# ---------------------------------------------------------------------
# EN | Circuit row — the LIST form of a breaker-panel circuit: no box of
# FR | Ligne de circuit — la forme LISTE d'un circuit du tableau : pas de
# EN | its own, one line per switch, toggle on the same line, separated
# FR | cadre propre, une ligne par interrupteur, bascule sur la meme ligne,
# EN | from the next by a rule. Same reading as the per-device table just
# FR | separee de la suivante par un filet. Meme lecture que le tableau par
# EN | above it, which is the point: a list of circuits scans far faster
# FR | appareil juste au-dessus, et c'est le but : une liste de circuits se
# EN | than a grid of tiles when you are looking for one name.
# FR | parcourt bien plus vite qu'une grille de tuiles quand on cherche un
# FR | nom precis.
# EN | Tapping the row toggles the circuit; holding opens more-info.
# FR | Le tap bascule le circuit ; l'appui long ouvre more-info.
# EN |   template: vssp_circuit_row
# EN |   entity: switch.technical_room_livebox
# EN |   name: "Livebox"
# EN |   variables:
# EN |     model: "Shelly Power Strip 4 Gen4"
# EN |     amp: "16A"
# ---------------------------------------------------------------------
vssp_circuit_row:
  show_icon: true
  show_name: true
  show_state: false
  show_label: true
  variables:
    model: ""
    amp: ""
    image: ""
  label: "[[[ return variables.model ]]]"
  tap_action:
    action: toggle
  hold_action:
    action: more-info
  custom_fields:
    # EN | The product itself, next to the model that names it. The row had
    # FR | Le produit lui-meme, a cote du modele qui le nomme. La ligne avait
    # EN | the room, and a picture is recognised where a model number has to
    # FR | la place, et une image se reconnait la ou une reference se lit —
    # EN | be read — useful the moment two boxes are wired side by side.
    # FR | utile des que deux boitiers voisinent.
    pic: >
      [[[
        if (!variables.image) return '';
        return '<img src="' + variables.image + '" style="display:block;' +
               'max-width:42px;max-height:30px;object-fit:contain;' +
               'filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));">';
      ]]]
    amp: >
      [[[
        if (!variables.amp || variables.amp === '—') return '';
        return '<span style="color:#00E5FF;font-size:12px;font-weight:700;' +
               'font-family:Orbitron,sans-serif;">' + variables.amp + '</span>';
      ]]]
    sw: >
      [[[
        const on = entity && entity.state === 'on';
        const bg   = on ? 'rgba(0,255,195,.85)' : 'rgba(255,255,255,.12)';
        const brd  = on ? 'rgba(0,255,195,.90)' : 'rgba(255,255,255,.22)';
        const glow = on ? '0 0 12px rgba(0,255,195,.45)' : 'none';
        const knob = on ? '22px' : '2px';
        return '<div style="width:44px;height:24px;border-radius:12px;background:' + bg +
               ';border:1px solid ' + brd + ';box-shadow:' + glow +
               ';position:relative;transition:all .25s ease;">' +
               '<div style="position:absolute;top:2px;left:' + knob +
               ';width:18px;height:18px;border-radius:50%;background:#FFFFFF;' +
               'transition:all .25s ease;"></div></div>';
      ]]]
  styles:
    grid:
      - grid-template-areas: '"i n pic amp sw" "i l pic amp sw"'
      - grid-template-columns: 30px 1fr 46px auto 52px
      - grid-template-rows: min-content min-content
      - column-gap: 10px
      - justify-items: start
      - align-items: center
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - border-bottom: 1px solid var(--divider-color, rgba(0,229,255,0.08))
      - border-radius: 0
      - padding: 9px 4px
      - transition: background .2s ease
    img_cell:
      - background: rgba(0,229,255,0.10)
      - border-radius: 9px
      - width: 28px
      - height: 28px
    icon:
      - color: >
          [[[ return (entity && entity.state === 'on') ? "#00FFC3" : "#8FB6C9"; ]]]
      - "--mdc-icon-size": 16px
    name:
      - color: "var(--text-primary-color, #FFFFFF)"
      - font-size: 13px
      - font-weight: 600
      - justify-self: start
      - text-align: left
    label:
      - color: "var(--secondary-text-color, #56707E)"
      - font-size: 10px
      - justify-self: start
      - text-align: left
    custom_fields:
      pic:
        - justify-self: end
        - grid-row: span 2
      amp:
        - justify-self: end
        - text-align: right
      sw:
        - justify-self: end
  card_mod:
    style: |
      ha-card:hover {
        background: rgba(0,229,255,0.06) !important;
      }

# ---------------------------------------------------------------------
# EN | VIRTUAL BREAKER PANEL — three templates that draw the hardware:
# FR | TABLEAU ELECTRIQUE VIRTUEL — trois templates qui dessinent le materiel :
#   vssp_din_module   EN | module header (product, model, live total)
#                     FR | en-tete de module (produit, modele, total direct)
#   vssp_din_pole     EN | one channel of the module, drawn as a pole
#                     FR | une voie du module, dessinee en pole
#   vssp_din_blank    EN | blanking plate for an unused slot
#                     FR | obturateur pour un emplacement libre
#
# EN | The left half of the panel lists the switches by name — that is the
# EN | control surface. This right half draws the ENCLOSURE: only hardware
# EN | mounted on a DIN rail, which way out of which box each circuit leaves
# EN | by, its rating and its live draw. A plug or a power strip controls a
# EN | circuit too, but it hangs off a wall socket and is not part of the
# EN | panel, so it never appears here.
# FR | La moitie gauche du panneau liste les interrupteurs par leur nom :
# FR | c'est la surface de commande. Cette moitie droite dessine le COFFRET :
# FR | uniquement du materiel monte sur rail DIN, par quelle sortie de quel
# FR | boitier part chaque circuit, son calibre et sa consommation. Une prise
# FR | ou une multiprise commande un circuit elle aussi, mais elle pend au
# FR | bout d'une prise murale et ne fait pas partie du tableau : elle
# FR | n'apparait donc jamais ici.
# ---------------------------------------------------------------------

# EN | Module header. `powers` carries the channel power entities so the
# FR | En-tete de module. `powers` porte les entites de puissance des voies
# EN | header can show what the whole box draws, which no single entity
# FR | pour que l'en-tete affiche ce que tire le boitier entier, ce qu'aucune
# EN | gives: Shelly exposes per-outlet meters, never a strip total.
# FR | entite ne donne : Shelly expose des compteurs par prise, jamais un
# FR | total de multiprise.
# EN |   template: vssp_din_module
# EN |   name: "MultiPrise"          # the box
# EN |   label: "Shelly Pro 4PM"     # its model
# EN |   variables:
# EN |     powers: [sensor.a_power, sensor.b_power]
# ---------------------------------------------------------------------
vssp_din_module:
  show_icon: false
  show_name: true
  show_state: false
  show_label: true
  variables:
    powers: []
    switches: []
    image: ""
    icon: "mdi:chip"
  custom_fields:
    # EN | The product, and its master switch directly underneath. The switch
    # FR | Le produit, et son interrupteur maitre juste en dessous. La bascule
    # EN | is drawn, not clicked: the whole header carries the tap action, so
    # FR | est dessinee, pas cliquee : l'en-tete entier porte l'action, si
    # EN | the target is the card, not a 44px sliver.
    # FR | bien que la cible est la carte, pas un ruban de 44px.
    # EN | A module with nothing to switch — a LAN switch on the rail, a
    # EN | shutter controller — shows the product alone. Drawing a dead toggle
    # EN | under it would be a lie about what the hardware can do.
    # FR | Un module sans rien a commander — un switch LAN sur le rail, un
    # FR | controleur de volets — montre le produit seul. Dessiner dessous une
    # FR | bascule morte mentirait sur ce que sait faire le materiel.
    unit: >
      [[[
        const ids = variables.switches || [];
        let on = 0, known = 0;
        for (const id of ids) {
          const s = states[id];
          if (!s) continue;
          known++;
          if (s.state === 'on') on++;
        }
        const lit = on > 0;
        const bg   = lit ? 'rgba(0,255,195,.85)' : 'rgba(255,255,255,.12)';
        const brd  = lit ? 'rgba(0,255,195,.90)' : 'rgba(255,255,255,.22)';
        const glow = lit ? '0 0 12px rgba(0,255,195,.45)' : 'none';
        const knob = lit ? '22px' : '2px';
        const visual = variables.image
          ? '<img src="' + variables.image + '" style="display:block;margin:0 auto;' +
            'max-width:64px;max-height:50px;object-fit:contain;' +
            'filter:drop-shadow(0 2px 6px rgba(0,0,0,.55));">'
          : '<div style="width:44px;height:44px;margin:0 auto;border-radius:10px;' +
            'background:rgba(0,229,255,.10);display:flex;align-items:center;' +
            'justify-content:center;"><ha-icon icon="' + (variables.icon || 'mdi:chip') +
            '" style="--mdc-icon-size:22px;color:#00E5FF;"></ha-icon></div>';
        // EN | Partial: some channels on, some off. Said in words, because a
        // EN | two-position toggle cannot say it.
        // FR | Partiel : des voies allumees, d'autres non. Dit en toutes
        // FR | lettres, une bascule a deux positions ne sachant pas le dire.
        const partial = on > 0 && on < known;
        const sw = known
          ? '<div style="margin-top:7px;display:flex;flex-direction:column;' +
            'align-items:center;gap:3px;">' +
              '<div style="width:44px;height:24px;border-radius:12px;background:' + bg +
              ';border:1px solid ' + brd + ';box-shadow:' + glow +
              ';position:relative;transition:all .25s ease;">' +
                '<div style="position:absolute;top:2px;left:' + knob +
                ';width:18px;height:18px;border-radius:50%;background:#FFFFFF;' +
                'transition:all .25s ease;"></div>' +
              '</div>' +
              (partial ? '<div style="font-size:9px;color:#8FB6C9;">' + on + '/' +
                         known + '</div>' : '') +
            '</div>'
          : '';
        return '<div style="display:flex;flex-direction:column;align-items:center;">' +
               visual + sw + '</div>';
      ]]]
    pw: >
      [[[
        const ids = variables.powers || [];
        let total = 0, seen = false;
        for (const id of ids) {
          const s = states[id];
          if (s && !isNaN(Number(s.state))) { total += Number(s.state); seen = true; }
        }
        if (!seen)
          return '<span style="color:#56707E;font-size:12px;">—</span>';
        // EN | Same rule as the device rows: the number format is a per-user
        // EN | preference, read off hass, not baked into the dashboard.
        // FR | Meme regle que les lignes d'appareil : le format des nombres
        // FR | est une preference par utilisateur, lue sur hass, pas figee
        // FR | dans le dashboard.
        const LOCALE = (hass && hass.locale && hass.locale.language) || 'en-US';
        const kilo = total >= 1000;
        const v = (kilo ? total / 1000 : total).toLocaleString(LOCALE,
          { minimumFractionDigits: kilo ? 2 : 0, maximumFractionDigits: kilo ? 2 : 0 });
        const col = total > 0 ? '#00E5FF' : '#56707E';
        return '<span style="color:' + col + ';font-size:14px;font-weight:700;' +
               'font-family:Orbitron,sans-serif;">' + v + '</span>' +
               '<span style="color:#56707E;font-size:10px;"> ' + (kilo ? 'kW' : 'W') + '</span>';
      ]]]
  styles:
    grid:
      - grid-template-areas: '"unit n pw" "unit l pw"'
      - grid-template-columns: 78px 1fr auto
      - grid-template-rows: min-content min-content
      - column-gap: 12px
      - justify-items: start
      - align-items: center
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      # EN | The rail itself: the metallic line every pole below clips onto.
      # FR | Le rail lui-meme : la ligne metallique sur laquelle chaque pole
      # FR | ci-dessous vient se clipser.
      - border-bottom: 2px solid rgba(150,170,185,0.30)
      - border-radius: 0
      - padding: 4px 2px 10px 2px
      - transition: background .2s ease
    # EN | The MODEL is the title here. On this side of the panel the question
    # FR | Le MODELE est le titre ici. De ce cote du panneau la question est
    # EN | is "what is installed", so the box's own name is the subtitle.
    # FR | « qu'est-ce qui est installe », le nom du boitier passe donc en
    # FR | sous-titre.
    name:
      - color: "var(--text-primary-color, #FFFFFF)"
      - font-size: 13px
      - font-weight: 600
      - justify-self: start
      - text-align: left
    label:
      - color: "var(--secondary-text-color, #56707E)"
      - font-size: 10px
      - justify-self: start
      - text-align: left
    custom_fields:
      unit:
        - justify-self: center
        - grid-row: span 2
      pw:
        - justify-self: end
        - text-align: right
  card_mod:
    style: |
      ha-card:hover {
        background: rgba(0,229,255,0.05) !important;
      }

# ---------------------------------------------------------------------
# EN | One pole = one channel of the module. Lever up and lit = closed
# FR | Un pole = une voie du module. Manette en haut et allumee = circuit
# EN | circuit, lever down and grey = open, dashed slot = a measuring
# FR | ferme, manette en bas et grise = ouvert, fente en pointilles = voie
# EN | channel (a meter with nothing to switch).
# FR | de mesure (un compteur sans rien a commander).
# EN |   template: vssp_din_pole
# EN |   entity: switch.technical_room_livebox
# EN |   name: "Livebox"
# EN |   variables:
# EN |     amp: "16A"
# EN |     power_entity: sensor.technical_room_livebox_puissance
# EN |     kind: switch | cover | meter
# ---------------------------------------------------------------------
vssp_din_pole:
  show_icon: true
  show_name: true
  show_state: false
  show_label: false
  variables:
    amp: ""
    power_entity: ""
    kind: switch
  tap_action:
    action: toggle
  hold_action:
    action: more-info
  custom_fields:
    lever: >
      [[[
        const kind = variables.kind || 'switch';
        const st = entity ? entity.state : null;
        const on = st === 'on' || st === 'open' || st === 'opening';
        const meter = kind === 'meter' || !entity;
        const amp = variables.amp
          ? '<div style="margin-top:5px;font-size:9px;letter-spacing:.5px;' +
            'font-family:Orbitron,sans-serif;color:#8FB6C9;">' + variables.amp + '</div>'
          : '';
        if (meter) {
          // EN | Nothing to switch: draw the slot, not a lever that lies.
          // FR | Rien a commander : on dessine la fente, pas une manette qui
          // FR | mentirait sur l'etat du circuit.
          return '<div style="display:flex;flex-direction:column;align-items:center;">' +
                 '<div style="width:24px;height:36px;border-radius:4px;background:rgba(10,20,28,.9);' +
                 'border:1px dashed rgba(143,182,201,.35);display:flex;align-items:center;' +
                 'justify-content:center;">' +
                 '<ha-icon icon="mdi:gauge" style="--mdc-icon-size:14px;color:#8FB6C9;"></ha-icon>' +
                 '</div>' + amp + '</div>';
        }
        const col = on ? '#00FFC3' : '#56707E';
        const glow = on ? 'box-shadow:0 0 10px rgba(0,255,195,.45);' : '';
        return '<div style="display:flex;flex-direction:column;align-items:center;">' +
               '<div style="width:24px;height:36px;border-radius:4px;background:rgba(10,20,28,.95);' +
               'border:1px solid rgba(255,255,255,.16);position:relative;">' +
                 '<div style="position:absolute;left:3px;right:3px;height:15px;top:' +
                 (on ? '3px' : '16px') + ';border-radius:2px;background:' + col + ';' + glow +
                 'transition:top .25s ease;"></div>' +
               '</div>' + amp + '</div>';
      ]]]
    pw: >
      [[[
        const s = states[variables.power_entity];
        if (!s || isNaN(Number(s.state)))
          return '<span style="color:#56707E;font-size:10px;">—</span>';
        const LOCALE = (hass && hass.locale && hass.locale.language) || 'en-US';
        const w = Number(s.state);
        const kilo = w >= 1000;
        const v = (kilo ? w / 1000 : w).toLocaleString(LOCALE,
          { minimumFractionDigits: kilo ? 2 : 0, maximumFractionDigits: kilo ? 2 : 0 });
        return '<span style="color:' + (w > 0 ? '#B8E8F5' : '#56707E') +
               ';font-size:11px;font-weight:600;">' + v + ' ' + (kilo ? 'kW' : 'W') + '</span>';
      ]]]
  styles:
    grid:
      - grid-template-areas: '"lever" "i" "n" "pw"'
      - grid-template-rows: min-content min-content min-content min-content
      - row-gap: 4px
      - justify-items: center
      - align-items: center
    card:
      # EN | A module body: light on top, shadowed at the bottom, like a
      # FR | Un corps de module : clair en haut, ombre en bas, comme une
      # EN | plastic case seen from the front.
      # FR | coque plastique vue de face.
      - background: linear-gradient(180deg, rgba(26,38,50,0.95), rgba(12,20,28,0.95))
      - border-radius: 5px
      - border: >
          [[[
            const st = entity ? entity.state : null;
            return (st === 'on' || st === 'open')
              ? "1px solid rgba(0,255,195,0.28)" : "1px solid rgba(255,255,255,0.10)";
          ]]]
      - padding: 12px 4px 9px 4px
      - min-height: 118px
      - position: relative
      - transition: all .2s ease
    img_cell:
      - background: none
      - width: 18px
      - height: 18px
    icon:
      - color: >
          [[[
            const st = entity ? entity.state : null;
            return (st === 'on' || st === 'open') ? "#00FFC3" : "#8FB6C9";
          ]]]
      - "--mdc-icon-size": 15px
    name:
      - color: "var(--text-primary-color, #FFFFFF)"
      - font-size: 10px
      - font-weight: 600
      - justify-self: center
      - text-align: center
      - line-height: 1.15
      - max-width: 100%
      - overflow: hidden
      - text-overflow: ellipsis
      - white-space: nowrap
    custom_fields:
      lever:
        - justify-self: center
      pw:
        - justify-self: center
  card_mod:
    style: |
      /* EN | The clip that holds the module onto the rail above it.
         FR | Le clip qui tient le module sur le rail juste au-dessus. */
      ha-card {
        position: relative;
        overflow: visible;
      }
      ha-card::before {
        content: "";
        position: absolute;
        top: -1px;
        left: 50%;
        transform: translateX(-50%);
        width: 58%;
        height: 3px;
        border-radius: 0 0 3px 3px;
        background: rgba(150,170,185,0.40);
      }
      ha-card:hover {
        border-color: rgba(0,229,255,0.50) !important;
        box-shadow: 0 0 14px rgba(0,229,255,.18) !important;
      }

# ---------------------------------------------------------------------
# EN | Blanking plate: a slot left free on the rail. Drawn rather than
# FR | Obturateur : un emplacement libre sur le rail. Dessine plutot
# EN | omitted, because an enclosure with room to spare is information —
# FR | qu'omis, parce qu'un coffret qui a de la reserve est une information —
# EN | it says how many channels this box still has for the next circuit.
# FR | il dit combien de voies ce boitier garde pour le prochain circuit.
# EN |   template: vssp_din_blank
# ---------------------------------------------------------------------
vssp_din_blank:
  show_icon: false
  show_name: false
  show_state: false
  show_label: false
  styles:
    card:
      - background: rgba(255,255,255,0.015)
      - border: 1px dashed rgba(255,255,255,0.09)
      - border-radius: 5px
      - box-shadow: none
      - padding: 12px 4px 9px 4px
      - min-height: 118px
      - cursor: default
      - pointer-events: none

# ============================================================================
# vssp_nav_chip
#
# EN | Used by the horizontal navigation bar of the mobile dashboards
# EN | (home_mobile.yaml, energy_mobile.yaml), where the vertical rail does
# EN | not fit.
# FR | Utilise par la barre de navigation horizontale des dashboards mobiles
# FR | (home_mobile.yaml, energy_mobile.yaml), ou le bandeau vertical ne
# FR | tient pas.
#
# EN | Each tab passes:
# FR | Chaque onglet passe :
#   name                       EN | label, already translated by the caller
#                              FR | libelle, deja traduit par l'appelant
#   icon                       mdi:...
#   variables.active           EN | true on the current page's tab
#                              FR | true sur l'onglet de la page courante
#   tap_action.navigation_path EN | target, set in the dashboard
#                              FR | cible, definie dans le dashboard
#
# EN | Rendering: rounded cyan chip, Orbitron icon + text, active state
# EN | highlighted.
# FR | Rendu : chip arrondi cyan, icone + texte Orbitron, etat actif
# FR | surligne.
# ============================================================================

vssp_nav_chip:
  show_icon: true
  show_name: true
  show_state: false
  size: 16px
  styles:
    grid:
      - grid-template-areas: '"i n"'
      - grid-template-columns: auto auto
      - align-items: center
      - column-gap: 6px
    card:
      - height: 38px
      - padding: 0px 14px
      - margin: 0px 4px
      - border-radius: 14px
      - white-space: nowrap
      - background: >
          [[[ return variables.active ? 'rgba(0,229,255,0.14)' : 'rgba(16,27,39,0.85)'; ]]]
      - border: >
          [[[ return '1px solid ' + (variables.active ? 'rgba(0,229,255,0.55)' : 'rgba(0,229,255,0.18)'); ]]]
      - box-shadow: >
          [[[ return variables.active ? '0 0 12px rgba(0,229,255,.25)' : 'none'; ]]]
    icon:
      - width: 16px
      - color: >
          [[[ return variables.active ? '#00E5FF' : '#8FB6C9'; ]]]
    name:
      - font-family: Orbitron, sans-serif
      - font-size: 10px
      - letter-spacing: 1px
      - justify-self: start
      - text-align: left
      - color: >
          [[[ return variables.active ? '#00E5FF' : '#8FB6C9'; ]]]

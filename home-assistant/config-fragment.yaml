# ============================================================================
# Visio Sapiens — Configuration fragment (DESIRED STATE)
#
# EN | This file holds ONLY the configuration.yaml keys that Visio Sapiens
# EN | owns. It is merged into the target configuration.yaml by
# EN | vssp_apply_config.py, idempotently: it writes/updates its own entries
# EN | and touches NOTHING else in the destination file.
# FR | Ce fichier ne contient QUE les cles de configuration.yaml que Visio
# FR | Sapiens gere. Il est fusionne dans le configuration.yaml de destination
# FR | par vssp_apply_config.py, de facon idempotente : il POSE/MET A JOUR ses
# FR | propres entrees et ne touche a RIEN d'autre dans le fichier cible.
#
# EN | Merge rules applied by the script (see vssp_apply_config.py):
# EN |   - lovelace.dashboards : merged per sub-key — only the keys listed
# EN |     here (OSV_PREFIX prefix) are written; the user's other dashboards
# EN |     are preserved.
# EN |   - lovelace.resources  : merged by 'url' — deduplicated; resources not
# EN |     listed here are preserved.
# EN |   - input_text / shell_command / template : merged per key (vssp_ prefix).
# EN |   - homeassistant.packages : sets the loading key for the packages/
# EN |     folder (used by multi-domain fragments: utility_meter, template...).
# EN |     NOTE: requires vssp_apply_config.py to handle the "homeassistant"
# EN |     domain; otherwise set this line directly in configuration.yaml.
# FR | Regles de fusion appliquees par le script (voir vssp_apply_config.py) :
# FR |   - lovelace.dashboards : merge par sous-cle — seules les cles listees
# FR |     ici (prefixe OSV_PREFIX) sont ecrites ; les autres dashboards de
# FR |     l'utilisateur sont preserves.
# FR |   - lovelace.resources  : merge par 'url' — dedoublonne ; les ressources
# FR |     non listees ici sont preservees.
# FR |   - input_text / shell_command / template : merge par cle (prefixe vssp_).
# FR |   - homeassistant.packages : pose la cle de chargement du dossier
# FR |     packages/ (utilisee par les fragments multi-domaines : utility_meter,
# FR |     template...). NB : necessite que vssp_apply_config.py gere le domaine
# FR |     « homeassistant » ; sinon, poser cette ligne directement dans
# FR |     configuration.yaml.
#
# EN | => To add/change/remove a line of Visio Sapiens config, edit THIS file.
# EN |    The patcher reflects the state into production.
# FR | => Pour ajouter/modifier/supprimer une ligne de config Visio Sapiens, on
# FR |    edite CE fichier. Le patcher se charge de refleter l'etat en prod.
#
# EN | HA tags (!include, etc.) are preserved as-is by ruamel.
# FR | Les tags HA (!include, etc.) sont preserves tels quels par ruamel.
#
# ----------------------------------------------------------------------------
# EN | TWO PLACEHOLDERS ARE SUBSTITUTED BEFORE THIS FILE REACHES PRODUCTION:
# EN |   __VTOKEN__     -> build version, injected by vssp_apply_config.py --vtoken
# EN |   __T:<key>__ -> translated string, injected by vssp_i18n.py render
# EN | The build job renders the locale FIRST, then the deploy job applies the
# EN | version token. Never hardcode a dashboard title here — it belongs in
# EN | home-assistant/dashboards/locales/<code>.yaml.
# FR | DEUX SUBSTITUTIONS SONT APPLIQUEES AVANT LA PRODUCTION :
# FR |   __VTOKEN__     -> version du build, injectee par vssp_apply_config.py
# FR |   __T:<cle>__  -> chaine traduite, injectee par vssp_i18n.py render
# FR | Le job build rend d'abord la langue, puis le job deploy applique le
# FR | jeton de version. Ne jamais coder un titre de dashboard en dur ici — il
# FR | appartient a home-assistant/dashboards/locales/<code>.yaml.
# ============================================================================

homeassistant:
  # EN | Loads every file in config/packages/ (including vssp_energy_totaux.yaml,
  # EN | which feeds the "Total Consumption" panel of the Energy dashboard).
  # FR | Charge tous les fichiers de config/packages/ (dont vssp_energy_totaux.yaml,
  # FR | qui alimente le panneau « Consommation totale » du dashboard Energy).
  packages: !include_dir_named packages

lovelace:
  dashboards:
    visio-sapiens:
      mode: yaml
      title: __T:dashboard.main.title__
      icon: mdi:hexagon-outline
      show_in_sidebar: true
      filename: dashboards/views/home.yaml
    visio-sapiens-core:
      mode: yaml
      title: __T:dashboard.core.title__
      icon: mdi:server
      show_in_sidebar: false
      filename: dashboards/views/core.yaml
    visio-sapiens-energy:
      mode: yaml
      title: __T:dashboard.energy.title__
      icon: mdi:lightning-bolt
      show_in_sidebar: false
      filename: dashboards/views/energy.yaml
    visio-sapiens-m:
      mode: yaml
      title: __T:dashboard.main.title__
      icon: mdi:hexagon-outline
      show_in_sidebar: true
      filename: dashboards/views/home_mobile.yaml
    visio-sapiens-energy-m:
      mode: yaml
      title: __T:dashboard.energy.title__
      icon: mdi:lightning-bolt
      show_in_sidebar: false
      filename: dashboards/views/energy_mobile.yaml

# ── PREVIEW — test chain, not deployed ──────────────────────────────
# EN | Produced by `generate_dashboards.py --preview`, which suffixes both
# EN | the output file and the url_path so the preview can never overwrite a
# EN | staging dashboard.
# EN | Two long-standing bugs fixed here: the key used the `vssp-` prefix, so
# EN | vssp_apply_config.py skipped it silently and it never reached
# EN | configuration.yaml; and `filename` was repo-relative instead of
# EN | /config-relative, so it would not have resolved anyway.
# FR | Produit par `generate_dashboards.py --preview`, qui suffixe le fichier
# FR | de sortie ET l'url_path : l'apercu ne peut jamais ecraser un dashboard
# FR | de staging.
# FR | Deux bugs de longue date corriges ici : la cle utilisait le prefixe
# FR | `vssp-`, donc vssp_apply_config.py l'ignorait en silence et elle
# FR | n'atteignait jamais configuration.yaml ; et `filename` etait relatif au
# FR | depot au lieu de /config, donc elle n'aurait de toute facon pas resolu.
    visio-sapiens-energy-preview:
      mode: yaml
      title: __T:dashboard.preview.title__
      icon: mdi:flask-outline
      # EN | Set to false to hide it from other users.
      # FR | Passer a false pour le masquer aux autres utilisateurs.
      show_in_sidebar: true
      filename: dashboards/views/energy_preview.yaml
      # EN | Visible to admin accounts only.
      # FR | Visible uniquement par les comptes admin.
      require_admin: true

  resources:
    # EN | HACS-managed custom cards — versioned by HACS itself, no cache-busting.
    # FR | Cartes custom gerees par HACS — versionnees par HACS, pas de
    # FR | cache-busting a appliquer.
    - url: /hacsfiles/button-card/button-card.js
      type: module
    - url: /hacsfiles/lovelace-card-mod/card-mod.js
      type: module
    - url: /hacsfiles/lovelace-layout-card/layout-card.js
      type: module
    - url: /hacsfiles/lovelace-hui-element/stack-in-card.js
      type: module
    - url: /hacsfiles/apexcharts-card/apexcharts-card.js
      type: module
    - url: /hacsfiles/mini-graph-card/mini-graph-card-bundle.js
      type: module
    - url: /hacsfiles/lovelace-config-template-card/config-template-card.js
      type: module
    - url: /hacsfiles/lovelace-decluttering-card/decluttering-card.js
      type: module
    # EN | Visio Sapiens engine — ?v=__VTOKEN__ is replaced at apply time so
    # EN | browsers pick up a new build instead of serving a stale cache.
    # FR | Moteur Visio Sapiens — ?v=__VTOKEN__ est remplace au moment du apply
    # FR | pour que les navigateurs prennent le nouveau build au lieu de servir
    # FR | un cache perime.
    - url: /local/vssp/css/vssp.css?v=__VTOKEN__
      type: css
    - url: /local/vssp/js/vssp.js?v=__VTOKEN__
      type: module
    - url: /local/vssp/components/osv-core.js?v=__VTOKEN__
      type: module
    - url: /local/vssp/components/osv-card.js?v=__VTOKEN__
      type: module
    - url: /local/vssp/components/osv-datetime-card.js?v=__VTOKEN__
      type: module

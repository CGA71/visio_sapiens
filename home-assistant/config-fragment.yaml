# ============================================================================
# Visio Sapiens — Fragment de configuration (ÉTAT DÉSIRÉ)
#
# Ce fichier ne contient QUE les clés de configuration.yaml qu'OSVision gère.
# Il est fusionné dans le configuration.yaml de destination par le script
# osvision_apply_config.py, de façon idempotente : il POSE/MET À JOUR ses
# propres entrées et ne touche à RIEN d'autre dans le fichier cible.
#
# Règles de fusion appliquées par le script (voir osvision_apply_config.py) :
#   • lovelace.dashboards : merge par sous-clé — seules les clés listées ici
#     (préfixe osvision-*) sont écrites ; les autres dashboards de l'utilisateur
#     sont préservés.
#   • lovelace.resources : merge par 'url' — dédupliqué ; les ressources non
#     listées ici sont préservées.
#   • input_text / shell_command / template : merge par clé (préfixe osvision_).
#   • homeassistant.packages : pose la clé de chargement du dossier packages/
#     (utilisée pour les fragments multi-domaines : utility_meter, template…).
#     ⚠ Nécessite que osvision_apply_config.py gère le domaine « homeassistant » ;
#       sinon, poser cette ligne directement dans configuration.yaml.
#
# ⇒ Pour ajouter/modifier/supprimer une ligne de config OSVision, on édite CE
#   fichier. Le patcher se charge de refléter l'état dans la prod.
#
# NB : les tags HA (!include, etc.) sont préservés tels quels par ruamel.
# ============================================================================

homeassistant:
  # Charge tous les fichiers de config/packages/ (dont spvs_energy_totaux.yaml,
  # qui alimente le panneau « Consommation Totale » du dashboard Energy).
  packages: !include_dir_named packages

lovelace:
  dashboards:
    visio-sapiens:
      mode: yaml
      title: Visio-Sapiens
      icon: mdi:hexagon-outline
      show_in_sidebar: true
      filename: dashboards/home.yaml
    visio-sapiens-core:
      mode: yaml
      title: Core System
      icon: mdi:server
      show_in_sidebar: false
      filename: dashboards/views/core.yaml
    visio-sapiens-computer:
      mode: yaml
      title: Computer Room
      icon: mdi:desktop-tower-monitor
      show_in_sidebar: false
      filename: dashboards/views/computer.yaml
    visio-sapiens-energy:
      mode: yaml
      title: Energy Management
      icon: mdi:lightning-bolt
      show_in_sidebar: false
      filename: dashboards/views/energy.yaml
    visio-sapiens-m:
      mode: yaml
      title: Visio-Sapiens
      icon: mdi:hexagon-outline
      show_in_sidebar: true
      filename: dashboards/home_mobile.yaml
    visio-sapiens-energy-m:
      mode: yaml
      title: Energy Management
      icon: mdi:lightning-bolt
      show_in_sidebar: false
      filename: dashboards/views/energy_mobile.yaml
    visio-sapiens-technical:
      mode: yaml
      title: Technical Room
      icon: mdi:tools
      show_in_sidebar: false
      filename: dashboards/views/technical_room.yaml
    visio-sapiens-technical-m:
      mode: yaml
      title: Technical Room
      icon: mdi:cellphone-cog
      show_in_sidebar: false
      filename: dashboards/views/technical_room_mobile.yaml
# ── APERÇU — chaîne de test, non déployée ────────────────────────
    vssp-energy-preview:
      mode: yaml
      title: "ENERGY ⧗ PREVIEW"
      icon: mdi:flask-outline
      show_in_sidebar: true          # passe à false pour le masquer aux autres
      filename: home-assistant/dashboards/views/energy_preview.yaml
      require_admin: true            # visible uniquement par les comptes admin


  resources:
    - url: /hacsfiles/button-card/button-card.js
      type: module
    - url: /hacsfiles/lovelace-card-mod/card-mod.js
      type: module
    - url: /hacsfiles/lovelace-layout-card/layout-card.js
      type: module
    - url: /hacsfiles/lovelace-hui-element/stack-in-card.js
      type: module
    - url: /hacsfiles/apexcharts-card/apexcharts-card.js
      type: module
    - url: /hacsfiles/mini-graph-card/mini-graph-card-bundle.js
      type: module
    - url: /hacsfiles/lovelace-config-template-card/config-template-card.js
      type: module
    - url: /hacsfiles/lovelace-decluttering-card/decluttering-card.js
      type: module
    - url: /local/vssp/css/vssp.css?v=__VTOKEN__
      type: css
    - url: /local/vssp/js/vssp.js?v=__VTOKEN__
      type: module
    - url: /local/vssp/components/osv-core.js?v=__VTOKEN__
      type: module
    - url: /local/vssp/components/osv-card.js?v=__VTOKEN__
      type: module
    - url: /local/vssp/components/osv-datetime-card.js?v=__VTOKEN__
      type: module
    - url: /local/vssp/components/osv-ad-banner-card.js?v=__VTOKEN__
      type: module

<!DOCTYPE html>

<title>Visio Sapiens — AI setup</title>
<!--
  EN | Served as /local/vssp/wizard/vssp_ai_setup.html, inside a browser_mod
  EN | popup. Two ways in: vssp.js opens it the moment the chatbot provider
  EN | is changed on ADMIN > DASHBOARDS (?provider= the new choice), and the
  EN | "Set up the AI" button there opens it for the current choice (no
  EN | ?provider=, the page reads input_select.vssp_chatbot_provider itself).
  EN |
  EN | WHAT IT DOES — the guided setup of the provider through Home
  EN | Assistant's OWN integration (Anthropic, Google Gemini, OpenAI,
  EN | Ollama): the API key is typed into Home Assistant's native form, never
  EN | here. Each step has a button that opens the right Home Assistant
  EN | screen, and a live check read from the parent page's `hass` (config
  EN | entries, entity registry, Assist pipelines — read-only calls, the
  EN | same session the tablet already has). Nothing on this page writes.
  EN |
  EN | Once the integration is there, the Visio Sapiens chatbot and the CORE
  EN | SCAN go through its agent (packages/vssp_chatbot.yaml,
  EN | packages/vssp_core.yaml).
  FR | Servi comme /local/vssp/wizard/vssp_ai_setup.html, dans un popup
  FR | browser_mod. Deux entrees : vssp.js l'ouvre des que le fournisseur du
  FR | chatbot change sur ADMIN > DASHBOARDS (?provider= le nouveau choix), et
  FR | le bouton « Configurer l'IA » de cet ecran l'ouvre pour le choix
  FR | courant (sans ?provider=, la page lit elle-meme
  FR | input_select.vssp_chatbot_provider).
  FR |
  FR | CE QU'ELLE FAIT — la configuration guidee du fournisseur par
  FR | l'integration PROPRE de Home Assistant (Anthropic, Google Gemini,
  FR | OpenAI, Ollama) : la cle API se saisit dans le formulaire natif de Home
  FR | Assistant, jamais ici. Chaque etape a un bouton qui ouvre le bon ecran,
  FR | et une verification en direct lue sur le `hass` de la page parente
  FR | (entrees de configuration, registre des entites, pipelines Assist —
  FR | appels en lecture seule, la session que la tablette a deja). Rien sur
  FR | cette page n'ecrit.
  FR |
  FR | Une fois l'integration en place, le chatbot Visio Sapiens et le SCAN
  FR | de CORE passent par son agent (packages/vssp_chatbot.yaml,
  FR | packages/vssp_core.yaml).
-->
<style>
  :root {
    --bg: #050b12;
    --panel: rgba(8,18,28,0.75);
    --line: rgba(0,229,255,0.28);
    --line-soft: rgba(0,229,255,0.12);
    --cyan: #00E5FF;
    --green: #00FFC3;
    --amber: #FFB84D;
    --red: #FF4D6D;
    --text: #DCEEF6;
    --muted: #8FB6C9;
    --dim: #56707E;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Roboto, "Helvetica Neue", sans-serif;
    font-size: 13px;
    line-height: 1.45;
  }
  body { padding: 0 16px 18px; }
  a { color: var(--cyan); }
  code {
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
    background: rgba(0,229,255,0.08); border-radius: 4px; padding: 1px 4px;
  }
  .header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 0 12px; border-bottom: 1px solid var(--line-soft);
  }
  .logo {
    width: 40px; height: 40px; flex: none; border-radius: 10px;
    display: grid; place-items: center; background: rgba(255,255,255,0.06);
    border: 1px solid var(--line-soft);
  }
  .logo img, .logo svg { width: 26px; height: 26px; }
  h1 {
    font-family: Orbitron, sans-serif; font-size: 14px; letter-spacing: 2px;
    color: var(--cyan); margin: 0; text-transform: uppercase;
  }
  .sub { color: var(--muted); font-size: 11px; margin-top: 2px; }

  .box {
    margin-top: 12px; padding: 10px 12px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line-soft);
  }
  .box h2 {
    margin: 0 0 6px; font-size: 10px; letter-spacing: 1.5px; font-weight: 700;
    color: var(--muted); text-transform: uppercase;
  }
  .status-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; }
  .status-grid .k { color: var(--muted); }
  .status-grid .v { word-break: break-word; }
  .ok { color: var(--green); }
  .warn { color: var(--amber); }
  .bad { color: var(--red); }
  .muted { color: var(--dim); }

  ol.steps { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .step {
    display: grid; grid-template-columns: 30px 1fr; gap: 10px;
    padding: 12px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line-soft);
  }
  .step.done { border-color: rgba(0,255,195,0.35); }
  .num {
    width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; color: var(--cyan); border: 1px solid var(--line);
  }
  .step.done .num { background: rgba(0,255,195,0.14); color: var(--green); border-color: rgba(0,255,195,0.5); }
  .step-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .step h3 { margin: 0; font-size: 13px; }
  .where { color: var(--dim); font-size: 11px; margin-top: 1px; }
  .badge {
    font-size: 10px; letter-spacing: .5px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line-soft); color: var(--muted); white-space: nowrap;
  }
  .badge.ok { border-color: rgba(0,255,195,0.45); color: var(--green); }
  .badge.warn { border-color: rgba(255,184,77,0.5); color: var(--amber); }
  .step ol { margin: 8px 0 0; padding-left: 18px; }
  .step li + li { margin-top: 3px; }
  .actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--cyan); color: #06121A; border: none; border-radius: 10px;
    padding: 8px 14px; font-weight: 700; letter-spacing: .4px; cursor: pointer;
    font-size: 11px; text-transform: uppercase; text-decoration: none;
  }
  .btn.ghost { background: transparent; color: var(--cyan); border: 1px solid var(--line); }
  .note { margin-top: 12px; color: var(--muted); font-size: 12px; }
  .note p { margin: 0; }
  .note p + p { margin-top: 6px; }
</style>
</head>

const CUSTOM_ICON = '<svg viewBox="0 0 24 24" fill="#00E5FF" aria-hidden="true"><path d="M4 1h16a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1m0 8h16a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1m0 8h16a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1M9 5h1V3H9zm0 8h1v-2H9zm0 8h1v-2H9zM5 3v2h2V3zm0 8v2h2v-2zm0 8v2h2v-2z"/></svg>';

const el = (id) => document.getElementById(id);
function t(key, vars) {
  const s = (UI[LANG][key] !== undefined ? UI[LANG][key] : UI.en[key]) || key;
  return s.replace(/\{(\w+)\}/g, (_, n) => (vars && vars[n] !== undefined ? vars[n] : ''));
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// EN | The parent page is Home Assistant itself (browser_mod popups live in
// EN | its document), so its `hass` object is reachable — read-only use.
// FR | La page parente est Home Assistant lui-meme (les popups browser_mod
// FR | vivent dans son document), son objet `hass` est donc joignable —
// FR | usage en lecture seule.
function parentHass() {
  try {
    if (window.parent === window) return null;
    const ha = window.parent.document.querySelector('home-assistant');
    return (ha && ha.hass) || null;
  } catch (e) {
    return null;
  }
}

function resolveProvider() {
  const asked = (params.get('provider') || '').toLowerCase();
  if (PROVIDERS[asked]) return asked;
  const hass = parentHass();
  const st = hass && hass.states[PROVIDER_ENTITY];
  return st && PROVIDERS[st.state] ? st.state : 'claude';
}

const KEY = resolveProvider();
const P = PROVIDERS[KEY];
const TXT = P[LANG];
const DISPLAY = LANG === 'fr' && P.nameFr ? P.nameFr : P.name;

// EN | Home Assistant navigation, from inside the popup: the parent's own
// EN | router (pushState + location-changed, what its links do), then the
// EN | popup closes so the screen it opened is the one in front.
// FR | Navigation Home Assistant, depuis le popup : le routeur du parent
// FR | (pushState + location-changed, ce que font ses liens), puis le popup
// FR | se ferme pour laisser devant l'ecran qu'il vient d'ouvrir.
function go(path) {
  const p = window.parent;
  try {
    if (p === window) throw new Error('not embedded');
    p.history.pushState(null, '', path);
    p.dispatchEvent(new CustomEvent('location-changed', { detail: { replace: false } }));
    if (p.browser_mod && typeof p.browser_mod.service === 'function') {
      p.browser_mod.service('close_popup', {});
    }
  } catch (e) {
    window.open(path, '_blank', 'noopener');
  }
}

const PATHS = {
  add: '/config/integrations/dashboard/add?domain=' + P.domain,
  open: '/config/integrations/integration/' + P.domain,
  assist: '/config/voice-assistants/assistants',
};

function render() {
  el('title').textContent = t('title', { name: DISPLAY });
  el('subtitle').textContent = t('subtitle', { integration: P.integration });
  el('statusTitle').textContent = t('status');
  el('prereqTitle').textContent = t('prereq');
  el('logo').innerHTML = P.logo ? '<img alt="" src="' + P.logo + '">' : CUSTOM_ICON;
  el('prereq').innerHTML = TXT.prereq;

  const ol = el('steps');
  ol.innerHTML = '';
  TXT.steps.forEach((s, i) => {
    const li = document.createElement('li');
    li.className = 'step';
    li.id = 'step' + (i + 1);
    const label = s.btn === 'site' ? s.btnLabel
      : s.btn === 'add' ? t('btn_add', { integration: P.integration })
      : s.btn === 'open' ? t('btn_open')
      : t('btn_assist');
    const button = s.btn === 'site'
      ? '<a class="btn" href="' + P.site + '" target="_blank" rel="noopener noreferrer">' + esc(label) + ' ↗</a>'
      : '<button class="btn" type="button" data-go="' + s.btn + '">' + esc(label) + '</button>';
    li.innerHTML =
      '<div class="num">' + (i + 1) + '</div>' +
      '<div>' +
        '<div class="step-head"><div><h3>' + esc(s.t) + '</h3><div class="where">' + esc(s.where) + '</div></div>' +
        '<span class="badge" id="badge' + (i + 1) + '">' + esc(s.optional ? t('optional') : t('todo')) + '</span></div>' +
        '<ol>' + s.items.map((x) => '<li>' + x + '</li>').join('') + '</ol>' +
        '<div class="actions">' + button + '</div>' +
      '</div>';
    ol.appendChild(li);
  });
  ol.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => go(PATHS[b.dataset.go])));

  if (TXT.altTitle) {
    el('altBox').hidden = false;
    el('altTitle').textContent = TXT.altTitle;
    el('altText').innerHTML = TXT.altText;
    el('altBtn').textContent = TXT.altBtn;
    el('altBtn').addEventListener('click', () => {
      location.href = 'vssp_chatbot.html?mode=custom&lang=' + LANG;
    });
  }

  el('note').innerHTML = '<p>' + esc(t('note_agent')) + '</p><p>' + esc(t('note_default')) + '</p>' +
    (KEY === 'custom' ? '<p>' + esc(t('note_custom')) + '</p>' : '');
}

function setBadge(n, state) {
  const b = el('badge' + n);
  const li = el('step' + n);
  if (!b || !li) return;
  const s = TXT.steps[n - 1];
  b.className = 'badge' + (state === 'done' ? ' ok' : state === 'warn' ? ' warn' : '');
  b.textContent = state === 'done' ? '✓ ' + t('done') : s.optional ? t('optional') : t('todo');
  li.classList.toggle('done', state === 'done');
}

function row(k, v, cls) {
  return '<div class="k">' + esc(k) + '</div><div class="v ' + (cls || '') + '">' + esc(v) + '</div>';
}

// EN | Everything read here is read-only: config entries of one domain, the
// EN | entity and device registries already in `hass`, the Assist pipelines.
// FR | Tout ce qui est lu ici l'est en lecture seule : les entrees de
// FR | configuration d'un domaine, les registres d'entites et d'appareils
// FR | deja dans `hass`, les pipelines Assist.
async function refresh() {
  const box = el('status');
  const hass = parentHass();
  if (!hass) {
    box.innerHTML = '<div class="v muted" style="grid-column:1/-1">' + esc(t('no_hass')) + '</div>';
    return;
  }
  if (hass.user && !hass.user.is_admin) {
    box.innerHTML = '<div class="v muted" style="grid-column:1/-1">' + esc(t('not_admin')) + '</div>';
    return;
  }
  let entries = [];
  let pipes = null;
  try {
    entries = await hass.callWS({ type: 'config_entries/get', domain: P.domain });
  } catch (e) { /* keep empty */ }
  try {
    pipes = await hass.callWS({ type: 'assist_pipeline/pipeline/list' });
  } catch (e) { /* Assist not loaded */ }

  const loaded = entries.find((e) => e.state === 'loaded');
  const anyEntry = entries[0];
  const agent = Object.keys(hass.entities || {}).find((id) =>
    id.startsWith('conversation.') && hass.entities[id].platform === P.domain &&
    (!hass.states[id] || hass.states[id].state !== 'unavailable'));
  let model = '';
  if (agent) {
    const dev = hass.devices && hass.devices[hass.entities[agent].device_id];
    model = (dev && dev.model) || '';
  }
  let engine = '';
  if (pipes && pipes.pipelines) {
    const pref = pipes.pipelines.find((p) => p.id === pipes.preferred_pipeline) || pipes.pipelines[0];
    engine = (pref && pref.conversation_engine) || '';
  }
  const isDefault = !!agent && (engine === agent || (loaded && engine === loaded.entry_id));
  const endpointState = hass.states[CUSTOM_ENDPOINT];
  const endpoint = endpointState && !['', 'unknown', 'unavailable'].includes(endpointState.state) ? endpointState.state : '';

  let html = '';
  if (loaded) html += row(t('st_integration'), t('installed') + ' · ' + loaded.title, 'ok');
  else if (anyEntry) html += row(t('st_integration'), t('not_running', { state: anyEntry.state }), 'warn');
  else html += row(t('st_integration'), t('missing'), 'bad');
  html += row(t('st_agent'), agent || t('none'), agent ? 'ok' : 'muted');
  html += row(t('st_model'), model || t('none'), model ? '' : 'muted');
  html += row(t('st_default'), isDefault ? t('yes') : t('no', { engine: engine || t('none') }), isDefault ? 'ok' : 'muted');
  if (KEY === 'custom' && endpoint) html += row(t('st_chatbot'), t('via_form', { url: endpoint }), 'ok');
  else if (agent) html += row(t('st_chatbot'), t('via_agent', { agent }), 'ok');
  else html += row(t('st_chatbot'), t('via_key'), 'warn');
  box.innerHTML = html;

  setBadge(1, anyEntry ? 'done' : '');
  setBadge(2, loaded ? 'done' : anyEntry ? 'warn' : '');
  setBadge(3, agent ? 'done' : '');
  setBadge(4, isDefault ? 'done' : '');
}

render();
refresh();
setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 5000);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visio Sapiens — Design system editor</title>
<!--
  EN | Served as /local/vssp/wizard/vssp_theme_editor.html, embedded in the
  EN | ADMIN view's THEME screen through an iframe — same mechanism as
  EN | assign.html and vssp_rooms_floors.html.
  EN |
  EN | WHY A WEBHOOK AND NOT THE REST API — copied verbatim from assign.html,
  EN | it applies identically here: an iframe cannot reach the `hass` object
  EN | of the parent page, and the REST API needs a Bearer token. A webhook
  EN | needs none, and `local_only: true` keeps it on the LAN — the webhook
  EN | id is the only secret, and it never leaves the local network.
  FR | Servi comme /local/vssp/wizard/vssp_theme_editor.html, integre dans
  FR | l'ecran THEME de la vue ADMIN via une iframe — meme mecanique que
  FR | assign.html et vssp_rooms_floors.html.
  FR |
  FR | POURQUOI UN WEBHOOK ET PAS L'API REST — repris tel quel d'assign.html,
  FR | cela s'applique ici a l'identique : une iframe ne peut pas atteindre
  FR | l'objet `hass` de la page parente, et l'API REST exige un jeton
  FR | Bearer. Un webhook n'en exige aucun, et `local_only: true` le maintient
  FR | sur le reseau local — l'identifiant du webhook est le seul secret, et
  FR | il ne quitte jamais le reseau local.
-->
<style>
  :root {
    --bg: #050b12;
    --panel: rgba(8,18,28,0.75);
    --line: rgba(0,229,255,0.28);
    --line-soft: rgba(0,229,255,0.12);
    --cyan: #00E5FF;
    --green: #00FFC3;
    --red: #FF4D6D;
    --text: #DCEEF6;
    --muted: #8FB6C9;
    --dim: #56707E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px;
    background: transparent;
    color: var(--text);
    font-family: -apple-system, Roboto, "Helvetica Neue", sans-serif;
    font-size: 13px;
  }
  h1 {
    font-family: Orbitron, sans-serif; font-size: 14px; letter-spacing: 2px;
    color: var(--cyan); margin: 0 0 4px 0; text-transform: uppercase;
  }
  .sub { color: var(--muted); font-size: 11px; margin-bottom: 12px; }
  .header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line);
    display: grid; place-items: center; color: var(--cyan); font-size: 17px;
    box-shadow: 0 0 18px rgba(0,229,255,.18); flex: none;
  }
  .header h1 { margin: 0; }
  .header .sub-label { margin: 2px 0 0; font-size: 10px; letter-spacing: 2px; color: var(--dim); }

  .layout { display: grid; grid-template-columns: minmax(320px, 1fr) 280px; gap: 16px; align-items: start; }
  @media (max-width: 780px) { .layout { grid-template-columns: 1fr; } }

  .wrap {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 4px 4px 10px;
  }
  .group-title {
    font-family: Orbitron, sans-serif; font-size: 10px; letter-spacing: 1.5px;
    color: var(--muted); text-transform: uppercase; padding: 12px 12px 6px;
  }
  .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 10px; padding: 0 10px 8px; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; }
  .field label { color: var(--text); font-size: 12px; }
  .field .hint { color: var(--dim); font-size: 9px; display: block; }
  input[type=color] {
    width: 34px; height: 26px; padding: 0; border: 1px solid var(--line-soft);
    border-radius: 6px; background: transparent; cursor: pointer;
  }
  input[type=text] {
    width: 150px; background: rgba(0,0,0,.30); color: var(--text);
    border: 1px solid var(--line-soft); border-radius: 8px;
    padding: 5px 8px; font-size: 11px; font-family: ui-monospace, monospace;
  }
  input[type=range] { width: 120px; accent-color: var(--cyan); }
  .range-val { color: var(--muted); font-size: 11px; width: 34px; text-align: right; }

  .bar {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    margin-top: 14px;
  }
  button {
    background: rgba(0,229,255,.10); color: var(--cyan);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 14px; font-family: Orbitron, sans-serif; font-size: 11px;
    letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
  }
  button:hover { background: rgba(0,229,255,.20); }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--line-soft); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .msg {
    margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 12px;
    display: none; white-space: pre-line;
  }
  .msg.ok  { display: block; background: rgba(0,255,195,.08); border: 1px solid rgba(0,255,195,.35); color: var(--green); }
  .msg.err { display: block; background: rgba(255,77,109,.08); border: 1px solid rgba(255,77,109,.35); color: var(--red); }

  /* EN | Live preview — a self-contained mock, styled ONLY from --p-* custom
     EN | properties JS sets on #preview at every input change. Nothing here
     EN | reads the real Visio Sapiens theme: this is a rehearsal, not the
     EN | thing itself.
     FR | Apercu live — une maquette autonome, stylee UNIQUEMENT via les
     FR | proprietes personnalisees --p-* que JS pose sur #preview a chaque
     FR | changement. Rien ici ne lit le vrai theme Visio Sapiens : c'est une
     FR | repetition, pas la chose elle-meme. */
  #preview {
    position: sticky; top: 0;
    border-radius: 14px; overflow: hidden; border: 1px solid var(--line-soft);
    background: var(--p-background, #050B12);
    font-family: -apple-system, Roboto, sans-serif;
  }
  #preview .p-header {
    background: var(--p-header-background, #08121C);
    color: var(--p-header-text, #00E5FF);
    font-family: Orbitron, sans-serif; font-size: 10px; letter-spacing: 1.5px;
    padding: 10px 12px; text-transform: uppercase;
  }
  #preview .p-body { display: flex; }
  #preview .p-sidebar {
    width: 64px; background: var(--p-sidebar-background, #050B12);
    padding: 10px 6px; display: flex; flex-direction: column; gap: 8px;
  }
  #preview .p-sidebar .p-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--p-sidebar-text, #B8E8F5); font-size: 8px;
  }
  #preview .p-sidebar .p-item .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--p-sidebar-icon, #00E5FF);
  }
  #preview .p-sidebar .p-item.selected {
    background: var(--p-sidebar-selected-background, rgba(0,229,255,.10));
    border-radius: 8px; color: var(--p-sidebar-selected-text, #00E5FF);
  }
  #preview .p-sidebar .p-item.selected .dot { background: var(--p-sidebar-selected-icon, #00E5FF); }
  #preview .p-content { flex: 1; padding: 12px; }
  #preview .p-card {
    background: var(--p-card-background, rgba(16,27,39,.85));
    border: var(--p-card-border-width, 1px) solid var(--p-divider, #1F3448);
    border-radius: var(--p-card-radius, 18px);
    padding: 12px; color: var(--p-text-primary, #fff);
  }
  #preview .p-card .p-muted { color: var(--p-text-secondary, #B8E8F5); font-size: 10px; margin-top: 4px; }
  #preview .p-card .p-btn {
    display: inline-block; margin-top: 10px; padding: 6px 10px;
    border-radius: 8px; font-size: 10px; font-family: Orbitron, sans-serif;
    letter-spacing: 1px; text-transform: uppercase;
    background: var(--p-primary, #00E5FF); color: #04141B;
  }
  #preview .p-card .p-btn.accent { background: var(--p-accent, #00FFD5); margin-left: 6px; }
  #preview .p-dialog {
    margin: 10px 12px 12px; padding: 10px;
    background: var(--p-dialog-scrim, rgba(2,5,11,.75));
    border-radius: var(--p-dialog-radius, 20px);
    font-size: 9px; color: var(--p-text-secondary, #B8E8F5);
  }
</style>
</head>
<body>
<div class="header">
  <div class="logo">⬡</div>
  <div>
    <h1>VISIO SAPIENS</h1>
    <p class="sub-label">DESIGN SYSTEM EDITOR</p>
  </div>
</div>
<div class="sub" id="subtitle">Loading…</div>

<div class="layout">
  <div>
    <div class="wrap" id="form"></div>

    <div class="bar">
      <button id="apply">Apply</button>
      <button class="ghost" id="export">Export</button>
      <button class="ghost" id="importBtn">Import</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
      <button class="ghost" id="reset">Reset to defaults</button>
      <button class="ghost" id="reload">Reload</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div id="preview">
    <div class="p-header">VISIO SAPIENS</div>
    <div class="p-body">
      <div class="p-sidebar">
        <div class="p-item"><div class="dot"></div>HOME</div>
        <div class="p-item selected"><div class="dot"></div>THEME</div>
        <div class="p-item"><div class="dot"></div>ENERGY</div>
      </div>
      <div class="p-content">
        <div class="p-card">
          Living room
          <div class="p-muted">21.4°C · 3 devices on</div>
          <span class="p-btn">Apply</span>
          <span class="p-btn accent">Preview</span>
        </div>
      </div>
    </div>
    <div class="p-dialog">Popup dialog preview (browser_mod)</div>
  </div>
</div>

<script>
// EN | Written by generate_dashboards.py --only theme, refreshed on every
// EN | APPLY. Same file shape the webhook payload accepts back (`tokens`),
// EN | via the shared vssp_design_fields.FIELDS table server-side.
// FR | Ecrit par generate_dashboards.py --only theme, rafraichi a chaque
// FR | APPLIQUER. Meme forme que ce que le payload du webhook accepte en
// FR | retour (`tokens`), via la table partagee vssp_design_fields.FIELDS
// FR | cote serveur.
const STATUS_URL = '/local/vssp/design_system_status.json';
const WEBHOOK = '/api/webhook/vssp_theme';

// EN | Mirrors model/design_system.yaml's factory values — used as a
// EN | fallback when STATUS_URL is not reachable yet (first run, before any
// EN | `--only theme` generation) and as the RESET TO DEFAULTS target.
// FR | Reprend les valeurs d'usine de model/design_system.yaml — sert de
// FR | repli quand STATUS_URL n'est pas encore atteignable (premier lancement,
// FR | avant toute generation --only theme) et de cible pour REINITIALISER.
const DEFAULTS = {
  primary: '#00E5FF', accent: '#00FFD5',
  background: '#050B12', background_secondary: '#101B27',
  card_background: 'rgba(16,27,39,0.85)',
  text_primary: '#FFFFFF', text_secondary: '#B8E8F5',
  header_background: '#08121C', header_text: '#00E5FF',
  divider: '#1F3448',
  icon_default: '#00E5FF', icon_active: '#00FFD5',
  card_radius: '18px', card_border_width: '1px', dialog_radius: '20px',
  dialog_scrim: 'rgba(2,5,11,0.75)',
  sidebar_background: '#050B12', sidebar_text: '#B8E8F5', sidebar_icon: '#00E5FF',
  sidebar_selected_background: 'rgba(0,229,255,0.10)',
  sidebar_selected_text: '#00E5FF', sidebar_selected_icon: '#00E5FF',
  bubble_backdrop: 'transparent',
};

// EN | type/group drive the form only. The server (vssp_design_fields.py) is
// EN | the authority on what is actually valid — this page's regexes are a
// EN | courtesy to catch typos before a round trip, not the real gate.
// FR | type/group ne pilotent que le formulaire. Le serveur
// FR | (vssp_design_fields.py) fait autorite sur ce qui est reellement
// FR | valide — les regex de cette page sont une aide pour attraper une
// FR | faute avant l'aller-retour, pas le vrai controle.
const FIELDS = [
  { key: 'primary', label: 'Primary', type: 'color', group: 'Palette' },
  { key: 'accent', label: 'Accent', type: 'color', group: 'Palette' },
  { key: 'background', label: 'Background', type: 'color', group: 'Palette' },
  { key: 'background_secondary', label: 'Background (secondary)', type: 'color', group: 'Palette' },
  { key: 'card_background', label: 'Card background', type: 'text', group: 'Palette', hint: 'hex or rgba()' },
  { key: 'text_primary', label: 'Text (primary)', type: 'color', group: 'Palette' },
  { key: 'text_secondary', label: 'Text (secondary)', type: 'color', group: 'Palette' },
  { key: 'header_background', label: 'Header background', type: 'color', group: 'Header' },
  { key: 'header_text', label: 'Header text', type: 'color', group: 'Header' },
  { key: 'divider', label: 'Divider', type: 'color', group: 'Icons & divider' },
  { key: 'icon_default', label: 'Icon (default)', type: 'color', group: 'Icons & divider' },
  { key: 'icon_active', label: 'Icon (active)', type: 'color', group: 'Icons & divider' },
  { key: 'sidebar_background', label: 'Sidebar background', type: 'color', group: 'Sidebar' },
  { key: 'sidebar_text', label: 'Sidebar text', type: 'color', group: 'Sidebar' },
  { key: 'sidebar_icon', label: 'Sidebar icon', type: 'color', group: 'Sidebar' },
  { key: 'sidebar_selected_background', label: 'Sidebar selected background', type: 'text', group: 'Sidebar', hint: 'hex or rgba()' },
  { key: 'sidebar_selected_text', label: 'Sidebar selected text', type: 'color', group: 'Sidebar' },
  { key: 'sidebar_selected_icon', label: 'Sidebar selected icon', type: 'color', group: 'Sidebar' },
  { key: 'card_radius', label: 'Card radius', type: 'range', group: 'Shape', min: 0, max: 60 },
  { key: 'card_border_width', label: 'Card border width', type: 'range', group: 'Shape', min: 0, max: 10 },
  { key: 'dialog_radius', label: 'Dialog radius', type: 'range', group: 'Shape', min: 0, max: 60 },
  { key: 'dialog_scrim', label: 'Dialog scrim', type: 'text', group: 'Shape', hint: 'hex or rgba()' },
  { key: 'bubble_backdrop', label: 'Bubble backdrop', type: 'text', group: 'Shape', hint: 'hex, rgba() or "transparent"' },
];

const HEX_RE = /^#[0-9A-Fa-f]{6}$/;
const RGBA_RE = /^rgba\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*(0|1|0?\.\d+)\s*\)$/;
const LENGTH_RE = /^\d{1,3}px$/;

const el = (id) => document.getElementById(id);
let VALUES = { ...DEFAULTS };

function isColor(v) { return HEX_RE.test(v) || RGBA_RE.test(v); }

function buildForm() {
  const wrap = el('form');
  wrap.innerHTML = '';
  const groups = [...new Set(FIELDS.map(f => f.group))];
  groups.forEach(group => {
    const title = document.createElement('div');
    title.className = 'group-title';
    title.textContent = group;
    wrap.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'fields';
    FIELDS.filter(f => f.group === group).forEach(f => {
      const row = document.createElement('div');
      row.className = 'field';
      const label = document.createElement('label');
      label.textContent = f.label;
      label.htmlFor = 'f_' + f.key;
      if (f.hint) {
        const hint = document.createElement('span');
        hint.className = 'hint'; hint.textContent = f.hint;
        label.appendChild(hint);
      }
      row.appendChild(label);

      if (f.type === 'color') {
        const input = document.createElement('input');
        input.type = 'color'; input.id = 'f_' + f.key;
        input.addEventListener('input', () => onChange(f.key, input.value));
        row.appendChild(input);
      } else if (f.type === 'range') {
        const box = document.createElement('div');
        box.style.display = 'flex'; box.style.alignItems = 'center'; box.style.gap = '6px';
        const input = document.createElement('input');
        input.type = 'range'; input.id = 'f_' + f.key;
        input.min = f.min; input.max = f.max;
        const out = document.createElement('span');
        out.className = 'range-val';
        input.addEventListener('input', () => {
          out.textContent = input.value + 'px';
          onChange(f.key, input.value + 'px');
        });
        box.append(input, out);
        row.appendChild(box);
      } else {
        const input = document.createElement('input');
        input.type = 'text'; input.id = 'f_' + f.key;
        input.addEventListener('input', () => onChange(f.key, input.value));
        row.appendChild(input);
      }
      grid.appendChild(row);
    });
    wrap.appendChild(grid);
  });
}

function setFormValues(values) {
  FIELDS.forEach(f => {
    const v = values[f.key];
    if (v === undefined) return;
    const input = el('f_' + f.key);
    if (!input) return;
    if (f.type === 'color') {
      // EN | A native color input only accepts #RRGGBB — rgba() fields use a
      // EN | plain text input instead (see FIELDS), so this always gets a hex.
      // FR | Un input color natif n'accepte que #RRGGBB — les champs rgba()
      // FR | utilisent un input texte simple (voir FIELDS), donc ceci recoit
      // FR | toujours un hex.
      input.value = v;
    } else if (f.type === 'range') {
      input.value = parseInt(v, 10) || 0;
      input.dispatchEvent(new Event('input'));
    } else {
      input.value = v;
    }
  });
}

function onChange(key, value) {
  VALUES[key] = value;
  updatePreview();
}

function updatePreview() {
  const p = el('preview');
  Object.keys(VALUES).forEach(key => {
    p.style.setProperty('--p-' + key.replace(/_/g, '-'), VALUES[key]);
  });
}

function show(kind, text) {
  const m = el('msg');
  m.className = 'msg ' + kind;
  m.textContent = text;
}

async function load() {
  show('', '');
  let values = { ...DEFAULTS };
  try {
    const res = await fetch(STATUS_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      values = { ...DEFAULTS, ...data };
      el('subtitle').textContent = 'Loaded from ' + STATUS_URL;
    } else {
      el('subtitle').textContent = 'No generated theme yet — showing factory defaults.';
    }
  } catch (e) {
    el('subtitle').textContent = 'No generated theme yet — showing factory defaults.';
  }
  VALUES = values;
  setFormValues(VALUES);
  updatePreview();
}

el('reload').addEventListener('click', load);

el('reset').addEventListener('click', () => {
  VALUES = { ...DEFAULTS };
  setFormValues(VALUES);
  updatePreview();
  show('ok', 'Form reset to factory defaults. Nothing was sent yet — click Apply to save.');
});

el('export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ tokens: VALUES }, null, 2)],
    { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'vssp_design_system.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});

el('importBtn').addEventListener('click', () => el('importFile').click());
el('importFile').addEventListener('change', async () => {
  const file = el('importFile').files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    const tokens = data.tokens || data;
    VALUES = { ...VALUES, ...tokens };
    setFormValues(VALUES);
    updatePreview();
    show('ok', 'Imported. Nothing was sent yet — check the preview, then click Apply.');
  } catch (e) {
    show('err', 'Could not read that file (' + e.message + ').');
  } finally {
    el('importFile').value = '';
  }
});

el('apply').addEventListener('click', async () => {
  // EN | Client-side pre-check only — courtesy, not the gate. The server
  // EN | (vssp_design_fields.validate) re-checks every token independently
  // EN | and is the one that decides what actually gets written.
  // FR | Pre-controle cote client uniquement — une aide, pas le controle. Le
  // FR | serveur (vssp_design_fields.validate) revalide chaque token
  // FR | independamment et est le seul a decider de ce qui est reellement
  // FR | ecrit.
  const bad = [];
  FIELDS.forEach(f => {
    const v = VALUES[f.key];
    let ok;
    if (f.type === 'range') ok = LENGTH_RE.test(v);
    else if (f.key === 'bubble_backdrop') ok = v === 'transparent' || isColor(v);
    else ok = isColor(v);
    if (!ok) bad.push(f.key);
  });
  if (bad.length) {
    show('err', 'Fix these fields before applying: ' + bad.join(', '));
    return;
  }

  const payload = JSON.stringify({ tokens: VALUES });
  // EN | base64 so the shell_command receives one inert argument — rgba()
  // EN | values carry parentheses and commas, and quoting them through a
  // EN | shell is exactly the kind of thing that breaks silently.
  // FR | base64 pour que le shell_command recoive un seul argument inerte —
  // FR | les valeurs rgba() portent des parentheses et des virgules, et les
  // FR | echapper a travers un shell est precisement le genre de chose qui
  // FR | casse en silence.
  const b64 = btoa(unescape(encodeURIComponent(payload)));
  el('apply').disabled = true;
  show('ok', 'Sending…');
  try {
    const res = await fetch(WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content_b64: b64 }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    show('ok', 'Sent. The theme is being regenerated and reloaded live —\n'
      + 'watch the Home Assistant notifications. No page reload needed.');
  } catch (e) {
    show('err', 'Send failed (' + e.message + ').\n'
      + 'Check that the webhook automation is loaded and that this browser '
      + 'is on the local network (local_only).');
  } finally {
    el('apply').disabled = false;
  }
});

buildForm();
load();
</script>
</body>
</html>

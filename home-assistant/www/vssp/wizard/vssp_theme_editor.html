<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visio Sapiens — Design system editor</title>
<!--
  EN | Served as /local/vssp/wizard/vssp_theme_editor.html, embedded in the
  EN | ADMIN view's THEME screen through an iframe — same mechanism as
  EN | assign.html and vssp_rooms_floors.html.
  EN |
  EN | WHY A WEBHOOK AND NOT THE REST API — copied verbatim from assign.html,
  EN | it applies identically here: an iframe cannot reach the `hass` object
  EN | of the parent page, and the REST API needs a Bearer token. A webhook
  EN | needs none, and `local_only: true` keeps it on the LAN — the webhook
  EN | id is the only secret, and it never leaves the local network.
  FR | Servi comme /local/vssp/wizard/vssp_theme_editor.html, integre dans
  FR | l'ecran THEME de la vue ADMIN via une iframe — meme mecanique que
  FR | assign.html et vssp_rooms_floors.html.
  FR |
  FR | POURQUOI UN WEBHOOK ET PAS L'API REST — repris tel quel d'assign.html,
  FR | cela s'applique ici a l'identique : une iframe ne peut pas atteindre
  FR | l'objet `hass` de la page parente, et l'API REST exige un jeton
  FR | Bearer. Un webhook n'en exige aucun, et `local_only: true` le maintient
  FR | sur le reseau local — l'identifiant du webhook est le seul secret, et
  FR | il ne quitte jamais le reseau local.
-->
<style>
  :root {
    --bg: #050b12;
    --panel: rgba(8,18,28,0.75);
    --line: rgba(0,229,255,0.28);
    --line-soft: rgba(0,229,255,0.12);
    --cyan: #00E5FF;
    --green: #00FFC3;
    --red: #FF4D6D;
    --text: #DCEEF6;
    --muted: #8FB6C9;
    --dim: #56707E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px;
    background: transparent;
    color: var(--text);
    font-family: -apple-system, Roboto, "Helvetica Neue", sans-serif;
    font-size: 13px;
  }
  h1 {
    font-family: Orbitron, sans-serif; font-size: 14px; letter-spacing: 2px;
    color: var(--cyan); margin: 0 0 4px 0; text-transform: uppercase;
  }
  .sub { color: var(--muted); font-size: 11px; margin-bottom: 12px; }
  .header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line);
    display: grid; place-items: center; color: var(--cyan); font-size: 17px;
    box-shadow: 0 0 18px rgba(0,229,255,.18); flex: none;
  }
  .header h1 { margin: 0; }
  .header .sub-label { margin: 2px 0 0; font-size: 10px; letter-spacing: 2px; color: var(--dim); }

  .layout { display: grid; grid-template-columns: minmax(280px, 1fr) 500px; gap: 16px; align-items: start; }
  @media (max-width: 780px) { .layout { grid-template-columns: 1fr; } }

  .wrap {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 4px 4px 10px;
  }
  .group-title {
    font-family: Orbitron, sans-serif; font-size: 10px; letter-spacing: 1.5px;
    color: var(--muted); text-transform: uppercase; padding: 12px 12px 6px;
  }
  /* EN | One card per field — label always directly above its own control,
     EN | inside a visible boundary. Was label-left/control-right in a shared
     EN | row (justify-content: space-between); at some widths auto-fill
     EN | settled on a column count where a long label ("Background
     EN | (secondary)", "Sidebar selected background") wrapped to two lines
     EN | while its control stayed pinned to the row's right edge, so the
     EN | control visually landed next to the FOLLOWING field's label instead
     EN | of its own — reported as "a lone box with no label". Stacking
     EN | vertically inside a bordered card makes the pairing unambiguous
     EN | regardless of column count or label length.
     FR | Une carte par champ — l'etiquette toujours directement au-dessus de
     FR | son propre controle, dans un cadre visible. C'etait etiquette a
     FR | gauche / controle a droite dans une ligne partagee
     FR | (justify-content: space-between) ; a certaines largeurs auto-fill
     FR | retenait un nombre de colonnes ou une etiquette longue
     FR | ("Background (secondary)", "Sidebar selected background") passait
     FR | sur deux lignes pendant que son controle restait colle au bord droit
     FR | de la ligne, donc le controle atterrissait visuellement a cote de
     FR | l'etiquette du champ SUIVANT plutot que la sienne — signale comme
     FR | « une case seule sans etiquette ». Empiler verticalement dans une
     FR | carte encadree rend l'association sans ambiguite, quel que soit le
     FR | nombre de colonnes ou la longueur de l'etiquette. */
  .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 8px; padding: 0 10px 10px; }
  .field {
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    padding: 8px 10px; background: rgba(255,255,255,.03);
    border: 1px solid var(--line-soft); border-radius: 8px;
  }
  .field label { color: var(--text); font-size: 11px; }
  .field .hint { color: var(--dim); font-size: 9px; display: block; margin-top: 1px; }
  input[type=color] {
    width: 34px; height: 26px; padding: 0; border: 1px solid var(--line-soft);
    border-radius: 6px; background: transparent; cursor: pointer;
  }
  input[type=text] {
    width: 150px; background: rgba(0,0,0,.30); color: var(--text);
    border: 1px solid var(--line-soft); border-radius: 8px;
    padding: 5px 8px; font-size: 11px; font-family: ui-monospace, monospace;
  }
  input[type=range] { width: 120px; accent-color: var(--cyan); }
  .range-val { color: var(--muted); font-size: 11px; width: 34px; text-align: right; }

  /* EN | Swatch + popover — a real color-with-alpha picker for the rgba()
     EN | tokens (card_background, selector_background,
     EN | sidebar_selected_background, dialog_scrim, bubble_backdrop). A
     EN | native <input type=color> can't carry alpha, so this pairs one
     EN | with a range slider, painted over a checkerboard so transparency
     EN | is visible. The underlying text input is still there (typing a
     EN | value directly still works) — the popover just writes into it and
     EN | reads back from it when opened.
     FR | Pastille + popover — un vrai selecteur couleur+transparence pour les
     FR | tokens rgba() (card_background, selector_background,
     FR | sidebar_selected_background,
     FR | dialog_scrim, bubble_backdrop). Un <input type=color> natif ne porte
     FR | pas de canal alpha, donc ceci associe un input color a un curseur,
     FR | peint sur un damier pour que la transparence reste visible.
     FR | L'input texte sous-jacent existe toujours (le saisir directement
     FR | marche encore) — le popover ecrit dedans et relit depuis lui a
     FR | l'ouverture. */
  .rgba-field { position: relative; display: flex; align-items: center; gap: 6px; width: 100%; }
  .rgba-field input[type=text] { flex: 1; min-width: 0; width: auto; }
  .swatch {
    width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line-soft); flex: none;
    background-image:
      linear-gradient(45deg, #333 25%, transparent 25%), linear-gradient(-45deg, #333 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #333 75%), linear-gradient(-45deg, transparent 75%, #333 75%);
    background-size: 8px 8px; background-position: 0 0, 0 4px, 4px -4px, -4px 0px;
  }
  .swatch-fill { width: 100%; height: 100%; border-radius: 5px; }
  .popover {
    display: none; position: absolute; top: 32px; left: 0; z-index: 20;
    background: #0A1420; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; gap: 8px; flex-direction: column;
    box-shadow: 0 8px 24px rgba(0,0,0,.5); width: 190px;
  }
  .popover.open { display: flex; }
  .popover-row { display: flex; align-items: center; gap: 8px; }
  .popover-row label { color: var(--muted); font-size: 10px; flex: 1; }
  .popover .alpha-val { color: var(--text); font-size: 10px; width: 30px; text-align: right; }
  .popover .transparent-toggle { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); }

  .bar {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    margin-top: 14px;
  }
  button {
    background: rgba(0,229,255,.10); color: var(--cyan);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 14px; font-family: Orbitron, sans-serif; font-size: 11px;
    letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
  }
  button:hover { background: rgba(0,229,255,.20); }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--line-soft); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .msg {
    margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 12px;
    display: none; white-space: pre-line;
  }
  .msg.ok  { display: block; background: rgba(0,255,195,.08); border: 1px solid rgba(0,255,195,.35); color: var(--green); }
  .msg.err { display: block; background: rgba(255,77,109,.08); border: 1px solid rgba(255,77,109,.35); color: var(--red); }

  /* EN | Live preview — a self-contained mock, styled ONLY from --p-* custom
     EN | properties JS sets on #preview at every input change. Nothing here
     EN | reads the real Visio Sapiens theme: this is a rehearsal, not the
     EN | thing itself.
     FR | Apercu live — une maquette autonome, stylee UNIQUEMENT via les
     FR | proprietes personnalisees --p-* que JS pose sur #preview a chaque
     FR | changement. Rien ici ne lit le vrai theme Visio Sapiens : c'est une
     FR | repetition, pas la chose elle-meme. */
  #preview {
    position: sticky; top: 0;
    border-radius: 14px; overflow: hidden; border: 1px solid var(--line-soft);
    background: var(--p-background, #050B12);
    font-family: -apple-system, Roboto, sans-serif;
  }
  #preview .p-header {
    background: var(--p-header-background, #08121C);
    color: var(--p-header-text, #00E5FF);
    font-family: Orbitron, sans-serif; font-size: 10px; letter-spacing: 1.5px;
    padding: 10px 12px; text-transform: uppercase;
  }
  #preview .p-body { display: flex; }
  /* EN | The mock nav rail now carries a couple of room entries alongside
     EN | the system ones, and a selected item, so it reads as a small copy
     EN | of the real rail (_nav.j2 / vssp_nav_button) rather than a generic
     EN | 3-item placeholder — asked for explicitly ("un mini dashboard home
     EN | avec le nav et le header").
     FR | Le bandeau maquette porte desormais quelques pieces a cote des
     FR | entrees systeme, plus un element selectionne, pour se lire comme une
     FR | petite copie du vrai bandeau (_nav.j2 / vssp_nav_button) plutot
     FR | qu'un generique a 3 entrees — demande explicitement (« un mini
     FR | dashboard home avec le nav et le header »). */
  #preview .p-sidebar {
    width: 84px; background: var(--p-sidebar-background, #050B12);
    padding: 10px 6px; display: flex; flex-direction: column; gap: 6px;
  }
  #preview .p-sidebar .p-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--p-sidebar-text, #B8E8F5); font-size: 8px; padding: 4px 2px;
    border-radius: 6px;
  }
  #preview .p-sidebar .p-item .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--p-sidebar-icon, #00E5FF);
  }
  #preview .p-sidebar .p-item.selected {
    background: var(--p-sidebar-selected-background, rgba(0,229,255,.10));
    color: var(--p-sidebar-selected-text, #00E5FF);
  }
  #preview .p-sidebar .p-item.selected .dot { background: var(--p-sidebar-selected-icon, #00E5FF); }
  #preview .p-sidebar .p-divider { height: 1px; background: var(--p-divider, #1F3448); margin: 4px 4px; }
  #preview .p-content { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  #preview .p-card {
    background: var(--p-card-background, rgba(16,27,39,.85));
    border: var(--p-card-border-width, 1px) solid var(--p-divider, #1F3448);
    border-radius: var(--p-card-radius, 18px);
    padding: 12px; color: var(--p-text-primary, #fff);
  }
  #preview .p-card .p-muted { color: var(--p-text-secondary, #B8E8F5); font-size: 10px; margin-top: 4px; }
  #preview .p-card .p-btn {
    display: inline-block; margin-top: 10px; padding: 6px 10px;
    border-radius: 8px; font-size: 10px; font-family: Orbitron, sans-serif;
    letter-spacing: 1px; text-transform: uppercase;
    background: var(--p-primary, #00E5FF); color: #04141B;
  }
  #preview .p-card .p-btn.accent { background: var(--p-accent, #00FFD5); margin-left: 6px; }
  /* EN | "Infos below" — a small KPI row, the same idea as the real HOME
     EN | dashboard's System/Energy/Rooms status row, so the preview shows
     EN | more than one lone card ("quelques infos en-dessous ... pour
     EN | visualiser une vraie preview").
     FR | « Infos en-dessous » — une petite ligne de KPI, meme idee que la
     FR | ligne de statut Systeme/Energie/Pieces du vrai dashboard HOME, pour
     FR | que l'apercu montre plus qu'une carte isolee (« quelques infos
     FR | en-dessous ... pour visualiser une vraie preview »). */
  #preview .p-kpis { display: flex; gap: 8px; }
  #preview .p-kpi {
    flex: 1; background: var(--p-card-background, rgba(16,27,39,.85));
    border: var(--p-card-border-width, 1px) solid var(--p-divider, #1F3448);
    border-radius: var(--p-card-radius, 18px);
    padding: 8px 10px;
  }
  #preview .p-kpi .p-kpi-label {
    color: var(--p-text-secondary, #B8E8F5); font-size: 8px;
    text-transform: uppercase; letter-spacing: .5px;
  }
  #preview .p-kpi .p-kpi-bar {
    margin-top: 6px; height: 4px; border-radius: 2px;
    background: var(--p-divider, #1F3448); overflow: hidden;
  }
  #preview .p-kpi .p-kpi-bar span {
    display: block; height: 100%; background: var(--p-primary, #00E5FF);
  }
  #preview .p-dialog {
    margin: 10px 12px 12px; padding: 10px;
    background: var(--p-dialog-scrim, rgba(2,5,11,.75));
    border-radius: var(--p-dialog-radius, 20px);
    font-size: 9px; color: var(--p-text-secondary, #B8E8F5);
  }
</style>
</head>
<body>
<div class="header">
  <div class="logo">⬡</div>
  <div>
    <h1>VISIO SAPIENS</h1>
    <p class="sub-label">DESIGN SYSTEM EDITOR</p>
  </div>
</div>
<div class="sub" id="subtitle">Loading…</div>

<div class="layout">
  <div>
    <div class="wrap" id="form"></div>

    <div class="bar">
      <button id="apply">Apply</button>
      <button class="ghost" id="export">Export</button>
      <button class="ghost" id="importBtn">Import</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
      <button class="ghost" id="reset">Reset to defaults</button>
      <button class="ghost" id="reload">Reload</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div id="preview">
    <div class="p-header">VISIO SAPIENS</div>
    <div class="p-body">
      <div class="p-sidebar">
        <div class="p-item"><div class="dot"></div>HOME</div>
        <div class="p-item"><div class="dot"></div>kitchen</div>
        <div class="p-item"><div class="dot"></div>living room</div>
        <div class="p-divider"></div>
        <div class="p-item selected"><div class="dot"></div>THEME</div>
        <div class="p-item"><div class="dot"></div>ENERGY</div>
        <div class="p-item"><div class="dot"></div>ADMIN</div>
      </div>
      <div class="p-content">
        <div class="p-card">
          Living room
          <div class="p-muted">21.4°C · 3 devices on</div>
          <span class="p-btn">Apply</span>
          <span class="p-btn accent">Preview</span>
        </div>
        <div class="p-kpis">
          <div class="p-kpi">
            <div class="p-kpi-label">System</div>
            <div class="p-kpi-bar"><span style="width:51%"></span></div>
          </div>
          <div class="p-kpi">
            <div class="p-kpi-label">Energy</div>
            <div class="p-kpi-bar"><span style="width:35%"></span></div>
          </div>
          <div class="p-kpi">
            <div class="p-kpi-label">Rooms</div>
            <div class="p-kpi-bar"><span style="width:80%"></span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="p-dialog">Popup dialog preview (browser_mod)</div>
  </div>
</div>

<script>
// EN | Written by generate_dashboards.py --only theme, refreshed on every
// EN | APPLY. Same file shape the webhook payload accepts back (`tokens`),
// EN | via the shared vssp_design_fields.FIELDS table server-side.
// FR | Ecrit par generate_dashboards.py --only theme, rafraichi a chaque
// FR | APPLIQUER. Meme forme que ce que le payload du webhook accepte en
// FR | retour (`tokens`), via la table partagee vssp_design_fields.FIELDS
// FR | cote serveur.
const STATUS_URL = '/local/vssp/design_system_status.json';
const WEBHOOK = '/api/webhook/vssp_theme';

// EN | Mirrors model/design_system.yaml's factory values — used as a
// EN | fallback when STATUS_URL is not reachable yet (first run, before any
// EN | `--only theme` generation) and as the RESET TO DEFAULTS target.
// FR | Reprend les valeurs d'usine de model/design_system.yaml — sert de
// FR | repli quand STATUS_URL n'est pas encore atteignable (premier lancement,
// FR | avant toute generation --only theme) et de cible pour REINITIALISER.
const DEFAULTS = {
  primary: '#00E5FF', accent: '#00FFD5',
  background: '#050B12', background_secondary: '#101B27',
  card_background: 'rgba(16,27,39,0.85)',
  selector_background: '#000000',
  input_background: '#C9D6DE', input_ink: '#0A1720', input_label: '#3A4E5A',
  text_primary: '#FFFFFF', text_secondary: '#B8E8F5',
  header_background: '#08121C', header_text: '#00E5FF',
  divider: '#1F3448',
  icon_default: '#00E5FF', icon_active: '#00FFD5',
  card_radius: '18px', card_border_width: '1px', dialog_radius: '20px',
  dialog_scrim: 'rgba(2,5,11,0.75)',
  sidebar_background: '#050B12', sidebar_text: '#B8E8F5', sidebar_icon: '#00E5FF',
  sidebar_selected_background: 'rgba(0,229,255,0.10)',
  sidebar_selected_text: '#00E5FF', sidebar_selected_icon: '#00E5FF',
  bubble_backdrop: 'transparent',
};

// EN | type/group drive the form only. The server (vssp_design_fields.py) is
// EN | the authority on what is actually valid — this page's regexes are a
// EN | courtesy to catch typos before a round trip, not the real gate.
// FR | type/group ne pilotent que le formulaire. Le serveur
// FR | (vssp_design_fields.py) fait autorite sur ce qui est reellement
// FR | valide — les regex de cette page sont une aide pour attraper une
// FR | faute avant l'aller-retour, pas le vrai controle.
const FIELDS = [
  { key: 'primary', label: 'Primary', type: 'color', group: 'Palette' },
  { key: 'accent', label: 'Accent', type: 'color', group: 'Palette' },
  { key: 'background', label: 'Background', type: 'color', group: 'Palette' },
  { key: 'background_secondary', label: 'Background (secondary)', type: 'color', group: 'Palette' },
  { key: 'card_background', label: 'Card background', type: 'text', group: 'Palette', hint: 'hex or rgba()', picker: true },
  { key: 'selector_background', label: 'Selector background', type: 'text', group: 'Palette', hint: 'hex or rgba() — Interface language / Target format / Chatbot provider rows', picker: true },
  { key: 'input_background', label: 'Text field background', type: 'color', group: 'Palette', hint: 'ha-textfield fill — input_text rows and dialog fields' },
  { key: 'input_ink', label: 'Text field value', type: 'color', group: 'Palette', hint: 'the value typed in a text field; must contrast with the fill above' },
  { key: 'input_label', label: 'Text field label', type: 'color', group: 'Palette', hint: 'the small floating label above the value; softer than the value, same fill to contrast with' },
  { key: 'text_primary', label: 'Text (primary)', type: 'color', group: 'Palette' },
  { key: 'text_secondary', label: 'Text (secondary)', type: 'color', group: 'Palette' },
  { key: 'header_background', label: 'Header background', type: 'color', group: 'Header' },
  { key: 'header_text', label: 'Header text', type: 'color', group: 'Header' },
  { key: 'divider', label: 'Divider', type: 'color', group: 'Icons & divider' },
  { key: 'icon_default', label: 'Icon (default)', type: 'color', group: 'Icons & divider' },
  { key: 'icon_active', label: 'Icon (active)', type: 'color', group: 'Icons & divider' },
  { key: 'sidebar_background', label: 'Sidebar background', type: 'color', group: 'Sidebar' },
  { key: 'sidebar_text', label: 'Sidebar text', type: 'color', group: 'Sidebar' },
  { key: 'sidebar_icon', label: 'Sidebar icon', type: 'color', group: 'Sidebar' },
  { key: 'sidebar_selected_background', label: 'Sidebar selected background', type: 'text', group: 'Sidebar', hint: 'hex or rgba()', picker: true },
  { key: 'sidebar_selected_text', label: 'Sidebar selected text', type: 'color', group: 'Sidebar' },
  { key: 'sidebar_selected_icon', label: 'Sidebar selected icon', type: 'color', group: 'Sidebar' },
  { key: 'card_radius', label: 'Card radius', type: 'range', group: 'Shape', min: 0, max: 60 },
  { key: 'card_border_width', label: 'Card border width', type: 'range', group: 'Shape', min: 0, max: 10 },
  { key: 'dialog_radius', label: 'Dialog radius', type: 'range', group: 'Shape', min: 0, max: 60 },
  { key: 'dialog_scrim', label: 'Dialog scrim', type: 'text', group: 'Shape', hint: 'hex or rgba()', picker: true },
  { key: 'bubble_backdrop', label: 'Bubble backdrop', type: 'text', group: 'Shape', hint: 'hex, rgba() or "transparent"', picker: true, allowTransparent: true },
];

const HEX_RE = /^#[0-9A-Fa-f]{6}$/;
const RGBA_RE = /^rgba\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*(0|1|0?\.\d+)\s*\)$/;
const LENGTH_RE = /^\d{1,3}px$/;

const el = (id) => document.getElementById(id);
let VALUES = { ...DEFAULTS };

function isColor(v) { return HEX_RE.test(v) || RGBA_RE.test(v); }

// EN | Parses any value FIELDS can hold for a `picker` text field — hex,
// EN | rgba(), or the literal "transparent" — into {r,g,b,a}. Falls back to
// EN | opaque black for anything unparseable, so a swatch never crashes on a
// EN | stray value; the underlying text input keeps whatever was actually
// EN | there regardless.
// FR | Interprete toute valeur qu'un champ texte `picker` peut porter — hex,
// FR | rgba(), ou le litteral "transparent" — en {r,g,b,a}. Se replie sur du
// FR | noir opaque pour tout ce qui est illisible, pour qu'une pastille ne
// FR | plante jamais sur une valeur inattendue ; l'input texte sous-jacent
// FR | garde ce qui y etait reellement, quoi qu'il arrive.
function parseColorLoose(v) {
  if (v === 'transparent') return { r: 0, g: 0, b: 0, a: 0, transparent: true };
  const rgba = /^rgba\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(0|1|0?\.\d+)\s*\)$/.exec(v);
  if (rgba) return { r: +rgba[1], g: +rgba[2], b: +rgba[3], a: +rgba[4] };
  const hex = /^#([0-9A-Fa-f]{2})([0-9A-Fa-f]{2})([0-9A-Fa-f]{2})$/.exec(v);
  if (hex) return { r: parseInt(hex[1], 16), g: parseInt(hex[2], 16), b: parseInt(hex[3], 16), a: 1 };
  return { r: 0, g: 0, b: 0, a: 1 };
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(n => n.toString(16).padStart(2, '0')).join('');
}
function hexToRgb(hex) {
  const m = /^#([0-9A-Fa-f]{2})([0-9A-Fa-f]{2})([0-9A-Fa-f]{2})$/.exec(hex);
  return m ? { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) } : { r: 0, g: 0, b: 0 };
}
function toRgbaString(r, g, b, a) {
  return `rgba(${r},${g},${b},${Math.round(a * 100) / 100})`;
}

// EN | Closes whichever popover is currently open — used both by the
// EN | document-level "click outside" listener and before opening another
// EN | one, so only one is ever open at a time.
// FR | Ferme le popover actuellement ouvert, si il y en a un — utilise a la
// FR | fois par l'ecouteur "clic en dehors" et avant d'en ouvrir un autre,
// FR | pour qu'un seul popover soit jamais ouvert a la fois.
let openPopover = null;
function closeOpenPopover() {
  if (openPopover) { openPopover.classList.remove('open'); openPopover = null; }
}
document.addEventListener('click', (e) => {
  if (openPopover && !openPopover.parentElement.contains(e.target)) closeOpenPopover();
});

// EN | The swatch + popover control for one rgba()-capable text field. Keeps
// EN | the plain text input (typing a value by hand still works, and is what
// EN | APPLY / Export / Import still read from) and layers a color+alpha
// EN | picker on top of it: the popover writes back into the text input and
// EN | fires the same onChange() the text input's own listener would.
// FR | Le controle pastille + popover pour un champ texte capable de rgba().
// FR | Garde l'input texte brut (le saisir a la main marche toujours, et
// FR | c'est toujours lui que lisent APPLIQUER / Export / Import) et pose un
// FR | selecteur couleur+alpha par-dessus : le popover reecrit dans l'input
// FR | texte et declenche le meme onChange() que l'ecouteur propre du champ.
function buildRgbaField(f) {
  const wrap = document.createElement('div');
  wrap.className = 'rgba-field';

  const swatch = document.createElement('div');
  swatch.className = 'swatch';
  swatch.id = 'sw_' + f.key;
  const swatchFill = document.createElement('div');
  swatchFill.className = 'swatch-fill';
  swatch.appendChild(swatchFill);

  const input = document.createElement('input');
  input.type = 'text'; input.id = 'f_' + f.key;

  const popover = document.createElement('div');
  popover.className = 'popover';

  const colorInput = document.createElement('input');
  colorInput.type = 'color';

  const alphaRow = document.createElement('div');
  alphaRow.className = 'popover-row';
  const alphaLabel = document.createElement('label');
  alphaLabel.textContent = 'Alpha';
  const alphaRange = document.createElement('input');
  alphaRange.type = 'range'; alphaRange.min = 0; alphaRange.max = 100;
  const alphaVal = document.createElement('span');
  alphaVal.className = 'alpha-val';
  alphaRow.append(alphaLabel, alphaRange, alphaVal);

  let transparentBox = null;
  if (f.allowTransparent) {
    const tRow = document.createElement('label');
    tRow.className = 'transparent-toggle';
    transparentBox = document.createElement('input');
    transparentBox.type = 'checkbox';
    tRow.append(transparentBox, document.createTextNode('Transparent'));
    popover.appendChild(tRow);
  }
  popover.append(colorInput, alphaRow);

  function refresh() {
    const c = parseColorLoose(input.value);
    swatchFill.style.background = c.transparent ? 'transparent' : toRgbaString(c.r, c.g, c.b, c.a);
    colorInput.value = rgbToHex(c.r, c.g, c.b);
    alphaRange.value = Math.round((c.transparent ? 0 : c.a) * 100);
    alphaVal.textContent = alphaRange.value + '%';
    colorInput.disabled = !!c.transparent;
    alphaRange.disabled = !!c.transparent;
    if (transparentBox) transparentBox.checked = !!c.transparent;
  }

  function apply() {
    if (transparentBox && transparentBox.checked) {
      input.value = 'transparent';
    } else {
      const { r, g, b } = hexToRgb(colorInput.value);
      input.value = toRgbaString(r, g, b, alphaRange.value / 100);
    }
    refresh();
    onChange(f.key, input.value);
  }

  swatch.addEventListener('click', (e) => {
    e.stopPropagation();
    if (popover.classList.contains('open')) { closeOpenPopover(); return; }
    closeOpenPopover();
    refresh();
    popover.classList.add('open');
    openPopover = popover;
  });
  colorInput.addEventListener('input', apply);
  alphaRange.addEventListener('input', () => { alphaVal.textContent = alphaRange.value + '%'; apply(); });
  if (transparentBox) transparentBox.addEventListener('change', apply);
  input.addEventListener('input', () => { onChange(f.key, input.value); refresh(); });

  wrap.append(swatch, input, popover);
  return wrap;
}

function buildForm() {
  const wrap = el('form');
  wrap.innerHTML = '';
  const groups = [...new Set(FIELDS.map(f => f.group))];
  groups.forEach(group => {
    const title = document.createElement('div');
    title.className = 'group-title';
    title.textContent = group;
    wrap.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'fields';
    FIELDS.filter(f => f.group === group).forEach(f => {
      const row = document.createElement('div');
      row.className = 'field';
      const label = document.createElement('label');
      label.textContent = f.label;
      label.htmlFor = 'f_' + f.key;
      if (f.hint) {
        const hint = document.createElement('span');
        hint.className = 'hint'; hint.textContent = f.hint;
        label.appendChild(hint);
      }
      row.appendChild(label);

      if (f.type === 'color') {
        const input = document.createElement('input');
        input.type = 'color'; input.id = 'f_' + f.key;
        input.addEventListener('input', () => onChange(f.key, input.value));
        row.appendChild(input);
      } else if (f.type === 'range') {
        const box = document.createElement('div');
        box.style.display = 'flex'; box.style.alignItems = 'center'; box.style.gap = '6px';
        const input = document.createElement('input');
        input.type = 'range'; input.id = 'f_' + f.key;
        input.min = f.min; input.max = f.max;
        const out = document.createElement('span');
        out.className = 'range-val';
        input.addEventListener('input', () => {
          out.textContent = input.value + 'px';
          onChange(f.key, input.value + 'px');
        });
        box.append(input, out);
        row.appendChild(box);
      } else if (f.type === 'text' && f.picker) {
        row.appendChild(buildRgbaField(f));
      } else {
        const input = document.createElement('input');
        input.type = 'text'; input.id = 'f_' + f.key;
        input.addEventListener('input', () => onChange(f.key, input.value));
        row.appendChild(input);
      }
      grid.appendChild(row);
    });
    wrap.appendChild(grid);
  });
}

function setFormValues(values) {
  FIELDS.forEach(f => {
    const v = values[f.key];
    if (v === undefined) return;
    const input = el('f_' + f.key);
    if (!input) return;
    if (f.type === 'color') {
      // EN | A native color input only accepts #RRGGBB — rgba() fields use a
      // EN | plain text input instead (see FIELDS), so this always gets a hex.
      // FR | Un input color natif n'accepte que #RRGGBB — les champs rgba()
      // FR | utilisent un input texte simple (voir FIELDS), donc ceci recoit
      // FR | toujours un hex.
      input.value = v;
    } else if (f.type === 'range') {
      input.value = parseInt(v, 10) || 0;
      input.dispatchEvent(new Event('input'));
    } else {
      input.value = v;
      // EN | Picker fields (see buildRgbaField) listen for `input` to refresh
      // EN | their swatch from whatever the text field now holds.
      // FR | Les champs a pastille (voir buildRgbaField) ecoutent `input` pour
      // FR | rafraichir leur pastille depuis ce que porte desormais le champ texte.
      if (f.picker) input.dispatchEvent(new Event('input'));
    }
  });
}

function onChange(key, value) {
  VALUES[key] = value;
  updatePreview();
}

function updatePreview() {
  const p = el('preview');
  Object.keys(VALUES).forEach(key => {
    p.style.setProperty('--p-' + key.replace(/_/g, '-'), VALUES[key]);
  });
}

function show(kind, text) {
  const m = el('msg');
  m.className = 'msg ' + kind;
  m.textContent = text;
}

async function load() {
  show('', '');
  let values = { ...DEFAULTS };
  try {
    const res = await fetch(STATUS_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      values = { ...DEFAULTS, ...data };
      el('subtitle').textContent = 'Loaded from ' + STATUS_URL;
    } else {
      el('subtitle').textContent = 'No generated theme yet — showing factory defaults.';
    }
  } catch (e) {
    el('subtitle').textContent = 'No generated theme yet — showing factory defaults.';
  }
  VALUES = values;
  setFormValues(VALUES);
  updatePreview();
}

el('reload').addEventListener('click', load);

el('reset').addEventListener('click', () => {
  VALUES = { ...DEFAULTS };
  setFormValues(VALUES);
  updatePreview();
  show('ok', 'Form reset to factory defaults. Nothing was sent yet — click Apply to save.');
});

el('export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ tokens: VALUES }, null, 2)],
    { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'vssp_design_system.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});

el('importBtn').addEventListener('click', () => el('importFile').click());
el('importFile').addEventListener('change', async () => {
  const file = el('importFile').files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    const tokens = data.tokens || data;
    VALUES = { ...VALUES, ...tokens };
    setFormValues(VALUES);
    updatePreview();
    show('ok', 'Imported. Nothing was sent yet — check the preview, then click Apply.');
  } catch (e) {
    show('err', 'Could not read that file (' + e.message + ').');
  } finally {
    el('importFile').value = '';
  }
});

el('apply').addEventListener('click', async () => {
  // EN | Client-side pre-check only — courtesy, not the gate. The server
  // EN | (vssp_design_fields.validate) re-checks every token independently
  // EN | and is the one that decides what actually gets written.
  // FR | Pre-controle cote client uniquement — une aide, pas le controle. Le
  // FR | serveur (vssp_design_fields.validate) revalide chaque token
  // FR | independamment et est le seul a decider de ce qui est reellement
  // FR | ecrit.
  const bad = [];
  FIELDS.forEach(f => {
    const v = VALUES[f.key];
    let ok;
    if (f.type === 'range') ok = LENGTH_RE.test(v);
    else if (f.key === 'bubble_backdrop') ok = v === 'transparent' || isColor(v);
    else ok = isColor(v);
    if (!ok) bad.push(f.key);
  });
  if (bad.length) {
    show('err', 'Fix these fields before applying: ' + bad.join(', '));
    return;
  }

  const payload = JSON.stringify({ tokens: VALUES });
  // EN | base64 so the shell_command receives one inert argument — rgba()
  // EN | values carry parentheses and commas, and quoting them through a
  // EN | shell is exactly the kind of thing that breaks silently.
  // FR | base64 pour que le shell_command recoive un seul argument inerte —
  // FR | les valeurs rgba() portent des parentheses et des virgules, et les
  // FR | echapper a travers un shell est precisement le genre de chose qui
  // FR | casse en silence.
  const b64 = btoa(unescape(encodeURIComponent(payload)));
  el('apply').disabled = true;
  show('ok', 'Sending…');
  try {
    const res = await fetch(WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content_b64: b64 }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    show('ok', 'Sent. The theme is being regenerated and reloaded live —\n'
      + 'watch the Home Assistant notifications. No page reload needed.');
  } catch (e) {
    show('err', 'Send failed (' + e.message + ').\n'
      + 'Check that the webhook automation is loaded and that this browser '
      + 'is on the local network (local_only).');
  } finally {
    el('apply').disabled = false;
  }
});

buildForm();
load();
</script>
</body>
</html>

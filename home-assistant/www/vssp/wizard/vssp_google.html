<!DOCTYPE html>

<title>Visio Sapiens — Google Calendar</title>
<!--
  EN | Served as /local/vssp/wizard/vssp_google.html, opened in a browser_mod
  EN | popup from the ADMIN console's CALENDAR screen (admin.yaml.j2).
  EN |
  EN | WHY A WEBHOOK AND NOT THE REST API — same reasoning as
  EN | vssp_chatbot.html and vssp_theme_editor.html: this page cannot reach
  EN | the parent page's `hass` object, and the REST API needs a Bearer token
  EN | that has no business sitting in a browser. A webhook needs none, and
  EN | local_only: true keeps it on the LAN.
  EN |
  EN | WHY THE PAGE POLLS A FILE — the webhook returns as soon as the
  EN | automation is queued, long before vssp_google_setup.py has talked to
  EN | Home Assistant's websocket API and to Google. The script writes its
  EN | outcome to google_status.json; this page polls that file, exactly like
  EN | the chatbot page polls chatbot_status.json for a reply.
  EN |
  EN | THE CONSENT CLICK IS DELIBERATE, NOT A MISSING FEATURE — OAuth is
  EN | designed so the account owner approves access in Google's own UI. No
  EN | form can sign that on their behalf, so this page's job is to make that
  EN | one click obvious and to automate everything on either side of it.
  FR | Servi comme /local/vssp/wizard/vssp_google.html, ouvert dans un popup
  FR | browser_mod depuis l'ecran CALENDRIER de la console ADMIN
  FR | (admin.yaml.j2).
  FR |
  FR | POURQUOI UN WEBHOOK ET PAS L'API REST — meme raisonnement que
  FR | vssp_chatbot.html et vssp_theme_editor.html : cette page ne peut pas
  FR | atteindre l'objet `hass` de la page parente, et l'API REST exige un
  FR | jeton Bearer qui n'a rien a faire dans un navigateur. Un webhook n'en
  FR | exige aucun, et local_only: true le maintient sur le reseau local.
  FR |
  FR | POURQUOI LA PAGE INTERROGE UN FICHIER — le webhook rend la main des que
  FR | l'automatisation est mise en file, bien avant que
  FR | vssp_google_setup.py ait parle a l'API websocket de Home Assistant et
  FR | a Google. Le script ecrit son resultat dans google_status.json ; cette
  FR | page interroge ce fichier, exactement comme la page chatbot interroge
  FR | chatbot_status.json pour une reponse.
  FR |
  FR | LE CLIC DE CONSENTEMENT EST VOULU, PAS UNE FONCTION MANQUANTE — OAuth
  FR | est concu pour que le proprietaire du compte approuve l'acces dans
  FR | l'interface de Google. Aucun formulaire ne peut signer a sa place :
  FR | le role de cette page est de rendre ce clic unique evident et
  FR | d'automatiser tout ce qui l'entoure.

  EN | LANGUAGE — this page sits INSIDE a dashboard the generator already
  EN | translated, so a hardcoded language would put French buttons under
  EN | English labels (or the reverse) on one and the same screen. The
  EN | template therefore passes `?lang=` (admin.yaml.j2, from the generated
  EN | locale) and every visible string comes from the I18N table below.
  EN | Two things are deliberately NOT translated here:
  EN |   - the status `state` token (`awaiting_consent`…), which is what this
  EN |     page branches on — only its label is translated;
  EN |   - technical failure text from Home Assistant or the OS, carried in
  EN |     message_vars and framed by a translated sentence.
  FR | LANGUE — cette page vit DANS un dashboard que le generateur a deja
  FR | traduit : une langue figee mettrait donc des boutons francais sous des
  FR | libelles anglais (ou l'inverse) sur un seul et meme ecran. Le template
  FR | passe donc `?lang=` (admin.yaml.j2, depuis la locale generee) et
  FR | chaque chaine visible vient de la table I18N ci-dessous. Deux choses
  FR | ne sont VOLONTAIREMENT pas traduites ici :
  FR |   - le jeton `state` du fichier d'etat (`awaiting_consent`…), sur
  FR |     lequel cette page s'aiguille — seul son libelle est traduit ;
  FR |   - le texte d'echec technique venant de Home Assistant ou de l'OS,
  FR |     porte par message_vars et encadre par une phrase traduite.
-->

<script>

/* ---- i18n -------------------------------------------------------------

   EN | one key for one key — the script publishes `message_key` +
   EN | `message_vars` precisely so this page can render the sentence in ITS
   EN | own language rather than displaying whatever locale the last shell
   EN | run happened to use.
   FR | Chaque chaine visible, dans les deux langues du projet. L'anglais est
   FR | la reference : une cle absente d'un autre catalogue y retombe, donc
   FR | une traduction partielle se degrade au lieu d'afficher une cle brute.
   FR | Le bloc `msg_*` reproduit cle pour cle la table MESSAGES de
   FR | vssp_google_setup.py — le script publie `message_key` et

// EN | Language order: ?lang= written by admin.yaml.j2 from the generated
// EN | locale (the authority — it is the language of the labels sitting
// EN | around this iframe) > the browser > English. There is no live read of
// EN | input_select.vssp_language: that would need a Bearer token, and the
// EN | selector already forces a regeneration to take effect, which rewrites
// EN | this URL anyway.
// FR | Ordre de la langue : ?lang= ecrit par admin.yaml.j2 depuis la locale
// FR | generee (l'autorite — c'est la langue des libelles qui entourent
// FR | cette iframe) > le navigateur > l'anglais. Aucune lecture directe de
// FR | input_select.vssp_language : elle exigerait un jeton Bearer, et le
// FR | selecteur impose deja une regeneration pour prendre effet, ce qui
// FR | reecrit cette URL de toute facon.
const LANG = (function () {
  const asked = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
  const guess = asked || (navigator.language || 'en').toLowerCase();
  return guess.slice(0, 2) === 'fr' ? 'fr' : 'en';
})();

function t(key, vars) {
  let s = (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key;
  if (vars) Object.keys(vars).forEach((k) => {
    s = s.split('{' + k + '}').join(vars[k]);
  });
  return s;
}

function applyLang() {
  document.documentElement.lang = LANG;
  document.title = t('doc_title');
  // EN | innerHTML, not textContent: several of these strings carry an
  // EN | escaped ampersand ("Save &amp; connect") or inline markup. They are
  // EN | literals from the table above, never user input.
  // FR | innerHTML, pas textContent : plusieurs de ces chaines portent une
  // FR | esperluette echappee (« Enregistrer &amp; connecter ») ou du balisage
  // FR | en ligne. Ce sont des litteraux de la table ci-dessus, jamais une
  // FR | saisie.
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    el.innerHTML = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-html]').forEach((el) => {
    el.innerHTML = t(el.dataset.i18nHtml);
  });
}

const $ = (id) => document.getElementById(id);
let selectedCalendar = '';
let pollTimer = null;

/* ---- helpers ---------------------------------------------------- */
function setState(cls, stateKey, message) {
  const el = $('stateLabel');
  el.className = 'state ' + cls;
  el.textContent = t('st_' + stateKey);
  $('stateMsg').textContent = message || '';
}

// EN | Re-render the script's message in THIS page's language. `message_key`
// EN | is the machine form; the pre-rendered `message` is the fallback for a
// EN | key this page does not know (an older status file, a newer script).
// FR | Rend le message du script dans la langue de CETTE page. `message_key`
// FR | est la forme machine ; le `message` deja rendu sert de repli pour une
// FR | cle inconnue ici (fichier d'etat ancien, script plus recent).
function statusMessage(data) {
  const key = data.message_key ? 'msg_' + data.message_key : '';
  if (key && I18N.en[key]) return t(key, data.message_vars || {});
  return data.message || '';
}

function show(el, on) { el.classList.toggle('hidden', !on); }

async function post(payload) {
  const res = await fetch(WEBHOOK, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  // EN | A webhook answers 200 with an empty body; anything else is a real
  // EN | transport failure worth surfacing.
  // FR | Un webhook repond 200 avec un corps vide ; tout le reste est une
  // FR | vraie panne de transport, qui merite d'etre affichee.
  if (!res.ok) throw new Error('HTTP ' + res.status);
}

/* ---- status polling --------------------------------------------- */
async function refreshStatus() {
  let data;
  try {
    const res = await fetch(STATUS_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;                       // not written yet: stay quiet
    data = await res.json();
  } catch (e) { return; }

  const state = data.state || 'idle';
  const calendars = data.calendars || [];
  const message = statusMessage(data);

  if (state === 'awaiting_consent' && data.auth_url) {
    setState('wait', 'awaiting_consent', message);
    $('consentLink').href = data.auth_url;
    show($('consentBox'), true);
  } else if (state === 'connected') {
    setState('ok', 'connected', message);
    show($('consentBox'), false);
  } else if (state === 'error') {
    setState('err', 'error', message);
  } else if (state === 'credentials_ok') {
    setState('wait', 'credentials_ok', message);
  } else if (state === 'not_configured') {
    setState('idle', 'not_configured', message);
  } else {
    setState('idle', 'idle', message);
  }

  // EN | Prefill the id field with what is stored, so reopening the popup
  // EN | shows the current setup instead of an empty form. Only the tail is
  // EN | published by the script — never the secret.
  // FR | Pre-remplit le champ id avec ce qui est memorise, pour qu'a la
  // FR | reouverture le popup montre la configuration courante plutot qu'un
  // FR | formulaire vide. Seule la fin est publiee par le script — jamais le
  // FR | secret.
  if (data.client_id_tail && !$('clientId').value) {
    $('clientId').placeholder = '…' + data.client_id_tail;
  }

  renderCalendars(calendars, data.selected || '');
}

function renderCalendars(calendars, selected) {
  show($('calBox'), calendars.length > 0);
  const list = $('calList');
  const signature = calendars.map(c => c.entity_id).join('|');
  if (list.dataset.sig === signature) return;         // no churn while typing
  list.dataset.sig = signature;
  list.innerHTML = '';
  calendars.forEach((cal) => {
    const row = document.createElement('div');
    row.className = 'cal' + (cal.entity_id === selected ? ' sel' : '');
    row.innerHTML = '<span>' + (cal.name || cal.entity_id) +
                    '</span><span class="eid">' + cal.entity_id + '</span>';
    row.addEventListener('click', () => {
      selectedCalendar = cal.entity_id;
      [...list.children].forEach(c => c.classList.remove('sel'));
      row.classList.add('sel');
      $('useBtn').disabled = false;
    });
    list.appendChild(row);
  });
  if (selected) { selectedCalendar = selected; $('useBtn').disabled = false; }
}

/* ---- actions ----------------------------------------------------- */
$('copyUri').addEventListener('click', async () => {
  const input = $('redirectUri');
  input.select();
  try {
    await navigator.clipboard.writeText(input.value);
    $('copyUri').textContent = t('btn_copied');
    setTimeout(() => { $('copyUri').textContent = t('btn_copy'); }, 1500);
  } catch (e) {
    // EN | clipboard API needs a secure context; the manual select above is
    // EN | the fallback, so say so instead of failing silently.
    // FR | L'API presse-papier exige un contexte securise ; la selection
    // FR | manuelle ci-dessus est le repli, autant le dire.
    $('copyUri').textContent = t('btn_copy_manual');
  }
});

$('saveBtn').addEventListener('click', async () => {
  const clientId = $('clientId').value.trim();
  const clientSecret = $('clientSecret').value.trim();
  const msg = $('formMsg');
  msg.className = 'msg';
  if (!clientId.endsWith('.apps.googleusercontent.com')) {
    msg.className = 'msg err';
    msg.textContent = t('err_client_id_format');
    return;
  }
  if (!clientSecret) {
    msg.className = 'msg err';
    msg.textContent = t('err_secret_required');
    return;
  }
  $('saveBtn').disabled = true;
  msg.textContent = t('form_sending');
  try {
    await post({ client_id: clientId, client_secret: clientSecret, connect: true });
    msg.className = 'msg ok';
    msg.textContent = t('form_sent');
    setState('wait', 'credentials_ok', t('form_connecting_detail'));
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = t('form_post_failed', { msg: e.message });
  } finally {
    $('saveBtn').disabled = false;
  }
});

$('useBtn').addEventListener('click', async () => {
  const msg = $('calMsg');
  msg.className = 'msg';
  if (!selectedCalendar) return;
  $('useBtn').disabled = true;
  msg.textContent = t('cal_saving');
  try {
    // EN | ONLY the calendar entity — no credentials in this payload. The
    // EN | webhook automation has a dedicated branch for this shape; sending
    // EN | a placeholder secret here would overwrite the real stored one,
    // EN | and re-running the OAuth flow would hand back a second consent
    // EN | URL for an account that is already linked.
    // FR | UNIQUEMENT l'entite calendrier — aucun identifiant dans ce
    // FR | payload. L'automatisation webhook a une branche dediee a cette
    // FR | forme ; envoyer un secret bouche-trou ici ecraserait le vrai
    // FR | secret memorise, et relancer le flux OAuth renverrait une
    // FR | seconde URL de consentement pour un compte deja lie.
    await post({ calendar_entity: selectedCalendar });
    msg.className = 'msg ok';
    msg.textContent = t('cal_saved', { entity: selectedCalendar });
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = t('cal_failed', { msg: e.message });
  } finally {
    $('useBtn').disabled = false;
  }
});

/* ---- boot -------------------------------------------------------- */
applyLang();
setState('idle', 'idle', t('init_msg'));
refreshStatus();
pollTimer = setInterval(refreshStatus, 3000);
window.addEventListener('beforeunload', () => clearInterval(pollTimer));
</script>
</body>
</html>

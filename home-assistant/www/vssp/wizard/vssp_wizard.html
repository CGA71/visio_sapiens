<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Visio Sapiens — Discovery Wizard</title>
  <style>
    /* Polices système de secours — pas de dépendance internet */
    @font-face { font-family: 'Orbitron'; src: local('Orbitron'); }
    @font-face { font-family: 'Rajdhani'; src: local('Rajdhani'); }
  </style>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#02050B;color:#fff;font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;min-height:100vh}
    input,select,button,textarea{font-family:inherit}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:2px}
    .page{max-width:960px;margin:0 auto;padding:24px}
    .header{display:flex;align-items:center;gap:16px;margin-bottom:32px}
    .logo{width:40px;height:40px;border-radius:50%;border:2px solid #00E5FF;display:flex;align-items:center;justify-content:center;color:#00E5FF;font-size:20px;flex-shrink:0}
    .logo-text h1{font-family:'Orbitron','Courier New',monospace;color:#00E5FF;font-size:18px;letter-spacing:3px;margin:0}
    .logo-text p{color:#56707E;font-size:11px;letter-spacing:1px;margin:0}
    .ha-url{margin-left:auto;color:#56707E;font-size:11px}

    /* Step bar */
    .steps{display:flex;gap:4px;margin-bottom:32px}
    .step{flex:1}
    .step-bar{height:4px;border-radius:2px;background:rgba(0,229,255,.2);transition:background .3s}
    .step.active .step-bar{background:#00E5FF}
    .step.done .step-bar{background:#00FFC3}
    .step-label{font-size:10px;font-family:'Orbitron','Courier New',monospace;letter-spacing:1px;margin-top:4px;color:#56707E}
    .step.active .step-label,.step.done .step-label{color:#00E5FF}
    .step.done .step-label{color:#00FFC3}

    /* Cards */
    .card{background:rgba(8,18,28,.85);border:1px solid rgba(0,229,255,.3);border-radius:16px;padding:24px;margin-bottom:16px;backdrop-filter:blur(12px)}
    .card-title{font-family:'Orbitron','Courier New',monospace;color:#00E5FF;font-size:14px;letter-spacing:2px;margin-bottom:4px}
    .card-sub{color:#8FB6C9;font-size:13px;margin-bottom:16px}

    /* Form elements */
    label{color:#8FB6C9;font-size:12px;letter-spacing:1px;display:block;margin-bottom:4px}
    input[type=text],input[type=password],select{background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.3);border-radius:8px;padding:8px 12px;color:#fff;font-size:14px;outline:none;width:100%;-webkit-appearance:none;appearance:none}
    input[type=text]:focus,input[type=password]:focus,select:focus{border-color:#00E5FF}
    input[type=color]{width:36px;height:36px;border:none;background:none;cursor:pointer;border-radius:6px;padding:0}
    select option{background:#08121C !important;color:#fff !important}
    select option:hover,select option:checked,select option:focus{background:#00E5FF !important;color:#02050B !important}
    select::-ms-expand{display:none}

    /* Buttons */
    .btn{border-radius:10px;padding:10px 20px;font-family:'Orbitron','Courier New',monospace;font-size:12px;letter-spacing:1px;cursor:pointer;transition:all .2s;border:1px solid #00E5FF;background:rgba(0,229,255,.12);color:#00E5FF}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .btn:hover:not(:disabled){background:rgba(0,229,255,.22);box-shadow:0 0 12px rgba(0,229,255,.3)}
    .btn-danger{border-color:#FF3D71;background:rgba(255,61,113,.1);color:#FF3D71}
    .btn-green{border-color:#00FFC3;background:rgba(0,255,195,.1);color:#00FFC3}
    .btn-sm{padding:6px 12px;font-size:10px}
    .btn-ghost{background:transparent}

    /* Layout helpers */
    .row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
    .flex1{flex:1}
    .actions{display:flex;justify-content:space-between;margin-top:20px;gap:12px}
    .actions-right{display:flex;gap:12px;margin-left:auto}

    /* Chips */
    .chip{display:inline-block;padding:4px 14px;border-radius:20px;font-size:12px;letter-spacing:1px;cursor:pointer;margin-right:6px;margin-bottom:6px;border:1px solid rgba(0,229,255,.3);color:#8FB6C9;transition:all .2s}
    .chip.on{background:rgba(0,229,255,.15);border-color:#00E5FF;color:#00E5FF}

    /* Badge */
    .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;margin-left:6px}
    .badge-cyan{background:rgba(0,229,255,.15);border:1px solid rgba(0,229,255,.4);color:#00E5FF}
    .badge-green{background:rgba(0,255,195,.15);border:1px solid rgba(0,255,195,.4);color:#00FFC3}
    .badge-orange{background:rgba(255,152,0,.15);border:1px solid rgba(255,152,0,.4);color:#FF9800}

    /* Device list */
    .device-row{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(0,229,255,.08)}
    .device-info{flex:2;min-width:0}
    .device-name{font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .device-id{font-size:11px;color:#56707E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .device-select{flex:1;min-width:140px}

    /* Status */
    .status{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px}
    .status-info{background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.3);color:#00E5FF}
    .status-ok{background:rgba(0,255,195,.08);border:1px solid rgba(0,255,195,.3);color:#00FFC3}
    .status-error{background:rgba(255,61,113,.08);border:1px solid rgba(255,61,113,.3);color:#FF3D71}
    .status-warn{background:rgba(255,152,0,.08);border:1px solid rgba(255,152,0,.3);color:#FF9800}

    /* SVG preview */
    .svg-preview{background:rgba(8,18,28,.9);border:1px solid rgba(0,229,255,.2);border-radius:12px;padding:12px;overflow:auto;max-height:420px}

    /* Domain section */
    .domain-header{color:#00E5FF;font-family:'Orbitron','Courier New',monospace;font-size:11px;letter-spacing:1px;padding:8px 0 4px;border-top:1px solid rgba(0,229,255,.1);margin-top:12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
    .domain-header:hover{color:#fff}
    .domain-arrow{transition:transform .2s;font-size:10px;color:#56707E}
    .domain-arrow.open{transform:rotate(180deg)}
    .domain-content{overflow:hidden;transition:max-height .3s ease}
    .domain-content.collapsed{max-height:0!important}
    /* Sensor sections styled differently */
    .domain-sensor .domain-header{color:#56707E;font-size:10px}
    .domain-sensor .domain-header:hover{color:#8FB6C9}

    /* Progress */
    .progress-bar{height:4px;background:rgba(0,229,255,.1);border-radius:2px;overflow:hidden;margin:8px 0}
    .progress-fill{height:100%;background:#00E5FF;border-radius:2px;transition:width .3s}

    /* Spinner */
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(0,229,255,.2);border-top-color:#00E5FF;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
  </style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">⬡</div>
    <div class="logo-text">
      <h1>VISIO SAPIENS</h1>
      <p>DISCOVERY WIZARD</p>
    </div>
    <div class="ha-url" id="ha-url"></div>
  </div>

  <!-- STEP BAR -->
  <div class="steps">
    <div class="step active" id="s1"><div class="step-bar"></div><div class="step-label">1. STRUCTURE</div></div>
    <div class="step" id="s2"><div class="step-bar"></div><div class="step-label">2. APPAREILS</div></div>
    <div class="step" id="s3"><div class="step-bar"></div><div class="step-label">3. MODÈLE</div></div>
    <div class="step" id="s4"><div class="step-bar"></div><div class="step-label">4. APERÇU</div></div>
    <div class="step" id="s5"><div class="step-bar"></div><div class="step-label">5. PUBLICATION</div></div>
  </div>

  <!-- CONTENT -->
  <div id="content"></div>

</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────
const HA_URL   = window.location.origin;
const DOMAIN_ICON = {
  light:"💡",switch:"🔌",sensor:"📡",binary_sensor:"🚨",
  climate:"🌡",media_player:"🎵",cover:"🪟",camera:"📷",
  alarm_control_panel:"🔒",vacuum:"🤖",fan:"💨",lock:"🔑",input_boolean:"🔘"
};
const EXTERIOR_TYPES = ["Jardin","Piscine","Jacuzzi","Garage","Terrasse","Véranda"];

let state = {
  token: localStorage.getItem("osv_ha_token") || "",
  step: 0,   // 0=token, 1-5=phases
  house: { floors:[], exteriors:[] },
  devices: [],
  sensors: [],        // capteurs sensor.* relevés au scan (pour pairage énergie)
  modelYaml: "",      // fragment rooms généré (house_rooms.yaml)
  previewOk: false,   // un aperçu a-t-il été généré avec succès ?
  gitlab: {
    url: localStorage.getItem("osv_gitlab_url") || "http://192.168.1.11:10000",
    projectId: localStorage.getItem("osv_gitlab_project") || "",
    token: localStorage.getItem("osv_gitlab_token") || "",
    branch: localStorage.getItem("osv_gitlab_branch") || "main",
  },
};

document.getElementById("ha-url").textContent = HA_URL;

// ─── API ──────────────────────────────────────────────────────────────────
async function haGet(path) {
  const r = await fetch(`${HA_URL}/api/${path}`, {
    headers:{ Authorization:`Bearer ${state.token}` }
  });
  if (!r.ok) throw new Error(`${path}: ${r.status} ${r.statusText}`);
  return r.json();
}

async function haPost(path, data={}) {
  const r = await fetch(`${HA_URL}/api/${path}`, {
    method:"POST",
    headers:{ Authorization:`Bearer ${state.token}`, "Content-Type":"application/json" },
    body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return r.json().catch(()=>({}));
}

async function callService(domain, service, data={}) {
  return haPost(`services/${domain}/${service}`, data);
}

// ─── Step bar ─────────────────────────────────────────────────────────────
function setStep(n) {
  state.step = n;
  [1,2,3,4,5].forEach(i => {
    const el = document.getElementById(`s${i}`);
    if (el) el.className = "step" + (i < n ? " done" : i === n ? " active" : "");
  });
}

// ─── Render router ────────────────────────────────────────────────────────
function render() {
  const c = document.getElementById("content");
  if (!state.token) { renderToken(c); return; }
  if (state.step === 0) setStep(1);
  if (state.step === 1) renderPhase1(c);
  else if (state.step === 2) renderPhase2(c);
  else if (state.step === 3) renderPhase3(c);
  else if (state.step === 4) renderPhaseGit(c);
  else if (state.step === 5) renderPhase4(c);
}

// ─── TOKEN SCREEN ─────────────────────────────────────────────────────────
function renderToken(c) {
  c.innerHTML = `
    <div class="card" style="max-width:480px;margin:40px auto">
      <div class="card-title">CONNEXION HOME ASSISTANT</div>
      <div class="card-sub">Crée un jeton longue durée dans <em>Profil → Jetons d'accès longue durée</em>.</div>
      <label>JETON D'ACCÈS</label>
      <input type="password" id="tok" placeholder="eyJhbGciOi…" style="margin-bottom:16px"/>
      <button class="btn" onclick="saveToken()">Connexion →</button>
    </div>`;
  const tok = document.getElementById("tok");
  tok.value = state.token;
  tok.addEventListener("keydown", e => e.key === "Enter" && saveToken());
}

async function saveToken() {
  const t = document.getElementById("tok").value.trim();
  if (!t) return;
  try {
    state.token = t;
    await haGet("states?limit=1");
    localStorage.setItem("osv_ha_token", t);
    setStep(1);
    render();
  } catch(e) {
    alert("Jeton invalide ou HA inaccessible : " + e.message);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// PHASE 1 — Structure de la maison
// ═══════════════════════════════════════════════════════════════════════════
function renderPhase1(c) {
  const h = state.house;
  let html = `
    <div class="card">
      <div class="card-title">PHASE 1 — STRUCTURE DE LA MAISON</div>
      <div class="card-sub">Définissez les étages, pièces et espaces extérieurs.</div>
      <button class="btn btn-sm" onclick="addFloor()">+ Ajouter un étage</button>
    </div>`;

  h.floors.forEach((floor, fi) => {
    html += `
    <div class="card">
      <div class="row">
        <span style="color:#00E5FF;font-size:11px;font-family:'Orbitron','Courier New',monospace;white-space:nowrap">ÉTAGE ${fi+1}</span>
        <input type="text" class="flex1" value="${esc(floor.name)}" oninput="updFloorName(${fi},this.value)" placeholder="Nom de l'étage"/>
        <button class="btn btn-sm btn-danger" onclick="delFloor(${fi})">✕</button>
      </div>
      <div id="rooms-${fi}">`;
    floor.rooms.forEach((r, ri) => {
      html += `
        <div class="row" style="margin-left:20px">
          <input type="text" class="flex1" value="${esc(r.name)}" oninput="updRoom(${fi},${ri},'name',this.value)" placeholder="Nom de la pièce"/>
          <input type="color" value="${r.color}" onchange="updRoom(${fi},${ri},'color',this.value)" title="Couleur"/>
          <button class="btn btn-sm btn-danger" onclick="delRoom(${fi},${ri})">✕</button>
        </div>`;
    });
    html += `</div>
      <button class="btn btn-sm" style="margin-top:8px;margin-left:20px" onclick="addRoom(${fi})">+ Pièce</button>
    </div>`;
  });

  html += `
    <div class="card">
      <div class="card-title" style="margin-bottom:12px">ESPACES EXTÉRIEURS</div>
      <div id="ext-chips">`;
  EXTERIOR_TYPES.forEach(e => {
    const on = h.exteriors.includes(e);
    html += `<span class="chip${on?' on':''}" onclick="toggleExt('${e}')">${e}</span>`;
  });
  html += `</div>
      <div class="row" style="margin-top:12px">
        <input type="text" id="custom-ext" class="flex1" placeholder="Autre espace…" onkeydown="addCustomExt(event)"/>
        <button class="btn btn-sm" onclick="addCustomExtBtn()">+</button>
      </div>
    </div>
    <div class="actions">
      <div></div>
      <div class="actions-right">
        <button class="btn" onclick="goPhase2()" ${canGoPhase2()?'':'disabled'}>
          Suivant → Découverte des appareils
        </button>
      </div>
    </div>`;

  c.innerHTML = html;
}

function canGoPhase2() {
  return state.house.floors.some(f => f.rooms.some(r => r.name.trim()));
}

function addFloor() {
  const n = state.house.floors.length;
  state.house.floors.push({ name: n===0?"Rez-de-chaussée":`Étage ${n}`, rooms:[] });
  render();
}
function delFloor(fi) { state.house.floors.splice(fi,1); render(); }
function updFloorName(fi,v) { state.house.floors[fi].name=v; }
function addRoom(fi) { state.house.floors[fi].rooms.push({name:"",color:"#0A2030"}); render(); }
function delRoom(fi,ri) { state.house.floors[fi].rooms.splice(ri,1); render(); }
function updRoom(fi,ri,k,v) { state.house.floors[fi].rooms[ri][k]=v; }
function toggleExt(name) {
  const ex = state.house.exteriors;
  const i = ex.indexOf(name);
  if (i>=0) ex.splice(i,1); else ex.push(name);
  render();
}
function addCustomExt(e) { if(e.key==="Enter") addCustomExtBtn(); }
function addCustomExtBtn() {
  const inp = document.getElementById("custom-ext");
  const v = inp.value.trim();
  if (v && !state.house.exteriors.includes(v)) {
    state.house.exteriors.push(v);
    inp.value = "";
    render();
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// PHASE 2 — Découverte + assignation
// ═══════════════════════════════════════════════════════════════════════════
function renderPhase2(c) {
  const allRooms = getAllRooms();
  const assigned = state.devices.filter(d=>d.room).length;

  let html = `
    <div class="card">
      <div class="card-title">PHASE 2 — DÉCOUVERTE DES APPAREILS</div>
      <div class="card-sub">Lancez le scan HA pour récupérer les appareils, puis assignez chacun à une pièce.</div>
      <div class="status status-info" style="margin-bottom:16px">
        💡 Assignez au moins un appareil à une pièce pour continuer. Les appareils non assignés seront ignorés lors de la génération du plan — vous pourrez les assigner plus tard via un nouveau scan.
      </div>
      <button class="btn" onclick="runDiscoveryScan()" id="btn-scan">
        ⚡ Lancer le scan Home Assistant
      </button>
    </div>
    <div id="scan-status"></div>`;

  if (state.devices.length > 0) {
    const pct = Math.round(assigned / state.devices.length * 100);
    html += `
    <div class="card">
      <div class="row">
        <span style="color:#fff;font-size:14px">${state.devices.length} appareils trouvés</span>
        <span class="badge badge-cyan">${assigned} assignés</span>
        <span class="badge badge-orange">${state.devices.length - assigned} non assignés</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>`;

    // Grouper par domaine — appareils en premier, sensors en bas
    const SENSOR_DOMAINS = ["sensor","binary_sensor"];
    const byDomain = {};
    state.devices.forEach(d => {
      const dom = d.entity_id.split(".")[0];
      if (!byDomain[dom]) byDomain[dom] = [];
      byDomain[dom].push(d);
    });

    // Trier : appareils physiques d'abord, puis sensors
    const sortedEntries = Object.entries(byDomain).sort(([a],[b]) => {
      const aIsSensor = SENSOR_DOMAINS.includes(a);
      const bIsSensor = SENSOR_DOMAINS.includes(b);
      if (aIsSensor && !bIsSensor) return 1;
      if (!aIsSensor && bIsSensor) return -1;
      return a.localeCompare(b);
    });

    const roomOptions = `<option value="">— Non assigné —</option>` +
      allRooms.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join("");

    sortedEntries.forEach(([dom, devs]) => {
      const isSensor = SENSOR_DOMAINS.includes(dom);
      const domId = `dom-${dom}`;
      const isOpen = !isSensor; // appareils ouverts, sensors repliés
      html += `<div class="card${isSensor?' domain-sensor':''}">
        <div class="domain-header" onclick="toggleDomain('${domId}')">
          <span>${DOMAIN_ICON[dom]||"📦"} ${dom.toUpperCase().replace("_"," ")} <span class="badge badge-${isSensor?'orange':'cyan'}">${devs.length}</span></span>
          ${isSensor?`<span class="domain-arrow" id="arr-${domId}">▼</span>`:''}
        </div>
        <div class="domain-content${isSensor?' collapsed':''}" id="${domId}" style="max-height:${isOpen?'9999px':'0'}">`;
      devs.forEach(dev => {
        const sel = roomOptions.replace(
          `value="${esc(dev.room||'')}"`,
          `value="${esc(dev.room||'')}" selected`
        );
        html += `
        <div class="device-row">
          <div class="device-info">
            <div class="device-name">${esc(dev.friendly_name)}</div>
            <div class="device-id">${esc(dev.entity_id)}</div>
          </div>
          <select class="device-select" onchange="assignDevice('${esc(dev.entity_id)}',this.value)">${sel}</select>
        </div>`;
      });
      html += `</div></div>`;
    });
  }

  html += `
    <div class="actions">
      <button class="btn btn-ghost" onclick="goPhase1()">← Retour</button>
      <div class="actions-right">
        <button class="btn" onclick="goPhase3()" ${assigned>0?'':'disabled'}>
          Suivant → Générer le modèle
        </button>
      </div>
    </div>`;

  c.innerHTML = html;
}

async function runDiscoveryScan() {
  const btn = document.getElementById("btn-scan");
  const status = document.getElementById("scan-status");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>Scan en cours…`;

  status.innerHTML = `<div class="status status-info"><span class="spinner"></span>Appel du script de découverte HA…</div>`;

  try {
    // 1. Lancer le script Python via HA service
    await callService("script", "turn_on", { entity_id:"script.vssp_run_discovery" });
    status.innerHTML = `<div class="status status-info"><span class="spinner"></span>Script lancé — récupération directe des entités…</div>`;

    // 2. Récupérer directement les états HA (plus fiable)
    await new Promise(r => setTimeout(r, 1500));
    // Appareils physiques uniquement — on exclut sensor/binary_sensor
    // (capteurs de mesure récupérés automatiquement par le dashboard)
    // Appareils physiques uniquement
    const DOMAINS = ["light","switch","climate","media_player","cover",
                     "camera","alarm_control_panel","vacuum","fan","lock",
                     "input_boolean","button","remote"];
    const states = await haGet("states");
    // Capteurs de mesure : gardés de côté pour le pairage puissance/énergie
    state.sensors = states
      .filter(s => s.entity_id.startsWith("sensor."))
      .map(s => s.entity_id);
    const devs = states
      .filter(s => DOMAINS.includes(s.entity_id.split(".")[0]))
      .map(s => ({
        entity_id: s.entity_id,
        friendly_name: s.attributes?.friendly_name || s.entity_id,
        state: s.state,
        room: null,
      }));

    state.devices = devs;
    status.innerHTML = `<div class="status status-ok">✓ ${devs.length} appareils récupérés</div>`;
    btn.innerHTML = `⚡ Relancer le scan`;
    btn.disabled = false;
    render();
  } catch(e) {
    status.innerHTML = `<div class="status status-error">Erreur : ${e.message}</div>`;
    btn.innerHTML = `⚡ Lancer le scan Home Assistant`;
    btn.disabled = false;
  }
}

function assignDevice(entity_id, room) {
  const dev = state.devices.find(d => d.entity_id === entity_id);
  if (dev) dev.room = room || null;
  // Mettre à jour le compteur sans re-render complet
  const assigned = state.devices.filter(d=>d.room).length;
  const pct = Math.round(assigned / state.devices.length * 100);
  const progEl = document.querySelector(".progress-fill");
  if (progEl) progEl.style.width = pct + "%";
  const badges = document.querySelectorAll(".badge");
  if (badges[0]) badges[0].textContent = assigned + " assignés";
  if (badges[1]) badges[1].textContent = (state.devices.length - assigned) + " non assignés";
  // Activer le bouton Suivant dès qu'au moins un appareil est assigné
  const btnNext = document.querySelector(".actions-right .btn");
  if (btnNext) btnNext.disabled = assigned === 0;
}

// ═══════════════════════════════════════════════════════════════════════════
// PHASE 3 — Génération du modèle (rooms → house_rooms.yaml)
// ═══════════════════════════════════════════════════════════════════════════

function slugify(name) {
  return String(name).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
}

// Icône mdi devinée depuis le nom / domaine (modifiable ensuite dans le YAML)
const ICON_RULES = [
  [/aspirateur|vacuum/i, "mdi:vacuum"],
  [/congel|freezer/i, "mdi:snowflake"],
  [/frigo|refrigerat|fridge/i, "mdi:fridge"],
  [/lave.?linge|washing/i, "mdi:washing-machine"],
  [/seche.?linge|dryer/i, "mdi:tumble-dryer"],
  [/lave.?vaisselle|dishwasher/i, "mdi:dishwasher"],
  [/four|oven/i, "mdi:toaster-oven"],
  [/alarme|alarm/i, "mdi:alarm"],
  [/livebox|box|router|provider/i, "mdi:web"],
  [/commutateur|switch|netgear|lan/i, "mdi:lan"],
  [/synology|nas/i, "mdi:nas"],
  [/tv|television/i, "mdi:television"],
  [/clim|air.?cond/i, "mdi:air-conditioner"],
  [/chauffe.?eau|boiler/i, "mdi:water-boiler"],
  [/piscine|pool/i, "mdi:pool"],
  [/lamp|light|eclairage|lumiere/i, "mdi:lightbulb-on-outline"],
  [/bureau|desk/i, "mdi:desk-lamp"],
  [/prise|plug|socket/i, "mdi:power-socket-fr"],
];
const DOMAIN_MDI = { light:"mdi:lightbulb-on-outline", switch:"mdi:power-socket-fr",
  climate:"mdi:thermostat", media_player:"mdi:speaker", cover:"mdi:window-shutter",
  camera:"mdi:cctv", alarm_control_panel:"mdi:shield-home", vacuum:"mdi:vacuum",
  fan:"mdi:fan", lock:"mdi:lock" };

function guessIcon(name, domain) {
  for (const [re, icon] of ICON_RULES) if (re.test(name)) return icon;
  return DOMAIN_MDI[domain] || "mdi:power-plug";
}

// Cherche les capteurs puissance/énergie liés à un appareil via son stem
// (ex: switch.shelly_bureau → sensor.shelly_bureau_power / _energy_today)
const POWER_RE = /_(power|puissance|watts?)$/;
const ENERGY_RE = /_(energy_today|energy|energie|kwh)$/;

function findEnergyPair(entity_id) {
  const stem = entity_id.split(".")[1];
  const related = state.sensors
    .map(s => s.split(".")[1])
    .filter(oid => oid === stem || oid.startsWith(stem + "_"));
  const power = related.find(oid => POWER_RE.test(oid));
  const energy = related.find(oid => ENERGY_RE.test(oid));
  return {
    power: power ? "sensor." + power : null,
    energy: energy ? "sensor." + energy : null,
  };
}

function buildModelYaml() {
  const rooms = getAllRooms();
  const now = new Date().toISOString().slice(0, 16).replace("T", " ");
  let complete = 0, incomplete = 0;

  let y = "";
  y += "########################################################################\n";
  y += "# Visio Sapiens — rooms générées par le Discovery Wizard (" + now + ")\n";
  y += "# Fichier fusionné automatiquement par vssp/generate_dashboards.py :\n";
  y += "# s'il existe, sa clé rooms: remplace celle de model/house.yaml.\n";
  y += "# Compléter les champs model: et ajuster les icônes si besoin.\n";
  y += "########################################################################\n";
  y += "rooms:\n";

  rooms.forEach(roomName => {
    const devs = state.devices.filter(d => d.room === roomName);
    y += "  - id: " + slugify(roomName) + "\n";
    y += '    name: "' + roomName.replace(/"/g, "'") + '"\n';
    y += "    devices:\n";
    let emitted = 0;
    devs.forEach(d => {
      const pair = findEnergyPair(d.entity_id);
      const name = (d.friendly_name || d.entity_id).replace(/"/g, "'");
      const icon = guessIcon(name, d.entity_id.split(".")[0]);
      if (pair.power && pair.energy) {
        y += '      - name: "' + name + '"\n';
        y += "        icon: " + icon + "\n";
        y += '        model: "A COMPLETER"\n';
        y += "        power_entity: " + pair.power + "\n";
        y += "        energy_entity: " + pair.energy + "\n";
        emitted++; complete++;
      } else {
        y += "      # TODO " + d.entity_id + ' ("' + name + '") : capteurs\n';
        y += "      #      puissance/energie non trouves — a renseigner\n";
        y += "      #      manuellement (power_entity / energy_entity)\n";
        incomplete++;
      }
    });
    if (emitted === 0) y += "      []\n";
  });

  state.modelYaml = y.replace(/      \[\]\n/g, "");
  // rooms sans device complet : devices: [] valide pour le générateur
  state.modelYaml = state.modelYaml.replace(/    devices:\n(?=  - id:|$)/g, "    devices: []\n");
  return { complete, incomplete };
}

function renderPhase3(c) {
  const rooms = getAllRooms();
  const assigned = state.devices.filter(d => d.room).length;

  let html = `
    <div class="card">
      <div class="card-title">PHASE 3 — GÉNÉRATION DU MODÈLE</div>
      <div class="card-sub">
        Construit le fragment <code style="color:#00E5FF">house_rooms.yaml</code>
        (pièces + appareils avec leurs capteurs puissance/énergie) qui alimente
        le générateur de dashboards.
      </div>
      <div class="row" style="margin-bottom:16px">
        <span class="badge badge-cyan">${rooms.length} pièces</span>
        <span class="badge badge-cyan">${assigned} appareils assignés</span>
      </div>
      <button class="btn" onclick="doBuildModel()" id="btn-model">⚙ Générer le modèle</button>
    </div>
    <div id="model-status"></div>
    <div id="model-preview"></div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="goPhase2()">← Retour</button>
      <div class="actions-right">
        <button class="btn" onclick="goPhaseGit()" ${state.modelYaml ? "" : "disabled"}>
          Suivant → Aperçu de test
        </button>
      </div>
    </div>`;
  c.innerHTML = html;
  if (state.modelYaml) showModelPreview({ complete: -1, incomplete: -1 });
}

function doBuildModel() {
  const stats = buildModelYaml();
  showModelPreview(stats);
  const next = document.querySelector(".actions-right .btn");
  if (next) next.disabled = false;
}

function showModelPreview(stats) {
  const status = document.getElementById("model-status");
  const prev = document.getElementById("model-preview");
  if (stats.complete >= 0) {
    status.innerHTML = `<div class="status ${stats.incomplete ? "status-warn" : "status-ok"}">
      ✓ Modèle généré — ${stats.complete} appareil(s) avec capteurs énergie détectés` +
      (stats.incomplete ? `, ${stats.incomplete} en TODO (pas de capteur puissance/énergie trouvé)` : "") +
      `</div>`;
  }
  prev.innerHTML = `
    <div class="card">
      <div class="row" style="margin-bottom:8px">
        <button class="btn btn-sm" onclick="copyModel()">📋 Copier</button>
        <button class="btn btn-sm" onclick="downloadModel()">⬇ Télécharger house_rooms.yaml</button>
      </div>
      <pre class="svg-preview" style="white-space:pre-wrap;color:#8FB6C9;font-size:12px;line-height:1.5">${esc(state.modelYaml)}</pre>
    </div>`;
}

function copyModel() {
  navigator.clipboard.writeText(state.modelYaml)
    .then(() => alert("Modèle copié dans le presse-papiers"));
}

function downloadModel() {
  const blob = new Blob([state.modelYaml], { type: "text/yaml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "house_rooms.yaml";
  a.click();
  URL.revokeObjectURL(a.href);
}

// ═══════════════════════════════════════════════════════════════════════════
// PHASE 4 — Aperçu (dashboard de test, staging intact)
// ═══════════════════════════════════════════════════════════════════════════
// Rien n'est commité et aucun dashboard existant n'est touché : le modèle
// part dans house_rooms.preview.yaml et le rendu dans energy_preview.yaml,
// servi sous l'url /vssp-energy-preview/energy.

const PREVIEW_URL = "/vssp-energy-preview/energy";
const PREVIEW_STATUS_URL = "/local/vssp/preview_status.json";

function renderPhaseGit(c) {
  var hasModel = !!state.modelYaml;

  c.innerHTML = `
    <div class="card">
      <div class="card-title">PHASE 4 — APERÇU DE TEST</div>
      <div class="card-sub">
        Génère un dashboard <strong>isolé</strong> à partir du modèle, pour
        itérer autant de fois que nécessaire.
        <span style="color:#00FFC3">Aucun commit, aucun dashboard existant modifié.</span>
      </div>
      ${hasModel
        ? '<div class="status status-ok">✓ Modèle prêt à être testé</div>'
        : '<div class="status status-warn">⚠ Aucun modèle généré — retourne en phase 3</div>'}
      <div class="card" style="background:rgba(0,229,255,.04);margin:16px 0 0">
        <div style="color:#8FB6C9;font-size:13px;line-height:1.8">
          <strong style="color:#00E5FF">Ce qui se passe sur le pod :</strong>
          <ol style="margin:8px 0 0 20px">
            <li>Écriture du modèle dans <code style="color:#00E5FF">model/house_rooms.preview.yaml</code></li>
            <li>Rendu en <code style="color:#00E5FF">views/energy_preview.yaml</code> (url <code style="color:#00E5FF">${PREVIEW_URL}</code>)</li>
            <li>Rechargement Lovelace</li>
          </ol>
          <div style="margin-top:10px;color:#00FFC3">
            Vos fichiers <code>views/energy.yaml</code> et
            <code>model/house_rooms.yaml</code> restent intacts.
          </div>
        </div>
      </div>
      <button class="btn" onclick="runPreview()" id="btn-preview" style="margin-top:16px"
        ${hasModel ? "" : "disabled"}>
        🔍 ${state.previewOk ? "Régénérer l'aperçu" : "Générer l'aperçu de test"}
      </button>
      <button class="btn btn-ghost btn-sm" onclick="runDryRun()" id="btn-dryrun"
        style="margin-top:8px" ${hasModel ? "" : "disabled"}>
        ✓ Valider seulement (aucune écriture)
      </button>
    </div>
    <div id="preview-status"></div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="goPhase3()">← Retour au modèle</button>
      <div class="actions-right">
        <button class="btn" onclick="goPhase4()" ${state.previewOk ? "" : "disabled"}>
          Suivant → Publication
        </button>
      </div>
    </div>`;

  if (state.previewOk) showPreviewLink();
}

// Boucle d'itération : modifier le modèle → relancer l'aperçu, sans limite
async function runPreview() { await doPreview(false); }
async function runDryRun()  { await doPreview(true); }

async function doPreview(dryRun) {
  const btn = document.getElementById(dryRun ? "btn-dryrun" : "btn-preview");
  const status = document.getElementById("preview-status");
  const label = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>${dryRun ? "Validation…" : "Génération…"}`;

  try {
    // 1. Modèle → pod, en base64 (UTF-8 safe pour les accents)
    status.innerHTML = `<div class="status status-info"><span class="spinner"></span>Étape 1/3 — Envoi du modèle sur le pod…</div>`;
    const b64 = btoa(unescape(encodeURIComponent(state.modelYaml)));
    await callService("script", "vssp_preview_dashboards", {
      content_b64: b64,
      dry_run: dryRun,
    });

    // 2. Le script écrit puis génère ; on laisse le temps au shell_command
    status.innerHTML = `<div class="status status-info"><span class="spinner"></span>Étape 2/3 — ${dryRun ? "Validation du rendu" : "Génération du dashboard de test"}…</div>`;
    await new Promise(r => setTimeout(r, 2500));

    // 3. Lire le rapport JSON écrit par le générateur
    status.innerHTML = `<div class="status status-info"><span class="spinner"></span>Étape 3/3 — Lecture du rapport…</div>`;
    const report = await fetchPreviewStatus();

    if (!report) {
      status.innerHTML = `<div class="status status-warn">
        Rapport introuvable (${esc(PREVIEW_STATUS_URL)}).<br>
        <span style="font-size:12px">Vérifie les notifications Home Assistant :
        le script a peut-être échoué, ou le rapport n'est pas encore servi.</span></div>`;
    } else if (!report.ok) {
      status.innerHTML = `<div class="status status-error">
        Génération refusée — le modèle est invalide :
        <ul style="margin:8px 0 0 18px">${(report.errors||[]).map(e=>`<li>${esc(e)}</li>`).join("")}</ul>
        <span style="font-size:12px">Corrige en phase 3 puis relance. Rien n'a été écrit.</span></div>`;
    } else if (dryRun) {
      status.innerHTML = `<div class="status status-ok">
        ✓ Rendu valide — ${report.rooms} pièces, ${report.devices} appareils, ${report.circuits} circuits.
        Aucun fichier écrit.</div>`;
    } else {
      state.previewOk = true;
      status.innerHTML = `<div class="status status-ok">
        ✓ Aperçu généré — ${report.rooms} pièces, ${report.devices} appareils, ${report.circuits} circuits`
        + (report.todo_devices ? ` <span class="badge badge-orange">${report.todo_devices} appareil(s) en TODO</span>` : "")
        + `</div>`;
      showPreviewLink();
      const next = document.querySelector(".actions-right .btn");
      if (next) next.disabled = false;
    }
    btn.innerHTML = dryRun ? "✓ Valider seulement (aucune écriture)" : "🔄 Régénérer l'aperçu";
  } catch(e) {
    status.innerHTML = `<div class="status status-error">Erreur : ${esc(e.message)}</div>`;
    btn.innerHTML = label;
  }
  btn.disabled = false;
}

// Cache-busting : le rapport change à chaque génération
async function fetchPreviewStatus() {
  try {
    const r = await fetch(PREVIEW_STATUS_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { return null; }
}

function showPreviewLink() {
  const status = document.getElementById("preview-status");
  if (!status) return;
  status.innerHTML += `
    <div class="card" style="margin-top:12px">
      <div class="card-title" style="font-size:12px">DASHBOARD DE TEST</div>
      <div style="color:#8FB6C9;font-size:13px;line-height:1.7;margin-bottom:12px">
        Ouvre-le dans un nouvel onglet, vérifie le rendu, puis reviens ici :
        corrige le modèle en phase 3 et relance l'aperçu autant de fois
        que nécessaire. La publication reste une action séparée.
      </div>
      <a class="btn" href="${HA_URL}${PREVIEW_URL}" target="_blank"
         style="display:inline-block;text-decoration:none">
        ↗ Ouvrir ${esc(PREVIEW_URL)}
      </a>
    </div>`;
}

// ═══════════════════════════════════════════════════════════════════════════
// PHASE 5 — Publication (GitLab → CI → staging)
// ═══════════════════════════════════════════════════════════════════════════
// Seule phase qui touche le staging. À ne lancer qu'après validation
// de l'aperçu en phase 4.

function renderPhase4(c) {
  var g = state.gitlab;
  var ready = state.previewOk;

  c.innerHTML = '<div class="card">' +
    '<div class="card-title">PHASE 5 — PUBLICATION</div>' +
    '<div class="card-sub">Commit du modèle validé — ta chaîne CI le déploiera sur le staging.</div>' +
    (ready ?
      '<div class="status status-ok">✓ Aperçu validé — prêt à publier</div>' :
      '<div class="status status-warn">⚠ Aucun aperçu généré — valide d\'abord le rendu en phase 4</div>') +
    '<div style="margin-top:16px">' +
      '<label>URL GITLAB</label>' +
      '<input type="text" id="gl-url" value="' + esc(g.url) + '" style="margin-bottom:12px"/>' +
      '<label>ID DU PROJET (visible sous le nom du repo)</label>' +
      '<input type="text" id="gl-project" value="' + esc(g.projectId) + '" placeholder="ex: 2" style="margin-bottom:12px"/>' +
      '<label>TOKEN D\'ACCÈS (scope: api)</label>' +
      '<input type="password" id="gl-token" value="' + esc(g.token) + '" placeholder="glpat-…" style="margin-bottom:12px"/>' +
      '<label>BRANCHE</label>' +
      '<input type="text" id="gl-branch" value="' + esc(g.branch) + '" style="margin-bottom:12px"/>' +
      '<label>CHEMIN DANS LE REPO</label>' +
      '<input type="text" id="gl-path" value="home-assistant/dashboards/model/house_rooms.yaml" style="margin-bottom:16px"/>' +
    '</div>' +
    '<button class="btn" onclick="pushToGitLab()" id="btn-git-push"' + (ready ? '' : ' disabled') + '>' +
      '🚀 Commit + Push le modèle' +
    '</button>' +
    '</div>' +
    '<div id="git-status"></div>' +
    '<div class="card" style="margin-top:16px">' +
      '<div class="card-title" style="font-size:12px;margin-bottom:8px">NETTOYAGE (OPTIONNEL)</div>' +
      '<div style="color:#8FB6C9;font-size:13px;line-height:1.7;margin-bottom:12px">' +
        'Une fois publié, tu peux supprimer le dashboard d\'aperçu du pod ' +
        '(views/energy_preview.yaml et model/house_rooms.preview.yaml).' +
      '</div>' +
      '<button class="btn btn-ghost btn-sm" onclick="cleanPreview()">🧹 Supprimer l\'aperçu</button>' +
    '</div>' +
    '<div class="actions">' +
      '<button class="btn btn-ghost" onclick="goPhaseGit()">← Retour à l\'aperçu</button>' +
    '</div>';
}

async function cleanPreview() {
  try {
    await callService("shell_command", "vssp_clean_preview");
    state.previewOk = false;
    document.getElementById("git-status").innerHTML =
      '<div class="status status-ok">✓ Fichiers d\'aperçu supprimés du pod</div>';
  } catch(e) {
    document.getElementById("git-status").innerHTML =
      '<div class="status status-error">Erreur : ' + esc(e.message) + '</div>';
  }
}

async function pushToGitLab() {
  var btn = document.getElementById('btn-git-push');
  var status = document.getElementById('git-status');

  state.gitlab.url = document.getElementById('gl-url').value.trim().replace(/\/$/, '');
  state.gitlab.projectId = document.getElementById('gl-project').value.trim();
  state.gitlab.token = document.getElementById('gl-token').value.trim();
  state.gitlab.branch = document.getElementById('gl-branch').value.trim() || 'main';
  var filePath = document.getElementById('gl-path').value.trim();

  localStorage.setItem('osv_gitlab_url', state.gitlab.url);
  localStorage.setItem('osv_gitlab_project', state.gitlab.projectId);
  localStorage.setItem('osv_gitlab_token', state.gitlab.token);
  localStorage.setItem('osv_gitlab_branch', state.gitlab.branch);

  if (!state.gitlab.projectId || !state.gitlab.token) {
    status.innerHTML = '<div class="status status-error">ID projet et token requis</div>';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Push en cours…';

  try {
    // 1. Encodage base64 (UTF-8 safe : accents des noms de pièces)
    status.innerHTML = '<div class="status status-info"><span class="spinner"></span>Étape 1/2 — Encodage du modèle…</div>';
    var base64 = btoa(unescape(encodeURIComponent(state.modelYaml)));

    // 2. Commit via l'API GitLab (create or update)
    status.innerHTML = '<div class="status status-info"><span class="spinner"></span>Étape 2/2 — Commit dans GitLab…</div>';
    var apiUrl = state.gitlab.url + '/api/v4/projects/' + encodeURIComponent(state.gitlab.projectId) +
                 '/repository/files/' + encodeURIComponent(filePath);

    var body = {
      branch: state.gitlab.branch,
      content: base64,
      encoding: 'base64',
      commit_message: 'feat(vssp): update house model via Discovery Wizard'
    };

    // Essayer update (PUT) d'abord, sinon create (POST)
    var resp = await fetch(apiUrl, {
      method: 'PUT',
      headers: { 'PRIVATE-TOKEN': state.gitlab.token, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (resp.status === 400 || resp.status === 404) {
      resp = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'PRIVATE-TOKEN': state.gitlab.token, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    if (!resp.ok) {
      var errText = await resp.text();
      throw new Error('GitLab API ' + resp.status + ': ' + errText.slice(0, 200));
    }

    status.innerHTML = '<div class="status status-ok">' +
      '✓ Modèle commité dans <strong>' + esc(filePath) + '</strong> (branche ' + esc(state.gitlab.branch) + ')<br>' +
      '<span style="font-size:12px">Ta chaîne CI va maintenant le déployer sur le staging.</span></div>';
    btn.innerHTML = '✓ Publié';
  } catch(e) {
    status.innerHTML = '<div class="status status-error">Erreur : ' + esc(e.message) + '</div>';
    btn.innerHTML = '🚀 Réessayer';
    btn.disabled = false;
  }
}

// ─── Navigation ───────────────────────────────────────────────────────────
function goPhase1() { setStep(1); render(); }
function goPhase2() { setStep(2); render(); }
function goPhase3() { setStep(3); render(); }
function goPhaseGit() { setStep(4); render(); }
function goPhase4() { setStep(5); render(); }

// ─── Helpers ──────────────────────────────────────────────────────────────
function getAllRooms() {
  const r = [];
  state.house.floors.forEach(f => f.rooms.forEach(rm => rm.name && r.push(rm.name)));
  state.house.exteriors.forEach(e => r.push(e));
  return r;
}

function esc(str) {
  return String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function toggleDomain(id) {
  const el = document.getElementById(id);
  const arr = document.getElementById(`arr-${id}`);
  if (!el) return;
  if (el.classList.contains("collapsed")) {
    el.classList.remove("collapsed");
    el.style.maxHeight = "9999px";
    if (arr) arr.classList.add("open");
  } else {
    el.classList.add("collapsed");
    el.style.maxHeight = "0";
    if (arr) arr.classList.remove("open");
  }
}

// ─── Boot ─────────────────────────────────────────────────────────────────

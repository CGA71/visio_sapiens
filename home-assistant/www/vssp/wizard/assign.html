<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visio Sapiens — Device assignment</title>
<!--
  EN | Served as /local/vssp/wizard/assign.html, embedded in the ADMIN view
  EN | through an iframe.
  FR | Servi comme /local/vssp/wizard/assign.html, integre dans la vue ADMIN
  FR | via une iframe.

  EN | WHY A WEBHOOK AND NOT THE REST API
  EN | An iframe cannot reach the `hass` object of the parent page, and the
  EN | REST API needs a Bearer token. Asking the user to paste a long-lived
  EN | token into a form, then keeping it in localStorage, puts a credential
  EN | with full control of the instance into browser storage — for a form
  EN | that only needs to send one list. A webhook needs no token at all, and
  EN | `local_only: true` keeps it on the LAN. The webhook id is the only
  EN | secret, and it never leaves the local network.
  FR | POURQUOI UN WEBHOOK ET PAS L API REST
  FR | Une iframe ne peut pas atteindre l objet `hass` de la page parente, et
  FR | l API REST exige un jeton Bearer. Demander a l utilisateur de coller un
  FR | jeton longue duree dans un formulaire, puis le garder dans
  FR | localStorage, place dans le stockage du navigateur un identifiant qui
  FR | controle toute l instance — pour un formulaire qui n a qu une liste a
  FR | envoyer. Un webhook n exige aucun jeton, et `local_only: true` le
  FR | maintient sur le reseau local. L identifiant du webhook est le seul
  FR | secret, et il ne quitte jamais le reseau local.
-->
<style>
  :root {
    --bg: #050b12;
    --panel: rgba(8,18,28,0.75);
    --line: rgba(0,229,255,0.28);
    --line-soft: rgba(0,229,255,0.12);
    --cyan: #00E5FF;
    --green: #00FFC3;
    --red: #FF4D6D;
    --text: #DCEEF6;
    --muted: #8FB6C9;
    --dim: #56707E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px;
    background: transparent;
    color: var(--text);
    font-family: -apple-system, Roboto, "Helvetica Neue", sans-serif;
    font-size: 13px;
  }
  h1 {
    font-family: Orbitron, sans-serif; font-size: 14px; letter-spacing: 2px;
    color: var(--cyan); margin: 0 0 4px 0; text-transform: uppercase;
  }
  .sub { color: var(--muted); font-size: 11px; margin-bottom: 12px; }

  /* EN | Same header + step bar as vssp_rooms_floors.html — this screen is
     EN | step 2 of the same three-phase flow, reached by its "Next" button.
     EN | Without a matching header, jumping from that branded page to this
     EN | plain table reads as leaving the wizard rather than continuing it.
     FR | Meme en-tete + barre d etapes que vssp_rooms_floors.html — cet
     FR | ecran est l etape 2 du meme flux en trois phases, atteint par son
     FR | bouton « Suivant ». Sans en-tete assorti, passer de cette page a
     FR | logo a ce simple tableau donne l impression de quitter le wizard
     FR | plutot que de le continuer. */
  .header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line);
    display: grid; place-items: center; color: var(--cyan); font-size: 17px;
    box-shadow: 0 0 18px rgba(0,229,255,.18); flex: none;
  }
  .header h1 { margin: 0; }
  .header .sub-label { margin: 2px 0 0; font-size: 10px; letter-spacing: 2px; color: var(--dim); }
  .steps { display: flex; gap: 10px; margin-bottom: 16px; }
  .step { flex: 1; }
  .step-bar { height: 3px; border-radius: 2px; background: rgba(0,229,255,.12); }
  .step.active .step-bar { background: var(--cyan); box-shadow: 0 0 10px rgba(0,229,255,.5); }
  .step.done .step-bar { background: var(--green); }
  .step-label {
    margin-top: 6px; font-family: Orbitron, sans-serif; font-size: 9px;
    letter-spacing: 1.5px; color: var(--dim); text-transform: uppercase;
  }
  .step.active .step-label { color: var(--cyan); }
  .step.done .step-label { color: var(--green); }
  .bar {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    margin-bottom: 10px;
  }
  input[type=text], select {
    background: rgba(0,0,0,.30); color: var(--text);
    border: 1px solid var(--line-soft); border-radius: 8px;
    padding: 6px 8px; font-size: 12px; font-family: inherit;
  }
  input[type=text] { flex: 1 1 180px; min-width: 140px; }
  select { cursor: pointer; }
  select:disabled { opacity: .35; cursor: not-allowed; }
  button {
    background: rgba(0,229,255,.10); color: var(--cyan);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 14px; font-family: Orbitron, sans-serif; font-size: 11px;
    letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
  }
  button:hover { background: rgba(0,229,255,.20); }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--line-soft); }
  .wrap {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; overflow: hidden;
  }
  .scroll { max-height: 58vh; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    position: sticky; top: 0; z-index: 1;
    background: #071320; color: var(--muted);
    font-size: 10px; font-weight: 600; letter-spacing: .6px;
    text-align: left; padding: 8px 10px; text-transform: uppercase;
    border-bottom: 1px solid var(--line-soft);
  }
  td { padding: 5px 10px; border-bottom: 1px solid rgba(0,229,255,.06); }
  tr.done td:first-child { border-left: 2px solid var(--green); }
  tr.todo td:first-child { border-left: 2px solid var(--dim); }
  .name { color: var(--text); }
  .eid { color: var(--dim); font-size: 10px; font-family: ui-monospace, monospace; }
  .msg {
    margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 12px;
    display: none; white-space: pre-line;
  }
  .msg.ok  { display: block; background: rgba(0,255,195,.08); border: 1px solid rgba(0,255,195,.35); color: var(--green); }
  .msg.err { display: block; background: rgba(255,77,109,.08); border: 1px solid rgba(255,77,109,.35); color: var(--red); }
  .count { color: var(--muted); font-size: 11px; margin-left: auto; }
  .recap { display: none; margin-top: 10px; }
  .recap-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px; padding: 12px;
  }
  .recap-room {
    border: 1px solid var(--line-soft); border-radius: 10px;
    padding: 8px 10px; background: rgba(0,0,0,.15);
  }
  .recap-room h3 {
    margin: 0 0 6px 0; font-size: 12px; color: var(--cyan);
    font-family: Orbitron, sans-serif; letter-spacing: 1px; text-transform: uppercase;
  }
  .recap-slot {
    display: flex; justify-content: space-between; gap: 8px; padding: 3px 0;
    font-size: 11px; border-bottom: 1px dashed rgba(255,255,255,.06);
  }
  .recap-slot:last-child { border-bottom: none; }
  .recap-slot .label { color: var(--muted); }
  .recap-slot .val { color: var(--text); text-align: right; }
  .recap-slot .val.empty { color: var(--dim); font-style: italic; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">⬡</div>
  <div>
    <h1 id="title">VISIO SAPIENS</h1>
    <p class="sub-label">DEVICE ASSIGNMENT</p>
  </div>
</div>

<!--
  EN | step1 is marked "done" only once DATA confirms house.yaml already
  EN | declares rooms (see load() below) — this page cannot assume the
  EN | structure step happened just because someone reached this URL.
  FR | step1 n est marque "done" qu une fois que DATA confirme que
  FR | house.yaml declare deja des pieces (voir load() plus bas) — cette
  FR | page ne peut pas supposer que l etape structure a eu lieu juste
  FR | parce que quelqu un a atteint cette URL.
-->
<div class="steps">
  <div class="step" id="step1"><div class="step-bar"></div><div class="step-label">1. Structure</div></div>
  <div class="step" id="step2"><div class="step-bar"></div><div class="step-label">2. Devices</div></div>
  <div class="step" id="step3"><div class="step-bar"></div><div class="step-label">3. Dashboards</div></div>
</div>

<div class="sub" id="subtitle">Loading…</div>

<!--
  EN | STEP 2 — the flat, filterable, editable table. Everything here writes
  EN | only to the in-memory row state (tr._get()) until Save, which now
  EN | lives on step 3 — this view is purely about deciding room+slot per
  EN | entity, not about committing.
  FR | ETAPE 2 — le tableau plat, filtrable, editable. Tout ici n ecrit que
  FR | dans l etat en memoire des lignes (tr._get()) jusqu au Save, qui vit
  FR | desormais a l etape 3 — cette vue ne sert qu a decider piece+tableau
  FR | par entite, pas a valider.
-->
<div id="step2view">
  <div class="bar">
    <input type="text" id="filter" placeholder="Filter by name, entity or domain…">
    <select id="bulkRoom"><option value="">— bulk: room —</option></select>
    <button class="ghost" id="applyBulk">Apply to filtered</button>
    <span class="count" id="count"></span>
  </div>

  <div class="wrap">
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th style="width:40%">Device</th>
            <th style="width:14%">Domain / class</th>
            <th style="width:23%">Room</th>
            <th style="width:23%">Slot</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div class="bar" style="margin-top:12px">
    <button class="ghost" id="reload">Reload</button>
    <span class="count" id="pending"></span>
    <button id="next2to3" style="margin-left:auto">Next → Dashboards</button>
  </div>
</div>

<!--
  EN | STEP 3 — recap grouped by room / slot, so the admin sees what will
  EN | actually land in the generated dashboards (one card per room, one
  EN | line per slot) before committing anything, instead of auditing
  EN | eighty flat rows. Rebuilt from the live in-memory selection every
  EN | time this step is entered, so it reflects unsaved changes too — it
  EN | can never drift from what Save is about to send, because it reads
  EN | the exact same tr._get() Save reads.
  EN | Not satisfied? BACK returns to step 2 with every selection intact —
  EN | nothing is written until SAVE AND REGENERATE is actually pressed
  EN | here.
  FR | ETAPE 3 — recapitulatif groupe par piece / tableau, pour que
  FR | l administrateur voie ce qui atterrira reellement dans les dashboards
  FR | generes (une carte par piece, une ligne par tableau) avant de rien
  FR | valider, plutot que d auditer quatre-vingts lignes a plat. Reconstruit
  FR | a partir de la selection en memoire a chaque entree dans cette etape,
  FR | donc reflete aussi les changements non enregistres — il ne peut donc
  FR | jamais diverger de ce que Save est sur le point d envoyer, puisqu il
  FR | lit exactement le meme tr._get() que Save.
  FR | Pas satisfait ? RETOUR renvoie a l etape 2 avec toute la selection
  FR | intacte — rien n est ecrit avant d avoir reellement appuye ici sur
  FR | ENREGISTRER ET REGENERER.
-->
<div id="step3view" style="display:none">
  <div class="wrap recap" id="recap" style="display:block">
    <div class="recap-grid" id="recapBody"></div>
  </div>

  <div class="bar" style="margin-top:12px">
    <button class="ghost" id="back3to2">◀ Back</button>
    <button id="save">Save and regenerate</button>
  </div>
</div>

<div class="msg" id="msg"></div>

<script>
// EN | Written by vssp_assign_prepare.py, refreshed by the DISCOVERY SCAN.
// FR | Ecrit par vssp_assign_prepare.py, rafraichi par le DISCOVERY SCAN.
const DATA_URL = '/local/vssp/assign_data.json';
const WEBHOOK  = '/api/webhook/vssp_assign';

let DATA = null;

const el = (id) => document.getElementById(id);

function option(value, label, selected) {
  const o = document.createElement('option');
  o.value = value; o.textContent = label;
  if (selected) o.selected = true;
  return o;
}

// EN | The slot list depends on the chosen room: a room only offers the slots
// EN | of its slot set. Narrowing here means an impossible pair — a shutter in
// EN | a garden — cannot be selected at all, which is better than validating
// EN | it after the fact and explaining the refusal.
// FR | La liste des tableaux depend de la piece choisie : une piece ne propose
// FR | que les tableaux de son jeu. Restreindre ici fait qu une paire
// FR | impossible — un volet dans le jardin — ne peut pas etre selectionnee,
// FR | ce qui vaut mieux que de la valider apres coup et d expliquer le refus.
function fillSlots(select, roomId, current, suggested) {
  select.innerHTML = '';
  select.appendChild(option('', '—', !current));
  if (!roomId) { select.disabled = true; return; }
  const room = DATA.rooms.find(r => r.id === roomId);
  if (!room) { select.disabled = true; return; }
  select.disabled = false;
  const pick = current || (room.slots.includes(suggested) ? suggested : '');
  room.slots.forEach(s => select.appendChild(
    option(s, DATA.slot_labels[s] || s, s === pick)));
}

function buildRow(entity) {
  const tr = document.createElement('tr');
  tr.className = entity.assigned ? 'done' : 'todo';
  tr.dataset.search = (entity.name + ' ' + entity.entity_id + ' ' + entity.domain).toLowerCase();
  tr.dataset.entity = entity.entity_id;

  const td1 = document.createElement('td');
  td1.innerHTML = '<div class="name"></div><div class="eid"></div>';
  td1.querySelector('.name').textContent = entity.name;
  td1.querySelector('.eid').textContent = entity.entity_id;

  const td2 = document.createElement('td');
  td2.innerHTML = '<div class="eid"></div><div class="eid"></div>';
  const [d1, d2] = td2.querySelectorAll('.eid');
  d1.textContent = entity.domain;
  // EN | The device_class is what drove the slot suggestion — showing it makes
  // EN | the proposal auditable instead of magic.
  // FR | Le device_class est ce qui a motive la suggestion de tableau —
  // FR | l afficher rend la proposition verifiable au lieu de magique.
  d2.textContent = entity.device_class || '';
  d2.style.color = '#00E5FF';

  // EN | An unassigned entity starts on the room suggested by its Home
  // EN | Assistant area. Nothing is written until you save, so a wrong guess
  // EN | costs one dropdown — while an empty column costs eighty.
  // FR | Une entite non assignee demarre sur la piece suggeree par sa zone
  // FR | Home Assistant. Rien n est ecrit avant l enregistrement, donc une
  // FR | mauvaise supposition coute une liste deroulante — alors qu une
  // FR | colonne vide en coute quatre-vingts.
  const preRoom = entity.room || entity.suggested_room || '';
  const td3 = document.createElement('td');
  const roomSel = document.createElement('select');
  roomSel.appendChild(option('', '—', !preRoom));
  DATA.rooms.forEach(r => roomSel.appendChild(option(r.id, r.label, r.id === preRoom)));
  td3.appendChild(roomSel);

  const td4 = document.createElement('td');
  const slotSel = document.createElement('select');
  td4.appendChild(slotSel);

  roomSel.addEventListener('change', () => {
    fillSlots(slotSel, roomSel.value, '', entity.suggested_slot);
    markPending();
  });
  slotSel.addEventListener('change', markPending);

  fillSlots(slotSel, preRoom, entity.slot, entity.suggested_slot);

  tr.append(td1, td2, td3, td4);
  tr._get = () => ({
    entity_id: entity.entity_id,
    room: roomSel.value,
    slot: slotSel.value,
  });
  return tr;
}

function markPending() {
  const rows = [...el('rows').children];
  const n = rows.filter(r => r._get().room && r._get().slot).length;
  el('pending').textContent = n + ' / ' + rows.length + ' assigned';
}

// EN | STEP SWITCHING — steps 2 and 3 are two views of the same in-memory
// EN | row state, never a navigation: nothing here reloads DATA_URL or
// EN | touches the webhook, so BACK from step 3 loses nothing, and NEXT can
// EN | be pressed as many times as needed while still editing.
// FR | CHANGEMENT D ETAPE — les etapes 2 et 3 sont deux vues du meme etat de
// FR | lignes en memoire, jamais une navigation : rien ici ne recharge
// FR | DATA_URL ni ne touche le webhook, donc RETOUR depuis l etape 3 ne
// FR | perd rien, et SUIVANT peut etre presse autant de fois que necessaire
// FR | tant que l edition continue.
let currentStep = 2;
function goToStep(n) {
  currentStep = n;
  el('step2view').style.display = n === 2 ? 'block' : 'none';
  el('step3view').style.display = n === 3 ? 'block' : 'none';
  el('step2').classList.toggle('active', n === 2);
  el('step2').classList.toggle('done', n === 3);
  el('step3').classList.toggle('active', n === 3);
  if (n === 3) renderRecap();
}

// EN | Groups the live selection by room then slot, using the same _get()
// EN | each row already exposes for save — so the recap can never drift from
// EN | what Save would actually send.
// FR | Regroupe la selection en cours par piece puis par tableau, via le
// FR | meme _get() que chaque ligne expose deja pour l enregistrement — le
// FR | recapitulatif ne peut donc pas diverger de ce que Save enverrait.
function renderRecap() {
  if (!DATA) return;
  const byRoomSlot = {};
  [...el('rows').children].forEach(tr => {
    const a = tr._get();
    if (!a.room || !a.slot) return;
    const name = tr.querySelector('.name').textContent;
    byRoomSlot[a.room] = byRoomSlot[a.room] || {};
    (byRoomSlot[a.room][a.slot] = byRoomSlot[a.room][a.slot] || []).push(name);
  });

  const body = el('recapBody');
  body.innerHTML = '';
  DATA.rooms.forEach(r => {
    const card = document.createElement('div');
    card.className = 'recap-room';
    const h3 = document.createElement('h3');
    h3.textContent = r.label;
    card.appendChild(h3);
    r.slots.forEach(s => {
      const row = document.createElement('div');
      row.className = 'recap-slot';
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = DATA.slot_labels[s] || s;
      const val = document.createElement('span');
      const names = (byRoomSlot[r.id] && byRoomSlot[r.id][s]) || [];
      val.className = names.length ? 'val' : 'val empty';
      val.textContent = names.length ? names.join(', ') : '—';
      row.append(label, val);
      card.appendChild(row);
    });
    body.appendChild(card);
  });
}

function applyFilter() {
  const q = el('filter').value.trim().toLowerCase();
  [...el('rows').children].forEach(tr => {
    tr.style.display = !q || tr.dataset.search.includes(q) ? '' : 'none';
  });
}

function show(kind, text) {
  const m = el('msg');
  m.className = 'msg ' + kind;
  m.textContent = text;
}

async function load() {
  show('', '');
  goToStep(2);
  try {
    // EN | cache: no-store — the file is rewritten by every scan, and a
    // EN | cached copy would show the previous run as if nothing happened.
    // FR | cache: no-store — le fichier est reecrit a chaque scan, et une
    // FR | copie en cache montrerait le scan precedent comme si rien n avait
    // FR | change.
    const res = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
  } catch (e) {
    show('err', 'Cannot read ' + DATA_URL + ' (' + e.message + ').\n'
      + 'Run DISCOVERY SCAN first: it is what produces this file.');
    return;
  }
  if (!DATA.rooms.length) {
    show('err', 'The model declares no room. Declare rooms in house.yaml '
      + 'before assigning devices to them.');
    return;
  }
  el('subtitle').textContent =
    DATA.entities.length + ' discovered entities · ' + DATA.rooms.length
    + ' rooms · locale ' + DATA.locale;
  el('count').textContent = DATA.counts.assigned + ' already assigned';
  el('step1').classList.toggle('done', DATA.rooms.length > 0);

  const bulk = el('bulkRoom');
  bulk.innerHTML = '';
  bulk.appendChild(option('', '— bulk: room —', true));
  DATA.rooms.forEach(r => bulk.appendChild(option(r.id, r.label)));

  const body = el('rows');
  body.innerHTML = '';
  DATA.entities.forEach(e => body.appendChild(buildRow(e)));
  applyFilter();
  markPending();
}

el('filter').addEventListener('input', applyFilter);
el('reload').addEventListener('click', load);
el('next2to3').addEventListener('click', () => goToStep(3));
el('back3to2').addEventListener('click', () => goToStep(2));

// EN | Bulk assignment applies to the VISIBLE rows only. Filtering by
// EN | "living" then assigning is how eighty entities become manageable, and
// EN | restricting it to what is on screen is what keeps it from being
// EN | dangerous.
// FR | L assignation en masse s applique aux lignes VISIBLES uniquement.
// FR | Filtrer sur « salon » puis assigner est ce qui rend quatre-vingts
// FR | entites gerables, et la restreindre a ce qui est a l ecran est ce qui
// FR | l empeche d etre dangereuse.
el('applyBulk').addEventListener('click', () => {
  const room = el('bulkRoom').value;
  if (!room) { show('err', 'Pick a room for the bulk assignment first.'); return; }
  let n = 0;
  [...el('rows').children].forEach(tr => {
    if (tr.style.display === 'none') return;
    const sel = tr.querySelectorAll('select');
    sel[0].value = room;
    sel[0].dispatchEvent(new Event('change'));
    n++;
  });
  show('ok', n + ' visible row(s) set to that room. Slots were preselected '
    + 'from the domain — check them before saving.');
});

el('save').addEventListener('click', async () => {
  const assignments = [...el('rows').children].map(tr => tr._get());
  const payload = JSON.stringify({ assignments });
  // EN | base64 so the shell_command receives one inert argument: room names
  // EN | carry accents and apostrophes, and quoting them through a shell is
  // EN | exactly the kind of thing that breaks silently.
  // FR | base64 pour que le shell_command recoive un seul argument inerte :
  // FR | les noms de pieces portent des accents et des apostrophes, et les
  // FR | echapper a travers un shell est precisement le genre de chose qui
  // FR | casse en silence.
  const b64 = btoa(unescape(encodeURIComponent(payload)));
  el('save').disabled = true;
  show('ok', 'Sending…');
  try {
    const res = await fetch(WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content_b64: b64 }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    show('ok', 'Sent. The assignment is being written and the dashboards '
      + 'regenerated — watch the Home Assistant notifications.\n'
      + 'Reload this page in a few seconds to see the saved state.');
  } catch (e) {
    show('err', 'Send failed (' + e.message + ').\n'
      + 'Check that the webhook automation is loaded and that this browser '
      + 'is on the local network (local_only).');
  } finally {
    el('save').disabled = false;
  }
});

load();
</script>
</body>
</html>

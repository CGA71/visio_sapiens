<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Visio Sapiens — Pièces &amp; Étages</title>
<style>
  :root{
    --cy:#00E5FF; --cy-dim:rgba(0,229,255,.25); --gr:#00FFC3;
    --or:#FF9800; --rd:#FF3D71; --txt:#FFFFFF; --dim:#8FB6C9; --mut:#56707E;
    --bg:#050B12; --panel:rgba(8,18,28,.72);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;font-size:14px;
    background-image:radial-gradient(circle at 20% 0%,rgba(0,229,255,.07),transparent 55%)}
  .page{max-width:1100px;margin:0 auto;padding:24px 18px 80px}

  /* Header */
  .header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .logo{width:42px;height:42px;border-radius:12px;border:1px solid var(--cy-dim);
    display:grid;place-items:center;color:var(--cy);font-size:20px;
    box-shadow:0 0 18px rgba(0,229,255,.18)}
  .header h1{margin:0;font-family:'Orbitron','Courier New',monospace;font-size:17px;
    letter-spacing:3px;color:var(--cy)}
  .header p{margin:2px 0 0;font-size:11px;letter-spacing:2px;color:var(--mut)}
  .ha-url{margin-left:auto;font-size:11px;color:var(--mut)}

  /* Step bar */
  .steps{display:flex;gap:10px;margin-bottom:22px}
  .step{flex:1}
  .step-bar{height:3px;border-radius:2px;background:rgba(0,229,255,.12)}
  .step.active .step-bar{background:var(--cy);box-shadow:0 0 10px rgba(0,229,255,.5)}
  .step.done .step-bar{background:var(--gr)}
  .step-label{margin-top:6px;font-family:'Orbitron',monospace;font-size:9px;
    letter-spacing:1.5px;color:var(--mut)}
  .step.active .step-label{color:var(--cy)}
  .step.done .step-label{color:var(--gr)}

  /* Cards */
  .card{background:var(--panel);border:1px solid var(--cy-dim);border-radius:18px;
    padding:18px;margin-bottom:16px;backdrop-filter:blur(12px)}
  .card-title{font-family:'Orbitron',monospace;font-size:12px;letter-spacing:2px;color:var(--cy)}
  .card-sub{font-size:12px;color:var(--dim);margin-top:4px}

  /* Controls */
  input[type=text],select{background:rgba(0,0,0,.35);border:1px solid rgba(0,229,255,.22);
    border-radius:10px;color:var(--txt);padding:9px 12px;font-size:13px;font-family:inherit;outline:none}
  input[type=text]:focus,select:focus{border-color:var(--cy);box-shadow:0 0 0 2px rgba(0,229,255,.12)}
  input[type=color]{width:38px;height:36px;padding:2px;background:transparent;
    border:1px solid rgba(0,229,255,.22);border-radius:10px;cursor:pointer}
  .btn{background:rgba(0,229,255,.10);border:1px solid rgba(0,229,255,.45);color:var(--cy);
    border-radius:12px;padding:10px 18px;font-family:'Orbitron',monospace;font-size:11px;
    letter-spacing:1.5px;cursor:pointer;transition:.2s;text-decoration:none;display:inline-block}
  .btn:hover:not(:disabled){background:rgba(0,229,255,.2);box-shadow:0 0 16px rgba(0,229,255,.25)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
  .btn-sm{padding:6px 12px;font-size:10px}
  .btn-ghost{background:transparent;border-color:rgba(143,182,201,.3);color:var(--dim)}
  .btn-danger{background:rgba(255,61,113,.10);border-color:rgba(255,61,113,.5);color:var(--rd)}
  .btn-danger:hover:not(:disabled){background:rgba(255,61,113,.2);box-shadow:0 0 16px rgba(255,61,113,.25)}
  .btn-ok{background:rgba(0,255,195,.10);border-color:rgba(0,255,195,.5);color:var(--gr)}

  .row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .flex1{flex:1;min-width:0}
  .actions{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
  .actions-right{display:flex;gap:12px;margin-left:auto}

  /* Chips */
  .chip{display:inline-block;padding:5px 14px;border-radius:20px;font-size:12px;letter-spacing:1px;
    cursor:pointer;margin:0 6px 6px 0;border:1px solid rgba(0,229,255,.3);color:var(--dim);transition:.2s}
  .chip.on{background:rgba(0,229,255,.15);border-color:var(--cy);color:var(--cy)}

  /* Badges */
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;margin-left:6px;white-space:nowrap}
  .badge-cyan{background:rgba(0,229,255,.15);border:1px solid rgba(0,229,255,.4);color:var(--cy)}
  .badge-green{background:rgba(0,255,195,.15);border:1px solid rgba(0,255,195,.4);color:var(--gr)}
  .badge-orange{background:rgba(255,152,0,.15);border:1px solid rgba(255,152,0,.4);color:var(--or)}
  .badge-red{background:rgba(255,61,113,.15);border:1px solid rgba(255,61,113,.4);color:var(--rd)}
  .badge-mut{background:rgba(86,112,126,.15);border:1px solid rgba(86,112,126,.4);color:var(--mut)}

  /* Status */
  .status{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:14px}
  .status-info{background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.3);color:var(--cy)}
  .status-ok{background:rgba(0,255,195,.08);border:1px solid rgba(0,255,195,.3);color:var(--gr)}
  .status-warn{background:rgba(255,152,0,.08);border:1px solid rgba(255,152,0,.3);color:var(--or)}
  .status-error{background:rgba(255,61,113,.08);border:1px solid rgba(255,61,113,.3);color:var(--rd)}

  /* Inventory table */
  .inv-row{display:grid;grid-template-columns:26px 1fr auto auto;gap:10px;align-items:center;
    padding:8px 4px;border-bottom:1px solid rgba(0,229,255,.08)}
  .inv-name{font-size:13px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .inv-meta{font-size:11px;color:var(--mut)}
  .inv-floor{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:1.5px;color:var(--cy);
    padding:10px 4px 4px;border-top:1px solid rgba(0,229,255,.1)}
  input[type=checkbox]{accent-color:#00E5FF;width:16px;height:16px;cursor:pointer}

  /* Editor */
  .floor-block{border:1px solid rgba(0,229,255,.15);border-radius:14px;padding:14px;margin-bottom:12px;
    background:rgba(0,0,0,.2)}
  .room-row{margin-left:18px}
  .ghost{color:var(--mut);font-size:12px;font-style:italic;margin:6px 0 6px 18px}

  /* Diff preview */
  .diff{font-family:'Courier New',monospace;font-size:12px;line-height:1.7}
  .diff .add{color:var(--gr)}
  .diff .upd{color:var(--or)}
  .diff .del{color:var(--rd)}

  /* Spinner */
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,229,255,.2);
    border-top-color:var(--cy);border-radius:50%;animation:spin .8s linear infinite;
    vertical-align:middle;margin-right:8px}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none}}
  @media (max-width:640px){.inv-row{grid-template-columns:26px 1fr auto}.inv-meta{display:none}}
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="logo">⬡</div>
    <div>
      <h1>VISIO SAPIENS</h1>
      <p id="page-subtitle">PIÈCES &amp; ÉTAGES</p>
    </div>
    <div class="ha-url" id="ha-url"></div>
  </div>

  <!--
    EN | Three steps, matching the three real phases of the ADMIN console:
    EN | this screen (structure), the ASSIGN screen (room + slot), and
    EN | dashboard regeneration, which ASSIGN triggers on save. Only step 1
    EN | is ever "active" here — steps 2 and 3 happen on other screens, so
    EN | this page has no way to know if they are "done"; showing them as
    EN | plain upcoming steps is honest, marking them done would not be.
    FR | Trois etapes, qui correspondent aux trois phases reelles de la
    FR | console ADMIN : cet ecran (structure), l'ecran ASSIGN (piece +
    FR | tableau), et la regeneration des dashboards, declenchee par ASSIGN
    FR | a l'enregistrement. Seule l'etape 1 est jamais « active » ici — les
    FR | etapes 2 et 3 se passent sur d'autres ecrans, donc cette page n'a
    FR | aucun moyen de savoir si elles sont « faites » ; les montrer comme
    FR | de simples etapes a venir est honnete, les marquer faites ne le
    FR | serait pas.
  -->
  <div class="steps">
    <div class="step active" id="s1"><div class="step-bar"></div><div class="step-label" id="s1-label">1. STRUCTURE</div></div>
    <div class="step" id="s2"><div class="step-bar"></div><div class="step-label" id="s2-label">2. APPAREILS</div></div>
    <div class="step" id="s3"><div class="step-bar"></div><div class="step-label" id="s3-label">3. DASHBOARDS</div></div>
  </div>

  <div id="content"></div>
</div>

<script>
"use strict";

// ═══════════════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════════════
const HA_URL   = window.location.origin;
// EN | The real ASSIGN screen's own FILE, not the Lovelace view path.
// EN | This page runs inside a sandboxed iframe on the ADMIN dashboard —
// EN | HA's built-in iframe card sets a sandbox with neither
// EN | allow-top-navigation nor allow-top-navigation-by-user-activation,
// EN | so navigating window.top (or an <a target="_top">, which is bound
// EN | by the exact same sandbox flags) throws a SecurityError and does
// EN | nothing. Navigating the iframe's OWN window.location is always
// EN | allowed regardless of sandboxing — a sandboxed frame can only be
// EN | stopped from navigating its ANCESTORS, never itself — so the fix is
// EN | to load assign.html inside this same iframe instead of trying to
// EN | escape it. The outer ADMIN chrome (sidebar, "ROOMS & FLOORS" title)
// EN | stays put; only the iframe content changes, same as every other
// EN | screen swap already works.
// EN | No static ?v= here: the build's cache-busting sed step only
// EN | rewrites *.yaml files (see .gitlab-ci.yml), so a token hardcoded in
// EN | this .html file would never actually change between deploys — that
// EN | would just be a permanently-stale cache key, not a fix. A
// EN | timestamp appended at render time (see the "Next" button below)
// EN | forces a fresh fetch on every page load instead.
// FR | Pas de ?v= statique ici : l'etape sed de cache-busting du build ne
// FR | reecrit que les fichiers *.yaml (voir .gitlab-ci.yml), donc un
// FR | jeton fige dans ce fichier .html ne changerait jamais entre deux
// FR | deploiements — ce serait juste une cle de cache perpetuellement
// FR | perimee, pas un correctif. Un horodatage ajoute au moment du rendu
// FR | (voir le bouton « Suivant » plus bas) force au contraire une
// FR | lecture fraiche a chaque chargement de page.
const NEXT_URL = "/local/vssp/wizard/assign.html";
const LS_TOKEN = "osv_ha_token";
const LS_HOUSE = "vssp_house";
const LS_COLORS= "vssp_room_colors";
// EN | saveHouse() below only ever wrote to the BROWSER's localStorage —
// EN | never to house.yaml on the server. house.yaml is what
// EN | vssp_assign_prepare.py and the generator actually read, so the room
// EN | list on the ASSIGN screen (and the room dropdown in it) kept
// EN | showing house.yaml's old, hand-written room list, never what
// EN | "Appliquer" had just written to the HA Area registry — same
// EN | webhook pattern as assign.html's save, because this page is an
// EN | iframe and cannot reach the `hass` object or a Bearer token any
// EN | more than that one can.
// FR | saveHouse() plus bas n a toujours ecrit que dans le localStorage du
// FR | NAVIGATEUR — jamais dans house.yaml sur le serveur. Or house.yaml
// FR | est ce que vssp_assign_prepare.py et le generateur lisent
// FR | reellement, donc la liste de pieces sur l ecran ASSIGN (et son menu
// FR | deroulant) continuait d afficher l ancienne liste ecrite a la main
// FR | dans house.yaml, jamais ce que « Appliquer » venait d ecrire dans
// FR | le registre Zones de HA — meme schema de webhook que
// FR | l enregistrement d assign.html, car cette page est une iframe et ne
// FR | peut pas plus atteindre l objet `hass` ou un jeton Bearer que
// FR | celle-la.
const WEBHOOK_ROOMS = "/api/webhook/vssp_rooms_sync";
// EN | Written by vssp_rooms_apply.py after every sync — a full snapshot of
// EN | every room's current slot_set (not just what changed this pass), so
// EN | the slot_set <select> below can be pre-filled with the real value
// EN | instead of always defaulting to "default" and silently overwriting
// EN | an existing choice on the next Apply.
// FR | Ecrit par vssp_rooms_apply.py apres chaque synchronisation — un
// FR | instantane complet du slot_set actuel de chaque piece (pas
// FR | seulement ce qui a change cette passe), pour que le <select>
// FR | slot_set plus bas puisse etre pre-rempli avec la vraie valeur au
// FR | lieu de toujours retomber sur "default" et ecraser en silence un
// FR | choix existant au prochain Appliquer.
const ROOMS_STATUS_URL = "/local/vssp/rooms_sync_status.json";
// EN | Same identifiers as DEFAULT_SLOT_SETS in generate_dashboards.py /
// EN | vssp_assign_prepare.py — kept in sync by hand, same as those two
// EN | already are with each other.
// FR | Memes identifiants que DEFAULT_SLOT_SETS dans
// FR | generate_dashboards.py / vssp_assign_prepare.py — tenus a jour a la
// FR | main, comme ces deux-la le sont deja l un avec l autre.
const SLOT_SETS = ["default", "toilet", "garden", "utility", "entrance", "minimal", "computer"];

// Domaines considérés comme « appareils assignables » en phase 2.
// Le même filtre est appliqué ici pour compter ce que contient chaque pièce.
const DEVICE_DOMAINS = ["light","switch","climate","media_player","cover","camera",
                        "alarm_control_panel","vacuum","fan","lock","input_boolean",
                        "button","remote"];

// EN | Chip DISPLAY label only, keyed by the canonical value above. The

// EN | it is what gets created/matched against the HA Area registry);
// EN | only what the admin reads on the chip follows the interface
// EN | language. Without this map every language showed the same French
// EN | text regardless of the selector.
// FR | Libelle AFFICHE seulement du chip, indexe par la valeur canonique
// FR | ci-dessus. La valeur elle-meme n'est jamais traduite (voir le grand
// FR | commentaire i18n plus bas — c'est elle qui est creee/comparee au

// FR | suit la langue d interface. Sans cette table, chaque langue

  "Terrasse": {fr:"Terrasse", en:"Terrace"},
  "Véranda":  {fr:"Véranda",  en:"Veranda"},
};
const EXTERIOR_FLOOR_NAMES = ["extérieur","exterieur","outdoor","extérieurs","exterieurs"];
const DEFAULT_COLOR = "#0A2030";

document.getElementById("ha-url").textContent = HA_URL;

// WEBSOCKET HA
// ═══════════════════════════════════════════════════════════════════════════
let ws = null, msgId = 1;
const pending = {};
const subscriptions = {};   // id -> callback(event), for subscribe_events messages

function wsConnect(token){
  return new Promise((resolve,reject)=>{
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    let settled = false;
    const sock = new WebSocket(`${proto}//${location.host}/api/websocket`);
    sock.onmessage = ev => {
      const m = JSON.parse(ev.data);
      if (m.type === "auth_required"){
        sock.send(JSON.stringify({type:"auth", access_token:token}));
      } else if (m.type === "auth_ok"){
        ws = sock; settled = true; resolve(sock);
      } else if (m.type === "auth_invalid"){
        settled = true; sock.close();
        reject(new Error("Token refusé par Home Assistant."));
      } else if (m.type === "result"){
        const p = pending[m.id];
        if (!p) return;
        delete pending[m.id];
        m.success ? p.resolve(m.result) : p.reject(new Error(m.error && m.error.message || "Erreur HA"));
      } else if (m.type === "event"){
        const cb = subscriptions[m.id];
        if (cb) cb(m.event);
      }
    };
    sock.onerror = () => { if(!settled){ settled = true; reject(new Error("WebSocket injoignable.")); } };
    sock.onclose = () => {
      ws = null; state.connected = false;
      Object.keys(pending).forEach(k => { pending[k].reject(new Error("Connexion fermée")); delete pending[k]; });
      if (!settled){ settled = true; reject(new Error("Connexion fermée avant authentification.")); }
    };
  });
}

function wsCall(type, payload){
  return new Promise((resolve,reject)=>{
    if (!ws) return reject(new Error("Non connecté à Home Assistant."));
    const id = msgId++;
    pending[id] = {resolve,reject};
    ws.send(JSON.stringify(Object.assign({id, type}, payload || {})));
  });
}

// Long-lived subscription (e.g. subscribe_events): resolves once HA acks the
// subscription, then invokes `callback` for every matching event afterwards.
function wsSubscribe(type, payload, callback){
  return new Promise((resolve,reject)=>{
    if (!ws) return reject(new Error("Non connecté à Home Assistant."));
    const id = msgId++;
    subscriptions[id] = callback;
    pending[id] = {resolve,reject};
    ws.send(JSON.stringify(Object.assign({id, type}, payload || {})));
  });
}

// EN | Mirrors the interface language selected on the admin ROOMS & FLOORS
// EN | row (input_select.vssp_language) so this page updates live instead of
// EN | needing a reload — subscribe once, react to every state_changed.
// FR | Reflete la langue d'interface choisie sur la ligne ROOMS & FLOORS de
// FR | l'admin (input_select.vssp_language) pour que cette page se mette a
// FR | jour en direct au lieu de necessiter un rechargement — on s'abonne
// FR | une fois, on reagit a chaque state_changed.
async function loadLanguage(){
  try{
    const states = await wsCall("get_states");
    const ent = states.find(s => s.entity_id === "input_select.vssp_language");
    if (ent) applyLang(ent.state);
  }catch(_){ /* garde le fr par defaut si la lecture echoue */ }
}
function subscribeLanguage(){
  wsSubscribe("subscribe_events", {event_type:"state_changed"}, ev => {
    const d = ev && ev.data;
    if (d && d.entity_id === "input_select.vssp_language" && d.new_state){
      applyLang(d.new_state.state);
      render();
    }
  }).catch(()=>{});
}

// LECTURE DU REGISTRE — « ce qui existe déjà »
// ═══════════════════════════════════════════════════════════════════════════
async function loadRegistry(){
  const [floors, areas, entities, devices] = await Promise.all([
    wsCall("config/floor_registry/list").catch(()=>[]),   // HA < 2024.4 : pas d'étages
    wsCall("config/area_registry/list"),
    wsCall("config/entity_registry/list"),
    wsCall("config/device_registry/list")
  ]);

  // area_id effectif d'une entité : le sien, sinon celui de son appareil
  const devArea = {};
  devices.forEach(d => { devArea[d.id] = d.area_id || null; });

  const counts = {};   // area_id -> {total, byDomain:{}}
  entities.forEach(e => {
    const aid = e.area_id || (e.device_id ? devArea[e.device_id] : null);
    if (!aid) return;
    const dom = String(e.entity_id).split(".")[0];
    if (!counts[aid]) counts[aid] = {total:0, byDomain:{}};
    counts[aid].total++;
    if (DEVICE_DOMAINS.includes(dom)){
      counts[aid].byDomain[dom] = (counts[aid].byDomain[dom] || 0) + 1;
    }
  });

  state.ha = {
    floors: floors.map(f => ({floor_id:f.floor_id, name:f.name, level:f.level, icon:f.icon})),
    areas:  areas.map(a  => ({area_id:a.area_id, name:a.name, floor_id:a.floor_id || null, icon:a.icon})),
    counts
  };
  state.selection = new Set();
  buildDraftFromRegistry();
}

// Le brouillon reflète le registre : l'admin voit l'existant et l'édite.
function buildDraftFromRegistry(){
  const isExtFloor = f => EXTERIOR_FLOOR_NAMES.includes(String(f.name||"").toLowerCase());
  const extFloorIds = new Set(state.ha.floors.filter(isExtFloor).map(f => f.floor_id));

  const floors = state.ha.floors
    .filter(f => !extFloorIds.has(f.floor_id))
    .sort((a,b)=> (a.level ?? 0) - (b.level ?? 0))
    .map(f => ({
      floor_id: f.floor_id, name: f.name, level: f.level ?? 0,
      rooms: state.ha.areas.filter(a => a.floor_id === f.floor_id)
        .map(a => ({area_id:a.area_id, name:a.name, slot_set: "default",
          color: state.colors[a.area_id] || DEFAULT_COLOR}))
    }));

  // Pièces sans étage → regroupées dans « Non classé » pour ne rien perdre
  const orphans = state.ha.areas.filter(a =>
    !a.floor_id && !extFloorIds.has(a.floor_id));
  if (orphans.length){
    floors.push({
      floor_id: null, name: "Non classé", level: floors.length,
      rooms: orphans.map(a => ({area_id:a.area_id, name:a.name, slot_set: "default",
        color: state.colors[a.area_id] || DEFAULT_COLOR}))
    });
  }

  const exteriors = state.ha.areas
    .filter(a => extFloorIds.has(a.floor_id))
    .map(a => a.name);

  state.draft = { floors, exteriors };
}

// ═══════════════════════════════════════════════════════════════════════════
// DIFF — ce qui sera créé / renommé / supprimé
// ═══════════════════════════════════════════════════════════════════════════
function computeDiff(){
  const d = {floorsCreate:[], floorsUpdate:[], floorsDelete:[],
             areasCreate:[], areasUpdate:[], areasDelete:[]};

  const draftFloorIds = new Set(state.draft.floors.map(f => f.floor_id).filter(Boolean));
  const draftAreaIds  = new Set();
  state.draft.floors.forEach(f => f.rooms.forEach(r => r.area_id && draftAreaIds.add(r.area_id)));

  const isExtFloor = f => EXTERIOR_FLOOR_NAMES.includes(String(f.name||"").toLowerCase());
  const extFloor   = state.ha.floors.find(isExtFloor) || null;
  const extAreas   = extFloor ? state.ha.areas.filter(a => a.floor_id === extFloor.floor_id) : [];
  const extNames   = state.draft.exteriors.map(e => e.trim()).filter(Boolean);
  extAreas.forEach(a => { if (extNames.includes(a.name)) draftAreaIds.add(a.area_id); });

  // Étages
  state.draft.floors.forEach((f, i) => {
    const name = f.name.trim();
    if (!name || f.name === "Non classé") return;
    if (!f.floor_id){ d.floorsCreate.push({name, level:i}); return; }
    const ref = state.ha.floors.find(x => x.floor_id === f.floor_id);
    if (ref && (ref.name !== name || (ref.level ?? 0) !== i)){
      d.floorsUpdate.push({floor_id:f.floor_id, name, level:i});
    }
  });
  state.ha.floors.forEach(f => {
    if (isExtFloor(f)) return;
    if (!draftFloorIds.has(f.floor_id)) d.floorsDelete.push(f);
  });
  // L'étage Extérieur est explicitement écarté de la boucle ci-dessus
  // (isExtFloor(f)) car il n'apparaît jamais dans state.draft.floors —
  // buildDraftFromRegistry() le traite à part, comme les chips
  // "exteriors". Traité ici séparément : supprimé seulement quand il ne
  // lui reste plus aucune pièce extérieure après ce passage — sinon il
  // restait indéfiniment dans le registre HA, vide, une fois le dernier
  // chip retiré (aucun chemin ne le supprimait jamais auparavant).
  if (extFloor && !extNames.length){
    d.floorsDelete.push(extFloor);
  }

  // Pièces
  state.draft.floors.forEach(f => {
    f.rooms.forEach(r => {
      const name = r.name.trim();
      if (!name) return;
      if (!r.area_id){ d.areasCreate.push({name, floorName:f.name.trim(), floor_id:f.floor_id||null, color:r.color}); return; }
      const ref = state.ha.areas.find(a => a.area_id === r.area_id);
      if (!ref) return;
      const targetFloor = (f.name === "Non classé") ? null : (f.floor_id || null);
      if (ref.name !== name || (ref.floor_id||null) !== targetFloor){
        d.areasUpdate.push({area_id:r.area_id, name, floorName:f.name.trim(),
                            floor_id:targetFloor, pendingFloorName:(!f.floor_id && f.name!=="Non classé") ? f.name.trim() : null});
      }
    });
  });
  extNames.forEach(n => {
    if (!extAreas.some(a => a.name === n)) d.areasCreate.push({name:n, floorName:"Extérieur", exterior:true});
  });
  state.ha.areas.forEach(a => {
    if (!draftAreaIds.has(a.area_id)) d.areasDelete.push(a);
  });

  d.total = d.floorsCreate.length + d.floorsUpdate.length + d.floorsDelete.length
          + d.areasCreate.length + d.areasUpdate.length + d.areasDelete.length;
  return d;
}

function entitiesAtRisk(diff){
  let n = 0;
  diff.areasDelete.forEach(a => { n += (state.ha.counts[a.area_id] || {total:0}).total; });
  return n;
}

// ═══════════════════════════════════════════════════════════════════════════
// APPLICATION DANS HOME ASSISTANT
// ═══════════════════════════════════════════════════════════════════════════
async function applyDiff(){
  // EN | Captured up front, before anything below can rebuild state.draft
  // EN | out from under it — see currentSlotSetByName()'s comment.
  // FR | Capture en amont, avant que quoi que ce soit plus bas ne
  // FR | reconstruise state.draft sous ses pieds — voir le commentaire de
  // FR | currentSlotSetByName().
  const pendingSlotSets = currentSlotSetByName();
  const diff = computeDiff();
  if (!diff.total){
    // EN | Nothing pending for the HA registry, but house.yaml can still
    // EN | be behind it (rooms created in an earlier session, before
    // EN | syncRoomsToModel() existed) — sync regardless of returning
    // EN | early here.
    // FR | Rien en attente pour le registre HA, mais house.yaml peut
    // FR | quand meme etre en retard sur lui (pieces creees lors d une
    // FR | session anterieure, avant que syncRoomsToModel() existe) —
    // FR | synchroniser malgre le retour anticipe ici.
    setBusy(true, t("busy_applying"));
    state.notice = await syncRoomsBestEffort(t("diff_nothing_to_apply"), pendingSlotSets);
    setBusy(false);
    return;
  }

  const risk = entitiesAtRisk(diff);
  let msg = t("confirm_apply_header", {total: diff.total});
  if (diff.areasDelete.length){
    msg += t("confirm_apply_rooms_deleted", {n: diff.areasDelete.length});
    if (risk) msg += t("confirm_apply_entities_unassigned", {risk});
  }
  if (!confirm(msg)) return;

  setBusy(true, t("busy_applying"));
  try{
    // 1. Étages à créer → on récupère leurs ids pour les pièces qui les visent
    const newFloorId = {};
    for (const f of diff.floorsCreate){
      const res = await wsCall("config/floor_registry/create", {name:f.name, level:f.level});
      newFloorId[f.name] = res.floor_id;
    }
    for (const f of diff.floorsUpdate){
      await wsCall("config/floor_registry/update", {floor_id:f.floor_id, name:f.name, level:f.level});
    }

    // Étage « Extérieur » créé à la demande
    let extFloorId = (state.ha.floors.find(f =>
      EXTERIOR_FLOOR_NAMES.includes(String(f.name||"").toLowerCase())) || {}).floor_id || null;
    if (!extFloorId && diff.areasCreate.some(a => a.exterior)){
      const res = await wsCall("config/floor_registry/create", {name:"Extérieur", level:99, icon:"mdi:tree"});
      extFloorId = res.floor_id;
    }

    // 2. Pièces
    for (const a of diff.areasCreate){
      const fid = a.exterior ? extFloorId : (a.floor_id || newFloorId[a.floorName] || null);
      const res = await wsCall("config/area_registry/create", {name:a.name, floor_id:fid});
      if (a.color && res && res.area_id){ state.colors[res.area_id] = a.color; }
    }
    for (const a of diff.areasUpdate){
      const fid = a.floor_id || (a.pendingFloorName ? newFloorId[a.pendingFloorName] : null);
      await wsCall("config/area_registry/update", {area_id:a.area_id, name:a.name, floor_id:fid});
    }
    for (const a of diff.areasDelete){
      await wsCall("config/area_registry/delete", {area_id:a.area_id});
      delete state.colors[a.area_id];
    }

    // 3. Étages supprimés en dernier (les pièces ont déjà été déplacées/supprimées)
    for (const f of diff.floorsDelete){
      await wsCall("config/floor_registry/delete", {floor_id:f.floor_id});
    }

    localStorage.setItem(LS_COLORS, JSON.stringify(state.colors));
    await loadRegistry();
    saveHouse();
    // EN | Best-effort: the HA registry write above already succeeded and
    // EN | is the part that must not be reported as failed — see
    // EN | syncRoomsBestEffort()'s comment.
    // FR | Best-effort : l ecriture dans le registre HA ci-dessus a deja
    // FR | reussi, et c est elle qui ne doit pas etre rapportee comme
    // FR | ratee — voir le commentaire de syncRoomsBestEffort().
    state.notice = await syncRoomsBestEffort(t("notice_applied", {total: diff.total}), pendingSlotSets);
  }catch(e){
    state.error = t("err_apply_failed", {msg: e.message});
  }finally{
    setBusy(false);
  }
}

// EN | Sends the CURRENT HA registry state (just refreshed by
// EN | loadRegistry() above) to the webhook that writes house.yaml's
// EN | `rooms:` list. Base64, same reason as assign.html's save: room
// EN | names carry accents, and passing them through a shell raw is
// EN | exactly what breaks silently.
// FR | Envoie l etat ACTUEL du registre HA (rafraichi par loadRegistry()
// FR | juste au-dessus) au webhook qui ecrit la liste `rooms:` de
// FR | house.yaml. Base64, meme raison que l enregistrement d
// FR | assign.html : les noms de pieces portent des accents, et les
// FR | passer bruts a travers un shell est precisement ce qui casse en
// FR | silence.
// EN | slot_set per area_id, read from the CURRENT draft — used when
// EN | nothing has just rebuilt state.draft out from under an in-flight
// EN | edit (connect/reload, and applyDiff's early "nothing to apply"
// EN | return).
// FR | slot_set par area_id, lu depuis le brouillon ACTUEL — utilise quand
// FR | rien ne vient de reconstruire state.draft sous un edit en cours
// FR | (connect/reload, et le retour anticipe « rien a appliquer » de
// FR | applyDiff).
function currentSlotSetMap(){
  const m = {};
  state.draft.floors.forEach(f => f.rooms.forEach(r => {
    if (r.area_id) m[r.area_id] = r.slot_set || "default";
  }));
  return m;
}
// EN | Same, keyed by (trimmed) room NAME instead of area_id — used by
// EN | applyDiff() for its main path, captured BEFORE loadRegistry()
// EN | rebuilds state.draft from the just-updated HA registry (which wipes
// EN | every slot_set back to the "default" placeholder, since HA's Area
// EN | registry has no such concept). A brand-new room has no area_id yet
// EN | at capture time — name is the only stable key connecting "what the
// EN | admin just picked in the dropdown" to "the area HA is about to hand
// EN | back with a freshly-minted area_id".
// FR | Meme chose, indexe par nom de piece (nettoye) plutot que par
// FR | area_id — utilise par applyDiff() dans son chemin principal, capture
// FR | AVANT que loadRegistry() ne reconstruise state.draft depuis le
// FR | registre HA tout juste mis a jour (ce qui remet chaque slot_set au
// FR | placeholder "default", le registre Zones HA n'ayant pas cette
// FR | notion). Une piece toute neuve n'a pas encore d'area_id au moment de
// FR | la capture — le nom est la seule cle stable reliant « ce que
// FR | l administrateur vient de choisir dans le menu deroulant » a « la
// FR | zone que HA va rendre avec un area_id fraichement cree ».
function currentSlotSetByName(){
  const m = {};
  state.draft.floors.forEach(f => f.rooms.forEach(r => {
    const name = r.name.trim();
    if (name) m[name] = r.slot_set || "default";
  }));
  return m;
}
async function syncRoomsToModel(pendingSlotSetByName){
  const byName = pendingSlotSetByName || {};
  const byAreaId = currentSlotSetMap();
  const payload = JSON.stringify({
    rooms: state.ha.areas.map(a => ({
      area_id: a.area_id, name: a.name,
      slot_set: byName[a.name] || byAreaId[a.area_id] || "default",
    })),
  });
  const b64 = btoa(unescape(encodeURIComponent(payload)));
  const res = await fetch(WEBHOOK_ROOMS, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({content_b64: b64}),
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
}

// EN | Pulls the real current slot_set per room from the status file
// EN | vssp_rooms_apply.py writes after every sync, overwriting the
// EN | "default" placeholder buildDraftFromRegistry() just gave every room
// EN | (the HA Area registry has no concept of slot_set at all). Call this
// EN | BEFORE sending anything back with syncRoomsToModel(), never after —
// EN | otherwise every room would round-trip through "default" first.
// EN | Best-effort: on any failure the draft simply keeps its "default"
// EN | placeholders, same as before this existed.
// FR | Recupere le vrai slot_set actuel de chaque piece depuis le fichier
// FR | de statut qu'ecrit vssp_rooms_apply.py apres chaque synchronisation,
// FR | par-dessus le placeholder "default" que buildDraftFromRegistry()
// FR | vient de donner a chaque piece (le registre Zones HA n'a aucune
// FR | notion de slot_set). A appeler AVANT de renvoyer quoi que ce soit
// FR | avec syncRoomsToModel(), jamais apres — sinon chaque piece
// FR | repasserait d'abord par "default". Best-effort : en cas d'echec, le
// FR | brouillon garde simplement ses placeholders "default", comme avant
// FR | que ceci existe.
async function applyDraftSlotSets(){
  try {
    const res = await fetch(ROOMS_STATUS_URL + "?t=" + Date.now(), {cache:"no-store"});
    if (!res.ok) return;
    const status = await res.json();
    const byAreaId = {};
    (status.rooms || []).forEach(r => { if (r.area_id && r.slot_set) byAreaId[r.area_id] = r.slot_set; });
    state.draft.floors.forEach(f => f.rooms.forEach(r => {
      if (r.area_id && byAreaId[r.area_id]) r.slot_set = byAreaId[r.area_id];
    }));
  } catch (e) { /* best-effort — see comment above */ }
}

// EN | Wraps syncRoomsToModel() for the three callers that read the
// EN | registry (connect, reload, applyDiff): appends a warning to
// EN | `baseNotice` on failure instead of throwing, since by the time this
// EN | runs the registry read/write it followed has already succeeded and
// EN | must not be reported as failed over a sync hiccup.
// EN | Called after EVERY registry read, not only inside applyDiff() when
// EN | there is a pending diff to push to HA: a room created in an
// EN | earlier session, before this sync existed, has nothing left to
// EN | "Apply" (computeDiff() returns 0), so gating the sync on diff.total
// EN | would mean it never runs for exactly the rooms that need it most.
// FR | Enveloppe syncRoomsToModel() pour les trois appelants qui lisent le
// FR | registre (connect, reload, applyDiff) : ajoute un avertissement a
// FR | `baseNotice` en cas d echec plutot que de lever, puisqu a ce stade
// FR | la lecture/ecriture registre qu il suit a deja reussi et ne doit
// FR | pas etre rapportee comme ratee pour un accroc de synchronisation.
// FR | Appele apres CHAQUE lecture du registre, pas seulement dans
// FR | applyDiff() quand il y a un diff en attente a pousser vers HA : une
// FR | piece creee lors d une session anterieure, avant que cette
// FR | synchronisation existe, n a plus rien a « Appliquer »
// FR | (computeDiff() renvoie 0), donc conditionner la synchronisation a
// FR | diff.total ferait qu elle ne tourne jamais pour precisement les
// FR | pieces qui en ont le plus besoin.
async function syncRoomsBestEffort(baseNotice, pendingSlotSetByName){
  try {
    await syncRoomsToModel(pendingSlotSetByName);
    return baseNotice;
  } catch (syncErr) {
    return baseNotice + "\n" + t("notice_sync_failed", {msg: syncErr.message});
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// ACTIONS DESTRUCTIVES
// ═══════════════════════════════════════════════════════════════════════════
function deleteSelected(){
  if (!state.selection.size) return;
  const names = [];
  state.selection.forEach(id => {
    const a = state.ha.areas.find(x => x.area_id === id);
    if (a) names.push(a.name);
  });
  let n = 0;
  state.selection.forEach(id => { n += (state.ha.counts[id] || {total:0}).total; });
  const txt = t("confirm_delete_selected_header", {n: names.length, names: names.join(", ")}) +
              (n ? t("confirm_delete_selected_entities", {n}) : "") +
              t("confirm_delete_selected_footer");
  if (!confirm(txt)) return;
  state.draft.floors.forEach(f => { f.rooms = f.rooms.filter(r => !state.selection.has(r.area_id)); });
  const extNames = new Set();
  state.selection.forEach(id => {
    const a = state.ha.areas.find(x => x.area_id === id);
    if (a) extNames.add(a.name);
  });
  state.draft.exteriors = state.draft.exteriors.filter(e => !extNames.has(e));
  state.selection = new Set();
  state.notice = t("notice_rooms_removed_draft");
  render();
}

function resetAll(){
  const nAreas = state.ha.areas.length, nFloors = state.ha.floors.length;
  let ent = 0; Object.values(state.ha.counts).forEach(c => ent += c.total);
  const word = t("reset_confirm_word");
  const answer = prompt(t("prompt_reset_header", {floors: nFloors, areas: nAreas, ent, word}));
  if (answer !== word) { state.notice = t("notice_reset_cancelled"); return render(); }
  state.draft = { floors: [], exteriors: [] };
  state.selection = new Set();
  state.notice = t("notice_draft_cleared");
  render();
}

// ═══════════════════════════════════════════════════════════════════════════
// ÉDITION DU BROUILLON
// ═══════════════════════════════════════════════════════════════════════════
function addFloor(){
  const n = state.draft.floors.length;
  state.draft.floors.push({floor_id:null, name: n===0 ? "Rez-de-chaussée" : `Étage ${n}`, level:n, rooms:[]});
  render();
}
function delFloor(fi){
  const f = state.draft.floors[fi];
  if (f.rooms.length && !confirm(t("confirm_del_floor", {name: f.name, n: f.rooms.length}))) return;
  state.draft.floors.splice(fi,1); render();
}
// EN | updFloorName/updRoom deliberately do NOT call the full render(): that
// EN | replaces #content's entire innerHTML, which would drop focus and the
// EN | cursor position out of the very <input> the user is typing into.
// EN | But the PENDING CHANGES card (and its Apply button) is built from the
// EN | same state by renderDiff(), so without some refresh it goes stale the
// EN | moment a name is typed — the row's own "new" badge already showed
// EN | on creation (addRoom() does render() once, before any text exists),
// EN | so nothing else prompts a re-render, and diff_total stays frozen at
// EN | whatever it was then (usually 0, since computeDiff() skips blank
// EN | names). That left the Apply button never appearing at all: a room
// EN | typed in and never applied, silently lost the moment NEXT (which only
// EN | writes the draft to localStorage, never to Home Assistant) navigates
// EN | away. refreshDiff() replaces just that one card, leaving the editor's
// EN | text inputs — and their focus — untouched.
// FR | updFloorName/updRoom n appellent volontairement PAS le render()
// FR | complet : cela remplace tout le innerHTML de #content, ce qui ferait
// FR | perdre le focus et la position du curseur dans l <input> meme ou
// FR | l utilisateur est en train de taper. Mais la carte MODIFICATIONS EN
// FR | ATTENTE (et son bouton Appliquer) est construite depuis le meme state
// FR | par renderDiff(), donc sans un rafraichissement elle devient perimee
// FR | des qu un nom est tape — le badge « new » de la ligne s affiche deja
// FR | a la creation (addRoom() fait un render() une fois, avant qu aucun
// FR | texte n existe), donc rien d autre ne provoque un nouveau rendu, et
// FR | diff_total reste fige a ce qu il etait alors (generalement 0, car
// FR | computeDiff() ignore les noms vides). Consequence : le bouton
// FR | Appliquer n apparaissait jamais : une piece tapee puis jamais
// FR | appliquee, perdue en silence des que SUIVANT (qui n ecrit le brouillon
// FR | que dans localStorage, jamais vers Home Assistant) navigue ailleurs.
// FR | refreshDiff() ne remplace que cette carte, laissant intacts les
// FR | champs texte de l editeur — et leur focus.
function refreshDiff(){
  const el = document.getElementById("diffCard");
  if (el) el.outerHTML = renderDiff();
}
function updFloorName(fi,v){ state.draft.floors[fi].name = v; refreshDiff(); }
function addRoom(fi){ state.draft.floors[fi].rooms.push({area_id:null, name:"", slot_set:"default", color:DEFAULT_COLOR}); render(); }
function delRoom(fi,ri){ state.draft.floors[fi].rooms.splice(ri,1); render(); }
function updRoom(fi,ri,k,v){
  const r = state.draft.floors[fi].rooms[ri];
  r[k] = v;
  if (k === "color" && r.area_id){
    state.colors[r.area_id] = v;
    localStorage.setItem(LS_COLORS, JSON.stringify(state.colors));
  }
  refreshDiff();
}
function toggleExt(name){
  const ex = state.draft.exteriors, i = ex.indexOf(name);
  if (i >= 0) ex.splice(i,1); else ex.push(name);
  render();
}
function addCustomExt(e){ if (e.key === "Enter") addCustomExtBtn(); }
function addCustomExtBtn(){
  const inp = document.getElementById("custom-ext");
  const v = inp.value.trim();
  if (v && !state.draft.exteriors.includes(v)){ state.draft.exteriors.push(v); inp.value = ""; render(); }
}
function toggleSel(area_id, on){
  if (on) state.selection.add(area_id); else state.selection.delete(area_id);
  render();
}
function toggleSelAll(on){
  state.selection = on ? new Set(state.ha.areas.map(a => a.area_id)) : new Set();
  render();
}

// ═══════════════════════════════════════════════════════════════════════════
// SORTIE — modèle house pour la phase 2 et le générateur
// ═══════════════════════════════════════════════════════════════════════════
function buildHouse(){
  return {
    generated: new Date().toISOString(),
    floors: state.draft.floors
      .filter(f => f.name.trim())
      .map(f => ({
        name: f.name.trim(),
        floor_id: f.floor_id,
        rooms: f.rooms.filter(r => r.name.trim())
          .map(r => ({name:r.name.trim(), area_id:r.area_id, color:r.color}))
      })),
    exteriors: state.draft.exteriors.slice()
  };
}
function saveHouse(){
  localStorage.setItem(LS_HOUSE, JSON.stringify(buildHouse()));
}
function exportHouse(){
  saveHouse();
  const blob = new Blob([JSON.stringify(buildHouse(),null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "vssp_house.json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function roomCount(){
  return state.draft.floors.reduce((n,f)=> n + f.rooms.filter(r=>r.name.trim()).length, 0)
       + state.draft.exteriors.length;
}
// ═══════════════════════════════════════════════════════════════════════════
// CONNEXION
// ═══════════════════════════════════════════════════════════════════════════
async function connect(){
  const inp = document.getElementById("token-input");
  if (inp) state.token = inp.value.trim();
  if (!state.token){ state.error = t("err_no_token"); return render(); }
  localStorage.setItem(LS_TOKEN, state.token);
  setBusy(true, t("busy_connecting"));
  try{
    await wsConnect(state.token);
    state.connected = true;
    await loadRegistry();
    await applyDraftSlotSets();
    await loadLanguage();
    subscribeLanguage();
    state.notice = await syncRoomsBestEffort(
      t("notice_registry_read", {floors: state.ha.floors.length, areas: state.ha.areas.length}));
  }catch(e){
    state.connected = false;
    state.error = e.message;
  }finally{ setBusy(false); }
}
async function reload(){
  setBusy(true, t("busy_reloading"));
  try{
    await loadRegistry();
    await applyDraftSlotSets();
    state.notice = await syncRoomsBestEffort(t("notice_registry_reloaded"));
  }
  catch(e){ state.error = e.message; }
  finally{ setBusy(false); }
}
function setBusy(on, label){
  state.loading = on;
  state.busyLabel = label || "";
  if (on){ state.error = ""; state.notice = ""; }
  render();
}

// ═══════════════════════════════════════════════════════════════════════════
// RENDU
// ═══════════════════════════════════════════════════════════════════════════
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function render(){
  const c = document.getElementById("content");
  let html = "";

  if (state.loading){
    html += `<div class="status status-info"><span class="spinner"></span>${esc(state.busyLabel)}</div>`;
  }
  if (state.error)  html += `<div class="status status-error">${esc(state.error)}</div>`;
  if (state.notice) html += `<div class="status status-ok">${esc(state.notice)}</div>`;

  if (!state.connected){
    html += `
    <div class="card">
      <div class="card-title">${t("conn_title")}</div>
      <div class="card-sub">${t("conn_sub")}</div>
      <div class="row" style="margin-top:14px">
        <input type="text" id="token-input" class="flex1" placeholder="eyJhbGciOi…" value="${esc(state.token)}"/>
        <button class="btn" onclick="connect()">${t("conn_connect")}</button>
      </div>
    </div>`;
    c.innerHTML = html;
    return;
  }

  html += renderInventory();
  html += renderEditor();
  html += renderDiff();

  const rc = roomCount();
  // EN | A real <a target="_top"> instead of a script-driven
  // EN | window.top.location assignment: this page is an iframe on the
  // EN | ADMIN dashboard, and some browsers silently swallow a top-level
  // EN | navigation initiated from inside a script, with no console error
  // EN | to explain why the button "did nothing". A genuine link click is
  // EN | the standard, reliably-permitted way to escape an iframe.
  // FR | Un vrai <a target="_top"> plutot qu une assignation
  // FR | window.top.location pilotee par script : cette page est une
  // FR | iframe sur le dashboard ADMIN, et certains navigateurs avalent en
  // FR | silence une navigation top-level lancee depuis un script, sans
  // FR | erreur console pour expliquer pourquoi le bouton « ne fait rien ».
  // FR | Un vrai clic de lien est le moyen standard, fiable, de sortir
  // FR | d une iframe.
  // EN | No target="_top": see the NEXT_URL comment above — this frame is
  // EN | sandboxed by HA's iframe card without allow-top-navigation, so
  // EN | target="_top" would throw the exact same SecurityError as the
  // EN | window.top assignment it replaces. Plain same-frame navigation,
  // EN | with a timestamp so a browser that cached assign.html on an
  // EN | earlier visit still fetches the current one.
  // FR | Pas de target="_top" : voir le commentaire de NEXT_URL plus haut —
  // FR | cette frame est sandboxee par la carte iframe de HA sans
  // FR | allow-top-navigation, donc target="_top" leverait exactement la
  // FR | meme SecurityError que l'assignation window.top qu'il remplace.
  // FR | Navigation simple dans le meme cadre, avec un horodatage pour
  // FR | qu'un navigateur ayant deja mis assign.html en cache lors d'une
  // FR | visite precedente aille quand meme chercher la version actuelle.
  const nextHref = NEXT_URL + "?t=" + Date.now();
  const nextBtn = rc
    ? `<a class="btn" href="${esc(nextHref)}" onclick="saveHouse()">${t("act_next_assign")}</a>`
    : `<span class="btn" aria-disabled="true" style="opacity:.35;cursor:not-allowed">${t("act_next_assign")}</span>`;
  html += `
    <div class="actions">
      <button class="btn btn-ghost" onclick="reload()">${t("act_reload")}</button>
      <div class="actions-right">
        <button class="btn btn-ghost" onclick="exportHouse()">${t("act_export")}</button>
        ${nextBtn}
      </div>
    </div>`;

  c.innerHTML = html;
}

function renderInventory(){
  const {floors, areas, counts} = state.ha;
  let ent = 0; Object.values(counts).forEach(x => ent += x.total);

  let h = `
  <div class="card">
    <div class="card-title">${t("inv_title")}</div>
    <div class="card-sub">${t("inv_sub")}</div>
    <div class="row" style="margin-top:12px;flex-wrap:wrap">
      <span class="badge badge-cyan">${t("badge_floors",{n:floors.length})}</span>
      <span class="badge badge-cyan">${t("badge_rooms",{n:areas.length})}</span>
      <span class="badge badge-${ent ? "green" : "mut"}">${t("badge_entities_assigned",{n:ent})}</span>
      <span class="flex1"></span>
      <button class="btn btn-sm btn-danger" onclick="deleteSelected()" ${state.selection.size ? "" : "disabled"}>
        ${t("btn_remove_selection",{n:state.selection.size})}
      </button>
      <button class="btn btn-sm btn-danger" onclick="resetAll()" ${areas.length || floors.length ? "" : "disabled"}>
        ${t("btn_delete_all")}
      </button>
    </div>`;

  if (!areas.length){
    h += `<div class="status status-warn" style="margin-top:14px">
      ${t("inv_empty")}</div></div>`;
    return h;
  }

  h += `<div class="row" style="margin-top:14px">
    <label style="display:flex;gap:8px;align-items:center;color:var(--dim);font-size:12px;cursor:pointer">
      <input type="checkbox" ${state.selection.size === areas.length ? "checked" : ""}
        onchange="toggleSelAll(this.checked)"/> ${t("select_all")}
    </label>
  </div>`;

  const byFloor = {};
  areas.forEach(a => { (byFloor[a.floor_id || "__none__"] ||= []).push(a); });

  const floorOrder = floors.slice().sort((x,y)=>(x.level ?? 0)-(y.level ?? 0));
  const groups = floorOrder.map(f => [f.name, byFloor[f.floor_id] || []])
    .concat(byFloor["__none__"] ? [[t("floor_no_floor"), byFloor["__none__"]]] : []);

  groups.forEach(([fname, list]) => {
    if (!list.length) return;
    h += `<div class="inv-floor">${esc(fname)} <span class="badge badge-mut">${list.length}</span></div>`;
    list.forEach(a => {
      const cnt = counts[a.area_id] || {total:0, byDomain:{}};
      const doms = Object.entries(cnt.byDomain)
        .map(([d,n]) => `${DOMAIN_ICON[d]||"📦"} ${n}`).join(" · ");
      h += `
      <div class="inv-row">
        <input type="checkbox" ${state.selection.has(a.area_id) ? "checked" : ""}
          onchange="toggleSel('${esc(a.area_id)}',this.checked)"/>
        <div class="inv-name">${esc(a.name)}</div>
        <div class="inv-meta">${esc(doms || "—")}</div>
        <span class="badge badge-${cnt.total ? "cyan" : "mut"}">${t("badge_ent_short",{n:cnt.total})}</span>
      </div>`;
    });
  });

  h += `</div>`;
  return h;
}

function renderEditor(){
  const h0 = `
  <div class="card">
    <div class="card-title">${t("editor_title")}</div>
    <div class="card-sub">${t("editor_sub")}</div>`;

  let h = h0;
  if (!state.draft.floors.length){
    h += `<div class="ghost" style="margin-left:0">${t("editor_no_floors")}</div>`;
  }

  state.draft.floors.forEach((f, fi) => {
    h += `
    <div class="floor-block">
      <div class="row">
        <span class="badge badge-cyan">${t("badge_level",{fi})}</span>
        <input type="text" class="flex1" value="${esc(f.name)}" placeholder="${t("placeholder_floor_name")}"
          oninput="updFloorName(${fi},this.value)"/>
        ${f.floor_id ? `<span class="badge badge-green">${t("badge_existing")}</span>` : `<span class="badge badge-orange">${t("badge_new")}</span>`}
        <button class="btn btn-sm btn-danger" onclick="delFloor(${fi})" title="${t("title_remove_floor")}">✕</button>
      </div>`;

    if (!f.rooms.length){
      h += `<div class="ghost">${t("editor_no_rooms")}</div>`;
    }
    f.rooms.forEach((r, ri) => {
      const cnt = r.area_id ? (state.ha.counts[r.area_id] || {total:0}).total : 0;
      h += `
      <div class="row room-row">
        <input type="text" class="flex1" value="${esc(r.name)}" placeholder="${t("placeholder_room_name")}"
          oninput="updRoom(${fi},${ri},'name',this.value)"/>
        <select title="${t("title_room_slot_set")}"
          onchange="updRoom(${fi},${ri},'slot_set',this.value)">
${SLOT_SETS.map(s => `          <option value="${s}" ${s === (r.slot_set || "default") ? "selected" : ""}>${esc(s)}</option>`).join("\n")}
        </select>
        <input type="color" value="${esc(r.color || DEFAULT_COLOR)}" title="${t("title_room_color")}"
          onchange="updRoom(${fi},${ri},'color',this.value)"/>
        ${r.area_id ? `<span class="badge badge-${cnt?"cyan":"mut"}">${t("badge_ent_short",{n:cnt})}</span>`
                    : `<span class="badge badge-orange">${t("badge_new_room")}</span>`}
        <button class="btn btn-sm btn-danger" onclick="delRoom(${fi},${ri})" title="${t("title_remove_room")}">✕</button>
      </div>`;
    });

    h += `<button class="btn btn-sm" style="margin:8px 0 0 18px" onclick="addRoom(${fi})">${t("btn_add_room")}</button>
    </div>`;
  });

  h += `<button class="btn btn-sm" onclick="addFloor()">${t("btn_add_floor")}</button>
  </div>

  <div class="card">
    <div class="card-title">${t("ext_title")}</div>
    <div class="card-sub">${t("ext_sub")}</div>
    <div style="margin-top:12px">`;
  const customs = state.draft.exteriors.filter(e => !EXTERIOR_TYPES.includes(e));
  EXTERIOR_TYPES.concat(customs).forEach(e => {
    const on = state.draft.exteriors.includes(e);
    // EN | A custom, hand-typed exterior (added via "Autre espace…") has no
    // EN | entry in EXTERIOR_LABELS — it was never a translatable catalogue
    // EN | value to start with, so it is shown exactly as typed.
    // FR | Un espace exterieur personnalise (ajoute via "Autre espace…") n a
    // FR | pas d entree dans EXTERIOR_LABELS — ce n a jamais ete une valeur
    // FR | de catalogue traduisible, donc il s affiche tel quel.
    const label = (EXTERIOR_LABELS[e] && EXTERIOR_LABELS[e][state.lang]) || e;
    h += `<span class="chip${on?" on":""}" onclick="toggleExt('${esc(e).replace(/'/g,"\\'")}')">${esc(label)}</span>`;
  });
  h += `</div>
    <div class="row" style="margin-top:12px">
      <input type="text" id="custom-ext" class="flex1" placeholder="${t("placeholder_custom_ext")}" onkeydown="addCustomExt(event)"/>
      <button class="btn btn-sm" onclick="addCustomExtBtn()">+</button>
    </div>
  </div>`;
  return h;
}

function renderDiff(){
  const d = computeDiff();
  const risk = entitiesAtRisk(d);

  let h = `<div class="card" id="diffCard">
    <div class="card-title">${t("diff_title")}</div>`;

  if (!d.total){
    h += `<div class="card-sub" style="margin-top:8px">${t("diff_match")}</div></div>`;
    return h;
  }

  h += `<div class="diff" style="margin-top:12px">`;
  d.floorsCreate.forEach(f => h += `<div class="add">${t("diff_add_floor")} &nbsp;${esc(f.name)}</div>`);
  d.floorsUpdate.forEach(f => h += `<div class="upd">${t("diff_upd_floor")} &nbsp;${esc(f.name)}</div>`);
  d.areasCreate.forEach(a  => h += `<div class="add">${t("diff_add_room")} &nbsp;${esc(a.name)} <span style="color:var(--mut)">(${esc(a.floorName||t("diff_no_floor"))})</span></div>`);
  d.areasUpdate.forEach(a  => h += `<div class="upd">${t("diff_upd_room")} &nbsp;${esc(a.name)} <span style="color:var(--mut)">(${esc(a.floorName||t("diff_no_floor"))})</span></div>`);
  d.areasDelete.forEach(a  => {
    const n = (state.ha.counts[a.area_id]||{total:0}).total;
    h += `<div class="del">${t("diff_del_room")} &nbsp;${esc(a.name)}${n?`<span style="color:var(--mut)">${t("diff_entities_unassigned",{n})}</span>`:""}</div>`;
  });
  d.floorsDelete.forEach(f => h += `<div class="del">${t("diff_del_floor")} &nbsp;${esc(f.name)}</div>`);
  h += `</div>`;

  if (risk){
    h += `<div class="status status-warn" style="margin-top:14px">
      ${t("diff_risk_warning",{risk})}
    </div>`;
  }

  h += `<div class="row" style="margin-top:14px">
    <button class="btn btn-ok" onclick="applyDiff()">${t("btn_apply",{n:d.total})}</button>
    <button class="btn btn-ghost btn-sm" onclick="reload()">${t("btn_cancel_changes")}</button>
  </div></div>`;
  return h;
}

// ═══════════════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════════════
applyLang(state.lang);
render();
if (state.token) connect();
</script>

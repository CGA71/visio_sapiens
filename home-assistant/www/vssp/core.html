<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Visio Sapiens - Core System</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#02050B;color:#fff;font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;min-height:100vh;padding:20px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:2px}
.page{max-width:1400px;margin:0 auto}
.header{display:flex;align-items:center;gap:16px;padding:16px 24px;background:rgba(8,18,28,.85);border:1px solid rgba(0,229,255,.22);border-radius:18px;margin-bottom:16px;flex-wrap:wrap}
.header-logo{font-family:'Orbitron','Courier New',monospace;color:#00E5FF;font-size:20px;letter-spacing:3px}
.header-sub{color:#56707E;font-size:11px;letter-spacing:1px}
.header-info{display:flex;gap:24px;margin-left:auto;flex-wrap:wrap}
.header-info-item{text-align:center}
.header-info-label{color:#56707E;font-size:10px;letter-spacing:1px}
.header-info-value{color:#B8E8F5;font-size:13px;font-weight:600}
.btn{padding:6px 12px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.4);border-radius:8px;color:#00E5FF;cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:1px;font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.section{background:rgba(8,18,28,.85);border:1px solid rgba(0,229,255,.22);border-radius:18px;padding:20px;margin-bottom:16px}
.section-title{font-family:'Orbitron','Courier New',monospace;color:#00E5FF;font-size:13px;letter-spacing:2px;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(0,229,255,.15)}
.gauge-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px}
.gauge-card{background:rgba(0,229,255,.04);border:1px solid rgba(0,229,255,.2);border-radius:14px;padding:16px;text-align:center}
.gauge-card-title{font-family:'Orbitron','Courier New',monospace;color:#8FB6C9;font-size:11px;letter-spacing:1.5px;margin-bottom:8px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;align-items:start}
.two-col>.section{margin-bottom:0}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart-card{background:rgba(0,229,255,.04);border:1px solid rgba(0,229,255,.2);border-radius:14px;padding:16px;height:220px;max-height:220px;overflow:hidden;position:relative}
.chart-title{color:#8FB6C9;font-size:12px;font-weight:600;letter-spacing:1px;margin-bottom:8px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{color:#56707E;font-size:10px;letter-spacing:1px;text-align:left;padding:6px 8px;border-bottom:1px solid rgba(0,229,255,.15);text-transform:uppercase}
.tbl td{color:#B8E8F5;font-size:12px;padding:6px 8px;border-bottom:1px solid rgba(0,229,255,.06)}
.muted{color:#56707E}
.bar{height:6px;border-radius:3px;background:rgba(0,229,255,.15);min-width:60px}
.bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#00FFC3,#3AA7FF)}
.bar-fill.warn{background:linear-gradient(90deg,#FF9800,#FFB74D)}
.bar-fill.crit{background:linear-gradient(90deg,#FF3D71,#FF9800)}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.dot-ok{background:#00FFC3;box-shadow:0 0 6px #00FFC3}
.dot-warn{background:#FF9800;box-shadow:0 0 6px #FF9800}
.dot-crit{background:#FF3D71;box-shadow:0 0 6px #FF3D71}
.dot-info{background:#00E5FF;box-shadow:0 0 6px #00E5FF}
.k3s-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.k3s-kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.k3s-kpi{background:rgba(0,229,255,.04);border:1px solid rgba(0,229,255,.2);border-radius:10px;padding:12px;text-align:center}
.k3s-kpi-label{color:#56707E;font-size:10px;letter-spacing:1px;text-transform:uppercase}
.k3s-kpi-value{color:#fff;font-size:20px;font-weight:700;font-family:'Orbitron','Courier New',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k3s-kpi-sub{color:#8FB6C9;font-size:10px}
.k3s-tables{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px}
.k3s-bottom{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:14px}
.sub-title{font-family:'Orbitron','Courier New',monospace;color:#00E5FF;font-size:11px;letter-spacing:2px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(0,229,255,.15)}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700}
.badge-ok{background:rgba(0,255,195,.15);color:#00FFC3;border:1px solid rgba(0,255,195,.3)}
.badge-warn{background:rgba(255,152,0,.15);color:#FF9800;border:1px solid rgba(255,152,0,.3)}
.badge-crit{background:rgba(255,61,113,.15);color:#FF3D71;border:1px solid rgba(255,61,113,.3)}
.badge-info{background:rgba(0,229,255,.1);color:#00E5FF;border:1px solid rgba(0,229,255,.3)}
/* EN | The recommendation box: a frame of its own, coloured by the worst finding in it.
   FR | L encadre de preconisations : un cadre a lui, colore par le pire constat qu il contient. */
.advice{border:1px solid rgba(0,229,255,.35);border-left:4px solid #00E5FF;border-radius:14px;background:rgba(0,229,255,.05);padding:14px 16px;margin-bottom:16px}
.advice.lvl-warn{border-color:rgba(255,152,0,.45);border-left-color:#FF9800;background:rgba(255,152,0,.05)}
.advice.lvl-crit{border-color:rgba(255,61,113,.45);border-left-color:#FF3D71;background:rgba(255,61,113,.05)}
.advice.lvl-ok{border-color:rgba(0,255,195,.35);border-left-color:#00FFC3;background:rgba(0,255,195,.04)}
.advice-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.advice-title{font-family:'Orbitron','Courier New',monospace;font-size:12px;letter-spacing:2px;color:#fff}
.advice-head .btn{margin-left:auto}
.advice ul{list-style:none}
.advice li{display:flex;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.05)}
.advice li:first-child{border-top:none}
.advice li .status-dot{margin-top:6px;flex:none}
.advice-t{color:#fff;font-size:13px;font-weight:700}
.advice-d{color:#B8E8F5;font-size:12px;line-height:1.35}
code.cmd{display:block;margin-top:4px;padding:4px 8px;background:rgba(0,0,0,.35);border:1px solid rgba(0,229,255,.12);border-radius:6px;color:#8FE9FF;font-family:Consolas,'Courier New',monospace;font-size:11px;white-space:pre-wrap;word-break:break-all}
.scan{margin-top:12px;padding-top:10px;border-top:1px dashed rgba(0,229,255,.25)}
.scan-head{color:#8FB6C9;font-size:11px;letter-spacing:1px;margin-bottom:6px}
.scan-sum{color:#B8E8F5;font-size:12px;margin-bottom:6px}
.scan-item{padding:6px 0}
.scan-src a{color:#00E5FF;font-size:11px;text-decoration:none;margin-right:10px}
.scan-src a:hover{text-decoration:underline}
.scan-note{color:#56707E;font-size:10px;margin-top:6px}
.scan-err{color:#FF9800;font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,229,255,.2);border-top-color:#00E5FF;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
@media(max-width:900px){.gauge-grid{grid-template-columns:repeat(3,1fr)}.charts-grid,.k3s-tables,.two-col{grid-template-columns:1fr}.k3s-kpi-grid{grid-template-columns:repeat(3,1fr)}.k3s-bottom{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div><div class="header-logo" data-t="title"></div><div class="header-sub">Glances Monitoring</div></div>
    <div class="header-info">
      <div class="header-info-item"><div class="header-info-label" data-t="hostname"></div><div class="header-info-value" id="hostname">--</div></div>
      <div class="header-info-item"><div class="header-info-label">OS</div><div class="header-info-value" id="os-info">--</div></div>
      <div class="header-info-item"><div class="header-info-label" data-t="uptime"></div><div class="header-info-value" id="uptime">--</div></div>
      <div class="header-info-item"><div class="header-info-label" data-t="updated"></div><div class="header-info-value" id="last-update">--</div></div>
      <div class="header-info-item"><button class="btn" onclick="clearCache()" data-t="clear_cache" data-title="clear_cache_tip"></button></div>
    </div>
  </div>
  <div class="gauge-grid">
    <div class="gauge-card"><div class="gauge-card-title">CPU</div><div id="g-cpu">--</div></div>
    <div class="gauge-card"><div class="gauge-card-title">RAM</div><div id="g-ram">--</div></div>
    <div class="gauge-card"><div class="gauge-card-title" data-t="load"></div><div id="g-load">--</div></div>
    <div class="gauge-card"><div class="gauge-card-title">Swap</div><div id="g-swap">--</div></div>
    <div class="gauge-card"><div class="gauge-card-title" data-t="cpu_temp"></div><div id="g-temp">--</div></div>
  </div>
  <div class="two-col">
    <div class="section">
      <div class="section-title" data-t="partitions"></div>
      <table class="tbl" id="parts"></table>
      <div class="muted" style="font-size:10px;margin-top:8px" id="parts-src"></div>
    </div>
    <div class="advice" id="adv-system">
      <div class="advice-head"><span style="font-size:16px">&#128161;</span><span class="advice-title" data-t="adv_system"></span><button class="btn" id="scan-system" onclick="startScan('system')">&#128269; SCAN</button></div>
      <ul id="adv-system-list"><li class="muted" data-t="loading"></li></ul>
      <div class="scan" id="scan-system-out" hidden></div>
    </div>
  </div>
  <div class="section">
    <div class="section-title" data-t="history"></div>
    <div class="charts-grid">
      <div class="chart-card"><div class="chart-title" data-t="chart_cpu"></div><div style="position:relative;height:160px;width:100%"><canvas id="chart-cpu"></canvas></div></div>
      <div class="chart-card"><div class="chart-title" data-t="chart_ram"></div><div style="position:relative;height:160px;width:100%"><canvas id="chart-ram"></canvas></div></div>
      <div class="chart-card"><div class="chart-title" data-t="chart_net"></div><div style="position:relative;height:160px;width:100%"><canvas id="chart-net"></canvas></div></div>
      <div class="chart-card"><div class="chart-title" data-t="chart_disk"></div><div style="position:relative;height:160px;width:100%"><canvas id="chart-disk"></canvas></div></div>
    </div>
  </div>
  <div class="section">
    <div class="section-title" data-t="temps"></div>
    <table class="tbl">
      <thead><tr><th data-t="component"></th><th data-t="sensor"></th><th data-t="temperature"></th><th></th><th data-t="state"></th></tr></thead>
      <tbody id="temp-body"><tr><td colspan="5" class="muted" style="text-align:center" data-t="loading"></td></tr></tbody>
    </table>
  </div>
  <div class="section">
    <div class="k3s-header"><span style="font-size:28px">&#9881;</span><div style="font-family:'Orbitron','Courier New',monospace;color:#fff;font-size:16px;letter-spacing:2px" data-t="k3s_title"></div><span id="k3s-src" class="muted" style="font-size:11px;margin-left:auto"></span></div>
    <div class="k3s-kpi-grid" id="k3s-kpis"><div class="muted" style="grid-column:1/-1;text-align:center" data-t="loading"></div></div>
    <div class="advice" id="adv-k3s">
      <div class="advice-head"><span style="font-size:16px">&#128161;</span><span class="advice-title" data-t="adv_k3s"></span><button class="btn" id="scan-k3s" onclick="startScan('k3s')">&#128269; SCAN</button></div>
      <ul id="adv-k3s-list"><li class="muted" data-t="loading"></li></ul>
      <div class="scan" id="scan-k3s-out" hidden></div>
    </div>
    <div class="k3s-tables">
      <div><div class="sub-title" data-t="nodes"></div><table class="tbl" id="k3s-nodes"></table></div>
      <div><div class="sub-title" data-t="resources"></div><table class="tbl" id="k3s-resources"></table></div>
    </div>
    <div class="k3s-bottom">
      <div><div class="sub-title" data-t="top_ns"></div><table class="tbl" id="k3s-namespaces"></table></div>
      <div><div class="sub-title" data-t="workloads"></div><table class="tbl" id="k3s-deployments"></table></div>
      <div><div class="sub-title" data-t="events"></div><table class="tbl" id="k3s-events"></table></div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

// FR | Le minuteur est relance dans `finally` : une erreur reseau arretait
// FR | la boucle pour de bon jusqu a ce que quelqu un recharge la page.
async function cycle(){try{await refresh();if(errBox){errBox.remove();errBox=null}}catch(e){console.error(e);if(!errBox){errBox=document.createElement('div');errBox.className='section';errBox.style.borderColor='#FF3D71';document.querySelector('.page').appendChild(errBox)}errBox.innerHTML='<div style="color:#FF3D71">'+esc(t('error'))+': '+esc(e.message)+'</div>'}finally{setTimeout(cycle,30000)}}
function init(){applyStatic();if(!TOKEN&&!haSession()){document.querySelector('.page').innerHTML='<div class="section" style="max-width:400px;margin:80px auto"><div class="section-title">'+esc(t('login'))+'</div><p style="color:#8FB6C9;margin-bottom:12px">'+esc(t('login_need'))+'</p><input type="password" id="tok" placeholder="eyJhbGciOi..." style="width:100%;padding:8px;background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.3);border-radius:8px;color:#fff;margin-bottom:12px"><button class="btn" onclick="saveToken()">'+esc(t('login_btn'))+'</button></div>';return}loadLastScans();cycle()}
// EN | RELOAD, do not call init() again. When there is no token, init()
// EN | replaces the whole .page with the login form - so every element it
// EN | needs afterwards (#hostname, #uptime, #g-cpu...) no longer exists,
// EN | and calling it again died on
// EN | "Cannot set properties of null (setting 'textContent')". The bug was
// EN | latent for as long as everyone already had a token in localStorage;
// EN | renaming that key emptied it and woke the bug on the very next paste.
// EN | The token is already persisted by the line before, so a reload comes
// EN | back with TOKEN set and runs against the original, intact DOM.
// FR | RECHARGER, ne pas rappeler init(). Sans jeton, init() remplace tout
// FR | le contenu de .page par le formulaire de connexion - chaque element
// FR | dont il a besoin ensuite (#hostname, #uptime, #g-cpu...) n'existe
// FR | donc plus, et le rappeler mourait sur
// FR | « Cannot set properties of null (setting 'textContent') ». Le defaut
// FR | est reste dormant tant que tout le monde avait deja un jeton en
// FR | memoire ; renommer cette cle l'a vide et a reveille le bug des le
// FR | premier collage.
// FR | Le jeton est deja persiste par la ligne precedente : un rechargement
// FR | revient donc avec TOKEN pose et s'execute sur le DOM d'origine, intact.
function saveToken(){var t_=document.getElementById('tok').value.trim();if(t_){localStorage.setItem('vssp_ha_token',t_);location.reload()}}
function clearCache(){try{if(window.caches&&caches.keys){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}}catch(e){}var q=new URLSearchParams(location.search);q.set('nocache',Date.now());location.replace(location.pathname+'?'+q.toString())}
init();
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSVision V2 — Discovery Wizard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #02050B; color: #fff; font-family: 'Rajdhani', system-ui, sans-serif; }
    input, select, button { font-family: inherit; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #02050B; }
    ::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.3); border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useCallback, useMemo } = React;

    const T = {
      bg: "#02050B", panel: "rgba(8,18,28,0.85)",
      cyan: "#00E5FF", cyanDim: "rgba(0,229,255,0.15)", cyanBorder: "rgba(0,229,255,0.35)",
      green: "#00FFC3", red: "#FF3D71", orange: "#FF9800",
      text: "#FFFFFF", textDim: "#8FB6C9", textMute: "#56707E",
      font: "'Rajdhani', system-ui, sans-serif",
      fontMono: "'Orbitron', system-ui, sans-serif",
    };

    const HA_URL = window.location.origin;

    async function haGet(path) {
      const token = localStorage.getItem("osv_ha_token");
      const r = await fetch(`${HA_URL}/api/${path}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!r.ok) throw new Error(`HA API ${path}: ${r.status}`);
      return r.json();
    }

    const EXTERIOR_TYPES = ["Jardin","Piscine","Jacuzzi","Garage","Terrasse","Véranda"];
    const DOMAIN_ICON = {
      light:"💡", switch:"🔌", sensor:"📡", binary_sensor:"🚨",
      climate:"🌡", media_player:"🎵", cover:"🪟", camera:"📷",
      alarm_control_panel:"🔒", vacuum:"🤖", fan:"💨", lock:"🔑",
    };

    const S = {
      page: { minHeight:"100vh", background:T.bg, color:T.text, fontFamily:T.font, padding:"24px" },
      card: { background:T.panel, border:`1px solid ${T.cyanBorder}`, borderRadius:16, padding:"24px", marginBottom:16, backdropFilter:"blur(12px)" },
      title: { fontFamily:T.fontMono, color:T.cyan, fontSize:22, letterSpacing:3, margin:0 },
      sub: { color:T.textDim, fontSize:13, marginBottom:20, marginTop:6 },
      label: { color:T.textDim, fontSize:12, letterSpacing:1, marginBottom:4, display:"block" },
      input: { background:"rgba(0,229,255,0.06)", border:`1px solid ${T.cyanBorder}`, borderRadius:8, padding:"8px 12px", color:T.text, fontSize:14, fontFamily:T.font, outline:"none", width:"100%" },
      select: { background:"rgba(0,229,255,0.06)", border:`1px solid ${T.cyanBorder}`, borderRadius:8, padding:"8px 12px", color:T.text, fontSize:14, fontFamily:T.font, outline:"none", width:"100%" },
      btn: (v="primary") => ({ background:v==="primary"?T.cyanDim:"transparent", border:`1px solid ${v==="danger"?T.red:v==="green"?T.green:T.cyan}`, borderRadius:10, padding:"10px 20px", color:v==="danger"?T.red:v==="green"?T.green:T.cyan, fontFamily:T.fontMono, fontSize:13, letterSpacing:1, cursor:"pointer", transition:"all .2s ease" }),
      chip: (a) => ({ display:"inline-block", padding:"4px 12px", borderRadius:20, fontSize:12, letterSpacing:1, cursor:"pointer", marginRight:6, marginBottom:6, background:a?T.cyanDim:"transparent", border:`1px solid ${a?T.cyan:T.cyanBorder}`, color:a?T.cyan:T.textDim, transition:"all .2s" }),
      row: { display:"flex", gap:12, alignItems:"center", marginBottom:10 },
      badge: (c) => ({ display:"inline-block", background:`${c}22`, border:`1px solid ${c}66`, borderRadius:6, padding:"2px 8px", fontSize:11, color:c, marginRight:4 }),
      stepDot: (a,d) => ({ flex:1, height:4, borderRadius:2, background:d?T.green:a?T.cyan:T.cyanBorder, transition:"background .3s" }),
    };

    // ── STEP 1 ─────────────────────────────────────────────────────────────
    function Step1({ house, setHouse, onNext }) {
      const addFloor = () => setHouse(h => ({
        ...h, floors: [...h.floors, { name: h.floors.length===0?"Rez-de-chaussée":`Étage ${h.floors.length}`, rooms:[] }],
      }));
      const updFloorName = (fi,n) => setHouse(h => ({ ...h, floors:h.floors.map((f,i)=>i===fi?{...f,name:n}:f) }));
      const addRoom = (fi) => setHouse(h => ({ ...h, floors:h.floors.map((f,i)=>i===fi?{...f,rooms:[...f.rooms,{name:"",color:"#0A2030"}]}:f) }));
      const updRoom = (fi,ri,k,v) => setHouse(h => ({ ...h, floors:h.floors.map((f,i)=>i!==fi?f:{...f,rooms:f.rooms.map((r,j)=>j!==ri?r:{...r,[k]:v})}) }));
      const delRoom = (fi,ri) => setHouse(h => ({ ...h, floors:h.floors.map((f,i)=>i!==fi?f:{...f,rooms:f.rooms.filter((_,j)=>j!==ri)}) }));
      const toggleExt = (n) => setHouse(h => ({ ...h, exteriors:h.exteriors.includes(n)?h.exteriors.filter(e=>e!==n):[...h.exteriors,n] }));
      const canNext = house.floors.some(f=>f.rooms.some(r=>r.name));

      return (
        <div>
          <p style={S.sub}>Définissez la structure de votre maison.</p>
          {house.floors.map((floor,fi) => (
            <div key={fi} style={S.card}>
              <div style={S.row}>
                <span style={{color:T.cyan,fontFamily:T.fontMono,fontSize:12,whiteSpace:"nowrap"}}>ÉTAGE {fi+1}</span>
                <input style={{...S.input,flex:1}} value={floor.name} onChange={e=>updFloorName(fi,e.target.value)} placeholder="Nom de l'étage"/>
              </div>
              {floor.rooms.map((room,ri) => (
                <div key={ri} style={{...S.row,marginLeft:20}}>
                  <input style={{...S.input,flex:1}} value={room.name} onChange={e=>updRoom(fi,ri,"name",e.target.value)} placeholder="Nom de la pièce"/>
                  <input type="color" value={room.color} onChange={e=>updRoom(fi,ri,"color",e.target.value)} style={{width:36,height:36,border:"none",background:"none",cursor:"pointer",borderRadius:6}}/>
                  <button style={S.btn("danger")} onClick={()=>delRoom(fi,ri)}>✕</button>
                </div>
              ))}
              <button style={{...S.btn(),marginTop:8,marginLeft:20,fontSize:12}} onClick={()=>addRoom(fi)}>+ Pièce</button>
            </div>
          ))}
          <button style={{...S.btn(),marginBottom:24}} onClick={addFloor}>+ Ajouter un étage</button>

          <div style={S.card}>
            <p style={{...S.label,fontSize:13,marginBottom:12}}>ESPACES EXTÉRIEURS</p>
            {EXTERIOR_TYPES.map(e=>(
              <span key={e} style={S.chip(house.exteriors.includes(e))} onClick={()=>toggleExt(e)}>{e}</span>
            ))}
          </div>

          <div style={{textAlign:"right"}}>
            <button style={S.btn()} disabled={!canNext} onClick={onNext}>Suivant → Appareils</button>
          </div>
        </div>
      );
    }

    // ── STEP 2 ─────────────────────────────────────────────────────────────
    function Step2({ house, devices, setDevices, loading, error, onNext, onBack }) {
      const allRooms = useMemo(() => {
        const r=[];
        house.floors.forEach(f=>f.rooms.forEach(rm=>rm.name&&r.push(rm.name)));
        house.exteriors.forEach(e=>r.push(e));
        return r;
      },[house]);

      const assign = (id,room) => setDevices(d=>d.map(dev=>dev.entity_id===id?{...dev,room}:dev));
      const assigned = devices.filter(d=>d.room).length;

      const byDomain = useMemo(()=>{
        const m={};
        devices.forEach(d=>{const dom=d.entity_id.split(".")[0];if(!m[dom])m[dom]=[];m[dom].push(d);});
        return m;
      },[devices]);

      return (
        <div>
          <p style={S.sub}>{loading?"Chargement…":error?`Erreur: ${error}`:`${devices.length} appareils · ${assigned} assignés`}</p>
          {loading && <div style={{textAlign:"center",padding:40,color:T.cyan,fontSize:32}}>⟳</div>}
          {!loading && !error && Object.entries(byDomain).map(([dom,devs])=>(
            <div key={dom} style={S.card}>
              <p style={{...S.label,fontSize:13,marginBottom:12}}>
                {DOMAIN_ICON[dom]||"📦"} {dom.toUpperCase().replace("_"," ")}
                <span style={S.badge(T.cyan)}>{devs.length}</span>
              </p>
              {devs.map(dev=>(
                <div key={dev.entity_id} style={{...S.row,flexWrap:"wrap",marginBottom:8}}>
                  <div style={{flex:2,minWidth:180}}>
                    <div style={{fontSize:13}}>{dev.friendly_name}</div>
                    <div style={{fontSize:11,color:T.textMute}}>{dev.entity_id}</div>
                  </div>
                  <select style={{...S.select,flex:1,minWidth:160}} value={dev.room||""} onChange={e=>assign(dev.entity_id,e.target.value)}>
                    <option value="">— Non assigné —</option>
                    {allRooms.map(r=><option key={r} value={r}>{r}</option>)}
                  </select>
                </div>
              ))}
            </div>
          ))}
          <div style={{display:"flex",justifyContent:"space-between",marginTop:16}}>
            <button style={S.btn("secondary")} onClick={onBack}>← Retour</button>
            <button style={S.btn()} onClick={onNext} disabled={assigned===0}>Suivant → Générer le plan</button>
          </div>
        </div>
      );
    }

    // ── SVG GENERATOR ──────────────────────────────────────────────────────
    function buildSVG(house, devices) {
      const W=1200, M=40, GAP=20, FH=280;
      const floorCount = house.floors.length + (house.exteriors.length>0?1:0);
      const H = M*2 + floorCount*(FH+GAP);
      const byRoom={};
      devices.forEach(d=>{if(d.room){if(!byRoom[d.room])byRoom[d.room]=[];byRoom[d.room].push(d);}});

      let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">
<defs><style>
  text{font-family:'Rajdhani',system-ui,sans-serif}
  .fl{font-family:'Orbitron',system-ui,sans-serif;fill:#00E5FF;font-size:13px;letter-spacing:2px}
  .rn{fill:#00E5FF;font-size:12px;font-weight:bold;letter-spacing:1px}
  .rd{fill:#8FB6C9;font-size:10px}
  .di{font-size:14px}
  .el{fill:#00FFC3;font-size:12px;font-weight:bold}
</style>
<filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="${W}" height="${H}" fill="#02050B"/>
<text x="${W/2}" y="${M-8}" text-anchor="middle" class="fl" style="font-size:16px">OSVision V2 — Plan de la maison</text>`;

      house.floors.forEach((floor,fi)=>{
        const y=M+fi*(FH+GAP);
        const rc=floor.rooms.filter(r=>r.name).length||1;
        const rw=(W-M*2-GAP*(rc-1))/rc;
        s+=`\n<text x="${M}" y="${y+18}" class="fl">${floor.name.toUpperCase()}</text>`;
        s+=`\n<line x1="${M}" y1="${y+24}" x2="${W-M}" y2="${y+24}" stroke="#00E5FF" stroke-opacity=".3" stroke-width="1"/>`;
        floor.rooms.filter(r=>r.name).forEach((room,ri)=>{
          const rx=M+ri*(rw+GAP), ry=y+32, rh=FH-40;
          const devs=byRoom[room.name]||[];
          s+=`\n<rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" rx="12" fill="${room.color||"#0A2030"}" fill-opacity=".7" stroke="#00E5FF" stroke-opacity=".4" stroke-width="1"/>`;
          s+=`\n<text x="${rx+rw/2}" y="${ry+22}" text-anchor="middle" class="rn">${room.name.toUpperCase()}</text>`;
          s+=`\n<text x="${rx+rw/2}" y="${ry+38}" text-anchor="middle" class="rd">${devs.length} appareil${devs.length>1?"s":""}</text>`;
          const ipr=Math.min(6,Math.ceil(rw/30));
          devs.slice(0,12).forEach((dev,di)=>{
            const ic=di%ipr, ir=Math.floor(di/ipr);
            const ix=rx+12+ic*(rw-24)/Math.max(ipr-1,1), iy=ry+55+ir*28;
            const ico=DOMAIN_ICON[dev.entity_id.split(".")[0]]||"📦";
            s+=`\n<text x="${ix}" y="${iy}" text-anchor="middle" class="di" filter="url(#g)">${ico}</text>`;
          });
        });
      });

      if(house.exteriors.length>0){
        const fi=house.floors.length, y=M+fi*(FH+GAP);
        const ew=(W-M*2-GAP*(house.exteriors.length-1))/house.exteriors.length;
        s+=`\n<text x="${M}" y="${y+18}" class="fl" style="fill:#00FFC3">EXTÉRIEURS</text>`;
        s+=`\n<line x1="${M}" y1="${y+24}" x2="${W-M}" y2="${y+24}" stroke="#00FFC3" stroke-opacity=".3" stroke-width="1"/>`;
        house.exteriors.forEach((ext,ei)=>{
          const ex=M+ei*(ew+GAP), ey=y+32, eh=FH-40;
          const devs=byRoom[ext]||[];
          s+=`\n<rect x="${ex}" y="${ey}" width="${ew}" height="${eh}" rx="12" fill="rgba(0,120,40,.25)" stroke="#00FFC3" stroke-opacity=".4" stroke-width="1"/>`;
          s+=`\n<text x="${ex+ew/2}" y="${ey+22}" text-anchor="middle" class="el">${ext.toUpperCase()}</text>`;
          s+=`\n<text x="${ex+ew/2}" y="${ey+38}" text-anchor="middle" class="rd">${devs.length} appareil${devs.length>1?"s":""}</text>`;
          devs.slice(0,8).forEach((dev,di)=>{
            const ico=DOMAIN_ICON[dev.entity_id.split(".")[0]]||"📦";
            s+=`\n<text x="${ex+20+(di%4)*30}" y="${ey+60+Math.floor(di/4)*28}" class="di">${ico}</text>`;
          });
        });
      }

      return s+"\n</svg>";
    }

    // ── STEP 3 ─────────────────────────────────────────────────────────────
    function Step3({ house, devices, onBack }) {
      const [svg, setSvg] = useState(null);
      const [dl, setDl] = useState({svg:false,json:false});

      const generate = () => { setSvg(buildSVG(house,devices)); setDl({svg:false,json:false}); };

      const download = (content, filename, type) => {
        const b=new Blob([content],{type}), u=URL.createObjectURL(b), a=document.createElement("a");
        a.href=u; a.download=filename; a.click();
      };

      const assigned=devices.filter(d=>d.room).length;
      const totalRooms=house.floors.reduce((s,f)=>s+f.rooms.filter(r=>r.name).length,0)+house.exteriors.length;

      return (
        <div>
          <p style={S.sub}>{totalRooms} pièces/zones · {assigned} appareils assignés</p>

          <div style={S.card}>
            {house.floors.map((f,fi)=>(
              <div key={fi} style={{marginBottom:12}}>
                <div style={{color:T.cyan,fontSize:13,fontFamily:T.fontMono,marginBottom:4}}>{f.name}</div>
                {f.rooms.filter(r=>r.name).map((r,ri)=>{
                  const dc=devices.filter(d=>d.room===r.name).length;
                  return <div key={ri} style={{...S.row,marginLeft:16,marginBottom:4}}>
                    <span style={{flex:1,fontSize:13}}>{r.name}</span>
                    <span style={S.badge(T.cyan)}>{dc} appareil{dc>1?"s":""}</span>
                  </div>;
                })}
              </div>
            ))}
            {house.exteriors.length>0 && (
              <div>
                <div style={{color:T.green,fontSize:13,fontFamily:T.fontMono,marginBottom:4}}>Extérieurs</div>
                {house.exteriors.map(e=>{
                  const dc=devices.filter(d=>d.room===e).length;
                  return <div key={e} style={{...S.row,marginLeft:16,marginBottom:4}}>
                    <span style={{flex:1,fontSize:13}}>{e}</span>
                    <span style={S.badge(T.green)}>{dc} appareil{dc>1?"s":""}</span>
                  </div>;
                })}
              </div>
            )}
          </div>

          <div style={{display:"flex",gap:12,marginBottom:20,flexWrap:"wrap"}}>
            <button style={S.btn()} onClick={generate}>⚡ Générer le plan SVG</button>
            {svg && <>
              <button style={S.btn()} onClick={()=>{download(svg,"floorplan.svg","image/svg+xml");setDl(d=>({...d,svg:true}));}}>
                ⬇ floorplan.svg {dl.svg&&"✓"}
              </button>
              <button style={S.btn("green")} onClick={()=>{
                download(JSON.stringify({generated:new Date().toISOString(),house,devices:devices.filter(d=>d.room)},null,2),"osvision_config.json","application/json");
                setDl(d=>({...d,json:true}));
              }}>
                ⬇ config.json {dl.json&&"✓"}
              </button>
            </>}
          </div>

          {svg && (
            <div style={{...S.card,padding:8,overflowX:"auto"}}>
              <div dangerouslySetInnerHTML={{__html:svg}}/>
            </div>
          )}

          {dl.svg && dl.json && (
            <div style={{...S.card,borderColor:T.green,background:"rgba(0,255,195,0.06)",marginTop:16}}>
              <p style={{color:T.green,margin:0,fontSize:14}}>
                ✓ Dépose <strong>floorplan.svg</strong> dans{" "}
                <code style={{color:T.cyan}}>/config/www/osvision_v2/images/</code>{" "}
                et recharge le dashboard OSVision.
              </p>
            </div>
          )}

          <div style={{marginTop:16}}>
            <button style={S.btn("secondary")} onClick={onBack}>← Retour</button>
          </div>
        </div>
      );
    }

    // ── TOKEN SCREEN ────────────────────────────────────────────────────────
    function TokenScreen({ onConfirm }) {
      const [t,setT] = useState(localStorage.getItem("osv_ha_token")||"");
      return (
        <div style={{maxWidth:480,margin:"80px auto"}}>
          <div style={S.card}>
            <h2 style={{...S.title,marginBottom:16}}>CONNEXION HA</h2>
            <p style={S.sub}>Crée un jeton longue durée dans <em>Profil → Jetons d'accès longue durée</em>.</p>
            <label style={S.label}>JETON D'ACCÈS</label>
            <input type="password" style={{...S.input,marginBottom:16}} value={t} onChange={e=>setT(e.target.value)} placeholder="eyJhbGciOi…"/>
            <button style={S.btn()} onClick={()=>{localStorage.setItem("osv_ha_token",t);onConfirm();}}>Connexion →</button>
          </div>
        </div>
      );
    }

    // ── APP ─────────────────────────────────────────────────────────────────
    function App() {
      const [hasToken, setHasToken] = useState(!!localStorage.getItem("osv_ha_token"));
      const [step, setStep] = useState(1);
      const [house, setHouse] = useState({ floors:[], exteriors:[] });
      const [devices, setDevices] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      const STEPS = ["Structure","Appareils","Plan SVG"];

      const fetchDevices = useCallback(async () => {
        setLoading(true); setError(null);
        try {
          const states = await haGet("states");
          const DOMAINS = ["light","switch","sensor","binary_sensor","climate","media_player","cover","camera","alarm_control_panel","vacuum","fan","lock"];
          setDevices(states
            .filter(s=>DOMAINS.includes(s.entity_id.split(".")[0]))
            .map(s=>({entity_id:s.entity_id,friendly_name:s.attributes?.friendly_name||s.entity_id,state:s.state,room:null}))
          );
          setStep(2);
        } catch(e) { setError(e.message); }
        finally { setLoading(false); }
      },[]);

      if (!hasToken) return <TokenScreen onConfirm={()=>setHasToken(true)}/>;

      return (
        <div style={S.page}>
          <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:32}}>
            <div style={{width:36,height:36,borderRadius:"50%",border:`2px solid ${T.cyan}`,display:"flex",alignItems:"center",justifyContent:"center",color:T.cyan,fontSize:18}}>⬡</div>
            <div>
              <h1 style={{...S.title,fontSize:18,margin:0}}>OSVISION V2</h1>
              <p style={{margin:0,color:T.textMute,fontSize:11,letterSpacing:1}}>DISCOVERY WIZARD</p>
            </div>
            <div style={{marginLeft:"auto",color:T.textMute,fontSize:11}}>{HA_URL}</div>
          </div>

          <div style={{display:"flex",gap:4,marginBottom:32}}>
            {STEPS.map((s,i)=>(
              <div key={i} style={{flex:1,marginRight:i<STEPS.length-1?4:0}}>
                <div style={S.stepDot(step===i+1,step>i+1)}/>
                <div style={{fontSize:10,color:step>=i+1?T.cyan:T.textMute,letterSpacing:1,marginTop:4,fontFamily:T.fontMono}}>
                  {i+1}. {s.toUpperCase()}
                </div>
              </div>
            ))}
          </div>

          {step===1 && <Step1 house={house} setHouse={setHouse} onNext={fetchDevices}/>}
          {step===2 && <Step2 house={house} devices={devices} setDevices={setDevices} loading={loading} error={error} onNext={()=>setStep(3)} onBack={()=>setStep(1)}/>}
          {step===3 && <Step3 house={house} devices={devices} onBack={()=>setStep(2)}/>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>

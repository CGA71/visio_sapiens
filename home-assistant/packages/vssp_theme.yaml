########################################################################
# Visio Sapiens — THEME package (design system editor)
#
# EN | Wires the THEME screen's graphical editor into Home Assistant. Same
# EN | shape as vssp_assign.yaml, applied to the visual charter instead of
# EN | device placement:
# EN |   the editor       -> webhook                (the new tokens)
# EN |   this package     -> design_system.yaml     (the decision, recorded)
# EN |   the generator    -> themes/visio_sapiens.yaml (the decision, rendered)
# EN |   frontend.reload_themes -> live, no dashboard regeneration needed
# FR | Branche l editeur graphique de l ecran THEME dans Home Assistant. Meme
# FR | forme que vssp_assign.yaml, appliquee a la charte graphique plutot
# FR | qu au placement des appareils :
# FR |   l editeur        -> webhook                (les nouveaux tokens)
# FR |   ce package       -> design_system.yaml     (la decision, enregistree)
# FR |   le generateur    -> themes/visio_sapiens.yaml (la decision, rendue)
# FR |   frontend.reload_themes -> a chaud, sans regeneration de dashboard
#
# EN | WHY NO DASHBOARD REGENERATION — every generated dashboard reads its
# EN | colors from the ACTIVE THEME (house.theme in house.yaml), never from a
# EN | copy of its own. Reloading the theme is therefore the entire dynamic
# EN | update: no lovelace.reload, no dashboard backup, none of the churn the
# EN | ENERGY/HOME/CORE buttons need.
# FR | POURQUOI AUCUNE REGENERATION DE DASHBOARD — chaque dashboard genere lit
# FR | ses couleurs depuis le THEME ACTIF (house.theme dans house.yaml),
# FR | jamais depuis une copie qui lui serait propre. Recharger le theme est
# FR | donc toute la mise a jour dynamique : pas de lovelace.reload, pas de
# FR | sauvegarde de dashboard, rien du remue-menage que demandent les
# FR | boutons ENERGY/HOME/CORE.
#
# EN | BEFORE DEPLOYING — check for duplicate keys, same as every package:
# FR | AVANT DE DEPLOYER — verifier les cles en double, comme pour tout package :
#
#   grep -n "vssp_theme" home-assistant/packages/*.yaml
#
# EN | Dependency on the pod: ruamel.yaml (already required by
# EN | vssp_assign_apply.py — nothing new to install if assign is deployed).
# FR | Dependance sur le pod : ruamel.yaml (deja requise par
# FR | vssp_assign_apply.py — rien de nouveau a installer si assign est deploye).
########################################################################

shell_command:
  # EN | Writes the submitted tokens into design_system.yaml. The payload
  # EN | arrives base64 encoded — same reasoning as vssp_assign_apply: colors
  # EN | and rgba() values could break shell quoting raw.
  # FR | Ecrit les tokens soumis dans design_system.yaml. Le payload arrive
  # FR | encode en base64 — meme raisonnement que vssp_assign_apply : les
  # FR | couleurs et valeurs rgba() pourraient casser le quoting shell brutes.
  # EN | --logo-dir: where a nav logo sent from the editor is stored —
  # EN | outside www/vssp/, which every deploy replaces wholesale.
  # FR | --logo-dir : ou est range un logo de nav envoye depuis l'editeur —
  # FR | hors de www/vssp/, que chaque deploiement remplace en bloc.
  vssp_theme_apply: >-
    python3 /config/vssp/vssp_theme_apply.py
    --model /config/dashboards/model/design_system.yaml
    --json-b64 "{{ content_b64 }}"
    --logo-dir /config/www/vssp_user
    --status-file /config/www/vssp/theme_status.json

  # EN | Targeted backup of the deployed theme file alone, before it is
  # EN | overwritten — same convention as vssp_backup_energy.
  # FR | Sauvegarde ciblee du seul fichier de theme deploye, avant qu il ne
  # FR | soit ecrase — meme convention que vssp_backup_energy.
  vssp_backup_theme: >-
    sh -c "mkdir -p /config/vssp/backups &&
    [ -f /config/themes/visio_sapiens.yaml ] &&
    cp /config/themes/visio_sapiens.yaml
    /config/vssp/backups/theme_$(date +%Y%m%d_%H%M%S).yaml || true"

  # EN | Renders ONLY the theme (--only theme): fast, and it never touches
  # EN | dashboards/views/ — see the note above on why that is enough.
  # FR | Rend UNIQUEMENT le theme (--only theme) : rapide, et cela ne touche
  # FR | jamais dashboards/views/ — voir la remarque ci-dessus sur pourquoi
  # FR | cela suffit.
  vssp_generate_theme: >-
    python3 /config/vssp/generate_dashboards.py
    --only theme
    --model /config/dashboards/model/house.yaml
    --design-model /config/dashboards/model/design_system.yaml
    --templates /config/dashboards/templates_j2
    --locales-dir /config/dashboards/locales
    --locale {{ states('input_select.vssp_language') }}
    --themes-out /config/themes
    --design-status-file /config/www/vssp/design_system_status.json
    --status-file /config/www/vssp/theme_generate_status.json

  # EN | RESTORE REFERENCE button: rebuilds the payload from the frozen
  # EN | design_system.default.yaml instead of a webhook submission, then
  # EN | goes through the exact same validate/backup/write code as a real
  # EN | editor APPLY (see reference_payload() in vssp_theme_apply.py).
  # EN | design_system.default.yaml itself always ships with the repository
  # EN | — see the comment in .gitlab-ci.yml's preserved-pod-state list.
  # FR | Bouton RESTAURER LA REFERENCE : reconstruit le payload depuis le
  # FR | design_system.default.yaml fige plutot que depuis une soumission
  # FR | webhook, puis passe par exactement le meme code
  # FR | validation/sauvegarde/ecriture qu'un vrai APPLIQUER de l'editeur
  # FR | (voir reference_payload() dans vssp_theme_apply.py).
  # FR | design_system.default.yaml part toujours avec le depot lui-meme —
  # FR | voir le commentaire de la liste « etat pod preserve » dans
  # FR | .gitlab-ci.yml.
  vssp_theme_restore_reference: >-
    python3 /config/vssp/vssp_theme_apply.py
    --model /config/dashboards/model/design_system.yaml
    --restore-reference /config/dashboards/model/design_system.default.yaml
    --logo-dir /config/www/vssp_user
    --status-file /config/www/vssp/theme_status.json

# --------------------------------------------------------------------
# EN | WEBHOOK — how the editor talks back to Home Assistant
# FR | WEBHOOK — comment l editeur parle a Home Assistant
# --------------------------------------------------------------------
# EN | Same reasoning as vssp_assign.yaml's webhook: the editor runs in an
# EN | iframe, so it cannot reach the parent `hass` object, and a long-lived
# EN | REST token has no business sitting in a browser for this. A webhook
# EN | needs none; `local_only: true` keeps it on the LAN.
# FR | Meme raisonnement que le webhook de vssp_assign.yaml : l editeur tourne
# FR | dans une iframe, il ne peut donc pas atteindre l objet `hass` parent,
# FR | et un jeton REST longue duree n a rien a faire dans un navigateur pour
# FR | cela. Un webhook n en a besoin d aucun ; `local_only: true` le
# FR | maintient sur le reseau local.
automation:
  # EN | WHY THIS EXISTS. The theme file is generated by every deploy and
  # EN | Home Assistant loads it - `frontend/get_themes` lists "Visio
  # EN | Sapiens" on a freshly deployed instance. What no deploy did was
  # EN | SELECT it: the selection is a preference, not configuration, and on
  # EN | the development pod it lives in
  # EN | .storage/frontend.user_data_<user>, set by hand months ago and
  # EN | never noticed since.
  # EN | Measured on the appliance staging, first deploy onto a virgin Home
  # EN | Assistant OS: default_theme was "default". Every dashboard rendered
  # EN | unstyled - the cards were all there, the navigation rail and the
  # EN | header simply had no colours, no fonts and no layout tokens, which
  # EN | reads as "the interface is missing".
  # EN | frontend.set_theme sets the BACKEND-selected theme, which is what a
  # EN | new account follows. A user who picks another theme in their own
  # EN | profile still wins - this sets the default, it does not impose.
  # FR | POURQUOI CECI EXISTE. Le fichier de theme est genere par chaque
  # FR | deploiement et Home Assistant le charge - `frontend/get_themes`
  # FR | annonce bien « Visio Sapiens » sur une instance fraichement
  # FR | deployee. Ce qu aucun deploiement ne faisait, c est le
  # FR | SELECTIONNER : la selection est une preference, pas une
  # FR | configuration, et sur le pod de developpement elle vit dans
  # FR | .storage/frontend.user_data_<utilisateur>, posee a la main il y a
  # FR | des mois et oubliee depuis.
  # FR | Mesure sur la preproduction appareil, premier deploiement sur un
  # FR | Home Assistant OS vierge : default_theme valait « default ». Tous
  # FR | les tableaux de bord s affichaient sans style - les cartes etaient
  # FR | pourtant la, le bandeau de navigation et l en-tete n avaient
  # FR | simplement ni couleurs, ni polices, ni jetons de mise en page, ce
  # FR | qui se lit comme « l interface manque ».
  # FR | frontend.set_theme pose le theme choisi COTE SERVEUR, celui que
  # FR | suit un compte neuf. Un utilisateur qui en choisit un autre dans
  # FR | son profil garde le sien - ceci pose le defaut, il n impose rien.
  - alias: "Visio Sapiens - Select the theme on start"
    id: vssp_select_theme_on_start
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      # EN | continue_on_error: an instance whose theme file has not been
      # EN | generated yet must still finish starting.
      # FR | continue_on_error : une instance dont le theme n a pas encore
      # FR | ete genere doit quand meme finir de demarrer.
      - action: frontend.set_theme
        continue_on_error: true
        data:
          name: "Visio Sapiens"

  # EN | mode: queued (not single) — same fix as vssp_rooms.yaml's
  # EN | "Receive room structure sync" (see its comment for the full
  # EN | writeup): a webhook automation with mode: single silently DROPS a
  # EN | trigger that arrives while a previous run is still executing
  # EN | (script_execution: "failed_single" in the trace), yet the webhook
  # EN | endpoint itself still answers 200, so the browser shows its normal
  # EN | success notice regardless of whether this automation actually ran.
  # EN | Any client that can fire this webhook from more than one call site
  # EN | close together is exposed to a real edit being silently discarded
  # EN | in favor of whichever request happened to win the race. queued
  # EN | (max: 10) processes every trigger in order instead of dropping any.
  # FR | mode: queued (pas single) — meme correctif que « Receive room
  # FR | structure sync » de vssp_rooms.yaml (voir son commentaire pour
  # FR | l explication complete) : une automatisation webhook en mode:
  # FR | single REJETTE en silence un declenchement arrivant pendant qu une
  # FR | execution precedente tourne encore (script_execution:
  # FR | « failed_single » dans la trace), pourtant le point d entree
  # FR | webhook lui-meme repond quand meme 200, donc le navigateur affiche
  # FR | son avis de succes habituel que cette automatisation ait
  # FR | reellement tourne ou non. Tout client capable de declencher ce
  # FR | webhook depuis plus d un point d appel rapproche s expose a voir
  # FR | une vraie modification ecrasee en silence au profit de la requete
  # FR | qui a gagne la course. queued (max: 10) traite chaque
  # FR | declenchement dans l ordre au lieu d en rejeter aucun.
  - alias: "Visio Sapiens — Receive design system update"
    id: vssp_receive_theme
    mode: queued
    max: 10
    triggers:
      - trigger: webhook
        webhook_id: vssp_theme
        local_only: true
        allowed_methods:
          - POST
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.json.content_b64 is defined }}"
            sequence:
              - action: shell_command.vssp_theme_apply
                data:
                  content_b64: "{{ trigger.json.content_b64 }}"
                response_variable: applied
              # EN | Only regenerate/reload when the write actually happened.
              # EN | Same reasoning as vssp_assign: reloading after a rejected
              # EN | payload would reload the unchanged theme and look exactly
              # EN | like success.
              # FR | Ne regenerer/recharger que si l ecriture a reellement eu
              # FR | lieu. Meme raisonnement que vssp_assign : recharger apres
              # FR | un payload refuse rechargerait le theme inchange et
              # FR | ressemblerait exactement a un succes.
              - if:
                  - condition: template
                    value_template: "{{ applied.returncode == 0 }}"
                then:
                  - action: shell_command.vssp_backup_theme
                  - action: shell_command.vssp_generate_theme
                  - action: frontend.reload_themes
                  - action: persistent_notification.create
                    data:
                      title: "Visio Sapiens — Design system updated"
                      message: >
                        Theme reloaded live — no dashboard regeneration was
                        needed. If a color still looks off, hard-refresh the
                        tab (Ctrl+Shift+R).
                else:
                  - action: persistent_notification.create
                    data:
                      title: "Visio Sapiens — Design system update refused"
                      message: >
                        The submitted tokens were rejected and NOTHING was
                        written. See /local/vssp/theme_status.json for the
                        reason — usually an invalid color or an out-of-range
                        radius.
        default:
          - action: persistent_notification.create
            data:
              title: "Visio Sapiens — Malformed design system update"
              message: >
                The webhook received a payload without content_b64.
                Nothing was written.

# --------------------------------------------------------------------
# EN | RESTORE REFERENCE — script behind the THEME screen's native button.
# EN | No webhook: unlike a color submission, this needs no data from the
# EN | browser, so it is a plain script + button (confirmation: text),
# EN | same pattern as REGENERATE HOME/ENERGY in system_dashboards.yaml.
# FR | RESTAURER LA REFERENCE — script derriere le bouton natif de l'ecran
# FR | THEME. Pas de webhook : contrairement a une soumission de couleur,
# FR | cela n'a besoin d'aucune donnee du navigateur, donc un simple script
# FR | + bouton (texte confirmation:), meme patron que REGENERER
# FR | HOME/ENERGY dans system_dashboards.yaml.
# --------------------------------------------------------------------
script:
  vssp_restore_theme_reference:
    alias: "Visio Sapiens — Restore the reference design system"
    sequence:
      - action: shell_command.vssp_theme_restore_reference
        response_variable: restored
      - if:
          - condition: template
            value_template: "{{ restored.returncode == 0 }}"
        then:
          - action: shell_command.vssp_backup_theme
          - action: shell_command.vssp_generate_theme
          - action: frontend.reload_themes
          - action: persistent_notification.create
            data:
              title: "Visio Sapiens — Design system restored"
              message: >
                design_system.yaml reset to the factory reference and theme
                reloaded live. A backup of the previous design_system.yaml
                is in dashboards/model/backups/, and the previous rendered
                theme in /config/vssp/backups/.
        else:
          - action: persistent_notification.create
            data:
              title: "Visio Sapiens — Restore failed"
              message: >
                See /local/vssp/theme_status.json for the reason. Nothing
                was written.

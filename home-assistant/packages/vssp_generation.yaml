########################################################################
# Visio Sapiens — GENERATION package
#
# EN | WHY THIS FILE EXISTS
# EN | The ADMIN console's GENERATION panel references the entities below
# EN | (language/format/chatbot selectors, diagnostic sensors, the
# EN | auto-regenerate toggle and its interval). They were written into
# EN | vssp/vssp_admin_config.yaml, which is a REFERENCE file: Home
# EN | Assistant never loads it. What HA loads is this directory, through
# EN | `homeassistant: packages: !include_dir_named packages` in
# EN | config-fragment.yaml. Anything the dashboards reference must therefore
# EN | live in home-assistant/packages/, not in vssp/.
# EN | Symptom when it does not: "Entity not found" cards, with no error in
# EN | the logs — the dashboard renders fine, it just points at nothing.
# FR | POURQUOI CE FICHIER EXISTE
# FR | Le panneau GENERATION de la console ADMIN reference les entites
# FR | ci-dessous (selecteurs langue/format/chatbot, capteurs de diagnostic,
# FR | interrupteur de regeneration automatique et son intervalle). Elles
# FR | etaient ecrites dans vssp/vssp_admin_config.yaml, qui est un fichier
# FR | de REFERENCE : Home Assistant ne le charge jamais. Ce que HA charge,
# FR | c'est ce repertoire, via
# FR | `homeassistant: packages: !include_dir_named packages` dans
# FR | config-fragment.yaml. Tout ce que les dashboards referencent doit donc
# FR | vivre dans home-assistant/packages/, pas dans vssp/.
# FR | Symptome sinon : des cartes « Entite non trouvee », sans erreur dans
# FR | les logs — le dashboard s'affiche tres bien, il pointe juste vers rien.
#
# EN | BEFORE DEPLOYING — check for duplicate keys. Home Assistant refuses to
# EN | start when two packages define the same key. If packages/vssp_admin.yaml
# EN | already declares any of the names below, keep ONE of the two:
# FR | AVANT DE DEPLOYER — verifier les cles en double. Home Assistant refuse
# FR | de demarrer quand deux packages definissent la meme cle. Si
# FR | packages/vssp_admin.yaml declare deja l'un des noms ci-dessous, n'en
# FR | garder QU'UN des deux :
#
#   grep -n "vssp_language\|vssp_format\|vssp_chatbot_provider\|\
# vssp_auto_regenerate\|vssp_render_fragment\|vssp_apply_fragment\|\
# vssp_apply_language" home-assistant/packages/*.yaml
########################################################################

# ----------------------------------------------------------------------
# EN | THE TWO SELECTORS THAT DRIVE EVERY GENERATED DASHBOARD
# FR | LES DEUX SELECTEURS QUI PILOTENT TOUS LES DASHBOARDS GENERES
# ----------------------------------------------------------------------
# EN | CRITICAL — the option VALUES stay in English in every language. They
# EN | are identifiers passed on a command line to generate_dashboards.py,
# EN | not labels. Only the displayed name is translated, by the card that
# EN | renders the selector.
# FR | CRITIQUE — les VALEURS d'options restent en anglais dans toutes les
# FR | langues. Ce sont des identifiants passes en ligne de commande a
# FR | generate_dashboards.py, pas des libelles. Seul le nom affiche est
# FR | traduit, par la carte qui rend le selecteur.
input_select:
  vssp_language:
    name: "Visio Sapiens — Interface language"
    options:
      - en
      - fr
    initial: en
    icon: mdi:translate

  vssp_format:
    name: "Visio Sapiens — Target format"
    options:
      - tablet
      - mobile
      - both
    initial: tablet
    icon: mdi:tablet-cellphone

  # EN | Drives the real chatbot backend (packages/vssp_chatbot.yaml,
  # EN | vssp/vssp_chatbot_send.py). The HOME chatbot card (home.yaml.j2,
  # EN | "Cadre 2 — Chatbot") reads this value to know which provider's
  # EN | popup to open. "custom" additionally opens a config popup — see
  # EN | script.vssp_open_chatbot_custom_popup.
  # FR | Pilote le vrai backend chatbot (packages/vssp_chatbot.yaml,
  # FR | vssp/vssp_chatbot_send.py). La carte Chatbot de HOME
  # FR | (home.yaml.j2, « Cadre 2 — Chatbot ») lit cette valeur pour savoir
  # FR | quel popup fournisseur ouvrir. « custom » ouvre en plus un popup
  # FR | de configuration — voir script.vssp_open_chatbot_custom_popup.
  vssp_chatbot_provider:
    name: "Visio Sapiens — Chatbot provider"
    options:
      - gemini
      - claude
      - chatgpt
      - custom
    initial: claude
    icon: mdi:chat-processing-outline

# ----------------------------------------------------------------------
# EN | AUTO-REGENERATE — toggle + adjustable interval
# FR | REGENERATION AUTOMATIQUE — interrupteur + intervalle ajustable
# ----------------------------------------------------------------------
# EN | Off by default: unattended regeneration is a real risk for anyone
# EN | who hand-edits a dashboard between two runs (exactly why HOME is
# EN | --protect-existing in the first place — see vssp_admin.yaml). Runs
# EN | the same script.vssp_run_generate as the manual REGENERER TOUT
# EN | button below, so it inherits that same protection: HOME is never
# EN | touched by this automation either.
# FR | Desactive par defaut : une regeneration sans surveillance est un
# FR | vrai risque pour qui modifie un dashboard a la main entre deux
# FR | passages (exactement pourquoi HOME est --protect-existing — voir
# FR | vssp_admin.yaml). Lance le meme script.vssp_run_generate que le
# FR | bouton manuel REGENERER TOUT ci-dessous, donc herite de la meme
# FR | protection : HOME n'est jamais touche par cette automatisation non
# FR | plus.
input_boolean:
  vssp_auto_regenerate:
    name: "Visio Sapiens — Auto-regenerate"
    icon: mdi:refresh-auto

input_number:
  vssp_auto_regenerate_interval_hours:
    name: "Visio Sapiens — Auto-regenerate interval (hours)"
    min: 1
    max: 168
    step: 1
    initial: 24
    icon: mdi:timer-cog-outline

input_datetime:
  # EN | Not shown on the admin screen — internal bookkeeping only, so the
  # EN | automation below can tell "due" from "already ran recently"
  # EN | without a dedicated scheduler integration.
  # FR | Non affiche sur l'ecran admin — comptabilite interne uniquement,
  # FR | pour que l'automatisation ci-dessous distingue « du » de « deja
  # FR | lance recemment » sans integration de planification dediee.
  vssp_auto_regenerate_last_run:
    name: "Visio Sapiens — Auto-regenerate last run"
    has_date: true
    has_time: true

automation:
  - id: vssp_auto_regenerate
    alias: "Visio Sapiens — Auto-regenerate dashboards"
    mode: single
    triggers:
      # EN | Polls every 15 min; the condition below is what actually
      # EN | gates it to the configured interval (default 24h). Coarser
      # EN | than the interval itself so a change to the input_number
      # EN | takes effect within 15 min instead of waiting a full cycle.
      # FR | Sonde toutes les 15 min ; la condition ci-dessous est ce qui
      # FR | verrouille reellement sur l'intervalle configure (24h par
      # FR | defaut). Plus fin que l'intervalle lui-meme pour qu'un
      # FR | changement de l'input_number prenne effet sous 15 min plutot
      # FR | que d'attendre un cycle complet.
      - trigger: time_pattern
        minutes: "/15"
    conditions:
      - condition: state
        entity_id: input_boolean.vssp_auto_regenerate
        state: "on"
      - condition: template
        # EN | "unknown" (never run yet) counts as due.
        # FR | « unknown » (jamais lance) compte comme du.
        value_template: >-
          {% set last = states('input_datetime.vssp_auto_regenerate_last_run') %}
          {{ last in ['unknown', 'unavailable'] or
             (now() - (last | as_datetime | as_local)).total_seconds()
             >= (states('input_number.vssp_auto_regenerate_interval_hours') | float(24) * 3600) }}
    actions:
      - action: script.vssp_run_generate
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.vssp_auto_regenerate_last_run
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

# ----------------------------------------------------------------------
# EN | DIAGNOSTIC SENSORS
# FR | CAPTEURS DE DIAGNOSTIC
# ----------------------------------------------------------------------
command_line:
  # EN | The language actually deployed, written by the CI build into
  # EN | /config/VSSP_LOCALE. When it differs from input_select.vssp_language,
  # EN | a regeneration is pending — that gap is the whole point of showing it.
  # FR | La langue reellement deployee, ecrite par le build CI dans
  # FR | /config/VSSP_LOCALE. Quand elle differe de
  # FR | input_select.vssp_language, une regeneration est en attente — cet
  # FR | ecart est tout l'interet de l'afficher.
  - sensor:
      name: "VSSP Deployed Locale"
      unique_id: vssp_deployed_locale
      command: >-
        cat /config/VSSP_LOCALE 2>/dev/null || echo "unknown"
      scan_interval: 300

  # EN | The version actually deployed, from /config/VSSP_VERSION which the
  # EN | build writes. It reads "v1.0.14" on production (the tag) and
  # EN | "dev-a3ec8c0d" on staging (the branch build), so the rail that shows
  # EN | it also says which of the two instances you are looking at - a
  # EN | question this project asks constantly and answered until now only by
  # EN | reading the URL.
  # EN | `grep .` is what turns an empty result into "unknown": sed prints
  # EN | nothing and still exits 0 when the file is missing, so `|| echo`
  # EN | alone would never fire and the sensor would sit unavailable with no
  # EN | explanation.
  # FR | La version reellement deployee, depuis /config/VSSP_VERSION que le
  # FR | build ecrit. Elle vaut « v1.0.14 » en production (le tag) et
  # FR | « dev-a3ec8c0d » en preproduction (le build de branche), donc le
  # FR | bandeau qui l'affiche dit aussi laquelle des deux instances on
  # FR | regarde - une question que ce projet se pose sans cesse et a
  # FR | laquelle on ne repondait jusqu'ici qu'en lisant l'URL.
  # FR | `grep .` est ce qui transforme un resultat vide en « unknown » : sed
  # FR | n'affiche rien et sort quand meme en 0 quand le fichier manque, donc
  # FR | `|| echo` seul ne se declencherait jamais et le capteur resterait
  # FR | indisponible sans explication.
  - sensor:
      name: "VSSP Deployed Version"
      unique_id: vssp_deployed_version
      command: >-
        sed -n 's/^version=//p' /config/VSSP_VERSION 2>/dev/null
        | head -1 | grep . || echo "unknown"
      scan_interval: 300

  # EN | Counts unrendered translation markers left in the deployed fragment.
  # EN | Anything above 0 means the fragment reached /config without passing
  # EN | through vssp_i18n.py, and vssp_apply_config.py will refuse it.
  # EN | Surfacing the number turns a silent failure into a visible one.
  # FR | Compte les marqueurs de traduction non rendus restant dans le
  # FR | fragment deploye. Toute valeur superieure a 0 signifie que le fragment
  # FR | est arrive dans /config sans passer par vssp_i18n.py, et
  # FR | vssp_apply_config.py le refusera. Afficher ce nombre transforme une
  # FR | panne silencieuse en panne visible.
  - sensor:
      name: "VSSP Unrendered Placeholders"
      unique_id: vssp_unrendered_placeholders
      # EN | awk, not grep. `grep -c` prints its count AND exits 1 when it
      # EN | finds nothing, so `grep -c ... || echo 0` emits "0" twice in the
      # EN | normal case — two lines, which Home Assistant rejects, leaving the
      # EN | sensor permanently unavailable. The guard meant to make a silent
      # EN | failure visible was itself silently failing.
      # EN | awk always exits 0 and prints one number, and gsub counts
      # EN | occurrences rather than matching lines.
      # FR | awk, pas grep. `grep -c` affiche son compte ET sort en code 1
      # FR | quand il ne trouve rien, donc `grep -c ... || echo 0` emet « 0 »
      # FR | deux fois dans le cas normal — deux lignes, que Home Assistant
      # FR | rejette, laissant le capteur indisponible en permanence. Le
      # FR | garde-fou cense rendre visible une panne silencieuse echouait
      # FR | lui-meme en silence.
      # FR | awk sort toujours en code 0 et affiche un seul nombre, et gsub
      # FR | compte les occurrences plutot que les lignes correspondantes.
      command: >-
        awk '{ n += gsub(/__T:[A-Za-z0-9_.]+__/, "") } END { print n + 0 }'
        /config/config-fragment.yaml 2>/dev/null || echo 0
      unit_of_measurement: "markers"
      scan_interval: 300

# ----------------------------------------------------------------------
# EN | LANGUAGE CHAIN — render, then patch
# FR | CHAINE DE LANGUE — rendre, puis patcher
# ----------------------------------------------------------------------
# EN | Order matters: vssp_apply_config.py REFUSES a fragment that still holds
# EN | __T: markers, so a failed render stops the chain instead of pushing raw
# EN | markers into the Home Assistant sidebar.
# EN | Paths are /config-relative: the deploy job unpacks
# EN | home-assistant/dashboards/ to /config/dashboards/, because /config IS
# EN | the Home Assistant configuration root.
# FR | L'ordre compte : vssp_apply_config.py REFUSE un fragment contenant
# FR | encore des marqueurs __T:, donc un rendu en echec arrete la chaine au
# FR | lieu de pousser des marqueurs bruts dans la barre laterale.
# FR | Les chemins sont relatifs a /config : le job de deploiement deballe
# FR | home-assistant/dashboards/ vers /config/dashboards/, car /config EST la
# FR | racine de configuration de Home Assistant.
shell_command:
  vssp_render_fragment: >-
    python3 /config/vssp/vssp_i18n.py
    --locales-dir /config/dashboards/locales
    render --locale {{ states('input_select.vssp_language') }}
    --in /config/config-fragment.yaml
    --out /config/vssp/config-fragment.rendered.yaml

  vssp_apply_fragment: >-
    python3 /config/vssp/vssp_apply_config.py
    --config /config/configuration.yaml
    --fragment /config/vssp/config-fragment.rendered.yaml
    /config/config-fragment-rooms.yaml
    --prune-dashboards

script:
  # EN | Dashboard titles in the sidebar are read from configuration.yaml at
  # EN | startup only, hence the restart prompt in the message. The dashboard
  # EN | CONTENT, on the other hand, is re-read on its own next display — no
  # EN | `lovelace.reload` service exists in Home Assistant to force it.
  # FR | Les titres de dashboards dans la barre laterale sont lus depuis
  # FR | configuration.yaml uniquement au demarrage, d'ou l'invitation a
  # FR | redemarrer dans le message. Le CONTENU des dashboards, lui, est relu
  # FR | tout seul au prochain affichage — il n'existe pas de service
  # FR | `lovelace.reload` dans Home Assistant pour le forcer.
  vssp_apply_language:
    alias: "Visio Sapiens — Apply the interface language"
    sequence:
      - service: shell_command.vssp_render_fragment
      - service: shell_command.vssp_apply_fragment
      - service: shell_command.vssp_generate_dashboards
      - service: persistent_notification.create
        data:
          title: "Visio Sapiens — Language applied"
          message: >
            Interface generated in
            {{ states('input_select.vssp_language') }},
            format {{ states('input_select.vssp_format') }}.
            Dashboard titles in the sidebar are only re-read at startup:
            restart Home Assistant to see them change.

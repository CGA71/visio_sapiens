########################################################################
# Visio Sapiens — UPDATES package (pending updates, grouped)
#
# EN | Home Assistant already knows every pending update: each one is an
# EN | `update.*` entity carrying installed_version, latest_version, its
# EN | release notes and an install service. Settings > Updates shows them,
# EN | but only there, and only mixed in with everything else that screen
# EN | does.
# EN | This package adds no data source whatsoever. It reads the entities
# EN | that already exist and publishes ONE thing the ADMIN console cannot
# EN | compute on its own: the SPLIT into three families, and the entity
# EN | list of each. A Lovelace card cannot work out which update belongs
# EN | to HACS — `integration_entities()` is a template function, it exists
# EN | on the Python side only. So the classification happens here, in
# EN | Jinja, and travels to the card as an `entity_ids` attribute the card
# EN | merely renders.
# EN | THE THREE FAMILIES, in the order they matter:
# EN |   system    Home Assistant itself, the Supervisor, the OS, add-ons.
# EN |             Anything that is neither HACS nor firmware. On this k3s
# EN |             instance that is the NAS; on a HAOS production instance
# EN |             it is Core and the add-ons, with no change to this file.
# EN |   hacs      integrations and Lovelace cards installed through HACS.
# EN |             Cheap, reversible, and the only family this package will
# EN |             install in bulk.
# EN |   firmware  device_class: firmware — the flash of a physical thing
# EN |             that can brick it. One at a time, from its own row, and
# EN |             deliberately never in bulk.
# FR | Home Assistant connait deja chaque mise a jour en attente : chacune
# FR | est une entite `update.*` qui porte installed_version,
# FR | latest_version, ses notes de version et un service d installation.
# FR | Reglages > Mises a jour les montre, mais la seulement, et melangees
# FR | a tout le reste de ce que fait cet ecran.
# FR | Ce package n ajoute aucune source de donnees. Il lit les entites qui
# FR | existent deja et publie UNE chose que la console ADMIN ne peut pas
# FR | calculer seule : la REPARTITION en trois familles, et la liste
# FR | d entites de chacune. Une carte Lovelace ne peut pas deviner quelle
# FR | mise a jour appartient a HACS — `integration_entities()` est une
# FR | fonction de template, elle n existe que du cote Python. La
# FR | classification se fait donc ici, en Jinja, et voyage vers la carte
# FR | en attribut `entity_ids` que la carte se contente d afficher.
# FR | LES TROIS FAMILLES, dans l ordre ou elles comptent :
# FR |   system    Home Assistant lui-meme, le Supervisor, l OS, les
# FR |             add-ons. Tout ce qui n est ni HACS ni micrologiciel. Sur
# FR |             cette instance k3s c est le NAS ; sur une instance HAOS
# FR |             de production ce sera Core et les add-ons, sans changer
# FR |             une ligne de ce fichier.
# FR |   hacs      integrations et cartes Lovelace installees via HACS. Peu
# FR |             couteuses, reversibles, et la seule famille que ce
# FR |             package installera en masse.
# FR |   firmware  device_class: firmware — le flash d un objet physique,
# FR |             qui peut le briquer. Une a la fois, depuis sa propre
# FR |             ligne, et deliberement jamais en masse.
#
# EN | BEFORE DEPLOYING — check for duplicate keys, same as every other
# EN | package here:
# FR | AVANT DE DEPLOYER — verifier les cles en double, comme pour tout
# FR | autre package ici :
#
#   grep -n "vssp_updates" home-assistant/packages/*.yaml
#
# EN | THE AUTOMATIC PASS is an OPTION, and it is off. Nothing in this
# EN | file installs anything on its own until someone turns on
# EN | input_boolean.vssp_updates_auto from the ADMIN screen. With the
# EN | switch off the automation stays loaded and does nothing: it is a
# EN | condition, not a second trigger, so turning it back on later does
# EN | not replay the nights it sat out.
# EN | The pass installs every pending update EXCEPT Home Assistant Core,
# EN | which is excluded in the sensor that feeds it rather than in the
# EN | automation — see `VSSP Updates auto` below for why that placement is
# EN | the point rather than a detail.
# FR | LA PASSE AUTOMATIQUE est une OPTION, et elle est eteinte. Rien dans
# FR | ce fichier n installe quoi que ce soit de lui-meme tant que
# FR | quelqu un n a pas active input_boolean.vssp_updates_auto depuis
# FR | l ecran ADMIN. Interrupteur ferme, l automatisation reste chargee et
# FR | ne fait rien : c est une condition, pas un second declencheur, donc
# FR | la rallumer plus tard ne rejoue pas les nuits qu elle a passees a
# FR | l arret.
# FR | La passe installe toutes les mises a jour en attente SAUF Home
# FR | Assistant Core, exclu dans le capteur qui l alimente plutot que dans
# FR | l automatisation — voir `VSSP Updates auto` plus bas pour pourquoi ce
# FR | placement est l essentiel et non un detail.
#
# EN | NO PREREQUISITE. Nothing here needs a secret, a token or a network
# EN | call. On an instance with no HACS, `integration_entities('hacs')`
# EN | returns an empty list and the HACS family is simply always zero.
# FR | AUCUN PREREQUIS. Rien ici n a besoin d un secret, d un token ni d un
# FR | appel reseau. Sur une instance sans HACS,
# FR | `integration_entities('hacs')` renvoie une liste vide et la famille
# FR | HACS reste simplement a zero.
########################################################################

# ═══════════════════════════════════════════════════════════════════════
# EN | SENSORS — five counts, five entity lists
# FR | CAPTEURS — cinq decomptes, cinq listes d entites
# ═══════════════════════════════════════════════════════════════════════
#
# EN | NO unit_of_measurement, on purpose. The vault sensors carry a French
# EN | one because they predate this rule; a unit lives inside the entity
# EN | and would print "3 entrees" on an English dashboard, next to a row
# EN | label the generator HAS translated. The number stays bare and the
# EN | console names it in whatever language it was generated in.
# FR | PAS d unit_of_measurement, a dessein. Les capteurs du coffre en
# FR | portent une en francais parce qu ils precedent cette regle ; une
# FR | unite vit dans l entite et afficherait « 3 entrees » sur un
# FR | dashboard anglais, a cote d un libelle de ligne que le generateur,
# FR | lui, A traduit. Le nombre reste nu et la console le nomme dans la
# FR | langue ou elle a ete generee.
#
# EN | `sort(attribute='name')` so the rows come out alphabetically rather
# EN | than in the arbitrary order the state machine holds them — this list
# EN | is read by a human looking for one line in it.
# FR | `sort(attribute='name')` pour que les lignes sortent par ordre
# FR | alphabetique plutot que dans l ordre arbitraire de la machine
# FR | d etats — cette liste est lue par un humain qui y cherche une ligne.
#
# EN | `selectattr('attributes.device_class', 'defined')` BEFORE testing its
# EN | value: HACS entities carry no device_class at all, and filtering an
# EN | undefined attribute by equality is the kind of thing that works
# EN | until a Jinja version decides it should raise.
# FR | `selectattr('attributes.device_class', 'defined')` AVANT d en tester
# FR | la valeur : les entites HACS n ont pas de device_class du tout, et
# FR | filtrer un attribut indefini par egalite est le genre de chose qui
# FR | marche jusqu au jour ou une version de Jinja decide de lever.
template:
  - sensor:
      # ---------------------------------------------------------------
      # EN | TOTAL — every pending update, all families together.
      # FR | TOTAL — toutes les mises a jour en attente, familles reunies.
      # ---------------------------------------------------------------
      # EN | An update that has been SKIPPED does not count, and that needs
      # EN | no filter here: Home Assistant reports such an entity as `off`
      # EN | for as long as the skipped version is the latest one. Skipping
      # EN | from a row therefore empties this screen the way installing
      # EN | does, which is the point of offering it.
      # FR | Une mise a jour IGNOREE ne compte pas, et cela ne demande
      # FR | aucun filtre ici : Home Assistant rapporte une telle entite a
      # FR | `off` tant que la version ignoree reste la derniere. Ignorer
      # FR | depuis une ligne vide donc cet ecran comme le fait
      # FR | l installation, ce qui est tout l interet de le proposer.
      - name: VSSP Updates pending
        unique_id: vssp_updates_pending
        icon: mdi:package-up
        state: >-
          {{ states.update | selectattr('state', 'eq', 'on') | list | count }}
        attributes:
          entity_ids: >-
            {{ states.update | selectattr('state', 'eq', 'on')
               | sort(attribute='name') | map(attribute='entity_id') | list }}

      # ---------------------------------------------------------------
      # EN | SYSTEM — Home Assistant, the Supervisor, the OS, add-ons.
      # FR | SYSTEME — Home Assistant, le Supervisor, l OS, les add-ons.
      # ---------------------------------------------------------------
      # EN | Defined by SUBTRACTION rather than by a list of integrations,
      # EN | so it stays right on an instance this repository has never
      # EN | seen. Anything that is not a HACS package and not a firmware
      # EN | flash is, by elimination, the platform itself.
      # FR | Definie par SOUSTRACTION plutot que par une liste
      # FR | d integrations, pour rester juste sur une instance que ce
      # FR | depot n a jamais vue. Tout ce qui n est ni un paquet HACS ni un
      # FR | flash de micrologiciel est, par elimination, la plateforme
      # FR | elle-meme.
      - name: VSSP Updates system
        unique_id: vssp_updates_system
        icon: mdi:home-assistant
        state: >-
          {% set hacs = integration_entities('hacs') %}
          {% set pending = states.update | selectattr('state', 'eq', 'on')
               | sort(attribute='name') | list %}
          {% set firmware = pending
               | selectattr('attributes.device_class', 'defined')
               | selectattr('attributes.device_class', 'eq', 'firmware')
               | map(attribute='entity_id') | list %}
          {{ pending | map(attribute='entity_id')
             | reject('in', hacs) | reject('in', firmware) | list | count }}
        attributes:
          entity_ids: >-
            {% set hacs = integration_entities('hacs') %}
            {% set pending = states.update | selectattr('state', 'eq', 'on')
                 | sort(attribute='name') | list %}
            {% set firmware = pending
                 | selectattr('attributes.device_class', 'defined')
                 | selectattr('attributes.device_class', 'eq', 'firmware')
                 | map(attribute='entity_id') | list %}
            {{ pending | map(attribute='entity_id')
               | reject('in', hacs) | reject('in', firmware) | list }}

      # ---------------------------------------------------------------
      # EN | HACS — integrations and Lovelace cards.
      # FR | HACS — integrations et cartes Lovelace.
      # ---------------------------------------------------------------
      - name: VSSP Updates hacs
        unique_id: vssp_updates_hacs
        icon: mdi:puzzle-outline
        state: >-
          {% set hacs = integration_entities('hacs') %}
          {{ states.update | selectattr('state', 'eq', 'on')
             | map(attribute='entity_id') | select('in', hacs)
             | list | count }}
        attributes:
          entity_ids: >-
            {% set hacs = integration_entities('hacs') %}
            {{ states.update | selectattr('state', 'eq', 'on')
               | sort(attribute='name') | map(attribute='entity_id')
               | select('in', hacs) | list }}

      # ---------------------------------------------------------------
      # EN | FIRMWARE — the flash of a physical device.
      # FR | MICROLOGICIEL — le flash d un appareil physique.
      # ---------------------------------------------------------------
      - name: VSSP Updates firmware
        unique_id: vssp_updates_firmware
        icon: mdi:chip
        state: >-
          {{ states.update | selectattr('state', 'eq', 'on')
             | selectattr('attributes.device_class', 'defined')
             | selectattr('attributes.device_class', 'eq', 'firmware')
             | list | count }}
        attributes:
          entity_ids: >-
            {{ states.update | selectattr('state', 'eq', 'on')
               | selectattr('attributes.device_class', 'defined')
               | selectattr('attributes.device_class', 'eq', 'firmware')
               | sort(attribute='name') | map(attribute='entity_id') | list }}

      # ---------------------------------------------------------------
      # EN | AUTOMATIC — what the nightly run would install, and what it
      # EN | will never touch.
      # FR | AUTOMATIQUE — ce que la passe nocturne installerait, et ce a
      # FR | quoi elle ne touchera jamais.
      # ---------------------------------------------------------------
      # EN | THE CORE OF HOME ASSISTANT IS NEVER INSTALLED AUTOMATICALLY.
      # EN | It is the one update that can leave the house without a
      # EN | dashboard: a broken Core takes down the interface you would
      # EN | use to notice, the console you would use to roll back, and
      # EN | every automation in the file. It wants the backup checkbox its
      # EN | own dialog offers, and a person watching. So it is excluded
      # EN | here, in the entity that FEEDS the automation, rather than in
      # EN | the automation itself — the screen can then show the exclusion
      # EN | as a fact it reads back, not as a promise made in a comment.
      # EN | Recognised two ways because the two do not always coincide: by
      # EN | entity_id, the identifier the Supervisor gives it, and by the
      # EN | `title` attribute, which survives an entity someone renamed.
      # EN | Neither exists on this k3s instance — Home Assistant runs as a
      # EN | container with no Supervisor to update it — so `protected` is
      # EN | empty here and the guard is dormant until the day the model
      # EN | moves to HAOS, which is exactly when it has to already be
      # EN | there.
      # EN | Note what is NOT protected: the Supervisor, the OS and the
      # EN | add-ons go with everything else, as asked. Leaving the switch
      # EN | off is what stops those.
      # FR | LE MOTEUR DE HOME ASSISTANT N EST JAMAIS INSTALLE
      # FR | AUTOMATIQUEMENT. C est la seule mise a jour capable de laisser
      # FR | la maison sans dashboard : un Core casse emporte l interface
      # FR | qui servirait a s en apercevoir, la console qui servirait a
      # FR | revenir en arriere, et toutes les automatisations du fichier.
      # FR | Elle veut la case de sauvegarde que sa propre boite propose, et
      # FR | quelqu un devant l ecran. Elle est donc exclue ici, dans
      # FR | l entite qui ALIMENTE l automatisation, plutot que dans
      # FR | l automatisation elle-meme — l ecran peut alors montrer
      # FR | l exclusion comme un fait qu il relit, et non comme une
      # FR | promesse faite dans un commentaire.
      # FR | Reconnue de deux facons parce que les deux ne coincident pas
      # FR | toujours : par entity_id, l identifiant que lui donne le
      # FR | Supervisor, et par l attribut `title`, qui survit a une entite
      # FR | qu on a renommee.
      # FR | Aucun des deux n existe sur cette instance k3s — Home Assistant
      # FR | y tourne en conteneur, sans Supervisor pour le mettre a jour —
      # FR | donc `protected` y est vide et la garde reste dormante jusqu au
      # FR | jour ou le modele passera sur HAOS, c est-a-dire precisement le
      # FR | moment ou elle doit deja etre la.
      # FR | A noter ce qui n est PAS protege : le Supervisor, l OS et les
      # FR | add-ons partent avec le reste, comme demande. C est laisser
      # FR | l interrupteur ferme qui les retient.
      - name: VSSP Updates auto
        unique_id: vssp_updates_auto
        icon: mdi:autorenew
        state: >-
          {% set ns = namespace(n=0) %}
          {% for u in states.update | selectattr('state', 'eq', 'on') %}
          {% if not (u.entity_id == 'update.home_assistant_core_update'
                     or (u.attributes.title | default('')) == 'Home Assistant Core') %}
          {% set ns.n = ns.n + 1 %}
          {% endif %}
          {% endfor %}
          {{ ns.n }}
        attributes:
          entity_ids: >-
            {% set ns = namespace(ids=[]) %}
            {% for u in states.update | selectattr('state', 'eq', 'on')
                 | sort(attribute='name') %}
            {% if not (u.entity_id == 'update.home_assistant_core_update'
                       or (u.attributes.title | default('')) == 'Home Assistant Core') %}
            {% set ns.ids = ns.ids + [u.entity_id] %}
            {% endif %}
            {% endfor %}
            {{ ns.ids }}
          protected: >-
            {% set ns = namespace(ids=[]) %}
            {% for u in states.update | selectattr('state', 'eq', 'on')
                 | sort(attribute='name') %}
            {% if u.entity_id == 'update.home_assistant_core_update'
                  or (u.attributes.title | default('')) == 'Home Assistant Core' %}
            {% set ns.ids = ns.ids + [u.entity_id] %}
            {% endif %}
            {% endfor %}
            {{ ns.ids }}

# ═══════════════════════════════════════════════════════════════════════
# EN | HELPERS — the switch, and the hour it fires
# FR | HELPERS — l interrupteur, et l heure a laquelle il part
# ═══════════════════════════════════════════════════════════════════════
#
# EN | No `initial:` on the switch. `initial` forces a value at every
# EN | restart, which would mean a reboot silently turning automatic
# EN | installs back on — or back off — behind whoever set it. Without it
# EN | Home Assistant restores the last state, and the switch means what it
# EN | shows.
# FR | Pas d `initial:` sur l interrupteur. `initial` force une valeur a
# FR | chaque redemarrage, donc un reboot rallumerait — ou eteindrait — les
# FR | installations automatiques dans le dos de qui les a reglees. Sans
# FR | lui, Home Assistant restaure le dernier etat et l interrupteur veut
# FR | dire ce qu il affiche.
      # ═══════════════════════════════════════════════════════════════
      # EN | THE GRAND TOTAL — Home Assistant's world plus the one under it
      # FR | LE TOTAL GENERAL — le monde de Home Assistant plus celui d en
      # FR | dessous
      # ═══════════════════════════════════════════════════════════════
      #
      # EN | `vssp_updates_pending` counts update entities and keeps that
      # EN | meaning; it would be wrong to inflate it with things that have
      # EN | no entity. This one is the number the ADMIN menu badge wants:
      # EN | everything waiting, wherever it waits.
      # EN | The infra half comes from a command_line sensor that reads a
      # EN | file, so it is `0` on an instance where the probe has never run
      # EN | rather than `unknown` — `int(0)` makes that explicit instead of
      # EN | leaving the sum to fail on a string.
      # FR | `vssp_updates_pending` compte des entites de mise a jour et
      # FR | garde ce sens ; l enfler de choses qui n ont pas d entite
      # FR | serait faux. Celui-ci est le nombre que veut la pastille du
      # FR | menu ADMIN : tout ce qui attend, ou qu il attende.
      # FR | La moitie infra vient d un capteur command_line qui lit un
      # FR | fichier, elle vaut donc `0` sur une instance ou la sonde n a
      # FR | jamais tourne plutot que `unknown` — `int(0)` le dit
      # FR | explicitement au lieu de laisser la somme echouer sur une
      # FR | chaine.
      - name: VSSP Updates all
        unique_id: vssp_updates_all
        icon: mdi:update
        state: >-
          {{ states('sensor.vssp_updates_pending') | int(0)
             + states('sensor.vssp_updates_infra') | int(0) }}

      # ═══════════════════════════════════════════════════════════════
      # EN | THE VERDICT — one sensor, read by two screens
      # FR | LE VERDICT — un capteur, lu par deux ecrans
      # ═══════════════════════════════════════════════════════════════
      #
      # EN | The HOME dashboard shows a green/orange/red light and tapping it
      # EN | opens the UPDATES screen. The first version computed the colour
      # EN | in the card's own JavaScript, which meant the light and the
      # EN | screen it links to were two separate opinions about the same
      # EN | question — and the first time they disagreed, the light said
      # EN | orange and the screen showed nothing that explained it. A signal
      # EN | you cannot click through and verify is worse than no signal: it
      # EN | trains you to distrust it.
      # EN | So the decision lives HERE, once, and both screens render it.
      # EN | The card reads this state for its colour; the UPDATES screen
      # EN | reads `items` and names exactly what drove it.
      # EN |   green   nothing to apply
      # EN |   orange  patches waiting — an HA integration, a HACS card, a
      # EN |           host package
      # EN |   red     a MAJOR version is waiting: the first number of the
      # EN |           version moved, which is the upgrade that reads release
      # EN |           notes rather than the one that runs tonight
      # FR | Le dashboard HOME affiche un feu vert/orange/rouge et le toucher
      # FR | ouvre l ecran MISES A JOUR. La premiere version calculait la
      # FR | couleur dans le JavaScript de la carte, ce qui faisait du feu et
      # FR | de l ecran vers lequel il pointe deux avis distincts sur la meme
      # FR | question — et la premiere fois qu ils ont diverge, le feu disait
      # FR | orange et l ecran n affichait rien qui l explique. Un signal
      # FR | qu on ne peut pas verifier en cliquant est pire que pas de
      # FR | signal : il apprend a s en mefier.
      # FR | La decision vit donc ICI, une fois, et les deux ecrans
      # FR | l affichent. La carte lit cet etat pour sa couleur ; l ecran
      # FR | MISES A JOUR lit `items` et nomme exactement ce qui l a decide.
      # FR |   green   rien a appliquer
      # FR |   orange  des patchs attendent — integration HA, carte HACS,
      # FR |           paquet de l hote
      # FR |   red     une version MAJEURE attend : le premier nombre de la
      # FR |           version a bouge, c est la mise a niveau qui lit les
      # FR |           notes de version, pas celle qui tourne cette nuit
      #
      # EN | MAJOR IS THE FIRST NUMBER MOVING. 2025.12 -> 2026.1 is major,
      # EN | 2026.1.1 -> 2026.1.2 is not. `regex_findall('\d+') | first` is
      # EN | how that first number is reached without assuming a separator:
      # EN | HA cores read 2026.1.0, apt reads 19.3.0-ce.0, docker tags read
      # EN | 1.20. An entry missing either version is counted as an ordinary
      # EN | patch rather than guessed at — an unknown upstream has never been
      # EN | evidence of a major release.
      # FR | MAJEUR, C EST LE PREMIER NOMBRE QUI BOUGE. 2025.12 -> 2026.1 en
      # FR | est un, 2026.1.1 -> 2026.1.2 non. `regex_findall('\d+') | first`
      # FR | est la facon d atteindre ce premier nombre sans presumer d un
      # FR | separateur : les cores HA s ecrivent 2026.1.0, apt 19.3.0-ce.0,
      # FR | les tags docker 1.20. Une entree a laquelle il manque une version
      # FR | compte comme un patch ordinaire plutot que d etre devinee — un
      # FR | amont inconnu n a jamais prouve une version majeure.
      - name: VSSP Updates verdict
        unique_id: vssp_updates_verdict
        # EN | Static, for the same self-reference reason as the state above:
        # EN | an icon template reading this sensor's own state would lag a
        # EN | cycle. The two cards that render this verdict pick their own
        # EN | icon from the state they are already reading.
        # FR | Statique, pour la meme raison d auto-reference que l etat
        # FR | ci-dessus : un template d icone lisant l etat de ce capteur
        # FR | aurait un cycle de retard. Les deux cartes qui affichent ce
        # FR | verdict choisissent leur icone depuis l etat qu elles lisent
        # FR | deja.
        icon: mdi:shield-check
        # EN | The same walk as `items` below, deliberately repeated rather
        # EN | than read back with state_attr('sensor.vssp_updates_verdict',
        # EN | 'items'): a template entity renders its state BEFORE its
        # EN | attributes, so reading its own attribute yields the PREVIOUS
        # EN | cycle's value. The light would then be one refresh behind the
        # EN | list it is supposed to summarise — green for a moment after a
        # EN | major landed, which is exactly the moment it must not be.
        # EN | Every other sensor in this file recomputes the same way.
        # FR | Le meme parcours que `items` plus bas, repete deliberement
        # FR | plutot que relu par state_attr('sensor.vssp_updates_verdict',
        # FR | 'items') : une entite template rend son etat AVANT ses
        # FR | attributs, donc lire son propre attribut donne la valeur du
        # FR | cycle PRECEDENT. Le feu aurait alors un rafraichissement de
        # FR | retard sur la liste qu il resume — vert un instant apres
        # FR | l arrivee d une version majeure, precisement l instant ou il ne
        # FR | doit pas l etre. Tous les autres capteurs de ce fichier
        # FR | recalculent de la meme facon.
        state: >-
          {% set ns = namespace(major=0, patch=0) %}
          {% for u in states.update | selectattr('state', 'eq', 'on') %}
            {% set im = u.attributes.installed_version | default('', true)
                        | string | regex_findall('\d+') %}
            {% set lm = u.attributes.latest_version | default('', true)
                        | string | regex_findall('\d+') %}
            {% if im | count > 0 and lm | count > 0
                  and (lm | first | int) > (im | first | int) %}
              {% set ns.major = ns.major + 1 %}
            {% else %}
              {% set ns.patch = ns.patch + 1 %}
            {% endif %}
          {% endfor %}
          {% for r in state_attr('sensor.vssp_updates_infra', 'components') or [] %}
            {% set im = r.installed | default('', true)
                        | string | regex_findall('\d+') %}
            {% set lm = r.latest | default('', true)
                        | string | regex_findall('\d+') %}
            {% if im | count > 0 and lm | count > 0
                  and (lm | first | int) > (im | first | int) %}
              {% set ns.major = ns.major + 1 %}
            {% elif r.pending %}
              {% set ns.patch = ns.patch + 1 %}
            {% endif %}
          {% endfor %}
          {% if ns.major > 0 %}red{% elif ns.patch > 0 %}orange{% else %}green{% endif %}
        attributes:
          # EN | Every pending thing, named, with what makes it major or not.
          # EN | The UPDATES screen renders this list verbatim, so what the
          # EN | light claims and what the screen shows are the same rows.
          # FR | Chaque chose en attente, nommee, avec ce qui la rend majeure
          # FR | ou non. L ecran MISES A JOUR affiche cette liste telle
          # FR | quelle, donc ce que le feu affirme et ce que l ecran montre
          # FR | sont les memes lignes.
          items: >-
            {% set ns = namespace(rows=[]) %}
            {% for u in states.update | selectattr('state', 'eq', 'on')
                 | sort(attribute='name') %}
              {% set iv = u.attributes.installed_version | default('', true) | string %}
              {% set lv = u.attributes.latest_version | default('', true) | string %}
              {% set im = iv | regex_findall('\d+') %}
              {% set lm = lv | regex_findall('\d+') %}
              {% set major = im | count > 0 and lm | count > 0
                             and (lm | first | int) > (im | first | int) %}
              {% set ns.rows = ns.rows + [{
                   'name': u.attributes.friendly_name | default(u.entity_id, true),
                   'kind': 'major' if major else 'patch',
                   'source': 'ha',
                   'installed': iv,
                   'latest': lv }] %}
            {% endfor %}
            {% for r in state_attr('sensor.vssp_updates_infra', 'components') or [] %}
              {% set iv = r.installed | default('', true) | string %}
              {% set lv = r.latest | default('', true) | string %}
              {% set im = iv | regex_findall('\d+') %}
              {% set lm = lv | regex_findall('\d+') %}
              {% set major = im | count > 0 and lm | count > 0
                             and (lm | first | int) > (im | first | int) %}
              {% if major or r.pending %}
                {% set ns.rows = ns.rows + [{
                     'name': r.key,
                     'kind': 'major' if major else 'patch',
                     'source': 'infra',
                     'installed': iv,
                     'latest': lv }] %}
              {% endif %}
            {% endfor %}
            {{ ns.rows }}
          # EN | Whether the server half of the answer was actually looked at.
          # EN | It does not change the colour — three colours, no fourth —
          # EN | but the UPDATES screen says so, so a green light over an
          # EN | unprobed host is at least legible as one.
          # FR | Si la moitie serveur de la reponse a reellement ete regardee.
          # FR | Cela ne change pas la couleur — trois couleurs, pas de
          # FR | quatrieme — mais l ecran MISES A JOUR le dit, pour qu un feu
          # FR | vert par-dessus un hote non sonde reste au moins lisible
          # FR | comme tel.
          infra_probed: >-
            {{ states('sensor.vssp_updates_infra') not in
               ['unavailable', 'unknown', 'none'] }}

      # EN | The infra family split by tier, so the screen can say "5 of
      # EN | these will install themselves tonight, 2 are waiting for you,
      # EN | 2 will never install from here" without recomputing it in three
      # EN | cards. The attribute is a list of dicts and the card renders it;
      # EN | same contract as the other four families.
      # FR | La famille infra repartie par palier, pour que l ecran puisse
      # FR | dire « 5 s installeront cette nuit, 2 vous attendent, 2 ne
      # FR | s installeront jamais d ici » sans le recalculer dans trois
      # FR | cartes. L attribut est une liste de dictionnaires que la carte
      # FR | affiche ; meme contrat que les quatre autres familles.
      - name: VSSP Infra auto
        unique_id: vssp_infra_auto
        icon: mdi:autorenew
        state: >-
          {{ (state_attr('sensor.vssp_updates_infra', 'counts')
              or {}).get('auto', 0) }}
      - name: VSSP Infra manual
        unique_id: vssp_infra_manual
        icon: mdi:gesture-tap-button
        state: >-
          {{ (state_attr('sensor.vssp_updates_infra', 'counts')
              or {}).get('manual', 0) }}
      - name: VSSP Infra locked
        unique_id: vssp_infra_locked
        icon: mdi:lock-outline
        state: >-
          {{ (state_attr('sensor.vssp_updates_infra', 'counts')
              or {}).get('locked', 0) }}

input_boolean:
  vssp_updates_auto:
    name: "Visio Sapiens — Mises à jour automatiques"
    icon: mdi:autorenew

  # EN | A SECOND SWITCH, deliberately not the one above.
  # EN | The switch above installs Lovelace cards and add-ons: a bad night
  # EN | costs a Ctrl+Shift+R. This one runs apt-get on the Ubuntu host that
  # EN | carries the cluster Home Assistant lives in. Folding the two into
  # EN | one control would mean someone who turned on automatic HACS updates
  # EN | months ago silently starts upgrading their server tonight, having
  # EN | agreed to no such thing.
  # EN | It is off, it stays off until someone says otherwise, and even on
  # EN | it only ever reaches the `auto` tier — see vssp_infra_updates.py.
  # FR | UN SECOND INTERRUPTEUR, deliberement pas celui du dessus.
  # FR | Celui du dessus installe des cartes Lovelace et des add-ons : une
  # FR | mauvaise nuit coute un Ctrl+Maj+R. Celui-ci lance apt-get sur
  # FR | l hote Ubuntu qui porte le cluster ou vit Home Assistant. Les
  # FR | reunir en une seule commande signifierait que quelqu un ayant
  # FR | active les mises a jour HACS automatiques il y a des mois se met a
  # FR | mettre a jour son serveur ce soir, sans avoir consenti a cela.
  # FR | Il est eteint, il le reste tant que personne ne dit le contraire,
  # FR | et meme allume il n atteint que le palier `auto` — voir
  # FR | vssp_infra_updates.py.
  vssp_updates_infra_auto:
    name: "Visio Sapiens — Mises à jour infrastructure automatiques"
    icon: mdi:server-network

# EN | An hour rather than an interval. A firmware flash cuts the power to
# EN | a plug for a moment and a HACS card swap changes the interface under
# EN | whoever is looking at it; both are unremarkable at 04:00 and
# EN | irritating at 19:00.
# EN | No `initial:` here either, for the same reason as the switch: it
# EN | would force the value back at every restart and undo the hour
# EN | someone chose. The field therefore starts at 00:00 — itself a quiet
# EN | hour, so a house that never touches it is not badly served — and the
# EN | ADMIN screen is where it moves.
# FR | Une heure plutot qu un intervalle. Un flash de micrologiciel coupe
# FR | un instant une prise et un remplacement de carte HACS change
# FR | l interface sous les yeux de qui la regarde ; les deux passent
# FR | inapercus a 04h00 et agacent a 19h00.
# FR | Pas d `initial:` ici non plus, pour la meme raison que
# FR | l interrupteur : il forcerait la valeur a chaque redemarrage et
# FR | deferait l heure choisie. Le champ demarre donc a 00h00 — une heure
# FR | calme elle aussi, donc une maison qui n y touche jamais n est pas
# FR | mal servie — et c est l ecran ADMIN qui la deplace.
input_datetime:
  vssp_updates_auto_time:
    name: "Visio Sapiens — Heure des mises à jour automatiques"
    icon: mdi:clock-outline
    has_date: false
    has_time: true

# ═══════════════════════════════════════════════════════════════════════
# EN | SCRIPTS — the two bulk actions, and only two
# FR | SCRIPTS — les deux actions groupees, et deux seulement
# ═══════════════════════════════════════════════════════════════════════
script:
  # EN | CHECK — ask every update entity to re-poll now. Integrations check
  # EN | on their own schedule (HACS roughly hourly), so without this the
  # EN | screen answers "up to date" from a cached answer that may be hours
  # EN | old, and there is nothing on it saying so.
  # EN | The condition is not decoration: `homeassistant.update_entity`
  # EN | with an empty entity_id list is a call with no target, which Home
  # EN | Assistant logs as an error rather than ignoring.
  # FR | VERIFIER — demander a chaque entite update de re-interroger sa
  # FR | source maintenant. Les integrations verifient a leur propre rythme
  # FR | (HACS environ toutes les heures), donc sans ceci l ecran repond
  # FR | « a jour » depuis une reponse en cache qui peut dater de plusieurs
  # FR | heures, et rien dessus ne le dit.
  # FR | La condition n est pas decorative : `homeassistant.update_entity`
  # FR | avec une liste entity_id vide est un appel sans cible, que Home
  # FR | Assistant journalise en erreur plutot que d ignorer.
  vssp_updates_check:
    alias: "Visio Sapiens — Mises à jour : vérifier maintenant"
    icon: mdi:cloud-search-outline
    mode: single
    sequence:
      - variables:
          targets: >-
            {{ states.update | map(attribute='entity_id') | list }}
      - condition: template
        value_template: "{{ targets | count > 0 }}"
      - action: homeassistant.update_entity
        target:
          entity_id: "{{ targets }}"

  # EN | INSTALL EVERY HACS UPDATE — the one bulk install this package
  # EN | offers, and the boundary is a safety decision rather than a
  # EN | limitation.
  # EN | A HACS update downloads files and is undone by reinstalling the
  # EN | previous version from HACS. A Core or add-on update is not, and
  # EN | wants the backup checkbox its own dialog offers — which a bulk
  # EN | call cannot tick, since `update.install` refuses `backup: true` on
  # EN | any entity that does not advertise BACKUP support and would fail
  # EN | the whole call for a mixed list. A firmware flash is undone by
  # EN | nothing at all.
  # EN | So: HACS in bulk, everything else from its own row, where the
  # EN | native dialog shows the release notes and the backup box before
  # EN | anything happens.
  # EN | The list comes from the sensor rather than from a filter repeated
  # EN | here: one definition of "a HACS update", in one place.
  # FR | INSTALLER TOUTES LES MISES A JOUR HACS — la seule installation
  # FR | groupee de ce package, et cette frontiere est une decision de
  # FR | securite plutot qu une limitation.
  # FR | Une mise a jour HACS telecharge des fichiers et se defait en
  # FR | reinstallant la version precedente depuis HACS. Une mise a jour de
  # FR | Core ou d un add-on, non, et elle veut la case sauvegarde que sa
  # FR | propre boite de dialogue propose — case qu un appel groupe ne peut
  # FR | pas cocher, `update.install` refusant `backup: true` sur toute
  # FR | entite qui n annonce pas le support BACKUP et faisant echouer
  # FR | l appel entier pour une liste mixte. Un flash de micrologiciel,
  # FR | lui, ne se defait par rien du tout.
  # FR | Donc : HACS en masse, tout le reste depuis sa propre ligne, ou la
  # FR | boite native montre les notes de version et la case de sauvegarde
  # FR | avant que quoi que ce soit ne se produise.
  # FR | La liste vient du capteur plutot que d un filtre repete ici : une
  # FR | seule definition de « une mise a jour HACS », a un seul endroit.
  vssp_updates_install_hacs:
    alias: "Visio Sapiens — Mises à jour : installer tout HACS"
    icon: mdi:puzzle-plus-outline
    mode: single
    sequence:
      - variables:
          targets: >-
            {{ state_attr('sensor.vssp_updates_hacs', 'entity_ids') or [] }}
      - condition: template
        value_template: "{{ targets | count > 0 }}"
      - action: update.install
        target:
          entity_id: "{{ targets }}"
      # EN | A Lovelace card that has just been replaced on disk is still
      # EN | the old file in this browser's cache. Home Assistant does not
      # EN | say so, and the symptom — a card that keeps behaving like the
      # EN | version you just replaced — reads as a failed update rather
      # EN | than a stale tab. The notification is the only place that can
      # EN | say it, since by then the screen has nothing left to show.
      # FR | Une carte Lovelace qui vient d etre remplacee sur le disque
      # FR | reste l ancien fichier dans le cache de ce navigateur. Home
      # FR | Assistant ne le dit pas, et le symptome — une carte qui
      # FR | continue de se comporter comme la version qu on vient de
      # FR | remplacer — se lit comme une mise a jour ratee plutot que
      # FR | comme un onglet perime. La notification est le seul endroit
      # FR | qui puisse le dire, l ecran n ayant alors plus rien a montrer.
      - action: persistent_notification.create
        data:
          notification_id: vssp_updates_hacs
          title: "Mises à jour HACS installées"
          message: >-
            {{ targets | count }} mise(s) à jour installée(s).
            Rechargez la page avec Ctrl+Maj+R : une carte Lovelace remplacée
            sur le disque reste l'ancien fichier dans le cache du navigateur.

  # EN | THE AUTOMATIC PASS — also the button, deliberately. The nightly
  # EN | automation and RUN NOW call this one script, so what the button
  # EN | does at 15:00 is exactly what the house does at 04:00, and testing
  # EN | it means testing the real thing rather than a second copy of it
  # EN | that will drift.
  # FR | LA PASSE AUTOMATIQUE — et le bouton aussi, a dessein.
  # FR | L automatisation nocturne et LANCER MAINTENANT appellent ce meme
  # FR | script, donc ce que fait le bouton a 15h00 est exactement ce que
  # FR | fait la maison a 04h00, et le tester revient a tester la vraie
  # FR | chose plutot qu une seconde copie qui divergera.
  vssp_updates_install_auto:
    alias: "Visio Sapiens — Mises à jour : passe automatique (hors HA Core)"
    icon: mdi:autorenew
    mode: single
    sequence:
      # EN | Ask first, install second. Integrations poll on their own
      # EN | schedule, so without this the nightly pass acts on whatever was
      # EN | true the last time something happened to check — which on a
      # EN | quiet instance can be most of a day ago.
      # FR | Demander d abord, installer ensuite. Les integrations
      # FR | interrogent leur source a leur propre rythme, donc sans ceci la
      # FR | passe nocturne agit sur ce qui etait vrai la derniere fois que
      # FR | quelque chose s est trouve verifier — ce qui, sur une instance
      # FR | calme, peut remonter a presque une journee.
      - variables:
          known: >-
            {{ states.update | map(attribute='entity_id') | list }}
      - if:
          - condition: template
            value_template: "{{ known | count > 0 }}"
        then:
          - action: homeassistant.update_entity
            target:
              entity_id: "{{ known }}"
          # EN | The re-poll is a network round trip per integration and the
          # EN | template sensor only recomputes once the states land.
          # FR | La re-interrogation est un aller-retour reseau par
          # FR | integration, et le capteur ne recalcule qu une fois les
          # FR | etats arrives.
          - delay:
              seconds: 30

      # EN | The list is read AFTER the refresh, from the sensor that
      # EN | already knows what is excluded. One definition of "safe to
      # EN | install unattended", in one place, and the screen shows the
      # EN | same number this script is about to act on.
      # FR | La liste est lue APRES le rafraichissement, depuis le capteur
      # FR | qui sait deja ce qui est exclu. Une seule definition de
      # FR | « installable sans surveillance », a un seul endroit, et
      # FR | l ecran affiche le nombre meme sur lequel ce script va agir.
      - variables:
          targets: >-
            {{ state_attr('sensor.vssp_updates_auto', 'entity_ids') or [] }}
      - condition: template
        value_template: "{{ targets | count > 0 }}"

      # EN | ONE AT A TIME, and errors do not stop the queue.
      # EN | A single `update.install` over the whole list is one service
      # EN | call: the first entity that refuses — a device that went
      # EN | offline between the refresh and now — raises, and everything
      # EN | queued behind it is silently never attempted. Looping with
      # EN | continue_on_error costs a few minutes at four in the morning
      # EN | and buys a pass that finishes what it can.
      # EN | The delay also keeps two firmware flashes from overlapping,
      # EN | which on mains-powered devices means two plugs rebooting at
      # EN | once.
      # FR | UNE A LA FOIS, et une erreur n arrete pas la file.
      # FR | Un seul `update.install` sur toute la liste est un unique appel
      # FR | de service : la premiere entite qui refuse — un appareil parti
      # FR | hors ligne entre le rafraichissement et maintenant — leve, et
      # FR | tout ce qui attend derriere n est jamais tente, sans un mot.
      # FR | Boucler avec continue_on_error coute quelques minutes a quatre
      # FR | heures du matin et achete une passe qui termine ce qu elle
      # FR | peut.
      # FR | Le delai evite de surcroit que deux flashs de micrologiciel se
      # FR | chevauchent, ce qui sur des appareils secteur signifie deux
      # FR | prises qui redemarrent en meme temps.
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - action: update.install
              continue_on_error: true
              target:
                entity_id: "{{ repeat.item }}"
            - delay:
                seconds: 20

      # EN | The report names what was left behind as well as what was
      # EN | done: an automatic pass that only ever says "3 installed" makes
      # EN | a held-back Home Assistant Core invisible, and invisible is how
      # EN | an update stays unapplied for a year.
      # FR | Le compte rendu nomme ce qui est reste sur le carreau autant
      # FR | que ce qui est fait : une passe automatique qui ne dit jamais
      # FR | que « 3 installees » rend invisible un Home Assistant Core
      # FR | retenu, et invisible est la maniere dont une mise a jour reste
      # FR | non appliquee pendant un an.
      - action: persistent_notification.create
        data:
          notification_id: vssp_updates_auto
          title: "Mises à jour automatiques"
          message: >-
            {{ targets | count }} mise(s) à jour installée(s).
            {% set held = state_attr('sensor.vssp_updates_auto', 'protected') or [] %}
            {% if held %}Retenue(s) pour installation manuelle :
            {{ held | join(', ') }}.{% endif %}
            Si une carte Lovelace en faisait partie, rechargez la page avec
            Ctrl+Maj+R.

  # ═══════════════════════════════════════════════════════════════════
  # EN | INFRASTRUCTURE SCRIPTS
  # FR | SCRIPTS INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════════════

  # EN | PROBE — ask the host and the upstreams where they stand. Read-only
  # EN | from end to end: it opens an ssh session, runs `apt list`,
  # EN | `apt-cache policy`, `k3s --version` and `docker ps`, and installs
  # EN | nothing whatever the switches say.
  # FR | SONDE — demander a l hote et aux amonts ou ils en sont. En lecture
  # FR | seule de bout en bout : elle ouvre une session ssh, lance
  # FR | `apt list`, `apt-cache policy`, `k3s --version` et `docker ps`, et
  # FR | n installe rien quoi que disent les interrupteurs.
  vssp_infra_check:
    alias: "Visio Sapiens — Infrastructure : vérifier maintenant"
    icon: mdi:server-network-outline
    mode: single
    sequence:
      - action: shell_command.vssp_infra_probe
      # EN | The command_line sensor polls every 5 minutes, which is right
      # EN | for a background number and much too slow for someone standing
      # EN | in front of the screen who just pressed CHECK. Forcing the read
      # EN | makes the button feel like it did something, because it did.
      # FR | Le capteur command_line interroge toutes les 5 minutes, ce qui
      # FR | convient a un nombre de fond et bien trop lent pour qui se tient
      # FR | devant l ecran et vient d appuyer sur VERIFIER. Forcer la
      # FR | lecture fait que le bouton a l air d avoir agi, parce qu il a
      # FR | agi.
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.vssp_updates_infra

  # EN | INSTALL ONE — the manual tier's only door. `component` is a key of
  # EN | the report, not free text: the script refuses anything the probe
  # EN | did not itself publish, so a malformed call stops here rather than
  # EN | in a shell on the host.
  # FR | INSTALLER UN — la seule porte du palier manuel. `component` est une
  # FR | cle du rapport, pas du texte libre : le script refuse tout ce que la
  # FR | sonde n a pas publie elle-meme, donc un appel malforme s arrete ici
  # FR | plutot que dans un shell sur l hote.
  vssp_infra_install_one:
    alias: "Visio Sapiens — Infrastructure : installer un composant"
    icon: mdi:download-network-outline
    mode: single
    fields:
      component:
        description: "EN | component key / FR | clé du composant"
        example: os_packages
        required: true
        selector:
          text:
    sequence:
      - variables:
          known: >-
            {{ (state_attr('sensor.vssp_updates_infra', 'components') or [])
               | map(attribute='key') | list }}
      - condition: template
        value_template: "{{ component in known }}"
      - action: shell_command.vssp_infra_install
        data:
          component: "{{ component }}"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.vssp_updates_infra

  # EN | AUTO PASS — the `auto` tier only. The script re-probes first, so it
  # EN | acts on what is true at 04:00 rather than on what was true when
  # EN | someone last looked at the screen.
  # FR | PASSE AUTO — le palier `auto` seulement. Le script resonde d abord,
  # FR | pour agir sur ce qui est vrai a 04h00 plutot que sur ce qui l etait
  # FR | quand quelqu un a regarde l ecran pour la derniere fois.
  vssp_infra_install_auto:
    alias: "Visio Sapiens — Infrastructure : passe automatique"
    icon: mdi:autorenew
    mode: single
    sequence:
      - action: shell_command.vssp_infra_install_auto
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.vssp_updates_infra
      - action: persistent_notification.create
        data:
          notification_id: vssp_infra_auto
          title: "Mises à jour infrastructure"
          message: >-
            {% set st = state_attr('sensor.vssp_updates_infra', 'counts') or {} %}
            Passe automatique terminée.
            Reste {{ st.get('manual', 0) }} mise(s) à jour à installer à la
            main et {{ st.get('locked', 0) }} hors de portée de la console
            (k3s, Vault, images Docker).
            {% if state_attr('sensor.vssp_updates_infra', 'components')
                  | selectattr('key', 'eq', 'os_reboot')
                  | selectattr('pending') | list | count > 0 %}
            L'hôte demande un redémarrage : il reste à déclencher depuis
            l'écran MISES À JOUR.
            {% endif %}

# ═══════════════════════════════════════════════════════════════════════
# EN | AUTOMATION — the nightly pass
# FR | AUTOMATISATION — la passe nocturne
# ═══════════════════════════════════════════════════════════════════════
#
# EN | Triggered by the helper rather than by a hardcoded hour, so moving
# EN | the time from the ADMIN screen moves the trigger with no reload.
# EN | The switch is a CONDITION and not a second trigger: the automation
# EN | stays loaded either way, and turning it back on does not queue up
# EN | whatever it missed.
# FR | Declenchee par le helper plutot que par une heure en dur : deplacer
# FR | l heure depuis l ecran ADMIN deplace le declencheur sans rechargement.
# FR | L interrupteur est une CONDITION et non un second declencheur :
# FR | l automatisation reste chargee dans les deux cas, et la rallumer ne
# FR | met pas en file ce qu elle a manque.
automation:
  - id: vssp_updates_auto_nightly
    alias: "Visio Sapiens — Mises à jour : passe automatique nocturne"
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.vssp_updates_auto_time
    conditions:
      - condition: state
        entity_id: input_boolean.vssp_updates_auto
        state: "on"
    actions:
      - action: script.vssp_updates_install_auto

  # EN | THE SCHEDULED PROBE — the "planned" half of auto/manual/planned,
  # EN | and the half that costs nothing. It only ever reads, so it runs
  # EN | whatever the switches say: a screen that reports yesterday's host
  # EN | is worse than no screen, because it is believed.
  # EN | Every six hours rather than every hour: apt metadata refreshes on
  # EN | the host's own timer and GitHub rate-limits anonymous callers.
  # EN | Also on startup, delayed — Home Assistant restarts before the
  # EN | network is necessarily up, and a probe that fires into a dead
  # EN | resolver writes "could not be probed" over a perfectly good report.
  # FR | LA SONDE PLANIFIEE — la moitie « planifie » de auto/manuel/planifie,
  # FR | et celle qui ne coute rien. Elle ne fait que lire, donc elle tourne
  # FR | quoi que disent les interrupteurs : un ecran qui remonte l hote
  # FR | d hier est pire que pas d ecran, parce qu on le croit.
  # FR | Toutes les six heures plutot que toutes les heures : les metadonnees
  # FR | apt se rafraichissent sur le minuteur de l hote et GitHub limite les
  # FR | appelants anonymes.
  # FR | Au demarrage aussi, avec un delai — Home Assistant redemarre avant
  # FR | que le reseau soit necessairement la, et une sonde lancee dans un
  # FR | resolveur mort ecrit « non sondable » par-dessus un rapport
  # FR | parfaitement valide.
  - id: vssp_infra_probe_scheduled
    alias: "Visio Sapiens — Infrastructure : sonde planifiée"
    mode: single
    triggers:
      - trigger: time_pattern
        hours: "/6"
      - trigger: homeassistant
        event: start
    actions:
      - delay:
          minutes: 2
      - action: script.vssp_infra_check

  # EN | THE INFRASTRUCTURE NIGHTLY PASS. Same hour as the pass above and a
  # EN | different switch, so the two can be run apart — and a delay between
  # EN | them, because both end in a service restart and neither wants the
  # EN | other's dpkg lock.
  # FR | LA PASSE NOCTURNE INFRASTRUCTURE. Meme heure que la passe du dessus
  # FR | et un interrupteur different, pour que les deux se pilotent
  # FR | separement — et un delai entre elles, parce que toutes deux
  # FR | finissent par un redemarrage de service et qu aucune ne veut le
  # FR | verrou dpkg de l autre.
  - id: vssp_infra_auto_nightly
    alias: "Visio Sapiens — Infrastructure : passe automatique nocturne"
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.vssp_updates_auto_time
    conditions:
      - condition: state
        entity_id: input_boolean.vssp_updates_infra_auto
        state: "on"
    actions:
      - delay:
          minutes: 10
      - action: script.vssp_infra_install_auto

# ═══════════════════════════════════════════════════════════════════════
# EN | INFRASTRUCTURE — the layer underneath Home Assistant
# FR | INFRASTRUCTURE — la couche sous Home Assistant
# ═══════════════════════════════════════════════════════════════════════
#
# EN | Everything above this line reads entities Home Assistant already
# EN | holds. Nothing below it can: the Ubuntu host, k3s, GitLab and the
# EN | runner have no `update.*` entity and never will, because they live on
# EN | the other side of the container boundary.
# EN | So this half has a data source — one script, vssp_infra_updates.py —
# EN | and the whole of its privilege problem is solved in the safe rather
# EN | than here. Read the header of that file before changing any of this;
# EN | in particular, the tier of a component is declared THERE, and nothing
# EN | in this package may promote one.
# FR | Tout ce qui precede cette ligne lit des entites que Home Assistant
# FR | detient deja. Rien de ce qui suit ne le peut : l hote Ubuntu, k3s,
# FR | GitLab et le runner n ont pas d entite `update.*` et n en auront
# FR | jamais, parce qu ils vivent de l autre cote de la frontiere du
# FR | conteneur.
# FR | Cette moitie a donc une source de donnees — un script,
# FR | vssp_infra_updates.py — et tout son probleme de privileges se resout
# FR | dans le coffre plutot qu ici. Lire l en-tete de ce fichier avant de
# FR | modifier ceci ; en particulier, le palier d un composant est declare
# FR | LA-BAS, et rien dans ce package ne peut en promouvoir un.

command_line:
  # EN | READS A FILE, does not run the probe. The probe opens an ssh
  # EN | session and talks to three upstream APIs; running that on a sensor
  # EN | scan interval would mean a connection to the host every minute for
  # EN | a number that changes twice a day. The probe is scheduled below;
  # EN | this only picks up what it left.
  # EN | `cat` of a missing file exits non-zero and the sensor goes
  # EN | unavailable — correct, and visibly different from "nothing is
  # EN | pending". The `|| echo` fallback would have hidden a probe that has
  # EN | never run behind a confident zero.
  # FR | LIT UN FICHIER, ne lance pas la sonde. La sonde ouvre une session
  # FR | ssh et interroge trois API amont ; la lancer a l intervalle de scan
  # FR | d un capteur voudrait dire une connexion a l hote chaque minute
  # FR | pour un nombre qui change deux fois par jour. La sonde est planifiee
  # FR | plus bas ; ceci ne fait que ramasser ce qu elle a laisse.
  # FR | Un `cat` sur un fichier absent sort en erreur et le capteur devient
  # FR | indisponible — c est correct, et visiblement different de « rien
  # FR | n attend ». Un repli `|| echo` aurait cache une sonde qui n a
  # FR | jamais tourne derriere un zero plein d assurance.
  - sensor:
      name: "VSSP Updates infra"
      unique_id: vssp_updates_infra
      command: "cat /config/www/vssp/infra_updates.json"
      command_timeout: 15
      scan_interval: 300
      value_template: "{{ value_json.counts.total }}"
      json_attributes:
        - components
        - counts
        - generated

shell_command:
  # EN | THREE COMMANDS, and none of them takes anything a user typed.
  # EN | `--install` receives `component`, and the only caller that sets it
  # EN | is the script below, which passes a key out of the report the probe
  # EN | itself wrote. The script rejects an unknown key before ssh is ever
  # EN | opened, so a crafted value reaches a lookup in a dict of seven
  # EN | constants and stops there.
  # FR | TROIS COMMANDES, et aucune ne prend quoi que ce soit de saisi par
  # FR | un utilisateur. `--install` recoit `component`, et le seul appelant
  # FR | qui le renseigne est le script ci-dessous, qui passe une cle issue
  # FR | du rapport ecrit par la sonde elle-meme. Le script rejette une cle
  # FR | inconnue avant meme d ouvrir ssh, donc une valeur forgee atteint une
  # FR | recherche dans un dictionnaire de sept constantes et s arrete la.
  vssp_infra_probe: >-
    python3 /config/vssp/vssp_infra_updates.py --probe
    --out /config/www/vssp/infra_updates.json
    --status /config/www/vssp/infra_updates_status.json

  vssp_infra_install: >-
    python3 /config/vssp/vssp_infra_updates.py --install {{ component }}
    --out /config/www/vssp/infra_updates.json
    --status /config/www/vssp/infra_updates_status.json

  vssp_infra_install_auto: >-
    python3 /config/vssp/vssp_infra_updates.py --install-auto
    --out /config/www/vssp/infra_updates.json
    --status /config/www/vssp/infra_updates_status.json

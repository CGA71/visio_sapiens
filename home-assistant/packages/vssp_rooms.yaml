########################################################################
# Visio Sapiens — ROOM STRUCTURE SYNC package
#
# EN | Closes the gap between the room form and the model it claims to
# EN | write:
# EN |   PIECES & ETAGES  -> HA Area/Floor registry   (the structure, live)
# EN |   this package     -> house.yaml `rooms:`       (the structure, recorded)
# EN |   the ASSIGN form  -> reads house.yaml          (what it offers per device)
# EN | Without it, vssp_rooms_floors.html's "Appliquer" only ever touched the
# EN | HA registry, and house.yaml kept whatever room list it started with —
# EN | so the ASSIGN screen's room dropdown could show rooms that no longer
# EN | exist and miss ones that do.
# FR | Ferme l ecart entre le formulaire de pieces et le modele qu il pretend
# FR | ecrire :
# FR |   PIECES & ETAGES  -> registre Zones/Etages HA  (la structure, en direct)
# FR |   ce package       -> `rooms:` de house.yaml    (la structure, enregistree)
# FR |   le formulaire ASSIGN -> lit house.yaml         (ce qu il propose par appareil)
# FR | Sans lui, le bouton « Appliquer » de vssp_rooms_floors.html ne touchait
# FR | que le registre HA, et house.yaml gardait la liste de pieces avec
# FR | laquelle il avait demarre — donc le menu deroulant de pieces de l ecran
# FR | ASSIGN pouvait afficher des pieces qui n existent plus et en manquer qui
# FR | existent.
#
# EN | BEFORE DEPLOYING — check for duplicate keys, same as every other
# EN | package here:
# FR | AVANT DE DEPLOYER — verifier les cles en double, comme pour tout autre
# FR | package ici :
#
#   grep -n "vssp_rooms" home-assistant/packages/*.yaml
#
# EN | Same pod dependency as vssp_assign.yaml: ruamel.yaml.
# FR | Meme dependance pod que vssp_assign.yaml : ruamel.yaml.
########################################################################

shell_command:
  # EN | Links or creates rooms in house.yaml from the HA Area registry.
  # EN | Never touches an existing room's `slots:` — see the script header.
  # FR | Relie ou cree des pieces dans house.yaml depuis le registre Zones
  # FR | HA. Ne touche jamais aux `slots:` d une piece existante — voir
  # FR | l en-tete du script.
  vssp_rooms_apply: >-
    python3 /config/vssp/vssp_rooms_apply.py
    --model /config/dashboards/model/house.yaml
    --json-b64 "{{ content_b64 }}"
    --status-file /config/www/vssp/rooms_sync_status.json

  # EN | WHY THIS EXISTS. Creating a room wrote house.yaml and regenerated
  # EN | its two views, and stopped there. A room dashboard only exists once
  # EN | config-fragment-rooms.yaml has been merged into configuration.yaml,
  # EN | and that merge only ever happened at deploy time, inside the runner.
  # EN | Between two deploys a new room therefore had a navigation entry, a
  # EN | generated view, and no dashboard behind it: clicking it landed on
  # EN | HOME, because Home Assistant falls back to the default panel when a
  # EN | url_path does not exist. Reproduced on the appliance staging with
  # EN | two rooms freshly added - both views generated, neither declared.
  # EN | No pruning here. A deploy prunes what the fragments no longer
  # EN | declare; adding a room must never take that decision.
  # FR | POURQUOI CECI EXISTE. Creer une piece ecrivait house.yaml et
  # FR | regenerait ses deux vues, puis s arretait la. Un dashboard de piece
  # FR | n existe qu une fois config-fragment-rooms.yaml fusionne dans
  # FR | configuration.yaml, et cette fusion n avait lieu qu au deploiement,
  # FR | dans le runner. Entre deux deploiements, une nouvelle piece avait
  # FR | donc une entree de navigation, une vue generee, et aucun dashboard
  # FR | derriere : cliquer dessus menait a HOME, Home Assistant retombant
  # FR | sur le panneau par defaut quand un url_path n existe pas. Reproduit
  # FR | sur la preproduction appareil avec deux pieces fraichement ajoutees
  # FR | - les deux vues generees, aucune declaree.
  # FR | Aucun elagage ici. Un deploiement elague ce que les fragments ne
  # FR | declarent plus ; l ajout d une piece ne doit jamais prendre cette
  # FR | decision.
  vssp_apply_rooms_config: >-
    python3 /config/vssp/vssp_apply_config.py
    --config /config/configuration.yaml
    --fragment /config/config-fragment.yaml /config/config-fragment-rooms.yaml

# ----------------------------------------------------------------------
# EN | WEBHOOK — same reasoning as vssp_assign.yaml's: the form runs in an
# EN | iframe with no access to `hass` or a Bearer token, so a local-only
# EN | webhook is the entry point instead.
# FR | WEBHOOK — meme raisonnement que celui de vssp_assign.yaml : le
# FR | formulaire tourne dans une iframe sans acces a `hass` ni a un jeton
# FR | Bearer, donc un webhook local uniquement sert de point d entree.
# ----------------------------------------------------------------------
automation:
  # EN | mode: queued (not single) — ROOT CAUSE of "my slot_set/default_slot
  # EN | choice reverted to default/automatic" reproduced live: this webhook
  # EN | fires from THREE client call sites (connect(), reload(), and
  # EN | applyDiff()'s own post-Apply sync) — a page load followed shortly by
  # EN | an Apply, or two tabs, sends two POSTs close together. Each run of
  # EN | this automation takes 4-5s (shell_command.vssp_rooms_apply +
  # EN | vssp_generate_dashboards + vssp_assign_prepare), so with mode:
  # EN | single the second POST arriving mid-run was silently REJECTED
  # EN | (script_execution: "failed_single" in the trace) — never even
  # EN | reaching vssp_rooms_apply.py. The webhook endpoint itself still
  # EN | answered 200 either way, so the browser showed its normal "applied"
  # EN | notice regardless of whether the automation actually ran. Whichever
  # EN | POST fired first (often the page's own connect()-time sync, sending
  # EN | the OLD "default" values since nothing had been edited yet) is the
  # EN | one that won, silently discarding the admin's real edit. queued
  # EN | (max: 10) processes every trigger in order instead of dropping any.
  # FR | mode: queued (pas single) — CAUSE RACINE de « mon choix de
  # FR | slot_set/default_slot est revenu a default/automatique » reproduite
  # FR | en direct : ce webhook est declenche depuis TROIS points d appel
  # FR | cote client (connect(), reload(), et la propre synchronisation
  # FR | post-Appliquer de applyDiff()) — un chargement de page suivi de peu
  # FR | par un Appliquer, ou deux onglets, envoie deux POST rapprochés.
  # FR | Chaque execution de cette automatisation prend 4-5s
  # FR | (shell_command.vssp_rooms_apply + vssp_generate_dashboards +
  # FR | vssp_assign_prepare), donc avec mode: single le second POST arrive
  # FR | en cours d execution et etait REJETE en silence
  # FR | (script_execution: « failed_single » dans la trace) — n atteignant
  # FR | meme jamais vssp_rooms_apply.py. Le point d entree webhook
  # FR | lui-meme repondait quand meme 200 dans les deux cas, donc le
  # FR | navigateur affichait son avis « applique » habituel que
  # FR | l automatisation ait reellement tourne ou non. Quel que soit le
  # FR | POST arrive en premier (souvent la synchronisation au moment de
  # FR | connect(), envoyant les ANCIENNES valeurs « default » puisque rien
  # FR | n avait encore ete edite) l emportait, ecrasant en silence la
  # FR | vraie modification de l administrateur. queued (max: 10) traite
  # FR | chaque declenchement dans l ordre au lieu d en rejeter aucun.
  - alias: "Visio Sapiens — Receive room structure sync"
    id: vssp_receive_rooms_sync
    mode: queued
    max: 10
    triggers:
      - trigger: webhook
        webhook_id: vssp_rooms_sync
        local_only: true
        allowed_methods:
          - POST
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.json.content_b64 is defined }}"
            sequence:
              - action: shell_command.vssp_rooms_apply
                data:
                  content_b64: "{{ trigger.json.content_b64 }}"
                response_variable: applied
              - if:
                  - condition: template
                    value_template: "{{ applied.returncode == 0 }}"
                then:
                  # EN | New rooms need a dashboard view, so regenerate —
                  # EN | same shell_command the ASSIGN webhook already
                  # EN | calls after every successful save. Idempotent when
                  # EN | nothing changed.
                  # FR | Une piece nouvelle a besoin d une vue de dashboard,
                  # FR | donc regenerer — le meme shell_command que le
                  # FR | webhook ASSIGN appelle deja apres chaque
                  # FR | enregistrement reussi. Idempotent quand rien n a
                  # FR | change.
                  - action: shell_command.vssp_generate_dashboards
                  - action: shell_command.vssp_assign_prepare
                  # EN | Then the merge, then a restart - in that order, and
                  # EN | without it the room stays unreachable. Lovelace
                  # EN | reads its dashboards once, at startup, so a new
                  # EN | url_path cannot appear any other way.
                  # FR | Puis la fusion, puis un redemarrage - dans cet
                  # FR | ordre, et sans lui la piece reste injoignable.
                  # FR | Lovelace lit ses dashboards une fois, au demarrage :
                  # FR | un nouvel url_path ne peut apparaitre autrement.
                  - action: shell_command.vssp_apply_rooms_config
                    response_variable: merged
                  # EN | A SUCCESSFUL MERGE IS NOT A CHANGED ONE, and telling
                  # EN | them apart is the whole of this condition.
                  # EN | vssp_apply_config.py exits 0 both when it rewrote
                  # EN | configuration.yaml and when it found nothing to do, so
                  # EN | restarting on the exit code alone restarted on every
                  # EN | sync. And the rooms wizard posts its structure on
                  # EN | every connect - deliberately, so that rooms created
                  # EN | before this sync existed are still caught - which
                  # EN | includes a plain page load. Opening ROOMS & FLOORS
                  # EN | therefore restarted the instance, every single time:
                  # EN | measured on the k3s staging on 28 September, two
                  # EN | restarts seven hours apart, each at the exact second
                  # EN | the screen was opened, and the screen's own ten-second
                  # EN | reconnect then posted again as soon as it came back.
                  # EN | The restart itself stays: Lovelace reads its
                  # EN | dashboards once, at startup, and a new room's url_path
                  # EN | cannot appear any other way. It just no longer happens
                  # EN | when nothing was added.
                  # FR | UNE FUSION REUSSIE N EST PAS UNE FUSION QUI A CHANGE
                  # FR | QUELQUE CHOSE, et distinguer les deux est tout l objet
                  # FR | de cette condition. vssp_apply_config.py sort en 0
                  # FR | aussi bien quand il a reecrit configuration.yaml que
                  # FR | quand il n a rien trouve a faire : redemarrer sur le
                  # FR | seul code de sortie redemarrait donc a chaque
                  # FR | synchronisation. Or le formulaire des pieces poste sa
                  # FR | structure a chaque connexion - volontairement, pour
                  # FR | rattraper les pieces creees avant que cette synchro
                  # FR | existe - ce qui inclut un simple chargement de page.
                  # FR | Ouvrir PIECES & ETAGES redemarrait donc l instance, a
                  # FR | tous les coups : mesure sur la preproduction k3s le 28
                  # FR | septembre, deux redemarrages a sept heures d
                  # FR | intervalle, chacun a la seconde exacte de l ouverture,
                  # FR | et la reconnexion a dix secondes de l ecran reposait
                  # FR | des que l instance revenait. Le redemarrage reste :
                  # FR | Lovelace ne lit ses dashboards qu au demarrage et le
                  # FR | url_path d une piece nouvelle ne peut apparaitre
                  # FR | autrement. Il n a simplement plus lieu quand rien n a
                  # FR | ete ajoute.
                  - if:
                      - condition: template
                        value_template: >-
                          {{ merged.returncode == 0
                             and 'result=changed' in (merged.stdout | default('')) }}
                    then:
                      # EN | check_config first: one does not restart into a
                      # EN | configuration.yaml that does not parse.
                      # FR | check_config d abord : on ne redemarre pas dans
                      # FR | un configuration.yaml qui ne se lit pas.
                      - action: homeassistant.check_config
                      - action: homeassistant.restart
                  # EN | Only a real failure is worth a notification. The third
                  # EN | case - merged fine, nothing to change - is the normal
                  # EN | outcome of every sync that adds no room, and it must
                  # EN | stay silent: it is what a page load produces.
                  # FR | Seul un vrai echec merite une notification. Le
                  # FR | troisieme cas - fusion correcte, rien a changer - est
                  # FR | l issue normale de toute synchro qui n ajoute aucune
                  # FR | piece, et doit rester silencieux : c est ce que
                  # FR | produit un chargement de page.
                  - if:
                      - condition: template
                        value_template: "{{ merged.returncode != 0 }}"
                    then:
                      - action: persistent_notification.create
                        data:
                          title: "Visio Sapiens — configuration.yaml not patched"
                          message: >
                            The room was written and its views generated, but
                            configuration.yaml could not be patched (exit code
                            {{ merged.returncode }}), so the room dashboard
                            does not exist yet and its navigation entry leads
                            to HOME. See Settings > System > Logs for
                            vssp_apply_config.py.
                else:
                  - action: persistent_notification.create
                    data:
                      title: "Visio Sapiens — Room sync failed"
                      message: >
                        The room structure sync failed (exit code
                        {{ applied.returncode }}). house.yaml was not
                        written. Check Settings > System > Logs for
                        vssp_rooms_apply.py.
        default:
          - action: persistent_notification.create
            data:
              title: "Visio Sapiens — Malformed room sync"
              message: >
                The webhook received a payload without content_b64.
                Nothing was written.

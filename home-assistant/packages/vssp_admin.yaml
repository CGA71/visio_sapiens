########################################################################
# Visio Sapiens — Configuration ADMIN (PACKAGE Home Assistant)
#
# DESTINATION DANS LE REPO :
#     home-assistant/packages/vssp_admin.yaml
#
# CHEMIN FINAL SUR LE POD (pose par le CI) :
#     /config/packages/vssp_admin.yaml
#
# Charge AUTOMATIQUEMENT par la cle deja presente dans
# config-fragment.yaml :
#     homeassistant:
#       packages: !include_dir_named packages
#
# Rien a recopier dans configuration.yaml : c'est un package HA complet,
# comme vssp_technical_room.yaml. Un package peut declarer plusieurs
# domaines (input_text, command_line, shell_command, script) — ils sont
# fusionnes avec ceux deja definis ailleurs.
#
# ⚠ SI LES BOUTONS DU PANNEAU ADMIN DISENT « script.vssp_… introuvable »
#   c'est que ce fichier n'est pas charge. Verifier dans l'ordre :
#     1. le fichier est bien dans /config/packages/ sur le pod
#        (kubectl exec … -- ls /config/packages/)
#     2. configuration.yaml contient bien
#        homeassistant: packages: !include_dir_named packages
#        (pose par vssp_ensure_packages.py au deploiement)
#     3. Home Assistant a ete REDEMARRE (les input_text et command_line
#        declares en YAML ne se rechargent pas a chaud ; pour les scripts
#        seuls, Outils de developpement > YAML > Recharger les scripts)
#     4. Outils de developpement > Etats : chercher « vssp » — les
#        entites script.vssp_* et binary_sensor.vssp_* doivent apparaitre
#
# APRES INSTALLATION : lancer une fois le script vssp_set_admin_pin
# (apres y avoir mis votre vrai code), puis renseigner le helper
# input_text.vssp_ha_token avec un jeton longue duree.
#
# Prerequis dossiers sur le pod :
#     mkdir -p /config/vssp/backups /config/www/vssp /config/dashboards/model
########################################################################

# --------------------------------------------------------------------
# HELPERS (Parametres > Appareils et services > Aides, ou via ce YAML)
# --------------------------------------------------------------------
input_text:
  vssp_admin_pin:
    name: "Visio Sapiens — Code admin (reference)"
    mode: password
    max: 20
  vssp_pin_entry:
    name: "Visio Sapiens — Saisie du code"
    mode: password
    max: 20
  # Jeton longue duree utilise par vssp_discovery.py et
  # vssp_energy_sync.py (Profil > Jetons d'acces longue duree).
  # Sans ce helper, les shell_command correspondants s'executent avec un
  # token vide et le panneau affiche « Entite non trouvee ».
  vssp_ha_token:
    name: "Visio Sapiens — Jeton API Home Assistant"
    mode: password
    max: 255

  # Cles API des chatbots geres nativement (Gemini/Claude/ChatGPT), plus
  # le modele utilise par chacun — modifiable ici sans toucher au code,
  # meme convention que vssp_ha_token : jamais passees en argument de
  # ligne de commande, ecrites dans un fichier protege par
  # shell_command.vssp_write_<provider>_key puis lues de la par
  # vssp_chatbot_send.py (voir packages/vssp_chatbot.yaml).
  vssp_gemini_api_key:
    name: "Visio Sapiens — Cle API Gemini"
    mode: password
    max: 255
  vssp_gemini_model:
    name: "Visio Sapiens — Modele Gemini"
    initial: "gemini-2.0-flash"
    max: 100
  vssp_claude_api_key:
    name: "Visio Sapiens — Cle API Claude"
    mode: password
    max: 255
  vssp_claude_model:
    name: "Visio Sapiens — Modele Claude"
    initial: "claude-sonnet-4-5"
    max: 100
  vssp_chatgpt_api_key:
    name: "Visio Sapiens — Cle API ChatGPT"
    mode: password
    max: 255
  vssp_chatgpt_model:
    name: "Visio Sapiens — Modele ChatGPT"
    initial: "gpt-4o-mini"
    max: 100

  # Chatbot local / auto-heberge ("custom" dans le selecteur ADMIN).
  # Renseigne via le popup browser_mod ouvert depuis l'ecran GENERATION,
  # ecrit par le webhook vssp_chatbot_custom_config — voir
  # packages/vssp_chatbot.yaml et vssp_chatbot.html.
  # La cle API est optionnelle : de nombreux serveurs locaux (Ollama,
  # LM Studio...) n'en exigent aucune.
  vssp_chatbot_custom_name:
    name: "Visio Sapiens — Chatbot custom : nom"
    max: 100
  vssp_chatbot_custom_endpoint:
    name: "Visio Sapiens — Chatbot custom : URL du point d'acces"
    max: 255
  vssp_chatbot_custom_model:
    name: "Visio Sapiens — Chatbot custom : modele"
    max: 100
  vssp_chatbot_custom_system_prompt:
    name: "Visio Sapiens — Chatbot custom : prompt systeme"
    # EN | 255 is input_text's own hard cap, not an arbitrary choice —
    # EN | Home Assistant refused to set up this whole domain with 500.
    # FR | 255 est le plafond propre d'input_text, pas un choix arbitraire —
    # FR | Home Assistant refusait de demarrer tout le domaine avec 500.
    max: 255
  vssp_chatbot_custom_api_key:
    name: "Visio Sapiens — Chatbot custom : cle API (optionnelle)"
    mode: password
    max: 255

# --------------------------------------------------------------------
# ETAT DES DASHBOARDS SYSTEME (HOME, ENERGY, CORE)
# --------------------------------------------------------------------
# HOME, ENERGY et CORE ne sont pas rattaches a une piece Home Assistant :
# ils ne passent donc jamais par le formulaire creation/modification/
# suppression du wizard. Le panneau ADMIN a besoin de savoir s'ils
# existent pour proposer soit CREER, soit REGENERER/DESACTIVER.
#
# EN | vssp_dashboard_home_present was missing here even though
# EN | admin.yaml.j2's CREER/REGENERER HOME conditional already reads it —
# EN | with no entity behind it, both branches of that `type: conditional`
# EN | evaluate false and NEITHER button ever renders. This is that
# EN | missing entity.
# FR | vssp_dashboard_home_present manquait ici alors que le conditional
# FR | CREER/REGENERER HOME de admin.yaml.j2 le lit deja — sans entite
# FR | derriere, les deux branches de ce `type: conditional` valent faux et
# FR | AUCUN des deux boutons ne s affiche jamais. C est cette entite
# FR | manquante.
#
# `command_line` est une integration de premier niveau : si votre
# configuration.yaml en a deja une, fusionnez seulement les entrees.
command_line:
  - binary_sensor:
      name: "VSSP Dashboard Home Present"
      unique_id: vssp_dashboard_home_present
      command: >-
        test -s /config/dashboards/views/home.yaml
        && echo ON || echo OFF
      payload_on: "ON"
      payload_off: "OFF"
      # Pas de device_class : « on » signifie ici « present », pas
      # « probleme ». Un device_class: problem inverserait le sens.
      scan_interval: 30

  - binary_sensor:
      name: "VSSP Dashboard Energy Present"
      unique_id: vssp_dashboard_energy_present
      command: >-
        test -s /config/dashboards/views/energy.yaml
        && echo ON || echo OFF
      payload_on: "ON"
      payload_off: "OFF"
      # Pas de device_class : « on » signifie ici « present », pas
      # « probleme ». Un device_class: problem inverserait le sens.
      scan_interval: 30

  - binary_sensor:
      name: "VSSP Dashboard Core Present"
      unique_id: vssp_dashboard_core_present
      command: >-
        test -s /config/dashboards/views/core.yaml
        && echo ON || echo OFF
      payload_on: "ON"
      payload_off: "OFF"
      # Pas de device_class : « on » signifie ici « present », pas
      # « probleme ». Un device_class: problem inverserait le sens.
      scan_interval: 30

  # Nombre d'appareils REELLEMENT ecrits dans le modele. A comparer a
  # sensor.vssp_appareils_mesures (ce que HA expose) : un ecart entre
  # les deux signifie que le sync n'a pas abouti.
  - sensor:
      name: "VSSP Modele Appareils"
      unique_id: vssp_modele_appareils
      command: >-
        grep -c "power_entity:" /config/dashboards/model/energy_devices.yaml
        2>/dev/null || echo 0
      scan_interval: 60

  - sensor:
      name: "VSSP Modele Circuits"
      unique_id: vssp_modele_circuits
      command: >-
        grep -c "entity: switch\." /config/dashboards/model/energy_devices.yaml
        2>/dev/null || echo 0
      scan_interval: 60

  # Resultat du dernier sync (ok/ko), lu dans le rapport JSON.
  - sensor:
      name: "VSSP Sync Resultat"
      unique_id: vssp_sync_resultat
      command: >-
        sh -c "python3 -c \"import json;d=json.load(open('/config/www/vssp/energy_sync_status.json'));print('ok' if d.get('ok') else 'echec')\" 2>/dev/null || echo jamais_lance"
      scan_interval: 60

  # Date de derniere generation, pour l'affichage du panneau ADMIN.
  - sensor:
      name: "VSSP Dashboard Energy Modifie"
      unique_id: vssp_dashboard_energy_mtime
      command: >-
        date -r /config/dashboards/views/energy.yaml
        "+%d/%m %H:%M" 2>/dev/null || echo "jamais genere"
      scan_interval: 300

# --------------------------------------------------------------------
# SHELL COMMANDS — executent les scripts Python sur le pod HA lui-meme
# --------------------------------------------------------------------
shell_command:
  # vssp_discovery.py attend --token en argument. On prend le helper
  # s'il est renseigne, sinon le contenu de /config/vssp/.ha_token :
  # ainsi les deux methodes fonctionnent sans toucher a ce script.
  vssp_discovery: >-
    sh -c "TOKEN='{{ states('input_text.vssp_ha_token') }}';
    case \"$TOKEN\" in ''|unknown|unavailable)
      TOKEN=$(cat /config/vssp/.ha_token 2>/dev/null);; esac;
    python3 /config/vssp/vssp_discovery.py
    --url http://localhost:8123
    --token \"$TOKEN\"
    --output /config/vssp/report.json" 
  vssp_upgrade: >-
    python3 /config/vssp/vssp_upgrade.py
  # EN | A timestamped copy of dashboards/views/, kept for the three other
  # EN | scripts that back up before overwriting (the deletion below carries
  # EN | its own backup). It used to copy /config/dashboards/home.yaml, a
  # EN | path the generator has never written.
  # FR | Une copie horodatee de dashboards/views/, gardee pour les trois
  # FR | autres scripts qui sauvegardent avant d'ecraser (la suppression
  # FR | ci-dessous porte la sienne). Elle copiait
  # FR | /config/dashboards/home.yaml, un chemin que le generateur n'a
  # FR | jamais ecrit.
  vssp_backup_dashboard: >-
    sh -c "d=/config/vssp/backups/views_$(date +%Y%m%d_%H%M%S) &&
    mkdir -p $d && cp -a /config/dashboards/views/. $d/ 2>/dev/null || true"
  # EN | SUPPRIMER TOUS LES DASHBOARDS. This was two shell one-liners, and
  # EN | the delete one never worked: shell_command splits the command with
  # EN | shlex before running it, which strips the inner quotes, so the
  # EN | shell expanded '*.yaml' in its own working directory before find
  # EN | could see the pattern — find failed and the button deleted nothing,
  # EN | silently, even with the right code. A Python file has no quotes to
  # EN | lose; it backs up dashboards/views/ and removes everything in it
  # EN | but the admin console.
  # FR | SUPPRIMER TOUS LES DASHBOARDS. C'etaient deux lignes shell, et celle
  # FR | qui supprime n'a jamais fonctionne : shell_command decoupe la
  # FR | commande avec shlex avant de l'executer, ce qui retire les
  # FR | guillemets internes ; le shell developpait donc '*.yaml' dans son
  # FR | propre repertoire courant avant que find ne voie le motif — find
  # FR | echouait et le bouton ne supprimait rien, en silence, meme avec le
  # FR | bon code. Un fichier Python n'a pas de guillemets a perdre ; il
  # FR | sauvegarde dashboards/views/ puis vide tout sauf la console.
  vssp_delete_dashboard: >-
    python3 /config/vssp/vssp_delete_dashboards.py
    --views /config/dashboards/views
    --backup-dir /config/vssp/backups
  # Generation des dashboards depuis le modele metier (etape 5).
  # Fusionne automatiquement model/house_rooms.yaml (produit par le
  # Discovery Wizard, phase 3) s'il est present, puis rend les
  # templates Jinja2 vers dashboards/views/ (validation YAML avant
  # ecriture : jamais de dashboard casse deploye).
  #
  # EN | --locale WAS MISSING HERE (and on every other generate_dashboards.py
  # EN | shell_command below). generate_dashboards.py's own precedence is
  # EN | --locale > house.locale > 'en' — without the flag, EVERY dashboard
  # EN | (this one, CREATE/REGENERATE HOME/ENERGY/CORE, even the preview
  # EN | commands) silently fell back to house.yaml's static `locale: fr`,
  # EN | ignoring input_select.vssp_language entirely. APPLY LANGUAGE's step
  # EN | 1 (shell_command.vssp_render_fragment, sidebar nav strings) DID read
  # EN | the selector correctly, which is what made this so easy to miss:
  # EN | the nav rail switched language, the page content underneath it
  # EN | silently did not. Found live: selecting "en" and running APPLY
  # EN | LANGUAGE kept regenerating every dashboard in French — confirmed by
  # EN | fetching the raw lovelace/config over the websocket, not just the
  # EN | rendered page, since a stale browser cache was the first (wrong)
  # EN | suspect.
  # FR | --locale MANQUAIT ICI (et sur chaque autre shell_command
  # FR | generate_dashboards.py ci-dessous). La priorite propre a
  # FR | generate_dashboards.py est --locale > house.locale > 'en' — sans le
  # FR | flag, CHAQUE dashboard (celui-ci, CREER/REGENERER HOME/ENERGY/CORE,
  # FR | meme les commandes d'apercu) retombait silencieusement sur le
  # FR | `locale: fr` statique de house.yaml, ignorant totalement
  # FR | input_select.vssp_language. L'etape 1 d'APPLIQUER LA LANGUE
  # FR | (shell_command.vssp_render_fragment, chaines du bandeau de nav) LUI
  # FR | lisait bien le selecteur, ce qui rendait la panne facile a manquer :
  # FR | le bandeau de nav changeait de langue, le contenu de page en dessous
  # FR | non, en silence. Trouve en direct : selectionner « en » puis lancer
  # FR | APPLIQUER LA LANGUE regenerait quand meme chaque dashboard en
  # FR | francais — confirme en recuperant le lovelace/config brut via le
  # FR | websocket, pas seulement la page rendue, puisqu'un cache navigateur
  # FR | perime etait le premier suspect (le mauvais).
  vssp_generate_dashboards: >-
    python3 /config/vssp/generate_dashboards.py
    --locale {{ states('input_select.vssp_language') }}
    --calendar-entity '{{ states('input_text.vssp_google_calendar_entity') }}'
    --model /config/dashboards/model/house.yaml
    --rooms /config/dashboards/model/house_rooms.yaml
    --devices /config/dashboards/model/energy_devices.yaml
    --design-model /config/dashboards/model/design_system.yaml
    --templates /config/dashboards/templates_j2
    --locales-dir /config/dashboards/locales
    --rooms-fragment /config/config-fragment-rooms.yaml
    --out /config/dashboards/views
    --status-file /config/www/vssp/preview_status.json

  # Ecrit le jeton du helper dans un fichier protege, lu ensuite par
  # les scripts Python. A relancer si vous changez de jeton.
  vssp_write_token: >-
    sh -c "mkdir -p /config/vssp &&
    printf '%s' '{{ states('input_text.vssp_ha_token') }}'
    > /config/vssp/.ha_token &&
    chmod 600 /config/vssp/.ha_token"

  # Meme motif que vssp_write_token, une fois par fournisseur de chatbot.
  # A relancer si vous changez de cle (script.vssp_save_<provider>_key).
  vssp_write_gemini_key: >-
    sh -c "mkdir -p /config/vssp &&
    printf '%s' '{{ states('input_text.vssp_gemini_api_key') }}'
    > /config/vssp/.gemini_key &&
    chmod 600 /config/vssp/.gemini_key"
  vssp_write_claude_key: >-
    sh -c "mkdir -p /config/vssp &&
    printf '%s' '{{ states('input_text.vssp_claude_api_key') }}'
    > /config/vssp/.claude_key &&
    chmod 600 /config/vssp/.claude_key"
  vssp_write_chatgpt_key: >-
    sh -c "mkdir -p /config/vssp &&
    printf '%s' '{{ states('input_text.vssp_chatgpt_api_key') }}'
    > /config/vssp/.chatgpt_key &&
    chmod 600 /config/vssp/.chatgpt_key"
  # La cle du chatbot custom est optionnelle : le fichier peut rester
  # vide, vssp_chatbot_send.py ne pose alors aucun header Authorization.
  vssp_write_custom_key: >-
    sh -c "mkdir -p /config/vssp &&
    printf '%s' '{{ states('input_text.vssp_chatbot_custom_api_key') }}'
    > /config/vssp/.custom_key &&
    chmod 600 /config/vssp/.custom_key"

  # ------------------------------------------------------------------
  # DASHBOARDS SYSTEME — creation / regeneration
  # ------------------------------------------------------------------
  # CREER : --if-missing garantit qu'un dashboard deja en place n'est
  # JAMAIS ecrase. Le bouton est donc sans risque, meme clique par
  # erreur sur une installation deja configuree. HOME est de toute facon
  # protege en permanence par generate_dashboards.py (--protect-existing
  # vaut "home" par defaut), meme si --if-missing n'etait pas passe ici.
  # EN | --rooms WAS MISSING on this command and on the five other
  # EN | create/regenerate commands below. They all pass --rooms-fragment,
  # EN | which rewrites the file declaring every room dashboard to Home
  # EN | Assistant — and they rebuilt it from house.yaml's rooms: alone,
  # EN | because generate_dashboards.py's --rooms default is a REPO-relative
  # EN | path that does not exist on the pod. With that list empty, one click
  # EN | on REGENERATE HOME unlinked every room in the console, leaving only
  # EN | CORE, ENERGY and ADMIN in the navigation rail. Confirmed live.
  # EN | The generator now also refuses such a rewrite on its own
  # EN | (--allow-empty-rooms opts out), so this is the first of two locks.
  # FR | --rooms MANQUAIT sur cette commande et sur les cinq autres commandes
  # FR | de creation/regeneration ci-dessous. Toutes passent --rooms-fragment,
  # FR | qui reecrit le fichier declarant chaque dashboard de piece a Home
  # FR | Assistant — et elles le reconstruisaient depuis le seul rooms: de
  # FR | house.yaml, car le defaut de --rooms dans generate_dashboards.py est
  # FR | un chemin relatif AU DEPOT, inexistant sur le pod. Cette liste vide,
  # FR | un clic sur REGENERER HOME deliait toutes les pieces de la console,
  # FR | ne laissant que CORE, ENERGY et ADMIN dans le bandeau de navigation.
  # FR | Confirme en production.
  # FR | Le generateur refuse desormais aussi une telle reecriture de lui-meme
  # FR | (--allow-empty-rooms y renonce) : ceci est le premier des deux verrous.
  # EN | --locale : see the note on vssp_generate_dashboards above.
  # FR | --locale : voir la note sur vssp_generate_dashboards plus haut.
  vssp_create_home: >-
    python3 /config/vssp/generate_dashboards.py
    --locale {{ states('input_select.vssp_language') }}
    --calendar-entity '{{ states('input_text.vssp_google_calendar_entity') }}'
    --only home --if-missing
    --model /config/dashboards/model/house.yaml
    --rooms /config/dashboards/model/house_rooms.yaml
    --devices /config/dashboards/model/energy_devices.yaml
    --design-model /config/dashboards/model/design_system.yaml
    --templates /config/dashboards/templates_j2
    --locales-dir /config/dashboards/locales
    --rooms-fragment /config/config-fragment-rooms.yaml
    --out /config/dashboards/views
    --status-file /config/www/vssp/preview_status.json

  # REGENERER : ecrase volontairement (apres sauvegarde par le script) —
  # seul moyen intentionnel d'ecraser HOME. --protect-existing "" est
  # INDISPENSABLE ici : sans lui, la protection par defaut de HOME
  # (activee par tous les autres appelants) bloquerait aussi ce bouton.
  # --locale : voir la note sur vssp_generate_dashboards plus haut.
  vssp_regenerate_home: >-
    python3 /config/vssp/generate_dashboards.py
    --locale {{ states('input_select.vssp_language') }}
    --calendar-entity '{{ states('input_text.vssp_google_calendar_entity') }}'
    --only home
    --protect-existing ""
    --model /config/dashboards/model/house.yaml
    --rooms /config/dashboards/model/house_rooms.yaml
    --devices /config/dashboards/model/energy_devices.yaml
    --design-model /config/dashboards/model/design_system.yaml
    --templates /config/dashboards/templates_j2
    --locales-dir /config/dashboards/locales
    --rooms-fragment /config/config-fragment-rooms.yaml
    --out /config/dashboards/views
    --status-file /config/www/vssp/preview_status.json

  # Sauvegarde ciblee du seul dashboard HOME.
  vssp_backup_home: >-
    sh -c "mkdir -p /config/vssp/backups &&
    [ -f /config/dashboards/views/home.yaml ] &&
    cp /config/dashboards/views/home.yaml
    /config/vssp/backups/home_$(date +%Y%m%d_%H%M%S).yaml || true"

  # DESACTIVER HOME : retire le tablette ET le mobile, pour que
  # binary_sensor.vssp_dashboard_home_present (qui ne surveille que le
  # premier) et le bandeau de nav (qui n'affiche HOME que si ce meme
  # fichier existe, cf. OPTIONAL_SYSTEM_NAV_IDS) s'accordent, sans
  # laisser le mobile orphelin derriere.
  vssp_delete_home: >-
    rm -f /config/dashboards/views/home.yaml
    /config/dashboards/views/home_mobile.yaml

  # CORE, contrairement a HOME, n'est jamais protege : comme ENERGY, il
  # reste une projection automatique du modele, jamais destine a une
  # edition manuelle.
  # --locale : voir la note sur vssp_generate_dashboards plus haut.
  vssp_create_core: >-
    python3 /config/vssp/generate_dashboards.py
    --locale {{ states('input_select.vssp_language') }}
    --calendar-entity '{{ states('input_text.vssp_google_calendar_entity') }}'
    --only core --if-missing
    --model /config/dashboards/model/house.yaml
    --rooms /config/dashboards/model/house_rooms.yaml
    --devices /config/dashboards/model/energy_devices.yaml
    --design-model /config/dashboards/model/design_system.yaml
    --templates /config/dashboards/templates_j2
    --locales-dir /config/dashboards/locales
    --rooms-fragment /config/config-fragment-rooms.yaml
    --out /config/dashboards/views
    --status-file /config/www/vssp/preview_status.json

  # --locale : voir la note sur vssp_generate_dashboards plus haut.
  vssp_regenerate_core: >-
    python3 /config/vssp/generate_dashboards.py
    --locale {{ states('input_select.vssp_language') }}
    --calendar-entity '{{ states('input_text.vssp_google_calendar_entity') }}'
    --only core
    --model /config/dashboards/model/house.yaml
    --rooms /config/dashboards/model/house_rooms.yaml
    --devices /config/dashboards/model/energy_devices.yaml
    --design-model /config/dashboards/model/design_system.yaml
    --templates /config/dashboards/templates_j2
    --locales-dir /config/dashboards/locales
    --rooms-fragment /config/config-fragment-rooms.yaml
    --out /config/dashboards/views
    --status-file /config/www/vssp/preview_status.json

  # Sauvegarde ciblee du seul dashboard CORE.
  vssp_backup_core: >-
    sh -c "mkdir -p /config/vssp/backups &&
    [ -f /config/dashboards/views/core.yaml ] &&
    cp /config/dashboards/views/core.yaml
    /config/vssp/backups/core_$(date +%Y%m%d_%H%M%S).yaml || true"

  vssp_delete_core: >-
    rm -f /config/dashboards/views/core.yaml
    /config/dashboards/views/core_mobile.yaml

  # --locale : voir la note sur vssp_generate_dashboards plus haut.
  vssp_create_energy: >-
    python3 /config/vssp/generate_dashboards.py
    --locale {{ states('input_select.vssp_language') }}
    --calendar-entity '{{ states('input_text.vssp_google_calendar_entity') }}'
    --only energy --if-missing
    --model /config/dashboards/model/house.yaml
    --rooms /config/dashboards/model/house_rooms.yaml
    --devices /config/dashboards/model/energy_devices.yaml
    --design-model /config/dashboards/model/design_system.yaml
    --templates /config/dashboards/templates_j2
    --locales-dir /config/dashboards/locales
    --rooms-fragment /config/config-fragment-rooms.yaml
    --out /config/dashboards/views
    --status-file /config/www/vssp/energy_generate_status.json

  # REGENERER : ecrase volontairement (apres sauvegarde par le script).
  # --locale : voir la note sur vssp_generate_dashboards plus haut.
  vssp_regenerate_energy: >-
    python3 /config/vssp/generate_dashboards.py
    --locale {{ states('input_select.vssp_language') }}
    --calendar-entity '{{ states('input_text.vssp_google_calendar_entity') }}'
    --only energy
    --model /config/dashboards/model/house.yaml
    --rooms /config/dashboards/model/house_rooms.yaml
    --devices /config/dashboards/model/energy_devices.yaml
    --design-model /config/dashboards/model/design_system.yaml
    --templates /config/dashboards/templates_j2
    --locales-dir /config/dashboards/locales
    --rooms-fragment /config/config-fragment-rooms.yaml
    --out /config/dashboards/views
    --status-file /config/www/vssp/energy_generate_status.json

  # Sauvegarde ciblee du seul dashboard ENERGY.
  vssp_backup_energy: >-
    sh -c "mkdir -p /config/vssp/backups &&
    [ -f /config/dashboards/views/energy.yaml ] &&
    cp /config/dashboards/views/energy.yaml
    /config/vssp/backups/energy_$(date +%Y%m%d_%H%M%S).yaml || true"

  vssp_delete_energy: >-
    rm -f /config/dashboards/views/energy.yaml
    /config/dashboards/views/energy_mobile.yaml

  # ------------------------------------------------------------------
  # ENERGY — synchronisation du parc d'appareils mesures
  # ------------------------------------------------------------------
  # Scanne HA, apparie les capteurs *_puissance / *_energie, met a jour
  # model/energy_devices.yaml (ajouts + circuits du tableau electrique).
  # SANS --prune : un appareil momentanement hors ligne reste affiche.
  # Le jeton est lu dans /config/vssp/.ha_token (voir le script
  # vssp_save_token ci-dessous). Il ne transite plus par la ligne de
  # commande : un helper vide donnait un 401 « Login attempt failed »
  # sans explication, et le jeton apparaissait en clair dans les
  # journaux et la table des processus.
  #
  # --images-dir est OBLIGATOIRE ici. Le defaut du script est un chemin
  # relatif au depot (home-assistant/www/vssp/modules) qui ne veut rien
  # dire cote pod : le scan y creerait une arborescence fantome sous le
  # repertoire courant, et les visuels produits telecharges ne seraient
  # jamais servis par /local/. Meme piege que --rooms-fragment sans
  # --rooms : un defaut pense pour le depot, execute sur l'instance.
  vssp_energy_sync: >-
    python3 /config/vssp/vssp_energy_sync.py
    --url http://localhost:8123
    --devices /config/dashboards/model/energy_devices.yaml
    --images-dir /config/www/vssp/modules
    --status-file /config/www/vssp/energy_sync_status.json

  # Idem, mais applique reellement les retraits (bouton PRUNE de l'ADMIN).
  vssp_energy_sync_prune: >-
    python3 /config/vssp/vssp_energy_sync.py
    --url http://localhost:8123
    --devices /config/dashboards/model/energy_devices.yaml
    --images-dir /config/www/vssp/modules
    --status-file /config/www/vssp/energy_sync_status.json
    --prune

  # Diff seul : rien n'est ecrit, le rapport dit ce qui changerait.
  # --no-images : un diff ne doit rien telecharger non plus.
  vssp_energy_sync_dryrun: >-
    python3 /config/vssp/vssp_energy_sync.py
    --url http://localhost:8123
    --devices /config/dashboards/model/energy_devices.yaml
    --status-file /config/www/vssp/energy_sync_status.json
    --no-images
    --dry-run

  # ------------------------------------------------------------------
  # APERCU — chaine de TEST, totalement isolee du staging
  # ------------------------------------------------------------------
  # 1) Ecrit le modele du wizard dans un fichier *.preview.yaml dedie.
  #    Le contenu arrive en base64 (variable content_b64) : pas de
  #    probleme de quoting ni d'accents dans les noms de pieces.
  vssp_write_preview_model: >-
    sh -c "mkdir -p /config/dashboards/model &&
    printf '%s' '{{ content_b64 }}' | base64 -d
    > /config/dashboards/model/house_rooms.preview.yaml"

  # 2) Genere energy_preview.yaml (url vssp-energy-preview) a partir du
  #    modele d'apercu. --preview garantit qu'aucun fichier de staging
  #    n'est ecrit : le nom de sortie et l'url_path sont suffixes.
  # --locale : voir la note sur vssp_generate_dashboards plus haut.
  vssp_generate_preview: >-
    python3 /config/vssp/generate_dashboards.py
    --locale {{ states('input_select.vssp_language') }}
    --calendar-entity '{{ states('input_text.vssp_google_calendar_entity') }}'
    --model /config/dashboards/model/house.yaml
    --rooms /config/dashboards/model/house_rooms.preview.yaml
    --design-model /config/dashboards/model/design_system.yaml
    --templates /config/dashboards/templates_j2
    --locales-dir /config/dashboards/locales
    --out /config/dashboards/views
    --preview
    --status-file /config/www/vssp/preview_status.json

  # 3) Validation seule : ne produit aucun fichier, juste le rapport.
  # --locale : voir la note sur vssp_generate_dashboards plus haut.
  vssp_validate_preview: >-
    python3 /config/vssp/generate_dashboards.py
    --locale {{ states('input_select.vssp_language') }}
    --calendar-entity '{{ states('input_text.vssp_google_calendar_entity') }}'
    --model /config/dashboards/model/house.yaml
    --rooms /config/dashboards/model/house_rooms.preview.yaml
    --design-model /config/dashboards/model/design_system.yaml
    --templates /config/dashboards/templates_j2
    --locales-dir /config/dashboards/locales
    --out /config/dashboards/views
    --preview --dry-run
    --status-file /config/www/vssp/preview_status.json

  # 4) Nettoyage des fichiers d'apercu (jamais ceux du staging).
  vssp_clean_preview: >-
    sh -c "rm -f /config/dashboards/views/energy_preview.yaml
    /config/dashboards/model/house_rooms.preview.yaml
    /config/www/vssp/preview_status.json"

# --------------------------------------------------------------------
# SCRIPTS — la logique appelee par les boutons du dashboard ADMIN
# --------------------------------------------------------------------
script:
  vssp_run_discovery:
    alias: "Visio Sapiens — Lancer la découverte"
    sequence:
      - service: shell_command.vssp_discovery
      - service: persistent_notification.create
        data:
          title: "Visio Sapiens — Découverte terminée"
          message: >
            Rapport généré dans /config/vssp/report.json.
            Consulte-le pour voir les nouvelles entités par pièce.

  vssp_run_upgrade:
    alias: "Visio Sapiens — Mettre à jour le dashboard"
    sequence:
      - service: shell_command.vssp_backup_dashboard
      - service: shell_command.vssp_upgrade
      - service: persistent_notification.create
        data:
          title: "Visio Sapiens — Mise à jour appliquée"
          message: >
            Le dashboard a été régénéré à partir des dernières entités
            découvertes. Une sauvegarde de l'ancienne version a été
            conservée dans /config/vssp/backups/.

  # Appele par la phase 5 du Discovery Wizard, ou par un futur bouton
  # GENERATE du panneau ADMIN (template: vssp_admin_button).
  vssp_run_generate:
    alias: "Visio Sapiens — Régénérer les dashboards"
    sequence:
      - service: shell_command.vssp_backup_dashboard
      - service: shell_command.vssp_generate_dashboards
      - service: persistent_notification.create
        data:
          title: "Visio Sapiens — Dashboards régénérés"
          message: >
            energy.yaml a été régénéré depuis model/house.yaml
            (+ house_rooms.yaml du wizard s'il existe).
            Rechargez Lovelace pour voir le résultat.

  # A lancer UNE FOIS apres avoir colle le jeton dans le helper
  # input_text.vssp_ha_token, et a chaque changement de jeton.
  vssp_save_token:
    alias: "Visio Sapiens — Enregistrer le jeton API"
    sequence:
      - if:
          - condition: template
            value_template: >-
              {{ states('input_text.vssp_ha_token') | length > 50 }}
        then:
          - service: shell_command.vssp_write_token
          - service: persistent_notification.create
            data:
              title: "Visio Sapiens — Jeton enregistre"
              message: >
                Le jeton a ete ecrit dans /config/vssp/.ha_token.
                Les boutons SYNC et REGENERER peuvent maintenant
                interroger l'API. Vous pouvez vider le helper
                input_text.vssp_ha_token si vous le souhaitez : le
                fichier fait desormais foi.
        else:
          - service: persistent_notification.create
            data:
              title: "Visio Sapiens — Jeton invalide"
              message: >
                Le helper input_text.vssp_ha_token est vide ou trop
                court. Collez-y un jeton longue duree
                (Profil > Securite > Jetons d'acces longue duree),
                puis relancez ce script.

  # Meme motif que vssp_save_token, une fois par fournisseur de chatbot.
  # A lancer apres avoir colle la cle dans le helper correspondant, et a
  # chaque changement de cle.
  vssp_save_gemini_key:
    alias: "Visio Sapiens — Enregistrer la cle Gemini"
    sequence:
      - if:
          - condition: template
            value_template: "{{ states('input_text.vssp_gemini_api_key') | length > 10 }}"
        then:
          - service: shell_command.vssp_write_gemini_key
          - service: persistent_notification.create
            data:
              title: "Visio Sapiens — Cle Gemini enregistree"
              message: "Ecrite dans /config/vssp/.gemini_key."
        else:
          - service: persistent_notification.create
            data:
              title: "Visio Sapiens — Cle Gemini invalide"
              message: "Le helper input_text.vssp_gemini_api_key est vide ou trop court."

  vssp_save_claude_key:
    alias: "Visio Sapiens — Enregistrer la cle Claude"
    sequence:
      - if:
          - condition: template
            value_template: "{{ states('input_text.vssp_claude_api_key') | length > 10 }}"
        then:
          - service: shell_command.vssp_write_claude_key
          - service: persistent_notification.create
            data:
              title: "Visio Sapiens — Cle Claude enregistree"
              message: "Ecrite dans /config/vssp/.claude_key."
        else:
          - service: persistent_notification.create
            data:
              title: "Visio Sapiens — Cle Claude invalide"
              message: "Le helper input_text.vssp_claude_api_key est vide ou trop court."

  vssp_save_chatgpt_key:
    alias: "Visio Sapiens — Enregistrer la cle ChatGPT"
    sequence:
      - if:
          - condition: template
            value_template: "{{ states('input_text.vssp_chatgpt_api_key') | length > 10 }}"
        then:
          - service: shell_command.vssp_write_chatgpt_key
          - service: persistent_notification.create
            data:
              title: "Visio Sapiens — Cle ChatGPT enregistree"
              message: "Ecrite dans /config/vssp/.chatgpt_key."
        else:
          - service: persistent_notification.create
            data:
              title: "Visio Sapiens — Cle ChatGPT invalide"
              message: "Le helper input_text.vssp_chatgpt_api_key est vide ou trop court."

  # La cle du chatbot custom est optionnelle : contrairement aux trois
  # scripts ci-dessus, un helper vide est un cas normal (serveur local
  # sans authentification) et ecrit quand meme un fichier vide.
  vssp_save_custom_key:
    alias: "Visio Sapiens — Enregistrer la cle du chatbot custom"
    sequence:
      - service: shell_command.vssp_write_custom_key
      - service: persistent_notification.create
        data:
          title: "Visio Sapiens — Cle custom enregistree"
          message: >
            Ecrite dans /config/vssp/.custom_key (vide si le serveur
            n'exige pas d'authentification).

  # Bouton CREER LE DASHBOARD ENERGY du panneau ADMIN.
  # Idempotent : si le dashboard existe deja, il n'est pas touche et le
  # script se contente de le dire.
  vssp_create_energy_dashboard:
    alias: "Visio Sapiens — Créer le dashboard ENERGY"
    sequence:
      # 1. Partir du parc d'appareils reel plutot que d'un modele vide
      - service: shell_command.vssp_energy_sync
      # 2. Generer uniquement s'il manque
      - service: shell_command.vssp_create_energy
      # Pas de service de rechargement : `lovelace.reload` n'existe pas
      # dans Home Assistant. Un dashboard en mode YAML est relu tout seul
      # au prochain affichage (HA compare la date du fichier). Seul
      # l'onglet deja ouvert garde l'ancienne version en memoire.
      # 3. Laisser le capteur d'existence se rafraichir avant le message
      # EN | The screen reads this sensor, and it polls the disk every 30 s:
      # EN | without this, the row's toggle and the navigation rail kept the
      # EN | old state for up to half a minute after the file had moved. The
      # EN | shell_command above is awaited, so the file is in its final
      # EN | state here and one poll tells the truth.
      # FR | L'ecran lit ce capteur, qui interroge le disque toutes les 30 s :
      # FR | sans ceci, l'interrupteur de la ligne et le bandeau de navigation
      # FR | gardaient l'ancien etat pendant une demi-minute apres le
      # FR | deplacement du fichier. Le shell_command ci-dessus est attendu,
      # FR | le fichier est donc dans son etat final ici et une lecture suffit.
      - service: homeassistant.update_entity
        target:
          entity_id: binary_sensor.vssp_dashboard_energy_present
      - service: persistent_notification.create
        data:
          title: "Visio Sapiens — Dashboard ENERGY"
          message: >
            {% if is_state('binary_sensor.vssp_dashboard_energy_present', 'on') %}
              Dashboard ENERGY disponible sur /vssp-energy/energy
              ({{ states('sensor.vssp_dashboard_energy_modifie') }}).
              Rafraichissez l'onglet (Ctrl+Maj+R) pour le voir.
              Si l'entree n'apparait pas dans la barre laterale, verifiez
              que vssp-energy est bien declare dans config-fragment.yaml.
            {% else %}
              La generation a echoue. Consultez
              /config/www/vssp/energy_generate_status.json pour le detail
              des erreurs de validation du modele.
            {% endif %}

  # Bouton REGENERER : ecrase le dashboard existant, apres sauvegarde.
  vssp_regenerate_energy_dashboard:
    alias: "Visio Sapiens — Régénérer le dashboard ENERGY"
    sequence:
      - service: shell_command.vssp_backup_energy
      # Pas de continue_on_error : si le scan echoue (jeton absent ou
      # invalide, HA injoignable), il ne faut PAS regenerer derriere —
      # cela ecraserait le dashboard avec un modele vide.
      - service: shell_command.vssp_energy_sync
      - service: shell_command.vssp_regenerate_energy
      # Pas de service de rechargement : `lovelace.reload` n'existe pas
      # dans Home Assistant. Un dashboard en mode YAML est relu tout seul
      # au prochain affichage (HA compare la date du fichier). Seul
      # l'onglet deja ouvert garde l'ancienne version en memoire.
      # EN | The screen reads this sensor, and it polls the disk every 30 s:
      # EN | without this, the row's toggle and the navigation rail kept the
      # EN | old state for up to half a minute after the file had moved. The
      # EN | shell_command above is awaited, so the file is in its final
      # EN | state here and one poll tells the truth.
      # FR | L'ecran lit ce capteur, qui interroge le disque toutes les 30 s :
      # FR | sans ceci, l'interrupteur de la ligne et le bandeau de navigation
      # FR | gardaient l'ancien etat pendant une demi-minute apres le
      # FR | deplacement du fichier. Le shell_command ci-dessus est attendu,
      # FR | le fichier est donc dans son etat final ici et une lecture suffit.
      - service: homeassistant.update_entity
        target:
          entity_id: binary_sensor.vssp_dashboard_energy_present
      - service: persistent_notification.create
        data:
          title: "Visio Sapiens — Dashboard ENERGY régénéré"
          message: >
            {% set n = states('sensor.vssp_modele_appareils') | int(0) %}
            {% if n > 0 %}
              Tableaux mis a jour : {{ n }} appareil(s) et
              {{ states('sensor.vssp_modele_circuits') }} circuit(s).
              Rafraichissez l'onglet (Ctrl+Maj+R).
            {% else %}
              ATTENTION — le modele est vide, les tableaux le seront
              aussi. Verifiez le jeton API (script vssp_save_token) puis
              relancez. Sauvegarde de la version precedente dans
              /config/vssp/backups/.
            {% endif %}

  # Bouton DESACTIVER LE DASHBOARD ENERGY du panneau ADMIN. Sauvegarde
  # puis retire tablette + mobile ; binary_sensor.vssp_dashboard_energy_present
  # repasse a OFF au prochain scan_interval (60 s), donc ce bouton
  # redevient CREER ENERGY au prochain affichage de ce panneau.
  # EN | The bandeau on OTHER dashboards (home, admin, core, every room)
  # EN | is baked in at THEIR OWN last generation — it does not know
  # EN | ENERGY is gone until each of them is regenerated too. Deleting
  # EN | energy.yaml makes /vssp-energy/energy itself unreachable right
  # EN | away; the (now dead) ENERGY link on every other page's rail only
  # EN | disappears after RÉGÉNÉRER LES DASHBOARDS (script.vssp_run_generate)
  # EN | or the next full CI deploy.
  # FR | Le bandeau des AUTRES dashboards (home, admin, core, chaque
  # FR | piece) est fige a LEUR propre derniere generation — il ne sait
  # FR | pas qu ENERGY a disparu tant que chacun d eux n a pas ete
  # FR | regenere aussi. Supprimer energy.yaml rend /vssp-energy/energy
  # FR | lui-meme injoignable immediatement ; le lien ENERGY (desormais
  # FR | mort) sur le bandeau de chaque autre page ne disparait qu apres
  # FR | RÉGÉNÉRER LES DASHBOARDS (script.vssp_run_generate) ou le
  # FR | prochain deploiement CI complet.
  vssp_deactivate_energy_dashboard:
    alias: "Visio Sapiens — Désactiver le dashboard ENERGY"
    sequence:
      - service: shell_command.vssp_backup_energy
      - service: shell_command.vssp_delete_energy
      # EN | The screen reads this sensor, and it polls the disk every 30 s:
      # EN | without this, the row's toggle and the navigation rail kept the
      # EN | old state for up to half a minute after the file had moved. The
      # EN | shell_command above is awaited, so the file is in its final
      # EN | state here and one poll tells the truth.
      # FR | L'ecran lit ce capteur, qui interroge le disque toutes les 30 s :
      # FR | sans ceci, l'interrupteur de la ligne et le bandeau de navigation
      # FR | gardaient l'ancien etat pendant une demi-minute apres le
      # FR | deplacement du fichier. Le shell_command ci-dessus est attendu,
      # FR | le fichier est donc dans son etat final ici et une lecture suffit.
      - service: homeassistant.update_entity
        target:
          entity_id: binary_sensor.vssp_dashboard_energy_present
      - service: persistent_notification.create
        data:
          title: "Visio Sapiens — Dashboard ENERGY désactivé"
          message: >
            Une sauvegarde a été conservée dans /config/vssp/backups/. Le
            dashboard ENERGY est immédiatement injoignable et son lien
            disparaît du bandeau de toutes les pages sur-le-champ. La
            désactivation est définitive : ni une régénération, ni une sync
            ROOMS, ni un déploiement ne le recréeront — seul le bouton
            CRÉER ENERGY le fait revenir. Son entrée du menu latéral de
            Home Assistant vient de configuration.yaml : elle reste
            jusqu'au prochain redémarrage (bouton REDÉMARRER HOME ASSISTANT
            de l'écran MAINTENANCE), et y taper ouvre une page en erreur.

  # Bouton CREER LE DASHBOARD HOME du panneau ADMIN.
  # Idempotent : generate_dashboards.py protege deja HOME par defaut
  # (DEFAULT_PROTECTED_DASHBOARD_IDS = "home"), donc ce shell_command
  # n'ecrase jamais un HOME existant meme sans --if-missing.
  vssp_create_home_dashboard:
    alias: "Visio Sapiens — Créer le dashboard HOME"
    sequence:
      - service: shell_command.vssp_create_home
      # Pas de service de rechargement : `lovelace.reload` n'existe pas
      # dans Home Assistant. Un dashboard en mode YAML est relu tout seul
      # au prochain affichage (HA compare la date du fichier).
      # EN | The screen reads this sensor, and it polls the disk every 30 s:
      # EN | without this, the row's toggle and the navigation rail kept the
      # EN | old state for up to half a minute after the file had moved. The
      # EN | shell_command above is awaited, so the file is in its final
      # EN | state here and one poll tells the truth.
      # FR | L'ecran lit ce capteur, qui interroge le disque toutes les 30 s :
      # FR | sans ceci, l'interrupteur de la ligne et le bandeau de navigation
      # FR | gardaient l'ancien etat pendant une demi-minute apres le
      # FR | deplacement du fichier. Le shell_command ci-dessus est attendu,
      # FR | le fichier est donc dans son etat final ici et une lecture suffit.
      - service: homeassistant.update_entity
        target:
          entity_id: binary_sensor.vssp_dashboard_home_present
      - service: persistent_notification.create
        data:
          title: "Visio Sapiens — Dashboard HOME"
          message: >
            {% if is_state('binary_sensor.vssp_dashboard_home_present', 'on') %}
              Dashboard HOME disponible sur /visio-sapiens/home.
              Rafraichissez l'onglet (Ctrl+Maj+R) pour le voir.
            {% else %}
              La génération a échoué. Consultez
              /config/www/vssp/preview_status.json pour le détail des
              erreurs de validation du modèle.
            {% endif %}

  # Bouton REGENERER : ecrase volontairement HOME (apres sauvegarde) —
  # seul appelant qui passe --protect-existing "" pour s'exempter de la
  # protection par defaut, voir vssp_regenerate_home ci-dessus.
  vssp_regenerate_home_dashboard:
    alias: "Visio Sapiens — Régénérer le dashboard HOME"
    sequence:
      - service: shell_command.vssp_backup_home
      - service: shell_command.vssp_regenerate_home
      # EN | The screen reads this sensor, and it polls the disk every 30 s:
      # EN | without this, the row's toggle and the navigation rail kept the
      # EN | old state for up to half a minute after the file had moved. The
      # EN | shell_command above is awaited, so the file is in its final
      # EN | state here and one poll tells the truth.
      # FR | L'ecran lit ce capteur, qui interroge le disque toutes les 30 s :
      # FR | sans ceci, l'interrupteur de la ligne et le bandeau de navigation
      # FR | gardaient l'ancien etat pendant une demi-minute apres le
      # FR | deplacement du fichier. Le shell_command ci-dessus est attendu,
      # FR | le fichier est donc dans son etat final ici et une lecture suffit.
      - service: homeassistant.update_entity
        target:
          entity_id: binary_sensor.vssp_dashboard_home_present
      - service: persistent_notification.create
        data:
          title: "Visio Sapiens — Dashboard HOME régénéré"
          message: >
            Toute modification manuelle de la mise en page a été
            écrasée. Une sauvegarde de la version précédente a été
            conservée dans /config/vssp/backups/. Rafraichissez
            l'onglet (Ctrl+Maj+R).

  # Bouton DESACTIVER LE DASHBOARD HOME du panneau ADMIN.
  # FR | Meme limite qu ENERGY (voir vssp_deactivate_energy_dashboard) :
  # FR | le bandeau des autres pages ne perd le lien HOME qu apres
  # FR | RÉGÉNÉRER LES DASHBOARDS ou le prochain deploiement CI.
  vssp_deactivate_home_dashboard:
    alias: "Visio Sapiens — Désactiver le dashboard HOME"
    sequence:
      - service: shell_command.vssp_backup_home
      - service: shell_command.vssp_delete_home
      # EN | The screen reads this sensor, and it polls the disk every 30 s:
      # EN | without this, the row's toggle and the navigation rail kept the
      # EN | old state for up to half a minute after the file had moved. The
      # EN | shell_command above is awaited, so the file is in its final
      # EN | state here and one poll tells the truth.
      # FR | L'ecran lit ce capteur, qui interroge le disque toutes les 30 s :
      # FR | sans ceci, l'interrupteur de la ligne et le bandeau de navigation
      # FR | gardaient l'ancien etat pendant une demi-minute apres le
      # FR | deplacement du fichier. Le shell_command ci-dessus est attendu,
      # FR | le fichier est donc dans son etat final ici et une lecture suffit.
      - service: homeassistant.update_entity
        target:
          entity_id: binary_sensor.vssp_dashboard_home_present
      - service: persistent_notification.create
        data:
          title: "Visio Sapiens — Dashboard HOME désactivé"
          message: >
            Une sauvegarde a été conservée dans /config/vssp/backups/. Le
            dashboard HOME est immédiatement injoignable et son lien
            disparaît du bandeau de toutes les pages sur-le-champ. La
            désactivation est définitive : ni une régénération, ni une sync
            ROOMS, ni un déploiement ne le recréeront — seul le bouton
            CRÉER HOME le fait revenir. Son entrée du menu latéral de Home
            Assistant vient de configuration.yaml : elle reste jusqu'au
            prochain redémarrage (bouton REDÉMARRER HOME ASSISTANT de
            l'écran MAINTENANCE), et y taper ouvre une page en erreur.

  # Bouton CREER LE DASHBOARD CORE du panneau ADMIN. Idempotent
  # (--if-missing) : CORE n'est jamais destine a une edition manuelle,
  # contrairement a HOME, donc rien n'a besoin d'etre protege ici.
  vssp_create_core_dashboard:
    alias: "Visio Sapiens — Créer le dashboard CORE"
    sequence:
      - service: shell_command.vssp_create_core
      # EN | The screen reads this sensor, and it polls the disk every 30 s:
      # EN | without this, the row's toggle and the navigation rail kept the
      # EN | old state for up to half a minute after the file had moved. The
      # EN | shell_command above is awaited, so the file is in its final
      # EN | state here and one poll tells the truth.
      # FR | L'ecran lit ce capteur, qui interroge le disque toutes les 30 s :
      # FR | sans ceci, l'interrupteur de la ligne et le bandeau de navigation
      # FR | gardaient l'ancien etat pendant une demi-minute apres le
      # FR | deplacement du fichier. Le shell_command ci-dessus est attendu,
      # FR | le fichier est donc dans son etat final ici et une lecture suffit.
      - service: homeassistant.update_entity
        target:
          entity_id: binary_sensor.vssp_dashboard_core_present
      - service: persistent_notification.create
        data:
          title: "Visio Sapiens — Dashboard CORE"
          message: >
            {% if is_state('binary_sensor.vssp_dashboard_core_present', 'on') %}
              Dashboard CORE disponible sur /visio-sapiens-core/core.
              Rafraichissez l'onglet (Ctrl+Maj+R) pour le voir.
            {% else %}
              La génération a échoué. Consultez
              /config/www/vssp/preview_status.json pour le détail des
              erreurs de validation du modèle.
            {% endif %}

  # Bouton REGENERER : ecrase volontairement CORE (apres sauvegarde).
  vssp_regenerate_core_dashboard:
    alias: "Visio Sapiens — Régénérer le dashboard CORE"
    sequence:
      - service: shell_command.vssp_backup_core
      - service: shell_command.vssp_regenerate_core
      # EN | The screen reads this sensor, and it polls the disk every 30 s:
      # EN | without this, the row's toggle and the navigation rail kept the
      # EN | old state for up to half a minute after the file had moved. The
      # EN | shell_command above is awaited, so the file is in its final
      # EN | state here and one poll tells the truth.
      # FR | L'ecran lit ce capteur, qui interroge le disque toutes les 30 s :
      # FR | sans ceci, l'interrupteur de la ligne et le bandeau de navigation
      # FR | gardaient l'ancien etat pendant une demi-minute apres le
      # FR | deplacement du fichier. Le shell_command ci-dessus est attendu,
      # FR | le fichier est donc dans son etat final ici et une lecture suffit.
      - service: homeassistant.update_entity
        target:
          entity_id: binary_sensor.vssp_dashboard_core_present
      - service: persistent_notification.create
        data:
          title: "Visio Sapiens — Dashboard CORE régénéré"
          message: >
            Une sauvegarde de la version précédente a été conservée
            dans /config/vssp/backups/. Rafraichissez l'onglet
            (Ctrl+Maj+R).

  # Bouton DESACTIVER LE DASHBOARD CORE du panneau ADMIN.
  # FR | Meme limite qu ENERGY (voir vssp_deactivate_energy_dashboard) :
  # FR | le bandeau des autres pages ne perd le lien CORE qu apres
  # FR | RÉGÉNÉRER LES DASHBOARDS ou le prochain deploiement CI.
  vssp_deactivate_core_dashboard:
    alias: "Visio Sapiens — Désactiver le dashboard CORE"
    sequence:
      - service: shell_command.vssp_backup_core
      - service: shell_command.vssp_delete_core
      # EN | The screen reads this sensor, and it polls the disk every 30 s:
      # EN | without this, the row's toggle and the navigation rail kept the
      # EN | old state for up to half a minute after the file had moved. The
      # EN | shell_command above is awaited, so the file is in its final
      # EN | state here and one poll tells the truth.
      # FR | L'ecran lit ce capteur, qui interroge le disque toutes les 30 s :
      # FR | sans ceci, l'interrupteur de la ligne et le bandeau de navigation
      # FR | gardaient l'ancien etat pendant une demi-minute apres le
      # FR | deplacement du fichier. Le shell_command ci-dessus est attendu,
      # FR | le fichier est donc dans son etat final ici et une lecture suffit.
      - service: homeassistant.update_entity
        target:
          entity_id: binary_sensor.vssp_dashboard_core_present
      - service: persistent_notification.create
        data:
          title: "Visio Sapiens — Dashboard CORE désactivé"
          message: >
            Une sauvegarde a été conservée dans /config/vssp/backups/. Le
            dashboard CORE est immédiatement injoignable et son lien
            disparaît du bandeau de toutes les pages sur-le-champ. La
            désactivation est définitive : ni une régénération, ni une sync
            ROOMS, ni un déploiement ne le recréeront — seul le bouton
            CRÉER CORE le fait revenir. Son entrée du menu latéral de Home
            Assistant vient de configuration.yaml : elle reste jusqu'au
            prochain redémarrage (bouton REDÉMARRER HOME ASSISTANT de
            l'écran MAINTENANCE), et y taper ouvre une page en erreur.

  # Bouton SYNC ENERGY du panneau ADMIN : resynchronise les tableaux
  # « Consommation par appareil » et « Tableau electrique » avec les
  # appareils reellement presents dans Home Assistant.
  vssp_run_energy_sync:
    alias: "Visio Sapiens — Synchroniser ENERGY"
    fields:
      prune:
        description: "true = retirer aussi les appareils absents de HA"
        example: false
    sequence:
      - service: shell_command.vssp_backup_dashboard
      - if:
          - condition: template
            value_template: "{{ prune | default(false) }}"
        then:
          - service: shell_command.vssp_energy_sync_prune
        else:
          - service: shell_command.vssp_energy_sync
      - service: shell_command.vssp_generate_dashboards
      # Pas de service de rechargement : `lovelace.reload` n'existe pas
      # dans Home Assistant. Un dashboard en mode YAML est relu tout seul
      # au prochain affichage (HA compare la date du fichier). Seul
      # l'onglet deja ouvert garde l'ancienne version en memoire.
      - service: persistent_notification.create
        data:
          title: "Visio Sapiens — ENERGY synchronise"
          message: >
            {% set n = states('sensor.vssp_modele_appareils') | int(0) %}
            {% set c = states('sensor.vssp_modele_circuits') | int(0) %}
            {% set vus = states('sensor.vssp_appareils_mesures') | int(0) %}
            {% if n > 0 %}
              Tableaux regeneres : {{ n }} appareil(s) et {{ c }} circuit(s)
              ecrits dans le modele. Rafraichissez l'onglet (Ctrl+Maj+R).
            {% else %}
              ECHEC — le modele est vide alors que Home Assistant expose
              {{ vus }} appareil(s) mesure(s). Le scan n'a pas pu ecrire
              /config/dashboards/model/energy_devices.yaml.
              Cause la plus frequente : jeton API absent ou invalide
              (lancez le script vssp_save_token, ou creez
              /config/vssp/.ha_token). Detail dans
              /config/www/vssp/energy_sync_status.json.
            {% endif %}

  # Appele par la phase 4 du Discovery Wizard (bouton APERCU).
  # Boucle d'iteration : on peut le relancer autant de fois que voulu,
  # il ne touche que les fichiers *_preview / *.preview.yaml.
  vssp_preview_dashboards:
    alias: "Visio Sapiens — Générer l'aperçu de test"
    fields:
      content_b64:
        description: "Modèle rooms (house_rooms.yaml) encodé en base64"
        example: "cm9vbXM6Cg=="
      dry_run:
        description: "true = valider seulement, sans écrire de dashboard"
        example: false
    sequence:
      - service: shell_command.vssp_write_preview_model
        data:
          content_b64: "{{ content_b64 }}"
      - if:
          - condition: template
            value_template: "{{ dry_run | default(false) }}"
        then:
          - service: shell_command.vssp_validate_preview
        else:
          - service: shell_command.vssp_generate_preview
          # Recharge Lovelace pour que l'apercu apparaisse tout de suite.
          # Sans effet sur le contenu des dashboards de staging.
          # Pas de service de rechargement : `lovelace.reload` n'existe pas
      # dans Home Assistant. Un dashboard en mode YAML est relu tout seul
      # au prochain affichage (HA compare la date du fichier). Seul
      # l'onglet deja ouvert garde l'ancienne version en memoire.

  vssp_delete_dashboard:
    alias: "Visio Sapiens — Supprimer tous les dashboards (protégé par code)"
    sequence:
      # EN | THE FIELD IS COMMITTED ON BLUR, THE BUTTON FIRES ON CLICK — and
      # EN | the click wins. Typing the code then pressing DELETE ran this
      # EN | script against the PREVIOUS value of the helper (empty), so a
      # EN | correct code was rejected; the trace of the failed run showed the
      # EN | condition reading an empty field. This waits for the value to
      # EN | land, at most two seconds, instead of racing it.
      # FR | LE CHAMP SE VALIDE EN PERDANT LE FOCUS, LE BOUTON PART AU CLIC —
      # FR | et le clic gagne. Taper le code puis appuyer sur SUPPRIMER
      # FR | lançait ce script sur la valeur PRECEDENTE du helper (vide), donc
      # FR | un code correct etait refuse ; la trace de l'essai rate montrait
      # FR | la condition lisant un champ vide. On attend que la valeur
      # FR | arrive, deux secondes au plus, au lieu de lui courir apres.
      - wait_template: >-
          {{ states('input_text.vssp_pin_entry') not in ['', 'unknown', 'unavailable'] }}
        timeout: "00:00:02"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: >-
              {{ states('input_text.vssp_pin_entry') not in ['', 'unknown', 'unavailable']
                 and states('input_text.vssp_pin_entry') == states('input_text.vssp_admin_pin') }}
        then:
          # EN | Backup and delete in one call: the script copies views/
          # EN | first and stops on a failed copy, so a half-done deletion
          # EN | cannot happen between two service calls.
          # FR | Sauvegarde et suppression en un seul appel : le script copie
          # FR | views/ d'abord et s'arrete si la copie echoue, donc pas de
          # FR | suppression a moitie faite entre deux appels de service.
          - service: shell_command.vssp_delete_dashboard
            response_variable: deleted
          - service: persistent_notification.create
            data:
              title: "Visio Sapiens — Dashboards supprimés"
              message: >
                {{ deleted.stdout | default('') }}
                La console d'administration est conservée, sinon plus rien ne
                permettrait de régénérer. Une copie complète de
                dashboards/views/ a été gardée dans /config/vssp/backups/.
                Leurs entrées restent dans le menu latéral de Home
                Assistant jusqu'au prochain redémarrage — elles viennent de
                configuration.yaml, pas des fichiers supprimés : le bouton
                REDÉMARRER HOME ASSISTANT de l'écran MAINTENANCE les enlève.
                Pour reconstruire : RÉGÉNÉRER TOUT ramène les pièces et la
                console. HOME, CORE et ENERGY sont des dashboards à la
                demande : ils restent éteints tant que vous ne les recréez
                pas avec leur bouton CRÉER, et aucune régénération ne les
                fera revenir dans votre dos.
        else:
          # EN | The two failures read the same from the button, so they are
          # EN | told apart here: nothing typed, or the wrong code.
          # FR | Les deux echecs se ressemblent depuis le bouton, on les
          # FR | distingue donc ici : rien de saisi, ou code faux.
          - service: persistent_notification.create
            data:
              title: "Visio Sapiens — Échec de suppression"
              message: >-
                {% if states('input_text.vssp_admin_pin') in ['', 'unknown', 'unavailable'] %}
                Aucun code administrateur n'est défini sur cette instance, donc
                aucune saisie ne peut correspondre. Renseignez-en un dans le
                champ « Code administrateur » du même popup, puis retapez-le
                au-dessus pour confirmer la suppression.
                {% elif states('input_text.vssp_pin_entry') in ['', 'unknown', 'unavailable'] %}
                Aucun code saisi. Tapez le code administrateur dans le champ
                « Saisissez le code PIN » du popup, puis relancez la
                suppression.
                {% else %}
                Code incorrect. Aucune action effectuée. Si vous ne connaissez
                plus le code, redéfinissez-le dans le champ « Code
                administrateur » du même popup.
                {% endif %}
      # Toujours vider le champ de saisie, succes ou echec (hygiene de securite)
      - service: input_text.set_value
        target:
          entity_id: input_text.vssp_pin_entry
        data:
          value: ""

  # A lancer UNE SEULE FOIS a la main pour definir ton code admin,
  # puis supprime/desactive ce script pour eviter qu'il soit relance.
  vssp_set_admin_pin:
    alias: "Visio Sapiens — Définir le code admin (à usage unique)"
    sequence:
      - service: input_text.set_value
        target:
          entity_id: input_text.vssp_admin_pin
        data:
          value: "CHANGE_MOI_1234"  # <-- remplace par ton vrai code avant de lancer

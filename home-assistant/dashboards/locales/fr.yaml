  updates_infra_images: image(s)
  updates_infra_security: sécurité
  updates_infra_uptodate: à jour
  updates_infra_required: redémarrage requis
  updates_infra_not_required: aucun redémarrage requis
  updates_infra_notprobed: non sondé
  updates_infra_auto_enabled: Mettre à jour l'infrastructure automatiquement
  updates_infra_never_probed: >-
    Jamais sondé. Appuyez sur SONDER LE SERVEUR, et vérifiez que le
    coffre-fort contient vssp/infra/host_ssh si rien ne revient.
  updates_infra_locked_note: >-
    Une seule étape par pression : chaque composant n'avance que jusqu'à la
    version où son éditeur supporte d'arriver, jamais directement jusqu'à la
    plus récente. Les lignes verrouillées disent chacune pourquoi elles le
    sont.
  updates_infra_reboot_note: L'hôte attend un redémarrage

  # EN | The probe's own failures, for the two that need no variables and that
  # EN | an operator can actually act on. Everything else falls back to the
  # EN | English the script rendered.
  # FR | Les échecs de la sonde, pour les deux qui n'ont pas de variables et
  # FR | sur lesquels un opérateur peut réellement agir. Tout le reste retombe
  # FR | sur l'anglais rendu par le script.
  updates_infra_msg_sealed: >-
    Le coffre-fort est scellé : la sonde ne peut pas y lire l'accès SSH à
    l'hôte. Les lignes grisées ci-dessous sont la dernière mesure connue, pas
    l'état actuel, et aucune installation ne peut partir. Sur l'hôte, trois
    fois, une clé différente à chaque appel — puis SONDER LE SERVEUR.

  # EN | Prefixes a date. "measured 11/09/2026 14:00" — the row holds a real
  # EN | measurement from an earlier run, and this says which run.
  # FR | Précède une date. « mesuré le 11/09/2026 14:00 » — la ligne porte une
  # FR | vraie mesure d'une exécution antérieure, et ceci dit laquelle.
  updates_infra_stale: mesuré le

  # EN | Followed by the raw systemd state (a machine token, never translated).
  # FR | Suivi de l'état systemd brut (un jeton machine, jamais traduit).
  updates_infra_service_down: le service ne tourne pas —
  updates_infra_msg_no_token: >-
    Pas de jeton de maintenance : /config/vssp/.vault_maint_token est absent.
    Le déploiement l'écrit depuis la variable VAULT_MAINT_TOKEN.

  # EN | The layer a component lives in — the heading the rows are grouped
  # EN | under. Three different blast radiuses, named.
  # FR | La couche où vit un composant — le titre sous lequel les lignes sont
  # FR | regroupées. Trois rayons d'explosion différents, nommés.
  updates_infra_where_host: Sur le serveur — Ubuntu
  updates_infra_where_docker: Sous Docker — à côté du cluster
  updates_infra_where_k3s: Dans le cluster k3s

  # EN | The stepped upgrade path, in the words the rows use.
  # FR | Le chemin de mise à niveau par étapes, dans les mots des lignes.
  updates_infra_steps: étapes
  updates_infra_then: puis
  updates_infra_workloads: charge(s)

  # EN | Why a locked component is locked, one sentence per component.
  # FR | Pourquoi un composant verrouillé l'est, une phrase par composant.
  updates_infra_why_docker_images: >-
    Chaque image est épinglée par le fichier qui a lancé son conteneur ; la
    changer d'ici choisirait à la place de son propriétaire.
  updates_infra_why_k3s_workloads: >-
    Changer une image du cluster veut dire modifier un manifeste, et les
    manifestes ne vivent pas dans ce dépôt.

  # EN | What a heavy button costs, said before it is pressed rather than
  # EN | discovered after. One per component, because "this interrupts service"
  # EN | described none of them well.
  # FR | Ce que coûte un bouton lourd, dit avant la pression plutôt que
  # FR | découvert après. Un par composant, parce que « cela interrompt le
  # FR | service » n'en décrivait aucun correctement.
  updates_infra_confirm_reboot: >-
    L'hôte redémarre dans une minute. Home Assistant et le cluster tombent
    avec lui. Continuer ?
  updates_infra_confirm_gitlab: >-
    GitLab s'arrête le temps de ses migrations de base, plusieurs minutes.
    Faites une sauvegarde avant. Continuer ?
  updates_infra_confirm_vault: >-
    Le coffre-fort redémarre et SE RESCELLE : il faudra ressaisir 3 des 5
    clés de descellement pour que l'écran COFFRE-FORT refonctionne.
    Continuer ?
  updates_infra_confirm_k3s: >-
    Le cluster redémarre, et Home Assistant avec lui : cet écran va se
    déconnecter plusieurs minutes. La mise à niveau se termine seule sur le
    serveur. Continuer ?

  # EN | One label per component, keyed as the COMPONENTS table declares them.

########################################################################
# Visio Sapiens — Locale: FRENCH / FRANCAIS (overlay)
#
# EN | Overlay merged on top of en.yaml. Only the keys present here are
# EN | translated; anything omitted keeps its English value. You can
# EN | therefore ship a partial translation safely.
# FR | Surcouche fusionnee par-dessus en.yaml. Seules les cles presentes
# FR | ici sont traduites ; tout ce qui est omis garde sa valeur anglaise.
# FR | On peut donc livrer une traduction partielle sans risque.
#
# EN | Run `python3 vssp/vssp_i18n.py check` to list what still falls back
# EN | to English, and to catch keys that exist here but not in en.yaml.
# FR | Lancer `python3 vssp/vssp_i18n.py check` pour lister ce qui retombe
# FR | encore sur l'anglais, et reperer les cles presentes ici mais
# FR | absentes de en.yaml.
########################################################################

meta:
  code: fr
  name: French
  native_name: Français
  # EN | Drives Intl.* — this is what turns "Mon" into "lun." automatically.
  # FR | Pilote Intl.* — c'est ce qui transforme "Mon" en "lun." tout seul.
  locale_tag: fr-FR
  first_day_of_week: 1
  currency_symbol: "€"
  decimal_separator: ","


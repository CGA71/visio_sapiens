date:
  # EN | These arrays match what Intl produces for fr-FR, so JS using
  # EN | Intl.DateTimeFormat('fr-FR') and YAML using these keys agree.
  # FR | Ces tableaux correspondent a ce que produit Intl pour fr-FR : le JS
  # FR | utilisant Intl.DateTimeFormat('fr-FR') et le YAML utilisant ces
  # FR | cles restent coherents.
  weekday_short: [dim., lun., mar., mer., jeu., ven., sam.]
  weekday_long: [dimanche, lundi, mardi, mercredi, jeudi, vendredi, samedi]
  month_short: [janv., févr., mars, avr., mai, juin, juil., août, sept., oct., nov., déc.]
  month_long:
    - janvier
    - février
    - mars
    - avril
    - mai
    - juin
    - juillet
    - août
    - septembre
    - octobre
    - novembre

# EN | ENERGY dashboard.
# FR | Dashboard ENERGY.
# ----------------------------------------------------------------------
energy:
  panel:
    solar_production: Solar Production
    per_device: Per-Device Consumption
    total_consumption: Total Consumption
    breaker_panel: Breaker Panel

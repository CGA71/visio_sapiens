########################################################################
# Visio Sapiens — Locale: ENGLISH (reference)
#
# EN | This file is the CONTRACT. Every key used anywhere in the project
# EN | must exist here. Other locales are overlays: any key they omit
# EN | falls back to the English value below, so the interface can never
# EN | render an empty label.
# FR | Ce fichier est le CONTRAT. Toute cle utilisee quelque part dans le
# FR | projet doit exister ici. Les autres langues sont des surcouches :
# FR | toute cle omise retombe sur la valeur anglaise ci-dessous, donc
# FR | l'interface ne peut jamais afficher un libelle vide.
#
# EN | Never delete a key. Renaming one means updating every template that
# EN | calls it — run `python3 vssp/vssp_i18n.py check` to catch strays.
# FR | Ne jamais supprimer une cle. En renommer une impose de mettre a jour
# FR | tous les templates qui l'appellent — lancer
# FR | `python3 vssp/vssp_i18n.py check` pour reperer les orphelines.
########################################################################

meta:
  code: en
  name: English
  native_name: English
  # EN | BCP-47 tag handed to Intl.* in button-card JS blocks. This is what
  # EN | produces "Mon"/"Tue" automatically — no hardcoded weekday arrays.
  # FR | Etiquette BCP-47 passee a Intl.* dans les blocs JS des button-card.
  # FR | C'est elle qui produit "Mon"/"Tue" automatiquement — plus aucun
  # FR | tableau de jours code en dur.
  locale_tag: en-US
  # EN | 0 = Sunday, 1 = Monday. Used by weekly energy charts.
  # FR | 0 = dimanche, 1 = lundi. Utilise par les graphes energie hebdo.
  first_day_of_week: 0
  currency_symbol: "€"
  decimal_separator: "."

# ----------------------------------------------------------------------
# EN | ROOM CATALOGUE — the closed list offered by the admin console.
# EN | Rooms marked (n) below can be instantiated several times; the
# EN | generator appends the index (Bedroom 1, Bedroom 2...).
# FR | CATALOGUE DE PIECES — la liste fermee proposee par la console admin.
# FR | Les pieces marquees (n) ci-dessous peuvent etre instanciees
# FR | plusieurs fois ; le generateur ajoute l'index (Chambre 1,
# FR | Chambre 2...).
#
# EN | The KEY is the identifier (never translated, used in entity_id,
# EN | paths and file names). The VALUE is the displayed label.
# FR | La CLE est l'identifiant (jamais traduit, utilise dans les
# FR | entity_id, les chemins et les noms de fichiers). La VALEUR est le
# FR | libelle affiche.
# ----------------------------------------------------------------------
room:
  kitchen: Kitchen
  living_room: Living room
  dining_room: Dining room
  entrance: Entrance hall
  laundry: Laundry room
  technical: Technical room
  garage: Garage
  cellar: Cellar
  bedroom: Bedroom            # (n)
  bathroom: Bathroom          # (n)
  toilet: Toilet              # (n)
  garden: Garden
  pool: Swimming pool
  jacuzzi: Jacuzzi
  roof: Roof
  # EN | Legacy room, kept for the existing computer.yaml dashboard. Not
  # EN | offered by the admin console form.
  # FR | Piece historique, conservee pour le dashboard computer.yaml
  # FR | existant. Non proposee par le formulaire de la console admin.
  computer: Desk & server room

# ----------------------------------------------------------------------
# EN | SYSTEM DASHBOARDS — the four mandatory ones, always generated,
# EN | never tied to a room. CORE and ENERGY are produced automatically
# EN | when the home is created; HOME is the entry point and ADMIN is the
# EN | console itself.
# FR | DASHBOARDS SYSTEME — les quatre obligatoires, toujours generes,
# FR | jamais lies a une piece. CORE et ENERGY sont produits
# FR | automatiquement a la creation de la maison ; HOME est le point
# FR | d'entree et ADMIN est la console elle-meme.
# ----------------------------------------------------------------------
system:
  home: Home
  core: Core
  energy: Energy
  admin: Admin

# ----------------------------------------------------------------------
# EN | Output formats offered by the admin console.
# FR | Formats de sortie proposes par la console admin.
# ----------------------------------------------------------------------
format:
  mobile: Mobile
  tablet: Tablet

# ----------------------------------------------------------------------
# EN | Dashboard titles — shown in the Home Assistant sidebar.
# EN | Consumed by config-fragment.yaml through __T:dashboard.*.title__
# FR | Titres des dashboards — affiches dans la barre laterale de Home
# FR | Assistant. Consommes par config-fragment.yaml via __T:dashboard.*__
# ----------------------------------------------------------------------
dashboard:
  main:
    title: Visio-Sapiens
  core:
    title: Core System
  computer:
    title: Computer Room
  energy:
    title: Energy Management
  technical:
    title: Technical Room
  preview:
    title: "ENERGY ⧗ PREVIEW"

# ----------------------------------------------------------------------
# EN | Navigation rail — only the four system entries are fixed. Room
# EN | entries are generated from the room catalogue above, so this block
# EN | does NOT grow when a home has fifteen rooms.
# FR | Bandeau de navigation — seules les quatre entrees systeme sont
# FR | fixes. Les entrees de pieces sont generees depuis le catalogue
# FR | ci-dessus, donc ce bloc NE grossit PAS quand une maison a quinze
# FR | pieces.
# ----------------------------------------------------------------------
nav:
  home: HOME
  core: CORE
  energy: ENERGY
  admin: ADMIN

# ----------------------------------------------------------------------
# EN | Page headers — the large title plus its subtitle line.
# FR | En-tetes de page — le grand titre et sa ligne de sous-titre.
# ----------------------------------------------------------------------
page:
  home:
    name: HOME
    subtitle: Home Sweet Home
  core:
    name: CORE SYSTEM
    subtitle: Central system monitoring
  computer:
    name: DESK
    subtitle: Desk & server room
  technical:
    name: TECHNICAL ROOM
    subtitle: Technical room
  energy:
    name: ENERGY
    subtitle: Production, consumption & grid
  admin:
    name: ADMIN
    subtitle: Dashboard generation & maintenance

# ----------------------------------------------------------------------
# EN | ENERGY dashboard.
# FR | Dashboard ENERGY.
# ----------------------------------------------------------------------
energy:
  panel:
    solar_production: Solar Production
    per_device: Per-Device Consumption
    total_consumption: Total Consumption
    breaker_panel: Breaker Panel
    grid: Grid
    security: Security
  # EN | IMPORTANT — these are DISPLAY labels only. The underlying
  # EN | input_select option values stay in English (Day/Month/Year) in
  # EN | every language, because they are identifiers compared inside JS.
  # EN | Translating the stored state would break the comparisons.
  # FR | IMPORTANT — ce sont uniquement des libelles d'AFFICHAGE. Les
  # FR | valeurs d'options de l'input_select restent en anglais
  # FR | (Day/Month/Year) dans toutes les langues, car ce sont des
  # FR | identifiants compares dans le JS. Traduire l'etat stocke
  # FR | casserait les comparaisons.
  tab:
    day: Day
    month: Month
    year: Year
  stat:
    annual_capacity: "Annual capacity"
    of_annual_target: "% of annual target"
    of_target: "% of target"
    produced: Produced
    consumed: Consumed
    exported: Exported
    imported: Imported
    self_consumption: Self-consumption
    export_revenue: Export revenue
    total: Total
  helper:
    period_name: "Visio Sapiens — Energy period"
    solar_capacity_name: "Visio Sapiens — Annual solar capacity"
    export_rate_name: "Visio Sapiens — Export rate"

# ----------------------------------------------------------------------
# EN | Technical room / network.
# FR | Local technique / reseau.
# ----------------------------------------------------------------------
technical:
  livebox: Router
  switch: Network switch
  nat: Port forwarding
  systems: Systems
  board: Connected devices
  connected: Connected
  disconnected: Disconnected

# ----------------------------------------------------------------------
# EN | Shared vocabulary reused across every view.
# FR | Vocabulaire commun reutilise dans toutes les vues.
# ----------------------------------------------------------------------
common:
  on: "On"
  off: "Off"
  open: Open
  closed: Closed
  unavailable: Unavailable
  unknown: Unknown
  none: None
  active: Active
  inactive: Inactive
  weather: Weather
  alarm: Alarm
  alerts: Alerts
  security: Security
  settings: Settings
  backup: Backup
  delete: Delete
  confirm: Confirm
  cancel: Cancel
  save: Save
  error: Error
  failed: Failed
  success: Success
  warning: Warning
  loading: Loading

# ----------------------------------------------------------------------
# EN | ADMIN console — the dashboard creation menu.
# FR | Console ADMIN — le menu de creation des dashboards.
# ----------------------------------------------------------------------
admin:
  console_title: Admin console
  discovery: DISCOVERY SCAN
  upgrade: UPGRADE
  generate: GENERATE DASHBOARDS
  regenerate: REGENERATE
  delete_dashboard: DELETE DASHBOARD
  pin_prompt: Enter the PIN code
  backup_created: Backup created
  system_dashboards: System dashboards
  select_language: Interface language

  updates_infra_auto_enabled: Update the infrastructure automatically
  updates_infra_never_probed: >-
    Never probed. Press PROBE THE SERVER, and check the safe holds
    vssp/infra/host_ssh if nothing comes back.
  updates_infra_locked_note: >-
    One step per press: a component only ever moves to the version its vendor
    supports arriving at from here, never straight to the newest one. Each
    locked row says why it is locked.
  updates_infra_reboot_note: The host is waiting for a restart

  # EN | The probe's own failures, for the two that need no variables and that
  # EN | an operator can actually act on. Everything else falls back to the
  # EN | English the script rendered.
  # FR | Les echecs de la sonde, pour les deux qui n ont pas de variables et sur
  # FR | lesquels un operateur peut reellement agir. Tout le reste retombe sur
  # FR | l anglais rendu par le script.
  updates_infra_msg_sealed: >-
    The safe is sealed: the probe cannot read the host's SSH access out of it.
    The greyed rows below are the last known measurement, not the current
    state, and no install can start. On the host, three times, a different key
    each call — then PROBE THE SERVER.

  # EN | Prefixes a date. "last measured 2026-09-11 14:00" — the row holds a
  # EN | real measurement from an earlier run, and this says which run.
  # FR | Precede une date. « last measured 2026-09-11 14:00 » — la ligne porte
  # FR | une vraie mesure d une execution anterieure, et ceci dit laquelle.
  updates_infra_stale: last measured

  # EN | Followed by the raw systemd state (a machine token, never translated).
  # FR | Suivi de l'etat systemd brut (un jeton machine, jamais traduit).
  updates_infra_service_down: the service is not running —
  updates_infra_msg_no_token: >-
    No maintenance token: /config/vssp/.vault_maint_token is missing. The
    deployment writes it from the VAULT_MAINT_TOKEN variable.

  # EN | The layer a component lives in — the heading the rows are grouped
  # EN | under. Three different blast radiuses, named.
  # FR | La couche ou vit un composant — le titre sous lequel les lignes sont
  # FR | regroupees. Trois rayons d explosion differents, nommes.
  updates_infra_where_host: On the server — Ubuntu
  updates_infra_where_docker: Under Docker — beside the cluster
  updates_infra_where_k3s: Inside the k3s cluster

  # EN | The stepped upgrade path, in the words the rows use.
  # FR | Le chemin de mise a niveau par etapes, dans les mots des lignes.
  updates_infra_steps: steps
  updates_infra_then: then
  updates_infra_workloads: workload(s)

  # EN | Why a locked component is locked, one sentence per component.
  # FR | Pourquoi un composant verrouille l est, une phrase par composant.
  updates_infra_why_docker_images: >-
    Every image is pinned by the file that started its container; changing it
    from here would decide on that file's behalf.
  updates_infra_why_k3s_workloads: >-
    Changing a cluster image means editing a manifest, and the manifests do
    not live in this repository.

  # EN | What a heavy button costs, said before it is pressed rather than
  # EN | discovered after. One per component, because "this interrupts service"
  # EN | described none of them well.
  # FR | Ce que coute un bouton lourd, dit avant la pression plutot que

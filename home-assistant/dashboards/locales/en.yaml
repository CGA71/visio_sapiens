# ----------------------------------------------------------------------
# EN | HOME dashboard.
# FR | Dashboard HOME.
# ----------------------------------------------------------------------
home:
  intercom: Intercom
  audio_stream: Audio stream
  chatbot: Chatbot
  chatbot_hint: Conversational assistant
  chatbot_placeholder: Ask the assistant…
  chatbot_error_prefix: "Error: "
  chatbot_no_reply: No reply after 30s.
  chatbot_empty_reply: (empty reply)
  chatbot_mic_unsupported: Voice input not available in this browser.
  production_consumption: "PRODUCTION & CONSUMPTION"
  top_devices: "TOP 10 CONSUMPTION"
  kpi:
    system_status: SYSTEM STATUS
    system_status_hint: CORE metrics status
    active_rooms: ACTIVE ROOMS
    active_rooms_hint: Currently active
    energy_status: ENERGY STATUS
    energy_status_hint: ENERGY metrics status
    production: Prod
    consumption: Cons
    connections: CONNECTIONS
    connections_hint: Connected devices
    rooms_devices: ROOMS & DEVICES
    upgrade: UPGRADE
    thermostats: THERMOSTAT
    thermostats_hint: No thermostat
  # EN | The HOME upgrade light. Four states, and the wording matters: the
  # EN | green one says the estate is PATCHED, not that it is up to date —
  # EN | there may well be ordinary updates waiting, and the UPDATES screen
  # EN | is where they are read.
  # FR | Le feu UPGRADE de HOME. Quatre etats, et les mots comptent : le vert
  # FR | dit que le parc est CORRIGE, pas qu il est a jour — des mises a jour
  # FR | ordinaires peuvent parfaitement attendre, et c est l ecran MISES A
  # FR | JOUR qui les donne a lire.
  upgrade:
    clear: UP TO DATE
    clear_hint: Nothing to apply
    clear_unprobed: Nothing in Home Assistant — server not probed
    patches: PATCHES DUE
    patch_hint: to apply
    major: MAJOR VERSION
    major_hint: A major version is waiting

  # EN | THE SECURITY PANEL on HOME: three positions and a panic button.
  # EN | `mode_*` are the buttons, `state_*` the position they put the panel
  # EN | in. They are worded differently on purpose — a button says what it
  # EN | will do, a state says what is true — and kept short because three of
  # EN | them share one KPI slot.
  # FR | LE PANNEAU SECURITE de HOME : trois positions et un bouton panique.
  # FR | `mode_*` sont les boutons, `state_*` la position dans laquelle ils
  # FR | mettent le panneau. Ils sont formules differemment a dessein — un
  # FR | bouton dit ce qu il va faire, un etat dit ce qui est vrai — et
  # FR | restent courts parce que trois d entre eux partagent une case KPI.
  alarm:
    mode_away: ARMED
    mode_home: AT HOME
    # EN | QUOTED, and it has to be: YAML 1.1 reads a bare OFF as the boolean
    # EN | false, and the chip on the wall tablet then reads "False".
    # FR | QUOTE, et il le faut : YAML 1.1 lit un OFF nu comme le booleen
    # FR | false, et la pastille de la tablette murale affiche alors « False ».
    mode_off: "OFF"
    state_away: Armed
    state_home: Armed · people in
    state_off: Disarmed
    state_triggered: ALARM
    state_arming: Arming…
    state_pending: Entry delay…
    panic: PANIC
    panic_stop: STOP THE ALARM
    panic_confirm: Set the alarm off now?
    ok: All clear
    alert: ALERT
    armed: Armed
    not_configured: Not configured
    no_entity: Entity not configured
    intrusion: Intrusion detected
    no_alert: No alert
  events_recent: Recent events
  discovery_confirm: "Run a sensor discovery across every area?"
  upgrade_confirm: "Compare the current dashboard with the latest discovered entities? A backup will be created as a precaution."
  delete_confirm: "IRREVERSIBLE action without a manual restore from the backup. The code must be correct. Continue?"


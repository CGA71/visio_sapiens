########################################################################
# Visio Sapiens — Locale: ENGLISH (reference)
#
# EN | This file is the CONTRACT. Every key used anywhere in the project
# EN | must exist here. Other locales are overlays: any key they omit
# EN | falls back to the English value below, so the interface can never
# EN | render an empty label.
# FR | Ce fichier est le CONTRAT. Toute cle utilisee quelque part dans le
# FR | projet doit exister ici. Les autres langues sont des surcouches :
# FR | toute cle omise retombe sur la valeur anglaise ci-dessous, donc
# FR | l'interface ne peut jamais afficher un libelle vide.
#
# EN | Never delete a key. Renaming one means updating every template that
# EN | calls it — run `python3 vssp/vssp_i18n.py check` to catch strays.
# FR | Ne jamais supprimer une cle. En renommer une impose de mettre a jour
# FR | tous les templates qui l'appellent — lancer
# FR | `python3 vssp/vssp_i18n.py check` pour reperer les orphelines.
########################################################################

meta:
  code: en
  name: English
  native_name: English
  # EN | BCP-47 tag handed to Intl.* in button-card JS blocks. This is what
  # EN | produces "Mon"/"Tue" automatically — no hardcoded weekday arrays.
  # FR | Etiquette BCP-47 passee a Intl.* dans les blocs JS des button-card.
  # FR | C'est elle qui produit "Mon"/"Tue" automatiquement — plus aucun
  # FR | tableau de jours code en dur.
  locale_tag: en-US
  # EN | 0 = Sunday, 1 = Monday. Used by weekly energy charts.
  # FR | 0 = dimanche, 1 = lundi. Utilise par les graphes energie hebdo.
  first_day_of_week: 0
  currency_symbol: "€"
  decimal_separator: "."

# ----------------------------------------------------------------------
# EN | ROOM CATALOGUE — the closed list offered by the admin console.
# EN | Rooms marked (n) below can be instantiated several times; the
# EN | generator appends the index (Bedroom 1, Bedroom 2...).
# FR | CATALOGUE DE PIECES — la liste fermee proposee par la console admin.
# FR | Les pieces marquees (n) ci-dessous peuvent etre instanciees
# FR | plusieurs fois ; le generateur ajoute l'index (Chambre 1,
# FR | Chambre 2...).
#
# EN | The KEY is the identifier (never translated, used in entity_id,
# EN | paths and file names). The VALUE is the displayed label.
# FR | La CLE est l'identifiant (jamais traduit, utilise dans les
# FR | entity_id, les chemins et les noms de fichiers). La VALEUR est le
# FR | libelle affiche.
# ----------------------------------------------------------------------
room:
  kitchen: Kitchen
  living_room: Living room
  dining_room: Dining room
  entrance: Entrance hall
  laundry: Laundry room
  technical: Technical room
  garage: Garage
  cellar: Cellar
  bedroom: Bedroom            # (n)
  bathroom: Bathroom          # (n)
  toilet: Toilet              # (n)
  garden: Garden
  pool: Swimming pool
  jacuzzi: Jacuzzi
  roof: Roof
  # EN | Legacy room, kept for the existing computer.yaml dashboard. Not
  # EN | offered by the admin console form.
  # FR | Piece historique, conservee pour le dashboard computer.yaml
  # FR | existant. Non proposee par le formulaire de la console admin.
  computer: Desk & server room
  secret: Secret room

# ----------------------------------------------------------------------
# EN | SLOTS — the six fixed panels of a room dashboard. The KEY is the
# EN | identifier: it is used in house.yaml, as the CSS grid-area, and as
# EN | the section name in the template. Those three uses must be the same
# EN | string — that is what "normalised" means here. Never translated.
# FR | TABLEAUX — les six panneaux fixes d'un dashboard de piece. La CLE
# FR | est l'identifiant : elle sert dans house.yaml, comme grid-area CSS,
# FR | et comme nom de section dans le template. Ces trois usages doivent
# FR | employer la meme chaine — c'est ce que « normalise » veut dire ici.
# FR | Jamais traduite.
# ----------------------------------------------------------------------
slot:
  sensors: Sensors
  switches: Switches
  appliances: Devices
  security: Security
  infrastructure: Infrastructure
  # EN | Group headers inside the switches slot's grouped listing.
  # FR | En-tetes de groupe dans le listing groupe du tableau switches.
  switches_lights: Lights
  switches_outlets: Connected outlets
  # EN | Frame for anything assigned to switches that is
  # EN | neither a light, an outlet nor a shutter.
  schedule: SCHEDULE
  switches_other: Other
  switches_shutters: Shutters
  # EN | Shown when a slot belongs to the room's slot set but holds no
  # EN | device yet. A slot that does not apply to the room at all is not
  # EN | rendered — it collapses and its neighbours expand.
  # FR | Affiche quand un tableau appartient au jeu de la piece mais ne
  # FR | contient encore aucun appareil. Un tableau sans objet pour la
  # FR | piece n'est pas rendu du tout — il s'effondre et ses voisins
  # FR | s'etendent.
  empty: No device
  nvr_access: NVR access
  door_open: Open
  door_close: Close
  door_light: Light
  vacuum_dock: Return to base
  vacuum_empty: Empty bin
  vacuum_battery: Battery
  vacuum_schedule: Schedule
  vacuum_status: Jessica status
  vacuum_state_docked: Docked at base
  vacuum_state_cleaning: Cleaning
  vacuum_state_returning: Returning to base
  vacuum_state_paused: Paused
  vacuum_state_error: Error
  vacuum_state_idle: Idle
  vacuum_map: Map
  vacuum_mop: Mop attached
  vacuum_on: Enabled
  vacuum_off: Disabled
  vacuum_detergent: Detergent level
  vacuum_active_map: Active map
  vacuum_relocate: Relocate
  security_camera: Camera
  security_intercom: Intercom
  security_vacuum: Vacuum
  lights_switches: Switches
  lights_outlets: Outlets
  switch: Switch
  outlet: Outlet

# ----------------------------------------------------------------------
# EN | Header band, identical on every dashboard.
# FR | Bandeau horizontal, identique sur tous les dashboards.
# ----------------------------------------------------------------------
header:
  weather_unavailable: Weather unavailable
  # EN | One label per Home Assistant weather condition, keyed by the raw
  # EN | state (hyphens included). The weather cell of the header shows
  # EN | these instead of hass.localize, which follows the HA profile /
  # EN | browser language and not this catalogue — see _header.j2. Keep
  # EN | ASCII double quotes out of the values: they land inside a CSS
  # EN | string.
  # FR | Un libelle par condition meteo Home Assistant, indexe par l'etat
  # FR | brut (tirets compris). La case meteo du bandeau les affiche a la
  # FR | place de hass.localize, qui suit la langue du profil HA /
  # FR | navigateur et non ce catalogue — voir _header.j2. Pas de guillemet
  # FR | droit ASCII dans les valeurs : elles finissent dans une chaine CSS.
  weather_condition:
    clear-night: Clear, night
    cloudy: Cloudy
    exceptional: Exceptional
    fog: Fog
    hail: Hail
    lightning: Lightning
    lightning-rainy: Lightning, rainy
    partlycloudy: Partly cloudy
    pouring: Pouring
    rainy: Rainy
    snowy: Snowy
    snowy-rainy: Snowy, rainy
    sunny: Sunny
    windy: Windy
    windy-variant: Windy, cloudy
    unavailable: Unavailable
    unknown: Unknown


    # EN | hardware on the right.
    switches: Switches
    virtual_board: Virtual board
    grid: Grid
    flow: Energy flow diagram
    security: Security
  # EN | IMPORTANT — these are DISPLAY labels only. The underlying
  # EN | input_select option values stay in English (Day/Month/Year) in
  # EN | every language, because they are identifiers compared inside JS.
  # EN | Translating the stored state would break the comparisons.
  # FR | IMPORTANT — ce sont uniquement des libelles d'AFFICHAGE. Les
  # FR | valeurs d'options de l'input_select restent en anglais
  # FR | (Day/Month/Year) dans toutes les langues, car ce sont des
  # FR | identifiants compares dans le JS. Traduire l'etat stocke
  # FR | casserait les comparaisons.
  # EN | Column headers of the per-device table.
  # FR | En-tetes de colonnes du tableau par appareil.
  col:
    device: Device
    room: Room
    power_hint: "(current)"
    energy: Energy
    energy_hint: "(today)"
  legend:
    state_on: "On"
    state_off: "Off"
  # EN | Virtual breaker panel — hardware wording.
  # FR | Tableau electrique virtuel — vocabulaire materiel.
  board:
    unknown_model: Unknown module
    free_slot: Free slot — waiting for a DIN module
  empty:
    devices: No device detected
    devices_hint: run vssp_energy_sync.py
    circuits: No circuit detected — run vssp_energy_sync.py
    # EN | Not an error: the enclosure is simply empty. DIN hardware
    # EN | shows up on its own once it is wired and paired.
    modules: No panel module yet — DIN hardware appears here once wired
  tab:
    day: Day
    month: Month
    year: Year
  stat:
    annual_capacity: "Annual capacity"
    of_annual_target: "% of annual target"
    of_target: "% of target"
    produced: Produced
    consumed: Consumed
    exported: Exported
    imported: Imported
    self_consumption: Self-consumption
    export_revenue: Export revenue
    total: Total
    today: Today
    this_month: This month
    this_year: This year
    estimate_month: Export estimate
    estimate_year: Estimate this year
  # EN | Energy flow diagram — node names and status wording.
  # FR | Schema de flux energetique — noms des noeuds et libelles de statut.
  flow:
    solar_panels: Solar panels
    inverter: Inverter
    home: Home
    grid: Grid
    current_production: Current production
    current_consumption: Current consumption
    status: Status
    status_unknown: Status unknown
    running: Running
    stopped: Stopped
  helper:
    period_name: "Visio Sapiens — Energy period"
    solar_capacity_name: "Visio Sapiens — Annual solar capacity"
    export_rate_name: "Visio Sapiens — Export rate"


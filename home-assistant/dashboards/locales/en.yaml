  # EN | IMPORTANT — these are DISPLAY labels only. The underlying
  # EN | input_select option values stay in English (Day/Month/Year) in
  # EN | every language, because they are identifiers compared inside JS.
  # EN | Translating the stored state would break the comparisons.
  # FR | IMPORTANT — ce sont uniquement des libelles d'AFFICHAGE. Les
  # FR | valeurs d'options de l'input_select restent en anglais
  # FR | (Day/Month/Year) dans toutes les langues, car ce sont des
  # FR | identifiants compares dans le JS. Traduire l'etat stocke
  # FR | casserait les comparaisons.
  tab:
    day: Day
    month: Month
    year: Year
  stat:
    annual_capacity: "Annual capacity"
    of_annual_target: "% of annual target"
    of_target: "% of target"
    produced: Produced
    consumed: Consumed
    exported: Exported
    imported: Imported
    self_consumption: Self-consumption
    export_revenue: Export revenue
    total: Total
  helper:

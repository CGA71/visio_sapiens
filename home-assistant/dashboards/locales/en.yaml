# ----------------------------------------------------------------------
# EN | Shared vocabulary reused across every view.
# FR | Vocabulaire commun reutilise dans toutes les vues.
# ----------------------------------------------------------------------
common:
  # EN | `state_on` / `state_off`, NOT `on` / `off`. In YAML 1.1 an unquoted
  # EN | `on:` key is parsed as the boolean true, so `t('common.on')` looks up
  # EN | a key that does not exist and the render dies with KeyError. Quoting
  # EN | would work, but a name that cannot be misread is safer than a rule
  # EN | everyone has to remember.
  # FR | `state_on` / `state_off`, PAS `on` / `off`. En YAML 1.1, une cle `on:`
  # FR | non quotee est analysee comme le booleen vrai, donc `t('common.on')`
  # FR | cherche une cle inexistante et le rendu meurt sur KeyError. Quoter
  # FR | fonctionnerait, mais un nom qu'on ne peut pas mal lire vaut mieux
  # FR | qu'une regle dont tout le monde doit se souvenir.
  state_on: "On"
  state_off: "Off"
  open: Open
  closed: Closed
  unavailable: Unavailable
  unknown: Unknown
  none: None
  active: Active
  inactive: Inactive
  weather: Weather
  alarm: Alarm
  alerts: Alerts
  security: Security
  settings: Settings
  backup: Backup
  delete: Delete
  confirm: Confirm
  cancel: Cancel
  save: Save
  error: Error
  failed: Failed
  success: Success
  warning: Warning
  loading: Loading


# FR | jamais lies a une piece. CORE et ENERGY sont produits
# FR | automatiquement a la creation de la maison ; HOME est le point
# FR | d'entree et ADMIN est la console elle-meme.
# ----------------------------------------------------------------------
system:
  home: Home
  core: Core
  energy: Energy
  admin: Admin


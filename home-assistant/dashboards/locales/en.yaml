########################################################################
# Visio Sapiens — Locale: ENGLISH (reference)
#
# EN | This file is the CONTRACT. Every key that appears anywhere in the
# EN | project must exist here. Other locales are overlays: any key they
# EN | omit falls back to the English value below, so the interface can
# EN | never render an empty label.
# FR | Ce fichier est le CONTRAT. Toute cle utilisee quelque part dans le
# FR | projet doit exister ici. Les autres langues sont des surcouches :
# FR | toute cle omise retombe sur la valeur anglaise ci-dessous, donc
# FR | l'interface ne peut jamais afficher un libelle vide.
#
# EN | Never delete a key. Renaming one means updating every template that
# EN | calls it — run `python3 vssp/vssp_i18n.py check` to catch strays.
# FR | Ne jamais supprimer une cle. En renommer une impose de mettre a jour
# FR | tous les templates qui l'appellent — lancer
# FR | `python3 vssp/vssp_i18n.py check` pour reperer les orphelines.
########################################################################

meta:
  code: en
  name: English
  native_name: English
  # EN | BCP-47 tag handed to Intl.* in button-card JS blocks. This is what
  # EN | produces "Mon"/"Tue" automatically — no hardcoded weekday arrays.
  # FR | Etiquette BCP-47 passee a Intl.* dans les blocs JS des button-card.
  # FR | C'est elle qui produit "Mon"/"Tue" automatiquement — plus aucun
  # FR | tableau de jours code en dur.
  locale_tag: en-US
  # EN | 0 = Sunday, 1 = Monday. Used by weekly energy charts.
  # FR | 0 = dimanche, 1 = lundi. Utilise par les graphes energie hebdo.
  first_day_of_week: 0
  currency_symbol: "€"
  decimal_separator: "."


wizard:
  # EN | Phase 0 — the two selectors that drive the whole generation.
  # FR | Phase 0 — les deux selecteurs qui pilotent toute la generation.
  language_step_title: Interface language
  language_step_help: >-
    Choose the language of the generated dashboards. English is the
    default; other languages fall back to English for anything not
    translated yet.
  format_step_title: Target format
  format_step_help: >-
    Mobile renders the compact single-column layout; Tablet renders the
    full HUD with the navigation rail. Both can be generated.
  phase1_title: "PHASE 1 — ROOMS & FLOORS"
  phase2_title: "PHASE 2 — DEVICE ASSIGNMENT"
  phase3_title: "PHASE 3 — FLOOR PLAN"
  phase4_title: "PHASE 4 — PUSH TO GIT"
  next: Next
  back: Back
  finish: Finish

# ----------------------------------------------------------------------
# EN | Date and time.
# EN | Prefer Intl.DateTimeFormat(locale_tag) in JS — it already knows every
# EN | language. The arrays below exist only as an override when you want
# EN | exact control over the wording (casing, trailing dot, width).
# FR | Date et heure.
# FR | Preferer Intl.DateTimeFormat(locale_tag) en JS — il connait deja
# FR | toutes les langues. Les tableaux ci-dessous n'existent que comme
# FR | surcharge quand on veut un controle exact du libelle (casse, point
# FR | final, largeur).
# ----------------------------------------------------------------------
date:
  weekday_short: [Sun, Mon, Tue, Wed, Thu, Fri, Sat]
  weekday_long: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday]
  month_short: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]
  month_long:
    - January
    - February
    - March
    - April
    - May
    - June
    - July
    - August
    - September
    - October
    - November
    - December
  today: Today
  yesterday: Yesterday
  now: Now

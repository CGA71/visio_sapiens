# Loads default set of integrations. Do not remove.
default_config:
# =========================
# FRONTEND + THEMES
# =========================
frontend:
  themes: !include_dir_merge_named themes
# =========================
# LOVELACE (YAML MODE FOR OSVISION V2)
# =========================
lovelace:
  mode: storage
  dashboards:
    osvision-v2:
      mode: yaml
      title: OSVision V2
      icon: mdi:hexagon-outline
      show_in_sidebar: true
      filename: dashboards/home.yaml
  resources:
    # --- Custom cards (installées via HACS, chemin standard /hacsfiles/) ---
    - url: /hacsfiles/button-card/button-card.js
      type: module
    - url: /hacsfiles/lovelace-card-mod/card-mod.js
      type: module
    - url: /hacsfiles/lovelace-layout-card/layout-card.js
      type: module
    - url: /hacsfiles/lovelace-hui-element/stack-in-card.js
      type: module
    - url: /hacsfiles/apexcharts-card/apexcharts-card.js
      type: module
    - url: /hacsfiles/mini-graph-card/mini-graph-card-bundle.js
      type: module
    - url: /hacsfiles/lovelace-config-template-card/config-template-card.js
      type: module
    - url: /hacsfiles/lovelace-decluttering-card/decluttering-card.js
      type: module
    # --- Moteur OSVision V2 (déployé par la CI dans /config/www) ---
    - url: /local/osvision_v2/css/osvision.css
      type: css
    - url: /local/osvision_v2/js/osvision.js
      type: module
    - url: /local/osvision_v2/components/osv-core.js
      type: module
    - url: /local/osvision_v2/components/osv-card.js
      type: module
    - url: /local/osvision_v2/components/osv-datetime-card.js
      type: module
# =========================
# OSVISION V2 — ADMIN (Discovery / Upgrade / Delete)
# Helpers utilisés par le panneau ADMIN caché du dashboard.
# Les scripts correspondants sont dans scripts.yaml (voir plus bas).
# =========================
input_text:
  osvision_admin_pin:
    name: "OSVision — Code admin (reference)"
    mode: password
    max: 20
  osvision_pin_entry:
    name: "OSVision — Saisie du code"
    mode: password
    max: 20
shell_command:
  osvision_discovery: >-
    python3 /config/osvision/osvision_discovery.py
    --url http://localhost:8123
    --token {{ token }}
    --output /config/osvision/report.json
  osvision_upgrade: >-
    python3 /config/osvision/osvision_upgrade.py
  osvision_backup_dashboard: >-
    sh -c "mkdir -p /config/osvision/backups &&
    cp /config/home-assistant/dashboards/home.yaml
    /config/osvision/backups/home_$(date +%Y%m%d_%H%M%S).yaml"
  osvision_delete_dashboard: >-
    rm -f /config/home-assistant/dashboards/home.yaml
# =========================
# OSVISION V2 — KPI (Pièces actives / Connexions)
# Capteurs template utilisés par la rangée KPI du dashboard HOME.
# =========================
template:
  - sensor:
      # --- Pièces actives : nombre de zones ayant au moins une entité 'on' ---
      - name: "OSVision Pièces Actives"
        unique_id: osvision_active_rooms
        state: >
          {% set areas = ['computer_room','technical_room','secret_room','livingroom',
                           'kitchen','bedroom_1','bedroom_2','bathroom','garden_1'] %}
          {% set ns = namespace(count=0) %}
          {% for a in areas %}
            {% set on_count = area_entities(a) | select('is_state', 'on') | list | count %}
            {% if on_count > 0 %}
              {% set ns.count = ns.count + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.count }}
        attributes:
          total_areas: 9

      # --- Connexions : total d'appareils distincts enregistrés dans HA ---
      - name: "OSVision Total Appareils"
        unique_id: osvision_total_devices
        state: >
          {{ states | map(attribute='entity_id') | map('device_id') | select() | unique | list | count }}
# =========================
# AUTOMATIONS / SCRIPTS / SCENES
# =========================
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
# =========================
# BUTTON CARD TEMPLATE
# =========================

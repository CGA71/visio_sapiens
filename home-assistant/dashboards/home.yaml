########################################################################
# Visio Sapiens — CORE Dashboard (Phase 1)
#
# Vues: 
#   /Visio-Sapiens/home    -> HUD, radar/IA core, metrics, alerts, quick actions - iteration 1
#   /Visio-Sapiens/core    -> HUD, radar/IA core, metrics, alerts, quick actions - iteration 2
#   /Visio-Sapiens/bedromm1-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 3
#   /Visio-Sapiens/bedroom2-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 4
#   /Visio-Sapiens/bathroom-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 5
#   /Visio-Sapiens/computer-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 6
#   /Visio-Sapiens/technical-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 7
#   /Visio-Sapiens/secret  -> HUD, radar/IA core, metrics, alerts, quick actions - iteration 8
#   /Visio-Sapiens/garden  -> HUD, radar/IA core, metrics, alerts, quick actions - iteration 9
#
# Dépendances lovelace (à installer via HACS + déclarer en resources) :
#   button-card, card-mod, layout-card, custom:stack-in-card,
#   apexcharts-card, config-template-card, decluttering-card, browser_mod
########################################################################

title: Visio Sapiens
path: visio-sapiens
theme: Visio Sapiens

button_card_templates: !include templates/button_card_templates.yaml
decluttering_templates: !include templates/decluttering_templates.yaml

views:
  # =====================================================================
  # HOME (hub — placeholder, itération 1)
  # =====================================================================
  - title: HOME
    path: home
    subview: true
    type: custom:grid-layout
    layout:
      grid-template-columns: minmax(200px, auto) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) 565px
      grid-template-rows: 105px 113px 444px 400px
      grid-template-areas: |
        "nav header1 header2 header3 header4 header5 header6"
        "nav kpi1 kpi2 kpi3 kpi4 kpi5 kpi5"
        "nav floor floor floor floor floor right"
        "nav egy1 egy1 egy2 events events meteo"
      margin: 12px
      grid-gap: 14px 14px
    cards:
     # ═══════════════════════════════════════════════════════════════
      # LIGNE 1 — HEADER : titre / météo / heure + logo
      # ═══════════════════════════════════════════════════════════════
      # ── Case 1 : titre ────────────────────────────────────────
      - type: custom:button-card
        template: vssp_page_header
        view_layout:
          grid-area: header1
        icon: mdi:chevron-left
        name: HOME
        label: "Home Sweet Home"
        tap_action:
          action: navigate
          navigation_path: /visio-sapiens/home
        card_mod:
          style: |
            :host { flex: 1 1 0; }
                ha-card {
                  background: rgba(16,27,39,0.85) !important;
                  border: 1px solid rgba(0,229,255,0.28) !important;
                  border-radius: 20px !important;
                  box-shadow: 0 0 18px rgba(0,229,255,.12) !important;
                  height: 100px
                }

      # Case band2 — Bandeau publicitaire défilant (gauche → droite)
      # Remplacez les url par vos vrais liens d'affiliation/partenaires.
      # Le champ "image" est optionnel : sans logo dispo, un badge texte
      # stylé s'affiche automatiquement à la place.
      - type: custom:osv-ad-banner-card
        view_layout:
          grid-area: header2
        speed: 25
        ads:
          - name: HIKVISION
            url: https://www.hikvision.com
            image: /local/vssp/images/ads/hikvision.png
          - name: ECOWITT
            url: https://www.ecowitt.com
            image: /local/vssp/images/ads/ecowitt.png
          - name: PHILIPS HUE
            url: https://www.philips-hue.com
            image: /local/vssp/images/ads/philips.png
          - name: UBER EATS
            url: https://www.ubereats.com
            image: /local/vssp/images/ads/ubereats.png

       # ── Case 2 : météo (carte NATIVE, toujours disponible) ─────
          - type: custom:simple-weather-card
            entity: weather.maison
            show_name: true
            tap_action:
              action: more-info
            primary_info:
              - extrema
            secondary_info:
              - precipitation
            state_content: state
            forecast_type: daily
            custom: []
            animated_icons: true
            backdrop:
              day: "#7cbfee"
              night: "#a6aae8"
              text: "#ffffff"
              bg: true
              fade: false
            card_mod:
              style: |
                :host { flex: 1 1 0; }
                ha-card {
                  background: rgba(16,27,39,0.85) !important;
                  border: 1px solid rgba(0,229,255,0.28) !important;
                  border-radius: 20px !important;
                  box-shadow: 0 0 18px rgba(0,229,255,.12) !important;
                  height: 100px
                }

      # ── Case 3 : heure (button-card autonome, sans dépendance) ─
          - type: custom:button-card
            view_laout:
              grid-area: header4
            entity: sensor.time                                  # sensor.time (intégration "time_date")
            show_name: false
            show_icon: false
            show_state: false
            show_label: true
            label: |
              [[[
                const d = new Date();
                const h = String(d.getHours()).padStart(2,'0');
                const m = String(d.getMinutes()).padStart(2,'0');
                const jours = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
                const mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
                return `<div style="font-family:Orbitron,sans-serif;font-size:24px;color:#00E5FF;line-height:1;">${h}:${m}</div>
                        <div style="font-size:11px;color:#8FB6C9;letter-spacing:.5px;margin-top:4px;">
                          ${jours[d.getDay()]} ${d.getDate()} ${mois[d.getMonth()]} ${d.getFullYear()}</div>`;
              ]]]
            styles:
              card:
                - background: rgba(16,27,39,0.85)
                - border: 1px solid rgba(0,229,255,0.28)
                - border-radius: 20px
                - box-shadow: 0 0 18px rgba(0,229,255,.12)
                - padding: 0 20px
              label:
                - justify-self: start
                - text-align: left
            card_mod:
              style: |
                :host { flex: 1 1 0; }
                ha-card {
                  background: rgba(16,27,39,0.85) !important;
                  border: 1px solid rgba(0,229,255,0.28) !important;
                  border-radius: 20px !important;
                  box-shadow: 0 0 18px rgba(0,229,255,.12) !important;
                  height: 100px
                }

      # --- Navigation bar (sidebar verticale) ---------------------------
      - type: vertical-stack
        view_layout:
          grid-area: nav
        card_mod:
          style: |
            :host {
              display: flex;
              flex-direction: column;
              height: 100%;
              width: 100%;
              min-width: 200px;
              background: rgba(5,11,18,0.85);
              border-radius: 20px;
              border: 1px solid rgba(0,229,255,0.18);
              padding: 16px 10px;
              box-shadow: 0 0 18px rgba(0,229,255,.12);
            }
        cards:
          - type: custom:button-card
            template: vssp_sidebar_logo
            icon: mdi:hexagon-outline
            name: "VISIO SAPIENS"
            label: "Smart Home OS"

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:view-dashboard
            name: HOME
            label: "Vue d'ensemble"
            variables:
              active: true
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens/home
          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:server
            name: CORE
            label: "Système central"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-core/core
          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:sofa
            name: LIVING ROOM
            label: "Salon"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-livingroom/livingroom
          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:bed
            name: BEDROOM-1
            label: "Chambre principale"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-bedroom1/bedroom1
          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:bed
            name: BEDROOM-2
            label: "Chambre 2"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: visio-sapiens-bedroom2/bedroom2
          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:shower
            name: BATHROOM
            label: "Salle de bain"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-bathroom/bathroom
          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:laptop
            name: COMPUTER ROOM
            label: "Salle informatique"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-computer/computer
          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:factory
            name: TECHNICAL ROOM
            label: "Local technique"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-technical/technical
          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:security
            name: SECRET ROOM
            label: "Pièce secrète"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-secret/secret
          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:flower
            name: GARDEN
            label: "Jardin"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-garden/garden
          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:lightning-bolt
            name: ENERGY
            label: "Gestion énergie"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-energy/energy

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:shield-crown
            name: ADMIN
            label: "Panneau administration"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens/admin

          - type: custom:button-card
            show_icon: false
            show_name: false
            show_label: false
            tap_action:
              action: none
            custom_fields:
              logo: >
                <img src="/local/vssp/images/logo_VS-Sapiens.png"
                     style="width:100%;max-width:160px;display:block;margin:0 auto;mix-blend-mode:screen;filter:drop-shadow(0 0 8px rgba(0,229,255,.28));" />
            styles:
              card:
                - background: transparent
                - border: none
                - box-shadow: none
                - padding: 12px 6px 4px 6px
              grid:
                - grid-template-areas: '"logo"'
              custom_fields:
                logo:
                  - width: 100%
            card_mod:
              style: |
                :host { margin-top: auto; }
                ha-card {
                  background: transparent !important;
                  border: none !important;
                  box-shadow: none !important;
                }

      # --- KPI row (System Status / Pièces actives / Energy Status / Sécurité / Connexions) ----
      - type: horizontal-stack
        view_layout:
          grid-area: kpi1
          grid-column: kpi1 / kpi5
        cards:
          # Case 1 — System Status : voyant vert reflétant l'état des métriques du dashboard CORE
          - type: custom:button-card
            template: vssp_status_indicator
            name: SYSTEM STATUS
            label: "Statut métriques CORE"
            entity: binary_sensor.vssp_core_health  # TODO: capteur agrégé à créer (ex: template sensor combinant CPU/GPU/RAM/etc.)

          # Case 2 — Pièces actives
          - type: custom:button-card
            template: vssp_kpi_card
            icon: mdi:door-open
            name: PIÈCES ACTIVES
            entity: sensor.vssp_pieces_actives
            state_display: >
              [[[
                const s = states['sensor.vssp_pieces_actives'];
                if (!s) return "- / -";
                return s.state + " / " + (s.attributes.total_areas ?? "-");
              ]]]
            label: "En activité"
            variables:
              icon_color: "#3AA7FF"
              value_color: "#3AA7FF"

          # Case 3 — Energy Status : voyant vert reflétant l'état des métriques du dashboard ENERGY
          - type: custom:button-card
            template: vssp_status_indicator
            name: ENERGY STATUS
            label: "Statut métriques ENERGY"
            entity: binary_sensor.vssp_energy_health  # TODO: capteur agrégé à créer (ex: template sensor sur production/consommation)

          # Case 4 — Sécurité / Alarme
          - type: custom:button-card
            template: vssp_kpi_card
            icon: mdi:shield-lock
            name: SÉCURITÉ
            entity: alarm_control_panel.maison  # TODO: remplacer par votre entité alarme
            state_display: >
              [[[
                if (!entity) return "Non configuré";
                switch (entity.state) {
                  case "disarmed": return "Parfait";
                  case "triggered": return "ALERTE";
                  case "armed_home": return "Armée";
                  case "armed_away": return "Armée";
                  default: return entity.state;
                }
              ]]]
            label: >
              [[[
                if (!entity) return "Entité non configurée";
                return entity.state === "triggered" ? "Intrusion détectée" : "Aucune alerte";
              ]]]
            variables:
              icon_color: "#00FFC3"
              value_color: "#00FFC3"

          # Case 5 — Connexions (total appareils enregistrés dans HA)
          - type: custom:button-card
            template: vssp_kpi_card
            icon: mdi:vector-polygon
            name: CONNEXIONS
            entity: sensor.vssp_total_appareils
            label: "Appareils connectés"
            variables:
              icon_color: "#B084FF"
              value_color: "#B084FF"

      # --- Video centrale VISIO SAPIENS (remplace le floorplan) -----------
      # Lecture auto, en boucle, sans son.
      # Fichier a deposer dans : /config/www/vssp/movies/vs-sp.mp4
      - type: custom:button-card
        view_layout:
          grid-area: floor
        show_icon: false
        show_name: false
        show_label: false
        tap_action:
          action: none
        custom_fields:
          video: >
            <video autoplay muted loop playsinline
              style="width:100%;height:100%;object-fit:cover;display:block;">
              <source src="/local/vssp/movies/vs-sp.mp4" type="video/mp4" />
            </video>
        styles:
          card:
            - padding: 0
            - background: transparent
            - border: 1px solid rgba(0,229,255,0.28)
            - box-shadow: 0 0 24px rgba(0,229,255,.12)
            - border-radius: 20px
            - overflow: hidden
            - height: 100%
          grid:
            - grid-template-areas: '"video"'
            - height: 100%
          custom_fields:
            video:
              - height: 100%
              - width: 100%
        card_mod:
          style: |
            :host { height: 100%; }
            ha-card { height: 100% !important; overflow: hidden; border-radius: 20px; }

      - type: horizontal-stack
        view_layout:
          grid-area: egy1
          grid-column: egy1 / egy2
        card_mod:
          style: |
            :host {
              height: 100%;
              display: block;
            }
            #root {
              height: 100%;
              align-items: stretch;
            }
        cards:
          # Cadre 1 — courbe production solaire vs consommation (carte native apexcharts)
          - type: custom:apexcharts-card
            header:
              show: true
              title: "PRODUCTION & CONSOMMATION"
              show_states: false
            graph_span: 24h
            card_mod:
              style: |
                :host { flex: 1.8 1 0; align-self: stretch; }
                ha-card {
                  background: var(--osv-panel) !important;
                  height: 100%;
                  max-height: 100%;
                  overflow: hidden;
                }
            series:
              - entity: sensor.solar_power_production  # TODO: remplacer par votre entité production solaire
                name: Production
                type: area
                color: "#00FFC3"
                stroke_width: 2
                opacity: 0.15
              - entity: sensor.home_power_consumption  # TODO: remplacer par votre entité consommation
                name: Consommation
                type: line
                color: "#00E5FF"
                stroke_width: 2

          # Cadre 2 — synthèse kW production / consommation (squelette, entités à brancher)
          - type: vertical-stack
            card_mod:
              style: |
                :host {
                  flex: 0.8 1 0;
                  align-self: stretch;
                  height: 100%;
                }
                #root {
                  height: 100%;
                }
                #root > * {
                  flex: 1 1 0;
                }
            cards:
              - type: custom:button-card
                template: vssp_metric
                show_icon: true
                icon: mdi:solar-power
                name: PRODUCTION
                entity: sensor.solar_power_production  # TODO: remplacer par votre entité production solaire
              - type: custom:button-card
                template: vssp_metric
                show_icon: true
                icon: mdi:flash
                name: CONSOMMATION
                entity: sensor.home_power_consumption  # TODO: remplacer par votre entité consommation

      # --- Événements récents (aligné avec le bas de la sidebar) --------
      - type: logbook
        title: "Événements récents"
        hours_to_show: 24
        view_layout:
          grid-area: events
        target:
          area_id:
            - computer_room
            - technical_room
            - secret_room
            - livingroom
            - kitchen
            - bedroom_1
            - bedroom_2
            - bathroom
            - garden_1
        card_mod:
          style: |
            :host {
              height: 100%;
              display: block;
              overflow: hidden;
            }
            ha-card {
              background: var(--osv-panel) !important;
              height: 100% !important;
              min-height: 0;
              display: flex;
              flex-direction: column;
              overflow: hidden;
              --primary-text-color: #B8E8F5 !important;
              --secondary-text-color: #8FB6C9 !important;
              --primary-color: #00E5FF !important;
              --text-primary-color: #FFFFFF !important;
              --card-background-color: var(--osv-panel) !important;
            }
            ha-card .card-header {
              color: #FFFFFF !important;
            }
            ha-logbook {
              flex: 1 1 0;
              min-height: 0;
              overflow-y: auto;
            }

      # --- Météo et prévisions (alignée avec le bas de la sidebar) ------
      - type: custom:dynamic-weather-card
        entity: weather.meteo_france_forecast_for_city_sausset_les_pins_provence_alpes_cote_d_azur_13_fr_sausset_les_pins
        name: Sausset les Pins
        height: 400
        show_feels_like: true
        show_wind: true
        show_wind_gust: true
        show_wind_direction: true
        show_humidity: true
        show_min_temp: true
        show_hourly_forecast: false
        hourly_forecast_hours: 5
        show_daily_forecast: true
        daily_forecast_days: 5
        show_sunrise_sunset: false
        show_clock: false
        clock_position: top
        clock_format: 24h
        overlay_opacity: 0.1
        language: fr
        wind_speed_unit: ms
        sunrise_entity: ""
        sunset_entity: ""        
        view_layout:
          grid-area: meteo
        card_mod:
          style: |
            :host {
              height: 100%;
              display: block;
              overflow: hidden;
            }
            ha-card {
              background: var(--osv-panel) !important;
              height: 100% !important;
              min-height: 0;
              display: flex;
              flex-direction: column;
              overflow: hidden;
            }

      # --- Zone droite (INTERPHONE + AUDIO STREAM) ----------------------
      - type: vertical-stack
        view_layout:
          grid-area: right
        cards:
          - type: custom:button-card
            template: vssp_panel
            show_name: true
            name: INTERPHONE
            icon: mdi:doorbell-video
            show_icon: true
            styles:
              card:
                - height: 50%
                - justify-content: center
                - align-items: center
              name:
                - color: "#B8E8F5"
                - font-size: 14px
                - letter-spacing: 2px
              icon:
                - color: "#00E5FF"
                - "--mdc-icon-size": 36px

          - type: custom:button-card
            template: vssp_panel
            show_name: true
            name: AUDIO STREAM
            icon: mdi:music-note
            show_icon: true
            styles:
              card:
                - height: 50%
                - justify-content: center
                - align-items: center
              name:
                - color: "#B8E8F5"
                - font-size: 14px
                - letter-spacing: 2px
              icon:
                - color: "#00E5FF"
                - "--mdc-icon-size": 36px



    card_mod:
      style: |
        hui-view {
          background: center / cover no-repeat fixed url("/local/vssp/backgrounds/home.png");
        }

  # =====================================================================
  # CORE (hub — placeholder, itération 2)
  # =====================================================================
  # =====================================================================
  # VUES INCLUSES DEPUIS DES FICHIERS SEPARES
  # Chaque fichier contient une vue complete (sidebar + header + contenu)
  # =====================================================================
  - !include views/core.yaml
  # - !include views/livingroom.yaml    # A creer
  # - !include views/bedroom1.yaml      # A creer
  # - !include views/bedroom2.yaml      # A creer
  # - !include views/bathroom.yaml      # A creer
  # - !include views/computer.yaml      # A creer
  # - !include views/technical.yaml     # A creer
  # - !include views/secret.yaml        # A creer
  # - !include views/garden.yaml        # A creer
  # - !include views/energy.yaml        # A creer

  # =====================================================================
  # ADMIN (panneau caché — non lié dans la sidebar de navigation).
  # Accessible uniquement via l'URL directe /visio-sapiens/admin.
  # Recommandé : restreindre la visibilité à ton seul utilisateur admin
  # via la clé "visible" ci-dessous (remplace USER_ID_ADMIN).
  # =====================================================================
  - title: ADMIN
    path: admin
    subview: true
    visible:
      - user: USER_ID_ADMIN  # TODO: remplace par ton user_id HA (Paramètres > Personnes)
    type: custom:grid-layout
    layout:
      grid-template-columns: 1fr 1fr 1fr
      grid-template-rows: auto auto auto auto
      grid-template-areas: |
        "header header header"
        "discovery upgrade delete"
        "system system system"
        "footer footer footer"
      margin: 24px
      grid-gap: 18px 18px
    cards:
      - type: custom:button-card
        template: vssp_title
        name: VISIO SAPIENS — ADMIN
        view_layout:
          grid-area: header

      # --- Discovery ------------------------------------------------------
      - type: vertical-stack
        view_layout:
          grid-area: discovery
        cards:
          # Bouton 1 — Wizard (ouvre le formulaire dans un nouvel onglet)
          - type: custom:button-card
            template: vssp_admin_button
            icon: mdi:magnify-scan
            name: DISCOVERY WIZARD
            label: "Définir les pièces et assigner les appareils"
            tap_action:
              action: url
              url_path: /local/vssp/wizard/vssp_wizard.html
              target: _blank

          # Bouton 2 — Scan HA (génère report.json côté serveur)
          - type: custom:button-card
            template: vssp_admin_button
            icon: mdi:radar
            name: DISCOVERY SCAN
            label: "Scanner les entités HA (génère report.json)"
            confirmation:
              text: "Lancer une découverte des capteurs dans toutes les zones ?"
            tap_action:
              action: call-service
              service: script.vssp_run_discovery

      # --- Upgrade ----------------------------------------------------------
      - type: custom:button-card
        template: vssp_admin_button
        icon: mdi:rocket-launch
        name: UPGRADE
        label: "Comparer le dashboard aux entités découvertes"
        confirmation:
          text: "Analyser les écarts entre le dashboard actuel et les dernières entités découvertes ? Une sauvegarde sera créée par précaution."
        tap_action:
          action: call-service
          service: script.vssp_run_upgrade
        view_layout:
          grid-area: upgrade

      # --- Delete (protégé : code + confirmation + sauvegarde auto) -------
      - type: vertical-stack
        view_layout:
          grid-area: delete
        card_mod:
          style: |
            :host {
              display: block;
              border: 1px solid rgba(255,61,113,0.35);
              border-radius: 18px;
              padding: 4px;
            }
        cards:
          - type: custom:button-card
            template: vssp_admin_button
            icon: mdi:delete-alert
            name: DELETE DASHBOARD
            label: "Zone dangereuse — code + confirmation requis"
            variables:
              danger: true

          - type: entities
            entities:
              - entity: input_text.vssp_pin_entry
                name: "Code de confirmation"

          - type: custom:button-card
            template: vssp_quick_action
            icon: mdi:trash-can-outline
            name: CONFIRMER LA SUPPRESSION
            confirmation:
              text: "Action IRRÉVERSIBLE sans restauration manuelle de la sauvegarde. Le code doit être correct. Continuer ?"
            tap_action:
              action: call-service
              service: script.vssp_delete_dashboard

      # --- Dashboards systeme (hors pieces) -------------------------------
      - type: vertical-stack
        view_layout:
          grid-area: system
        card_mod:
          style: |
            :host {
              display: block;
              background: rgba(8,18,28,0.75);
              border: 1px solid rgba(0,229,255,0.28);
              border-radius: 18px;
              padding: 14px 16px;
              backdrop-filter: blur(12px);
            }
        cards:
          - type: custom:button-card
            template: vssp_section_title
            name: "Dashboards systeme — non lies a une piece"

          - type: horizontal-stack
            cards:
              # ── ENERGY ─────────────────────────────────────────────
              # Un seul emplacement, deux etats : le bouton CREER
              # n'apparait que si le fichier est absent, le bouton
              # REGENERER que s'il existe. Pas de risque d'ecraser un
              # dashboard en place par une mauvaise manipulation.
              - type: conditional
                conditions:
                  - entity: binary_sensor.vssp_dashboard_energy_present
                    state: "off"
                card:
                  type: custom:button-card
                  template: vssp_admin_button
                  icon: mdi:lightning-bolt-outline
                  name: CREER ENERGY
                  label: "Dashboard absent — le generer depuis le template"
                  confirmation:
                    text: "Generer le dashboard ENERGY a partir du modele et du parc d'appareils detecte ?"
                  tap_action:
                    action: call-service
                    service: script.vssp_create_energy_dashboard

              - type: conditional
                conditions:
                  - entity: binary_sensor.vssp_dashboard_energy_present
                    state: "on"
                card:
                  type: custom:button-card
                  template: vssp_admin_button
                  icon: mdi:lightning-bolt
                  name: REGENERER ENERGY
                  label: >-
                    [[[ return "Genere le " +
                        states['sensor.vssp_dashboard_energy_modifie'].state +
                        " — " +
                        states['sensor.vssp_appareils_mesures'].state +
                        " appareils mesures" ]]]
                  confirmation:
                    text: "Regenerer ENERGY ecrasera le dashboard actuel (une sauvegarde sera creee). Continuer ?"
                  tap_action:
                    action: call-service
                    service: script.vssp_regenerate_energy_dashboard

              # ── SYNC — resynchroniser sans tout regenerer ──────────
              - type: custom:button-card
                template: vssp_admin_button
                icon: mdi:sync
                name: SYNC ENERGY
                label: "Ajouter les nouveaux appareils mesures aux tableaux"
                tap_action:
                  action: call-service
                  service: script.vssp_run_energy_sync

              # ── CORE ───────────────────────────────────────────────
              # Le template core.yaml.j2 n'existe pas encore : le bouton
              # est present pour la coherence du panneau, mais il indique
              # l'etat plutot que de proposer une action qui echouerait.
              # Des que le template sera en place, il suffira de
              # decommenter l'entree "core" dans DASHBOARDS
              # (generate_dashboards.py) et de remplacer ce bouton par le
              # meme couple conditionnel que ENERGY.
              - type: custom:button-card
                template: vssp_admin_button
                icon: mdi:server
                name: CORE
                label: >-
                  [[[ return states['binary_sensor.vssp_dashboard_core_present'].state === 'on'
                        ? "Dashboard en place — template de generation a venir"
                        : "Dashboard absent — template de generation a venir" ]]]
                tap_action:
                  action: none
                styles:
                  card:
                    - opacity: 0.55

      # --- Footer --------------------------------------------------------
      - type: custom:osv-footer-card
        label: VISIO SAPIENS // ADMIN PANEL
        view_layout:
          grid-area: footer

    card_mod:
      style: |
        hui-view {
          background: #02050B;
        }

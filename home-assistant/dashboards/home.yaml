########################################################################
# OSVision V2 — CORE Dashboard (Phase 1)
#
# Vues: 
#   /osvision-v2/home    -> HUD, radar/IA core, metrics, alerts, quick actions - iteration 1
#   /osvision-v2/core    -> HUD, radar/IA core, metrics, alerts, quick actions - iteration 2
#   /osvision-v2/bedromm1-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 3
#   /osvision-v2/bedroom2-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 4
#   /osvision-v2/bathroom-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 5
#   /osvision-v2/computer-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 6
#   /osvision-v2/technical-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 7
#   /osvision-v2/secret  -> HUD, radar/IA core, metrics, alerts, quick actions - iteration 8
#   /osvision-v2/garden  -> HUD, radar/IA core, metrics, alerts, quick actions - iteration 9
#
# Dépendances lovelace (à installer via HACS + déclarer en resources) :
#   button-card, card-mod, layout-card, custom:stack-in-card,
#   apexcharts-card, config-template-card, decluttering-card, browser_mod
########################################################################

title: OSVision V2
path: osvision-v2
theme: OSVision V2

button_card_templates: !include templates/button_card_templates.yaml
decluttering_templates: !include templates/decluttering_templates.yaml

views:
  # =====================================================================
  # HOME (hub — placeholder, itération 1)
  # =====================================================================
  - title: HOME
    path: home
    type: custom:grid-layout
    layout:
      grid-template-columns: 1fr 1.4fr 1fr
      grid-template-rows: auto auto 1fr auto auto
      grid-template-areas: |
        "header header header"
        "nav nav nav"
        "metrics radar alerts"
        "quick quick quick"
        "footer footer footer"
      margin: 12px
      grid-gap: 14px 14px
    cards:
      # --- HUD header -------------------------------------------------
      - type: custom:button-card
        template: osvision_title
        name: OSVISION V2 — NEURAL CORE ACTIVE
        view_layout:
          grid-area: header

      # --- Navigation bar ----------------------------------------------
      - type: horizontal-stack
        view_layout:
          grid-area: nav
        cards:
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:view-dashboard
            name: HOME
            variables:
              active: true
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/home
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:server
            name: CORE
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/core
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:sofa
            name: LIVING ROOM
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/livingroom
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:bed
            name: BEDROOM-1
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/bedroom1
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:bed
            name: BEDROOM-2
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/bedroom2
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:shower
            name: BATHROOM
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/bathroom
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:laptop
            name: COMPUTER ROOM
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/pcroom
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:factory
            name: TECHNICAL ROOM
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/technicalroom
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:security
            name: SECRET ROOM
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/secretroom
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:flower
            name: GARDEN
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/garden
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:lightning-bolt
            name: ENERGY
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/energy

      # --- Metrics column (jauges néon) ---------------------------------
      # NB: adaptez les entity_id à vos capteurs réels (ceux ci-dessous
      # existent déjà dans votre configuration d'après le squelette initial).
      # Le capteur "Storage" est un exemple à remplacer par votre entité.
      - type: grid
        columns: 2
        square: false
        view_layout:
          grid-area: metrics
        cards:
          - type: custom:decluttering-card
            template: osvision_gauge
            variables:
              - entity: sensor.192_168_1_11_utilisation_cpu
              - name: CPU
              - color: "#00E5FF"
          - type: custom:decluttering-card
            template: osvision_gauge
            variables:
              - entity: sensor.computer_room_192_168_1_11_radeon_hd_7800_series_gpu_amd1_memory_usage
              - name: GPU
              - color: "#00FFC3"
          - type: custom:decluttering-card
            template: osvision_gauge
            variables:
              - entity: sensor.192_168_1_11_utilisation_de_la_memoire
              - name: RAM
              - color: "#3AA7FF"
          - type: custom:decluttering-card
            template: osvision_gauge
            variables:
              - entity: sensor.192_168_1_11_edge_temperature
              - name: TEMP
              - color: "#FF9800"
              - max: 100
          - type: custom:decluttering-card
            template: osvision_gauge
            variables:
              - entity: sensor.192_168_1_11_enp12s0_rx
              - name: DOWN
              - color: "#B084FF"
          - type: custom:decluttering-card
            template: osvision_gauge
            variables:
              - entity: sensor.192_168_1_11_enp12s0_tx
              - name: UP
              - color: "#B084FF"
          - type: custom:decluttering-card
            template: osvision_gauge
            variables:
              - entity: sensor.192_168_1_11_espace_libre
              - name: UP
              - color: "#B084FF"

      # --- Radar central / IA Core --------------------------------------
      - type: custom:osv-radar-card
        title: IA CORE
        view_layout:
          grid-area: radar

      # --- Alerts column ---------------------------------------------------
      # Placeholder statique. En itération 2: générer dynamiquement via
      # auto-entities / template à partir d'un capteur de notifications HA.
      - type: vertical-stack
        view_layout:
          grid-area: alerts
        cards:
          - type: custom:button-card
            template: osvision_alert
            icon: mdi:check-circle
            name: Tous les systèmes sont nominaux
            variables:
              level: ok
          - type: custom:button-card
            template: osvision_alert
            icon: mdi:information
            name: "Mise à jour OSVision V2 déployée"
            variables:
              level: info

      # --- Quick actions -----------------------------------------------
      # Remplacez les entity_id / services par vos scènes et scripts réels.
      - type: horizontal-stack
        view_layout:
          grid-area: quick
        cards:
          - type: custom:button-card
            template: osvision_quick_action
            icon: mdi:weather-night
            name: GOOD NIGHT
            tap_action:
              action: call-service
              service: script.turn_on
              service_data:
                entity_id: script.good_night
          - type: custom:button-card
            template: osvision_quick_action
            icon: mdi:movie-open
            name: MOVIE MODE
            tap_action:
              action: call-service
              service: scene.turn_on
              service_data:
                entity_id: scene.movie_mode
          - type: custom:button-card
            template: osvision_quick_action
            icon: mdi:lightbulb-off
            name: ALL OFF
            tap_action:
              action: call-service
              service: light.turn_off
              service_data:
                entity_id: all
          - type: custom:button-card
            template: osvision_quick_action
            icon: mdi:lock
            name: LOCK ALL
            tap_action:
              action: call-service
              service: lock.lock
              service_data:
                entity_id: all

      # --- Footer --------------------------------------------------------
      - type: custom:osv-footer-card
        label: OSVISION V2 // CORE SYSTEM
        view_layout:
          grid-area: footer

    card_mod:
      style: |
        hui-view {
          background: center / cover no-repeat fixed url("/local/osvision_v2/backgrounds/home.png");
        }


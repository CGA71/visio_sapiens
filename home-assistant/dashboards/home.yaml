########################################################################
# OSVision V2 — CORE Dashboard (Phase 1)
#
# Vues: 
#   /osvision-v2/home    -> HUD, radar/IA core, metrics, alerts, quick actions - iteration 1
#   /osvision-v2/core    -> HUD, radar/IA core, metrics, alerts, quick actions - iteration 2
#   /osvision-v2/bedromm1-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 3
#   /osvision-v2/bedroom2-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 4
#   /osvision-v2/bathroom-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 5
#   /osvision-v2/computer-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 6
#   /osvision-v2/technical-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 7
#   /osvision-v2/secret  -> HUD, radar/IA core, metrics, alerts, quick actions - iteration 8
#   /osvision-v2/garden  -> HUD, radar/IA core, metrics, alerts, quick actions - iteration 9
#
# Dépendances lovelace (à installer via HACS + déclarer en resources) :
#   button-card, card-mod, layout-card, custom:stack-in-card,
#   apexcharts-card, config-template-card, decluttering-card, browser_mod
########################################################################

title: OSVision V2
path: osvision-v2
theme: OSVision V2

button_card_templates: !include templates/button_card_templates.yaml
decluttering_templates: !include templates/decluttering_templates.yaml

views:
  # =====================================================================
  # HOME (hub — placeholder, itération 1)
  # =====================================================================
  - title: HOME
    path: home
    subview: true
    type: custom:grid-layout
    layout:
      grid-template-columns: minmax(200px, auto) 1fr 1fr 1fr 1fr 1fr 565px
      grid-template-rows: 105px 113px 444px 336px auto
      grid-template-areas: |
        "nav band1 band2 band3 band4 band5 band5"
        "nav kpi1 kpi2 kpi3 kpi4 kpi5 kpi5"
        "nav floor floor floor floor right right"
        "nav egy1 egy2 egy3 egy4 egy4 egy4"
        "nav footer footer footer footer footer footer"
      margin: 12px
      grid-gap: 14px 14px
    cards:
      # --- HUD header (bandeau horizontal) ------------------------------
      - type: horizontal-stack
        view_layout:
          grid-area: band1
          grid-column: band1 / band5
        cards:
          # Case 1 — retour + titre + descriptif de la page
          - type: custom:button-card
            template: osvision_page_header
            icon: mdi:chevron-left
            name: HOME
            label: "Vue d'ensemble de votre système"
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/home
            card_mod:
              style: |
                :host { flex: 1.6 1 0; }

          # Case 2 — statut alarme maison (squelette, entité à brancher)
          - type: custom:button-card
            template: osvision_alarm_status
            entity: alarm_control_panel.maison  # TODO: remplacer par votre entité alarme
            name: MAISON
            card_mod:
              style: |
                :host { flex: 1 1 0; }

          # Case 3 — date et heure en direct
          - type: custom:osv-datetime-card
            icon: mdi:calendar-clock
            card_mod:
              style: |
                :host { flex: 1 1 0; }
                ha-card {
                  background: var(--osv-panel) !important;
                  border: var(--osv-border) !important;
                  border-radius: var(--osv-radius-md) !important;
                  box-shadow: var(--osv-glow-cyan) !important;
                }

          # Case 4 — météo extérieure (carte native Home Assistant)
          - type: weather-forecast
            entity: weather.home  # TODO: remplacer par votre entité météo
            show_current: true
            show_forecast: false
            card_mod:
              style: |
                :host { flex: 1 1 0; }

          # Case 5 — logo / avatar OS
          - type: custom:button-card
            template: osvision_os_avatar
            name: "OS"
            card_mod:
              style: |
                :host { flex: 0 0 56px; }

      # --- Navigation bar (sidebar verticale) ---------------------------
      - type: vertical-stack
        view_layout:
          grid-area: nav
        card_mod:
          style: |
            :host {
              display: flex;
              flex-direction: column;
              height: 100%;
              width: 100%;
              min-width: 200px;
              background: rgba(5,11,18,0.85);
              border-radius: 20px;
              border: 1px solid rgba(0,229,255,0.18);
              padding: 16px 10px;
              box-shadow: 0 0 18px rgba(0,229,255,.12);
            }
        cards:
          - type: custom:button-card
            template: osvision_sidebar_logo
            icon: mdi:hexagon-outline
            name: "OSVISION V2"
            label: "Smart Home OS"

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:view-dashboard
            name: HOME
            label: "Vue d'ensemble"
            variables:
              active: true
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/home
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:server
            name: CORE
            label: "Système central"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/core
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:sofa
            name: LIVING ROOM
            label: "Salon"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/livingroom
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:bed
            name: BEDROOM-1
            label: "Chambre principale"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/bedroom1
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:bed
            name: BEDROOM-2
            label: "Chambre 2"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/bedroom2
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:shower
            name: BATHROOM
            label: "Salle de bain"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/bathroom
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:laptop
            name: COMPUTER ROOM
            label: "Salle informatique"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/pcroom
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:factory
            name: TECHNICAL ROOM
            label: "Local technique"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/technicalroom
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:security
            name: SECRET ROOM
            label: "Pièce secrète"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/secretroom
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:flower
            name: GARDEN
            label: "Jardin"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/garden
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:lightning-bolt
            name: ENERGY
            label: "Gestion énergie"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/energy

          - type: custom:button-card
            template: osvision_sidebar_brand_footer
            icon: mdi:hexagon-outline
            name: "OSVISION V2"
            label: "SMART HOME OS"

      # --- KPI row (System Status / Pièces actives / Energy Status / Sécurité / Connexions) ----
      - type: horizontal-stack
        view_layout:
          grid-area: kpi1
          grid-column: kpi1 / kpi5
        cards:
          # Case 1 — System Status : voyant vert reflétant l'état des métriques du dashboard CORE
          - type: custom:button-card
            template: osvision_status_indicator
            name: SYSTEM STATUS
            label: "Statut métriques CORE"
            entity: binary_sensor.osvision_core_health  # TODO: capteur agrégé à créer (ex: template sensor combinant CPU/GPU/RAM/etc.)

          # Case 2 — Pièces actives
          - type: custom:button-card
            template: osvision_kpi_card
            icon: mdi:door-open
            name: PIÈCES ACTIVES
            entity: sensor.osvision_pieces_actives
            state_display: >
              [[[
                const s = states['sensor.osvision_pieces_actives'];
                if (!s) return "- / -";
                return s.state + " / " + (s.attributes.total_areas ?? "-");
              ]]]
            label: "En activité"
            variables:
              icon_color: "#3AA7FF"
              value_color: "#3AA7FF"

          # Case 3 — Energy Status : voyant vert reflétant l'état des métriques du dashboard ENERGY
          - type: custom:button-card
            template: osvision_status_indicator
            name: ENERGY STATUS
            label: "Statut métriques ENERGY"
            entity: binary_sensor.osvision_energy_health  # TODO: capteur agrégé à créer (ex: template sensor sur production/consommation)

          # Case 4 — Sécurité / Alarme
          - type: custom:button-card
            template: osvision_kpi_card
            icon: mdi:shield-lock
            name: SÉCURITÉ
            entity: alarm_control_panel.maison  # TODO: remplacer par votre entité alarme
            state_display: >
              [[[
                if (!entity) return "Non configuré";
                switch (entity.state) {
                  case "disarmed": return "Parfait";
                  case "triggered": return "ALERTE";
                  case "armed_home": return "Armée";
                  case "armed_away": return "Armée";
                  default: return entity.state;
                }
              ]]]
            label: >
              [[[
                if (!entity) return "Entité non configurée";
                return entity.state === "triggered" ? "Intrusion détectée" : "Aucune alerte";
              ]]]
            variables:
              icon_color: "#00FFC3"
              value_color: "#00FFC3"

          # Case 5 — Connexions (total appareils enregistrés dans HA)
          - type: custom:button-card
            template: osvision_kpi_card
            icon: mdi:vector-polygon
            name: CONNEXIONS
            entity: sensor.osvision_total_appareils
            label: "Appareils connectés"
            variables:
              icon_color: "#B084FF"
              value_color: "#B084FF"

      # --- Plan interactif de la maison (picture-elements) -----------------
      # Image a deposer dans : /config/www/osvision_v2/images/floorplan.jpg
      # Les overlays affichent la temperature par piece en temps reel.
      # Remplace chaque entity_id sensor.xxx par ton vrai capteur.
      - type: picture-elements
        view_layout:
          grid-area: floor
        image: /local/osvision_v2/images/floorplan.jpg
        card_mod:
          style: |
            ha-card {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
              max-height: calc(100vh - 220px);
              height: calc(100vh - 220px);
              overflow: hidden;
              display: flex;
              align-items: flex-start;
            }
            img {
              width: 100% !important;
              height: 100% !important;
              object-fit: contain;
              object-position: left top;
            }
        elements:
          # ---- GROUND FLOOR ----
          - type: state-label
            entity: sensor.secret_room_temperature  # TODO
            prefix: "🌡 "
            suffix: "°C"
            style:
              top: 4%
              left: 24%
              color: "#00E5FF"
              font-size: 11px
              font-weight: bold
              background: rgba(0,229,255,0.12)
              border: 1px solid rgba(0,229,255,0.4)
              border-radius: 6px
              padding: 2px 6px
              white-space: nowrap

          - type: state-label
            entity: sensor.living_room_temperature  # TODO
            prefix: "🌡 "
            suffix: "°C"
            style:
              top: 22%
              left: 28%
              color: "#00E5FF"
              font-size: 11px
              font-weight: bold
              background: rgba(0,229,255,0.12)
              border: 1px solid rgba(0,229,255,0.4)
              border-radius: 6px
              padding: 2px 6px
              white-space: nowrap

          - type: state-label
            entity: sensor.kitchen_temperature  # TODO
            prefix: "🌡 "
            suffix: "°C"
            style:
              top: 35%
              left: 17%
              color: "#00E5FF"
              font-size: 11px
              font-weight: bold
              background: rgba(0,229,255,0.12)
              border: 1px solid rgba(0,229,255,0.4)
              border-radius: 6px
              padding: 2px 6px
              white-space: nowrap

          - type: state-label
            entity: sensor.technical_room_temperature  # TODO
            prefix: "🌡 "
            suffix: "°C"
            style:
              top: 62%
              left: 10%
              color: "#00E5FF"
              font-size: 11px
              font-weight: bold
              background: rgba(0,229,255,0.12)
              border: 1px solid rgba(0,229,255,0.4)
              border-radius: 6px
              padding: 2px 6px
              white-space: nowrap

          - type: state-label
            entity: sensor.computer_room_temperature  # TODO
            prefix: "🌡 "
            suffix: "°C"
            style:
              top: 62%
              left: 31%
              color: "#00E5FF"
              font-size: 11px
              font-weight: bold
              background: rgba(0,229,255,0.12)
              border: 1px solid rgba(0,229,255,0.4)
              border-radius: 6px
              padding: 2px 6px
              white-space: nowrap

          - type: state-label
            entity: sensor.spa_temperature  # TODO
            prefix: "🌡 "
            suffix: "°C"
            style:
              top: 52%
              left: 44%
              color: "#FF9800"
              font-size: 11px
              font-weight: bold
              background: rgba(255,152,0,0.12)
              border: 1px solid rgba(255,152,0,0.4)
              border-radius: 6px
              padding: 2px 6px
              white-space: nowrap

          # ---- FIRST FLOOR ----
          - type: state-label
            entity: sensor.bedroom1_temperature  # TODO
            prefix: "🌡 "
            suffix: "°C"
            style:
              top: 64%
              left: 86%
              color: "#00E5FF"
              font-size: 11px
              font-weight: bold
              background: rgba(0,229,255,0.12)
              border: 1px solid rgba(0,229,255,0.4)
              border-radius: 6px
              padding: 2px 6px
              white-space: nowrap

          - type: state-label
            entity: sensor.bedroom2_temperature  # TODO
            prefix: "🌡 "
            suffix: "°C"
            style:
              top: 32%
              left: 86%
              color: "#00E5FF"
              font-size: 11px
              font-weight: bold
              background: rgba(0,229,255,0.12)
              border: 1px solid rgba(0,229,255,0.4)
              border-radius: 6px
              padding: 2px 6px
              white-space: nowrap

          - type: state-label
            entity: sensor.bathroom_temperature  # TODO
            prefix: "🌡 "
            suffix: "°C"
            style:
              top: 61%
              left: 68%
              color: "#00E5FF"
              font-size: 11px
              font-weight: bold
              background: rgba(0,229,255,0.12)
              border: 1px solid rgba(0,229,255,0.4)
              border-radius: 6px
              padding: 2px 6px
              white-space: nowrap

          # ---- SOLAR PANELS ----
          - type: state-label
            entity: sensor.solar_power_production  # TODO
            prefix: "☀ "
            suffix: " kW"
            style:
              top: 9%
              left: 75%
              color: "#FFD700"
              font-size: 11px
              font-weight: bold
              background: rgba(255,215,0,0.12)
              border: 1px solid rgba(255,215,0,0.4)
              border-radius: 6px
              padding: 2px 6px
              white-space: nowrap

      - type: horizontal-stack
        view_layout:
          grid-area: egy1
          grid-column: egy1 / egy4
        cards:
          # Cadre 1 — courbe production solaire vs consommation (carte native apexcharts)
          - type: custom:apexcharts-card
            header:
              show: true
              title: "PRODUCTION & CONSOMMATION"
              show_states: false
            graph_span: 24h
            card_mod:
              style: |
                :host { flex: 1.8 1 0; }
                ha-card { background: var(--osv-panel) !important; }
            series:
              - entity: sensor.solar_power_production  # TODO: remplacer par votre entité production solaire
                name: Production
                type: area
                color: "#00FFC3"
                stroke_width: 2
                opacity: 0.15
              - entity: sensor.home_power_consumption  # TODO: remplacer par votre entité consommation
                name: Consommation
                type: line
                color: "#00E5FF"
                stroke_width: 2

          # Cadre 2 — synthèse kW production / consommation (squelette, entités à brancher)
          - type: vertical-stack
            card_mod:
              style: |
                :host { flex: 0.8 1 0; }
            cards:
              - type: custom:button-card
                template: osvision_metric
                show_icon: true
                icon: mdi:solar-power
                name: PRODUCTION
                entity: sensor.solar_power_production  # TODO: remplacer par votre entité production solaire
              - type: custom:button-card
                template: osvision_metric
                show_icon: true
                icon: mdi:flash
                name: CONSOMMATION
                entity: sensor.home_power_consumption  # TODO: remplacer par votre entité consommation

          # Cadre 3 — événements des appareils connectés (carte native Home Assistant)
          - type: logbook
            title: "Événements récents"
            hours_to_show: 24
            target:
              area_id:
                - computer_room
                - technical_room
                - secret_room
                - livingroom
                - kitchen
                - bedroom_1
                - bedroom_2
                - bathroom
                - garden_1
            card_mod:
              style: |
                :host { flex: 1 1 0; }
                ha-card {
                  background: var(--osv-panel) !important;
                  --primary-text-color: #B8E8F5 !important;
                  --secondary-text-color: #8FB6C9 !important;
                  --primary-color: #00E5FF !important;
                  --text-primary-color: #FFFFFF !important;
                  --card-background-color: var(--osv-panel) !important;
                }
                ha-card .card-header {
                  color: #FFFFFF !important;
                }

          # Cadre 4 — Météo et prévisions (Enhanced Weather Chart Card)
          - type: custom:weather-chart-card
            entity: weather.home  # TODO: remplacer par votre entité météo
            card_mod:
              style: |
                :host {
                  flex: 1 1 0;
                  align-self: stretch;
                }
                ha-card {
                  background: var(--osv-panel) !important;
                  height: 100%;
                  min-height: 0;
                  display: flex;
                  flex-direction: column;
                }

      # --- Zone droite (INTERPHONE + AUDIO STREAM) ----------------------
      - type: vertical-stack
        view_layout:
          grid-area: right
        cards:
          - type: custom:button-card
            template: osvision_panel
            show_name: true
            name: INTERPHONE
            icon: mdi:doorbell-video
            show_icon: true
            styles:
              card:
                - height: 50%
                - justify-content: center
                - align-items: center
              name:
                - color: "#B8E8F5"
                - font-size: 14px
                - letter-spacing: 2px
              icon:
                - color: "#00E5FF"
                - "--mdc-icon-size": 36px

          - type: custom:button-card
            template: osvision_panel
            show_name: true
            name: AUDIO STREAM
            icon: mdi:music-note
            show_icon: true
            styles:
              card:
                - height: 50%
                - justify-content: center
                - align-items: center
              name:
                - color: "#B8E8F5"
                - font-size: 14px
                - letter-spacing: 2px
              icon:
                - color: "#00E5FF"
                - "--mdc-icon-size": 36px

      # --- Footer --------------------------------------------------------
      - type: custom:osv-footer-card
        label: OSVISION V2 // CORE SYSTEM
        view_layout:
          grid-area: footer

    card_mod:
      style: |
        hui-view {
          background: center / cover no-repeat fixed url("/local/osvision_v2/backgrounds/home.png");
        }

  # =====================================================================
  # CORE (hub — placeholder, itération 2)
  # =====================================================================
  - title: CORE
    path: core
    subview: true
    type: custom:grid-layout
    layout:
      grid-template-columns: 240px 1fr 1.4fr 1fr
      grid-template-rows: auto 1fr auto auto
      grid-template-areas: |
        "nav header header header"
        "nav metrics radar alerts"
        "nav quick quick quick"
        "nav footer footer footer"
      margin: 12px
      grid-gap: 14px 14px
    cards:
      # --- HUD header (bandeau horizontal) ------------------------------
      - type: horizontal-stack
        view_layout:
          grid-area: header
        cards:
          # Case 1 — retour + titre + descriptif de la page
          - type: custom:button-card
            template: osvision_page_header
            icon: mdi:chevron-left
            name: CORE
            label: "Système central"
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/home
            card_mod:
              style: |
                :host { flex: 1.6 1 0; }

          # Case 2 — météo extérieure (carte native Home Assistant)
          - type: weather-forecast
            entity: weather.home  # TODO: remplacer par votre entité météo
            show_current: true
            show_forecast: false
            card_mod:
              style: |
                :host { flex: 1 1 0; }

          # Case 3 — date et heure en direct
          - type: custom:osv-datetime-card
            icon: mdi:calendar-clock
            card_mod:
              style: |
                :host { flex: 1 1 0; }

          # Case 4 — statut alarme maison (squelette, entité à brancher)
          - type: custom:button-card
            template: osvision_alarm_status
            entity: alarm_control_panel.maison  # TODO: remplacer par votre entité alarme
            name: MAISON
            card_mod:
              style: |
                :host { flex: 1 1 0; }

          # Case 5 — logo / avatar OS
          - type: custom:button-card
            template: osvision_os_avatar
            name: "OS"
            card_mod:
              style: |
                :host { flex: 0 0 56px; }

      # --- Navigation bar (sidebar verticale) ---------------------------
      - type: vertical-stack
        view_layout:
          grid-area: nav
        card_mod:
          style: |
            :host {
              display: flex;
              flex-direction: column;
              height: 100%;
              background: rgba(5,11,18,0.85);
              border-radius: 20px;
              border: 1px solid rgba(0,229,255,0.18);
              padding: 16px 10px;
              box-shadow: 0 0 18px rgba(0,229,255,.12);
            }
        cards:
          - type: custom:button-card
            template: osvision_sidebar_logo
            icon: mdi:hexagon-outline
            name: "OSVISION V2"
            label: "Smart Home OS"

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:view-dashboard
            name: HOME
            label: "Vue d'ensemble"
            variables:
              active: true
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/home
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:server
            name: CORE
            label: "Système central"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/core
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:sofa
            name: LIVING ROOM
            label: "Salon"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/livingroom
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:bed
            name: BEDROOM-1
            label: "Chambre principale"
            variables:
              active: false
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/bedroom1
          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:bed
            name: BEDROOM-2
            label: "Chambre 2"
            variables:
              active: false

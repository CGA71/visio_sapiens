########################################################################
# OSVision V2 — COMPUTER Dashboard — ÉTAPE 1 / 3
#
# Emplacement : home-assistant/dashboards/views/computer.yaml
#
# Cette version ne contient QUE la ligne 1 (header : titre / météo /
# heure+logo) + la sidebar nav. La zone de contenu est un simple
# placeholder. Objectif : valider que cette base s'affiche sans
# "Unknown error" avant d'ajouter la ligne 2 (plan + badges) puis la
# ligne 3 (cartes d'interaction).
#
# Remplace les entités marquées # TODO par les tiennes.
########################################################################
title: DESK
theme: OSVision V2

button_card_templates: !include ../templates/button_card_templates.yaml
decluttering_templates: !include ../templates/decluttering_templates.yaml

views:
  - title: DESK
    path: computer
    subview: false
    type: custom:grid-layout
    layout:
      grid-template-columns: minmax(200px, auto) 1fr
      grid-template-rows: 105px auto
      grid-template-areas: |
        "nav header"
        "nav content"
      margin: 12px
      grid-gap: 14px 14px
    cards:

      # ═══════════════════════════════════════════════════════════════
      # LIGNE 1 — HEADER : titre / météo / heure + logo
      # ═══════════════════════════════════════════════════════════════
      - type: horizontal-stack
        view_layout:
          grid-area: header
        cards:

          # ── Case 1 : nom du dashboard ─────────────────────────────
          - type: custom:button-card
            template: osvision_page_header
            icon: mdi:chevron-left
            name: DESK
            label: "Bureau & salle informatique"
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/home
            card_mod:
              style: |
                :host { flex: 1.4 1 0; }

          # ── Case 2 : météo du jour (platinum-weather-card) ─────────
          - type: custom:platinum-weather-card
            entity: weather.home                                 # TODO
            name: "Météo du jour"
            card_mod:
              style: |
                :host { flex: 1 1 0; }
                ha-card {
                  background: rgba(16,27,39,0.85) !important;
                  border: 1px solid rgba(0,229,255,0.28) !important;
                  border-radius: 20px !important;
                  box-shadow: 0 0 18px rgba(0,229,255,.12);
                  color: #FFFFFF !important;
                }

          # ── Case 3 : heure + logo OS ───────────────────────────────
          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            custom_fields:
              clock: |
                [[[ return `
                  <div style="display:flex;align-items:center;justify-content:space-between;
                    height:100%;padding:0 18px;">
                    <div>
                      <div style="font-family:'Orbitron',sans-serif;font-size:22px;
                        color:#00E5FF;">--:--</div>
                      <div style="font-size:11px;color:#8FB6C9;letter-spacing:.5px;">
                        Dimanche 26 Juillet 2026</div>
                    </div>
                    <div style="width:44px;height:44px;border-radius:50%;
                      background:conic-gradient(from 180deg,#00E5FF,#00FFD5,#00E5FF);
                      display:flex;align-items:center;justify-content:center;
                      box-shadow:0 0 14px rgba(0,229,255,.4);">
                      <span style="font-family:'Orbitron',sans-serif;font-size:11px;
                        font-weight:900;color:#050B12;">OS</span>
                    </div>
                  </div>
                `]]]
            styles:
              card:
                - background: rgba(16,27,39,0.85)
                - border: 1px solid rgba(0,229,255,0.28)
                - border-radius: 20px
                - box-shadow: 0 0 18px rgba(0,229,255,.12)
                - height: 100%
              custom_fields:
                clock:
                  - width: 100%
                  - height: 100%
            card_mod:
              style: |
                :host { flex: 1 1 0; }

      # ═══════════════════════════════════════════════════════════════
      # SIDEBAR NAV — identique aux autres vues, DESK / COMPUTER ROOM actif
      # ═══════════════════════════════════════════════════════════════
      - type: vertical-stack
        view_layout:
          grid-area: nav
        card_mod:
          style: |
            :host {
              display: flex;
              flex-direction: column;
              height: 100%;
              width: 100%;
              min-width: 200px;
              background: rgba(5,11,18,0.85);
              border-radius: 20px;
              border: 1px solid rgba(0,229,255,0.18);
              padding: 16px 10px;
              box-shadow: 0 0 18px rgba(0,229,255,.12);
            }
        cards:
          - type: custom:button-card
            template: osvision_sidebar_logo
            icon: mdi:hexagon-outline
            name: "OSVISION V2"
            label: "Smart Home OS"

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:view-dashboard
            name: HOME
            label: "Vue d'ensemble"
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/home

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:server
            name: CORE
            label: "Systeme central"
            tap_action:
              action: navigate
              navigation_path: /osvision-core/core

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:sofa
            name: LIVING ROOM
            label: "Salon"
            tap_action:
              action: navigate
              navigation_path: /osvision-livingroom/livingroom

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:bed
            name: BEDROOM-1
            label: "Chambre principale"
            tap_action:
              action: navigate
              navigation_path: /osvision-bedroom1/bedroom1

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:bed-outline
            name: BEDROOM-2
            label: "Chambre 2"
            tap_action:
              action: navigate
              navigation_path: /osvision-bedroom2/bedroom2

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:shower
            name: BATHROOM
            label: "Salle de bain"
            tap_action:
              action: navigate
              navigation_path: /osvision-bathroom/bathroom

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:desktop-tower-monitor
            name: COMPUTER ROOM
            label: "Salle informatique"
            variables:
              active: true
            tap_action:
              action: navigate
              navigation_path: /osvision-computer/computer

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:tools
            name: TECHNICAL ROOM
            label: "Local technique"
            tap_action:
              action: navigate
              navigation_path: /osvision-technical/technical

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:key
            name: SECRET ROOM
            label: "Piece secrete"
            tap_action:
              action: navigate
              navigation_path: /osvision-secret/secret

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:flower
            name: GARDEN
            label: "Jardin"
            tap_action:
              action: navigate
              navigation_path: /osvision-garden/garden

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:lightning-bolt
            name: ENERGY
            label: "Gestion energie"
            tap_action:
              action: navigate
              navigation_path: /osvision-energy/energy

          - type: custom:button-card
            template: osvision_sidebar_brand_footer
            icon: mdi:hexagon-outline
            name: "OSVISION V2"
            label: "SMART HOME OS"

      # ═══════════════════════════════════════════════════════════════
      # PLACEHOLDER — sera remplacé par la ligne 2 (plan + badges) puis
      # la ligne 3 (interactions) une fois cette étape validée
      # ═══════════════════════════════════════════════════════════════
      - type: markdown
        view_layout:
          grid-area: content
        content: "**Étape 1/3 validée** — la ligne 2 (plan desk.png + badges) et la ligne 3 (cartes d'interaction) seront ajoutées ensuite."
        card_mod:
          style: |
            ha-card {
              background: rgba(16,27,39,0.85) !important;
              border: 1px solid rgba(0,229,255,0.25) !important;
              border-radius: 20px !important;
              box-shadow: 0 0 18px rgba(0,229,255,.1) !important;
              color: #8FB6C9 !important;
              padding: 24px !important;
              height: 100%;
            }

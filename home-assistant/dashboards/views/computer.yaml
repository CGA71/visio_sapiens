########################################################################
# OSVision V2 — COMPUTER Dashboard (Bureau / Salle informatique)
#
# Emplacement : home-assistant/dashboards/views/computer.yaml
# url_path associé : osvision-computer   (vue : /osvision-computer/computer)
#
# Structure en 3 LIGNES :
#   LIGNE 1 — header : [ Titre ] [ Météo ] [ Heure + logo OS ]
#   LIGNE 2 — plan desk.png avec badges de statut (vert=OK / rouge=KO)
#   LIGNE 3 — cartes d'interaction, une par appareil
#
# ── ROBUSTESSE / CHOIX TECHNIQUES ─────────────────────────────────────
# Cette version évite volontairement tout ce qui a fait planter le
# panel dans les essais précédents :
#   • PAS de template "osvision_section_title" (absent de ta librairie
#     de base → remplacé par un simple markdown stylé).
#   • PAS de "custom:simple-weather-card" (non installé chez toi → météo
#     via la carte NATIVE "weather-forecast", toujours dispo).
#   • Actions de service en syntaxe MODERNE "perform_action:" / "data:"
#     (l'ancienne "service:" / "service_data:" est dépréciée et casse le
#     rendu sur les versions récentes de button-card / HA).
#   • Seuls des templates GARANTIS présents sont utilisés :
#     osvision_page_header, osvision_os_avatar, osvision_sidebar_logo,
#     osvision_nav_button, osvision_sidebar_brand_footer.
#
# ── PRÉREQUIS ─────────────────────────────────────────────────────────
# 1. Image dans : home-assistant/www/osvision_v2/images/desk.png
# 2. Remplacer chaque entité « # TODO » par la vôtre.
#    Les badges ligne 2 pointent sur des binary_sensor de connectivité
#    (on = fonctionne / off = ne fonctionne pas).
########################################################################
title: DESK
theme: OSVision V2

button_card_templates: !include ../templates/button_card_templates.yaml
decluttering_templates: !include ../templates/decluttering_templates.yaml

views:
  - title: DESK
    path: computer
    subview: false
    type: custom:grid-layout
    layout:
      grid-template-columns: minmax(200px, auto) 1fr
      grid-template-rows: 105px 380px auto
      grid-template-areas: |
        "nav header"
        "nav image"
        "nav devices"
      margin: 12px
      grid-gap: 14px 14px
    cards:

      # ═══════════════════════════════════════════════════════════════
      # LIGNE 1 — HEADER : titre / météo / heure + logo
      # ═══════════════════════════════════════════════════════════════
      - type: horizontal-stack
        view_layout:
          grid-area: header
        cards:

          # ── Case 1 : titre ────────────────────────────────────────
          - type: custom:button-card
            template: osvision_page_header
            icon: mdi:chevron-left
            name: DESK
            label: "Bureau & salle informatique"
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/home
            card_mod:
              style: |
                :host { flex: 1.6 1 0; }

          # ── Case 2 : météo (carte NATIVE, toujours disponible) ─────
          - type: weather-forecast
            entity: weather.home                                 # TODO
            show_current: true
            show_forecast: false
            card_mod:
              style: |
                :host { flex: 1 1 0; }
                ha-card {
                  background: rgba(16,27,39,0.85) !important;
                  border: 1px solid rgba(0,229,255,0.28) !important;
                  border-radius: 20px !important;
                  box-shadow: 0 0 18px rgba(0,229,255,.12) !important;
                }

          # ── Case 3 : heure (advanced-digital-clock, installée) ─────
          - type: custom:advanced-digital-clock
            card_mod:
              style: |
                :host { flex: 1 1 0; }
                ha-card {
                  background: rgba(16,27,39,0.85) !important;
                  border: 1px solid rgba(0,229,255,0.28) !important;
                  border-radius: 20px !important;
                  box-shadow: 0 0 18px rgba(0,229,255,.12) !important;
                  color: #00E5FF !important;
                  display: flex !important;
                  align-items: center !important;
                  justify-content: center !important;
                }

          # ── Case 4 : logo OS ───────────────────────────────────────
          - type: custom:button-card
            template: osvision_os_avatar
            name: "OS"
            card_mod:
              style: |
                :host { flex: 0 0 56px; }

      # ═══════════════════════════════════════════════════════════════
      # SIDEBAR NAV
      # ═══════════════════════════════════════════════════════════════
      - type: vertical-stack
        view_layout:
          grid-area: nav
        card_mod:
          style: |
            :host {
              display: flex;
              flex-direction: column;
              height: 100%;
              width: 100%;
              min-width: 200px;
              background: rgba(5,11,18,0.85);
              border-radius: 20px;
              border: 1px solid rgba(0,229,255,0.18);
              padding: 16px 10px;
              box-shadow: 0 0 18px rgba(0,229,255,.12);
            }
        cards:
          - type: custom:button-card
            template: osvision_sidebar_logo
            icon: mdi:hexagon-outline
            name: "OSVISION V2"
            label: "Smart Home OS"

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:view-dashboard
            name: HOME
            label: "Vue d'ensemble"
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/home

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:server
            name: CORE
            label: "Systeme central"
            tap_action:
              action: navigate
              navigation_path: /osvision-core/core

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:sofa
            name: LIVING ROOM
            label: "Salon"
            tap_action:
              action: navigate
              navigation_path: /osvision-livingroom/livingroom

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:bed
            name: BEDROOM-1
            label: "Chambre principale"
            tap_action:
              action: navigate
              navigation_path: /osvision-bedroom1/bedroom1

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:bed-outline
            name: BEDROOM-2
            label: "Chambre 2"
            tap_action:
              action: navigate
              navigation_path: /osvision-bedroom2/bedroom2

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:shower
            name: BATHROOM
            label: "Salle de bain"
            tap_action:
              action: navigate
              navigation_path: /osvision-bathroom/bathroom

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:desktop-tower-monitor
            name: COMPUTER ROOM
            label: "Salle informatique"
            variables:
              active: true
            tap_action:
              action: navigate
              navigation_path: /osvision-computer/computer

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:tools
            name: TECHNICAL ROOM
            label: "Local technique"
            tap_action:
              action: navigate
              navigation_path: /osvision-technical/technical

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:key
            name: SECRET ROOM
            label: "Piece secrete"
            tap_action:
              action: navigate
              navigation_path: /osvision-secret/secret

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:flower
            name: GARDEN
            label: "Jardin"
            tap_action:
              action: navigate
              navigation_path: /osvision-garden/garden

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:lightning-bolt
            name: ENERGY
            label: "Gestion energie"
            tap_action:
              action: navigate
              navigation_path: /osvision-energy/energy

          - type: custom:button-card
            template: osvision_sidebar_brand_footer
            icon: mdi:hexagon-outline
            name: "OSVISION V2"
            label: "SMART HOME OS"

      # ═══════════════════════════════════════════════════════════════
      # LIGNE 2 — PLAN desk.png + badges de statut (vert/rouge)
      # ═══════════════════════════════════════════════════════════════
      - type: picture-elements
        view_layout:
          grid-area: image
        image: /local/osvision_v2/images/desk.png
        card_mod:
          style: |
            :host { height: 100%; display: block; }
            ha-card {
              background: rgba(8,18,28,0.55) !important;
              border: 1px solid rgba(0,229,255,0.28) !important;
              border-radius: 20px !important;
              box-shadow: 0 0 24px rgba(0,229,255,.12) !important;
              height: 100% !important;
              width: 100% !important;
              overflow: hidden;
            }
            img {
              width: 100% !important;
              height: 100% !important;
              object-fit: contain;
              object-position: center center;
            }
        elements:

          # Chaque appareil = une pastille colorée + un libellé.
          # La couleur est pilotée par card_mod sur l'état de l'entité,
          # avec garde "if (!config.entity ...)" pour ne jamais planter
          # si l'entité n'existe pas encore.

          # ── Température / Humidité ────────────────────────────────
          - type: state-label
            entity: binary_sensor.bureau_capteur_connectivity      # TODO
            style: { top: 7%, left: 4%, transform: "translateX(-50%)" }
            card_mod: &badge_style
              style: |
                :host {
                  color: #FFFFFF !important;
                  font-size: 11px !important;
                  font-weight: 600 !important;
                  background: rgba(16,27,39,0.9) !important;
                  border: 1px solid rgba(0,229,255,0.3) !important;
                  border-radius: 20px !important;
                  padding: 4px 12px 4px 22px !important;
                  white-space: nowrap !important;
                  box-shadow: 0 0 10px rgba(0,229,255,.15) !important;
                  position: relative !important;
                }
                :host::before {
                  content: "" !important;
                  position: absolute !important;
                  left: 9px !important;
                  top: 50% !important;
                  transform: translateY(-50%) !important;
                  width: 8px !important;
                  height: 8px !important;
                  border-radius: 50% !important;
                  background: var(--status-color, #FF5470) !important;
                  box-shadow: 0 0 8px var(--status-color, #FF5470) !important;
                }

          - type: state-label
            entity: binary_sensor.desk_light_1_connectivity        # TODO
            style: { top: 14%, left: 10%, transform: "translateX(-50%)" }
            card_mod: *badge_style

          - type: state-label
            entity: binary_sensor.desk_light_2_connectivity        # TODO
            style: { top: 10%, left: 18%, transform: "translateX(-50%)" }
            card_mod: *badge_style

          - type: state-label
            entity: binary_sensor.desk_light_3_connectivity        # TODO
            style: { top: 14%, left: 26%, transform: "translateX(-50%)" }
            card_mod: *badge_style

          - type: state-label
            entity: binary_sensor.imprimante_hp_connectivity       # TODO
            style: { top: 64%, left: 44%, transform: "translateX(-50%)" }
            card_mod: *badge_style

          - type: state-label
            entity: binary_sensor.denon_avr_connectivity           # TODO
            style: { top: 55%, left: 34%, transform: "translateX(-50%)" }
            card_mod: *badge_style

          - type: state-label
            entity: binary_sensor.toshiba_clim_connectivity        # TODO
            style: { top: 5%, left: 53%, transform: "translateX(-50%)" }
            card_mod: *badge_style

          - type: state-label
            entity: binary_sensor.volet_bureau_connectivity        # TODO
            style: { top: 22%, left: 43%, transform: "translateX(-50%)" }
            card_mod: *badge_style

          # ── Légende ────────────────────────────────────────────────
          - type: custom:button-card
            show_icon: false
            show_name: false
            show_state: false
            custom_fields:
              legend: >
                <div style="display:flex;gap:18px;justify-content:center;
                  align-items:center;padding:6px 14px;white-space:nowrap;">
                  <div style="display:flex;align-items:center;gap:6px;">
                    <div style="width:8px;height:8px;border-radius:50%;background:#00FFC3;
                      box-shadow:0 0 8px rgba(0,255,195,.6);"></div>
                    <span style="color:#8FB6C9;font-size:10px;">Fonctionne</span>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px;">
                    <div style="width:8px;height:8px;border-radius:50%;background:#FF5470;
                      box-shadow:0 0 8px rgba(255,84,112,.6);"></div>
                    <span style="color:#8FB6C9;font-size:10px;">Ne fonctionne pas</span>
                  </div>
                </div>
            style: { top: 95%, left: 50%, transform: "translate(-50%, -50%)" }
            styles:
              card:
                - background: rgba(8,18,28,0.75)
                - border: 1px solid rgba(0,229,255,0.2)
                - border-radius: 20px
                - box-shadow: none
                - width: fit-content
                - pointer-events: none

      # ═══════════════════════════════════════════════════════════════
      # LIGNE 3 — APPAREILS CONNECTÉS & INTERACTIONS
      # ═══════════════════════════════════════════════════════════════
      - type: vertical-stack
        view_layout:
          grid-area: devices
        cards:

          # Titre de section (markdown stylé, pas de template custom)
          - type: markdown
            content: "## Appareils connectés — Interactions"
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  border: none !important;
                  box-shadow: none !important;
                }
                ha-card h2 {
                  color: #00E5FF !important;
                  font-family: Orbitron, sans-serif !important;
                  letter-spacing: 2px !important;
                  font-size: 18px !important;
                  margin: 4px 0 !important;
                }

          - type: grid
            columns: 3
            square: false
            cards:

              # ── 1. Température & Humidité ─────────────────────────
              - type: entities
                title: "Température & Humidité"
                show_header_toggle: false
                entities:
                  - entity: sensor.bureau_temperature              # TODO
                    name: "Température"
                    icon: mdi:thermometer
                  - entity: sensor.bureau_humidite                 # TODO
                    name: "Humidité"
                    icon: mdi:water-percent
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(16,27,39,0.85) !important;
                      border: 1px solid rgba(0,229,255,0.25) !important;
                      border-radius: 18px !important;
                      box-shadow: none !important;
                    }

              # ── 2. Lumières Hue (on/off + couleur) ────────────────
              - type: entities
                title: "Lumières Hue"
                show_header_toggle: true
                entities:
                  - entity: light.desk_light_1                     # TODO
                    name: "Desk Light 1"
                  - entity: light.desk_light_2                     # TODO
                    name: "Desk Light 2"
                  - entity: light.desk_light_3                     # TODO
                    name: "Desk Light 3"
                  - type: buttons
                    entities:
                      - entity: light.desk_light_1                 # TODO
                        name: "L1"
                        tap_action:
                          action: more-info
                      - entity: light.desk_light_2                 # TODO
                        name: "L2"
                        tap_action:
                          action: more-info
                      - entity: light.desk_light_3                 # TODO
                        name: "L3"
                        tap_action:
                          action: more-info
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(16,27,39,0.85) !important;
                      border: 1px solid rgba(0,229,255,0.25) !important;
                      border-radius: 18px !important;
                      box-shadow: none !important;
                    }

              # ── 3. Imprimante (statut + file d'attente) ───────────
              - type: entities
                title: "Imprimante HP — 192.168.1.83"
                show_header_toggle: false
                entities:
                  - entity: sensor.imprimante_hp_statut            # TODO
                    name: "Statut"
                    icon: mdi:printer
                  - entity: sensor.imprimante_hp_toner             # TODO
                    name: "Encre / toner"
                    icon: mdi:water
                  - entity: sensor.imprimante_hp_queue             # TODO
                    name: "File d'attente"
                    icon: mdi:tray-full
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(16,27,39,0.85) !important;
                      border: 1px solid rgba(0,229,255,0.25) !important;
                      border-radius: 18px !important;
                      box-shadow: none !important;
                    }

              # ── 4. Volet roulant (ouvrir / fermer) ─────────────────
              - type: entities
                title: "Volet roulant"
                show_header_toggle: false
                entities:
                  - entity: cover.volet_bureau                     # TODO
                    name: "Volet bureau"
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(16,27,39,0.85) !important;
                      border: 1px solid rgba(0,229,255,0.25) !important;
                      border-radius: 18px !important;
                      box-shadow: none !important;
                    }

              # ── 5. Climatisation (contrôleur) ──────────────────────
              - type: thermostat
                entity: climate.toshiba_bureau                     # TODO
                name: "Climatisation Toshiba"
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(16,27,39,0.85) !important;
                      border: 1px solid rgba(0,229,255,0.25) !important;
                      border-radius: 18px !important;
                      box-shadow: none !important;
                    }

              # ── 6. Streaming audio & HEOS ──────────────────────────
              - type: media-control
                entity: media_player.heos_bureau                   # TODO
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(16,27,39,0.85) !important;
                      border: 1px solid rgba(0,229,255,0.25) !important;
                      border-radius: 18px !important;
                      box-shadow: none !important;
                    }

    # ── Fond de vue ────────────────────────────────────────────────
    # NOTE : fond via image desk.png RETIRÉ temporairement — c'était le
    # suspect n°1 de l'écran noir (card-mod n'arrivait pas à résoudre le
    # panel : "cannot resolve Panel information after 2s", ou desk.png
    # pas encore présent dans www/osvision_v2/images/).
    # À réactiver plus tard une fois la vue stable et l'image en place.

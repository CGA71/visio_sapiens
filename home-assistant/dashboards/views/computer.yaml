              # ── 3. File d'attente Imprimante ───────────────────────
              - type: vertical-stack
                cards:
                  - type: custom:button-card
                    show_icon: false
                    show_name: false
                    show_state: false
                    custom_fields:
                      header: >
                        <div style="display:flex;align-items:center;gap:8px;">
                          <ha-icon icon="mdi:printer" style="color:#00E5FF;"></ha-icon>
                          <span style="color:#8FB6C9;font-size:12px;letter-spacing:1px;
                            text-transform:uppercase;font-weight:600;">Imprimante HP — 192.168.1.83</span>
                        </div>
                    styles:
                      card:
                        - background: rgba(16,27,39,0.85)
                        - border: 1px solid rgba(0,229,255,0.25)
                        - border-radius: 18px 18px 0 0
                        - padding: 14px 16px 6px 16px
                        - box-shadow: none
                        - cursor: default
                        - pointer-events: none
                  - type: markdown
                    content: >
                      **Statut :** {{ states('sensor.imprimante_hp_statut') }}

                      **Encre / toner :** {{ states('sensor.imprimante_hp_toner') }}%

                      **File d'attente :**
                      {% set jobs = state_attr('sensor.imprimante_hp_queue', 'jobs') %}
                      {% if jobs %}
                        {% for job in jobs %}
                      - {{ job.name }} — {{ job.status }}
                        {% endfor %}
                      {% else %}
                      Aucun document en attente
                      {% endif %}
                    card_mod:
                      style: |
                        ha-card {
                          background: rgba(16,27,39,0.85) !important;
                          border: 1px solid rgba(0,229,255,0.25) !important;
                          border-top: none !important;
                          border-radius: 0 0 18px 18px !important;
                          box-shadow: none !important;
                          color: #FFFFFF !important;
                          font-size: 12px !important;
                          padding: 12px 16px !important;
                        }
                    # TODO : sensor.imprimante_hp_statut / _toner / _queue
                    # (capteur HP LAN 192.168.1.83, ex. via intégration HP
                    # ou scrape_sensor sur la page web de l'imprimante)

              # ── 4. Volet roulant (ouvrir / fermer) ─────────────────

########################################################################
# OSVision V2 — DESK Dashboard (Bureau / Salle informatique)
#
# Emplacement attendu dans le repo :
#   home-assistant/dashboards/views/computer.yaml
#
# Structure en 3 LIGNES (grid-template-rows) :
#
#   LIGNE 1 — header : [ Nom du dashboard ] [ Météo du jour ] [ Heure + logo OS ]
#   LIGNE 2 — plan desk.png en fond, avec uniquement des BADGES de statut
#             (vert = fonctionne / rouge = ne fonctionne pas) pour :
#             température/humidité, Desk Light 1/2/3, imprimante, ampli
#             Denon, climatisation Toshiba, volet roulant.
#   LIGNE 3 — grille de cartes d'INTERACTION, une par appareil :
#             température & humidité, lumières Hue (on/off + couleur),
#             file d'attente imprimante, volet roulant (ouvrir/fermer),
#             climatisation (contrôleur complet), streaming audio HEOS.
#
# ── PRÉREQUIS ─────────────────────────────────────────────────────────
# 1. Déposer l'image fournie dans :
#      home-assistant/www/osvision_v2/images/desk.png
#    (accessible ensuite via /local/osvision_v2/images/desk.png)
# 2. Remplacer toutes les entités marquées « # TODO » par les vôtres.
#    Les badges de la LIGNE 2 sont branchés sur des binary_sensor de
#    connectivité (on = fonctionne / off = ne fonctionne pas) — adaptez
#    selon vos capteurs réels (ping, disponibilité HA, etc.).
#
# Cartes HACS utilisées : button-card, card-mod, layout-card,
# picture-elements + grid (natifs Lovelace), simple-weather-card.
########################################################################
title: DESK
theme: OSVision V2

button_card_templates: !include ../templates/button_card_templates.yaml
decluttering_templates: !include ../templates/decluttering_templates.yaml

views:
  - title: DESK
    path: computer
    subview: false
    type: custom:grid-layout
    layout:
      grid-template-columns: minmax(200px, auto) 1fr
      grid-template-rows: 105px 380px auto
      grid-template-areas: |
        "nav header"
        "nav image"
        "nav devices"
      margin: 12px
      grid-gap: 14px 14px
    cards:

      # ═══════════════════════════════════════════════════════════════
      # LIGNE 1 — HEADER : titre / météo / heure + logo
      # ═══════════════════════════════════════════════════════════════
      - type: horizontal-stack
        view_layout:
          grid-area: header
        cards:

          # ── Case 1 : nom du dashboard ─────────────────────────────
          - type: custom:button-card
            template: osvision_page_header
            icon: mdi:chevron-left
            name: DESK
            label: "Bureau & salle informatique"
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/home
            card_mod:
              style: |
                :host { flex: 1.4 1 0; }

          # ── Case 2 : météo du jour (simple-weather-card) ──────────
          - type: custom:simple-weather-card
            entity: weather.home                                 # TODO
            name: "Météo du jour"
            forecast: false
            current: true
            details: true
            hourly_forecast: false
            card_mod:
              style: |
                :host { flex: 1 1 0; }
                ha-card {
                  background: rgba(16,27,39,0.85) !important;
                  border: 1px solid rgba(0,229,255,0.28) !important;
                  border-radius: 20px !important;
                  box-shadow: 0 0 18px rgba(0,229,255,.12);
                  color: #FFFFFF !important;
                }

          # ── Case 3 : heure + logo OS ───────────────────────────────
          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            custom_fields:
              clock: |
                [[[ return `
                  <div style="display:flex;align-items:center;justify-content:space-between;
                    height:100%;padding:0 18px;">
                    <div>
                      <div style="font-family:'Orbitron',sans-serif;font-size:22px;
                        color:#00E5FF;" id="osv-clock">--:--</div>
                      <div style="font-size:11px;color:#8FB6C9;letter-spacing:.5px;">
                        Dimanche 26 Juillet 2026</div>
                    </div>
                    <div style="width:44px;height:44px;border-radius:50%;
                      background:conic-gradient(from 180deg,#00E5FF,#00FFD5,#00E5FF);
                      display:flex;align-items:center;justify-content:center;
                      box-shadow:0 0 14px rgba(0,229,255,.4);">
                      <span style="font-family:'Orbitron',sans-serif;font-size:11px;
                        font-weight:900;color:#050B12;">OS</span>
                    </div>
                  </div>
                `]]]
            styles:
              card:
                - background: rgba(16,27,39,0.85)
                - border: 1px solid rgba(0,229,255,0.28)
                - border-radius: 20px
                - box-shadow: 0 0 18px rgba(0,229,255,.12)
                - height: 100%
              custom_fields:
                clock:
                  - width: 100%
                  - height: 100%
            card_mod:
              style: |
                :host { flex: 1 1 0; }

      # ═══════════════════════════════════════════════════════════════
      # SIDEBAR NAV — identique aux autres vues, DESK / COMPUTER ROOM actif
      # ═══════════════════════════════════════════════════════════════
      - type: vertical-stack
        view_layout:
          grid-area: nav
        card_mod:
          style: |
            :host {
              display: flex;
              flex-direction: column;
              height: 100%;
              width: 100%;
              min-width: 200px;
              background: rgba(5,11,18,0.85);
              border-radius: 20px;
              border: 1px solid rgba(0,229,255,0.18);
              padding: 16px 10px;
              box-shadow: 0 0 18px rgba(0,229,255,.12);
            }
        cards:
          - type: custom:button-card
            template: osvision_sidebar_logo
            icon: mdi:hexagon-outline
            name: "OSVISION V2"
            label: "Smart Home OS"

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:view-dashboard
            name: HOME
            label: "Vue d'ensemble"
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/home

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:server
            name: CORE
            label: "Systeme central"
            tap_action:
              action: navigate
              navigation_path: /osvision-core/core

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:sofa
            name: LIVING ROOM
            label: "Salon"
            tap_action:
              action: navigate
              navigation_path: /osvision-livingroom/livingroom

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:bed
            name: BEDROOM-1
            label: "Chambre principale"
            tap_action:
              action: navigate
              navigation_path: /osvision-bedroom1/bedroom1

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:bed-outline
            name: BEDROOM-2
            label: "Chambre 2"
            tap_action:
              action: navigate
              navigation_path: /osvision-bedroom2/bedroom2

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:shower
            name: BATHROOM
            label: "Salle de bain"
            tap_action:
              action: navigate
              navigation_path: /osvision-bathroom/bathroom

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:desktop-tower-monitor
            name: COMPUTER ROOM
            label: "Salle informatique"
            variables:
              active: true
            tap_action:
              action: navigate
              navigation_path: /osvision-computer/computer

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:tools
            name: TECHNICAL ROOM
            label: "Local technique"
            tap_action:
              action: navigate
              navigation_path: /osvision-technical/technical

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:key
            name: SECRET ROOM
            label: "Piece secrete"
            tap_action:
              action: navigate
              navigation_path: /osvision-secret/secret

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:flower
            name: GARDEN
            label: "Jardin"
            tap_action:
              action: navigate
              navigation_path: /osvision-garden/garden

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:lightning-bolt
            name: ENERGY
            label: "Gestion energie"
            tap_action:
              action: navigate
              navigation_path: /osvision-energy/energy

          - type: custom:button-card
            template: osvision_sidebar_brand_footer
            icon: mdi:hexagon-outline
            name: "OSVISION V2"
            label: "SMART HOME OS"

      # ═══════════════════════════════════════════════════════════════
      # LIGNE 2 — PLAN desk.png + badges de statut (vert/rouge) uniquement
      # ═══════════════════════════════════════════════════════════════

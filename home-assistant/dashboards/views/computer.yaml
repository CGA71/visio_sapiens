                          name: [{ color: "#FFFFFF" }, { font-size: "11px" }]
                          card: [{ background: "rgba(255,84,112,0.06)" }]
                    card_mod:
                      style: |
                        :host {
                          background: rgba(16,27,39,0.85);
                          border: 1px solid rgba(0,229,255,0.25);
                          border-top: none;
                          border-radius: 0 0 18px 18px;
                          padding: 10px;
                        }

              # ── 5. Climatisation (contrôleur) ──────────────────────

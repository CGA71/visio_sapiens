                          <span style="color:#8FB6C9;font-size:12px;letter-spacing:1px;
                            text-transform:uppercase;font-weight:600;">Lumières Hue — Desk Light 1/2/3</span>
                        </div>
                    styles:
                      card:
                        - background: rgba(16,27,39,0.85)
                        - border: 1px solid rgba(0,229,255,0.25)
                        - border-radius: 18px 18px 0 0
                        - padding: 14px 16px 6px 16px
                        - box-shadow: none
                        - cursor: default
                        - pointer-events: none

                  - type: entities
                    show_header_toggle: false
                    entities:
                      - entity: light.desk_light_1                 # TODO
                        name: "Desk Light 1"
                      - entity: light.desk_light_2                 # TODO
                        name: "Desk Light 2"
                      - entity: light.desk_light_3                 # TODO
                        name: "Desk Light 3"
                    card_mod:
                      style: |
                        ha-card {
                          background: rgba(16,27,39,0.85) !important;
                          border: 1px solid rgba(0,229,255,0.25) !important;
                          border-top: none !important;
                          box-shadow: none !important;
                        }

                  # Raccourcis couleur (appel direct light.turn_on rgb_color)
                  - type: horizontal-stack
                    cards:
                      - type: custom:button-card
                        icon: mdi:circle
                        show_name: false
                        show_state: false
                        tap_action:
                          action: call-service
                          service: light.turn_on
                          service_data:
                            entity_id: [light.desk_light_1, light.desk_light_2, light.desk_light_3]  # TODO
                            rgb_color: [255, 255, 255]
                        styles:
                          icon: [{ color: "#FFFFFF" }]
                          card: [{ background: "transparent" }, { box-shadow: none }]
                      - type: custom:button-card
                        icon: mdi:circle
                        show_name: false
                        show_state: false
                        tap_action:
                          action: call-service
                          service: light.turn_on
                          service_data:
                            entity_id: [light.desk_light_1, light.desk_light_2, light.desk_light_3]  # TODO
                            rgb_color: [0, 229, 255]
                        styles:
                          icon: [{ color: "#00E5FF" }]
                          card: [{ background: "transparent" }, { box-shadow: none }]
                      - type: custom:button-card
                        icon: mdi:circle
                        show_name: false
                        show_state: false
                        tap_action:
                          action: call-service
                          service: light.turn_on
                          service_data:
                            entity_id: [light.desk_light_1, light.desk_light_2, light.desk_light_3]  # TODO
                            rgb_color: [255, 100, 40]
                        styles:
                          icon: [{ color: "#FF6428" }]
                          card: [{ background: "transparent" }, { box-shadow: none }]
                      - type: custom:button-card
                        icon: mdi:circle
                        show_name: false
                        show_state: false
                        tap_action:
                          action: call-service
                          service: light.turn_on
                          service_data:
                            entity_id: [light.desk_light_1, light.desk_light_2, light.desk_light_3]  # TODO
                            rgb_color: [150, 60, 255]

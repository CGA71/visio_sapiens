########################################################################
# Visio Sapiens — COMPUTER Dashboard (Bureau / Salle informatique)
#
# Emplacement : home-assistant/dashboards/views/computer.yaml
# url_path associé : vssp-computer   (vue : /vssp-computer/computer)
#
# Structure en 3 LIGNES :
#   LIGNE 1 — header : [ Titre ] [ Météo ] [ Heure + logo OS ]
#   LIGNE 2 — plan desk.png avec badges de statut (vert=OK / rouge=KO)
#   LIGNE 3 — cartes d'interaction, une par appareil
#
# ── ROBUSTESSE / CHOIX TECHNIQUES ─────────────────────────────────────
# Cette version évite volontairement tout ce qui a fait planter le
# panel dans les essais précédents :
#   • PAS de template "vssp_section_title" (absent de ta librairie
#     de base → remplacé par un simple markdown stylé).
#   • PAS de "custom:simple-weather-card" (non installé chez toi → météo
#     via la carte NATIVE "weather-forecast", toujours dispo).
#   • Actions de service en syntaxe MODERNE "perform_action:" / "data:"
#     (l'ancienne "service:" / "service_data:" est dépréciée et casse le
#     rendu sur les versions récentes de button-card / HA).
#   • Seuls des templates GARANTIS présents sont utilisés :
#     vssp_page_header, vssp_os_avatar, vssp_sidebar_logo,
#     vssp_nav_button, vssp_sidebar_brand_footer.
#
# ── PRÉREQUIS ─────────────────────────────────────────────────────────
# 1. Image dans : home-assistant/www/vssp/images/desk.png
# 2. Remplacer chaque entité « # TODO » par la vôtre.
#    Les badges ligne 2 pointent sur des binary_sensor de connectivité
#    (on = fonctionne / off = ne fonctionne pas).
########################################################################
title: DESK
theme: Visio Sapiens

button_card_templates: !include ../templates/button_card_templates.yaml
decluttering_templates: !include ../templates/decluttering_templates.yaml

views:
  - title: DESK
    path: computer
    subview: false
    type: custom:grid-layout
    layout:
      grid-template-columns: minmax(200px, auto) 1fr
      grid-template-rows: 105px 460px auto
      grid-template-areas: |
        "nav header"
        "nav image"
        "nav devices"
      margin: 12px
      grid-gap: 14px 14px
    cards:

      # ═══════════════════════════════════════════════════════════════
      # LIGNE 1 — HEADER : titre / météo / heure + logo
      # ═══════════════════════════════════════════════════════════════
      - type: horizontal-stack
        view_layout:
          grid-area: header
        cards:

          # ── Case 1 : titre ────────────────────────────────────────
          - type: custom:button-card
            template: vssp_page_header
            icon: mdi:chevron-left
            name: DESK
            label: "Bureau & salle informatique"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens/home
            card_mod:
              style: |
                :host { flex: 1 1 0; }
                ha-card {
                  background: rgba(16,27,39,0.85) !important;
                  border: 1px solid rgba(0,229,255,0.28) !important;
                  border-radius: 20px !important;
                  box-shadow: 0 0 18px rgba(0,229,255,.12) !important;
                  height: 100px
                }

          # ── Case 2 : météo (carte NATIVE, toujours disponible) ─────
          - type: custom:simple-weather-card
            entity: weather.maison
            show_name: true
            tap_action:
              action: more-info
            primary_info:
              - extrema
            secondary_info:
              - precipitation
            state_content: state
            forecast_type: daily
            custom: []
            animated_icons: true
            backdrop:
              day: "#7cbfee"
              night: "#a6aae8"
              text: "#ffffff"
              bg: true
              fade: false
            card_mod:
              style: |
                :host { flex: 1 1 0; }
                ha-card {
                  background: rgba(16,27,39,0.85) !important;
                  border: 1px solid rgba(0,229,255,0.28) !important;
                  border-radius: 20px !important;
                  box-shadow: 0 0 18px rgba(0,229,255,.12) !important;
                  height: 100px
                }

          # ── Case 3 : heure (button-card autonome, sans dépendance) ─
          - type: custom:button-card
            entity: sensor.time                                  # sensor.time (intégration "time_date")
            show_name: false
            show_icon: false
            show_state: false
            show_label: true
            label: |
              [[[
                const d = new Date();
                const h = String(d.getHours()).padStart(2,'0');
                const m = String(d.getMinutes()).padStart(2,'0');
                const jours = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
                const mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
                return `<div style="font-family:Orbitron,sans-serif;font-size:24px;color:#00E5FF;line-height:1;">${h}:${m}</div>
                        <div style="font-size:11px;color:#8FB6C9;letter-spacing:.5px;margin-top:4px;">
                          ${jours[d.getDay()]} ${d.getDate()} ${mois[d.getMonth()]} ${d.getFullYear()}</div>`;
              ]]]
            styles:
              card:
                - background: rgba(16,27,39,0.85)
                - border: 1px solid rgba(0,229,255,0.28)
                - border-radius: 20px
                - box-shadow: 0 0 18px rgba(0,229,255,.12)
                - padding: 0 20px
              label:
                - justify-self: start
                - text-align: left
            card_mod:
              style: |
                :host { flex: 1 1 0; }
                ha-card {
                  background: rgba(16,27,39,0.85) !important;
                  border: 1px solid rgba(0,229,255,0.28) !important;
                  border-radius: 20px !important;
                  box-shadow: 0 0 18px rgba(0,229,255,.12) !important;
                  height: 100px
                }

      # ═══════════════════════════════════════════════════════════════
      # SIDEBAR NAV
      # ═══════════════════════════════════════════════════════════════
      - type: vertical-stack
        view_layout:
          grid-area: nav
        card_mod:
          style: |
            :host {
              display: flex;
              flex-direction: column;
              min-height: 100%;
              width: 100%;
              min-width: 200px;
              background: rgba(5,11,18,0.85);
              border-radius: 20px;
              border: 1px solid rgba(0,229,255,0.18);
              padding: 16px 10px;
              box-shadow: 0 0 18px rgba(0,229,255,.12);
            }
        cards:
          - type: custom:button-card
            template: vssp_sidebar_logo
            icon: mdi:hexagon-outline
            name: "VISIO SAPIENS"
            label: "Smart Home OS"

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:view-dashboard
            name: HOME
            label: "Vue d'ensemble"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens/home

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:server
            name: CORE
            label: "Systeme central"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-core/core

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:sofa
            name: LIVING ROOM
            label: "Salon"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-livingroom/livingroom

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:bed
            name: BEDROOM-1
            label: "Chambre principale"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-bedroom1/bedroom1

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:bed-outline
            name: BEDROOM-2
            label: "Chambre 2"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-bedroom2/bedroom2

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:shower
            name: BATHROOM
            label: "Salle de bain"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-bathroom/bathroom

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:desktop-tower-monitor
            name: COMPUTER ROOM
            label: "Salle informatique"
            variables:
              active: true
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-computer/computer

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:tools
            name: TECHNICAL ROOM
            label: "Local technique"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-technical/technical

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:key
            name: SECRET ROOM
            label: "Piece secrete"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-secret/secret

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:flower
            name: GARDEN
            label: "Jardin"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-garden/garden

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:lightning-bolt
            name: ENERGY
            label: "Gestion energie"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-energy/energy

          - type: custom:button-card
            show_icon: false
            show_name: false
            show_label: false
            tap_action:
              action: none
            custom_fields:
              logo: >
                <img src="/local/vssp/images/logo_VS-Sapiens.png"
                     style="width:100%;max-width:160px;display:block;margin:0 auto;mix-blend-mode:screen;filter:drop-shadow(0 0 8px rgba(0,229,255,.28));" />
            styles:
              card:
                - background: transparent
                - border: none
                - box-shadow: none
                - padding: 12px 6px 4px 6px
              grid:
                - grid-template-areas: '"logo"'
              custom_fields:
                logo:
                  - width: 100%
            card_mod:
              style: |
                :host { margin-top: auto; }
                ha-card {
                  background: transparent !important;
                  border: none !important;
                  box-shadow: none !important;
                }

      # ══════════════════════════════════════════════════════════════
      # LIGNE 2 — Video centrale VISIO SAPIENS (remplace desk.png)
      # Fichier a deposer dans : /config/www/vssp/movies/vs-sp.mp4
      - type: custom:button-card
        view_layout:
          grid-area: image
        show_icon: false
        show_name: false
        show_label: false
        tap_action:
          action: none
        custom_fields:
          video: >
            <video autoplay muted loop playsinline
              style="width:100%;height:100%;object-fit:cover;display:block;">
              <source src="/local/vssp/movies/vs-sp.mp4" type="video/mp4" />
            </video>
        styles:
          card:
            - padding: 0
            - background: transparent
            - border: 1px solid rgba(0,229,255,0.28)
            - box-shadow: 0 0 24px rgba(0,229,255,.12)
            - border-radius: 20px
            - overflow: hidden
            - height: 100%
          grid:
            - grid-template-areas: '"video"'
            - height: 100%
          custom_fields:
            video:
              - height: 100%
              - width: 100%
        card_mod:
          style: |
            :host { height: 100%; }
            ha-card { height: 100% !important; overflow: hidden; border-radius: 20px; }

      # ═══════════════════════════════════════════════════════════════
      # LIGNE 3 — APPAREILS CONNECTÉS & INTERACTIONS
      # ═══════════════════════════════════════════════════════════════
      - type: vertical-stack
        view_layout:
          grid-area: devices
        cards:

          # Titre de section (markdown stylé, pas de template custom)
          - type: markdown
            content: "## Appareils connectés — Interactions"
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  border: none !important;
                  box-shadow: none !important;
                }
                ha-card h2 {
                  color: #00E5FF !important;
                  font-family: Orbitron, sans-serif !important;
                  letter-spacing: 2px !important;
                  font-size: 18px !important;
                  margin: 4px 0 !important;
                }

          - type: grid
            columns: 3
            square: false
            cards:

              # ── 1. Température & Humidité ─────────────────────────
              - type: entities
                title: "Status Capteur Weather"
                show_header_toggle: false
                entities:
                  - entity: sensor.gw3000a_temperature_1              # TODO
                    name: "Temperature"
                    icon: mdi:thermometer
                  - entity: sensor.gw3000a_humidity_1                 # TODO
                    name: "Humidity"
                    icon: mdi:water-percent
                  - entity: sensor.gw3000a_dewpoint_1                 # TODO
                    name: "Condensation"
                    icon: mdi:water-percent
                  - entity: binary_sensor.gw3000a_battery_1                 # TODO
                    name: "Battery"
                    icon: mdi:battery
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(16,27,39,0.85) !important;
                      border: 1px solid rgba(0,229,255,0.25) !important;
                      border-radius: 18px !important;
                      box-shadow: none !important;
                      color: #FFFFFF !important;
                      --primary-text-color: #FFFFFF !important;
                      --secondary-text-color: #8FB6C9 !important;
                      --ha-card-header-color: #00E5FF !important;
                    }
                    .card-header,
                    .card-header .name {
                      color: #00E5FF !important;
                      font-family: Orbitron, sans-serif !important;
                      letter-spacing: 1px !important;
                      font-size: 15px !important;
                    }
                    .card-content { color: #FFFFFF !important; }
                    .entity .info,
                    .entity .info > *,
                    hui-generic-entity-row .info,
                    hui-generic-entity-row .info .primary,
                    .info.pointer .primary,
                    .name { color: #FFFFFF !important; }
                    hui-generic-entity-row .info .secondary,
                    .secondary { color: #8FB6C9 !important; }

              # ── 2. Lumières Hue (on/off + couleur) ────────────────
              - type: entities
                title: "Lumières Hue"
                show_header_toggle: true
                entities:
                  - entity: light.hue_color_candle_1                     # TODO
                    name: "Desk Light 1"
                  - entity: light.hue_color_candle_1_2                     # TODO
                    name: "Desk Light 2"
                  - entity: light.hue_color_candle_1_3                     # TODO
                    name: "Desk Light 3"
                  - type: buttons
                    entities:
                      - entity: light.hue_color_candle_1                 # TODO
                        name: "L1"
                        tap_action:
                          action: more-info
                      - entity: light.hue_color_candle_1_2                 # TODO
                        name: "L2"
                        tap_action:
                          action: more-info
                      - entity: light.hue_color_candle_1_3                 # TODO
                        name: "L3"
                        tap_action:
                          action: more-info
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(16,27,39,0.85) !important;
                      border: 1px solid rgba(0,229,255,0.25) !important;
                      border-radius: 18px !important;
                      box-shadow: none !important;
                      color: #FFFFFF !important;
                      --primary-text-color: #FFFFFF !important;
                      --secondary-text-color: #8FB6C9 !important;
                      --ha-card-header-color: #00E5FF !important;
                    }
                    .card-header,
                    .card-header .name {
                      color: #00E5FF !important;
                      font-family: Orbitron, sans-serif !important;
                      letter-spacing: 1px !important;
                      font-size: 15px !important;
                    }
                    .card-content { color: #FFFFFF !important; }
                    .entity .info,
                    .entity .info > *,
                    hui-generic-entity-row .info,
                    hui-generic-entity-row .info .primary,
                    .info.pointer .primary,
                    .name { color: #FFFFFF !important; }
                    hui-generic-entity-row .info .secondary,
                    .secondary { color: #8FB6C9 !important; }

              # ── 3. Imprimante (statut + file d'attente) ───────────
              - type: entities
                title: "Imprimante HP — 192.168.1.83"
                show_header_toggle: false
                entities:
                  - entity: sensor.hp_color_laserjet_mfp_m477fdn            # TODO
                    name: "Statut"
                    icon: mdi:printer
                  - entity: sensor.hp_color_laserjet_mfp_m477fdn_black_cartridge_hp_cf410a             # TODO
                    name: "Encre / Black"
                    icon: mdi:water
                  - entity: sensor.hp_color_laserjet_mfp_m477fdn_cyan_cartridge_hp_cf411a             # TODO
                    name: "Encre / Cyan"
                    icon: mdi:water
                  - entity: sensor.hp_color_laserjet_mfp_m477fdn_magenta_cartridge_hp_cf413a             # TODO
                    name: "Encre / Magenta"
                    icon: mdi:water
                  - entity: sensor.hp_color_laserjet_mfp_m477fdn_yellow_cartridge_hp_cf412a             # TODO
                    name: "Encre / Yellow"
                    icon: mdi:water
                  - entity: sensor.hp_color_laserjet_mfp_m477fdn_queue             # TODO
                    name: "File d'attente"
                    icon: mdi:tray-full
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(16,27,39,0.85) !important;
                      border: 1px solid rgba(0,229,255,0.25) !important;
                      border-radius: 18px !important;
                      box-shadow: none !important;
                      color: #FFFFFF !important;
                      --primary-text-color: #FFFFFF !important;
                      --secondary-text-color: #8FB6C9 !important;
                      --ha-card-header-color: #00E5FF !important;
                    }
                    .card-header,
                    .card-header .name {
                      color: #00E5FF !important;
                      font-family: Orbitron, sans-serif !important;
                      letter-spacing: 1px !important;
                      font-size: 15px !important;
                    }
                    .card-content { color: #FFFFFF !important; }
                    .entity .info,
                    .entity .info > *,
                    hui-generic-entity-row .info,
                    hui-generic-entity-row .info .primary,
                    .info.pointer .primary,
                    .name { color: #FFFFFF !important; }
                    hui-generic-entity-row .info .secondary,
                    .secondary { color: #8FB6C9 !important; }

              # ── 4. Volet roulant (ouvrir / fermer) ─────────────────
              - type: entities
                title: "Volet roulant"
                show_header_toggle: false
                entities:
                  - entity: cover.volet_bureau                     # TODO
                    name: "Volet bureau"
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(16,27,39,0.85) !important;
                      border: 1px solid rgba(0,229,255,0.25) !important;
                      border-radius: 18px !important;
                      box-shadow: none !important;
                      color: #FFFFFF !important;
                      --primary-text-color: #FFFFFF !important;
                      --secondary-text-color: #8FB6C9 !important;
                      --ha-card-header-color: #00E5FF !important;
                    }
                    .card-header,
                    .card-header .name {
                      color: #00E5FF !important;
                      font-family: Orbitron, sans-serif !important;
                      letter-spacing: 1px !important;
                      font-size: 15px !important;
                    }
                    .card-content { color: #FFFFFF !important; }
                    .entity .info,
                    .entity .info > *,
                    hui-generic-entity-row .info,
                    hui-generic-entity-row .info .primary,
                    .info.pointer .primary,
                    .name { color: #FFFFFF !important; }
                    hui-generic-entity-row .info .secondary,
                    .secondary { color: #8FB6C9 !important; }

              # ── 5. Climatisation (contrôleur) ──────────────────────
              - type: thermostat
                entity: climate.toshiba_bureau                     # TODO
                name: "Climatisation Toshiba"
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(16,27,39,0.85) !important;
                      border: 1px solid rgba(0,229,255,0.25) !important;
                      border-radius: 18px !important;
                      box-shadow: none !important;
                      color: #FFFFFF !important;
                      --primary-text-color: #FFFFFF !important;
                      --secondary-text-color: #8FB6C9 !important;
                      --ha-card-header-color: #00E5FF !important;
                    }
                    .card-header,
                    .card-header .name {
                      color: #00E5FF !important;
                      font-family: Orbitron, sans-serif !important;
                      letter-spacing: 1px !important;
                      font-size: 15px !important;
                    }
                    .card-content { color: #FFFFFF !important; }
                    .entity .info,
                    .entity .info > *,
                    hui-generic-entity-row .info,
                    hui-generic-entity-row .info .primary,
                    .info.pointer .primary,
                    .name { color: #FFFFFF !important; }
                    hui-generic-entity-row .info .secondary,
                    .secondary { color: #8FB6C9 !important; }

              # ── 6. Streaming audio & HEOS ──────────────────────────
              - type: media-control
                entity: media_player.heos_bureau                   # TODO
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(16,27,39,0.85) !important;
                      border: 1px solid rgba(0,229,255,0.25) !important;
                      border-radius: 18px !important;
                      box-shadow: none !important;
                      color: #FFFFFF !important;
                      --primary-text-color: #FFFFFF !important;
                      --secondary-text-color: #8FB6C9 !important;
                      --ha-card-header-color: #00E5FF !important;
                    }
                    .card-header,
                    .card-header .name {
                      color: #00E5FF !important;
                      font-family: Orbitron, sans-serif !important;
                      letter-spacing: 1px !important;
                      font-size: 15px !important;
                    }
                    .card-content { color: #FFFFFF !important; }
                    .entity .info,
                    .entity .info > *,
                    hui-generic-entity-row .info,
                    hui-generic-entity-row .info .primary,
                    .info.pointer .primary,
                    .name { color: #FFFFFF !important; }
                    hui-generic-entity-row .info .secondary,
                    .secondary { color: #8FB6C9 !important; }

    # ── Fond de vue ────────────────────────────────────────────────
    # NOTE : fond via image desk.png RETIRÉ temporairement — c'était le
    # suspect n°1 de l'écran noir (card-mod n'arrivait pas à résoudre le
    # panel : "cannot resolve Panel information after 2s", ou desk.png
    # pas encore présent dans www/vssp/images/).
    # À réactiver plus tard une fois la vue stable et l'image en place.

########################################################################
# Visio Sapiens — TECHNICAL ROOM Dashboard — VERSION MOBILE (iPhone 13 Pro Max)
#
# Emplacement attendu dans le repo :
#   home-assistant/dashboards/views/technical_room_mobile.yaml
#
# Dashboard Lovelace AUTONOME, a declarer dans configuration.yaml :
#
#   lovelace:
#     dashboards:
#       vssp-technical-m:
#         mode: yaml
#         title: TECHNICAL (Mobile)
#         icon: mdi:cellphone-cog
#         show_in_sidebar: true
#         filename: home-assistant/dashboards/views/technical_room_mobile.yaml
#
# ── PRINCIPES D'ADAPTATION MOBILE (identiques a energy_mobile.yaml) ───
# Cible : iPhone 13 Pro Max, viewport ≈ 428 px de large.
#   • Colonne unique : tous les panneaux sont empiles verticalement
#     (header → nav → interrupteurs → Livebox → switch reseau →
#      etat des equipements).
#   • La sidebar verticale est remplacee par une BARRE DE NAVIGATION
#     HORIZONTALE defilante (chips), pouce-friendly. TECH est actif.
#   • Les listes longues (interrupteurs, regles NAT, table du
#     commutateur) vivent DANS le champ custom d'un button-card a
#     hauteur fixe + overflow + touch-action:pan-y — pattern PROUVE en
#     production sur energy_mobile.yaml.
#   • Les interrupteurs passent a 2 colonnes.
#
# ── PREREQUIS ────────────────────────────────────────────────────────
# 1. Templates de button_card_templates.yaml deja en place
#    (vssp_section_title, vssp_circuit_switch) — AUCUN nouveau
#    template requis.
# 2. Helpers + capteurs de technical_room_config_snippets.yaml crees
#    (alimentation Shelly via LAN + sondes Livebox / commutateur).
# 3. Remplacer les entites marquees « # TODO » par les votres.
#
# Les visuels Livebox (plage DHCP, regles NAT, IP publique fixe) et la
# table du commutateur affichent des VALEURS DE DEMONSTRATION tant que
# les capteurs correspondants n'existent pas — le rendu est donc
# immediat, et un bandeau orange signale l'etat « demo ».
#
# Cartes HACS utilisees : button-card, card-mod, layout-card,
# (aucune carte de graphe requise).
########################################################################
title: TECHNICAL ROOM MOBILE
theme: Visio Sapiens

# Indispensable : sans ces includes, chaque custom:button-card affiche
# « Erreur de configuration ». Chemin relatif a dashboards/views/.
button_card_templates: !include ../templates/button_card_templates.yaml
decluttering_templates: !include ../templates/decluttering_templates.yaml

views:
  - title: TECHNICAL
    path: technical
    subview: false
    type: custom:grid-layout
    layout:
      # Colonne unique fluide — s'adapte a 428 px comme a 390 px.
      # minmax(0,1fr) et non 1fr : '1fr' vaut minmax(auto,1fr) et refuse
      # de descendre sous la largeur naturelle du contenu — un element
      # large (nav defilante, table MAC…) elargirait toute la page
      # (effet « format tablette »). minmax(0,1fr) verrouille la colonne
      # a la largeur de l'ecran quoi qu'elle contienne.
      grid-template-columns: minmax(0, 1fr)
      grid-template-rows: auto
      grid-template-areas: |
        "header"
        "nav"
        "board"
        "livebox"
        "netsw"
        "systems"
      margin: 8px
      grid-gap: 12px 0px
    cards:

      # ═══════════════════════════════════════════════════════════════
      # HEADER COMPACT — titre + heure sur une seule carte
      # ═══════════════════════════════════════════════════════════════
      - type: custom:button-card
        view_layout:
          grid-area: header
        entity: sensor.time                                  # integration "time_date"
        show_name: false
        show_icon: false
        show_state: false
        show_label: true
        tap_action:
          action: navigate
          navigation_path: /visio-sapiens-m/home
        label: |
          [[[
            const d = new Date();
            const h = String(d.getHours()).padStart(2,'0');
            const m = String(d.getMinutes()).padStart(2,'0');
            const jours = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
            const mois = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
            return `
              <div style="display:flex;align-items:center;justify-content:space-between;width:100%;">
                <div style="display:flex;align-items:center;gap:10px;">
                  <ha-icon icon="mdi:chevron-left"
                    style="--mdc-icon-size:26px;color:#00E5FF;"></ha-icon>
                  <div>
                    <div style="font-family:Orbitron,sans-serif;font-size:19px;
                      letter-spacing:2px;color:#FFFFFF;line-height:1;">TECHNICAL</div>
                    <div style="font-size:10px;color:#8FB6C9;letter-spacing:.5px;
                      margin-top:3px;">Local technique</div>
                  </div>
                </div>
                <div style="text-align:right;">
                  <div style="font-family:Orbitron,sans-serif;font-size:20px;
                    color:#00E5FF;line-height:1;">${h}:${m}</div>
                  <div style="font-size:10px;color:#8FB6C9;margin-top:3px;">
                    ${jours[d.getDay()]} ${d.getDate()} ${mois[d.getMonth()]}</div>
                </div>
              </div>`;
          ]]]
        styles:
          card:
            - background: rgba(16,27,39,0.85)
            - border: 1px solid rgba(0,229,255,0.28)
            - border-radius: 18px
            - box-shadow: 0 0 18px rgba(0,229,255,.12)
            - padding: 14px 16px
          label:
            - width: 100%

      # ═══════════════════════════════════════════════════════════════
      # NAVIGATION — BARRE UNE LIGNE DEFILANTE
      # Transposition horizontale du pattern PROUVE du tableau
      # electrique d'energy_mobile (defilement tactile + taps sur les
      # cartes embarquees confirmes en production) :
      #   • button-card externe avec tap_action:none ;
      #   • champ custom de LARGEUR FIXE 1240px — plus large que
      #     l'ecran, donc le defilement existe mecaniquement ;
      #   • overflow-x + touch-action:pan-x sur la carte ;
      #   • a l'interieur : grille native 12 colonnes × 1 rangee avec
      #     les chips inchanges.
      # ═══════════════════════════════════════════════════════════════
      - type: custom:button-card
        view_layout:
          grid-area: nav
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: none
        styles:
          grid:
            - grid-template-areas: '"chips"'
          card:
            - background: transparent
            - box-shadow: none
            - border: none
            - border-radius: 0
            - padding: 0px 0px 4px 0px
            # Plafond en unite viewport (definie) : borne la contribution
            # de la carte au calcul de la grille — la nav ne peut pas
            # reclamer ses 1240px a la page, le defilement reste interne.
            - max-width: calc(100vw - 16px)
            - overflow-x: auto
            - overflow-y: hidden
            - touch-action: pan-x
            - "-webkit-overflow-scrolling": touch
            - scrollbar-width: none
            - cursor: default
          custom_fields:
            chips:
              - display: block
              - width: 1240px
        custom_fields:
          chips:
            card:

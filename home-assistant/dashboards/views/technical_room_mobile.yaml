                      - box-shadow: none
                    icon:
                      - width: 14px
                      - color: "#8FB6C9"
                    name:
                      - font-family: Orbitron, sans-serif
                      - font-size: 8px
                      - letter-spacing: 0.5px
                      - color: "#8FB6C9"
                      - justify-self: start
                      - white-space: nowrap

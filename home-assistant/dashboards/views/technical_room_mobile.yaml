                      - column-gap: 4px
                      - align-items: center
                    card:
                      - height: 36px
                      - padding: 0px 8px
                      - border-radius: 12px
                      - background: rgba(16,27,39,0.85)
                      - border: 1px solid rgba(0,229,255,0.18)
                      - box-shadow: none
                    icon:
                      - width: 14px
                      - color: "#8FB6C9"
                    name:
                      - font-family: Orbitron, sans-serif
                      - font-size: 8px
                      - letter-spacing: 0.5px
                      - color: "#8FB6C9"
                      - justify-self: start
                      - white-space: nowrap

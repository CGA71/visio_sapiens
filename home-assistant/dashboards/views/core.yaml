########################################################################
# OSVision V2 — CORE Dashboard (Phase 1) — CORRIGÉ
#
# Correctif : la vue affichait deux versions superposées du même contenu
# (jauges/charts/temperatures/K3S) :
#   1) des cartes natives HA (gauge, apexcharts-card, auto-entities)
#   2) une iframe vers core.html, qui recrée déjà TOUT ce contenu en JS
#
# La zone "content" ci-dessous ne contient plus QUE l'iframe. Toutes les
# cartes natives dupliquées (gauges/charts/temps/k3s) ont été retirées.
# On garde uniquement : la sidebar (nav) + la première ligne du bandeau
# (header) + le footer HUD, comme demandé.
#
# IMPORTANT : ce fichier est un dashboard Lovelace AUTONOME (déclaré dans
# configuration.yaml sous lovelace: dashboards:, url_path "osvision-core"),
# et non une vue fusionnée dans home.yaml. Il doit donc garder la structure
# complète "title: / views: [...]" au niveau racine — sans ce wrapper,
# Lovelace ne charge plus aucune carte (écran noir, thème dark seul visible).
########################################################################
title: CORE
theme: OSVision V2

# Ces includes sont INDISPENSABLES : les templates osvision_* (nav_button,
# page_header, os_avatar, sidebar_logo...) sont définis dans ce fichier
# partagé. Sans eux, chaque custom:button-card affiche "Erreur de
# configuration" — c'était la cause racine du problème initial.
# Le chemin est relatif à l'emplacement de CE fichier (dashboards/views/),
# à ajuster si votre déploiement place les fichiers différemment :
#   - si core.yaml est dans dashboards/views/ et les templates dans
#     dashboards/templates/  ->  ../templates/button_card_templates.yaml
#   - si core.yaml est au même niveau que home.yaml (dashboards/)
#     ->  templates/button_card_templates.yaml  (comme dans home.yaml)
button_card_templates: !include ../templates/button_card_templates.yaml
decluttering_templates: !include ../templates/decluttering_templates.yaml

views:
  - title: CORE
    path: core
    subview: false
    type: custom:grid-layout
    layout:
      grid-template-columns: minmax(200px, auto) 1fr 1fr 1fr 1fr 1fr
      grid-template-rows: 105px auto
      grid-template-areas: |
        "nav header header header header header"
        "nav content content content content content"
      margin: 12px
      grid-gap: 14px 14px
    cards:
      # ─── BANDEAU HEADER (case 1 uniquement, conservée telle quelle) ────
      - type: horizontal-stack
        view_layout:
          grid-area: header
        cards:
          - type: custom:button-card
            template: osvision_page_header
            icon: mdi:chevron-left
            name: CORE
            label: "Systeme central - Glances Monitoring"
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/home
            card_mod:
              style: |
                :host { flex: 2 1 0; }
          - type: custom:button-card
            template: osvision_os_avatar
            name: "OS"
            card_mod:
              style: |
                :host { flex: 0 0 56px; }

      # ─── SIDEBAR NAV (inchangée) ────────────────────────────────────────
      - type: vertical-stack
        view_layout:
          grid-area: nav
        card_mod:
          style: |
            :host {
              display: flex;
              flex-direction: column;
              height: 100%;
              width: 100%;
              min-width: 200px;
              background: rgba(5,11,18,0.85);
              border-radius: 20px;
              border: 1px solid rgba(0,229,255,0.18);
              padding: 16px 10px;
              box-shadow: 0 0 18px rgba(0,229,255,.12);
            }
        cards:
          - type: custom:button-card
            template: osvision_sidebar_logo
            icon: mdi:hexagon-outline
            name: "OSVISION V2"
            label: "Smart Home OS"

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:view-dashboard
            name: HOME
            label: "Vue d'ensemble"
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/home

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:server
            name: CORE
            label: "Systeme central"
            variables:
              active: true
            tap_action:
              action: navigate
              navigation_path: /osvision-core/core

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:sofa
            name: LIVING ROOM
            label: "Salon"
            tap_action:
              action: navigate
              navigation_path: /osvision-livingroom/livingroom

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:bed
            name: BEDROOM-1
            label: "Chambre principale"
            tap_action:
              action: navigate
              navigation_path: /osvision-bedroom1/bedroom1

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:bed-outline
            name: BEDROOM-2
            label: "Chambre 2"
            tap_action:
              action: navigate
              navigation_path: /osvision-bedroom2/bedroom2

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:shower
            name: BATHROOM
            label: "Salle de bain"
            tap_action:
              action: navigate
              navigation_path: /osvision-bathroom/bathroom

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:desktop-tower-monitor
            name: COMPUTER ROOM
            label: "Salle informatique"
            tap_action:
              action: navigate
              navigation_path: /osvision-computer/computer

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:tools
            name: TECHNICAL ROOM
            label: "Local technique"
            tap_action:
              action: navigate
              navigation_path: /osvision-technical/technical

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:key
            name: SECRET ROOM
            label: "Piece secrete"
            tap_action:
              action: navigate
              navigation_path: /osvision-secret/secret

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:flower
            name: GARDEN
            label: "Jardin"
            tap_action:
              action: navigate
              navigation_path: /osvision-garden/garden

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:lightning-bolt
            name: ENERGY
            label: "Gestion energie"
            tap_action:
              action: navigate
              navigation_path: /osvision-energy/energy

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:shield-crown
            name: ADMIN
            label: "Panneau administration"
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/admin

          - type: custom:button-card
            template: osvision_sidebar_brand_footer
            icon: mdi:hexagon-outline
            name: "OSVISION V2"
            label: "SMART HOME OS"

      # ─── CONTENU CENTRAL = core.html (une seule fois, plein cadre) ─────
      # Occupe désormais aussi l'ancienne zone footer : core.html affiche
      # déjà son propre footer HUD "OSVISION V2 // CORE SYSTEM" en bas de
      # page, la carte osv-footer-card native faisait doublon.
      - type: iframe
        url: /local/osvision_v2/core.html
        view_layout:
          grid-area: content
        card_mod:
          style: |
            ha-card {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
              overflow: hidden;
              height: calc(100vh - 160px);
            }
            iframe {
              width: 100%;
              height: 100% !important;
              border: none;
            }


########################################################################
# OSVision V2 — CORE Dashboard (Phase 1)
#
# Vues: 
#   /osvision-v2/home    -> HUD, radar/IA core, metrics, alerts, quick actions - iteration 1
#   /osvision-v2/core    -> HUD, radar/IA core, metrics, alerts, quick actions - iteration 2
#   /osvision-v2/bedromm1-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 3
#   /osvision-v2/bedroom2-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 4
#   /osvision-v2/bathroom-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 5
#   /osvision-v2/computer-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 6
#   /osvision-v2/technical-> HUD, radar/IA core, metrics, alerts, quick actions - iteration 7
#   /osvision-v2/secret  -> HUD, radar/IA core, metrics, alerts, quick actions - iteration 8
#   /osvision-v2/garden  -> HUD, radar/IA core, metrics, alerts, quick actions - iteration 9
#
# Dépendances lovelace (à installer via HACS + déclarer en resources) :
#   button-card, card-mod, layout-card, custom:stack-in-card,
#   apexcharts-card, config-template-card, decluttering-card, browser_mod
########################################################################
title: CORE
views:
  - title: CORE
    path: core
    subview: false
    type: custom:grid-layout
    layout:
      grid-template-columns: minmax(200px, auto) 1fr 1fr 1fr 1fr 1fr
      grid-template-rows: 105px auto auto auto auto auto
      grid-template-areas: |
        "nav header header header header header"
        "nav gauges gauges gauges gauges gauges"
        "nav charts charts charts charts charts"
        "nav temps temps temps temps temps"
        "nav k3s k3s k3s k3s k3s"
        "nav footer footer footer footer footer"
      margin: 12px
      grid-gap: 14px 14px
    cards:
      # ─── BANDEAU HEADER ────────────────────────────────────────────────
      - type: horizontal-stack
        view_layout:
          grid-area: header
        cards:
          - type: custom:button-card
            template: osvision_page_header
            icon: mdi:chevron-left
            name: CORE
            label: "Systeme central - Glances Monitoring"
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/home
            card_mod:
              style: |
                :host { flex: 2 1 0; }
          - type: custom:button-card
            template: osvision_os_avatar
            name: "OS"
            card_mod:
              style: |
                :host { flex: 0 0 56px; }

      # ─── SIDEBAR NAV ──────────────────────────────────────────────────
      - type: vertical-stack
        view_layout:
          grid-area: nav
        card_mod:
          style: |
            :host {
              display: flex;
              flex-direction: column;
              height: 100%;
              width: 100%;
              min-width: 200px;
              background: rgba(5,11,18,0.85);
              border-radius: 20px;
              border: 1px solid rgba(0,229,255,0.18);
              padding: 16px 10px;
              box-shadow: 0 0 18px rgba(0,229,255,.12);
            }
        cards:
          - type: custom:button-card
            template: osvision_sidebar_logo
            icon: mdi:hexagon-outline
            name: "OSVISION V2"
            label: "Smart Home OS"

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:view-dashboard
            name: HOME
            label: "Vue d'ensemble"
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/home

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:server
            name: CORE
            label: "Systeme central"
            variables:
              active: true
            tap_action:
              action: navigate
              navigation_path: /osvision-core/core

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:sofa
            name: LIVING ROOM
            label: "Salon"
            tap_action:
              action: navigate
              navigation_path: /osvision-livingroom/livingroom

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:bed
            name: BEDROOM-1
            label: "Chambre principale"
            tap_action:
              action: navigate
              navigation_path: /osvision-bedroom1/bedroom1

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:bed-outline
            name: BEDROOM-2
            label: "Chambre 2"
            tap_action:
              action: navigate
              navigation_path: /osvision-bedroom2/bedroom2

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:shower
            name: BATHROOM
            label: "Salle de bain"
            tap_action:
              action: navigate
              navigation_path: /osvision-bathroom/bathroom

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:desktop-tower-monitor
            name: COMPUTER ROOM
            label: "Salle informatique"
            tap_action:
              action: navigate
              navigation_path: /osvision-computer/computer

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:tools
            name: TECHNICAL ROOM
            label: "Local technique"
            tap_action:
              action: navigate
              navigation_path: /osvision-technical/technical

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:key
            name: SECRET ROOM
            label: "Piece secrete"
            tap_action:
              action: navigate
              navigation_path: /osvision-secret/secret

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:flower
            name: GARDEN
            label: "Jardin"
            tap_action:
              action: navigate
              navigation_path: /osvision-garden/garden

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:lightning-bolt
            name: ENERGY
            label: "Gestion energie"
            tap_action:
              action: navigate
              navigation_path: /osvision-energy/energy

          - type: custom:button-card
            template: osvision_nav_button
            icon: mdi:shield-crown
            name: ADMIN
            label: "Panneau administration"
            tap_action:
              action: navigate
              navigation_path: /osvision-v2/admin

          - type: custom:button-card
            template: osvision_sidebar_brand_footer
            icon: mdi:hexagon-outline
            name: "OSVISION V2"
            label: "SMART HOME OS"

      # ─── JAUGES SYSTEME (CPU / RAM / Load / Swap / Temp) ──────────────
      - type: horizontal-stack
        view_layout:
          grid-area: gauges
        cards:
          - type: gauge
            entity: sensor.192_168_1_11_utilisation_cpu
            name: CPU
            unit: "%"
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 60
              red: 80
            card_mod:
              style: |
                ha-card { background: var(--osv-panel) !important; }

          - type: gauge
            entity: sensor.192_168_1_11_utilisation_de_la_memoire
            name: RAM
            unit: "%"
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 60
              red: 80
            card_mod:
              style: |
                ha-card { background: var(--osv-panel) !important; }

          - type: custom:button-card
            template: osvision_panel
            show_name: true
            name: LOAD AVERAGE
            show_state: false
            show_icon: false
            styles:
              card:
                - padding: 16px
              name:
                - color: "#8FB6C9"
                - font-size: 11px
                - letter-spacing: 1.5px
                - margin-bottom: 8px
            custom_fields:
              load:
                card:
                  type: markdown
                  content: >
                    | | |
                    |---|---|
                    | 1m | **{{ states('sensor.192_168_1_11_charge_1m') }}** |
                    | 5m | **{{ states('sensor.192_168_1_11_charge_5m') }}** |
                    | 15m | **{{ states('sensor.192_168_1_11_charge_15m') }}** |
                  card_mod:
                    style: |
                      ha-card { background: transparent !important; border: none !important; box-shadow: none !important; }
                      ha-markdown { color: #B8E8F5 !important; }

          - type: gauge
            entity: sensor.192_168_1_11_utilisation_swap
            name: SWAP
            unit: "%"
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 30
              red: 60
            card_mod:
              style: |
                ha-card { background: var(--osv-panel) !important; }

          - type: gauge
            entity: sensor.192_168_1_11_edge_temperature
            name: CPU TEMP
            unit: "C"
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 60
              red: 80
            card_mod:
              style: |
                ha-card { background: var(--osv-panel) !important; }

      # ─── HISTORIQUES (CPU / RAM / Network / Disk) ──────────────────────
      - type: horizontal-stack
        view_layout:
          grid-area: charts
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: "Utilisation CPU (%)"
              show_states: false
            graph_span: 5d
            card_mod:
              style: |
                ha-card { background: var(--osv-panel) !important; max-height: 220px; overflow: hidden; }
            series:
              - entity: sensor.192_168_1_11_utilisation_cpu
                name: CPU
                type: area
                color: "#3AA7FF"
                stroke_width: 1.5
                opacity: 0.15

          - type: custom:apexcharts-card
            header:
              show: true
              title: "Utilisation RAM (%)"
              show_states: false
            graph_span: 5d
            card_mod:
              style: |
                ha-card { background: var(--osv-panel) !important; max-height: 220px; overflow: hidden; }
            series:
              - entity: sensor.192_168_1_11_utilisation_de_la_memoire
                name: RAM
                type: area
                color: "#00FFC3"
                stroke_width: 1.5
                opacity: 0.15

          - type: custom:apexcharts-card
            header:
              show: true
              title: "Network (RX/TX)"
              show_states: false
            graph_span: 5d
            card_mod:
              style: |
                ha-card { background: var(--osv-panel) !important; max-height: 220px; overflow: hidden; }
            series:
              - entity: sensor.192_168_1_11_enp12s0_rx
                name: Download
                type: area
                color: "#B084FF"
                stroke_width: 1.5
                opacity: 0.15
              - entity: sensor.192_168_1_11_enp12s0_tx
                name: Upload
                type: line
                color: "#00FFC3"
                stroke_width: 1.5

          - type: custom:apexcharts-card
            header:
              show: true
              title: "Disk I/O"
              show_states: false
            graph_span: 5d
            card_mod:
              style: |
                ha-card { background: var(--osv-panel) !important; max-height: 220px; overflow: hidden; }
            series:
              - entity: sensor.192_168_1_11_espace_libre
                name: Disk
                type: area
                color: "#FF9800"
                stroke_width: 1.5
                opacity: 0.15

      # ─── TEMPERATURES DES COMPOSANTS ───────────────────────────────────
      - type: vertical-stack
        view_layout:
          grid-area: temps
        cards:
          - type: custom:button-card
            template: osvision_panel
            show_name: true
            name: "TEMPERATURE DES COMPOSANTS"
            show_icon: false
            styles:
              card:
                - padding: 12px 16px
                - min-height: 0
              name:
                - color: "#00E5FF"
                - font-family: "'Orbitron','Courier New',monospace"
                - font-size: 13px
                - letter-spacing: 2px

          - type: custom:auto-entities
            filter:
              include:
                - entity_id: "sensor.192_168_1_11_core_*_temperature"
                - entity_id: "sensor.192_168_1_11_package*temperature"
                - entity_id: "sensor.192_168_1_11_edge*temperature"
              exclude: []
            sort:
              method: name
            card:
              type: entities
              card_mod:
                style: |
                  ha-card {
                    background: var(--osv-panel) !important;
                    --primary-text-color: #B8E8F5 !important;
                    --secondary-text-color: #8FB6C9 !important;
                  }

      # ─── K3S CLUSTER DASHBOARD ─────────────────────────────────────────
      - type: vertical-stack
        view_layout:
          grid-area: k3s
        cards:
          - type: custom:button-card
            template: osvision_panel
            show_name: true
            name: "K3S CLUSTER DASHBOARD"
            icon: mdi:kubernetes
            show_icon: true
            styles:
              card:
                - padding: 12px 16px
                - min-height: 0
              name:
                - color: "#fff"
                - font-family: "'Orbitron','Courier New',monospace"
                - font-size: 16px
                - letter-spacing: 2px
              icon:
                - color: "#00E5FF"
                - "--mdc-icon-size": 28px

          - type: iframe
            url: /local/osvision_v2/core.html
            aspect_ratio: 60%
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  border: none !important;
                  box-shadow: none !important;
                  overflow: hidden;
                }

      # ─── FOOTER ────────────────────────────────────────────────────────
      - type: custom:osv-footer-card
        label: OSVISION V2 // CORE SYSTEM
        view_layout:
          grid-area: footer

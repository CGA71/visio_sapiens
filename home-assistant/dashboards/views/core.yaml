########################################################################
# Visio Sapiens — CORE Dashboard (Phase 1) — CORRIGÉ
#
# Correctif : la vue affichait deux versions superposées du même contenu
# (jauges/charts/temperatures/K3S) :
#   1) des cartes natives HA (gauge, apexcharts-card, auto-entities)
#   2) une iframe vers core.html, qui recrée déjà TOUT ce contenu en JS
#
# La zone "content" ci-dessous ne contient plus QUE l'iframe. Toutes les
# cartes natives dupliquées (gauges/charts/temps/k3s) ont été retirées.
# On garde uniquement : la sidebar (nav) + la première ligne du bandeau
# (header) + le footer HUD, comme demandé.
#
# IMPORTANT : ce fichier est un dashboard Lovelace AUTONOME (déclaré dans
# configuration.yaml sous lovelace: dashboards:, url_path "vssp-core"),
# et non une vue fusionnée dans home.yaml. Il doit donc garder la structure
# complète "title: / views: [...]" au niveau racine — sans ce wrapper,
# Lovelace ne charge plus aucune carte (écran noir, thème dark seul visible).
########################################################################
title: CORE
theme: Visio Sapiens

# Ces includes sont INDISPENSABLES : les templates vssp_* (nav_button,
# page_header, os_avatar, sidebar_logo...) sont définis dans ce fichier
# partagé. Sans eux, chaque custom:button-card affiche "Erreur de
# configuration" — c'était la cause racine du problème initial.
# Le chemin est relatif à l'emplacement de CE fichier (dashboards/views/),
# à ajuster si votre déploiement place les fichiers différemment :
#   - si core.yaml est dans dashboards/views/ et les templates dans
#     dashboards/templates/  ->  ../templates/button_card_templates.yaml
#   - si core.yaml est au même niveau que home.yaml (dashboards/)
#     ->  templates/button_card_templates.yaml  (comme dans home.yaml)
button_card_templates: !include ../templates/button_card_templates.yaml
decluttering_templates: !include ../templates/decluttering_templates.yaml

views:
  - title: CORE
    path: core
    subview: false
    type: custom:grid-layout
    layout:
      grid-template-columns: minmax(200px, auto) 1fr 1fr 1fr 1fr 1fr
      grid-template-rows: 105px auto
      grid-template-areas: |
        "nav header header header header header"
        "nav content content content content content"
      margin: 12px
      grid-gap: 14px 14px
    cards:
     # ═══════════════════════════════════════════════════════════════
      # LIGNE 1 — HEADER : titre / météo / heure + logo
      # ═══════════════════════════════════════════════════════════════
      - type: horizontal-stack
        view_layout:
          grid-area: header
        cards:

          # ── Case 1 : titre ────────────────────────────────────────
          - type: custom:button-card
            template: vssp_page_header
            icon: mdi:chevron-left
            name: CORE
            label: "System Management"
            tap_action:
              action: navigate
              navigation_path: /vssp-core/core
            card_mod:
              style: |
                :host { flex: 1 1 0; }
                ha-card {
                  background: rgba(16,27,39,0.85) !important;
                  border: 1px solid rgba(0,229,255,0.28) !important;
                  border-radius: 20px !important;
                  box-shadow: 0 0 18px rgba(0,229,255,.12) !important;
                  height: 100px
                }

          # ── Case 2 : météo (carte NATIVE, toujours disponible) ─────
          - type: custom:simple-weather-card
            entity: weather.maison
            show_name: true
            tap_action:
              action: more-info
            primary_info:
              - extrema
            secondary_info:
              - precipitation
            state_content: state
            forecast_type: daily
            custom: []
            animated_icons: true
            backdrop:
              day: "#7cbfee"
              night: "#a6aae8"
              text: "#ffffff"
              bg: true
              fade: false
            card_mod:
              style: |
                :host { flex: 1 1 0; }
                ha-card {
                  background: rgba(16,27,39,0.85) !important;
                  border: 1px solid rgba(0,229,255,0.28) !important;
                  border-radius: 20px !important;
                  box-shadow: 0 0 18px rgba(0,229,255,.12) !important;
                  height: 100px
                }

          # ── Case 3 : heure (button-card autonome, sans dépendance) ─
          - type: custom:button-card
            entity: sensor.time                                  # sensor.time (intégration "time_date")
            show_name: false
            show_icon: false
            show_state: false
            show_label: true
            label: |
              [[[
                const d = new Date();
                const h = String(d.getHours()).padStart(2,'0');
                const m = String(d.getMinutes()).padStart(2,'0');
                const jours = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
                const mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
                return `<div style="font-family:Orbitron,sans-serif;font-size:24px;color:#FFFFFF;line-height:1;">${h}:${m}</div>
                        <div style="font-size:11px;color:#8FB6C9;letter-spacing:.5px;margin-top:4px;">
                          ${jours[d.getDay()]} ${d.getDate()} ${mois[d.getMonth()]} ${d.getFullYear()}</div>`;
              ]]]
            styles:
              card:
                - background: rgba(16,27,39,0.85)
                - border: 1px solid rgba(0,229,255,0.28)
                - border-radius: 20px
                - box-shadow: 0 0 18px rgba(0,229,255,.12)
                - padding: 6px 20px          # 6px en haut, comme le page_header
              grid:
                - grid-template-areas: '"l"'
                - grid-template-rows: min-content   # la ligne ne prend que la hauteur du texte
                - align-content: start              # <- LE réglage clé : colle la grille en haut
                - justify-items: end
              label:
                - justify-self: end
                - text-align: right
            card_mod:
              style: |
                :host { flex: 1 1 0; }
                ha-card {
                  background: rgba(16,27,39,0.85) !important;
                  border: 1px solid rgba(0,229,255,0.28) !important;
                  border-radius: 20px !important;
                  box-shadow: 0 0 18px rgba(0,229,255,.12) !important;
                  height: 100px
                }

      # ─── SIDEBAR NAV ────────────────────────────────────────────────────
      # Alignement avec le bas du cadre content. RÉGLAGE : le chiffre après
      # le moins pilote le bas de la nav — le DIMINUER descend la nav
      # (1px de moins = 1px plus bas), l'AUGMENTER la remonte.
      - type: vertical-stack
        view_layout:
          grid-area: nav
        card_mod:
          style: |
            :host {
              display: flex;
              flex-direction: column;
              height: 100%;
              width: 100%;
              min-width: 200px;
              background: rgba(5,11,18,0.85);
              border-radius: 20px;
              border: 1px solid rgba(0,229,255,0.18);
              padding: 16px 10px;
              box-shadow: 0 0 18px rgba(0,229,255,.12);
              
            }
        cards:
          - type: custom:button-card
            template: vssp_sidebar_logo
            icon: mdi:hexagon-outline
            name: "VISIO SAPIENS"
            label: "Smart Home OS"

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:view-dashboard
            name: HOME
            label: "Vue d'ensemble"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens/home

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:server
            name: CORE
            label: "Systeme central"
            
            
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-core/core

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:sofa
            name: LIVING ROOM
            label: "Salon"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-livingroom/livingroom

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:bed
            name: BEDROOM-1
            label: "Chambre principale"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-bedroom1/bedroom1

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:bed-outline
            name: BEDROOM-2
            label: "Chambre 2"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-bedroom2/bedroom2

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:shower
            name: BATHROOM
            label: "Salle de bain"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-bathroom/bathroom

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:desktop-tower-monitor
            name: COMPUTER ROOM
            label: "Salle informatique"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-computer/computer

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:tools
            name: TECHNICAL ROOM
            label: "Local technique"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-technical/technical

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:key
            name: SECRET ROOM
            label: "Piece secrete"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-secret/secret

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:flower
            name: GARDEN
            label: "Jardin"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-garden/garden

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:lightning-bolt
            name: ENERGY
            label: "Gestion energie"
            variables:
              active: true      
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens-energy/energy

          - type: custom:button-card
            template: vssp_nav_button
            icon: mdi:shield-crown
            name: ADMIN
            label: "Panneau administration"
            tap_action:
              action: navigate
              navigation_path: /visio-sapiens/admin

          - type: custom:button-card
            show_icon: false
            show_name: false
            show_label: false
            tap_action:
              action: none
            custom_fields:
              logo: >
                <img src="/local/vssp/images/logo_VS-Sapiens.png"
                     style="width:100%;max-width:160px;display:block;margin:0 auto;mix-blend-mode:screen;filter:drop-shadow(0 0 8px rgba(0,229,255,.28));" />
            styles:
              card:
                - background: transparent
                - border: none
                - box-shadow: none
                - padding: 12px 6px 4px 6px
              grid:
                - grid-template-areas: '"logo"'
              custom_fields:
                logo:
                  - width: 100%
            card_mod:
              style: |
                :host { margin-top: auto; }
                ha-card {
                  background: transparent !important;
                  border: none !important;
                  box-shadow: none !important;
                }

      # ─── CONTENU CENTRAL = core.html (structure d'origine, fiable) ─────
      # L'ENCADREMENT n'est PAS ici : la carte iframe ignore les bordures
      # card_mod. Il est dessiné DANS core.html (règle body::before fixe).
      # Ici : uniquement la hauteur (calc 100vh-160px) ; core.html défile
      # à l'intérieur, comme à l'origine.
      - type: iframe
        url: /local/vssp/core.html
        view_layout:
          grid-area: content
        card_mod:
          style: |
            ha-card {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
              overflow: hidden;
              height: calc(100vh - 160px);
              border-radius: 20px;
            }
            iframe {
              width: 100%;
              height: 100% !important;
              border: none;
            }


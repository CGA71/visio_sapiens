########################################################################
# Visio Sapiens — carte « Dashboards systeme » du panneau ADMIN
#
# DESTINATION :
#     home-assistant/dashboards/admin/system_dashboards.yaml
#
# Ce fichier est charge par home.yaml, vue ADMIN, via :
#     cards:
#       ...
#       - !include admin/system_dashboards.yaml
#       - type: custom:osv-footer-card
#
# Le chemin est relatif au dossier de home.yaml
# (home-assistant/dashboards/), comme vos autres !include.
#
# POURQUOI CETTE CARTE EXISTE
#   ENERGY et CORE ne sont rattaches a aucune piece Home Assistant : ils
#   ne passent pas par le formulaire creation / modification /
#   suppression du wizard, qui raisonne par piece. Leur cycle de vie est
#   gere ici.
#
# PREREQUIS
#   1. vssp/vssp_admin_config.yaml fusionne (binary_sensor d'existence,
#      shell_command et scripts vssp_create_energy_dashboard /
#      vssp_regenerate_energy_dashboard).
#   2. La grille de la vue ADMIN doit comporter une zone « system » :
#        grid-template-rows: auto auto auto auto
#        grid-template-areas: |
#          "header header header"
#          "discovery upgrade delete"
#          "system system system"
#          "footer footer footer"
#      (deja applique dans le home.yaml livre)
########################################################################

type: vertical-stack
view_layout:
  grid-area: system
card_mod:
  style: |
    :host {
      display: block;
      background: rgba(8,18,28,0.75);
      border: 1px solid rgba(0,229,255,0.28);
      border-radius: 18px;
      padding: 14px 16px;
      backdrop-filter: blur(12px);
    }
cards:
  - type: custom:button-card
    template: vssp_section_title
    name: "Dashboards systeme — non lies a une piece"

  - type: horizontal-stack
    cards:
      # ── ENERGY ─────────────────────────────────────────────
      # Un seul emplacement, deux etats : le bouton CREER
      # n'apparait que si le fichier est absent, le bouton
      # REGENERER que s'il existe. Pas de risque d'ecraser un
      # dashboard en place par une mauvaise manipulation.
      - type: conditional
        conditions:
          - entity: binary_sensor.vssp_dashboard_energy_present
            state: "off"
        card:
          type: custom:button-card
          template: vssp_admin_button
          icon: mdi:lightning-bolt-outline
          name: CREER ENERGY
          label: "Dashboard absent — le generer depuis le template"
          confirmation:
            text: "Generer le dashboard ENERGY a partir du modele et du parc d'appareils detecte ?"
          tap_action:
            action: call-service
            service: script.vssp_create_energy_dashboard

      - type: conditional
        conditions:
          - entity: binary_sensor.vssp_dashboard_energy_present
            state: "on"
        card:
          type: custom:button-card
          template: vssp_admin_button
          icon: mdi:lightning-bolt
          name: REGENERER ENERGY
          label: >-
            [[[ return "Genere le " +
                states['sensor.vssp_dashboard_energy_modifie'].state +
                " — " +
                states['sensor.vssp_appareils_mesures'].state +
                " appareils mesures" ]]]
          confirmation:
            text: "Regenerer ENERGY ecrasera le dashboard actuel (une sauvegarde sera creee). Continuer ?"
          tap_action:
            action: call-service
            service: script.vssp_regenerate_energy_dashboard

      # ── SYNC — resynchroniser sans tout regenerer ──────────
      - type: custom:button-card
        template: vssp_admin_button
        icon: mdi:sync
        name: SYNC ENERGY
        label: "Ajouter les nouveaux appareils mesures aux tableaux"
        tap_action:
          action: call-service
          service: script.vssp_run_energy_sync

      # ── CORE ───────────────────────────────────────────────
      # Le template core.yaml.j2 n'existe pas encore : le bouton
      # est present pour la coherence du panneau, mais il indique
      # l'etat plutot que de proposer une action qui echouerait.
      # Des que le template sera en place, il suffira de
      # decommenter l'entree "core" dans DASHBOARDS
      # (generate_dashboards.py) et de remplacer ce bouton par le
      # meme couple conditionnel que ENERGY.
      - type: custom:button-card
        template: vssp_admin_button
        icon: mdi:server
        name: CORE
        label: >-
          [[[ return states['binary_sensor.vssp_dashboard_core_present'].state === 'on'
                ? "Dashboard en place — template de generation a venir"
                : "Dashboard absent — template de generation a venir" ]]]
        tap_action:
          action: none
        styles:
          card:
            - opacity: 0.55

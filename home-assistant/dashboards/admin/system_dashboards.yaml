########################################################################
# *** ORPHELIN — NON UTILISE, NE PAS EDITER NI RE-INCLURE ***
# *** ORPHANED — NOT WIRED IN, DO NOT EDIT OR RE-INCLUDE ***
#
# EN | The admin console moved out of home.yaml into its own generated
# EN | dashboard (admin.yaml, rendered from templates_j2/admin.yaml.j2)
# EN | some time after this file was written — the `!include` below never
# EN | followed. Nothing in the current templates_j2/*.j2 references this
# EN | path, so its content (originally CREATE/REGENERATE ENERGY) never
# EN | reached any dashboard a user could open. The equivalent — CREATE/
# EN | REGENERATE for HOME, ENERGY and CORE — now lives inline in
# EN | templates_j2/admin.yaml.j2's "dashboards" screen (`{% elif screen ==
# EN | 'dashboards' %}`), where it is actually rendered. This file is kept
# EN | only because several docs still reference it; do not resurrect it
# EN | by re-adding an !include somewhere — edit admin.yaml.j2 instead.
# FR | La console admin a quitte home.yaml pour son propre dashboard
# FR | genere (admin.yaml, rendu depuis templates_j2/admin.yaml.j2) a un
# FR | moment donne apres l ecriture de ce fichier — le `!include`
# FR | ci-dessous n a jamais suivi. Rien dans les templates_j2/*.j2
# FR | actuels ne reference ce chemin, donc son contenu (a l origine
# FR | CREER/REGENERER ENERGY) n a jamais atteint le moindre dashboard
# FR | qu un utilisateur puisse ouvrir. L equivalent — CREER/REGENERER
# FR | pour HOME, ENERGY et CORE — vit desormais en ligne dans l ecran
# FR | "dashboards" de templates_j2/admin.yaml.j2 (`{% elif screen ==
# FR | 'dashboards' %}`), la ou c est reellement rendu. Ce fichier n est
# FR | garde que parce que plusieurs docs le referencent encore ; ne pas
# FR | le ressusciter en rajoutant un !include quelque part — editer
# FR | admin.yaml.j2 a la place.
########################################################################
# Visio Sapiens — carte « Dashboards systeme » du panneau ADMIN
#
# DESTINATION :
#     home-assistant/dashboards/admin/system_dashboards.yaml
#
# Ce fichier est charge par home.yaml, vue ADMIN, via :
#     cards:
#       ...
#       - !include admin/system_dashboards.yaml
#       - type: custom:vssp-footer-card
#
# Le chemin est relatif au dossier de home.yaml
# (home-assistant/dashboards/), comme vos autres !include.
#
# POURQUOI CETTE CARTE EXISTE
#   ENERGY et CORE ne sont rattaches a aucune piece Home Assistant : ils
#   ne passent pas par le formulaire creation / modification /
#   suppression du wizard, qui raisonne par piece. Leur cycle de vie est
#   gere ici.
#
# ROBUSTESSE — a lire avant de modifier
#   Cette carte doit rester affichable AVANT que vssp_admin_config.yaml
#   soit charge, sinon le panneau ADMIN devient inutilisable au moment
#   precis ou l'on en a besoin. Deux regles :
#     1. tout acces JS a une entite passe par une garde
#        (`var s = states['...']; return s ? ... : ...`) — sans elle,
#        button-card leve ButtonCardJSTemplateError et la carte
#        n'affiche plus rien ;
#     2. la condition d'affichage du bouton CREER utilise `state_not`,
#        pour qu'il apparaisse aussi quand le capteur d'existence est
#        absent ou indisponible. Le garde-fou reel est cote generateur
#        (--if-missing), pas cote interface.
#
# PREREQUIS
#   1. vssp/vssp_admin_config.yaml fusionne (binary_sensor d'existence,
#      shell_command et scripts vssp_create_energy_dashboard /
#      vssp_regenerate_energy_dashboard).
#   2. La grille de la vue ADMIN doit comporter une zone « system » :
#        grid-template-rows: auto auto auto auto
#        grid-template-areas: |
#          "header header header"
#          "discovery upgrade delete"
#          "system system system"
#          "footer footer footer"
#      (deja applique dans le home.yaml livre)
########################################################################

type: vertical-stack
view_layout:
  grid-area: system
card_mod:
  style: |
    :host {
      display: block;
      background: rgba(8,18,28,0.75);
      border: 1px solid rgba(0,229,255,0.28);
      border-radius: 18px;
      padding: 14px 16px;
      backdrop-filter: blur(12px);
    }
cards:
  - type: custom:button-card
    template: vssp_section_title
    name: "Dashboards systeme — non lies a une piece"

  - type: horizontal-stack
    cards:
      # ── HOME — CREER ──────────────────────────────────────────────
      # S'affiche tant que le dashboard n'est pas confirme present :
      # `state_not: "on"` couvre aussi le capteur absent, inconnu ou
      # indisponible. Impossible d'ecraser un dashboard existant : le
      # script appelle le generateur avec --if-missing (et HOME est de
      # toute facon protege en permanence, voir generate_dashboards.py).
      - type: conditional
        conditions:
          - entity: binary_sensor.vssp_dashboard_home_present
            state_not: "on"
        card:
          type: custom:button-card
          template: vssp_admin_button
          icon: mdi:view-dashboard-outline
          name: CREER HOME
          label: "Dashboard absent — le generer depuis le template"
          confirmation:
            text: "Generer le dashboard HOME a partir du modele ?"
          tap_action:
            action: call-service
            service: script.vssp_create_home_dashboard

      # ── HOME — REGENERER ──────────────────────────────────────────
      # Une fois cree, HOME n'est plus jamais regenere automatiquement
      # (voir --protect-existing dans generate_dashboards.py) : c'est le
      # seul bouton qui peut l'ecraser, deliberement et apres sauvegarde.
      - type: conditional
        conditions:
          - entity: binary_sensor.vssp_dashboard_home_present
            state: "on"
        card:
          type: custom:button-card
          template: vssp_admin_button
          icon: mdi:view-dashboard
          name: REGENERER HOME
          label: "Ecrase toute mise en page manuelle (sauvegarde auto)"
          confirmation:
            text: "Regenerer HOME ecrasera le dashboard actuel, y compris toute modification manuelle (une sauvegarde sera creee). Continuer ?"
          tap_action:
            action: call-service
            service: script.vssp_regenerate_home_dashboard

      # ── ENERGY — CREER ────────────────────────────────────────────
      # S'affiche tant que le dashboard n'est pas confirme present :
      # `state_not: "on"` couvre aussi le capteur absent, inconnu ou
      # indisponible. Impossible d'ecraser un dashboard existant : le
      # script appelle le generateur avec --if-missing.
      - type: conditional
        conditions:
          - entity: binary_sensor.vssp_dashboard_energy_present
            state_not: "on"
        card:
          type: custom:button-card
          template: vssp_admin_button
          icon: mdi:lightning-bolt-outline
          name: CREER ENERGY
          label: "Dashboard absent — le generer depuis le template"
          confirmation:
            text: "Generer le dashboard ENERGY a partir du modele et du parc d'appareils detecte ?"
          tap_action:
            action: call-service
            service: script.vssp_create_energy_dashboard

      # ── ENERGY — REGENERER ────────────────────────────────────────
      - type: conditional
        conditions:
          - entity: binary_sensor.vssp_dashboard_energy_present
            state: "on"
        card:
          type: custom:button-card
          template: vssp_admin_button
          icon: mdi:lightning-bolt
          name: REGENERER ENERGY
          # Garde systematique : une entite absente renvoie undefined et
          # `.state` leverait ButtonCardJSTemplateError.
          label: >-
            [[[
              var m = states['sensor.vssp_dashboard_energy_modifie'];
              var n = states['sensor.vssp_appareils_mesures'];
              var parts = [];
              if (m && m.state && m.state !== 'unknown') parts.push('Genere le ' + m.state);
              if (n && !isNaN(parseInt(n.state))) parts.push(n.state + ' appareils mesures');
              return parts.length ? parts.join(' — ')
                                  : 'Ecrase le dashboard actuel (sauvegarde auto)';
            ]]]
          confirmation:
            text: "Regenerer ENERGY ecrasera le dashboard actuel (une sauvegarde sera creee). Continuer ?"
          tap_action:
            action: call-service
            service: script.vssp_regenerate_energy_dashboard

      # ── SYNC — resynchroniser sans tout regenerer ─────────────────
      - type: custom:button-card
        template: vssp_admin_button
        icon: mdi:sync
        name: SYNC ENERGY
        label: "Ajouter les nouveaux appareils mesures aux tableaux"
        tap_action:
          action: call-service
          service: script.vssp_run_energy_sync

      # ── CORE ──────────────────────────────────────────────────────
      # Le template core.yaml.j2 n'existe pas encore : bouton present
      # pour la coherence du panneau, mais inactif. Des que le template
      # sera ecrit, decommenter l'entree "core" dans DASHBOARDS
      # (generate_dashboards.py) et dupliquer le couple conditionnel
      # d'ENERGY ci-dessus.
      - type: custom:button-card
        template: vssp_admin_button
        icon: mdi:server
        name: CORE
        label: >-
          [[[
            var s = states['binary_sensor.vssp_dashboard_core_present'];
            var etat = !s ? 'etat inconnu'
                     : (s.state === 'on' ? 'dashboard en place' : 'dashboard absent');
            return etat + ' — template de generation a venir';
          ]]]
        tap_action:
          action: none
        styles:
          card:
            - opacity: 0.55

  # ── Diagnostic : la configuration ADMIN est-elle chargee ? ────────
  # Ne s'affiche que si les capteurs d'existence manquent, c'est-a-dire
  # si vssp_admin_config.yaml n'a pas ete fusionne ou si Home Assistant
  # n'a pas encore ete redemarre. Sans ce message, les boutons semblent
  # simplement « ne rien faire ».
  - type: conditional
    conditions:
      - entity: binary_sensor.vssp_dashboard_energy_present
        state: "unavailable"
    card:
      type: markdown
      content: >
        ⚠ **Configuration ADMIN non chargee** — les capteurs d'etat des
        dashboards sont absents. Fusionnez `vssp/vssp_admin_config.yaml`
        dans votre configuration, puis redemarrez Home Assistant.
      card_mod:
        style: |
          ha-card {
            background: rgba(255,176,0,.08);
            border: 1px solid rgba(255,176,0,.35);
            color: #FFB000;
          }

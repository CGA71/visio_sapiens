########################################################################
# Visio Sapiens — HOME MODEL (source of truth)
#
# EN | Location: home-assistant/dashboards/model/house.yaml
# FR | Emplacement : home-assistant/dashboards/model/house.yaml
#
# EN | This file is THE input of the dashboard generator. The admin console
# EN | keeps it up to date:
# EN |   step 0 — the language and format selectors set house.locale / house.format
# EN |   step 1 — the room form writes/completes `rooms:`
# EN |   step 2 — the scan adds newly discovered entities
# EN |   step 3 — the assignment puts each device in a room AND a slot
# EN |   step 5 — the generator renders the templates with this model
# FR | Ce fichier est LA donnee d'entree du generateur de dashboards. La
# FR | console admin le tient a jour :
# FR |   etape 0 — les selecteurs langue et format posent house.locale / house.format
# FR |   etape 1 — le formulaire de pieces ecrit/complete `rooms:`
# FR |   etape 2 — le scan ajoute les entites nouvellement decouvertes
# FR |   etape 3 — l'assignation place chaque appareil dans une piece ET un tableau
# FR |   etape 5 — le generateur rend les templates avec ce modele
#
# EN | Any change here + `python3 generate_dashboards.py` regenerates the
# EN | dashboards. Never edit the generated views by hand.
# FR | Toute modification ici + `python3 generate_dashboards.py` regenere les
# FR | dashboards. Ne modifiez plus les vues generees a la main.
########################################################################

# ── EN | Identity and global design system ────────────────────────────
# ── FR | Identite et charte graphique globale ─────────────────────────
house:
  name: "VISIO SAPIENS"
  tagline: "Smart Home OS"
  theme: "Visio Sapiens"
  logo: /local/vssp/images/logo_VS-Sapiens.png
  weather_entity: weather.maison
  # EN | "time_date" integration / FR | integration « time_date »
  time_entity: sensor.time

  # EN | calendar.* entity shown in the header's agenda cell (_header.j2).
  # EN | The ADMIN console's GOOGLE CALENDAR screen overrides this at
  # EN | generate time (--calendar-entity, fed by
  # EN | input_text.vssp_google_calendar_entity), so linking a Google account
  # EN | switches the header without rewriting this file — same mechanism as
  # EN | locale/format above. This value stays the default for a plain
  # EN | command-line run.
  # FR | Entite calendar.* affichee dans la case agenda du bandeau
  # FR | (_header.j2). L'ecran CALENDRIER GOOGLE de la console ADMIN la
  # FR | surcharge au moment de la generation (--calendar-entity, alimente
  # FR | par input_text.vssp_google_calendar_entity), donc lier un compte
  # FR | Google change le bandeau sans reecrire ce fichier — meme mecanique
  # FR | que locale/format ci-dessus. Cette valeur reste le defaut pour un
  # FR | lancement en ligne de commande simple.
  calendar_entity: calendar.calebar

  # EN | Interface language. English is the reference: any key missing from
  # EN | another catalogue falls back to it, so a partial translation is safe.
  # EN | `generate_dashboards.py --locale <code>` overrides this value, which
  # EN | is how the admin console switches language without rewriting this file.
  # FR | Langue d'interface. L'anglais est la reference : toute cle absente
  # FR | d'un autre catalogue y retombe, donc une traduction partielle ne
  # FR | casse rien. `generate_dashboards.py --locale <code>` surcharge cette
  # FR | valeur : c'est ainsi que la console admin change de langue sans
  # FR | reecrire ce fichier.
  locale: fr

  # EN | Target layout: tablet | mobile | both. Overridden by --format.
  # EN | `both` is the sensible default now that home, core and room all have
  # EN | a *_mobile.yaml.j2: config-fragment.yaml declares the -m dashboards
  # EN | unconditionally, so a tablet-only build would leave those
  # EN | declarations pointing at files nothing writes.
  # FR | Disposition cible : tablet | mobile | both. Surcharge par --format.
  # FR | `both` est le defaut raisonnable maintenant que home, core et room
  # FR | ont tous un *_mobile.yaml.j2 : config-fragment.yaml declare les
  # FR | dashboards -m sans condition, donc un build tablette seule laisserait
  # FR | ces declarations pointer vers des fichiers que rien n'ecrit.
  format: both

# ── EN | Navigation rail — system entries only ────────────────────────
# ── FR | Bandeau de navigation — entrees systeme uniquement ───────────
# EN | The declared rooms are inserted BETWEEN before_rooms and after_rooms by
# EN | the generator. That is what makes the rail dynamic: its length is always
# EN | 4 + the number of rooms, and no room entry is maintained by hand here.
# EN | `path` drives the tablet rail; `path_mobile` the mobile tiles (-m urls).
# FR | Les pieces declarees sont inserees ENTRE before_rooms et after_rooms par
# FR | le generateur. C'est ce qui rend le bandeau dynamique : sa longueur vaut
# FR | toujours 4 + le nombre de pieces, et aucune entree de piece n'est
# FR | maintenue a la main ici.
# FR | `path` pilote le bandeau tablette ; `path_mobile` les tuiles mobiles
# FR | (urls en -m).
nav_system:
  before_rooms:
    - id: home
      name: HOME
      label: "Overview"
      icon: mdi:view-dashboard
      path: /visio-sapiens/home
      path_mobile: /visio-sapiens-m/home
  after_rooms:
    - id: core
      name: CORE
      label: "Central system"
      icon: mdi:server
      path: /visio-sapiens-core/core
      path_mobile: /visio-sapiens-core-m/core
    - id: energy
      name: ENERGY
      label: "Energy management"
      icon: mdi:lightning-bolt
      path: /visio-sapiens-energy/energy
      path_mobile: /visio-sapiens-energy-m/energy
    - id: admin
      name: ADMIN
      label: "Admin console"
      icon: mdi:shield-crown
      path: /visio-sapiens-admin/menu
      path_mobile: /visio-sapiens-admin/menu
      # EN | Hidden from the mobile chip bar. The console is desk work —
      # EN | declaring rooms, assigning eighty devices, importing a stylesheet
      # EN | — and a phone is the wrong place for all of it. The entry stays
      # EN | reachable by URL; it just does not take one of the few chip slots
      # EN | a phone screen can show.
      # FR | Masque de la barre de chips mobile. La console est un travail de
      # FR | bureau — declarer des pieces, assigner quatre-vingts appareils,
      # FR | importer une feuille de style — et un telephone est le mauvais
      # FR | endroit pour tout cela. L entree reste joignable par URL ; elle ne
      # FR | prend simplement pas une des rares places de chip qu un ecran de
      # FR | telephone peut afficher.
      mobile: false

# ── EN | Slot sets — which panels a room may hold ─────────────────────
# ── FR | Jeux de tableaux — quels panneaux une piece peut porter ──────
# EN | A slot set says which slots are CANDIDATES, not what the room contains
# EN | today. A bathroom keeps `switches` in its set even with no shutter
# EN | installed: tomorrow one is added through the form, with no
# EN | reconfiguration. The slot then shows slot.empty in the meantime.
# EN | A slot OUTSIDE the set is not rendered at all — it collapses and its
# EN | neighbours expand. That is the whole difference between "not yet" and
# EN | "never".
# FR | Un jeu de tableaux dit quels tableaux sont CANDIDATS, pas ce que la
# FR | piece contient aujourd'hui. Une salle de bain garde `switches` dans son
# FR | jeu meme sans volet installe : demain on en ajoute un via le
# FR | formulaire, sans reconfiguration. Le tableau affiche slot.empty en
# FR | attendant. Un tableau HORS du jeu n'est pas rendu du tout — il
# FR | s'effondre et ses voisins s'etendent. C'est toute la difference entre
# FR | « pas encore » et « jamais ».
slot_sets:
  default:  [sensors, switches, appliances, security]
  toilet:   [sensors, switches]
  garden:   [sensors, switches, appliances, security]
  # EN | Garage, cellar, laundry.
  # FR | Garage, cave, buanderie.
  utility:  [sensors, switches, appliances, security]
  # EN | Entrance hall: where the intercom lives. No sensors slot — the
  # EN | entrance has no thermostat of its own, and the freed row keeps
  # EN | switches full width, same as every other set.
  # FR | Entree : l'endroit ou vit l'interphone. Pas de tableau sensors —
  # FR | l'entree n'a pas son propre thermostat, et la ligne liberee garde
  # FR | switches pleine largeur, comme dans tout autre jeu.
  entrance: [switches, security]
  # EN | Two slots only, for a corridor or a landing.
  # FR | Deux tableaux seulement, pour un couloir ou un palier.
  minimal:  [switches, security]
  # EN | Named after the room TYPE (room_icons `computer`), not after any
  # EN | one room's own id — a slot set is a reusable preset, not something
  # EN | tied to a specific room instance (the `computer_room` room below is
  # EN | one INSTANCE that may pick this set via its own `slot_set:` field;
  # EN | this set's name and that room's id are two unrelated strings that
  # EN | happen to look similar).
  # EN | Server, network switch, ISP box, firewall — no automatic
  # EN | suggestion (see DEVICE_CLASS_HINT/DOMAIN_HINT in
  # EN | vssp_assign_prepare.py): assigned by hand in the assignment form.
  # FR | Nomme d'apres le TYPE de piece (room_icons `computer`), pas
  # FR | d'apres l'id d'une piece en particulier — un jeu de tableaux est un
  # FR | preset reutilisable, pas quelque chose de lie a une instance de
  # FR | piece precise (la piece `computer_room` plus bas est une INSTANCE
  # FR | qui peut choisir ce jeu via son propre champ `slot_set:` ; le nom de
  # FR | ce jeu et l'id de cette piece sont deux chaines sans rapport qui se
  # FR | ressemblent par coincidence).
  # FR | Serveur, switch reseau, box FAI, firewall — aucune suggestion
  # FR | automatique (voir DEVICE_CLASS_HINT/DOMAIN_HINT dans
  # FR | vssp_assign_prepare.py) : assigne a la main dans le formulaire
  # FR | d'assignation.
  computer: [sensors, switches, infrastructure, security]

# ── EN | Grid layout — computed per room, not declared here ───────────
# ── FR | Gabarit de grille — calcule par piece, pas declare ici ───────
# EN | There used to be a `layouts:` override block here, one hand-drawn grid
# EN | per slot_set. It's gone: compute_room_layout() in
# EN | generate_dashboards.py now builds each room's grid from what it
# EN | actually contains (device counts per slot + its `default_slot`, see
# EN | that field below) instead of a fixed preset — see
# EN | docs/dashboards/Dashboard_Generator.md, "Room dashboard grid — dynamic slot
# EN | layout". Nothing to declare or override here any more.
# FR | Il y avait ici un bloc `layouts:` de surcharge, une grille ecrite a la
# FR | main par slot_set. Il a disparu : compute_room_layout() dans
# FR | generate_dashboards.py construit desormais la grille de chaque piece
# FR | a partir de ce qu'elle contient reellement (nombre d'appareils par
# FR | tableau + son `default_slot`, voir ce champ plus bas) plutot qu'un
# FR | preset fixe — voir docs/dashboards/Dashboard_Generator.md, « Room dashboard
# FR | grid — dynamic slot layout ». Plus rien a declarer ou surcharger ici.

# ── EN | Default icon per room type ───────────────────────────────────
# ── FR | Icone par defaut selon le type de piece ──────────────────────
room_icons:
  kitchen: mdi:countertop
  living_room: mdi:sofa
  dining_room: mdi:silverware-fork-knife
  entrance: mdi:door-open
  laundry: mdi:washing-machine
  technical: mdi:tools
  garage: mdi:garage
  cellar: mdi:stairs-down
  bedroom: mdi:bed
  bathroom: mdi:shower
  toilet: mdi:toilet
  garden: mdi:flower
  pool: mdi:pool
  jacuzzi: mdi:hot-tub
  roof: mdi:home-roof
  computer: mdi:desktop-tower-monitor
  secret: mdi:key

# ── EN | Rooms — the structure of the home ────────────────────────────
# ── FR | Pieces — la structure de la maison ───────────────────────────
# EN | Written by the admin console. One entry per room INSTANCE:
# EN |   id       unique, never translated — feeds paths and file names
# EN |   type     key of the room catalogue (locales/*.yaml, room.<type>)
# EN |   index    for (n) rooms: bedroom 1, bedroom 2...
# EN |   slot_set     which slots are candidates (see above)
# EN |   default_slot which candidate gets the privileged (1fr, most of the
# EN |                screen) band — one of sensors/switches/appliances/
# EN |                security/infrastructure, picked by hand, not inferred
# EN |                from device counts. Falls back to the candidate with
# EN |                the most devices when missing or invalid (see
# EN |                resolve_default_slot() in generate_dashboards.py).
# EN |   slots        device list per slot, IN THE FORM'S ORDER — you decide
# EN |                the TV comes before the console without renaming an
# EN |                entity
# FR | Ecrit par la console admin. Une entree par INSTANCE de piece :
# FR |   id           unique, jamais traduit — alimente les chemins et noms de fichiers
# FR |   type         cle du catalogue de pieces (locales/*.yaml, room.<type>)
# FR |   index        pour les pieces (n) : chambre 1, chambre 2...
# FR |   slot_set     quels tableaux sont candidats (voir ci-dessus)
# FR |   default_slot quel candidat recoit la bande privilegiee (1fr, la
# FR |                majorite de l'ecran) — un parmi sensors/switches/
# FR |                appliances/security/infrastructure, choisi a la main,
# FR |                pas deduit du nombre d'appareils. Se replie sur le
# FR |                candidat le plus charge si absent ou invalide (voir
# FR |                resolve_default_slot() dans generate_dashboards.py).
# FR |   slots        liste d'appareils par tableau, DANS L'ORDRE DU
# FR |                FORMULAIRE — tu decides que la TV passe avant la
# FR |                console sans renommer d'entite
# EN | Empty on purpose. Rooms are no longer hand-written here: since
# EN | vssp_rooms_apply.py syncs this list live from the HA Area registry
# EN | (via the ROOMS & FLOORS admin form) and vssp_preserve_rooms.py
# EN | carries that live state across every CI deploy, a hand-written
# EN | placeholder list here only ever became stale ghost rooms — orphaned
# EN | entries with no area_id that a deploy-time revert (fixed, but only
# EN | going forward) once resurrected alongside the real ones. Leave this
# EN | empty; build the house from the admin console instead.
# FR | Vide volontairement. Les pieces ne sont plus redigees a la main
# FR | ici : puisque vssp_rooms_apply.py synchronise cette liste en direct
# FR | depuis le registre Zones HA (via le formulaire ROOMS & FLOORS) et
# FR | que vssp_preserve_rooms.py transporte cet etat en direct a travers
# FR | chaque deploiement CI, une liste placeholder ecrite a la main ici
# FR | ne devenait jamais que des pieces fantomes perimees — des entrees
# FR | orphelines sans area_id qu un retour en arriere au moment du
# FR | deploiement (corrige, mais seulement a partir de maintenant)
# FR | ressuscitait a cote des vraies. Laisser vide ; construire la maison
# FR | depuis la console admin a la place.
rooms: []

# ── EN | ENERGY dashboard settings ────────────────────────────────────
# ── FR | Parametres du dashboard ENERGY ───────────────────────────────
energy:
  title: ENERGY
  subtitle: "Energy Management"
  url_path: vssp-energy
  view_path: energy
  background: /local/vssp/backgrounds/energy.png
  period_helper: input_select.vssp_energy_period

  solar:
    capacity_helper: input_number.vssp_solar_capacity
    tarif_helper: input_number.vssp_tarif_revente
    inverter_running: binary_sensor.solar_inverter_running
    power: sensor.solar_power_production
    today: sensor.solar_energy_today
    month: sensor.solar_energy_this_month
    year: sensor.solar_energy_this_year

  totals:
    power: sensor.home_power_consumption
    today: sensor.home_energy_today
    month: sensor.home_energy_this_month
    year: sensor.home_energy_this_year

  grid:
    import_power: sensor.grid_import_power
    export_power: sensor.grid_export_power
    export_today: sensor.grid_export_energy_today
    export_month: sensor.grid_export_energy_this_month
    # EN | template sensors / FR | capteurs template
    revenue_month: sensor.vssp_revente_mois
    revenue_year: sensor.vssp_revente_annee

# ── EN | ENERGY dashboard devices ─────────────────────────────────────
# ── FR | Appareils du dashboard ENERGY ────────────────────────────────
# EN | DELIBERATELY ABSENT FROM HERE.
# EN | The list lives in model/energy_devices.yaml, maintained by
# EN | vssp/vssp_energy_sync.py from the entities actually present in Home
# EN | Assistant. Hardcoding devices here would make a fictional fleet
# EN | reappear as soon as the sync fails, hiding the breakage instead of
# EN | reporting it.
# EN | If the "Per-Device Consumption" panel is empty, the sync did not run —
# EN | see the message shown in the card.
# FR | VOLONTAIREMENT ABSENTS D'ICI.
# FR | La liste vit dans model/energy_devices.yaml, maintenue par
# FR | vssp/vssp_energy_sync.py a partir des entites reellement presentes dans
# FR | Home Assistant. Y remettre des appareils en dur ferait reapparaitre un
# FR | parc fictif des que le sync echoue, ce qui masquerait la panne au lieu
# FR | de la signaler.
# FR | Si le tableau « Consommation par appareil » est vide, c'est que le sync
# FR | n'a pas tourne — voir le message affiche dans la carte.

# ── EN | Breaker panel / FR | Tableau electrique ──────────────────────
# EN | Same principle: circuits are discovered (switch.*) by the sync and
# EN | written into model/energy_devices.yaml with their Shelly model. Only the
# EN | rating (amp) is filled in by hand — it is then preserved at every scan.
# FR | Meme principe : les circuits sont decouverts (switch.*) par le sync et
# FR | ecrits dans model/energy_devices.yaml, avec leur modele Shelly. Seul le
# FR | calibre (amp) est a renseigner a la main — il est ensuite preserve a
# FR | chaque scan.
# EN | No `circuits_per_row` any more: the switches are a LIST, one line
# EN | per circuit, so there is no row width left to tune. The knob was
# EN | removed rather than left pointing at nothing.
# FR | Plus de `circuits_per_row` : les interrupteurs forment une LISTE, une
# FR | ligne par circuit, il n'y a donc plus de largeur de rangee a regler.
# FR | Le reglage a ete retire plutot que laisse a pointer dans le vide.
circuits: []

# ── EN | Virtual breaker panel / FR | Tableau electrique virtuel ───────
# EN | The right-hand half of the panel draws the ENCLOSURE: one rail per
# EN | module MOUNTED IN THE PANEL (Shelly Pro 4PM, Pro Dual Cover, LAN
# EN | Switch), each carrying its channels. A plug or a power strip is
# EN | discovered too and is listed in `modules`, but with `panel: false` —
# EN | it hangs off a wall socket, it is not in the enclosure, and the rail
# EN | skips it. Flip `panel` to true by hand on a module the rule misses.
# EN | The list is discovered by
# EN | vssp_energy_sync.py from the Home Assistant device registry — the
# EN | parent/child device link is what says which outlets belong to the
# EN | same box — and written into model/energy_devices.yaml. Empty here for
# EN | the same reason as `devices`: a hardcoded fleet would survive a broken
# EN | scan and hide the breakage.
# FR | La moitie droite du panneau dessine le COFFRET : un rail par module
# FR | MONTE DANS LE TABLEAU (Shelly Pro 4PM, Pro Dual Cover, LAN Switch),
# FR | chacun portant ses voies. Une prise ou une multiprise est decouverte
# FR | elle aussi et figure dans `modules`, mais avec `panel: false` — elle
# FR | pend au bout d'une prise murale, elle n'est pas dans le coffret, et le
# FR | rail la saute. Mettre `panel` a true a la main sur un module que la
# FR | regle rate. La liste est decouverte par
# FR | vssp_energy_sync.py depuis le registre d'appareils de Home Assistant —
# FR | c'est le lien parent/enfant qui dit quelles prises appartiennent au
# FR | meme boitier — et ecrite dans model/energy_devices.yaml. Vide ici pour
# FR | la meme raison que `devices` : un parc code en dur survivrait a un
# FR | scan casse et masquerait la panne.
#
# EN | poles_per_rail = slots drawn per rail. A module shorter than that is
# EN | completed with blanking plates, exactly like a real enclosure.
# FR | poles_per_rail = emplacements dessines par rail. Un module plus court
# FR | est complete par des obturateurs, comme dans un coffret reel.
poles_per_rail: 4

# EN | How many module bays the enclosure shows. Real modules take theirs
# EN | first; the rest stay drawn as free bays, so an empty panel is an empty
# EN | ENCLOSURE — with room for four — rather than a blank half-page. Raise
# EN | it when the real cabinet grows.
# FR | Combien d'emplacements le coffret montre. Les modules reels prennent
# FR | le leur d'abord ; les autres restent dessines en emplacements libres,
# FR | pour qu'un tableau vide soit un COFFRET vide — avec de la place pour
# FR | quatre — et non une demi-page blanche. A augmenter quand le vrai
# FR | coffret grandit.
board_slots: 4
modules: []

# ── EN | Product pictures / FR | Visuels produits ─────────────────────
# EN | Each rail shows the photo of the module it draws. The match is on the
# EN | MODEL reported by Home Assistant, by regular expression and in this
# EN | order, so any number of identical boxes share one picture — three
# EN | Shelly Pro 4PM are three rails and one file. Files live in
# EN | www/vssp/modules/ and are served from /local/vssp/modules/.
# EN | A model that matches nothing falls back to the module icon; nothing
# EN | breaks, the rail just has no photo.
# FR | Chaque rail montre la photo du module qu'il dessine. La correspondance
# FR | porte sur le MODELE remonte par Home Assistant, par expression
# FR | reguliere et dans cet ordre, si bien que n'importe quel nombre de
# FR | boitiers identiques partagent une seule image — trois Shelly Pro 4PM
# FR | font trois rails et un seul fichier. Les fichiers vivent dans
# FR | www/vssp/modules/ et sont servis depuis /local/vssp/modules/.
# FR | Un modele qui ne correspond a rien retombe sur l'icone du module ;
# FR | rien ne casse, le rail n'a simplement pas de photo.
module_image_base: /local/vssp/modules
module_images:
  - match: "pro.?dual.?cover|dual.?(cover|shutter)"
    image: shelly-pro-dual-cover-pm.png
  - match: "pro.?4.?pm"
    image: shelly-pro-4pm.png
  - match: "lan.?switch"
    image: shelly-lan-switch.png
  - match: "power.?strip"
    image: shelly-power-strip-4-gen4.png
  - match: "plug"
    image: shelly-plug-m-gen3.png

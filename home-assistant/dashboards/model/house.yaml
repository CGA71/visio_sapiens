########################################################################
# Visio Sapiens — HOME MODEL (source of truth)
#
# EN | Location: home-assistant/dashboards/model/house.yaml
# FR | Emplacement : home-assistant/dashboards/model/house.yaml
#
# EN | This file is THE input of the dashboard generator. The admin console
# EN | keeps it up to date:
# EN |   step 0 — the language and format selectors set house.locale / house.format
# EN |   step 1 — the room form writes/completes `rooms:`
# EN |   step 2 — the scan adds newly discovered entities
# EN |   step 3 — the assignment puts each device in a room AND a slot
# EN |   step 5 — the generator renders the templates with this model
# FR | Ce fichier est LA donnee d'entree du generateur de dashboards. La
# FR | console admin le tient a jour :
# FR |   etape 0 — les selecteurs langue et format posent house.locale / house.format
# FR |   etape 1 — le formulaire de pieces ecrit/complete `rooms:`
# FR |   etape 2 — le scan ajoute les entites nouvellement decouvertes
# FR |   etape 3 — l'assignation place chaque appareil dans une piece ET un tableau
# FR |   etape 5 — le generateur rend les templates avec ce modele
#
# EN | Any change here + `python3 generate_dashboards.py` regenerates the
# EN | dashboards. Never edit the generated views by hand.
# FR | Toute modification ici + `python3 generate_dashboards.py` regenere les
# FR | dashboards. Ne modifiez plus les vues generees a la main.
########################################################################

# ── EN | Identity and global design system ────────────────────────────
# ── FR | Identite et charte graphique globale ─────────────────────────
house:
  name: "VISIO SAPIENS"
  tagline: "Smart Home OS"
  theme: "Visio Sapiens"
  logo: /local/vssp/images/logo_VS-Sapiens.png
  weather_entity: weather.maison
  # EN | "time_date" integration / FR | integration « time_date »
  time_entity: sensor.time

  # EN | Interface language. English is the reference: any key missing from
  # EN | another catalogue falls back to it, so a partial translation is safe.
  # EN | `generate_dashboards.py --locale <code>` overrides this value, which
  # EN | is how the admin console switches language without rewriting this file.
  # FR | Langue d'interface. L'anglais est la reference : toute cle absente
  # FR | d'un autre catalogue y retombe, donc une traduction partielle ne
  # FR | casse rien. `generate_dashboards.py --locale <code>` surcharge cette
  # FR | valeur : c'est ainsi que la console admin change de langue sans
  # FR | reecrire ce fichier.
  locale: fr

  # EN | Target layout: tablet | mobile | both. Overridden by --format.
  # FR | Disposition cible : tablet | mobile | both. Surcharge par --format.
  format: tablet

# ── EN | Navigation rail — system entries only ────────────────────────
# ── FR | Bandeau de navigation — entrees systeme uniquement ───────────
# EN | The declared rooms are inserted BETWEEN before_rooms and after_rooms by
# EN | the generator. That is what makes the rail dynamic: its length is always
# EN | 4 + the number of rooms, and no room entry is maintained by hand here.
# EN | `path` drives the tablet rail; `path_mobile` the mobile tiles (-m urls).
# FR | Les pieces declarees sont inserees ENTRE before_rooms et after_rooms par
# FR | le generateur. C'est ce qui rend le bandeau dynamique : sa longueur vaut
# FR | toujours 4 + le nombre de pieces, et aucune entree de piece n'est
# FR | maintenue a la main ici.
# FR | `path` pilote le bandeau tablette ; `path_mobile` les tuiles mobiles
# FR | (urls en -m).
nav_system:
  before_rooms:
    - id: home
      name: HOME
      label: "Overview"
      icon: mdi:view-dashboard
      path: /visio-sapiens/home
      path_mobile: /visio-sapiens-m/home
  after_rooms:
    - id: core
      name: CORE
      label: "Central system"
      icon: mdi:server
      path: /visio-sapiens-core/core
      # EN | No mobile CORE dashboard yet: core.yaml.j2 has no mobile branch,
      # EN | so the tablet view is the target for now. Point this at
      # EN | /visio-sapiens-core-m/core once it exists AND is declared in
      # EN | config-fragment.yaml — the generator checks both.
      # FR | Pas encore de dashboard CORE mobile : core.yaml.j2 n'a pas de
      # FR | branche mobile, la vue tablette est donc la cible pour l'instant.
      # FR | Pointer vers /visio-sapiens-core-m/core quand il existera ET sera
      # FR | declare dans config-fragment.yaml — le generateur controle les deux.
      path_mobile: /visio-sapiens-core/core
    - id: energy
      name: ENERGY
      label: "Energy management"
      icon: mdi:lightning-bolt
      path: /visio-sapiens-energy/energy
      path_mobile: /visio-sapiens-energy-m/energy
    - id: admin
      name: ADMIN
      label: "Admin console"
      icon: mdi:shield-crown
      path: /visio-sapiens/admin
      path_mobile: /visio-sapiens-m/admin

# ── EN | Slot sets — which panels a room may hold ─────────────────────
# ── FR | Jeux de tableaux — quels panneaux une piece peut porter ──────
# EN | A slot set says which slots are CANDIDATES, not what the room contains
# EN | today. A bathroom keeps `shutters` in its set even with no shutter
# EN | installed: tomorrow one is added through the form, with no
# EN | reconfiguration. The slot then shows slot.empty in the meantime.
# EN | A slot OUTSIDE the set is not rendered at all — it collapses and its
# EN | neighbours expand. That is the whole difference between "not yet" and
# EN | "never".
# FR | Un jeu de tableaux dit quels tableaux sont CANDIDATS, pas ce que la
# FR | piece contient aujourd'hui. Une salle de bain garde `shutters` dans son
# FR | jeu meme sans volet installe : demain on en ajoute un via le
# FR | formulaire, sans reconfiguration. Le tableau affiche slot.empty en
# FR | attendant. Un tableau HORS du jeu n'est pas rendu du tout — il
# FR | s'effondre et ses voisins s'etendent. C'est toute la difference entre
# FR | « pas encore » et « jamais ».
slot_sets:
  default:  [climate, lights, appliances, shutters, security, audio]
  toilet:   [climate, lights, shutters, audio]
  garden:   [climate, lights, appliances, security, audio]
  # EN | Garage, cellar, laundry: no shutters, no audio stream.
  # FR | Garage, cave, buanderie : pas de volets, pas de flux audio.
  utility:  [climate, lights, appliances, security]
  # EN | Entrance hall: where the intercom lives.
  # FR | Entree : l'endroit ou vit l'interphone.
  entrance: [climate, lights, security]
  # EN | Two slots only, for a corridor or a landing.
  # FR | Deux tableaux seulement, pour un couloir ou un palier.
  minimal:  [lights, security]

# ── EN | Grid layouts — one per slot set ──────────────────────────────
# ── FR | Gabarits de grille — un par jeu de tableaux ──────────────────
# EN | THE FEWER SLOTS A ROOM HAS, THE MORE ROOM THE REMAINING ONES GET.
# EN | That is the whole point of writing these by hand instead of computing
# EN | them: an entrance with three slots gives `security` four columns over
# EN | two rows, which is what an intercom video feed plus a camera mosaic
# EN | actually needs. A computed collapse would have kept it the same size
# EN | as in a six-slot living room and wasted the freed space.
# FR | MOINS UNE PIECE A DE TABLEAUX, PLUS LES RESTANTS ONT DE PLACE.
# FR | C'est tout l'interet de les ecrire a la main plutot que de les
# FR | calculer : une entree a trois tableaux donne a `security` quatre
# FR | colonnes sur deux lignes, ce dont un flux video d'interphone plus une
# FR | mosaique de cameras a reellement besoin. Un effondrement calcule
# FR | l'aurait laisse a la taille qu'il a dans un salon a six tableaux, et
# FR | aurait gaspille la place liberee.
#
# EN | `nav` and `header` are not slots — every other token must match a slot
# EN | of the corresponding set. generate_dashboards.py refuses to render when
# EN | they disagree: a slot with no area produces a panel that is silently
# EN | never displayed.
# FR | `nav` et `header` ne sont pas des tableaux — tout autre element doit
# FR | correspondre a un tableau du jeu concerne. generate_dashboards.py
# FR | refuse de rendre en cas de desaccord : un tableau sans zone produit un
# FR | panneau qui n'est jamais affiche, en silence.
#
# EN | Omitting this whole block is fine: the generator's built-in layouts
# EN | apply. Declare a set here only to override one.
# FR | Omettre tout ce bloc ne pose pas de probleme : les gabarits integres au
# FR | generateur s'appliquent. N'en declarer un ici que pour le surcharger.
layouts:
  entrance:
    rows: "105px 300px 300px"
    areas:
      - "nav header   header   header   header   header"
      - "nav security security security security lights"
      - "nav security security security security climate"
  minimal:
    rows: "105px 620px"
    areas:
      - "nav header   header   header   header   header"
      - "nav security security security security lights"

# ── EN | Default icon per room type ───────────────────────────────────
# ── FR | Icone par defaut selon le type de piece ──────────────────────
room_icons:
  kitchen: mdi:countertop
  living_room: mdi:sofa
  dining_room: mdi:silverware-fork-knife
  entrance: mdi:door-open
  laundry: mdi:washing-machine
  technical: mdi:tools
  garage: mdi:garage
  cellar: mdi:stairs-down
  bedroom: mdi:bed
  bathroom: mdi:shower
  toilet: mdi:toilet
  garden: mdi:flower
  pool: mdi:pool
  jacuzzi: mdi:hot-tub
  roof: mdi:home-roof
  computer: mdi:desktop-tower-monitor
  secret: mdi:key

# ── EN | Rooms — the structure of the home ────────────────────────────
# ── FR | Pieces — la structure de la maison ───────────────────────────
# EN | Written by the admin console. One entry per room INSTANCE:
# EN |   id       unique, never translated — feeds paths and file names
# EN |   type     key of the room catalogue (locales/*.yaml, room.<type>)
# EN |   index    for (n) rooms: bedroom 1, bedroom 2...
# EN |   slot_set which slots are candidates (see above)
# EN |   slots    device list per slot, IN THE FORM'S ORDER — you decide the
# EN |            TV comes before the console without renaming an entity
# EN | `audio` is the one slot with two roles: a stream exists independently of
# EN | its output. With a source but no output, the panel shows the player and
# EN | slot.audio_no_speaker.
# FR | Ecrit par la console admin. Une entree par INSTANCE de piece :
# FR |   id       unique, jamais traduit — alimente les chemins et noms de fichiers
# FR |   type     cle du catalogue de pieces (locales/*.yaml, room.<type>)
# FR |   index    pour les pieces (n) : chambre 1, chambre 2...
# FR |   slot_set quels tableaux sont candidats (voir ci-dessus)
# FR |   slots    liste d'appareils par tableau, DANS L'ORDRE DU FORMULAIRE —
# FR |            tu decides que la TV passe avant la console sans renommer
# FR |            d'entite
# FR | `audio` est le seul tableau a deux roles : un flux existe independamment
# FR | de sa sortie. Avec une source mais aucune sortie, le panneau affiche le
# FR | lecteur et slot.audio_no_speaker.
rooms:
  - id: living_room
    type: living_room
    slot_set: default
    slots:
      climate: []
      lights: []
      appliances: []
      shutters: []
      security: []
      audio:
        source: []
        output: []

  - id: bedroom_1
    type: bedroom
    index: 1
    slot_set: default
    slots: {}

  - id: bedroom_2
    type: bedroom
    index: 2
    slot_set: default
    slots: {}

  - id: bathroom_1
    type: bathroom
    index: 1
    slot_set: default
    slots: {}

  - id: computer
    type: computer
    slot_set: default
    slots: {}

  - id: technical
    type: technical
    slot_set: default
    slots: {}

  - id: secret
    type: secret
    slot_set: default
    slots: {}

  - id: entrance
    type: entrance
    slot_set: entrance
    slots: {}

  - id: garden
    type: garden
    slot_set: garden
    slots: {}

# ── EN | ENERGY dashboard settings ────────────────────────────────────
# ── FR | Parametres du dashboard ENERGY ───────────────────────────────
energy:
  title: ENERGY
  subtitle: "Energy Management"
  url_path: vssp-energy
  view_path: energy
  background: /local/vssp/backgrounds/energy.png
  period_helper: input_select.vssp_energy_period

  solar:
    capacity_helper: input_number.vssp_solar_capacity
    tarif_helper: input_number.vssp_tarif_revente
    inverter_running: binary_sensor.solar_inverter_running
    power: sensor.solar_power_production
    today: sensor.solar_energy_today
    month: sensor.solar_energy_this_month
    year: sensor.solar_energy_this_year

  totals:
    power: sensor.home_power_consumption
    today: sensor.home_energy_today
    month: sensor.home_energy_this_month
    year: sensor.home_energy_this_year

  grid:
    import_power: sensor.grid_import_power
    export_power: sensor.grid_export_power
    export_today: sensor.grid_export_energy_today
    export_month: sensor.grid_export_energy_this_month
    # EN | template sensors / FR | capteurs template
    revenue_month: sensor.vssp_revente_mois
    revenue_year: sensor.vssp_revente_annee

# ── EN | ENERGY dashboard devices ─────────────────────────────────────
# ── FR | Appareils du dashboard ENERGY ────────────────────────────────
# EN | DELIBERATELY ABSENT FROM HERE.
# EN | The list lives in model/energy_devices.yaml, maintained by
# EN | vssp/vssp_energy_sync.py from the entities actually present in Home
# EN | Assistant. Hardcoding devices here would make a fictional fleet
# EN | reappear as soon as the sync fails, hiding the breakage instead of
# EN | reporting it.
# EN | If the "Per-Device Consumption" panel is empty, the sync did not run —
# EN | see the message shown in the card.
# FR | VOLONTAIREMENT ABSENTS D'ICI.
# FR | La liste vit dans model/energy_devices.yaml, maintenue par
# FR | vssp/vssp_energy_sync.py a partir des entites reellement presentes dans
# FR | Home Assistant. Y remettre des appareils en dur ferait reapparaitre un
# FR | parc fictif des que le sync echoue, ce qui masquerait la panne au lieu
# FR | de la signaler.
# FR | Si le tableau « Consommation par appareil » est vide, c'est que le sync
# FR | n'a pas tourne — voir le message affiche dans la carte.

# ── EN | Breaker panel / FR | Tableau electrique ──────────────────────
# EN | Same principle: circuits are discovered (switch.*) by the sync and
# EN | written into model/energy_devices.yaml with their Shelly model. Only the
# EN | rating (amp) is filled in by hand — it is then preserved at every scan.
# FR | Meme principe : les circuits sont decouverts (switch.*) par le sync et
# FR | ecrits dans model/energy_devices.yaml, avec leur modele Shelly. Seul le
# FR | calibre (amp) est a renseigner a la main — il est ensuite preserve a
# FR | chaque scan.
circuits_per_row: 6
circuits: []

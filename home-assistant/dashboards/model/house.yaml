########################################################################
# Visio Sapiens — MODÈLE MÉTIER DE LA MAISON (source de vérité)
#
# Emplacement suggéré : home-assistant/dashboards/model/house.yaml
#
# Ce fichier est LA donnée d'entrée du générateur de dashboards.
# C'est lui que votre futur processus admin (formulaire dans home.yaml)
# mettra à jour :
#   étape 2 — le formulaire écrit/complète `rooms:`
#   étape 3 — le scan des nouveaux objets ajoute des entrées `devices:`
#   étape 4 — l'assignation déplace un device dans la bonne pièce
#   étape 5 — le générateur rend energy.yaml.j2 avec ce modèle
#
# Toute modification ici + `python3 generate_dashboards.py` régénère
# les dashboards. Ne modifiez plus energy.yaml à la main.
########################################################################

# ── Identité / chartre graphique globale ──────────────────────────────
house:
  name: "VISIO SAPIENS"
  tagline: "Smart Home OS"
  theme: "Visio Sapiens"
  logo: /local/vssp/images/logo_VS-Sapiens.png
  weather_entity: weather.maison
  time_entity: sensor.time            # intégration "time_date"

# ── Navigation — ordre = ordre d'affichage ───────────────────────────
# `path` : sidebar desktop (home.yaml) ; `path_mobile` : tuiles du
# dashboard mobile (home_mobile.yaml, urls en -m).
nav:
  - id: home
    name: HOME
    label: "Vue d'ensemble"
    icon: mdi:view-dashboard
    path: /visio-sapiens/home
    path_mobile: /visio-sapiens-m/home
  - id: core
    name: CORE
    label: "Systeme central"
    icon: mdi:server
    path: /visio-sapiens-core/core
    path_mobile: /visio-sapiens-core-m/core
  - id: livingroom
    name: LIVING ROOM
    label: "Salon"
    icon: mdi:sofa
    path: /visio-sapiens-livingroom/livingroom
    path_mobile: /visio-sapiens-livingroom-m/livingroom
  - id: bedroom1
    name: BEDROOM-1
    label: "Chambre principale"
    icon: mdi:bed
    path: /visio-sapiens-bedroom1/bedroom1
    path_mobile: /visio-sapiens-bedroom1-m/bedroom1
  - id: bedroom2
    name: BEDROOM-2
    label: "Chambre 2"
    icon: mdi:bed-outline
    path: /visio-sapiens-bedroom2/bedroom2
    path_mobile: /visio-sapiens-bedroom2-m/bedroom2
  - id: bathroom
    name: BATHROOM
    label: "Salle de bain"
    icon: mdi:shower
    path: /visio-sapiens-bathroom/bathroom
    path_mobile: /visio-sapiens-bathroom-m/bathroom
  - id: computer
    name: COMPUTER ROOM
    label: "Salle informatique"
    icon: mdi:desktop-tower-monitor
    path: /visio-sapiens-computer/computer
    path_mobile: /visio-sapiens-computer-m/computer
  - id: technical
    name: TECHNICAL ROOM
    label: "Local technique"
    icon: mdi:tools
    path: /visio-sapiens-technical/technical
    path_mobile: /visio-sapiens-technical-m/technical
  - id: secret
    name: SECRET ROOM
    label: "Piece secrete"
    icon: mdi:key
    path: /visio-sapiens-secret/secret
    path_mobile: /visio-sapiens-secret-m/secret
  - id: garden
    name: GARDEN
    label: "Jardin"
    icon: mdi:flower
    path: /visio-sapiens-garden/garden
    path_mobile: /visio-sapiens-garden-m/garden
  - id: energy
    name: ENERGY
    label: "Gestion energie"
    icon: mdi:lightning-bolt
    path: /visio-sapiens-energy/energy
    path_mobile: /visio-sapiens-energy-m/energy
  - id: admin
    name: ADMIN
    label: "Panneau administration"
    icon: mdi:shield-crown
    path: /visio-sapiens/admin
    path_mobile: /visio-sapiens-m/admin

# ── Paramètres du dashboard ENERGY ────────────────────────────────────
energy:
  title: ENERGY
  subtitle: "Energy Management"
  url_path: vssp-energy
  view_path: energy
  background: /local/vssp/backgrounds/energy.png
  period_helper: input_select.vssp_energy_period

  solar:
    capacity_helper: input_number.vssp_solar_capacity
    tarif_helper: input_number.vssp_tarif_revente
    inverter_running: binary_sensor.solar_inverter_running
    power: sensor.solar_power_production
    today: sensor.solar_energy_today
    month: sensor.solar_energy_this_month
    year: sensor.solar_energy_this_year

  totals:
    power: sensor.home_power_consumption
    today: sensor.home_energy_today
    month: sensor.home_energy_this_month
    year: sensor.home_energy_this_year

  grid:
    import_power: sensor.grid_import_power
    export_power: sensor.grid_export_power
    export_today: sensor.grid_export_energy_today
    export_month: sensor.grid_export_energy_this_month
    revenue_month: sensor.vssp_revente_mois       # template sensor
    revenue_year: sensor.vssp_revente_annee       # template sensor

# ── Pièces (structure de la maison) ──────────────────────────────────
# Renseigné par le wizard (phase 1). Le dashboard ENERGY ne s'en sert
# PAS : il n'est lié à aucune pièce. Ces données servent aux futurs
# dashboards de pièce (livingroom, bedroom…).
rooms: []

# ── Appareils du dashboard ENERGY ────────────────────────────────────
# VOLONTAIREMENT ABSENTS D'ICI.
#
# La liste vit dans model/energy_devices.yaml, maintenue par
# vssp/vssp_energy_sync.py à partir des entités réellement présentes
# dans Home Assistant. Y remettre des appareils en dur ferait
# réapparaître un parc fictif dès que le sync échoue, ce qui masquerait
# la panne au lieu de la signaler.
#
# Si le tableau « Consommation par appareil » est vide, c'est que le
# sync n'a pas tourné — voir le message affiché dans la carte.

# ── Tableau électrique ───────────────────────────────────────────────
# Même principe : les circuits sont découverts (switch.*) par le sync
# et écrits dans model/energy_devices.yaml, avec leur modèle Shelly.
# Seul le calibre (amp) est à renseigner à la main — il est ensuite
# préservé à chaque scan.
circuits_per_row: 6
circuits: []

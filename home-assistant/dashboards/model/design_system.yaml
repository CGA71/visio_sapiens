########################################################################
# Visio Sapiens — DESIGN SYSTEM (source of truth for the visual theme)
#
# EN | Location: home-assistant/dashboards/model/design_system.yaml
# FR | Emplacement : home-assistant/dashboards/model/design_system.yaml
#
# EN | This file is the input of the theme generator (step 5 of the admin
# EN | process, theme branch). It is rendered by
# EN | templates_j2/theme.yaml.j2 into themes/visio_sapiens.yaml — that file
# EN | is now GENERATED and must not be hand-edited any more; edit this one
# EN | instead, then run:
# EN |   python3 vssp/generate_dashboards.py --only theme
# EN | or use the THEME screen of the ADMIN console, which does the same
# EN | thing plus a live reload (frontend.reload_themes) — no dashboard
# EN | regeneration needed, since every generated dashboard already reads
# EN | its colors from the active theme rather than from a copy of its own.
# FR | Ce fichier est l'entree du generateur de theme (etape 5 du processus
# FR | admin, branche theme). Il est rendu par templates_j2/theme.yaml.j2
# FR | vers themes/visio_sapiens.yaml — ce fichier est desormais GENERE et ne
# FR | doit plus etre edite a la main ; editez celui-ci a la place, puis
# FR | lancez :
# FR |   python3 vssp/generate_dashboards.py --only theme
# FR | ou utilisez l'ecran THEME de la console ADMIN, qui fait la meme chose
# FR | plus un rechargement a chaud (frontend.reload_themes) — aucune
# FR | regeneration de dashboard n'est necessaire, puisque chaque dashboard
# FR | genere lit deja ses couleurs depuis le theme actif plutot que depuis
# FR | une copie qui lui serait propre.
#
# EN | SCOPE (phase 1 / MVP) — only the Home Assistant native theme tokens:
# EN | palette, header, sidebar, card/dialog shape. The neon glass-panel
# EN | look baked directly into card_mod blocks across templates_j2/*.j2
# EN | (borders, blur, box-shadow) is NOT driven by this file yet — that is
# EN | phase 2, tracked in docs/dashboards/Design_System_Editor.md.
# FR | PERIMETRE (phase 1 / MVP) — seulement les tokens de theme natifs Home
# FR | Assistant : palette, en-tete, sidebar, forme des cartes/dialogues.
# FR | L'aspect vitre neon code en dur dans les blocs card_mod des
# FR | templates_j2/*.j2 (bordures, flou, ombre) n'est PAS encore pilote par
# FR | ce fichier — c'est la phase 2, suivie dans
# FR | docs/dashboards/Design_System_Editor.md.
#
# EN | To reset to factory values: use the RESTORE REFERENCE button of the
# EN | THEME screen (copies design_system.default.yaml back here, with a
# EN | backup first) rather than editing this file's values by hand to match
# EN | it — the button also regenerates the theme and reloads it live.
# FR | Pour revenir aux valeurs d'usine : utiliser le bouton RESTAURER LA
# FR | REFERENCE de l'ecran THEME (recopie design_system.default.yaml ici,
# FR | avec sauvegarde prealable) plutot que de recopier ses valeurs a la
# FR | main — le bouton regenere aussi le theme et le recharge a chaud.
########################################################################

design:
  # EN | Home Assistant theme name — must match `house.theme` in house.yaml.
  # FR | Nom du theme Home Assistant — doit correspondre a `house.theme` dans
  # FR | house.yaml.
  name: "Visio Sapiens"

  palette:
    primary: "#00E5FF"
    accent: "#00FFD5"
    background: "#050B12"
    background_secondary: "#101B27"
    card_background: "rgba(16,27,39,0.85)"
    selector_background: "#000000"
    # EN | TEXT FIELDS — the editable box an input_text row renders as
    # EN | (CALENDAR's "Calendar shown in the header"). Home Assistant now
    # EN | builds these on Web Awesome (`wa-input` inside `ha-input`), whose
    # EN | fill comes from --ha-color-form-background: a LIGHT value by
    # EN | default, which is why the field showed up as a white box on this
    # EN | dark console, with the pale cyan label and white value inside it
    # EN | both unreadable.
    # EN | Light grey rather than dark on purpose: a place you type reads
    # EN | better as a light surface than as one more dark panel. That only
    # EN | works if the two texts on it come along, hence three tokens —
    # EN | fill, value ink, and a softer label ink for hierarchy.
    # EN | Applied by admin.yaml.j2 as a card-scoped card_mod, NOT through
    # EN | the theme: the label reads --secondary-text-color, which is a
    # EN | GLOBAL token (pale cyan here, correct on every dark surface in the
    # EN | interface). Redefining it theme-wide to suit one field would break
    # EN | secondary text everywhere else.
    # FR | CHAMPS TEXTE — la boite editable que rend une ligne input_text
    # FR | (« Calendrier affiche dans le bandeau » de l'ecran CALENDRIER).
    # FR | Home Assistant les construit desormais sur Web Awesome (`wa-input`
    # FR | dans `ha-input`), dont le remplissage vient de
    # FR | --ha-color-form-background : une valeur CLAIRE par defaut, d'ou la
    # FR | boite blanche sur cette console sombre, avec un libelle cyan pale
    # FR | et une valeur blanche tous deux illisibles dessus.
    # FR | Gris clair plutot que sombre a dessein : un endroit ou l'on saisit
    # FR | se lit mieux en surface claire qu'en enieme panneau sombre. Cela
    # FR | ne marche que si les deux textes suivent, d'ou trois tokens —
    # FR | remplissage, encre de la valeur, et une encre de libelle plus
    # FR | douce pour la hierarchie.
    # FR | Applique par admin.yaml.j2 en card_mod limite a la carte, PAS via
    # FR | le theme : le libelle lit --secondary-text-color, un token GLOBAL
    # FR | (cyan pale ici, correct sur toutes les surfaces sombres de
    # FR | l'interface). Le redefinir pour tout le theme afin d'arranger un
    # FR | champ casserait le texte secondaire partout ailleurs.
    input_background: "#C9D6DE"
    input_ink: "#0A1720"
    input_label: "#3A4E5A"
    text_primary: "#FFFFFF"
    text_secondary: "#B8E8F5"

  header:
    background: "#08121C"
    text: "#00E5FF"

  divider: "#1F3448"

  icons:
    default: "#00E5FF"
    active: "#00FFD5"

  shape:
    card_radius: "18px"
    card_border_width: "1px"
    dialog_radius: "20px"

  # EN | browser_mod popup dialogs
  # FR | popups browser_mod
  dialog:
    scrim: "rgba(2,5,11,0.75)"

  sidebar:
    background: "#050B12"
    text: "#B8E8F5"
    icon: "#00E5FF"
    selected_background: "rgba(0,229,255,0.10)"
    selected_text: "#00E5FF"
    selected_icon: "#00E5FF"

  # EN | transparency
  # FR | transparence
  bubble_backdrop: "transparent"

  # EN | Typefaces — a name from vssp_design_fields.FONTS, nothing else.
  # EN | display: nav rail, header, titles, values. body: all other text.
  # FR | Polices — un nom de vssp_design_fields.FONTS, rien d'autre.
  # FR | display : bandeau de nav, header, titres, valeurs. body : le reste.
  typography:
    display: "Orbitron"
    body: "Roboto"
    # EN | Size scale per usage, 50%-200% (vssp_design_fields.SCALE_DEFAULT).
    # EN | clock: header clock. title: headings. value: readings (W, kWh, °C).
    # EN | text: names and HA's own text. label: captions, units, hints.
    # FR | Echelle de taille par usage, 50 %-200 % (voir SCALE_DEFAULT).
    # FR | clock : horloge. title : titres. value : mesures (W, kWh, °C).
    # FR | text : noms et texte de HA. label : legendes, unites, aides.
    size:
      clock: "100%"
      title: "100%"
      value: "100%"
      text: "100%"
      label: "100%"

  # EN | Image under the navigation rail: "default" (house.logo), "none",
  # EN | or an image sent from the THEME screen (written by
  # EN | vssp_theme_apply.py, never by hand).
  # FR | Image sous le bandeau de navigation : "default" (house.logo),
  # FR | "none", ou une image envoyee depuis l'ecran THEME (ecrite par
  # FR | vssp_theme_apply.py, jamais a la main).
  nav_logo: "default"

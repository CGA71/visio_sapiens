########################################################################
# EN | The Visio Sapiens safe — HashiCorp Vault, Docker, on the
# EN | 192.168.1.11 host. Deploy with:
# FR | Le coffre Visio Sapiens — HashiCorp Vault, Docker, sur l hote
# FR | 192.168.1.11. Deployer avec :
#
#     cd /opt/vssp-vault && docker compose up -d
#
# EN | First run only, then follow docs/platform/Vault.md: initialise, write down
# EN | the five unseal keys and the root token OFF this machine, unseal,
# EN | then run bootstrap.sh.
# FR | Premier lancement seulement, puis suivre docs/platform/Vault.fr.md :
# FR | initialiser, noter les cinq cles de descellement et le token root
# FR | HORS de cette machine, desceller, puis lancer bootstrap.sh.
########################################################################
services:
  vault:
    # EN | THIS LINE IS REWRITTEN ON THE HOST by the UPDATES screen. Pressing
    # EN | INSTALL on the Coffre-fort row runs install_vault() in
    # EN | vssp/vssp_infra_updates.py, which seds this image tag to the next
    # EN | supported version and runs `docker compose up -d` in
    # EN | /opt/vssp-vault. So the tag here is the version a FRESH install
    # EN | starts on, not necessarily the one running: ask the screen, or
    # EN | `docker exec vssp-vault vault version`.
    # EN | Re-copying this file over a host that has been upgraded therefore
    # EN | pins it BACK. That shows up on the screen as an update pending
    # EN | again rather than silently, but bump this line when you bump the
    # EN | host, and never skip a minor series in it — see the upgrade
    # EN | policies in vssp_infra_updates.py for why.
    # FR | CETTE LIGNE EST REECRITE SUR L HOTE par l ecran MISES A JOUR.
    # FR | Appuyer sur INSTALLER sur la ligne Coffre-fort execute
    # FR | install_vault() dans vssp/vssp_infra_updates.py, qui sede ce tag
    # FR | d image vers la prochaine version supportee et lance
    # FR | `docker compose up -d` dans /opt/vssp-vault. Le tag ici est donc la
    # FR | version sur laquelle demarre une installation NEUVE, pas forcement
    # FR | celle qui tourne : demander a l ecran, ou
    # FR | `docker exec vssp-vault vault version`.
    # FR | Recopier ce fichier par-dessus un hote deja mis a niveau le rabat
    # FR | donc EN ARRIERE. Cela apparait a l ecran comme une mise a jour de
    # FR | nouveau en attente plutot qu en silence, mais mettre cette ligne a
    # FR | jour quand on met l hote a jour, et ne jamais y sauter une serie
    # FR | mineure — voir les politiques de mise a niveau dans
    # FR | vssp_infra_updates.py pour pourquoi.
    image: hashicorp/vault:1.20
    container_name: vssp-vault
    restart: unless-stopped

    # EN | IPC_LOCK lets Vault mlock its memory so the master key and
    # EN | decrypted secrets are never written to swap. Without it Vault
    # EN | starts anyway but warns, and a swapped page can leave secret
    # EN | material on disk outside the encrypted store — which is the one
    # EN | thing the safe exists to prevent.
    # FR | IPC_LOCK permet a Vault de verrouiller sa memoire (mlock) pour
    # FR | que la cle maitre et les secrets dechiffres ne partent jamais en
    # FR | swap. Sans lui Vault demarre quand meme mais avertit, et une
    # FR | page swappee peut laisser de la matiere secrete sur disque hors
    # FR | du stockage chiffre — precisement ce que le coffre existe pour
    # FR | empecher.
    cap_add:
      - IPC_LOCK

    # EN | IPC_LOCK grants the CAPABILITY to lock memory. RLIMIT_MEMLOCK caps
    # EN | HOW MUCH may be locked, and it is a separate knob that the
    # EN | capability does not touch. The host default is 8 MB. Vault 1.x fit
    # EN | inside it, so this was a latent bug for the whole life of this file;
    # EN | 2.x does not, and the container dies on startup with
    # EN | "Failed to lock memory: cannot allocate memory" — a message that
    # EN | names mlock and says nothing about the limit that actually refused.
    # EN | Unlimited is what HashiCorp's own docs ask for. The alternative,
    # EN | disable_mlock, would give up the protection the capability above
    # EN | exists to provide: secrets reaching swap in clear.
    # FR | IPC_LOCK accorde la CAPACITE de verrouiller la memoire.
    # FR | RLIMIT_MEMLOCK plafonne COMBIEN peut l etre, et c est un reglage
    # FR | distinct que la capacite ne touche pas. Le defaut de l hote est de
    # FR | 8 Mo. Vault 1.x tenait dedans — ce bug est donc reste latent toute
    # FR | la vie de ce fichier ; 2.x n y tient pas, et le conteneur meurt au
    # FR | demarrage sur « Failed to lock memory: cannot allocate memory », un
    # FR | message qui nomme mlock et ne dit rien de la limite qui a refuse.
    # FR | Illimite est ce que demande la documentation de HashiCorp.
    # FR | L alternative, disable_mlock, abandonnerait la protection meme que la
    # FR | capacite ci-dessus existe pour fournir : des secrets qui atteignent
    # FR | le swap en clair.
    ulimits:
      memlock: -1

    # EN | Bound to the LAN address, not 0.0.0.0: the safe has no business
    # EN | listening on every interface of a machine that also faces the
    # EN | router.
    # FR | Lie a l adresse du reseau local, pas 0.0.0.0 : le coffre n a
    # FR | rien a faire a l ecoute sur toutes les interfaces d une machine
    # FR | qui fait aussi face au routeur.
    ports:
      - "192.168.1.11:8200:8200"

    volumes:
      - ./config/vault.hcl:/vault/config/vault.hcl:ro
      # EN | Mounted read-only so bootstrap.sh and the policies can be run
      # EN | from inside the container without copying them in — and so a
      # EN | policy change is a `git pull` plus a re-run, not an edit made
      # EN | on the host and lost at the next deploy.
      # FR | Montes en lecture seule pour que bootstrap.sh et les policies
      # FR | soient executables depuis le conteneur sans les y copier — et
      # FR | pour qu une modification de policy soit un `git pull` suivi
      # FR | d une re-execution, pas une retouche faite sur l hote et
      # FR | perdue au deploiement suivant.
      - ./policies:/vault/policies:ro
      - ./bootstrap.sh:/vault/bootstrap.sh:ro
      - vault-file:/vault/file
      - vault-logs:/vault/logs

    environment:
      # EN | For the CLI *inside* the container (bootstrap.sh runs there).
      # FR | Pour la CLI *dans* le conteneur (bootstrap.sh y tourne).
      VAULT_ADDR: "http://127.0.0.1:8200"

    command: ["vault", "server", "-config=/vault/config/vault.hcl"]

    # EN | sys/seal-status answers 200 even when the safe is sealed, which
    # EN | is exactly what a health check should measure here: "the
    # EN | process is up and talking", not "the safe is open". Checking
    # EN | sys/health instead would mark a correctly-sealed Vault as
    # EN | unhealthy and make restart:unless-stopped fight it.
    # FR | sys/seal-status repond 200 meme quand le coffre est scelle, et
    # FR | c est exactement ce qu un healthcheck doit mesurer ici : « le
    # FR | processus tourne et repond », pas « le coffre est ouvert ».
    # FR | Interroger sys/health marquerait un Vault correctement scelle
    # FR | comme malade et ferait lutter restart:unless-stopped contre lui.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8200/v1/sys/seal-status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vault-file:
    name: vssp-vault-file
  vault-logs:
    name: vssp-vault-logs

# ============================================================================
# Visio Sapiens — Pipeline dual-cible
#
#   BRANCHES  →  k3s (namespace homeassistant)   = STAGING / tests
#   TAGS      →  HAOS 18.1 sur mini PC via SSH   = PRODUCTION
#
# Le paquet est construit UNE SEULE FOIS et deploye tel quel sur les deux
# cibles. Seul le canal de transport differe (kubectl cp vs ssh).
#
# Aucune ancre YAML : uniquement `extends`, comprise par le schema GitLab.
#
# VARIABLES CI/CD REQUISES (Settings > CI/CD > Variables)
#   HA_SSH_KEY         type File, protegee   - cle privee vers HAOS
#   HA_TOKEN_STAGING   masquee               - jeton longue duree k3s
#   HA_TOKEN_PROD      masquee               - jeton longue duree HAOS
#   LIVEBOX_PASSWORD   masquee + protegee    - admin Livebox, ecrit dans
#                                              /config/vssp/.livebox.env par
#                                              les jobs de deploiement.
#                                              Absente = sondes Livebox
#                                              inactives, pipeline OK.
# ============================================================================

stages:
  - validate
  - build
  - deploy
  - test
  - release

variables:
  PACKAGE_NAME: visio-sapiens

  # --- Cible STAGING (k3s) -------------------------------------------------
  K3S_NAMESPACE: "homeassistant"
  K3S_CONTAINER: "homeassistant"
  STAGING_URL: "http://192.168.1.11:8123"

  # --- Cible PRODUCTION (HAOS) --------------------------------------------
  HA_HOST: "192.168.1.26"
  HA_SSH_PORT: "22222"
  HA_SSH_USER: "root"
  PROD_URL: "http://192.168.1.26:8123"
  PROD_RESTART_CORE: "true"

# ============================================================================
# WORKFLOW — quand un pipeline est-il CREE ?
#   - Merge Request                         -> pipeline STAGING (validate,
#                                              build, deploy:staging, test)
#   - Tag                                   -> pipeline PRODUCTION
#   - Push simple (fix/*, features/*, master) -> AUCUN pipeline
#
# => on peut committer autant qu'on veut sur une branche courte sans rien
#    lancer ; la chaine ne part qu'a l'ouverture (ou la mise a jour) d'une MR.
# ============================================================================
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG
    - when: never

# ============================================================================
# TEMPLATES (jobs caches, reutilises via `extends`)
# ============================================================================

# Jobs STAGING : tournent sur un push direct sur `master` OU dans une Merge
# Request. => on peut soit bosser directement sur master, soit passer par
# une branche courte (fix/*, features/*) + MR ; les deux deploient le staging.
.rules_staging:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

.rules_tag:
  rules:
    - if: $CI_COMMIT_TAG

.ssh_bootstrap:
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client curl tar jq >/dev/null
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -z "$HA_SSH_KEY" ]; then
        echo "[ERR] Variable HA_SSH_KEY absente."
        echo "      Settings > CI/CD > Variables : la creer avec le type File."
        exit 1
      fi
      if [ -f "$HA_SSH_KEY" ]; then
        cp "$HA_SSH_KEY" ~/.ssh/id_ed25519          # variable de type File
      else
        printf '%s\n' "$HA_SSH_KEY" > ~/.ssh/id_ed25519
        echo "[avert] HA_SSH_KEY n'est pas de type File - repli sur le contenu brut."
      fi
      chmod 600 ~/.ssh/id_ed25519
      if ! ssh-keygen -y -f ~/.ssh/id_ed25519 </dev/null >/dev/null 2>&1; then
        echo "[ERR] Cle privee illisible."
        echo "      Causes frequentes - type Variable au lieu de File,"
        echo "      ligne vide finale absente, ou passphrase sur la cle."
        exit 1
      fi
      echo "[OK] Cle privee valide"
    - |
      cat > ~/.ssh/config <<EOF
      Host ha
        HostName $HA_HOST
        Port $HA_SSH_PORT
        User $HA_SSH_USER
        IdentityFile ~/.ssh/id_ed25519
        StrictHostKeyChecking accept-new
        ServerAliveInterval 15
      EOF
    - chmod 600 ~/.ssh/config
    - |
      ssh ha "echo '[OK] SSH etabli' && ha core info --raw-json | jq -r '.data.version' | sed 's/^/HA Core: /'"

.smoke_test:
  image: alpine:latest
  stage: test
  script:
    - apk add --no-cache curl jq >/dev/null
    # Echec immediat et explicite si la variable de token n'existe pas
    - |
      if [ -z "$HA_TOKEN" ]; then
        echo "[ERR] Token vide."
        echo "      Cree la variable CI/CD manquante (HA_TOKEN_STAGING ou HA_TOKEN_PROD)"
        echo "      Jeton a generer dans HA : Profil > Jetons d'acces longue duree"
        exit 1
      fi
    - echo "[i] Cible ->" "$TARGET_URL"
    # Attente bornee a 60s, avec distinction reseau / authentification
    - |
      code=""
      for i in $(seq 1 12); do
        code=$(curl -s -o /tmp/resp -w '%{http_code}' -m 5 \
               -H "Authorization: Bearer $HA_TOKEN" "$TARGET_URL/api/" || echo 000)
        case "$code" in
          200) echo "[OK] API HA joignable"; break ;;
          401|403)
            echo "[ERR] HTTP $code - token refuse par Home Assistant"
            echo "      Le jeton est invalide, revoque, ou destine a l'autre instance."
            exit 1 ;;
          000) echo "[..] $TARGET_URL injoignable ($i/12)" ;;
          *)   echo "[..] HTTP $code ($i/12)" ;;
        esac
        sleep 5
      done
      if [ "$code" != "200" ]; then
        echo "[ERR] Abandon apres 60s - dernier code HTTP obtenu -> $code"
        echo "      000 = aucune reponse reseau depuis le namespace ci."
        echo "      Verifier l'URL, ou utiliser le service interne du cluster."
        exit 1
      fi
    - curl -sfI "$TARGET_URL/local/vssp/js/vssp.js" >/dev/null && echo "[OK] JS Engine servi"
    - curl -sfI "$TARGET_URL/local/vssp/css/vssp.css" >/dev/null && echo "[OK] CSS Engine servi"
    - |
      UNAVAIL=$(curl -sf -H "Authorization: Bearer $HA_TOKEN" "$TARGET_URL/api/states" \
        | jq '[.[] | select(.state=="unavailable")] | length')
      echo "[i] Entites unavailable : $UNAVAIL"

# ============================================================================
# 1. VALIDATE — branches ET tags
# ============================================================================
validate:
  stage: validate
  image: alpine:latest
  script:
    - apk add --no-cache python3 py3-yaml >/dev/null
    - echo "Validation structurelle"
    - test -d home-assistant/dashboards || { echo "[ERR] home-assistant/dashboards manquant"; exit 1; }
    - test -d home-assistant/templates  || { echo "[ERR] home-assistant/templates manquant"; exit 1; }
    - test -f themes/visio_sapiens.yaml || { echo "[ERR] themes/visio_sapiens.yaml manquant"; exit 1; }
    - test -d home-assistant/www/vssp || { echo "[ERR] www/vssp manquant"; exit 1; }
    - test -f hacs.json       || { echo "[ERR] hacs.json manquant"; exit 1; }
    - test -f repository.yaml || { echo "[ERR] repository.yaml manquant"; exit 1; }
    # Patch configuration.yaml : fragment + patcher présents dans le repo
    - test -f home-assistant/config-fragment.yaml || { echo "[ERR] home-assistant/config-fragment.yaml manquant"; exit 1; }
    - test -f vssp/vssp_apply_config.py    || { echo "[ERR] vssp/vssp_apply_config.py manquant"; exit 1; }
    - test -f vssp/vssp_ensure_packages.py || { echo "[ERR] vssp/vssp_ensure_packages.py manquant"; exit 1; }
    - test -f vssp/vssp_sanitize_resources.py || { echo "[ERR] vssp/vssp_sanitize_resources.py manquant"; exit 1; }
    - test -f vssp/vssp_lan_probe.py || { echo "[ERR] vssp/vssp_lan_probe.py manquant"; exit 1; }
    - test -f vssp/livebox.env || { echo "[ERR] vssp/livebox.env manquant"; exit 1; }
    # Le secret de la Livebox ne doit JAMAIS etre versionne
    - |
      if [ -f vssp/.livebox.env ]; then
        echo "[ERR] vssp/.livebox.env est versionne — il contient le mot de passe."
        echo "      git rm --cached vssp/.livebox.env  puis ajouter au .gitignore"
        exit 1
      fi
    # Coherence OSV_PREFIX <-> cles de dashboards du fragment (non bloquant)
    - |
      python3 - <<'PY'
      import re, yaml
      yaml.SafeLoader.add_multi_constructor('!', lambda l, s, n: None)
      with open('home-assistant/config-fragment.yaml', encoding='utf-8') as fh:
          frag = yaml.safe_load(fh) or {}
      dboards = ((frag.get('lovelace') or {}).get('dashboards') or {})
      with open('vssp/vssp_apply_config.py', encoding='utf-8') as fh:
          src = fh.read()
      m = re.search(r'^OSV_PREFIX\s*=\s*["\']([^"\']+)', src, re.M)
      prefix = m.group(1) if m else ''
      ignored = [k for k in dboards if not str(k).startswith(prefix)]
      if ignored:
          print("[AVERT] OSV_PREFIX = %r dans vssp_apply_config.py" % prefix)
          print("        Ces dashboards du fragment ne seront PAS ecrits dans")
          print("        configuration.yaml (le patcher les ignore) :")
          for k in ignored:
              print("          - %s" % k)
          print("        Corriger OSV_PREFIX, ou renommer les cles du fragment.")
      else:
          print("[OK] %d dashboard(s) du fragment couverts par OSV_PREFIX=%r"
                % (len(dboards), prefix))
      PY
    # Source unique du theme : themes/ a la racine (impose par HACS)
    - |
      if [ -d home-assistant/themes ]; then
        echo "[ERR] home-assistant/themes/ existe encore et cree une source dupliquee."
        echo "      Supprime-le : git rm -r home-assistant/themes"
        exit 1
      fi
    - |
      python3 - <<'PY'
      import sys, glob, yaml

      # Home Assistant utilise des tags YAML personnalises (!include, !secret,
      # !include_dir_merge_list...). PyYAML ne les connait pas : on les accepte
      # sans les interpreter, on ne valide ici que la syntaxe.
      def _ha_tag(loader, suffix, node):
          if isinstance(node, yaml.ScalarNode):
              return loader.construct_scalar(node)
          if isinstance(node, yaml.SequenceNode):
              return loader.construct_sequence(node)
          if isinstance(node, yaml.MappingNode):
              return loader.construct_mapping(node)
          return None
      yaml.SafeLoader.add_multi_constructor('!', _ha_tag)

      files = sorted(glob.glob('home-assistant/**/*.yaml', recursive=True))
      files += sorted(glob.glob('themes/*.yaml'))
      err = 0
      for f in files:
          try:
              with open(f, encoding='utf-8') as fh:
                  yaml.safe_load(fh)
          except Exception as e:
              print(f"[ERR] {f}"); print(f"      {e}"); err = 1
      print(f"[i] {len(files)} fichiers analyses")
      print("[OK] Syntaxe YAML valide" if not err else "[ERR] Erreurs de syntaxe")
      sys.exit(err)
      PY

# ============================================================================
# 2. BUILD — paquet unique, structure identique a /config
# ============================================================================
build:
  stage: build
  image: alpine:latest
  script:
    - apk add --no-cache python3 py3-yaml >/dev/null
    - export OSV_VERSION="${CI_COMMIT_TAG:-dev-${CI_COMMIT_SHORT_SHA}}"
    - echo "Build $OSV_VERSION"
    - mkdir -p dist/dashboards/templates dist/themes dist/www
    - cp -r home-assistant/dashboards/.  dist/dashboards/
    - cp -r home-assistant/templates/.   dist/dashboards/templates/
    - cp -r themes/.                     dist/themes/
    - cp -r home-assistant/www/.         dist/www/
    # Packages HA multi-domaines (template, utility_meter...) charges via
    # `homeassistant: packages: !include_dir_named packages` du fragment.
    - mkdir -p dist/packages
    - cp -r home-assistant/packages/.    dist/packages/
    # Patch configuration.yaml : fragment (a la racine de /config) + patcher
    - cp home-assistant/config-fragment.yaml dist/config-fragment.yaml
    - mkdir -p dist/vssp
    - cp vssp/vssp_apply_config.py dist/vssp/
    - cp vssp/vssp_ensure_packages.py dist/vssp/
    - cp vssp/vssp_sanitize_resources.py dist/vssp/
    # Sonde LAN du local technique + ses reglages NON SECRETS
    - cp vssp/vssp_lan_probe.py          dist/vssp/
    - cp vssp/livebox.env                dist/vssp/
    # Cache-busting automatique des ressources Lovelace
    # NB : on EXCLUT config-fragment.yaml — il utilise le placeholder __VTOKEN__
    #      remplace au moment du "apply" via --vtoken (et non ?v=X).
    - export VTOKEN=$(echo "$OSV_VERSION" | tr -c 'a-zA-Z0-9._-' '-')
    - find dist -name '*.yaml' ! -name 'config-fragment.yaml' -exec sed -i "s|\(/local/vssp/[^ \"']*\)?v=[0-9A-Za-z._-]*|\1?v=${VTOKEN}|g" {} +
    - echo "Ressources taguees ?v=${VTOKEN}"
    - |
      cat > dist/VSSP_VERSION <<EOF
      version=$OSV_VERSION
      commit=$CI_COMMIT_SHA
      ref=$CI_COMMIT_REF_NAME
      pipeline=$CI_PIPELINE_ID
      built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      EOF
    - |
      cd dist && python3 - <<'PY'
      import sys, os, glob, yaml

      # Verifie que chaque !include pointe vers une cible existante, dans
      # l'arborescence telle qu'elle sera dans /config (et non dans le depot).
      missing = []
      DIR_TAGS = ('include_dir_list', 'include_dir_merge_list',
                  'include_dir_named', 'include_dir_merge_named')

      def _ha_tag(loader, suffix, node):
          if isinstance(node, yaml.ScalarNode):
              val = loader.construct_scalar(node)
              src = getattr(loader, 'name', '') or '.'
              base = os.path.dirname(src)
              if suffix == 'include' and not os.path.isfile(os.path.join(base, val)):
                  missing.append((src, '!include', val))
              elif suffix in DIR_TAGS and not os.path.isdir(os.path.join(base, val)):
                  missing.append((src, '!' + suffix, val))
              return val
          if isinstance(node, yaml.SequenceNode):
              return loader.construct_sequence(node)
          if isinstance(node, yaml.MappingNode):
              return loader.construct_mapping(node)
          return None
      yaml.SafeLoader.add_multi_constructor('!', _ha_tag)

      for f in sorted(glob.glob('**/*.yaml', recursive=True)):
          with open(f, encoding='utf-8') as fh:
              yaml.safe_load(fh)

      for src, tag, val in missing:
          print(f"[ERR] {src}"); print(f"      {tag} {val} -> cible introuvable dans /config")
      print("[OK] Toutes les references !include sont resolues"
            if not missing else f"[ERR] {len(missing)} reference(s) cassee(s)")
      sys.exit(1 if missing else 0)
      PY
    - cd "$CI_PROJECT_DIR"
    - tar -czf $PACKAGE_NAME.tar.gz -C dist .
    - echo "$OSV_VERSION" > .osv_version
    - ls -lh $PACKAGE_NAME.tar.gz
  artifacts:
    name: "$PACKAGE_NAME-$CI_COMMIT_REF_SLUG"
    expire_in: 30 days
    paths:
      - $PACKAGE_NAME.tar.gz
      - .osv_version

# ============================================================================
# 2bis. PACKAGE HACS — distribution publique, sur tags uniquement
# ============================================================================
package:hacs:
  extends: .rules_tag
  stage: build
  image: alpine:latest
  script:
    - echo "Paquet HACS $CI_COMMIT_TAG"
    - mkdir -p dist
    - cp -r themes dist/
    - cp hacs.json repository.yaml README.md dist/
    - cp CHANGELOG.md dist/ 2>/dev/null || echo "[avert] CHANGELOG.md absent"
    - echo "$CI_COMMIT_TAG" > dist/VERSION
    - tar -czf $PACKAGE_NAME-hacs-$CI_COMMIT_TAG.tar.gz -C dist .
  artifacts:
    name: "$PACKAGE_NAME-hacs-$CI_COMMIT_TAG"
    expire_in: never
    paths:
      - dist/
      - $PACKAGE_NAME-hacs-$CI_COMMIT_TAG.tar.gz

# ============================================================================
# 3a. DEPLOY STAGING — k3s, sur branches uniquement
# ============================================================================
deploy:staging:
  extends: .rules_staging
  stage: deploy
  image: bitnami/kubectl:latest
  needs: ["build"]
  environment:
    name: staging
    url: $STAGING_URL
  script:
    - export OSV_VERSION=$(cat .osv_version)
    - echo "Deploiement STAGING (k3s) — $OSV_VERSION"
    - export HA_POD=$(kubectl get pod -n $K3S_NAMESPACE -l app=homeassistant -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
    - '[ -z "$HA_POD" ] && export HA_POD=$(kubectl get pods -n $K3S_NAMESPACE -o jsonpath="{.items[0].metadata.name}")'
    - echo "Pod cible ->" "$HA_POD"
    - kubectl cp $PACKAGE_NAME.tar.gz $K3S_NAMESPACE/$HA_POD:/config/.osv.tar.gz -c $K3S_CONTAINER
    - |
      kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- sh -c '
        set -e
        rm -rf /config/.osv_stage && mkdir -p /config/.osv_stage
        tar xzf /config/.osv.tar.gz -C /config/.osv_stage
        for d in dashboards themes; do
          rm -rf /config/$d.old
          [ -d /config/$d ] && mv /config/$d /config/$d.old
          mv /config/.osv_stage/$d /config/$d
        done
        rm -rf /config/www/vssp
        mkdir -p /config/www
        mv /config/.osv_stage/www/vssp /config/www/vssp
        cp /config/.osv_stage/OSVISION_VERSION /config/OSVISION_VERSION
        # Deployer le patcher + le fragment a leur emplacement /config
        mkdir -p /config/vssp
        cp /config/.osv_stage/vssp/vssp_apply_config.py /config/vssp/
        cp /config/.osv_stage/vssp/vssp_ensure_packages.py /config/vssp/
        cp /config/.osv_stage/vssp/vssp_sanitize_resources.py /config/vssp/
        cp /config/.osv_stage/config-fragment.yaml /config/config-fragment.yaml
        cp /config/.osv_stage/vssp/vssp_lan_probe.py /config/vssp/
        cp /config/.osv_stage/vssp/livebox.env      /config/vssp/
        chmod +x /config/vssp/vssp_lan_probe.py
        # Packages (additif : n ecrase pas d eventuels packages non-vssp)
        mkdir -p /config/packages
        cp -r /config/.osv_stage/packages/. /config/packages/
      '
    # --- SECRET Livebox : ecrit depuis la variable CI/CD masquee ---
    # Le mot de passe passe en ARGUMENT du shell distant ($1), jamais dans
    # la chaine de commande : pas de fuite via `ps` ni via les logs.
    - |
      if [ -z "$LIVEBOX_PASSWORD" ]; then
        echo "[avert] LIVEBOX_PASSWORD absente — sondes Livebox inactives."
        echo "        Les panneaux Livebox/commutateur afficheront leurs"
        echo "        valeurs de demonstration. Settings > CI/CD > Variables."
      else
        kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- sh -c \
          'umask 077; printf "LIVEBOX_PASSWORD=%s\n" "$1" > /config/vssp/.livebox.env' \
          sh "$LIVEBOX_PASSWORD"
        echo "[OK] Secret Livebox deploye"
      fi
    # --- PATCH configuration.yaml (idempotent, avec backup .bak) ---
    - |
      kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- sh -c '
        set -e
        pip install ruamel.yaml --quiet 2>/dev/null || pip install ruamel.yaml --quiet --break-system-packages 2>/dev/null
        python3 /config/vssp/vssp_apply_config.py \
          --config   /config/configuration.yaml \
          --fragment /config/config-fragment.yaml \
          --vtoken   "'"$OSV_VERSION"'"
        # Le patcher ne gere pas le domaine homeassistant : ce script pose
        # (idempotent) la cle packages qui charge /config/packages/
        python3 /config/vssp/vssp_ensure_packages.py \
          --config /config/configuration.yaml
        # Le patcher dedupe les ressources par URL complete : le ?v= changeant
        # a chaque build, chaque deploiement AJOUTAIT 6 entrees. On assainit.
        python3 /config/vssp/vssp_sanitize_resources.py \
          --config /config/configuration.yaml
      '
    - |
      if ! kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- hass --script check_config -c /config; then
        echo "[ERR] Config invalide — rollback staging"
        kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- sh -c '
          for d in dashboards themes; do
            [ -d /config/$d.old ] && rm -rf /config/$d && mv /config/$d.old /config/$d
          done
          # Restaurer configuration.yaml depuis le dernier backup .bak
          LAST_BAK=$(ls -t /config/backups/configuration_*.bak 2>/dev/null | head -1)
          [ -n "$LAST_BAK" ] && cp "$LAST_BAK" /config/configuration.yaml && echo "[rollback] configuration.yaml restaure depuis $LAST_BAK"'
        exit 1
      fi
    - kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- sh -c 'rm -rf /config/dashboards.old /config/themes.old /config/.osv_stage /config/.osv.tar.gz'
    # --- REDEMARRAGE DE HOME ASSISTANT — ETAPE INDISPENSABLE ---
    # configuration.yaml n'est relu qu'au demarrage : les dashboards
    # (lovelace.dashboards) et les packages ne sont PAS pris en compte a
    # chaud. Sans cette etape, le job finissait en vert alors que
    # l'instance continuait a servir l'ancienne configuration — les
    # nouveautes n'apparaissaient qu'au prochain redemarrage fortuit du
    # pod. La production faisait deja un `ha core restart`, pas le staging.
    #
    # Voie normale : service homeassistant.restart via l'API REST.
    # Repli : recreation du pod (fonctionne pour Deployment et StatefulSet).
    - |
      code=000
      if [ -n "$HA_TOKEN_STAGING" ] && command -v curl >/dev/null 2>&1; then
        code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 -X POST \
          -H "Authorization: Bearer $HA_TOKEN_STAGING" \
          -H "Content-Type: application/json" \
          "$STAGING_URL/api/services/homeassistant/restart" || echo 000)
        echo "[i] homeassistant.restart -> HTTP $code"
      else
        echo "[i] HA_TOKEN_STAGING absente ou curl indisponible"
      fi
      if [ "$code" != "200" ]; then
        echo "[i] Repli : recreation du pod $HA_POD"
        kubectl delete pod -n $K3S_NAMESPACE $HA_POD --wait=false
        kubectl wait --for=delete pod/$HA_POD -n $K3S_NAMESPACE --timeout=120s || true
        kubectl wait --for=condition=ready pod -n $K3S_NAMESPACE \
          -l app=homeassistant --timeout=300s || true
      fi
    # Attente du retour de l'API : evite que test:staging echoue sur une
    # instance encore en cours de demarrage.
    - |
      if command -v curl >/dev/null 2>&1 && [ -n "$HA_TOKEN_STAGING" ]; then
        for i in $(seq 1 36); do
          c=$(curl -s -o /dev/null -w '%{http_code}' -m 5 \
              -H "Authorization: Bearer $HA_TOKEN_STAGING" "$STAGING_URL/api/" || echo 000)
          [ "$c" = "200" ] && echo "[OK] HA redemarre et joignable" && break
          echo "[..] Attente du redemarrage ($i/36) - HTTP $c"
          sleep 5
        done
      else
        sleep 45
      fi
    # Trace de verification : ce que HA a REELLEMENT charge
    - |
      echo "[i] Version deployee dans le conteneur :"
      kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- \
        cat /config/OSVISION_VERSION 2>/dev/null || echo "  (pod recree, fichier lisible au prochain job)"
    - echo "[OK] Staging a jour"

# ============================================================================
# 3b. DEPLOY PRODUCTION — HAOS 18.1, tags uniquement, gate manuelle
# ============================================================================
deploy:production:
  extends: .ssh_bootstrap
  stage: deploy
  needs: ["build"]
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  allow_failure: false
  environment:
    name: production
    url: $PROD_URL
  script:
    - echo "Deploiement PRODUCTION (HAOS) — $CI_COMMIT_TAG"
    - export HA_CFG=$(ssh ha '[ -d /homeassistant ] && echo /homeassistant || echo /config')
    - echo "Config HAOS ->" "$HA_CFG"
    - ssh ha "ha backups new --name 'pre-$CI_COMMIT_TAG' --no-progress" || echo "[avert] backup non cree"
    - cat $PACKAGE_NAME.tar.gz | ssh ha "rm -rf $HA_CFG/.osv_stage && mkdir -p $HA_CFG/.osv_stage && tar xzf - -C $HA_CFG/.osv_stage"
    - |
      ssh ha "set -e
        for d in dashboards themes; do
          rm -rf $HA_CFG/\$d.old
          [ -d $HA_CFG/\$d ] && mv $HA_CFG/\$d $HA_CFG/\$d.old
          mv $HA_CFG/.osv_stage/\$d $HA_CFG/\$d
        done
        rm -rf $HA_CFG/www/vssp
        mkdir -p $HA_CFG/www
        mv $HA_CFG/.osv_stage/www/vssp $HA_CFG/www/vssp
        cp $HA_CFG/.osv_stage/OSVISION_VERSION $HA_CFG/OSVISION_VERSION
        # Deployer patcher + fragment a leur emplacement /config
        mkdir -p $HA_CFG/vssp
        cp $HA_CFG/.osv_stage/vssp/vssp_apply_config.py $HA_CFG/vssp/
        cp $HA_CFG/.osv_stage/vssp/vssp_ensure_packages.py $HA_CFG/vssp/
        cp $HA_CFG/.osv_stage/vssp/vssp_sanitize_resources.py $HA_CFG/vssp/
        # Sonde LAN : executee par HA lui-meme via les capteurs command_line,
        # elle DOIT donc exister cote HAOS (les patchers, eux, tournent dans
        # le runner). Sans ce cp, les capteurs Livebox restent unavailable.
        cp $HA_CFG/.osv_stage/vssp/vssp_lan_probe.py $HA_CFG/vssp/
        cp $HA_CFG/.osv_stage/vssp/livebox.env $HA_CFG/vssp/
        chmod +x $HA_CFG/vssp/vssp_lan_probe.py
        cp $HA_CFG/.osv_stage/config-fragment.yaml $HA_CFG/config-fragment.yaml
        # Packages (additif : n ecrase pas d eventuels packages non-vssp)
        mkdir -p $HA_CFG/packages
        cp -r $HA_CFG/.osv_stage/packages/. $HA_CFG/packages/
        rm -rf $HA_CFG/.osv_stage"
    # --- SECRET Livebox : transmis par STDIN, jamais sur la ligne de
    #     commande distante (invisible dans `ps` cote HAOS).
    - |
      if [ -z "$LIVEBOX_PASSWORD" ]; then
        echo "[avert] LIVEBOX_PASSWORD absente — sondes Livebox inactives."
      else
        printf 'LIVEBOX_PASSWORD=%s\n' "$LIVEBOX_PASSWORD" \
          | ssh ha "umask 077; cat > $HA_CFG/vssp/.livebox.env"
        echo "[OK] Secret Livebox deploye"
      fi
    # --- PATCH configuration.yaml : execute dans le RUNNER (ruamel dispo),
    #     puis renvoye par scp. Plus fiable que d'installer ruamel dans HAOS.
    #     Le "ha backups new pre-$CI_COMMIT_TAG" ci-dessus couvre deja le
    #     rollback complet ; le patcher cree en plus un .bak cote runner.
    - apk add --no-cache python3 py3-pip >/dev/null
    - pip install ruamel.yaml --quiet --break-system-packages 2>/dev/null || pip install ruamel.yaml --quiet
    # Le build n'expose que le .tar.gz : on extrait patcher + fragment dans le runner
    - rm -rf /tmp/osv_pkg && mkdir -p /tmp/osv_pkg && tar xzf $PACKAGE_NAME.tar.gz -C /tmp/osv_pkg
    - scp ha:$HA_CFG/configuration.yaml /tmp/prod_configuration.yaml
    - cp /tmp/prod_configuration.yaml /tmp/prod_configuration.yaml.pre   # filet local
    - |
      python3 /tmp/osv_pkg/vssp/vssp_apply_config.py \
        --config   /tmp/prod_configuration.yaml \
        --fragment /tmp/osv_pkg/config-fragment.yaml \
        --vtoken   "$CI_COMMIT_TAG" || { echo "[ERR] patch configuration.yaml echoue"; exit 1; }
    # Le patcher ne gere pas le domaine homeassistant : poser la cle packages
    - |
      python3 /tmp/osv_pkg/vssp/vssp_ensure_packages.py \
        --config /tmp/prod_configuration.yaml || { echo "[ERR] ensure packages echoue"; exit 1; }
    # Dedup des ressources Lovelace (le patcher accumule les ?v= successifs)
    - |
      python3 /tmp/osv_pkg/vssp/vssp_sanitize_resources.py \
        --config /tmp/prod_configuration.yaml || { echo "[ERR] sanitize resources echoue"; exit 1; }
    - scp /tmp/prod_configuration.yaml ha:$HA_CFG/configuration.yaml
    - |
      if ! ssh ha "ha core check"; then
        echo "[ERR] Config invalide — rollback production"
        ssh ha "for d in dashboards themes; do
          [ -d $HA_CFG/\$d.old ] && rm -rf $HA_CFG/\$d && mv $HA_CFG/\$d.old $HA_CFG/\$d
        done"
        # Restaurer le configuration.yaml d'avant patch
        scp /tmp/prod_configuration.yaml.pre ha:$HA_CFG/configuration.yaml && echo "[rollback] configuration.yaml restaure (pre-patch)"
        exit 1
      fi
    - |
      if [ "$PROD_RESTART_CORE" = "true" ]; then
        ssh ha "ha core restart"
      else
        ssh ha "ha core reload"
      fi
    - ssh ha "rm -rf $HA_CFG/dashboards.old $HA_CFG/themes.old"
    - echo "[OK] $CI_COMMIT_TAG en production"

# ============================================================================
# 4. TESTS DE FUMEE
# ============================================================================
test:staging:
  extends:
    - .smoke_test
    - .rules_staging
  needs: ["deploy:staging"]
  variables:
    TARGET_URL: $STAGING_URL
    HA_TOKEN: $HA_TOKEN_STAGING

test:production:
  extends:
    - .smoke_test
    - .rules_tag
  needs: ["deploy:production"]
  variables:
    TARGET_URL: $PROD_URL
    HA_TOKEN: $HA_TOKEN_PROD

# ============================================================================
# 5. ROLLBACK PRODUCTION — manuel
# ============================================================================
rollback:production:
  extends: .ssh_bootstrap
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  allow_failure: true
  environment:
    name: production
    url: $PROD_URL
  script:
    - echo "Restauration de la sauvegarde pre-$CI_COMMIT_TAG"
    - |
      SLUG=$(ssh ha "ha backups --raw-json" \
        | jq -r ".data.backups[] | select(.name==\"pre-$CI_COMMIT_TAG\") | .slug" | head -1)
      if [ -z "$SLUG" ]; then echo "[ERR] Sauvegarde introuvable"; ssh ha "ha backups"; exit 1; fi
      echo "Slug : $SLUG"
      ssh ha "ha backups restore $SLUG --no-progress"
    - echo "[OK] Rollback effectue"

# ============================================================================
# 6. RELEASE GitLab
# ============================================================================
release:
  extends: .rules_tag
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["deploy:production", "package:hacs"]
  script:
    - echo "Release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Visio Sapiens $CI_COMMIT_TAG"
    description: "Deploye sur HAOS — commit $CI_COMMIT_SHA"

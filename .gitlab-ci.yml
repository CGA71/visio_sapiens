stages:
  - validate
  - build
  - deploy

variables:
  HA_NAMESPACE: home-assistant
  HA_POD: home-assistant-0
  HA_CONTAINER: home-assistant

# =========================
# VALIDATION
# =========================
validate:
  stage: validate
  image: alpine:latest
  script:
    - echo "🔍 Validate OSVision structure"
    - test -d home-assistant
    - test -d kubernetes
    - test -d scripts
    - echo "OK"

# =========================
# BUILD
# =========================
build:
  stage: build
  image: alpine:latest
  script:
    - apk add --no-cache tar
    - mkdir -p build
    - cp -r home-assistant build/
    - tar -czf osvision-v2.tar.gz -C build .
  artifacts:
    paths:
      - osvision-v2.tar.gz

# =========================
# DEPLOY
# =========================
deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "🚀 Deploy OSVision V2 to Home Assistant"

    # copy artifact
    - kubectl -n $HA_NAMESPACE cp osvision-v2.tar.gz $HA_POD:/config/osvision-v2.tar.gz -c $HA_CONTAINER

    # extract
    - kubectl -n $HA_NAMESPACE exec $HA_POD -c $HA_CONTAINER -- tar -xzf /config/osvision-v2.tar.gz -C /config/

    # reload HA
    - kubectl -n $HA_NAMESPACE exec $HA_POD -c $HA_CONTAINER -- ha core reload
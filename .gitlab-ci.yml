stages:
  - validate
  - build
  - deploy

variables:
  HA_NAMESPACE: homeassistant   # <--- Corrigé (sans tiret)
  HA_CONTAINER: homeassistant

# =========================
# 1. VALIDATION
# =========================
validate:
  stage: validate
  image: alpine:latest
  script:
    - echo "🔍 Checking OSVision V2 structure..."
    - test -d home-assistant/themes
    - test -d home-assistant/www
    - test -d home-assistant/dashboards
    - echo "✅ Structure OK"

# =========================
# 2. BUILD PACKAGE
# =========================
build:
  stage: build
  image: alpine:latest
  script:
    - echo "📦 Preparing OSVision V2 package..."
    - mkdir -p build
    - cp -r home-assistant/* build/
    - tar -czf osvision-v2.tar.gz -C build .
  artifacts:
    paths:
      - osvision-v2.tar.gz

# =========================
# 3. DEPLOY TO KUBERNETES
# =========================
deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "🔍 Resolving Home Assistant Pod Name..."
    # On récupère dynamiquement le nom du pod qui tourne dans le namespace
    - HA_POD=$(kubectl -n $HA_NAMESPACE get pods -l app.kubernetes.io/name=homeassistant -o jsonpath='{.items[0].metadata.name}')
    - echo "🎯 Target pod found -> $HA_POD"

    - echo "🚀 Deploying to Kubernetes Home Assistant..."
    # copy package into pod
    - kubectl -n $HA_NAMESPACE cp osvision-v2.tar.gz $HA_POD:/config/osvision-v2.tar.gz -c $HA_CONTAINER

    # extract inside container
    - kubectl -n $HA_NAMESPACE exec $HA_POD -c $HA_CONTAINER -- tar -xzf /config/osvision-v2.tar.gz -C /config/

    # restart home assistant (safe reload)
    - kubectl -n $HA_NAMESPACE exec $HA_POD -c $HA_CONTAINER -- ha core reload

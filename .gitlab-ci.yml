stages:
  - validate
  - build
  - deploy
  - package
  - release

variables:
  PACKAGE_NAME: osvision-v2

# =========================
# VALIDATE (TOUJOURS)
# =========================
validate:
  stage: validate
  image: alpine:latest
  script:
    script:
    - echo "🔍 Validation de OSVision V2"
    - test -d themes || (echo "❌ Erreur : Le dossier 'themes' est obligatoire !" && exit 1)
    - test -d home-assistant/themes || (echo "❌ Erreur : Le dossier 'home-assistant/themes' est obligatoire !" && exit 1)
    - test -d home-assistant/dashboards
    - test -f themes/osvision_v2.yaml
    - test -f hacs.json
    - test -f repository.yaml
    - echo "✅ OK"

# =========================
# BUILD (BRANCH ONLY)
# =========================
build:
  stage: build
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG == null
  script:
    - echo "📦 Build dev package"
    - mkdir -p build
    - cp -r home-assistant/* build/
    - tar -czf $PACKAGE_NAME.tar.gz -C build .
  artifacts:
    paths:
      - $PACKAGE_NAME.tar.gz

# =========================
# DEPLOY (BRANCH ONLY)
# =========================
deploy:
  stage: deploy
  image: bitnami/kubectl:latest

  rules:
    - if: '$CI_COMMIT_TAG == null'

  script:
    - echo "🚀 Deploying OSVision V2 to Home Assistant..."

    # Recherche automatiquement le pod Home Assistant
    - export HA_POD=$(kubectl get pod -n homeassistant -l app=homeassistant -o jsonpath='{.items[0].metadata.name}')

    # Si aucun label n'existe, on utilise le premier pod trouvé
    - |
      if [ -z "$HA_POD" ]; then
        HA_POD=$(kubectl get pods -n homeassistant -o jsonpath='{.items[0].metadata.name}')
      fi

    - "echo Home Assistant Pod : $HA_POD"

    # Nettoyage de l'ancien contenu
    - kubectl exec -n homeassistant $HA_POD -c homeassistant -- rm -rf /config/dashboards
    - kubectl exec -n homeassistant $HA_POD -c homeassistant -- rm -rf /config/themes
    - kubectl exec -n homeassistant $HA_POD -c homeassistant -- mkdir -p /config/dashboards
    - kubectl exec -n homeassistant $HA_POD -c homeassistant -- mkdir -p /config/themes

    # Copie des dashboards
    - kubectl cp home-assistant/dashboards homeassistant/$HA_POD:/config/ -c homeassistant

    # Copie des thèmes
    - kubectl cp home-assistant/themes homeassistant/$HA_POD:/config/ -c homeassistant

    # Copie des ressources web
    - kubectl cp home-assistant/www homeassistant/$HA_POD:/config/ -c homeassistant

    # Vérification de la configuration
    - kubectl exec -n homeassistant $HA_POD -c homeassistant -- hass --script check_config -c /config

    - echo "✅ Deployment finished"

# =========================
# PACKAGE (TAG ONLY)
# =========================
package:
  stage: package
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "📦 Packaging release version $CI_COMMIT_TAG"

    - mkdir -p dist
    - cp -r themes dist/
    - cp hacs.json dist/
    - cp repository.yaml dist/
    - cp README.md dist/
    - cp CHANGELOG.md dist/
    - cp VERSION dist/

#    - tar -czf $PACKAGE_NAME-$CI_COMMIT_TAG.tar.gz -C dist .
  artifacts:
    paths:
#     - $PACKAGE_NAME-$CI_COMMIT_TAG.tar.gz
      - dist/
# =========================
# RELEASE (TAG ONLY)
# =========================
release:
  stage: release
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG

  script:
    - echo "🚀 Creating release for tag $CI_COMMIT_TAG"
    - 'echo "Version: $CI_COMMIT_TAG" > release.txt'
    - echo "OSVision V2 Release created"
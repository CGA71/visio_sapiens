# ============================================================================
# Visio Sapiens — Dual-target pipeline
#
# EN |   BRANCHES  ->  k3s (namespace homeassistant)   = STAGING / tests
# EN |   TAGS      ->  HAOS 18.1 on a mini PC over SSH = PRODUCTION
# FR |   BRANCHES  ->  k3s (namespace homeassistant)   = STAGING / tests
# FR |   TAGS      ->  HAOS 18.1 sur mini PC via SSH   = PRODUCTION
#
# EN | The package is built ONCE and deployed as-is to both targets. Only the
# EN | transport channel differs (kubectl cp vs ssh).
# FR | Le paquet est construit UNE SEULE FOIS et deploye tel quel sur les deux
# FR | cibles. Seul le canal de transport differe (kubectl cp vs ssh).
#
# EN | No YAML anchors: only `extends`, which the GitLab schema understands.
# FR | Aucune ancre YAML : uniquement `extends`, comprise par le schema GitLab.
#
# EN | Job log messages stay in English on purpose. CI output is developer-
# EN | facing, is read in a terminal, and is the first thing pasted into an
# EN | issue or a search engine — it is not part of the localized product.
# EN | Only the strings that reach a Home Assistant screen are translated,
# EN | through home-assistant/dashboards/locales/.
# FR | Les messages de log des jobs restent en anglais volontairement. La
# FR | sortie CI s'adresse au developpeur, se lit dans un terminal, et c'est
# FR | la premiere chose collee dans un ticket ou un moteur de recherche —
# FR | elle ne fait pas partie du produit localise. Seules les chaines qui
# FR | atteignent un ecran Home Assistant sont traduites, via
# FR | home-assistant/dashboards/locales/.
#
# EN | REQUIRED CI/CD VARIABLES (Settings > CI/CD > Variables)
# FR | VARIABLES CI/CD REQUISES (Settings > CI/CD > Variables)
#   HA_SSH_KEY         File type, protected  - private key to HAOS
#   HA_TOKEN_STAGING   masked                - long-lived token, k3s
#   HA_TOKEN_PROD      masked                - long-lived token, HAOS
#   LIVEBOX_PASSWORD   masked + protected    - router admin password, written
#                                              to /config/vssp/.livebox.env by
#                                              the deploy jobs. Absent = router
#                                              probes inactive, pipeline still OK.
#   VAULT_MAINT_TOKEN  masked + protected    - Vault token carrying the
#                                              vssp-maint policy, written to
#                                              /config/vssp/.vault_maint_token
#                                              by the deploy jobs. It is what
#                                              lets the UPDATES screen see the
#                                              host, k3s, GitLab and the
#                                              runner. Absent = the
#                                              INFRASTRUCTURE family reports
#                                              "never probed", pipeline still
#                                              OK. See docs/platform/Vault.md.
# ============================================================================

stages:
  - validate
  - build
  # EN | preflight sits between building a version and deploying it, and it
  # EN | asks the TARGET, not the code: can this instance host the control
  # EN | centre? A release that lands on an instance without HACS or without
  # EN | button-card draws a blank screen and reports a green pipeline, and
  # EN | the person in front of it concludes the version is broken. It is
  # EN | not - the ground was not prepared. When it refuses, the prepare job
  # EN | of the same stage prepares what can be prepared and names the rest.
  # FR | preflight se place entre la construction d une version et son
  # FR | deploiement, et il interroge la CIBLE, pas le code : cette instance
  # FR | peut-elle heberger le centre de controle ? Une livraison qui
  # FR | atterrit sur une instance sans HACS ou sans button-card dessine un
  # FR | ecran blanc et annonce un pipeline vert, et la personne devant
  # FR | conclut que la version est cassee. Elle ne l est pas - le terrain
  # FR | n etait pas pret. Quand il refuse, le job prepare du meme etage
  # FR | prepare ce qui peut l etre et nomme le reste.
  - preflight
  - deploy
  - test
  - release

variables:
  PACKAGE_NAME: visio-sapiens

  # --- EN | Interface language of the generated deliverable ----------------
  # --- FR | Langue d'interface du livrable genere ---------------------------
  # EN | English is the default and the source of truth. Set this to `fr` (in
  # EN | Settings > CI/CD > Variables, or per-pipeline when running manually)
  # EN | to build a French deliverable. Any locale file present in
  # EN | home-assistant/dashboards/locales/ is a valid value.
  # FR | L'anglais est la valeur par defaut et la source de verite. Passer a
  # FR | `fr` (dans Settings > CI/CD > Variables, ou au lancement manuel d'un
  # FR | pipeline) pour construire un livrable francais. Toute langue presente
  # FR | dans home-assistant/dashboards/locales/ est une valeur valide.
  VSSP_LOCALE: "en"

  # --- EN | STAGING target (k3s) / FR | Cible STAGING (k3s) ----------------
  K3S_NAMESPACE: "homeassistant"
  K3S_CONTAINER: "homeassistant"
  STAGING_URL: "http://192.168.1.11:8123"

  # --- EN | PRODUCTION target (HAOS) / FR | Cible PRODUCTION (HAOS) --------
  HA_HOST: "192.168.1.26"
  HA_SSH_PORT: "22222"
  HA_SSH_USER: "root"
  PROD_URL: "http://192.168.1.26:8123"
  PROD_RESTART_CORE: "true"

# ============================================================================
# WORKFLOW
# EN | When is a pipeline CREATED?
# EN |   - Merge Request                            -> STAGING pipeline
# EN |                                                 (validate, build,
# EN |                                                  deploy:staging, test)
# EN |   - Tag                                      -> PRODUCTION pipeline
# EN |   - Plain push (fix/*, features/*, master)   -> NO pipeline
# EN | => you can commit as much as you want on a short-lived branch without
# EN |    triggering anything; the chain only starts when an MR is opened
# EN |    (or updated).
# FR | Quand un pipeline est-il CREE ?
# FR |   - Merge Request                            -> pipeline STAGING
# FR |   - Tag                                      -> pipeline PRODUCTION
# FR |   - Push simple (fix/*, features/*, master)  -> AUCUN pipeline
# FR | => on peut committer autant qu'on veut sur une branche courte sans rien
# FR |    lancer ; la chaine ne part qu'a l'ouverture (ou la mise a jour)
# FR |    d'une MR.
# ============================================================================
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG
    - when: never

# ============================================================================
# EN | TEMPLATES (hidden jobs, reused through `extends`)
# FR | TEMPLATES (jobs caches, reutilises via `extends`)
# ============================================================================

# EN | STAGING jobs: run on a direct push to `master` OR inside a Merge
# EN | Request. => you can either work directly on master, or go through a
# EN | short-lived branch (fix/*, features/*) + MR; both deploy to staging.
# FR | Jobs STAGING : tournent sur un push direct sur `master` OU dans une
# FR | Merge Request. => on peut soit bosser directement sur master, soit
# FR | passer par une branche courte (fix/*, features/*) + MR ; les deux
# FR | deploient le staging.
.rules_staging:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

.rules_tag:
  rules:
    - if: $CI_COMMIT_TAG

.ssh_bootstrap:
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client curl tar jq >/dev/null
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      # EN | A job cannot override a project variable by redefining it
      # EN | under variables:. GitLab ranks project settings ABOVE anything
      # EN | written in .gitlab-ci.yml, so deploy:staging-haos setting
      # EN |   HA_SSH_KEY: $HAOS_SSH_KEY
      # EN | was ignored in silence: the job received the production key,
      # EN | announced "[OK] Private key is valid" - a valid key, simply not
      # EN | the right one - and the appliance answered
      # EN | "Permission denied (publickey)". Hence a separate name, which no
      # EN | project variable claims.
      # FR | Un job ne peut pas supplanter une variable de projet en la
      # FR | redefinissant sous variables:. GitLab classe les reglages du
      # FR | projet AU-DESSUS de tout ce qui est ecrit dans .gitlab-ci.yml,
      # FR | si bien que deploy:staging-haos posant
      # FR |   HA_SSH_KEY: $HAOS_SSH_KEY
      # FR | etait ignore en silence : le job recevait la cle de production,
      # FR | annoncait "[OK] Private key is valid" - une cle valide, mais pas
      # FR | la bonne - et l appareil repondait
      # FR | "Permission denied (publickey)". D ou un nom distinct, qu aucune
      # FR | variable de projet ne revendique.
      SSH_KEY_REF="${HA_SSH_KEY_OVERRIDE:-$HA_SSH_KEY}"
      if [ -z "$SSH_KEY_REF" ]; then
        echo "[ERR] HA_SSH_KEY variable is missing."
        echo "      Settings > CI/CD > Variables: create it with the File type."
        exit 1
      fi
      # EN | tr, not cp. A key pasted into the GitLab form from a Windows
      # EN | clipboard arrives with CRLF line endings, and openssh rejects
      # EN | it outright - "Private key is unreadable", with nothing to say
      # EN | which of the usual causes it was. A missing trailing newline
      # EN | fails the same way, so both are repaired here rather than
      # EN | diagnosed. Harmless to a key that had neither problem.
      # FR | tr, et non cp. Une cle collee dans le formulaire GitLab depuis
      # FR | un presse-papiers Windows arrive avec des fins de ligne CRLF, et
      # FR | openssh la rejette sans appel - "Private key is unreadable",
      # FR | sans dire laquelle des causes habituelles. Un saut de ligne
      # FR | final manquant echoue de la meme facon : les deux sont donc
      # FR | reparees ici plutot que diagnostiquees. Sans effet sur une cle
      # FR | qui n avait ni l un ni l autre.
      if [ -f "$SSH_KEY_REF" ]; then
        # EN | File-type variable / FR | variable de type File
        tr -d '\r' < "$SSH_KEY_REF" > ~/.ssh/id_ed25519
      else
        printf '%s\n' "$SSH_KEY_REF" > ~/.ssh/id_ed25519
        echo "[warn] the key is not a File-type variable - falling back to raw content."
      fi
      if [ -n "$(tail -c 1 ~/.ssh/id_ed25519)" ]; then
        echo >> ~/.ssh/id_ed25519
      fi
      # EN | A value pasted into the GitLab variable form can arrive with
      # EN | its line breaks gone - header, base64 body and footer welded
      # EN | into one line. openssh refuses that, so fold it back: the
      # EN | markers are fixed strings and the body is base64, which means
      # EN | the reconstruction is exact, not a guess.
      # FR | Une valeur collee dans le formulaire de variable GitLab peut
      # FR | arriver sans ses sauts de ligne - en-tete, corps base64 et pied
      # FR | soudes en une seule ligne. openssh refuse cela : on replie donc.
      # FR | Les marqueurs sont des chaines fixes et le corps est du base64,
      # FR | la reconstruction est donc exacte et non devinee.
      if [ "$(wc -l < ~/.ssh/id_ed25519)" -le 1 ] && grep -q "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/id_ed25519; then
        BODY=$(sed -e "s/.*BEGIN OPENSSH PRIVATE KEY-----//" -e "s/-----END OPENSSH PRIVATE KEY.*//" ~/.ssh/id_ed25519 | tr -d " ")
        {
          echo "-----BEGIN OPENSSH PRIVATE KEY-----"
          printf "%s" "$BODY" | fold -w 70
          # EN | fold does not end its output with a newline, so without
          # EN | this echo the footer is welded onto the last base64 line.
          # FR | fold ne termine pas sa sortie par un saut de ligne : sans
          # FR | cet echo, le pied est soude a la derniere ligne base64.
          echo
          echo "-----END OPENSSH PRIVATE KEY-----"
        } > ~/.ssh/id_ed25519.folded
        mv ~/.ssh/id_ed25519.folded ~/.ssh/id_ed25519
        echo "[warn] the key arrived on a single line - line breaks restored."
      fi
      chmod 600 ~/.ssh/id_ed25519
      if ! ssh-keygen -y -f ~/.ssh/id_ed25519 </dev/null >/dev/null 2>&1; then
        echo "[ERR] Private key is unreadable."
        echo "      Lines: $(wc -l < ~/.ssh/id_ed25519) - header present:"
        echo "      $(head -c 36 ~/.ssh/id_ed25519 | grep -c BEGIN)"
        echo "      CRLF, a missing trailing newline and a single-line paste"
        echo "      are all repaired above, so what is left is a passphrase,"
        echo "      a truncated paste, or a public key."
        # EN | Never print the file. On a single-line value, head -1 IS the
        # EN | whole private key, and it lands in a job log that anyone with
        # EN | access to the project can read.
        # FR | Ne jamais afficher le fichier. Sur une valeur d une seule
        # FR | ligne, head -1 EST la cle privee entiere, et elle atterrit
        # FR | dans un log de job lisible par tout membre du projet.
        exit 1
      fi
      echo "[OK] Private key is valid"
    - |
      cat > ~/.ssh/config <<EOF
      Host ha
        HostName $HA_HOST
        Port $HA_SSH_PORT
        User $HA_SSH_USER
        IdentityFile ~/.ssh/id_ed25519
        StrictHostKeyChecking accept-new
        ServerAliveInterval 15
      EOF
    - chmod 600 ~/.ssh/config
    - |
      ssh ha "echo '[OK] SSH established' && ha core info --raw-json | jq -r '.data.version' | sed 's/^/HA Core: /'"

.smoke_test:
  image: alpine:latest
  stage: test
  script:
    - apk add --no-cache curl jq >/dev/null
    # EN | Fail immediately and explicitly if the token variable is missing.
    # FR | Echec immediat et explicite si la variable de token n'existe pas.
    - |
      if [ -z "$HA_TOKEN" ]; then
        echo "[ERR] Empty token."
        echo "      Create the missing CI/CD variable (HA_TOKEN_STAGING or HA_TOKEN_PROD)."
        echo "      Generate the token in HA: Profile > Long-lived access tokens"
        exit 1
      fi
    - echo "[i] Target ->" "$TARGET_URL"
    # EN | Bounded 60s wait, distinguishing network from authentication errors.
    # FR | Attente bornee a 60s, avec distinction reseau / authentification.
    - |
      code=""
      for i in $(seq 1 12); do
        code=$(curl -s -o /tmp/resp -w '%{http_code}' -m 5 \
               -H "Authorization: Bearer $HA_TOKEN" "$TARGET_URL/api/" || echo 000)
        case "$code" in
          200) echo "[OK] HA API reachable"; break ;;
          401|403)
            echo "[ERR] HTTP $code - token rejected by Home Assistant"
            echo "      The token is invalid, revoked, or meant for the other instance."
            exit 1 ;;
          000) echo "[..] $TARGET_URL unreachable ($i/12)" ;;
          *)   echo "[..] HTTP $code ($i/12)" ;;
        esac
        sleep 5
      done
      if [ "$code" != "200" ]; then
        echo "[ERR] Giving up after 60s - last HTTP code -> $code"
        echo "      000 = no network response from the ci namespace."
        echo "      Check the URL, or use the cluster-internal service."
        exit 1
      fi
    - curl -sfI "$TARGET_URL/local/vssp/js/vssp.js" >/dev/null && echo "[OK] JS Engine served"
    - curl -sfI "$TARGET_URL/local/vssp/css/vssp.css" >/dev/null && echo "[OK] CSS Engine served"
    - |
      UNAVAIL=$(curl -sf -H "Authorization: Bearer $HA_TOKEN" "$TARGET_URL/api/states" \
        | jq '[.[] | select(.state=="unavailable")] | length')
      echo "[i] Unavailable entities: $UNAVAIL"

# ============================================================================
# EN | .verify - WHAT A PERSON WOULD LOOK AT
# EN | The smoke test above asks whether the API answers and whether two
# EN | files are served. Both were green on a freshly deployed appliance
# EN | whose every screen was blank: the theme had never been selected, no
# EN | custom card existed because HACS was absent, and two rooms had a
# EN | navigation entry with no dashboard behind them. Everything measured
# EN | was true; the wrong things were measured.
# EN | vssp_verify.py asks the instance what it actually serves - each
# EN | dashboard's configuration, the entities those configurations name,
# EN | the resource registry, the selected theme, the dependency report -
# EN | and fails when a person would see something broken.
# FR | .verify - CE QU UNE PERSONNE REGARDERAIT
# FR | Le test de fumee ci-dessus demande si l API repond et si deux
# FR | fichiers sont servis. Les deux etaient verts sur un appareil
# FR | fraichement deploye dont tous les ecrans etaient blancs : le theme
# FR | n avait jamais ete selectionne, aucune carte personnalisee n existait
# FR | faute de HACS, et deux pieces avaient une entree de navigation sans
# FR | dashboard derriere. Tout ce qui etait mesure etait vrai ; on mesurait
# FR | les mauvaises choses.
# FR | vssp_verify.py demande a l instance ce qu elle sert reellement - la
# FR | configuration de chaque dashboard, les entites que ces configurations
# FR | nomment, le registre des ressources, le theme selectionne, le rapport
# FR | de dependances - et echoue quand une personne verrait quelque chose
# FR | de casse.
# ============================================================================
.preflight:
  image: alpine:latest
  stage: preflight
  script:
    - apk add --no-cache python3 py3-yaml >/dev/null
    - |
      if [ -z "$HA_TOKEN" ]; then
        echo "[ERR] Empty token - the target cannot be inspected."
        exit 1
      fi
    - python3 vssp/vssp_preflight.py --url "$TARGET_URL"

# EN | prepare is MANUAL and never runs on its own: it installs a dozen
# EN | third-party repositories into someone's instance, which is a decision,
# EN | not a side effect of pushing code. It is also the documented way to
# EN | prepare an instance that has no pipeline at all - see
# EN | docs/platform/Prerequisites.md.
# FR | prepare est MANUEL et ne part jamais tout seul : il installe une
# FR | douzaine de depots tiers dans l instance de quelqu un, ce qui est une
# FR | decision, pas un effet de bord d un push. C est aussi la facon
# FR | documentee de preparer une instance qui n a aucun pipeline - voir
# FR | docs/platform/Prerequisites.md.
.prepare:
  image: alpine:latest
  stage: preflight
  when: manual
  script:
    - apk add --no-cache python3 py3-yaml >/dev/null
    - python3 vssp/vssp_prepare.py --url "$TARGET_URL"

.verify:
  image: alpine:latest
  stage: test
  script:
    # EN | py3-yaml because the verifier reads config-fragment.yaml to know
    # EN | which dashboards are the product's own and which belong to the
    # EN | house. Without it the reader falls back to a fixed list and the
    # EN | distinction gets quietly coarser.
    # FR | py3-yaml parce que le verificateur lit config-fragment.yaml pour
    # FR | savoir quels dashboards appartiennent au produit et lesquels a la
    # FR | maison. Sans lui, le lecteur retombe sur une liste figee et la
    # FR | distinction devient silencieusement plus grossiere.
    - apk add --no-cache python3 py3-yaml >/dev/null
    - |
      if [ -z "$HA_TOKEN" ]; then
        echo "[ERR] Empty token - nothing can be verified."
        exit 1
      fi
    # EN | The token travels in the environment, never as an argument: an
    # EN | argument is visible in the process list of the runner.
    # FR | Le jeton voyage dans l environnement, jamais en argument : un
    # FR | argument est visible dans la liste des processus du runner.
    - python3 vssp/vssp_verify.py --url "$TARGET_URL" --tolerated home-assistant/dashboards/model/tolerated_entities.txt --fragment home-assistant/config-fragment.yaml --templates-dir home-assistant/dashboards/templates_j2 --expect-version "$VSSP_DEPLOY_REF" --json verify.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - verify.json

# ============================================================================
# EN | 1. VALIDATE — branches AND tags
# FR | 1. VALIDATE — branches ET tags
# ============================================================================
validate:
  stage: validate
  image: alpine:latest
  script:
    # EN | py3-jinja2 is required even though this job renders nothing:
    # EN | generate_dashboards.py imports jinja2 at module load, so `--help`
    # EN | itself fails without it.
    # FR | py3-jinja2 est necessaire meme si ce job ne rend rien :
    # FR | generate_dashboards.py importe jinja2 au chargement du module, donc
    # FR | `--help` lui-meme echoue sans lui.
    - apk add --no-cache python3 py3-yaml py3-jinja2 >/dev/null
    - echo "Structural validation"
    - test -d home-assistant/dashboards || { echo "[ERR] home-assistant/dashboards missing"; exit 1; }
    - test -d home-assistant/templates  || { echo "[ERR] home-assistant/templates missing"; exit 1; }
    - test -f themes/visio_sapiens.yaml || { echo "[ERR] themes/visio_sapiens.yaml missing"; exit 1; }
    - test -d home-assistant/www/vssp || { echo "[ERR] www/vssp missing"; exit 1; }
    - test -f hacs.json       || { echo "[ERR] hacs.json missing"; exit 1; }
    - test -f repository.yaml || { echo "[ERR] repository.yaml missing"; exit 1; }
    # EN | configuration.yaml patch: fragment + patcher present in the repo
    # FR | Patch configuration.yaml : fragment + patcher presents dans le depot
    - test -f home-assistant/config-fragment.yaml || { echo "[ERR] home-assistant/config-fragment.yaml missing"; exit 1; }
    - test -f vssp/vssp_apply_config.py    || { echo "[ERR] vssp/vssp_apply_config.py missing"; exit 1; }
    - test -f vssp/vssp_ensure_packages.py || { echo "[ERR] vssp/vssp_ensure_packages.py missing"; exit 1; }
    - test -f vssp/vssp_ensure_secret.py   || { echo "[ERR] vssp/vssp_ensure_secret.py missing"; exit 1; }
    # EN | The HAOS add-on: three files, all required by the Supervisor.
    # FR | L add-on HAOS : trois fichiers, tous requis par le Superviseur.
    - test -f addons/vssp-vault/config.yaml || { echo "[ERR] addons/vssp-vault/config.yaml missing"; exit 1; }
    - test -f addons/vssp-vault/Dockerfile  || { echo "[ERR] addons/vssp-vault/Dockerfile missing"; exit 1; }
    - test -f addons/vssp-vault/run.sh      || { echo "[ERR] addons/vssp-vault/run.sh missing"; exit 1; }
    - test -f vssp/vssp_sanitize_resources.py || { echo "[ERR] vssp/vssp_sanitize_resources.py missing"; exit 1; }
    - test -f vssp/vssp_lan_probe.py || { echo "[ERR] vssp/vssp_lan_probe.py missing"; exit 1; }
    # EN | The INFRASTRUCTURE family of the UPDATES screen. The package
    # EN | declares shell_commands that call this script by absolute path, so
    # EN | a package that ships without it gives three buttons that fail
    # EN | silently on a live instance.
    # FR | La famille INFRASTRUCTURE de l ecran MISES A JOUR. Le package
    # FR | declare des shell_command qui appellent ce script par chemin absolu,
    # FR | donc un package livre sans lui donne trois boutons qui echouent en
    # FR | silence sur une instance en service.
    - test -f vssp/vssp_infra_updates.py || { echo "[ERR] vssp/vssp_infra_updates.py missing"; exit 1; }
    - test -f vault/policies/vssp-maint.hcl || { echo "[ERR] vault/policies/vssp-maint.hcl missing"; exit 1; }
    # EN | The script has to at least import and parse its own flags: it is
    # EN | called by shell_command, whose only failure signal on a live
    # EN | instance is a button that appears to do nothing.
    # FR | Le script doit au moins s importer et analyser ses propres options :
    # FR | il est appele par shell_command, dont le seul signal d echec sur une
    # FR | instance en service est un bouton qui a l air de ne rien faire.
    - |
      if ! python3 vssp/vssp_infra_updates.py --help >/dev/null 2>&1; then
        echo "[ERR] vssp/vssp_infra_updates.py cannot run:"
        python3 vssp/vssp_infra_updates.py --help || true
        exit 1
      fi
      echo "[OK] vssp_infra_updates.py runs"
    - test -f vssp/livebox.env || { echo "[ERR] vssp/livebox.env missing"; exit 1; }
    # EN | i18n engine: catalogues + engine must ship with the package
    # FR | Moteur i18n : catalogues + moteur doivent partir avec le paquet
    - test -f vssp/vssp_i18n.py || { echo "[ERR] vssp/vssp_i18n.py missing"; exit 1; }
    - test -f vssp/generate_dashboards.py || { echo "[ERR] vssp/generate_dashboards.py missing"; exit 1; }
    # EN | VERSION SKEW GUARD. This pipeline calls the generator with flags a
    # EN | previous version did not have. When only one of the two is
    # EN | committed, the build fails halfway through with an argparse usage
    # EN | dump that says nothing about the real cause. Checking here names it.
    # FR | GARDE-FOU DE DECALAGE DE VERSION. Ce pipeline appelle le generateur
    # FR | avec des options qu'une version anterieure n'avait pas. Quand un
    # FR | seul des deux est committe, le build echoue a mi-chemin sur un
    # FR | usage argparse qui ne dit rien de la cause reelle. Le controler ici
    # FR | la nomme.
    - |
      MISSING=""
      # EN | Separate the two failure modes. A script that cannot even start
      # EN | (missing import, syntax error) prints no usage at all, so every
      # EN | flag looks absent and the guard would blame a version skew that
      # EN | does not exist. Check the exit code first and report what really
      # EN | happened.
      # FR | Separer les deux modes de defaillance. Un script qui ne demarre
      # FR | meme pas (import manquant, erreur de syntaxe) n'affiche aucun
      # FR | usage, donc toutes les options semblent absentes et le garde-fou
      # FR | accuserait un decalage de version inexistant. On controle
      # FR | d'abord le code de sortie et on signale ce qui s'est vraiment
      # FR | produit.
      if ! HELP=$(python3 vssp/generate_dashboards.py --help 2>&1); then
        echo "[ERR] vssp/generate_dashboards.py cannot run at all:"
        echo "$HELP" | sed 's/^/        /'
        echo "      This is NOT a version skew — the script fails to start."
        echo "      Usual cause: a missing Python dependency in this job's image."
        exit 1
      fi
      # EN | Tokenise before matching: a substring test would accept
      # EN | `--legacy--locale` as `--locale` and report a skew that is not
      # EN | there — or worse, miss one that is.
      # FR | Tokeniser avant de comparer : un test de sous-chaine accepterait
      # FR | `--legacy--locale` comme `--locale` et signalerait un decalage
      # FR | inexistant — ou pire, en manquerait un reel.
      TOKENS=$(echo "$HELP" | tr -cs 'A-Za-z0-9-' '\n')
      for flag in --locale --format --locales-dir --static-fragment --rooms-fragment --only --design-model --themes-out --design-status-file; do
        echo "$TOKENS" | grep -qx -- "$flag" || MISSING="$MISSING $flag"
      done
      if [ -n "$MISSING" ]; then
        echo "[ERR] vssp/generate_dashboards.py does not support:$MISSING"
        echo "      The committed generator is older than this .gitlab-ci.yml."
        echo "      Commit the matching version of vssp/generate_dashboards.py."
        exit 1
      fi
      echo "[OK] generate_dashboards.py supports every flag this pipeline uses"
    - test -f home-assistant/dashboards/locales/en.yaml || { echo "[ERR] locales/en.yaml missing (reference locale)"; exit 1; }
    - test -f "home-assistant/dashboards/locales/${VSSP_LOCALE}.yaml" || { echo "[ERR] locales/${VSSP_LOCALE}.yaml missing - VSSP_LOCALE=${VSSP_LOCALE} has no catalogue"; exit 1; }
    # EN | The router password must NEVER be committed.
    # FR | Le secret de la Livebox ne doit JAMAIS etre versionne.
    - |
      if [ -f vssp/.livebox.env ]; then
        echo "[ERR] vssp/.livebox.env is committed - it holds the password."
        echo "      git rm --cached vssp/.livebox.env  then add it to .gitignore"
        exit 1
      fi
    # EN | Every locale must be consistent with the English reference: keys
    # EN | that exist nowhere else are typos that would never be displayed.
    # FR | Chaque langue doit etre coherente avec la reference anglaise : les
    # FR | cles inexistantes ailleurs sont des fautes jamais affichees.
    - |
      python3 vssp/vssp_i18n.py \
        --locales-dir home-assistant/dashboards/locales check \
        || { echo "[ERR] locale catalogues are inconsistent"; exit 1; }
    # EN | Every __T:key__ used anywhere in the repo must resolve in the
    # EN | reference catalogue. Catching this here beats discovering an
    # EN | unreplaced placeholder in the Home Assistant sidebar.
    # EN | COMMENT LINES ARE SKIPPED: a marker behind a `#` is inert, and the
    # EN | files that document this very syntax are full of them. Scanning
    # EN | them made the check fire on the code that explains it.
    # FR | Chaque __T:cle__ utilisee dans le depot doit se resoudre dans le
    # FR | catalogue de reference. Le detecter ici vaut mieux que de decouvrir
    # FR | une substitution non remplacee dans la barre laterale de HA.
    # FR | LES LIGNES DE COMMENTAIRE SONT IGNOREES : un marqueur derriere un
    # FR | `#` est inerte, et les fichiers qui documentent cette syntaxe meme
    # FR | en sont remplis. Les scanner faisait se declencher le controle sur
    # FR | le code qui l'explique.
    - |
      python3 - <<'PY'
      import re, sys, glob, yaml
      PLACEHOLDER = re.compile(r'__T:([A-Za-z0-9_.]+)__')
      with open('home-assistant/dashboards/locales/en.yaml', encoding='utf-8') as fh:
          cat = yaml.safe_load(fh) or {}
      def has(key):
          node = cat
          for part in key.split('.'):
              if not isinstance(node, dict) or part not in node:
                  return False
              node = node[part]
          return True
      bad = []
      targets = glob.glob('home-assistant/**/*.yaml', recursive=True)
      targets += glob.glob('home-assistant/**/*.j2', recursive=True)
      targets += glob.glob('home-assistant/www/**/*.js', recursive=True)
      for f in sorted(set(targets)):
          if '/locales/' in f:
              continue
          with open(f, encoding='utf-8') as fh:
              for n, line in enumerate(fh, 1):
                  if line.lstrip().startswith(('#', '//')):
                      continue
                  for key in PLACEHOLDER.findall(line):
                      if not has(key):
                          bad.append((f, n, key))
      for f, n, key in bad:
          print(f"[ERR] {f}:{n} unknown translation key -> {key}")
      print("[OK] every __T: placeholder resolves" if not bad
            else f"[ERR] {len(bad)} unresolved placeholder(s)")
      sys.exit(1 if bad else 0)
      PY
    # EN | VSSP_PREFIX <-> fragment dashboard keys consistency (non-blocking)
    # FR | Coherence VSSP_PREFIX <-> cles de dashboards du fragment (non bloquant)
    - |
      python3 - <<'PY'
      import re, yaml
      yaml.SafeLoader.add_multi_constructor('!', lambda l, s, n: None)
      with open('home-assistant/config-fragment.yaml', encoding='utf-8') as fh:
          frag = yaml.safe_load(fh) or {}
      dboards = ((frag.get('lovelace') or {}).get('dashboards') or {})
      with open('vssp/vssp_apply_config.py', encoding='utf-8') as fh:
          src = fh.read()
      m = re.search(r'^VSSP_PREFIX\s*=\s*["\']([^"\']+)', src, re.M)
      prefix = m.group(1) if m else ''
      ignored = [k for k in dboards if not str(k).startswith(prefix)]
      if ignored:
          print("[WARN] VSSP_PREFIX = %r in vssp_apply_config.py" % prefix)
          print("       These fragment dashboards will NOT be written to")
          print("       configuration.yaml (the patcher skips them):")
          for k in ignored:
              print("          - %s" % k)
          print("       Fix VSSP_PREFIX, or rename the fragment keys.")
      else:
          print("[OK] %d fragment dashboard(s) covered by VSSP_PREFIX=%r"
                % (len(dboards), prefix))
      PY
    # EN | A .yaml file holding a Visio Sapiens Jinja TEMPLATE is a template
    # EN | saved in the wrong place. The YAML parser reports it as "found
    # EN | character '%' that cannot start any token", which says nothing
    # EN | about the real cause.
    # EN |
    # EN | CRITICAL — this must NOT test for Jinja syntax in general. Home
    # EN | Assistant uses Jinja natively and legitimately: template sensors,
    # EN | shell_command arguments, automations and even markdown cards are
    # EN | full of `{% set %}` and `{{ states(...) }}`. Flagging those would
    # EN | fail the build on perfectly correct files.
    # EN | So we look for OUR OWN signatures instead — the partials and the
    # EN | context variables only generate_dashboards.py provides. Those never
    # EN | appear in a file Home Assistant loads directly.
    # FR | Un fichier .yaml contenant un TEMPLATE Jinja Visio Sapiens est un
    # FR | template enregistre au mauvais endroit. Le parser YAML le signale
    # FR | par « found character '%' that cannot start any token », ce qui ne
    # FR | dit rien de la cause reelle.
    # FR |
    # FR | CRITIQUE — ceci ne doit PAS tester la syntaxe Jinja en general.
    # FR | Home Assistant utilise Jinja nativement et legitimement : capteurs
    # FR | template, arguments de shell_command, automatisations et meme
    # FR | cartes markdown sont pleins de `{% set %}` et `{{ states(...) }}`.
    # FR | Les signaler ferait echouer le build sur des fichiers parfaitement
    # FR | corrects.
    # FR | On cherche donc NOS PROPRES signatures — les partials et les
    # FR | variables de contexte que seul generate_dashboards.py fournit.
    # FR | Elles n'apparaissent jamais dans un fichier charge directement par
    # FR | Home Assistant.
    - |
      python3 - <<'PY'
      import re, sys, glob
      SIGNATURES = [
          (re.compile(r"\{%\s*include\s+'_"), "Visio Sapiens partial include"),
          (re.compile(r"\{\{\s*t\("),          "t() translation call"),
          (re.compile(r"\{\{\s*house\."),      "house.* context variable"),
          (re.compile(r"\{\{\s*room\."),       "room.* context variable"),
          (re.compile(r"\{\{\s*locale_tag"),   "locale_tag context variable"),
          (re.compile(r"\{%\s*set\s+page_"),   "page_* template variable"),
      ]
      bad = []
      for f in sorted(glob.glob('home-assistant/**/*.yaml', recursive=True)):
          with open(f, encoding='utf-8') as fh:
              for n, line in enumerate(fh, 1):
                  if line.lstrip().startswith('#'):
                      continue
                  for pattern, what in SIGNATURES:
                      if pattern.search(line):
                          bad.append((f, n, what, line.strip()[:60]))
                          break
                  else:
                      continue
                  break
      for f, n, what, snippet in bad:
          print(f"[ERR] {f}:{n} holds a {what} -> {snippet}")
      if bad:
          print("      A generator template was saved as .yaml instead of .j2.")
          print("      Move it to home-assistant/dashboards/templates_j2/<name>.yaml.j2")
          print("      and delete the .yaml copy — the generator writes the")
          print("      rendered file itself.")
          sys.exit(1)
      print("[OK] no generator template saved as plain YAML")
      PY
    - |
      if [ -d home-assistant/themes ]; then
        echo "[ERR] home-assistant/themes/ still exists and creates a duplicate source."
        echo "      Remove it: git rm -r home-assistant/themes"
        exit 1
      fi
    - |
      python3 - <<'PY'
      import sys, glob, yaml

      # EN | Home Assistant uses custom YAML tags (!include, !secret,
      # EN | !include_dir_merge_list...). PyYAML does not know them: we accept
      # EN | them without interpreting them - only syntax is validated here.
      # FR | Home Assistant utilise des tags YAML personnalises (!include,
      # FR | !secret, !include_dir_merge_list...). PyYAML ne les connait pas :
      # FR | on les accepte sans les interpreter, on ne valide ici que la syntaxe.
      def _ha_tag(loader, suffix, node):
          if isinstance(node, yaml.ScalarNode):
              return loader.construct_scalar(node)
          if isinstance(node, yaml.SequenceNode):
              return loader.construct_sequence(node)
          if isinstance(node, yaml.MappingNode):
              return loader.construct_mapping(node)
          return None
      yaml.SafeLoader.add_multi_constructor('!', _ha_tag)

      files = sorted(glob.glob('home-assistant/**/*.yaml', recursive=True))
      files += sorted(glob.glob('themes/*.yaml'))
      err = 0
      for f in files:
          try:
              with open(f, encoding='utf-8') as fh:
                  yaml.safe_load(fh)
          except Exception as e:
              print(f"[ERR] {f}"); print(f"      {e}"); err = 1
      print(f"[i] {len(files)} file(s) analysed")
      print("[OK] YAML syntax is valid" if not err else "[ERR] Syntax errors")
      sys.exit(err)
      PY

# ============================================================================
# EN | 2. BUILD — single package, same layout as /config
# FR | 2. BUILD — paquet unique, structure identique a /config
# ============================================================================
build:
  stage: build
  image: alpine:latest
  script:
    - apk add --no-cache python3 py3-yaml py3-jinja2 >/dev/null
    - export VSSP_BUILD="${CI_COMMIT_TAG:-dev-${CI_COMMIT_SHORT_SHA}}"
    - echo "Build $VSSP_BUILD - locale ${VSSP_LOCALE}"
    - mkdir -p dist/dashboards/templates dist/themes dist/www
    - cp -r home-assistant/dashboards/.  dist/dashboards/
    - cp -r home-assistant/templates/.   dist/dashboards/templates/
    - cp -r themes/.                     dist/themes/
    - cp -r home-assistant/www/.         dist/www/
    # EN | Multi-domain HA packages (template, utility_meter...) loaded through
    # EN | the fragment's `homeassistant: packages: !include_dir_named packages`.
    # FR | Packages HA multi-domaines (template, utility_meter...) charges via
    # FR | `homeassistant: packages: !include_dir_named packages` du fragment.
    - mkdir -p dist/packages
    - cp -r home-assistant/packages/.    dist/packages/
    # --- EN | VSSP tooling: the WHOLE vssp/ folder ships ---------------------
    # --- FR | Outillage VSSP : on embarque TOUT le dossier vssp/ ------------
    # EN | Principle: BLACKLIST, not whitelist. Any new script added to vssp/
    # EN | automatically reaches staging and production; only the items
    # EN | explicitly excluded below stay behind.
    # FR | Principe : liste NOIRE, pas liste blanche. Tout nouveau script
    # FR | ajoute dans vssp/ part automatiquement en staging et en production ;
    # FR | seuls les elements explicitement exclus ci-dessous restent au sol.
    - mkdir -p dist/vssp
    - cp -r vssp/. dist/vssp/
    # EN | secret: must NEVER be packaged / FR | secret : ne doit JAMAIS partir
    - rm -f  dist/vssp/.livebox.env
    # EN | local patcher state, not code / FR | etat local du patcher, pas du code
    - rm -rf dist/vssp/backups
    - rm -f  dist/vssp/.gitkeep
    - chmod +x dist/vssp/*.py
    - echo "[i] Bundled scripts:" && ls -1 dist/vssp/
    # --- EN | The MCP server's Python package ------------------------------
    # --- FR | Le paquet Python du serveur MCP ------------------------------
    # EN | vssp_mcp/ is NOT under vssp/, and that separation is the point.
    # EN | Everything in vssp/ is run by Home Assistant itself, through
    # EN | command_line sensors and shell_commands, so it must stay stdlib +
    # EN | pyyaml: `pip install` is not something you ask of a Home Assistant
    # EN | OS box. The MCP server needs the MCP SDK, and gets it from the
    # EN | container that runs it - the HAOS add-on in addons/vssp-mcp, or
    # EN | the k3s pod in kubernetes/mcp. Home Assistant never imports this
    # EN | package; it only stores it.
    # EN | It ships in the package so that a new version of the server
    # EN | arrives by deploying, exactly like everything else, with no
    # EN | add-on rebuild and no image to push.
    # FR | vssp_mcp/ n est PAS sous vssp/, et cette separation est tout
    # FR | l interet. Tout ce qui est dans vssp/ est execute par Home
    # FR | Assistant lui-meme, via des capteurs command_line et des
    # FR | shell_commands, et doit donc rester stdlib + pyyaml : `pip
    # FR | install` n est pas une chose qu on demande a une machine Home
    # FR | Assistant OS. Le serveur MCP a besoin du SDK MCP, et l obtient du
    # FR | conteneur qui l execute - l add-on HAOS dans addons/vssp-mcp, ou
    # FR | le pod k3s dans kubernetes/mcp. Home Assistant n importe jamais ce
    # FR | paquet ; il ne fait que le stocker.
    # FR | Il part dans le paquet pour qu une nouvelle version du serveur
    # FR | arrive par un deploiement, exactement comme tout le reste, sans
    # FR | reconstruction d add-on ni image a pousser.
    - mkdir -p dist/vssp_mcp
    - cp -r vssp_mcp/. dist/vssp_mcp/
    - rm -rf dist/vssp_mcp/__pycache__
    - echo "[i] MCP server package:" && ls -1 dist/vssp_mcp/
    # --- EN | DASHBOARD GENERATION — the build is the single source --------
    # --- FR | GENERATION DES DASHBOARDS — le build est la source unique -----
    # EN | Generating here rather than relying on committed views guarantees
    # EN | the deliverable's language matches VSSP_LOCALE. A committed view
    # EN | carries the language of whoever last ran the generator, which will
    # EN | sooner or later contradict the variable. It also produces
    # EN | config-fragment-rooms.yaml, without which the room dashboards exist
    # EN | on disk but Home Assistant knows none of their URLs.
    # FR | Generer ici plutot que se fier aux vues committees garantit que la
    # FR | langue du livrable correspond a VSSP_LOCALE. Une vue committee porte
    # FR | la langue de qui a lance le generateur en dernier, ce qui finira par
    # FR | contredire la variable. Cela produit aussi
    # FR | config-fragment-rooms.yaml, sans lequel les dashboards de piece
    # FR | existent sur le disque mais Home Assistant ne connait aucune de
    # FR | leurs URL.
    - |
      python3 vssp/generate_dashboards.py \
        --model     home-assistant/dashboards/model/house.yaml \
        --devices   home-assistant/dashboards/model/energy_devices.yaml \
        --templates home-assistant/dashboards/templates_j2 \
        --locales-dir home-assistant/dashboards/locales \
        --static-fragment home-assistant/config-fragment.yaml \
        --locale "$VSSP_LOCALE" \
        --out dist/dashboards/views \
        --rooms-fragment dist/config-fragment-rooms.yaml \
        || { echo "[ERR] dashboard generation failed"; exit 1; }
    - |
      if [ ! -s dist/config-fragment-rooms.yaml ]; then
        echo "[ERR] dist/config-fragment-rooms.yaml is empty or missing."
        echo "      Room dashboards would be unreachable in Home Assistant."
        exit 1
      fi

    # --- EN | LOCALE RENDERING — must run BEFORE cache-busting --------------
    # --- FR | RENDU DE LA LANGUE — doit tourner AVANT le cache-busting ------
    # EN | Substitutes every __T:key__ in the fragment with the chosen
    # EN | language. English is the source of truth, so VSSP_LOCALE=en yields
    # EN | the untouched default wording. __VTOKEN__ is deliberately NOT
    # EN | touched here - it is replaced later, at apply time.
    # FR | Substitue chaque __T:cle__ du fragment par la langue choisie.
    # FR | L'anglais etant la source de verite, VSSP_LOCALE=en produit le
    # FR | libelle par defaut inchange. __VTOKEN__ n'est volontairement PAS
    # FR | touche ici - il est remplace plus tard, au moment du apply.
    - |
      python3 vssp/vssp_i18n.py \
        --locales-dir home-assistant/dashboards/locales \
        render --locale "$VSSP_LOCALE" \
        --in  home-assistant/config-fragment.yaml \
        --out dist/config-fragment.yaml \
        || { echo "[ERR] locale rendering of config-fragment.yaml failed"; exit 1; }
    # EN | HARD GUARD: no unsubstituted placeholder may leave the build. If
    # EN | the render step was skipped or silently failed, `__T:` reaches
    # EN | configuration.yaml and Home Assistant displays the raw marker as a
    # EN | dashboard title in the sidebar. Fail here instead.
    # FR | GARDE-FOU DUR : aucune substitution non resolue ne doit sortir du
    # FR | build. Si l'etape de rendu a ete sautee ou a echoue en silence,
    # FR | `__T:` arrive dans configuration.yaml et Home Assistant affiche le
    # FR | marqueur brut comme titre de dashboard dans la sidebar. On echoue ici.
    #
    # EN | TWO EXCLUSIONS, both deliberate:
    # EN |   1. dist/vssp/ — the tooling DOCUMENTS this very syntax
    # EN |      (vssp_i18n.py explains __T:key__ in its comments and help text).
    # EN |      Those files are Python scripts and reference YAML; Home
    # EN |      Assistant never renders them as configuration.
    # EN |   2. comment lines — a marker inside a `#` comment is inert.
    # EN | Scanning them anyway would make the guard fire on the code that
    # EN | implements it, which is exactly what happened the first time.
    # FR | DEUX EXCLUSIONS, toutes deux volontaires :
    # FR |   1. dist/vssp/ — l'outillage DOCUMENTE cette syntaxe meme
    # FR |      (vssp_i18n.py explique __T:cle__ dans ses commentaires et son
    # FR |      aide). Ce sont des scripts Python et du YAML de reference ;
    # FR |      Home Assistant ne les rend jamais comme configuration.
    # FR |   2. les lignes de commentaire — un marqueur dans un `#` est inerte.
    # FR | Les scanner ferait se declencher le garde-fou sur le code qui
    # FR | l'implemente, ce qui est exactement ce qui s'est produit la
    # FR | premiere fois.
    - |
      python3 - <<'PY'
      import re, sys
      from pathlib import Path

      PLACEHOLDER = re.compile(r'__T:[A-Za-z0-9_.]+__')
      # EN | Only what Home Assistant actually loads as configuration.
      # FR | Uniquement ce que Home Assistant charge reellement comme config.
      TARGETS = ['config-fragment.yaml', 'dashboards', 'packages',
                 'themes', 'www']

      bad = []
      for target in TARGETS:
          root = Path('dist') / target
          paths = [root] if root.is_file() else sorted(
              p for p in root.rglob('*') if p.is_file()) if root.exists() else []
          for path in paths:
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except (UnicodeDecodeError, OSError):
                  continue
              for n, line in enumerate(lines, 1):
                  if line.lstrip().startswith(('#', '//')):
                      continue
                  for hit in PLACEHOLDER.findall(line):
                      bad.append((path, n, hit))

      for path, n, hit in bad:
          print(f"[ERR] {path}:{n} unsubstituted placeholder -> {hit}")
      if bad:
          print(f"[ERR] {len(bad)} unsubstituted placeholder(s) in the package.")
          print("      The locale rendering step did not run, or did not cover")
          print("      these files. Nothing must reach /config with a raw marker.")
          sys.exit(1)
      print("[OK] no unsubstituted __T: placeholder in the deployed configuration")
      PY
    # EN | Record the language inside the package so the deployed instance can
    # EN | report which locale it is actually running.
    # FR | Trace la langue dans le paquet pour que l'instance deployee puisse
    # FR | indiquer la langue qu'elle execute reellement.
    - echo "$VSSP_LOCALE" > dist/VSSP_LOCALE
    # --- EN | WHITELIST GUARD #1 / FR | GARDE-FOU liste blanche n1 ----------
    # EN | The copies above name directories one by one (their destination in
    # EN | /config differs from their name in the repo, so a bulk copy is not
    # EN | possible). Consequence: a new directory under home-assistant/ would
    # EN | be silently ignored. We refuse that case.
    # FR | Les copies ci-dessus nomment les repertoires un par un (leur
    # FR | destination dans /config differe de leur nom dans le depot, une
    # FR | copie en bloc n'est donc pas possible). Consequence : un nouveau
    # FR | repertoire dans home-assistant/ serait ignore en silence. On refuse.
    - |
      # EN | Inert markers: present for Git or for human readers, with no
      # EN | destination in /config. They are neither packaged nor reported.
      # FR | Marqueurs inertes : presents pour Git ou la lecture humaine, sans
      # FR | destination dans /config. Ils ne sont ni packages ni signales.
      KNOWN=" dashboards templates www packages config-fragment.yaml config-fragment-rooms.yaml .gitkeep .gitignore README.md "
      UNHANDLED=""
      for e in home-assistant/* home-assistant/.[!.]*; do
        [ -e "$e" ] || continue
        n=$(basename "$e")
        echo "$KNOWN" | grep -q " $n " || UNHANDLED="$UNHANDLED $n"
      done
      if [ -n "$UNHANDLED" ]; then
        echo "[ERR] home-assistant/ entries not handled by the build:"
        for n in $UNHANDLED; do echo "        - $n"; done
        echo "      Add their copy here AND their deployment in both deploy"
        echo "      jobs, or move them out of home-assistant/."
        exit 1
      fi
      echo "[OK] every home-assistant/ entry is packaged"
    # EN | Automatic cache-busting of Lovelace resources.
    # EN | NOTE: config-fragment.yaml is EXCLUDED - it uses the __VTOKEN__
    # EN | placeholder, replaced at apply time via --vtoken (not ?v=X).
    # FR | Cache-busting automatique des ressources Lovelace.
    # FR | NB : on EXCLUT config-fragment.yaml — il utilise le placeholder
    # FR | __VTOKEN__ remplace au moment du apply via --vtoken (et non ?v=X).
    - export VTOKEN=$(echo "$VSSP_BUILD" | tr -c 'a-zA-Z0-9._-' '-')
    - find dist -name '*.yaml' ! -name 'config-fragment.yaml' -exec sed -i "s|\(/local/vssp/[^ \"']*\)?v=[0-9A-Za-z._-]*|\1?v=${VTOKEN}|g" {} +
    - echo "Resources tagged ?v=${VTOKEN}"
    - |
      cat > dist/VSSP_VERSION <<EOF
      version=$VSSP_BUILD
      commit=$CI_COMMIT_SHA
      ref=$CI_COMMIT_REF_NAME
      locale=$VSSP_LOCALE
      pipeline=$CI_PIPELINE_ID
      built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      EOF
    - |
      cd dist && python3 - <<'PY'
      import sys, os, glob, yaml

      # EN | Checks that every !include points at an existing target, in the
      # EN | tree as it will be inside /config (not as it is in the repo).
      # FR | Verifie que chaque !include pointe vers une cible existante, dans
      # FR | l'arborescence telle qu'elle sera dans /config (et non dans le depot).
      missing = []
      DIR_TAGS = ('include_dir_list', 'include_dir_merge_list',
                  'include_dir_named', 'include_dir_merge_named')

      def _ha_tag(loader, suffix, node):
          if isinstance(node, yaml.ScalarNode):
              val = loader.construct_scalar(node)
              src = getattr(loader, 'name', '') or '.'
              base = os.path.dirname(src)
              if suffix == 'include' and not os.path.isfile(os.path.join(base, val)):
                  missing.append((src, '!include', val))
              elif suffix in DIR_TAGS and not os.path.isdir(os.path.join(base, val)):
                  missing.append((src, '!' + suffix, val))
              return val
          if isinstance(node, yaml.SequenceNode):
              return loader.construct_sequence(node)
          if isinstance(node, yaml.MappingNode):
              return loader.construct_mapping(node)
          return None
      yaml.SafeLoader.add_multi_constructor('!', _ha_tag)

      for f in sorted(glob.glob('**/*.yaml', recursive=True)):
          # EN | vssp/ holds tooling (vssp_admin_config.yaml,
          # EN | energy_config_snippets.yaml...) that HA never loads: it is
          # EN | not submitted to the !include check.
          # FR | vssp/ contient de l'outillage (vssp_admin_config.yaml,
          # FR | energy_config_snippets.yaml...) qui n'est pas charge par HA :
          # FR | on ne le passe pas au controle des !include.
          if f.startswith('vssp/'):
              continue
          with open(f, encoding='utf-8') as fh:
              yaml.safe_load(fh)

      for src, tag, val in missing:
          print(f"[ERR] {src}"); print(f"      {tag} {val} -> target not found in /config")
      print("[OK] every !include reference resolves"
            if not missing else f"[ERR] {len(missing)} broken reference(s)")
      sys.exit(1 if missing else 0)
      PY
    - cd "$CI_PROJECT_DIR"
    - tar -czf $PACKAGE_NAME.tar.gz -C dist .
    - echo "$VSSP_BUILD" > .vssp_version
    - ls -lh $PACKAGE_NAME.tar.gz
  artifacts:
    name: "$PACKAGE_NAME-$CI_COMMIT_REF_SLUG"
    expire_in: 30 days
    paths:
      - $PACKAGE_NAME.tar.gz
      - .vssp_version

# ============================================================================
# EN | 2b. HACS PACKAGE — public distribution, tags only
# FR | 2bis. PAQUET HACS — distribution publique, sur tags uniquement
# ============================================================================
package:hacs:
  extends: .rules_tag
  stage: build
  image: alpine:latest
  script:
    - echo "HACS package $CI_COMMIT_TAG"
    - mkdir -p dist
    - cp -r themes dist/
    # EN | LICENSE ships with the package: the GPL requires a copy of the
    # EN | licence to accompany every copy of the program that is handed on,
    # EN | and this tarball is the public one.
    # FR | LICENSE part avec le paquet : la GPL exige qu'une copie de la
    # FR | licence accompagne chaque copie du programme transmise, et ce
    # FR | tarball est celui qui est public.
    - cp hacs.json repository.yaml README.md LICENSE dist/
    # EN | Localized READMEs ship alongside the English one. Absence is not an
    # EN | error: a language can be dropped without breaking the release.
    # FR | Les README localises partent a cote de l'anglais. Leur absence n'est
    # FR | pas une erreur : une langue peut etre retiree sans casser la release.
    - |
      for f in README.*.md; do
        [ -e "$f" ] || continue
        cp "$f" dist/ && echo "[i] bundled $f"
      done
    - cp CHANGELOG.md dist/ 2>/dev/null || echo "[warn] CHANGELOG.md missing"
    - echo "$CI_COMMIT_TAG" > dist/VERSION
    - tar -czf $PACKAGE_NAME-hacs-$CI_COMMIT_TAG.tar.gz -C dist .
  artifacts:
    name: "$PACKAGE_NAME-hacs-$CI_COMMIT_TAG"
    expire_in: never
    paths:
      - dist/
      - $PACKAGE_NAME-hacs-$CI_COMMIT_TAG.tar.gz

# ============================================================================
# EN | 3a. DEPLOY STAGING — k3s, branches only
# FR | 3a. DEPLOY STAGING — k3s, sur branches uniquement
# ============================================================================
deploy:staging:
  extends: .rules_staging
  stage: deploy
  image: bitnami/kubectl:latest
  needs: ["build", "preflight:staging"]
  environment:
    name: staging
    url: $STAGING_URL
  script:
    - export VSSP_BUILD=$(cat .vssp_version)
    - echo "STAGING deployment (k3s) - $VSSP_BUILD"
    - export HA_POD=$(kubectl get pod -n $K3S_NAMESPACE -l app=homeassistant -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
    - '[ -z "$HA_POD" ] && export HA_POD=$(kubectl get pods -n $K3S_NAMESPACE -o jsonpath="{.items[0].metadata.name}")'
    - echo "Target pod ->" "$HA_POD"
    # --- EN | PREFLIGHT — is /config actually mounted and writable? -------
    # --- FR | PRE-VOL — /config est-il monte et inscriptible ? -------------
    # EN | Everything below assumes /config is the Home Assistant
    # EN | configuration root, on a persistent volume. When the volume is not
    # EN | mounted, the very first mkdir fails with
    # EN |     mkdir: cannot create directory '/config': Permission denied
    # EN | which reads like a permissions problem but means the directory does
    # EN | not exist at all — mkdir walked up to / and found it read-only.
    # EN | Checking here names the real cause instead of leaving a misleading
    # EN | message halfway through a deployment.
    # FR | Tout ce qui suit suppose que /config est la racine de configuration
    # FR | Home Assistant, sur un volume persistant. Quand le volume n'est pas
    # FR | monte, le tout premier mkdir echoue sur
    # FR |     mkdir: cannot create directory '/config': Permission denied
    # FR | ce qui se lit comme un probleme de droits mais signifie que le
    # FR | repertoire n'existe pas du tout — mkdir est remonte a / et l'a
    # FR | trouve en lecture seule.
    # FR | Le controler ici nomme la vraie cause au lieu de laisser un message
    # FR | trompeur au milieu d'un deploiement.
    - |
      if ! kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- \
           sh -c 'test -d /config && test -w /config'; then
        echo "[ERR] /config is not a writable directory in pod $HA_POD"
        echo "      container: $K3S_CONTAINER"
        echo ""
        echo "      What the pod actually has at its root:"
        kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- ls -la / || true
        echo ""
        echo "      Mounted volumes declared on the pod:"
        kubectl get pod -n $K3S_NAMESPACE $HA_POD \
          -o jsonpath='{range .spec.containers[*]}{.name}{":\n"}{range .volumeMounts[*]}  {.mountPath}{" <- "}{.name}{"\n"}{end}{end}' || true
        echo ""
        echo "      Usual causes:"
        echo "        - the config PersistentVolumeClaim is not bound, so the"
        echo "          pod started without its volume;"
        echo "        - the deployment mounts the config elsewhere"
        echo "          (/homeassistant, /data...), in which case update the"
        echo "          paths in this job;"
        echo "        - K3S_CONTAINER points at a sidecar rather than at Home"
        echo "          Assistant itself."
        exit 1
      fi
      echo "[OK] /config is mounted and writable"
    - kubectl cp $PACKAGE_NAME.tar.gz $K3S_NAMESPACE/$HA_POD:/config/.vssp.tar.gz -c $K3S_CONTAINER
    # EN | APOSTROPHES ARE FORBIDDEN in the remote shell block below.
    # EN | The whole script is passed as `sh -c '...'`, a single-quoted string
    # EN | in the runner's shell. One apostrophe inside — including in a
    # EN | comment — closes that string, and everything after it is reparsed
    # EN | as different arguments. The remote command then does something
    # EN | other than what it reads like: the failure surfaced as
    # EN |     mkdir: cannot create directory '/config': Permission denied
    # EN | on a pod where /config was perfectly mounted and writable.
    # EN | Write "n a", "c est", "l instance" without the apostrophe.
    # FR | LES APOSTROPHES SONT INTERDITES dans le bloc shell distant
    # FR | ci-dessous. Tout le script est passe comme `sh -c '...'`, une
    # FR | chaine entre quotes simples dans le shell du runner. Une seule
    # FR | apostrophe a l interieur — y compris dans un commentaire — ferme
    # FR | cette chaine, et tout ce qui suit est reanalyse comme d autres
    # FR | arguments. La commande distante fait alors autre chose que ce
    # FR | qu elle donne a lire : la panne est apparue sous la forme
    # FR |     mkdir: cannot create directory '/config': Permission denied
    # FR | sur un pod ou /config etait parfaitement monte et inscriptible.
    # FR | Ecrire "n a", "c est", "l instance" sans apostrophe.
    - |
      kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- sh -c '
        set -e
        rm -rf /config/.vssp_stage && mkdir -p /config/.vssp_stage
        tar xzf /config/.vssp.tar.gz -C /config/.vssp_stage
        # EN | LAST-GOOD ROOMS, set aside before the swap below rotates
        # EN | dashboards.old. That rotation is only safe if the deploy
        # EN | reaches the preservation step further down; a job that dies in
        # EN | between (a quoting error did exactly that) leaves dashboards/
        # EN | holding the repository room-less house.yaml, and the NEXT
        # EN | deploy rotates THAT into dashboards.old, deleting the only
        # EN | copy that still had the rooms. Nothing recovers on its own
        # EN | from there: 0 room dashboards regenerated, pruned out of
        # EN | configuration.yaml, every room link in the nav bar back to
        # EN | HOME.
        # EN | /config/vssp/ is copied additively and never replaced, so this
        # EN | copy survives precisely the failure the rotation cannot.
        # FR | DERNIERES PIECES VALIDES, mises de cote avant que l echange
        # FR | ci-dessous ne fasse tourner dashboards.old. Cette rotation
        # FR | n est sure que si le deploiement atteint l etape de
        # FR | preservation plus bas ; un job qui meurt entre les deux (une
        # FR | erreur de quoting l a fait exactement) laisse dashboards/ avec
        # FR | le house.yaml sans pieces du depot, et le deploiement SUIVANT
        # FR | fait tourner CELUI-LA vers dashboards.old, supprimant la seule
        # FR | copie qui avait encore les pieces. Des lors plus rien ne se
        # FR | retablit tout seul : 0 dashboard de piece regenere, elagues de
        # FR | configuration.yaml, chaque lien de piece de la barre de
        # FR | navigation de retour sur HOME.
        # FR | /config/vssp/ est copie en additif et jamais remplace, donc
        # FR | cette copie survit precisement a la defaillance que la
        # FR | rotation ne peut pas encaisser.
        mkdir -p /config/vssp
        if [ -f /config/dashboards/model/house.yaml ]; then
          cp /config/dashboards/model/house.yaml /config/vssp/house.yaml.live
        fi
        for d in dashboards themes; do
          rm -rf /config/$d.old
          [ -d /config/$d ] && mv /config/$d /config/$d.old
          mv /config/.vssp_stage/$d /config/$d
        done
        # EN | POD-SIDE STATE — preserved across deployments.
        # EN | `dashboards/` is REPLACED wholesale (mv), unlike vssp/ and
        # EN | packages/ which are copied additively. That is correct for
        # EN | generated views, but some files are not shipped by the
        # EN | repository at all — they are WRITTEN ON THE POD:
        # EN |   model/energy_devices.yaml  by vssp_energy_sync.py (the
        # EN |                              discovered measured fleet, plus
        # EN |                              the breaker circuits whose amp
        # EN |                              rating was filled in by hand)
        # EN |   model/house_rooms.yaml     by the discovery wizard (room
        # EN |                              assignment)
        # EN |   model/design_system.yaml   by the graphical editor of the
        # EN |                              THEME screen (vssp_theme_apply.py)
        # EN |                              — same reasoning as house_rooms.yaml
        # EN |   views/home.yaml,           the one system dashboard meant
        # EN |   views/home_mobile.yaml     for manual Lovelace editing after
        # EN |                              creation (see --protect-existing
        # EN |                              in generate_dashboards.py)
        # EN |   views/core.yaml,           the on-demand dashboards. The
        # EN |   views/core_mobile.yaml,    package no longer carries them:
        # EN |   views/energy.yaml,         the build generates into an empty
        # EN |   views/energy_mobile.yaml   directory, where they count as
        # EN |                              "not created" and are skipped. So
        # EN |                              whether they exist is decided on
        # EN |                              the INSTANCE — by the CREATE and
        # EN |                              DEACTIVATE buttons — and a
        # EN |                              deployment must carry that
        # EN |                              decision across, in both
        # EN |                              directions: an active one is
        # EN |                              copied back here (then refreshed
        # EN |                              by the pod-side regeneration
        # EN |                              below), a deactivated one is
        # EN |                              absent from dashboards.old and
        # EN |                              simply stays absent. Without this
        # EN |                              line the wholesale mv deleted an
        # EN |                              active CORE at every deployment.
        # EN | Replacing the directory destroyed all of them at every
        # EN | deployment. The ENERGY dashboard then regenerated from an
        # EN | empty model and the panels came back blank — with a message
        # EN | blaming the API token, which was never the cause. A
        # EN | hand-arranged HOME would have been silently wiped the same
        # EN | way, defeating the whole point of it being the one editable
        # EN | dashboard.
        # EN | The pod version always wins: it is discovered/hand-made data,
        # EN | the repo has no authority over it.
        # FR | ETAT COTE POD — preserve entre les deploiements.
        # FR | `dashboards/` est REMPLACE en bloc (mv), contrairement a vssp/
        # FR | et packages/ copies en additif. Correct pour les vues
        # FR | generees, mais certains fichiers ne sont pas livres par le
        # FR | depot du tout — ils sont ECRITS SUR LE POD :
        # FR |   model/energy_devices.yaml  par vssp_energy_sync.py (le parc
        # FR |                              mesure decouvert, plus les
        # FR |                              circuits du tableau electrique
        # FR |                              dont le calibre a ete renseigne a
        # FR |                              la main)
        # FR |   model/house_rooms.yaml     par le Discovery Wizard
        # FR |                              (assignation des pieces)
        # FR |   model/design_system.yaml   par l editeur graphique de
        # FR |                              l ecran THEME
        # FR |                              (vssp_theme_apply.py) — meme
        # FR |                              raisonnement que house_rooms.yaml
        # FR |   views/home.yaml,           le seul dashboard systeme destine
        # FR |   views/home_mobile.yaml     a une edition Lovelace manuelle
        # FR |                              apres creation (voir
        # FR |                              --protect-existing dans
        # FR |                              generate_dashboards.py)
        # FR |   views/core.yaml,           les dashboards a la demande. Le
        # FR |   views/core_mobile.yaml,    paquet ne les transporte plus :
        # FR |   views/energy.yaml,         le build genere dans un repertoire
        # FR |   views/energy_mobile.yaml   vide, ou ils comptent comme « non
        # FR |                              crees » et sont sautes. Leur
        # FR |                              existence se decide donc sur
        # FR |                              l INSTANCE — par les boutons CREER
        # FR |                              et DESACTIVER — et un deploiement
        # FR |                              doit reporter cette decision, dans
        # FR |                              les deux sens : un dashboard actif
        # FR |                              est recopie ici (puis rafraichi
        # FR |                              par la regeneration cote pod plus
        # FR |                              bas), un dashboard desactive est
        # FR |                              absent de dashboards.old et reste
        # FR |                              simplement absent. Sans cette
        # FR |                              ligne, le mv en bloc supprimait un
        # FR |                              CORE actif a chaque deploiement.
        # FR | Remplacer le repertoire les detruisait tous a chaque
        # FR | deploiement. Le dashboard ENERGY se regenerait alors depuis un
        # FR | modele vide et les tableaux revenaient blancs — avec un message
        # FR | accusant le jeton API, qui n y etait pour rien. Un HOME
        # FR | arrange a la main aurait ete efface en silence de la meme
        # FR | facon, ruinant l interet meme d en faire le seul dashboard
        # FR | modifiable.
        # FR | La version du pod gagne toujours : donnee decouverte ou faite
        # FR | a la main, le depot n a aucune autorite dessus.
        for f in model/energy_devices.yaml model/house_rooms.yaml model/design_system.yaml; do
          if [ -f /config/dashboards.old/$f ]; then
            mkdir -p /config/dashboards/$(dirname $f)
            cp /config/dashboards.old/$f /config/dashboards/$f
            echo "[i] preserved pod-side state: $f"
          fi
        done
        # EN | EVERY VIEW THE POD STILL HAS AND THE PACKAGE DOES NOT.
        # EN | Listing view files one by one was wrong twice over: the package
        # EN | no longer carries the on-demand dashboards at all, and it never
        # EN | carried the room dashboards, which are generated on the pod from
        # EN | a model only the pod has. A deployment therefore deleted every
        # EN | room page and they only came back because the pod-side
        # EN | regeneration below rebuilt them - which stops the moment the
        # EN | model no longer declares those rooms, as happened here: four
        # EN | room dashboards, restored from backup, wiped again by the next
        # EN | deployment.
        # EN | The rule is the same for all of them: a view the new package
        # EN | does not provide but the instance had is INSTANCE state, so it
        # EN | is copied back. A deactivated dashboard is absent from
        # EN | dashboards.old and stays absent; a deleted one likewise.
        # FR | TOUTE VUE QUE LE POD A ENCORE ET QUE LE PAQUET N A PAS.
        # FR | Lister les vues une par une etait faux deux fois : le paquet ne
        # FR | transporte plus du tout les dashboards a la demande, et il n a
        # FR | jamais transporte les dashboards de piece, generes sur le pod
        # FR | depuis un modele que seul le pod possede. Un deploiement
        # FR | supprimait donc toutes les pages de piece, et elles ne
        # FR | revenaient que parce que la regeneration cote pod plus bas les
        # FR | reconstruisait - ce qui s arrete des que le modele ne declare
        # FR | plus ces pieces, exactement ce qui est arrive ici : quatre
        # FR | dashboards de piece, restaures depuis une sauvegarde, effaces a
        # FR | nouveau par le deploiement suivant.
        # FR | La regle vaut pour toutes : une vue que le nouveau paquet ne
        # FR | fournit pas mais que l instance avait est un etat D INSTANCE,
        # FR | donc on la recopie. Un dashboard desactive est absent de
        # FR | dashboards.old et reste absent ; un dashboard supprime aussi.
        if [ -d /config/dashboards.old/views ]; then
          mkdir -p /config/dashboards/views
          for v in /config/dashboards.old/views/*.yaml; do
            [ -e "$v" ] || continue
            b=$(basename "$v")
            if [ ! -f /config/dashboards/views/$b ]; then
              cp "$v" /config/dashboards/views/$b
              echo "[i] preserved pod-side view: $b"
            fi
          done
        fi
        # EN | www/: ALL package entries, not just vssp/. Previously the rest
        # EN | of www/ was packaged, transferred, then wiped with the staging dir.
        # FR | www/ : TOUTES les entrees du paquet, pas seulement vssp/. Avant,
        # FR | le reste de www/ etait package, transfere, puis efface avec le staging.
        mkdir -p /config/www
        # EN | POD-SIDE STATE UNDER www/ — same problem as dashboards/
        # EN | above, same rule. Every entry the package ships REPLACES its
        # EN | counterpart wholesale (rm -rf then mv), and www/vssp is one
        # EN | single entry — so the whole directory goes, including the
        # EN | files no commit ever produced because the POD writes them:
        # EN |   vssp/*.json                 every wizard status/data file
        # EN |                               (rooms_sync_status.json,
        # EN |                               assign_data.json,
        # EN |                               energy_sync_status.json,
        # EN |                               theme_status.json...)
        # EN |   vssp/images/floorplan.svg   the floor plan drawn by the user
        # EN |   vssp/modules/               product photos
        # EN |                               vssp_module_images.py fetched
        # EN |                               for hardware discovered after
        # EN |                               the last commit
        # EN | Losing rooms_sync_status.json is not cosmetic: it is the ONLY
        # EN | mirror of each room slot_set/default_slot a browser can read
        # EN | (the HA Area registry has no such concept), so ROOMS & FLOORS
        # EN | came back showing "default" for every room — and the sync it
        # EN | fires on connect then wrote that lie straight into house.yaml,
        # EN | destroying the real assignment instead of merely hiding it.
        # EN | Restoring is conditional: a file the package ships wins, so
        # EN | the product photos tracked in git still update normally and
        # EN | only the pod own extras survive.
        # FR | ETAT COTE POD SOUS www/ — meme probleme que dashboards/
        # FR | ci-dessus, meme regle. Chaque entree livree par le paquet
        # FR | REMPLACE son homologue en bloc (rm -rf puis mv), et www/vssp
        # FR | est une seule entree — donc tout le repertoire disparait, y
        # FR | compris les fichiers qu aucun commit n a jamais produits
        # FR | parce que c est le POD qui les ecrit :
        # FR |   vssp/*.json                 le fichier de statut/donnees de
        # FR |                               chaque assistant
        # FR |                               (rooms_sync_status.json,
        # FR |                               assign_data.json,
        # FR |                               energy_sync_status.json,
        # FR |                               theme_status.json...)
        # FR |   vssp/images/floorplan.svg   le plan dessine par l utilisateur
        # FR |   vssp/modules/               les photos produit recuperees
        # FR |                               par vssp_module_images.py pour
        # FR |                               du materiel decouvert apres le
        # FR |                               dernier commit
        # FR | Perdre rooms_sync_status.json n est pas cosmetique : c est le
        # FR | SEUL miroir du slot_set/default_slot de chaque piece qu un
        # FR | navigateur puisse lire (le registre Zones HA n a pas cette
        # FR | notion), donc PIECES & ETAGES revenait en affichant
        # FR | « default » partout — et la synchro qu il declenche a la
        # FR | connexion ecrivait ensuite ce mensonge directement dans
        # FR | house.yaml, detruisant l assignation reelle au lieu de
        # FR | seulement la masquer.
        # FR | La restauration est conditionnelle : un fichier livre par le
        # FR | paquet gagne, donc les photos produit versionnees se mettent
        # FR | a jour normalement et seuls les extras du pod survivent.
        rm -rf /config/.vssp_www_keep
        mkdir -p /config/.vssp_www_keep
        for pth in /config/www/vssp/*.json /config/www/vssp/images/floorplan.svg /config/www/vssp/modules; do
          [ -e "$pth" ] || continue
          rel=${pth#/config/www/}
          mkdir -p "/config/.vssp_www_keep/$(dirname "$rel")"
          cp -r "$pth" "/config/.vssp_www_keep/$rel"
        done
        for e in /config/.vssp_stage/www/* /config/.vssp_stage/www/.[!.]*; do
          [ -e "$e" ] || continue
          n=$(basename "$e")
          rm -rf /config/www/$n
          mv "$e" /config/www/$n
        done
        find /config/.vssp_www_keep -type f | while read -r kept; do
          rel=${kept#/config/.vssp_www_keep/}
          if [ ! -e "/config/www/$rel" ]; then
            mkdir -p "/config/www/$(dirname "$rel")"
            cp "$kept" "/config/www/$rel"
            echo "[i] preserved pod-side state: www/$rel"
          fi
        done
        rm -rf /config/.vssp_www_keep
        rmdir /config/.vssp_stage/www 2>/dev/null || true
        mv /config/.vssp_stage/VSSP_VERSION /config/VSSP_VERSION
        mv /config/.vssp_stage/VSSP_LOCALE  /config/VSSP_LOCALE
        # EN | Deploy ALL vssp/ tooling + the fragment to their /config location.
        # EN | The copy is additive: /config/vssp/.livebox.env (secret) and
        # EN | /config/vssp/backups/ are left untouched.
        # FR | Deployer TOUT l outillage vssp/ + le fragment a leur emplacement
        # FR | /config. La copie est additive : /config/vssp/.livebox.env (secret)
        # FR | et /config/vssp/backups/ ne sont pas touches.
        mkdir -p /config/vssp
        cp -r /config/.vssp_stage/vssp/. /config/vssp/
        rm -rf /config/.vssp_stage/vssp
        chmod +x /config/vssp/*.py
        # EN | The MCP server package. Home Assistant never imports it -
        # EN | the container that serves it does, over the mapped config
        # EN | directory. Deployed here so a new version arrives with a
        # EN | deploy rather than an add-on rebuild. Replaced wholesale
        # EN | rather than merged: unlike vssp/, nothing local belongs in
        # EN | it, so a file that vanished from the repository must vanish
        # EN | here too.
        # FR | Le paquet du serveur MCP. Home Assistant ne l importe jamais -
        # FR | c est le conteneur qui le sert qui le fait, via le repertoire
        # FR | de configuration mappe. Deploye ici pour qu une nouvelle
        # FR | version arrive par un deploiement plutot que par une
        # FR | reconstruction d add-on. Remplace en bloc plutot que fusionne :
        # FR | contrairement a vssp/, rien de local n y a sa place, donc un
        # FR | fichier disparu du depot doit disparaitre ici aussi.
        rm -rf /config/vssp_mcp
        mkdir -p /config/vssp_mcp
        cp -r /config/.vssp_stage/vssp_mcp/. /config/vssp_mcp/
        rm -rf /config/.vssp_stage/vssp_mcp
        mv /config/.vssp_stage/config-fragment.yaml /config/config-fragment.yaml
        mv /config/.vssp_stage/config-fragment-rooms.yaml /config/config-fragment-rooms.yaml
        # EN | Packages (additive: does not overwrite non-vssp packages)
        # FR | Packages (additif : n ecrase pas d eventuels packages non-vssp)
        mkdir -p /config/packages
        cp -r /config/.vssp_stage/packages/. /config/packages/
        rm -rf /config/.vssp_stage/packages
        # --- EN | WHITELIST GUARD #2 / FR | GARDE-FOU liste blanche n2 ---
        # EN | Each step above removes from staging what it handled. Whatever
        # EN | remains was packaged but has no destination: exactly the bug seen
        # EN | on vssp/. We fail instead of silently deleting it.
        # FR | Chaque etape ci-dessus retire du staging ce quelle a traite. Ce
        # FR | qui reste a ete package mais na aucune destination : cest
        # FR | exactement le bug constate sur vssp/. On echoue au lieu de
        # FR | leffacer en silence.
        LEFT=$(find /config/.vssp_stage -type f 2>/dev/null)
        if [ -n "$LEFT" ]; then
          echo "[ERR] Files packaged but never deployed:"
          echo "$LEFT"
          echo "      Add their deployment to deploy:staging AND deploy:production."
          exit 1
        fi
        echo "[i] Actual content of /config/vssp:"
        ls -1 /config/vssp
      '
    # --- EN | PRESERVE LIVE ROOMS — before the pod re-renders anything ------
    # --- FR | PRESERVER LES PIECES EN DIRECT — avant que le pod ne rerende --
    # EN | The dashboards/ swap just above replaced house.yaml with the
    # EN | repository's own copy. rooms: is no longer purely git-authored
    # EN | though — vssp_rooms_apply.py writes it live from the ROOMS &
    # EN | FLOORS admin form — so that swap would otherwise silently revert
    # EN | every live room to whatever placeholder rooms the repo declares.
    # EN | Must run BEFORE "regenerate on the pod" below, or that step's own
    # EN | render (and everything a user sees right after this deploy) would
    # EN | still reflect the reverted list for one full cycle. ruamel.yaml
    # EN | verified/installed here too since this is now the first thing on
    # EN | the pod that needs it.
    # FR | L echange de dashboards/ ci-dessus vient de remplacer house.yaml
    # FR | par la copie du depot. rooms: n est plus purement redige via Git
    # FR | pour autant — vssp_rooms_apply.py l ecrit en direct depuis le
    # FR | formulaire ROOMS & FLOORS — donc cet echange ferait sinon revenir
    # FR | en silence chaque piece en direct aux pieces placeholder que le
    # FR | depot declare. Doit tourner AVANT « regenerer sur le pod »
    # FR | ci-dessous, sinon le rendu de cette etape (et tout ce qu un
    # FR | utilisateur voit juste apres ce deploiement) refleterait encore
    # FR | la liste revertee pendant un cycle complet. ruamel.yaml
    # FR | verifie/installe ici aussi puisque c est desormais la premiere
    # FR | chose sur le pod qui en a besoin.
    - |
      kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- sh -c '
        if python3 -c "import ruamel.yaml" 2>/dev/null; then
          echo "[OK] ruamel.yaml already present"
        else
          echo "[i] ruamel.yaml missing - installing (needed by vssp_preserve_rooms.py)"
          pip install ruamel.yaml --quiet --break-system-packages 2>/dev/null \
            || pip install ruamel.yaml --quiet 2>/dev/null || true
          if python3 -c "import ruamel.yaml" 2>/dev/null; then
            echo "[OK] ruamel.yaml installed"
          else
            echo "[ERR] ruamel.yaml could not be installed on this pod."
            echo "      Live room state cannot be preserved across this deploy."
            exit 1
          fi
        fi
        python3 /config/vssp/vssp_preserve_rooms.py \
          --fallback /config/vssp/house.yaml.live \
          --old /config/dashboards.old/model/house.yaml \
          --new /config/dashboards/model/house.yaml
      '
    # --- EN | REGENERATE ON THE POD — the model lives there ---------------
    # --- FR | REGENERER SUR LE POD — le modele y vit ----------------------
    # EN | The build already rendered every dashboard, which validates the
    # EN | templates and guarantees the locale matches VSSP_LOCALE. But two
    # EN | model files exist only on the instance:
    # EN |   energy_devices.yaml  written by vssp_energy_sync.py
    # EN |   house_rooms.yaml     written by the discovery wizard
    # EN | The CI cannot know them, so its ENERGY render shows an empty fleet
    # EN | even when the pod has just discovered ten devices — exactly the
    # EN | symptom of "No device detected" right after a successful sync.
    # EN | Re-rendering here, with the pod model and the deployed locale,
    # EN | reconciles both: the build stays the validation step, the pod
    # EN | produces what is actually served.
    # FR | Le build a deja rendu tous les dashboards, ce qui valide les
    # FR | templates et garantit que la langue correspond a VSSP_LOCALE. Mais
    # FR | deux fichiers du modele nexistent que sur linstance :
    # FR |   energy_devices.yaml  ecrit par vssp_energy_sync.py
    # FR |   house_rooms.yaml     ecrit par le Discovery Wizard
    # FR | La CI ne peut pas les connaitre, donc son rendu ENERGY affiche un
    # FR | parc vide meme quand le pod vient de decouvrir dix appareils —
    # FR | exactement le symptome du « Aucun appareil detecte » juste apres
    # FR | un sync reussi.
    # FR | Re-rendre ici, avec le modele du pod et la langue deployee,
    # FR | reconcilie les deux : le build reste letape de validation, le pod
    # FR | produit ce qui est reellement servi.
    #
    # EN | NON-FATAL on purpose. If it fails, the build render stays in place:
    # EN | valid dashboards, just an ENERGY panel without the discovered
    # EN | fleet. Blocking the whole deployment over it would be worse than
    # EN | the degradation, provided the degradation is stated loudly.
    # FR | NON BLOQUANT volontairement. En cas dechec, le rendu du build reste
    # FR | en place : des dashboards valides, avec un panneau ENERGY sans le
    # FR | parc decouvert. Bloquer tout le deploiement pour cela serait pire
    # FR | que la degradation, a condition de lannoncer clairement.
    - |
      kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- sh -c '
        LOCALE=$(cat /config/VSSP_LOCALE 2>/dev/null || echo en)
        echo "[i] regenerating on the pod, locale $LOCALE"
        python3 /config/vssp/generate_dashboards.py           --model      /config/dashboards/model/house.yaml           --rooms      /config/dashboards/model/house_rooms.yaml           --devices    /config/dashboards/model/energy_devices.yaml           --templates  /config/dashboards/templates_j2           --locales-dir /config/dashboards/locales           --static-fragment /config/config-fragment.yaml           --rooms-fragment  /config/config-fragment-rooms.yaml           --locale "$LOCALE"           --out /config/dashboards/views
      ' || {
        echo "[WARN] pod-side regeneration failed."
        echo "       The dashboards rendered by the build stay in place and are"
        echo "       valid, but ENERGY will show the repository model, which"
        echo "       holds no discovered device."
        echo "       Usual cause: jinja2 missing in the Home Assistant image."
        echo "       Re-run SYNC ENERGY from the ADMIN console to fix it in place."
      }

    # --- EN | REGENERATE THE THEME ON THE POD — same reasoning as above ----
    # --- FR | REGENERER LE THEME SUR LE POD — meme raisonnement que ci-dessus
    # EN | The `themes` directory swap a few steps up just replaced
    # EN | themes/visio_sapiens.yaml with the repository default — even
    # EN | though model/design_system.yaml was just preserved from the
    # EN | previous pod copy. Without this step, every deployment silently
    # EN | reverted any color applied from the THEME screen back to the
    # EN | repository defaults, with no error anywhere: the symptom that
    # EN | prompted this fix. --design-status-file keeps what the editor
    # EN | loads next in sync with what is actually deployed. NON-FATAL,
    # EN | same reasoning as the dashboard regeneration above.
    # FR | L echange du dossier `themes` quelques etapes plus haut vient de
    # FR | remplacer themes/visio_sapiens.yaml par le defaut du depot — meme
    # FR | si model/design_system.yaml vient d etre preserve depuis la copie
    # FR | precedente du pod. Sans cette etape, chaque deploiement annulait en
    # FR | silence toute couleur appliquee depuis l ecran THEME pour revenir
    # FR | aux valeurs par defaut du depot, sans la moindre erreur nulle part
    # FR | — le symptome qui a motive ce correctif. --design-status-file
    # FR | garde le prochain chargement de l editeur synchronise avec ce qui
    # FR | est reellement deploye. NON BLOQUANT, meme raisonnement que la
    # FR | regeneration des dashboards ci-dessus.
    # --- EN | THE PREVIEW DASHBOARD, so its sidebar entry is not a dead
    # --- EN | link. config-fragment.yaml declares visio-sapiens-energy-
    # --- EN | preview with show_in_sidebar: true, and nothing ever wrote
    # --- EN | energy_preview.yaml: the entry was present and broken on all
    # --- EN | three environments, production included, since the day it was
    # --- EN | declared. The PREVIEW button overwrites this file when it is
    # --- EN | used; rendering it here only means the link always opens.
    # --- FR | LE DASHBOARD D APERCU, pour que son entree de barre laterale
    # --- FR | ne soit pas un lien mort. config-fragment.yaml declare
    # --- FR | visio-sapiens-energy-preview avec show_in_sidebar: true, et
    # --- FR | rien n ecrivait jamais energy_preview.yaml : l entree etait
    # --- FR | presente et cassee sur les trois environnements, production
    # --- FR | comprise, depuis le jour de sa declaration. Le bouton APERCU
    # --- FR | ecrase ce fichier quand on s en sert ; le rendre ici veut
    # --- FR | seulement dire que le lien s ouvre toujours.
    # --- EN | SELECT THE THEME. Generating it is not enough: the selection
    # --- EN | is a preference, and production was measured with
    # --- EN | default_theme = "default" - its users only saw the interface
    # --- EN | because each had chosen the theme in their own profile, and a
    # --- EN | browser never used there would have shown a bare page. The
    # --- EN | automation in vssp_theme.yaml does this at start-up; a deploy
    # --- EN | that reloads rather than restarts would not have triggered it.
    # --- FR | SELECTIONNER LE THEME. Le generer ne suffit pas : la selection
    # --- FR | est une preference, et la production a ete mesuree avec
    # --- FR | default_theme = « default » - ses utilisateurs ne voyaient
    # --- FR | l interface que parce que chacun avait choisi le theme dans son
    # --- FR | profil, et un navigateur jamais utilise la-bas aurait affiche
    # --- FR | une page nue. L automatisation de vssp_theme.yaml le fait au
    # --- FR | demarrage ; un deploiement qui recharge sans redemarrer ne
    # --- FR | l aurait pas declenchee.
    - |
      kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- sh -c '
        python3 /config/vssp/vssp_prepare.py --theme-only --url http://localhost:8123
      ' || echo "[warn] the theme could not be selected - dashboards may render unstyled"

    - |
      kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- sh -c '
        LOCALE=$(cat /config/VSSP_LOCALE 2>/dev/null || echo en)
        echo "[i] rendering the preview dashboard on the pod"
        python3 /config/vssp/generate_dashboards.py --only energy --preview           --model /config/dashboards/model/house.yaml           --rooms /config/dashboards/model/house_rooms.yaml           --devices /config/dashboards/model/energy_devices.yaml           --templates /config/dashboards/templates_j2           --locales-dir /config/dashboards/locales           --locale "$LOCALE"           --out /config/dashboards/views
      ' || echo "[warn] the preview dashboard was not rendered - its sidebar entry stays empty"

    - |
      kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- sh -c '
        LOCALE=$(cat /config/VSSP_LOCALE 2>/dev/null || echo en)
        echo "[i] regenerating the theme on the pod, locale $LOCALE"
        python3 /config/vssp/generate_dashboards.py --only theme           --model /config/dashboards/model/house.yaml           --design-model /config/dashboards/model/design_system.yaml           --templates /config/dashboards/templates_j2           --locales-dir /config/dashboards/locales           --locale "$LOCALE"           --themes-out /config/themes           --design-status-file /config/www/vssp/design_system_status.json
      ' || {
        echo "[WARN] pod-side theme regeneration failed."
        echo "       themes/visio_sapiens.yaml stays at the repository default"
        echo "       for this deployment — any THEME screen edit made before"
        echo "       this deploy is not reflected until the next successful"
        echo "       APPLY from the ADMIN console."
      }

    # --- EN | Router secret: written from the masked CI/CD variable ---------
    # --- FR | SECRET Livebox : ecrit depuis la variable CI/CD masquee -------
    # EN | The password is passed as an ARGUMENT to the remote shell ($1),
    # EN | never inside the command string: no leak through `ps` or the logs.
    # FR | Le mot de passe passe en ARGUMENT du shell distant ($1), jamais dans
    # FR | la chaine de commande : pas de fuite via `ps` ni via les logs.
    - |
      if [ -z "$LIVEBOX_PASSWORD" ]; then
        echo "[warn] LIVEBOX_PASSWORD missing - router probes inactive."
        echo "       Router/switch panels will show their demo values."
        echo "       Settings > CI/CD > Variables."
      else
        kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- sh -c \
          'umask 077; printf "LIVEBOX_PASSWORD=%s\n" "$1" > /config/vssp/.livebox.env' \
          sh "$LIVEBOX_PASSWORD"
        echo "[OK] Router secret deployed"
      fi
    # --- EN | MAINTENANCE TOKEN — the safe key the INFRASTRUCTURE family uses
    # --- FR | JETON DE MAINTENANCE — la cle du coffre qu utilise la famille
    # --- FR | INFRASTRUCTURE
    # EN | Same shape as the router secret above, and for the same reason:
    # EN | a value that must reach the instance without ever passing through
    # EN | the repository or through a Home Assistant entity. This one carries
    # EN | the vssp-maint policy, which can read secret/data/vssp/infra/* and
    # EN | nothing else — see vault/policies/vssp-maint.hcl.
    # EN | Its absence is not an error. The UPDATES screen keeps its four
    # EN | Home Assistant families and reports the infrastructure one as never
    # EN | probed, which is exactly what has happened.
    # FR | Meme forme que le secret du routeur ci-dessus, et pour la meme
    # FR | raison : une valeur qui doit atteindre l instance sans jamais passer
    # FR | par le depot ni par une entite Home Assistant. Celui-ci porte la
    # FR | policy vssp-maint, qui peut lire secret/data/vssp/infra/* et rien
    # FR | d autre — voir vault/policies/vssp-maint.hcl.
    # FR | Son absence n est pas une erreur. L ecran MISES A JOUR garde ses
    # FR | quatre familles Home Assistant et remonte celle de l infrastructure
    # FR | comme jamais sondee, ce qui est exactement ce qui s est passe.
    - |
      if [ -z "$VAULT_MAINT_TOKEN" ]; then
        echo "[warn] VAULT_MAINT_TOKEN missing - INFRASTRUCTURE updates inactive."
        echo "       The UPDATES screen will report the server as never probed."
        echo "       Settings > CI/CD > Variables, and see docs/platform/Vault.md."
      else
        kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- sh -c \
          'umask 077; printf "%s" "$1" > /config/vssp/.vault_maint_token' \
          sh "$VAULT_MAINT_TOKEN"
        echo "[OK] Maintenance token deployed"
      fi
    # --- EN | paramiko — the pod-side ssh client the probe falls back to ----
    # --- FR | paramiko — le client ssh cote pod sur lequel se rabat la sonde -
    # EN | Only installed when there is a token to use it with, and never
    # EN | fatal: the probe tries the ssh binary first, and an instance that
    # EN | has one needs none of this. Same treatment ruamel.yaml already
    # EN | gets above, minus the hard failure — a missing ssh client costs one
    # EN | family on one screen, not the deployment.
    # FR | Installe seulement quand il y a un jeton pour s en servir, et jamais
    # FR | fatal : la sonde essaie d abord le binaire ssh, et une instance qui
    # FR | en a un n a besoin de rien de tout ceci. Meme traitement que
    # FR | ruamel.yaml plus haut, sans l echec bloquant — un client ssh absent
    # FR | coute une famille sur un ecran, pas le deploiement.
    - |
      if [ -n "$VAULT_MAINT_TOKEN" ]; then
        kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- sh -c '
          if command -v ssh >/dev/null 2>&1; then
            echo "[OK] ssh binary present - paramiko not needed"
          elif python3 -c "import paramiko" 2>/dev/null; then
            echo "[OK] paramiko already present"
          else
            echo "[i] no ssh client - installing paramiko for the infra probe"
            pip install paramiko --quiet --break-system-packages 2>/dev/null \
              || pip install paramiko --quiet 2>/dev/null || true
            python3 -c "import paramiko" 2>/dev/null \
              && echo "[OK] paramiko installed" \
              || echo "[warn] no ssh transport on this pod - INFRASTRUCTURE stays unprobed"
          fi
        ' || true
      fi
    # --- EN | configuration.yaml patch (idempotent, with .bak backup) -------
    # --- FR | PATCH configuration.yaml (idempotent, avec backup .bak) -------
    - |
      kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- sh -c '
        set -e
        # EN | Last line of defence before the fragment is merged into
        # EN | configuration.yaml. A raw __T: here would become a dashboard
        # EN | title in the sidebar, and only a restart would clear it.
        # FR | Derniere ligne de defense avant fusion du fragment dans
        # FR | configuration.yaml. Un __T: brut ici deviendrait un titre de
        # FR | dashboard dans la sidebar, et seul un redemarrage l effacerait.
        if grep -En "__T:[A-Za-z0-9_.]+__" /config/config-fragment.yaml; then
          echo "[ERR] /config/config-fragment.yaml still holds translation placeholders."
          echo "      It was deployed without passing through vssp_i18n.py render."
          exit 1
        fi
        # EN | Verified, not just attempted: vssp_assign_apply.py and
        # EN | vssp_rooms_apply.py both exit immediately when ruamel.yaml is
        # EN | absent, and that failure is otherwise invisible until someone
        # EN | tries to save a room or a device assignment on the deployed
        # EN | instance and gets a generic "rejected" notification with no
        # EN | clue why. A plain `pip install` with its errors thrown away
        # EN | cannot tell the difference between "already there" and
        # EN | "failed silently".
        # FR | Verifie, pas seulement tente : vssp_assign_apply.py et
        # FR | vssp_rooms_apply.py quittent immediatement si ruamel.yaml est
        # FR | absent, et cet echec reste invisible jusqu a ce que quelqu un
        # FR | essaie d enregistrer une piece ou une assignation sur
        # FR | l instance deployee et recoive une notification generique
        # FR | "rejetee" sans aucun indice. Un simple `pip install` dont les
        # FR | erreurs sont jetees ne peut pas distinguer "deja present" de
        # FR | "echoue en silence".
        if python3 -c "import ruamel.yaml" 2>/dev/null; then
          echo "[OK] ruamel.yaml already present"
        else
          echo "[i] ruamel.yaml missing - installing (needed by vssp_assign_apply.py / vssp_rooms_apply.py)"
          pip install ruamel.yaml --quiet --break-system-packages 2>/dev/null \
            || pip install ruamel.yaml --quiet 2>/dev/null || true
          if python3 -c "import ruamel.yaml" 2>/dev/null; then
            echo "[OK] ruamel.yaml installed"
          else
            echo "[ERR] ruamel.yaml could not be installed on this pod."
            echo "      ROOMS sync and ASSIGN save will reject every request"
            echo "      until this is fixed. See docs/platform/Deployment.md."
            exit 1
          fi
        fi
        # EN | rooms: already preserved by the dedicated step earlier (right
        # EN | after the dashboards/ swap, before the pod-side regeneration
        # EN | rendered anything) — nothing left to do for it here.
        # FR | rooms: deja preserve par l etape dediee plus tot (juste apres
        # FR | l echange de dashboards/, avant que la regeneration cote pod
        # FR | ne rende quoi que ce soit) — plus rien a faire ici pour ca.
        python3 /config/vssp/vssp_apply_config.py \
          --config   /config/configuration.yaml \
          --fragment /config/config-fragment.yaml /config/config-fragment-rooms.yaml \
          --prune-dashboards \
          --prune-resources \
          --vtoken   "'"$VSSP_BUILD"'"
        # EN | The patcher does not handle the homeassistant domain: this
        # EN | script sets (idempotently) the packages key loading /config/packages/
        # FR | Le patcher ne gere pas le domaine homeassistant : ce script pose
        # FR | (idempotent) la cle packages qui charge /config/packages/
        python3 /config/vssp/vssp_ensure_packages.py \
          --config /config/configuration.yaml
        # EN | packages/vssp_vault.yaml says `!secret vault_ha_token`. A
        # EN | secrets.yaml that does not define it does NOT produce a
        # EN | broken sensor — it produces a Home Assistant that refuses to
        # EN | start, taking every dashboard with it, over one missing
        # EN | line. And the package ships from here, so the breakage would
        # EN | land on an instance whose owner never asked for the safe.
        # EN | Seeded empty, the failure is proportionate: Vault answers
        # EN | 403, the safe reads as unreachable, everything else works.
        # EN | Never overwrites an existing value.
        # FR | packages/vssp_vault.yaml dit `!secret vault_ha_token`. Un
        # FR | secrets.yaml qui ne la definit pas ne produit PAS un capteur
        # FR | casse — il produit un Home Assistant qui refuse de demarrer,
        # FR | emportant chaque dashboard, pour une ligne manquante. Et le
        # FR | package part d ici, donc la panne atterrirait sur une
        # FR | instance dont le proprietaire n a jamais demande le coffre.
        # FR | Amorcee vide, la defaillance est proportionnee : Vault
        # FR | repond 403, le coffre se lit comme injoignable, tout le
        # FR | reste fonctionne. N ecrase jamais une valeur existante.
        python3 /config/vssp/vssp_ensure_secret.py \
          --config /config/secrets.yaml \
          --key vault_ha_token \
          --comment "Visio Sapiens - jeton Vault, policy vssp-ha (noms, jamais valeurs). Voir docs/platform/Vault.md."
        # EN | The patcher dedupes resources by full URL: since ?v= changes on
        # EN | every build, each deployment used to ADD 6 entries. We clean up.
        # FR | Le patcher dedupe les ressources par URL complete : le ?v=
        # FR | changeant a chaque build, chaque deploiement AJOUTAIT 6 entrees.
        # FR | On assainit.
        python3 /config/vssp/vssp_sanitize_resources.py \
          --config /config/configuration.yaml
      '
    - |
      if ! kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- hass --script check_config -c /config; then
        echo "[ERR] Invalid config - rolling back staging"
        kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- sh -c '
          for d in dashboards themes; do
            [ -d /config/$d.old ] && rm -rf /config/$d && mv /config/$d.old /config/$d
          done
          # EN | Restore configuration.yaml from the latest .bak backup
          # FR | Restaurer configuration.yaml depuis le dernier backup .bak
          LAST_BAK=$(ls -t /config/backups/configuration_*.bak 2>/dev/null | head -1)
          [ -n "$LAST_BAK" ] && cp "$LAST_BAK" /config/configuration.yaml && echo "[rollback] configuration.yaml restored from $LAST_BAK"'
        exit 1
      fi
    - kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- sh -c 'rm -rf /config/dashboards.old /config/themes.old /config/.vssp_stage /config/.vssp.tar.gz'
    # --- EN | HOME ASSISTANT RESTART - MANDATORY STEP -----------------------
    # --- FR | REDEMARRAGE DE HOME ASSISTANT - ETAPE INDISPENSABLE -----------
    # EN | configuration.yaml is only re-read at startup: dashboards
    # EN | (lovelace.dashboards) and packages are NOT picked up hot. Without
    # EN | this step the job finished green while the instance kept serving the
    # EN | old configuration - the new content only appeared at the next
    # EN | accidental pod restart. Production already did `ha core restart`,
    # EN | staging did not.
    # FR | configuration.yaml n'est relu qu'au demarrage : les dashboards
    # FR | (lovelace.dashboards) et les packages ne sont PAS pris en compte a
    # FR | chaud. Sans cette etape, le job finissait en vert alors que
    # FR | l'instance continuait a servir l'ancienne configuration - les
    # FR | nouveautes n'apparaissaient qu'au prochain redemarrage fortuit du
    # FR | pod. La production faisait deja un `ha core restart`, pas le staging.
    #
    # EN | Normal path: homeassistant.restart service through the REST API.
    # EN | Fallback: recreate the pod (works for Deployment and StatefulSet).
    # FR | Voie normale : service homeassistant.restart via l'API REST.
    # FR | Repli : recreation du pod (fonctionne pour Deployment et StatefulSet).
    - |
      code=000
      if [ -n "$HA_TOKEN_STAGING" ] && command -v curl >/dev/null 2>&1; then
        code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 -X POST \
          -H "Authorization: Bearer $HA_TOKEN_STAGING" \
          -H "Content-Type: application/json" \
          "$STAGING_URL/api/services/homeassistant/restart" || echo 000)
        echo "[i] homeassistant.restart -> HTTP $code"
      else
        echo "[i] HA_TOKEN_STAGING missing or curl unavailable"
      fi
      if [ "$code" != "200" ]; then
        echo "[i] Fallback: recreating pod $HA_POD"
        kubectl delete pod -n $K3S_NAMESPACE $HA_POD --wait=false
        kubectl wait --for=delete pod/$HA_POD -n $K3S_NAMESPACE --timeout=120s || true
        kubectl wait --for=condition=ready pod -n $K3S_NAMESPACE \
          -l app=homeassistant --timeout=300s || true
      fi
    # EN | Wait for the API to come back: prevents test:staging from failing
    # EN | against an instance that is still booting.
    # FR | Attente du retour de l'API : evite que test:staging echoue sur une
    # FR | instance encore en cours de demarrage.
    - |
      if command -v curl >/dev/null 2>&1 && [ -n "$HA_TOKEN_STAGING" ]; then
        for i in $(seq 1 36); do
          c=$(curl -s -o /dev/null -w '%{http_code}' -m 5 \
              -H "Authorization: Bearer $HA_TOKEN_STAGING" "$STAGING_URL/api/" || echo 000)
          [ "$c" = "200" ] && echo "[OK] HA restarted and reachable" && break
          echo "[..] Waiting for restart ($i/36) - HTTP $c"
          sleep 5
        done
      else
        sleep 45
      fi
    # --- EN | RE-VERIFY ruamel.yaml ON WHATEVER POD IS SERVING NOW ----------
    # --- FR | RE-VERIFIER ruamel.yaml SUR LE POD REELLEMENT EN SERVICE ------
    # EN | The install above ran on $HA_POD BEFORE this restart step. If the
    # EN | restart took the `homeassistant.restart` path, that is still the
    # EN | same container filesystem and this is redundant but harmless. If
    # EN | it fell back to `kubectl delete pod`, $HA_POD no longer exists — a
    # EN | Deployment replaces it with a new pod, from the image, with none of
    # EN | what was pip-installed into the old one's filesystem. Re-resolving
    # EN | the pod name and checking again is the only way to know which case
    # EN | happened and to fix it before the next Discovery Scan / Save
    # EN | silently rejects everything on a pod nobody suspects just restarted.
    # FR | L installation ci-dessus a tourne sur $HA_POD AVANT cette etape de
    # FR | redemarrage. Si le redemarrage a pris le chemin
    # FR | `homeassistant.restart`, c est toujours le meme systeme de fichiers
    # FR | de conteneur et ceci est redondant mais inoffensif. S il est passe
    # FR | par le repli `kubectl delete pod`, $HA_POD n existe plus — un
    # FR | Deployment le remplace par un nouveau pod, depuis l image, sans rien
    # FR | de ce qui avait ete pip-installe dans l ancien. Re-resoudre le nom
    # FR | du pod et reverifier est le seul moyen de savoir quel cas s est
    # FR | produit et de le corriger avant que le prochain Discovery Scan /
    # FR | Save ne rejette tout en silence sur un pod dont personne ne
    # FR | soupconne qu il vient de redemarrer.
    - |
      export HA_POD=$(kubectl get pod -n $K3S_NAMESPACE -l app=homeassistant -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
      if [ -z "$HA_POD" ]; then
        export HA_POD=$(kubectl get pods -n $K3S_NAMESPACE -o jsonpath='{.items[0].metadata.name}')
      fi
      echo "[i] Verifying ruamel.yaml on the pod actually serving now: $HA_POD"
      kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- sh -c '
        if python3 -c "import ruamel.yaml" 2>/dev/null; then
          echo "[OK] ruamel.yaml present on $(hostname)"
        else
          echo "[i] ruamel.yaml missing on $(hostname) - installing (pod was recreated since the earlier install)"
          pip install ruamel.yaml --quiet --break-system-packages 2>/dev/null \
            || pip install ruamel.yaml --quiet 2>/dev/null || true
          if python3 -c "import ruamel.yaml" 2>/dev/null; then
            echo "[OK] ruamel.yaml installed"
          else
            echo "[ERR] ruamel.yaml could not be installed on this pod."
            echo "      ROOMS sync and ASSIGN save will reject every request"
            echo "      until this is fixed. See docs/platform/Deployment.md."
            exit 1
          fi
        fi
      '
    # EN | Verification trace: what HA ACTUALLY loaded.
    # FR | Trace de verification : ce que HA a REELLEMENT charge.
    - |
      echo "[i] Version deployed inside the container:"
      kubectl exec -n $K3S_NAMESPACE $HA_POD -c $K3S_CONTAINER -- \
        cat /config/VSSP_VERSION 2>/dev/null || echo "  (unexpected: $HA_POD was just re-resolved above)"
    - echo "[OK] Staging up to date"

# ============================================================================
# EN | 3b. DEPLOY PRODUCTION — HAOS 18.1, tags only, manual gate
# FR | 3b. DEPLOY PRODUCTION — HAOS 18.1, tags uniquement, gate manuelle
# ============================================================================
# ============================================================================
# EN | THE APPLIANCE DEPLOY, ONCE, FOR EVERY APPLIANCE.
# FR | LE DEPLOIEMENT APPAREIL, UNE FOIS, POUR CHAQUE APPAREIL.
#
# EN | This was deploy:production's script and nothing about it changed when
# EN | it moved here. It is lifted out because there is now more than one
# EN | Home Assistant OS appliance to deploy to: the production mini PC, and
# EN | the KubeVirt VM in the `haos` namespace that gives staging a real
# EN | Supervisor (see kubernetes/haos/). Both are reached the same way -
# EN | over ssh, through the `ha` alias that .ssh_bootstrap writes from
# EN | $HA_HOST / $HA_SSH_PORT / $HA_SSH_KEY - so both run exactly these
# EN | steps and differ only in variables.
# EN | The alternative was a second 500-line copy. This project already
# EN | carries two near-duplicate deploy jobs, and that duplication has cost
# EN | real time: vssp_mcp had to be added to both, and an apostrophe bug hit
# EN | only one of them because the two are quoted differently. One more copy
# EN | was not the answer.
# EN | $VSSP_DEPLOY_REF replaces the four functional uses of $CI_COMMIT_TAG:
# EN | the log line, the pre-deploy backup name, the resource cache-busting
# EN | token and the closing message. On production it IS $CI_COMMIT_TAG, so
# EN | nothing about a tagged release changes.
# FR | C'etait le script de deploy:production et rien n'y a change en
# FR | demenageant. Il est extrait parce qu'il y a desormais plus d'un
# FR | appareil Home Assistant OS ou deployer : le mini PC de production, et
# FR | la VM KubeVirt du namespace `haos` qui donne a la preproduction un
# FR | vrai Superviseur (voir kubernetes/haos/). Les deux se joignent de la
# FR | meme facon - en ssh, via l'alias `ha` que .ssh_bootstrap ecrit depuis
# FR | $HA_HOST / $HA_SSH_PORT / $HA_SSH_KEY - donc les deux executent
# FR | exactement ces etapes et ne different que par des variables.
# FR | L'alternative etait une seconde copie de 500 lignes. Ce projet porte
# FR | deja deux jobs de deploiement quasi jumeaux, et cette duplication a
# FR | coute du temps reel : vssp_mcp a du etre ajoute aux deux, et un bug
# FR | d'apostrophe n'a frappe que l'un des deux parce qu'ils ne sont pas
# FR | cites pareil. Une copie de plus n'etait pas la reponse.
# FR | $VSSP_DEPLOY_REF remplace les quatre usages fonctionnels de
# FR | $CI_COMMIT_TAG : la ligne de log, le nom de la sauvegarde d'avant
# FR | deploiement, le jeton de cache-busting des ressources et le message
# FR | final. En production il VAUT $CI_COMMIT_TAG, donc rien ne change pour
# FR | une release taguee.
# ============================================================================
.deploy_appliance:
  script:
    - echo "APPLIANCE deployment (HAOS) - $VSSP_DEPLOY_REF -> $HA_HOST"
    - export HA_CFG=$(ssh ha '[ -d /homeassistant ] && echo /homeassistant || echo /config')
    - echo "HAOS config ->" "$HA_CFG"
    - ssh ha "ha backups new --name 'pre-$VSSP_DEPLOY_REF' --no-progress" || echo "[warn] backup not created"
    - cat $PACKAGE_NAME.tar.gz | ssh ha "rm -rf $HA_CFG/.vssp_stage && mkdir -p $HA_CFG/.vssp_stage && tar xzf - -C $HA_CFG/.vssp_stage"
    - |
      ssh ha "set -e
        # EN | Last-good rooms set aside before the rotation, same rule and
        # EN | same reason as staging — see the full explanation there.
        # FR | Dernieres pieces valides mises de cote avant la rotation, meme
        # FR | regle et meme raison qu en staging — voir l explication
        # FR | complete la-bas.
        mkdir -p $HA_CFG/vssp
        if [ -f $HA_CFG/dashboards/model/house.yaml ]; then
          cp $HA_CFG/dashboards/model/house.yaml $HA_CFG/vssp/house.yaml.live
        fi
        for d in dashboards themes; do
          rm -rf $HA_CFG/\$d.old
          [ -d $HA_CFG/\$d ] && mv $HA_CFG/\$d $HA_CFG/\$d.old
          mv $HA_CFG/.vssp_stage/\$d $HA_CFG/\$d
        done
        # EN | Pod-side state, same rule as staging: energy_devices.yaml,
        # EN | house_rooms.yaml, design_system.yaml (THEME screen) and the
        # EN | hand-edited HOME dashboard are written on the instance, never
        # EN | shipped — see the full explanation on the staging job.
        # FR | Etat cote pod, meme regle qu'en staging : energy_devices.yaml,
        # FR | house_rooms.yaml, design_system.yaml (ecran THEME) et le
        # FR | dashboard HOME edite a la main sont ecrits sur l'instance,
        # FR | jamais livres — voir l'explication complete sur le job staging.
        for f in model/energy_devices.yaml model/house_rooms.yaml model/design_system.yaml; do
          if [ -f $HA_CFG/dashboards.old/\$f ]; then
            mkdir -p $HA_CFG/dashboards/\$(dirname \$f)
            cp $HA_CFG/dashboards.old/\$f $HA_CFG/dashboards/\$f
            echo \"[i] preserved pod-side state: \$f\"
          fi
        done
        # EN | EVERY VIEW THE POD STILL HAS AND THE PACKAGE DOES NOT.
        # EN | Listing view files one by one was wrong twice over: the package
        # EN | no longer carries the on-demand dashboards at all, and it never
        # EN | carried the room dashboards, which are generated on the pod from
        # EN | a model only the pod has. A deployment therefore deleted every
        # EN | room page and they only came back because the pod-side
        # EN | regeneration below rebuilt them - which stops the moment the
        # EN | model no longer declares those rooms, as happened here: four
        # EN | room dashboards, restored from backup, wiped again by the next
        # EN | deployment.
        # EN | The rule is the same for all of them: a view the new package
        # EN | does not provide but the instance had is INSTANCE state, so it
        # EN | is copied back. A deactivated dashboard is absent from
        # EN | dashboards.old and stays absent; a deleted one likewise.
        # FR | TOUTE VUE QUE LE POD A ENCORE ET QUE LE PAQUET N A PAS.
        # FR | Lister les vues une par une etait faux deux fois : le paquet ne
        # FR | transporte plus du tout les dashboards a la demande, et il n a
        # FR | jamais transporte les dashboards de piece, generes sur le pod
        # FR | depuis un modele que seul le pod possede. Un deploiement
        # FR | supprimait donc toutes les pages de piece, et elles ne
        # FR | revenaient que parce que la regeneration cote pod plus bas les
        # FR | reconstruisait - ce qui s arrete des que le modele ne declare
        # FR | plus ces pieces, exactement ce qui est arrive ici : quatre
        # FR | dashboards de piece, restaures depuis une sauvegarde, effaces a
        # FR | nouveau par le deploiement suivant.
        # FR | La regle vaut pour toutes : une vue que le nouveau paquet ne
        # FR | fournit pas mais que l instance avait est un etat D INSTANCE,
        # FR | donc on la recopie. Un dashboard desactive est absent de
        # FR | dashboards.old et reste absent ; un dashboard supprime aussi.
        if [ -d $HA_CFG/dashboards.old/views ]; then
          mkdir -p $HA_CFG/dashboards/views
          for v in $HA_CFG/dashboards.old/views/*.yaml; do
            [ -e \"\$v\" ] || continue
            b=\$(basename \"\$v\")
            if [ ! -f $HA_CFG/dashboards/views/\$b ]; then
              cp \"\$v\" $HA_CFG/dashboards/views/\$b
              echo \"[i] preserved pod-side view: \$b\"
            fi
          done
        fi
        # EN | www/: ALL package entries, not just vssp/
        # FR | www/ : TOUTES les entrees du paquet, pas seulement vssp/
        mkdir -p $HA_CFG/www
        # EN | Pod-side state under www/, same rule as staging: the wizard
        # EN | status files, the drawn floor plan and the fetched product
        # EN | photos are written on the instance, never shipped — see the
        # EN | full explanation on the staging job.
        # FR | Etat cote pod sous www/, meme regle qu en staging : les
        # FR | fichiers de statut des assistants, le plan dessine et les
        # FR | photos produit recuperees sont ecrits sur l instance, jamais
        # FR | livres — voir l explication complete sur le job staging.
        rm -rf $HA_CFG/.vssp_www_keep
        mkdir -p $HA_CFG/.vssp_www_keep
        for pth in $HA_CFG/www/vssp/*.json $HA_CFG/www/vssp/images/floorplan.svg $HA_CFG/www/vssp/modules; do
          [ -e \"\$pth\" ] || continue
          rel=\${pth#$HA_CFG/www/}
          mkdir -p \"$HA_CFG/.vssp_www_keep/\$(dirname \"\$rel\")\"
          cp -r \"\$pth\" \"$HA_CFG/.vssp_www_keep/\$rel\"
        done
        for e in $HA_CFG/.vssp_stage/www/* $HA_CFG/.vssp_stage/www/.[!.]*; do
          [ -e \"\$e\" ] || continue
          n=\$(basename \"\$e\")
          rm -rf $HA_CFG/www/\$n
          mv \"\$e\" $HA_CFG/www/\$n
        done
        find $HA_CFG/.vssp_www_keep -type f | while read -r kept; do
          rel=\${kept#$HA_CFG/.vssp_www_keep/}
          if [ ! -e \"$HA_CFG/www/\$rel\" ]; then
            mkdir -p \"$HA_CFG/www/\$(dirname \"\$rel\")\"
            cp \"\$kept\" \"$HA_CFG/www/\$rel\"
            echo \"[i] preserved pod-side state: www/\$rel\"
          fi
        done
        rm -rf $HA_CFG/.vssp_www_keep
        rmdir $HA_CFG/.vssp_stage/www 2>/dev/null || true
        mv $HA_CFG/.vssp_stage/VSSP_VERSION $HA_CFG/VSSP_VERSION
        mv $HA_CFG/.vssp_stage/VSSP_LOCALE  $HA_CFG/VSSP_LOCALE
        # EN | Deploy ALL vssp/ tooling (patchers, probes, generators).
        # EN | The scripts HA itself runs through command_line sensors
        # EN | (vssp_lan_probe.py...) MUST exist on the HAOS side: without them
        # EN | the sensors stay unavailable. Additive copy: .livebox.env and
        # EN | backups/ already present on HAOS are preserved.
        # FR | Deployer TOUT l outillage vssp/ (patchers, sondes, generateurs).
        # FR | Les scripts executes par HA lui-meme via les capteurs
        # FR | command_line (vssp_lan_probe.py...) DOIVENT exister cote HAOS :
        # FR | sans eux les capteurs restent unavailable. Copie additive :
        # FR | .livebox.env et backups/ deja presents cote HAOS sont preserves.
        mkdir -p $HA_CFG/vssp
        cp -r $HA_CFG/.vssp_stage/vssp/. $HA_CFG/vssp/
        rm -rf $HA_CFG/.vssp_stage/vssp
        chmod +x $HA_CFG/vssp/*.py
        # EN | The MCP server package (identical to staging). Read by the
        # EN | vssp-mcp add-on through its read-only config mapping; Home
        # EN | Assistant itself never imports it.
        # FR | Le paquet du serveur MCP (identique au staging). Lu par
        # FR | l add-on vssp-mcp via son mappage de configuration en lecture
        # FR | seule ; Home Assistant lui-meme ne l importe jamais.
        rm -rf $HA_CFG/vssp_mcp
        mkdir -p $HA_CFG/vssp_mcp
        cp -r $HA_CFG/.vssp_stage/vssp_mcp/. $HA_CFG/vssp_mcp/
        rm -rf $HA_CFG/.vssp_stage/vssp_mcp
        mv $HA_CFG/.vssp_stage/config-fragment.yaml $HA_CFG/config-fragment.yaml
        mv $HA_CFG/.vssp_stage/config-fragment-rooms.yaml $HA_CFG/config-fragment-rooms.yaml
        # EN | Packages (additive: does not overwrite non-vssp packages)
        # FR | Packages (additif : n ecrase pas d eventuels packages non-vssp)
        mkdir -p $HA_CFG/packages
        cp -r $HA_CFG/.vssp_stage/packages/. $HA_CFG/packages/
        rm -rf $HA_CFG/.vssp_stage/packages
        # EN | WHITELIST GUARD #2 (identical to staging)
        # FR | GARDE-FOU liste blanche n2 (identique au staging)
        LEFT=\$(find $HA_CFG/.vssp_stage -type f 2>/dev/null)
        if [ -n \"\$LEFT\" ]; then
          echo '[ERR] Files packaged but never deployed:'
          echo \"\$LEFT\"
          echo '      Add their deployment to deploy:staging AND deploy:production.'
          exit 1
        fi
        rm -rf $HA_CFG/.vssp_stage
        echo '[i] Actual content of vssp/:'
        ls -1 $HA_CFG/vssp"
    # --- EN | Router secret: passed over STDIN, never on the remote command
    # ---      line (invisible in `ps` on the HAOS side).
    # --- FR | SECRET Livebox : transmis par STDIN, jamais sur la ligne de
    # ---      commande distante (invisible dans `ps` cote HAOS).
    - |
      if [ -z "$LIVEBOX_PASSWORD" ]; then
        echo "[warn] LIVEBOX_PASSWORD missing - router probes inactive."
      else
        printf 'LIVEBOX_PASSWORD=%s\n' "$LIVEBOX_PASSWORD" \
          | ssh ha "umask 077; cat > $HA_CFG/vssp/.livebox.env"
        echo "[OK] Router secret deployed"
      fi
    # --- EN | MAINTENANCE TOKEN — see the staging job for the reasoning -----
    # --- FR | JETON DE MAINTENANCE — voir le job staging pour le raisonnement
    # EN | `printf %s` without a newline, deliberately: the script strips
    # EN | whitespace when it reads the file, but a token that arrives with a
    # EN | trailing newline in one place and without it in another is the kind
    # EN | of difference that makes staging work and production return 403.
    # FR | `printf %s` sans saut de ligne, deliberement : le script elague les
    # FR | blancs a la lecture, mais un jeton qui arrive avec un saut de ligne
    # FR | ici et sans la est le genre d ecart qui fait marcher le staging et
    # FR | renvoyer 403 en production.
    - |
      if [ -z "$VAULT_MAINT_TOKEN" ]; then
        echo "[warn] VAULT_MAINT_TOKEN missing - INFRASTRUCTURE updates inactive."
        echo "       The UPDATES screen will report the server as never probed."
      else
        printf '%s' "$VAULT_MAINT_TOKEN" \
          | ssh ha "umask 077; cat > $HA_CFG/vssp/.vault_maint_token"
        echo "[OK] Maintenance token deployed"
      fi
    # --- EN | VAULT ADD-ON (HAOS only) --------------------------------------
    # --- FR | ADD-ON VAULT (HAOS uniquement) --------------------------------
    # EN | On the k3s host the safe is a plain Docker container. HAOS cannot
    # EN | do that: the Supervisor owns the Docker daemon, there is no
    # EN | `docker compose`, and `docker exec` is unsupported. The supported
    # EN | route is a local add-on the Supervisor builds itself, which is
    # EN | what addons/vssp-vault is.
    # EN | Copied from the CHECKOUT, not from the package: putting addons/ in
    # EN | the tarball would trip WHITELIST GUARD #2 on staging, which is a
    # EN | k3s pod with no /addons and no Supervisor to install one — and the
    # EN | guard would be right to complain.
    # EN | Non-fatal. /addons is only reachable when the Terminal & SSH
    # EN | add-on maps it, and a production deploy has no business failing
    # EN | over an optional component; the message says what to do by hand.
    # EN | Copying the files does NOT install the add-on: the Supervisor has
    # EN | to be told to look, and someone has to press Install. That is
    # EN | deliberate — a safe should not appear and start on its own.
    # FR | Sur l hote k3s, le coffre est un simple conteneur Docker. HAOS ne
    # FR | peut pas faire cela : le Superviseur possede le demon Docker,
    # FR | `docker compose` n existe pas et `docker exec` n est pas supporte.
    # FR | La voie supportee est un add-on local que le Superviseur construit
    # FR | lui-meme, et c est ce qu est addons/vssp-vault.
    # FR | Copie depuis le DEPOT, pas depuis le paquet : mettre addons/ dans
    # FR | l archive declencherait le GARDE-FOU liste blanche n2 en staging,
    # FR | qui est un pod k3s sans /addons et sans Superviseur pour en
    # FR | installer un — et le garde-fou aurait raison de protester.
    # FR | Non bloquant. /addons n est joignable que si l add-on Terminal &
    # FR | SSH le mappe, et un deploiement de production n a pas a echouer
    # FR | pour un composant optionnel ; le message dit quoi faire a la main.
    # FR | Copier les fichiers n INSTALLE PAS l add-on : il faut dire au
    # FR | Superviseur de regarder, et quelqu un doit cliquer sur Installer.
    # FR | C est delibere — un coffre ne doit pas apparaitre et demarrer tout
    # FR | seul.
    - |
      # EN | Every add-on under addons/, not a named one. vssp-mcp joined
      # EN | vssp-vault here and a second hand-written copy of this block
      # EN | would have been the third place to remember on the next one.
      # FR | Chaque add-on sous addons/, pas un nomme. vssp-mcp a rejoint
      # FR | vssp-vault ici et une seconde copie ecrite a la main de ce bloc
      # FR | aurait ete le troisieme endroit a ne pas oublier au suivant.
      ADDONS=$(cd addons && ls -d */ 2>/dev/null | tr -d /)
      if ssh ha "test -d /addons"; then
        for a in $ADDONS; do
          ssh ha "mkdir -p /addons/$a"
          tar -C addons -czf - "$a" | ssh ha "tar xzf - -C /addons"
          echo "[OK] add-on $a copied to /addons"
        done
        echo "     To pick them up: Settings > Add-ons > Add-on store >"
        echo "     three dots > Check for updates, then install."
      else
        echo "[warn] /addons is not reachable over ssh - add-ons not copied."
        echo "       Copy these by hand (Samba share 'addons'): $ADDONS"
        echo "       then Settings > Add-ons > Store > Check for updates."
      fi
    # --- EN | configuration.yaml patch: run inside the RUNNER (ruamel is
    # ---      available there), then sent back over ssh. More reliable than
    # ---      installing ruamel inside HAOS. The `ha backups new
    # ---      pre-$CI_COMMIT_TAG` above already covers a full rollback; the
    # ---      patcher additionally creates a .bak on the runner.
    # --- FR | PATCH configuration.yaml : execute dans le RUNNER (ruamel
    # ---      dispo), puis renvoye par ssh. Plus fiable que d'installer ruamel
    # ---      dans HAOS. Le "ha backups new pre-$CI_COMMIT_TAG" ci-dessus
    # ---      couvre deja le rollback complet ; le patcher cree en plus un
    # ---      .bak cote runner.
    - apk add --no-cache python3 py3-pip >/dev/null
    - pip install ruamel.yaml --quiet --break-system-packages 2>/dev/null || pip install ruamel.yaml --quiet
    # EN | The build only exposes the .tar.gz: extract patcher + fragment in the runner
    # FR | Le build n'expose que le .tar.gz : on extrait patcher + fragment dans le runner
    - rm -rf /tmp/vssp_pkg && mkdir -p /tmp/vssp_pkg && tar xzf $PACKAGE_NAME.tar.gz -C /tmp/vssp_pkg
    # --- EN | Preserve live rooms — same reasoning as deploy:staging --------
    # --- FR | Preserver les pieces en direct — meme raisonnement que deploy:staging
    # EN | The dashboards/ swap above just replaced house.yaml with the
    # EN | repository's own copy, reverting rooms: (pod-owned state written
    # EN | live by vssp_rooms_apply.py) back to whatever placeholder rooms
    # EN | the repo declares. Merged here on the runner (ruamel available,
    # EN | same reasoning as the configuration.yaml patch below) rather than
    # EN | inside HAOS: read the two house.yaml copies down, merge just the
    # EN | rooms: key locally, write the result back up. Every other key
    # EN | (theme, nav_system, room_icons, locale/format...) still comes
    # EN | from this fresh build. Missing old copy (first-ever deploy) is
    # EN | fine: the script leaves the fresh rooms: alone in that case.
    # FR | L echange de dashboards/ ci-dessus vient de remplacer house.yaml
    # FR | par la copie du depot, faisant revenir rooms: (etat appartenant
    # FR | au pod, ecrit en direct par vssp_rooms_apply.py) aux pieces
    # FR | placeholder que le depot declare. Fusionne ici sur le runner
    # FR | (ruamel disponible, meme raisonnement que le patch de
    # FR | configuration.yaml plus bas) plutot que dans HAOS : lecture des deux
    # FR | copies de house.yaml, fusion de la seule cle rooms: en local, puis
    # FR | du resultat en retour. Toutes les autres cles (theme, nav_system,
    # FR | room_icons, locale/format...) continuent de venir de ce build
    # FR | frais. Copie ancienne absente (tout premier deploiement) : sans
    # FR | probleme, le script laisse alors le rooms: frais tel quel.
    # EN | NO scp ANYWHERE IN THIS JOB. HAOS's ssh does not offer the sftp
    # EN | subsystem, and OpenSSH 9 scp speaks sftp by default, so every
    # EN | transfer died with "subsystem request failed on channel 0 / scp:
    # EN | Connection closed" - the v1.0.0 deployment failed on the very
    # EN | first one. `cat | ssh` and `tar | ssh` need nothing but a shell on
    # EN | the far side, which is exactly how the package itself is already
    # EN | sent a few lines above.
    # EN | A download redirects into a local file, so a failed ssh would
    # EN | leave an EMPTY one that looks like a valid answer: every download
    # EN | is therefore checked, and the optional ones are deleted when empty
    # EN | so that "absent" stays distinguishable from "empty".
    # FR | AUCUN scp DANS CE JOB. Le ssh de HAOS n offre pas le sous-systeme
    # FR | sftp, et le scp d OpenSSH 9 parle sftp par defaut : chaque
    # FR | transfert mourait sur « subsystem request failed on channel 0 /
    # FR | scp: Connection closed » - le deploiement de la v1.0.0 a echoue
    # FR | des le premier. `cat | ssh` et `tar | ssh` n exigent rien d autre
    # FR | qu un shell en face, ce qui est deja exactement la maniere dont le
    # FR | paquet lui-meme est envoye quelques lignes plus haut.
    # FR | Un telechargement redirige vers un fichier local, donc un ssh rate
    # FR | laisserait un fichier VIDE qui a l air d une reponse valable :
    # FR | chaque telechargement est donc verifie, et les facultatifs sont
    # FR | supprimes s ils sont vides pour que « absent » reste distinct de
    # FR | « vide ».
    - |
      ssh ha "cat $HA_CFG/dashboards/model/house.yaml" > /tmp/prod_house.yaml         || { echo "[ERR] cannot read the production house.yaml"; exit 1; }
      [ -s /tmp/prod_house.yaml ] || { echo "[ERR] production house.yaml is empty"; exit 1; }
      ssh ha "cat $HA_CFG/dashboards.old/model/house.yaml 2>/dev/null" > /tmp/prod_house.yaml.old || true
      [ -s /tmp/prod_house.yaml.old ] || rm -f /tmp/prod_house.yaml.old
      ssh ha "cat $HA_CFG/vssp/house.yaml.live 2>/dev/null" > /tmp/prod_house.yaml.live || true
      [ -s /tmp/prod_house.yaml.live ] || rm -f /tmp/prod_house.yaml.live
      python3 /tmp/vssp_pkg/vssp/vssp_preserve_rooms.py \
        --old /tmp/prod_house.yaml.old \
        --fallback /tmp/prod_house.yaml.live \
        --new /tmp/prod_house.yaml
      cat /tmp/prod_house.yaml | ssh ha "cat > $HA_CFG/dashboards/model/house.yaml"
    # --- EN | REGENERATE ON THE INSTANCE, exactly as staging does --------
    # --- FR | REGENERER SUR L INSTANCE, exactement comme le staging -------
    # EN | The package carries dashboards generated in the RUNNER, from the
    # EN | repository's own model - which declares no room and, since the
    # EN | on-demand dashboards were taken out of the package, no HOME, CORE
    # EN | or ENERGY either. Production had no regeneration step at all, so
    # EN | those pages were whatever files the instance happened to hold,
    # EN | frozen at their creation date: a tag could not refresh them, and a
    # EN | fresh install could not obtain them. Confirmed on the v1.0.1
    # EN | deployment - the instance kept a core.yaml and an energy.yaml no
    # EN | release had produced, and its CORE screen still showed figures
    # EN | rendered long before.
    # EN | Inside the container the configuration directory is /config, never
    # EN | $HA_CFG: that variable holds the HOST path (/homeassistant), which
    # EN | does not exist on the other side of `docker exec`.
    # FR | Le paquet transporte des dashboards generes dans LE RUNNER, depuis
    # FR | le modele du depot - qui ne declare aucune piece et, depuis que les
    # FR | dashboards a la demande sont sortis du paquet, ni HOME, ni CORE, ni
    # FR | ENERGY. La production n avait aucune etape de regeneration, donc
    # FR | ces pages etaient les fichiers que l instance possedait par
    # FR | hasard, figes a leur date de creation : un tag ne pouvait pas les
    # FR | rafraichir, et une installation neuve ne pouvait pas les obtenir.
    # FR | Confirme sur le deploiement de la v1.0.1 - l instance a garde un
    # FR | core.yaml et un energy.yaml qu aucune release n avait produits, et
    # FR | son ecran CORE affichait encore un rendu bien anterieur.
    # FR | Dans le conteneur, le repertoire de configuration est /config,
    # FR | jamais $HA_CFG : cette variable porte le chemin de L HOTE
    # FR | (/homeassistant), qui n existe pas de l autre cote de
    # FR | `docker exec`.
    # --- EN | SELECT THE THEME. Generating it is not enough: the selection
    # --- EN | is a preference, and production was measured with
    # --- EN | default_theme = "default" - its users only saw the interface
    # --- EN | because each had chosen the theme in their own profile, and a
    # --- EN | browser never used there would have shown a bare page. The
    # --- EN | automation in vssp_theme.yaml does this at start-up; a deploy
    # --- EN | that reloads rather than restarts would not have triggered it.
    # --- FR | SELECTIONNER LE THEME. Le generer ne suffit pas : la selection
    # --- FR | est une preference, et la production a ete mesuree avec
    # --- FR | default_theme = « default » - ses utilisateurs ne voyaient
    # --- FR | l interface que parce que chacun avait choisi le theme dans son
    # --- FR | profil, et un navigateur jamais utilise la-bas aurait affiche
    # --- FR | une page nue. L automatisation de vssp_theme.yaml le fait au
    # --- FR | demarrage ; un deploiement qui recharge sans redemarrer ne
    # --- FR | l aurait pas declenchee.
    - |
      ssh ha "docker exec homeassistant python3 /config/vssp/vssp_prepare.py --theme-only --url http://localhost:8123" || echo "[warn] the theme could not be selected"

    - |
      ssh ha "docker exec homeassistant sh -c '
        LOCALE=\$(cat /config/VSSP_LOCALE 2>/dev/null || echo en)
        echo \"[i] regenerating on the instance, locale \$LOCALE\"
        python3 /config/vssp/generate_dashboards.py \
          --model       /config/dashboards/model/house.yaml \
          --rooms       /config/dashboards/model/house_rooms.yaml \
          --devices     /config/dashboards/model/energy_devices.yaml \
          --templates   /config/dashboards/templates_j2 \
          --locales-dir /config/dashboards/locales \
          --static-fragment /config/config-fragment.yaml \
          --rooms-fragment  /config/config-fragment-rooms.yaml \
          --locale \"\$LOCALE\" \
          --out /config/dashboards/views
      '" || { echo "[ERR] regeneration on the instance failed"; exit 1; }
    # --- EN | THE THEME, REBUILT FROM THE INSTANCE'S OWN DESIGN MODEL ----
    # --- FR | LE THEME, RECONSTRUIT DEPUIS LE MODELE DE L INSTANCE -------
    # EN | themes/ is rotated wholesale a few steps above, exactly like
    # EN | dashboards/, and the package puts the repository's default theme in
    # EN | its place. But themes/visio_sapiens.yaml is not repository content
    # EN | on a live instance: it is what the graphical THEME editor writes,
    # EN | so a tag repainted the house in the project's colours and threw
    # EN | away whatever the owner had designed. Staging has regenerated it
    # EN | from design_system.yaml since the beginning; production never did.
    # EN | design_system.yaml itself is preserved by the step above, so this
    # EN | rebuild has the owner's design to work from - the editor's own
    # EN | APPLY button runs this very command.
    # FR | themes/ est remplace en bloc quelques etapes plus haut, exactement
    # FR | comme dashboards/, et le paquet y depose le theme par defaut du
    # FR | depot. Or themes/visio_sapiens.yaml n est pas du contenu de depot
    # FR | sur une instance vivante : c est ce qu ecrit l editeur graphique de
    # FR | THEME, donc un tag repeignait la maison aux couleurs du projet et
    # FR | jetait ce que le proprietaire avait dessine. Le staging le
    # FR | regenere depuis design_system.yaml depuis le debut ; la production
    # FR | ne l a jamais fait. design_system.yaml lui-meme est preserve par
    # FR | l etape ci-dessus, cette reconstruction a donc le dessin du
    # FR | proprietaire sous la main - le bouton APPLIQUER de l editeur lance
    # FR | exactement cette commande.
    - |
    # --- EN | THE PREVIEW DASHBOARD, so its sidebar entry is not a dead
    # --- EN | link. config-fragment.yaml declares visio-sapiens-energy-
    # --- EN | preview with show_in_sidebar: true, and nothing ever wrote
    # --- EN | energy_preview.yaml: the entry was present and broken on all
    # --- EN | three environments, production included, since the day it was
    # --- EN | declared. The PREVIEW button overwrites this file when it is
    # --- EN | used; rendering it here only means the link always opens.
    # --- FR | LE DASHBOARD D APERCU, pour que son entree de barre laterale
    # --- FR | ne soit pas un lien mort. config-fragment.yaml declare
    # --- FR | visio-sapiens-energy-preview avec show_in_sidebar: true, et
    # --- FR | rien n ecrivait jamais energy_preview.yaml : l entree etait
    # --- FR | presente et cassee sur les trois environnements, production
    # --- FR | comprise, depuis le jour de sa declaration. Le bouton APERCU
    # --- FR | ecrase ce fichier quand on s en sert ; le rendre ici veut
    # --- FR | seulement dire que le lien s ouvre toujours.
    - |
      ssh ha "docker exec homeassistant sh -c '
        LOCALE=\$(cat /config/VSSP_LOCALE 2>/dev/null || echo en)
        echo \"[i] rendering the preview dashboard\"
        python3 /config/vssp/generate_dashboards.py --only energy --preview \
          --model /config/dashboards/model/house.yaml \
          --rooms /config/dashboards/model/house_rooms.yaml \
          --devices /config/dashboards/model/energy_devices.yaml \
          --templates /config/dashboards/templates_j2 \
          --locales-dir /config/dashboards/locales \
          --locale \"\$LOCALE\" \
          --out /config/dashboards/views
      '" || echo "[warn] the preview dashboard was not rendered"

    - |
      ssh ha "docker exec homeassistant sh -c '
        LOCALE=\$(cat /config/VSSP_LOCALE 2>/dev/null || echo en)
        python3 /config/vssp/generate_dashboards.py --only theme \
          --model /config/dashboards/model/house.yaml \
          --design-model /config/dashboards/model/design_system.yaml \
          --templates /config/dashboards/templates_j2 \
          --locales-dir /config/dashboards/locales \
          --locale \"\$LOCALE\" \
          --themes-out /config/themes \
          --design-status-file /config/www/vssp/design_system_status.json
      '" || { echo "[ERR] theme rebuild on the instance failed"; exit 1; }
    - |
      ssh ha "cat $HA_CFG/configuration.yaml" > /tmp/prod_configuration.yaml         || { echo "[ERR] cannot read the production configuration.yaml"; exit 1; }
      [ -s /tmp/prod_configuration.yaml ] || { echo "[ERR] production configuration.yaml is empty"; exit 1; }
    # EN | local safety net / FR | filet local
    - cp /tmp/prod_configuration.yaml /tmp/prod_configuration.yaml.pre
    # EN | Same guard as staging: refuse to patch production from a fragment
    # EN | that still holds raw __T: markers.
    # FR | Meme garde-fou qu en staging : refuser de patcher la production
    # FR | depuis un fragment contenant encore des marqueurs __T: bruts.
    - |
      ssh ha "cat $HA_CFG/config-fragment-rooms.yaml" > /tmp/prod_fragment_rooms.yaml || { echo "[ERR] cannot read the rooms fragment the instance just wrote"; exit 1; }
      [ -s /tmp/prod_fragment_rooms.yaml ] || { echo "[ERR] the instance rooms fragment is empty"; exit 1; }
      if grep -En '__T:[A-Za-z0-9_.]+__' /tmp/vssp_pkg/config-fragment.yaml /tmp/prod_fragment_rooms.yaml; then
        echo "[ERR] The packaged fragment still holds translation placeholders."
        echo "      Rebuild: the locale rendering step did not run."
        exit 1
      fi
    # EN | The fragment inside the package is ALREADY rendered in the target
    # EN | language by the build job - nothing language-related happens here.
    # EN | The ROOMS fragment, on the other hand, is taken from the INSTANCE:
    # EN | the packaged one is built from the repository model and declares no
    # EN | room at all, so merging it would tell Home Assistant this house has
    # EN | no room dashboards. The instance's copy is the one the
    # EN | regeneration step above just wrote, from the instance's own model.
    # FR | Le fragment des PIECES, lui, est pris sur L INSTANCE : celui du
    # FR | paquet est construit depuis le modele du depot et ne declare aucune
    # FR | piece, le fusionner reviendrait donc a dire a Home Assistant que
    # FR | cette maison n a aucun dashboard de piece. La copie de l instance
    # FR | est celle que l etape de regeneration ci-dessus vient d ecrire,
    # FR | depuis le modele de l instance.
    # FR | Le fragment contenu dans le paquet est DEJA rendu dans la langue
    # FR | cible par le job build - rien de linguistique ne se passe ici.
    - |
      python3 /tmp/vssp_pkg/vssp/vssp_apply_config.py \
        --config   /tmp/prod_configuration.yaml \
        --fragment /tmp/vssp_pkg/config-fragment.yaml /tmp/prod_fragment_rooms.yaml \
        --prune-dashboards \
        --prune-resources \
        --vtoken   "$VSSP_DEPLOY_REF" || { echo "[ERR] configuration.yaml patch failed"; exit 1; }
    # EN | The patcher does not handle the homeassistant domain: set packages key
    # FR | Le patcher ne gere pas le domaine homeassistant : poser la cle packages
    - |
      python3 /tmp/vssp_pkg/vssp/vssp_ensure_packages.py \
        --config /tmp/prod_configuration.yaml || { echo "[ERR] ensure packages failed"; exit 1; }
    # EN | Same seeding as staging, but run ON the instance: secrets.yaml is
    # EN | never copied to the runner. A file full of credentials has no
    # EN | reason to make a round trip through CI to gain one empty line.
    # FR | Meme amorcage qu en staging, mais execute SUR l instance :
    # FR | secrets.yaml n est jamais copie sur le runner. Un fichier plein
    # FR | d identifiants n a aucune raison de faire l aller-retour par le
    # FR | CI pour gagner une ligne vide.
    - |
      ssh ha "python3 $HA_CFG/vssp/vssp_ensure_secret.py \
        --config $HA_CFG/secrets.yaml \
        --key vault_ha_token \
        --comment 'Visio Sapiens - jeton Vault, policy vssp-ha (noms, jamais valeurs). Voir docs/platform/Vault.md.'" \
        || { echo "[ERR] ensure secret failed"; exit 1; }
    # EN | Dedupe Lovelace resources (the patcher accumulates successive ?v=)
    # FR | Dedup des ressources Lovelace (le patcher accumule les ?v= successifs)
    - |
      python3 /tmp/vssp_pkg/vssp/vssp_sanitize_resources.py \
        --config /tmp/prod_configuration.yaml || { echo "[ERR] sanitize resources failed"; exit 1; }
    - cat /tmp/prod_configuration.yaml | ssh ha "cat > $HA_CFG/configuration.yaml"
    - |
      if ! ssh ha "ha core check"; then
        echo "[ERR] Invalid config - rolling back production"
        ssh ha "for d in dashboards themes; do
          [ -d $HA_CFG/\$d.old ] && rm -rf $HA_CFG/\$d && mv $HA_CFG/\$d.old $HA_CFG/\$d
        done"
        # EN | Restore the pre-patch configuration.yaml
        # FR | Restaurer le configuration.yaml d'avant patch
        cat /tmp/prod_configuration.yaml.pre | ssh ha "cat > $HA_CFG/configuration.yaml" && echo "[rollback] configuration.yaml restored (pre-patch)"
        exit 1
      fi
    - |
      if [ "$PROD_RESTART_CORE" = "true" ]; then
        ssh ha "ha core restart"
      else
        ssh ha "ha core reload"
      fi
    # --- EN | ruamel.yaml INSIDE THE homeassistant CONTAINER ITSELF ---------
    # --- FR | ruamel.yaml DANS LE CONTENEUR homeassistant LUI-MEME ----------
    # EN | Unlike the configuration.yaml patch above (which runs in the
    # EN | runner - see the comment near the `apk add python3 py3-pip` step),
    # EN | vssp_assign_apply.py and vssp_rooms_apply.py run INSIDE HAOS,
    # EN | invoked by Home Assistant's own shell_command when the ROOMS or
    # EN | ASSIGN webhook fires. That is the "homeassistant" Docker container
    # EN | on the HAOS host (confirmed against the official debugging docs:
    # EN | developers.home-assistant.io/docs/operating-system/debugging/),
    # EN | reachable directly from this SSH session since HAOS's port 22222
    # EN | drops onto the host OS with Docker access, not into a sandboxed
    # EN | shell. Checked AFTER the restart above so this reflects whatever
    # EN | container is actually running now, whether `ha core restart`
    # EN | recreated it (a version update) or left it alone.
    # FR | Contrairement au patch de configuration.yaml ci-dessus (qui tourne
    # FR | dans le runner - voir le commentaire pres de l etape
    # FR | `apk add python3 py3-pip`), vssp_assign_apply.py et
    # FR | vssp_rooms_apply.py tournent A L INTERIEUR de HAOS, invoques par le
    # FR | shell_command de Home Assistant lui-meme quand le webhook ROOMS ou
    # FR | ASSIGN se declenche. C est le conteneur Docker "homeassistant" sur
    # FR | l hote HAOS (confirme par la documentation officielle de debogage :
    # FR | developers.home-assistant.io/docs/operating-system/debugging/),
    # FR | atteignable directement depuis cette session SSH puisque le port
    # FR | 22222 de HAOS atterrit sur le systeme hote avec acces Docker, pas
    # FR | dans un shell isole. Verifie APRES le redemarrage ci-dessus pour
    # FR | refleter le conteneur reellement en cours d execution maintenant,
    # FR | qu il ait ete recree par `ha core restart` (mise a jour de version)
    # FR | ou laisse tel quel.
    - |
      ssh ha "
        if docker exec homeassistant python3 -c 'import ruamel.yaml' 2>/dev/null; then
          echo '[OK] ruamel.yaml already present in the homeassistant container'
        else
          echo '[i] ruamel.yaml missing in the homeassistant container - installing'
          docker exec homeassistant pip install ruamel.yaml --quiet --break-system-packages 2>/dev/null || docker exec homeassistant pip install ruamel.yaml --quiet 2>/dev/null || true
          if docker exec homeassistant python3 -c 'import ruamel.yaml' 2>/dev/null; then
            echo '[OK] ruamel.yaml installed in the homeassistant container'
          else
            echo '[ERR] ruamel.yaml could not be installed in the homeassistant container.'
            echo '      ROOMS sync and ASSIGN save will reject every request until this is fixed.'
            exit 1
          fi
        fi
      "
    - ssh ha "rm -rf $HA_CFG/dashboards.old $HA_CFG/themes.old"
    - echo "[OK] $VSSP_DEPLOY_REF live on $HA_HOST"

# ============================================================================
# EN | 4. SMOKE TESTS / FR | 4. TESTS DE FUMEE
# ============================================================================


deploy:production:
  extends: [.ssh_bootstrap, .deploy_appliance]
  stage: deploy
  variables:
    # EN | On production the deploy reference IS the tag - the job only runs
    # EN | on one, so nothing about a tagged release behaves differently
    # EN | than before this was parameterised.
    # FR | En production la reference de deploiement EST le tag - le job ne
    # FR | tourne que sur un tag, donc rien d'une release taguee ne se
    # FR | comporte autrement qu'avant ce parametrage.
    VSSP_DEPLOY_REF: $CI_COMMIT_TAG
  needs: ["build", "preflight:production"]
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  allow_failure: false
  environment:
    name: production
    url: $PROD_URL
    # EN | script: comes from .deploy_appliance above.
    # FR | script: vient de .deploy_appliance ci-dessus.

# ============================================================================
# EN | SECOND STAGING — the same appliance, in a KubeVirt VM.
# FR | SECONDE PREPRODUCTION — le meme appareil, en VM KubeVirt.
#
# EN | Deploys to the Home Assistant OS VM in the `haos` namespace, defined
# EN | by kubernetes/haos/haos-vm.yaml. Same script as production, because
# EN | it is the same kind of machine - that is the entire point of it
# EN | existing. The `homeassistant` pod staging is NOT replaced: it is the
# EN | only instance where the INFRASTRUCTURE update family applies, since
# EN | an appliance reports n/a for it by design.
# EN | MANUAL, and invisible until $HAOS_SSH_KEY exists. The VM has to be
# EN | created, onboarded and given the Terminal & SSH add-on before
# EN | anything here can work, and a job that fails every pipeline while
# EN | waiting for that would just teach everyone to ignore a red icon.
# FR | Deploie vers la VM Home Assistant OS du namespace `haos`, definie par
# FR | kubernetes/haos/haos-vm.yaml. Meme script que la production, parce que
# FR | c'est le meme type de machine - c'est toute la raison de son
# FR | existence. La preproduction en pod `homeassistant` n'est PAS
# FR | remplacee : c'est la seule instance ou la famille de mises a jour
# FR | INFRASTRUCTURE s'applique, un appareil rapportant n/a par conception.
# FR | MANUEL, et invisible tant que $HAOS_SSH_KEY n'existe pas. La VM doit
# FR | etre creee, initialisee et dotee de l'add-on Terminal & SSH avant que
# FR | quoi que ce soit ici puisse fonctionner, et un job qui echouerait a
# FR | chaque pipeline en attendant n'apprendrait qu'a ignorer une icone
# FR | rouge.
#
# EN | REQUIRED CI/CD VARIABLE
# FR | VARIABLE CI/CD REQUISE
#   HAOS_SSH_KEY   File type - private key whose public half is in the
#                  Terminal & SSH add-on's authorized_keys on the VM.
#                  Absent = this job does not appear at all.
# ============================================================================
deploy:staging-haos:
  extends: [.ssh_bootstrap, .deploy_appliance]
  stage: deploy
  needs:
    - "build"
    # EN | optional: the job does not exist
    # EN | until HA_TOKEN_HAOS does, and a needs
    # EN | on a job that was never created is a
    # EN | pipeline error.
    # FR | optionnel : le job n existe pas tant
    # FR | que HA_TOKEN_HAOS n existe pas, et un
    # FR | needs vers un job jamais cree est une
    # FR | erreur de pipeline.
    - job: "preflight:staging-haos"
      optional: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "master" && $HAOS_SSH_KEY
      when: manual
  allow_failure: true
  environment:
    name: staging-haos
    url: $HAOS_URL
  variables:
    # EN | The VM's own LAN address, not a NodePort on the node. It sits on
    # EN | a host bridge now, so it answers on the network like the
    # EN | production appliance does - and the Terminal & SSH add-on is
    # EN | reached on its real port, with no translation in between.
    # EN | Static, because DHCP does not work on that switch port: the
    # EN | interface only ever got an IPv4 link-local address, while IPv6
    # EN | autoconfigured perfectly. Set inside the appliance with
    # EN |   ha network update enp1s0 --ipv4-method static     # EN |     --ipv4-address 192.168.1.200/24 --ipv4-gateway 192.168.1.1     # EN |     --ipv4-nameserver 192.168.1.1
    # FR | L'adresse LAN de la VM, pas un NodePort sur le noeud. Elle est
    # FR | desormais sur un pont hote, elle repond donc sur le reseau comme
    # FR | l'appareil de production - et l'add-on Terminal & SSH se joint sur
    # FR | son vrai port, sans traduction.
    # FR | Statique, parce que le DHCP ne fonctionne pas sur ce port de
    # FR | switch : l'interface n'a jamais obtenu qu'une adresse IPv4
    # FR | lien-local, alors que l'IPv6 s'autoconfigurait parfaitement.
    # FR | Posee dans l'appareil avec la commande ci-dessus.
    HA_HOST: "192.168.1.200"
    HA_SSH_PORT: "22222"
    # EN | Not a secret, so it lives here rather than as one more variable
    # EN | to create by hand. Port 8123 because the appliance was moved onto
    # EN | it deliberately: a fresh Home Assistant OS on a qemu machine came
    # EN | up serving on port 80, which production does not, and a staging
    # EN | instance that does not answer where production answers is not
    # EN | iso-prod. Both now serve 8123 and nothing on 80.
    # FR | Ce n'est pas un secret, elle vit donc ici plutot que comme une
    # FR | variable de plus a creer a la main. Port 8123 parce que l'appareil
    # FR | y a ete deplace volontairement : un Home Assistant OS neuf sur une
    # FR | machine qemu servait sur le port 80, ce que la production ne fait
    # FR | pas, et une preproduction qui ne repond pas la ou repond la
    # FR | production n'est pas iso-prod. Les deux servent desormais 8123 et
    # FR | rien sur 80.
    HAOS_URL: "http://192.168.1.200:8123"
    HA_SSH_KEY_OVERRIDE: $HAOS_SSH_KEY
    # EN | No tag on master, so the reference is the branch build - the same
    # EN | string the pod staging writes into VSSP_VERSION, which is what
    # EN | sensor.vssp_deployed_version shows in the navigation rail.
    # FR | Pas de tag sur master, la reference est donc la build de branche -
    # FR | la meme chaine que la preproduction en pod ecrit dans
    # FR | VSSP_VERSION, celle qu'affiche sensor.vssp_deployed_version dans
    # FR | le bandeau de navigation.
    VSSP_DEPLOY_REF: dev-$CI_COMMIT_SHORT_SHA
test:staging:
  extends:
    - .smoke_test
    - .rules_staging
  needs: ["deploy:staging"]
  variables:
    TARGET_URL: $STAGING_URL
    HA_TOKEN: $HA_TOKEN_STAGING

# EN | allow_failure WHILE THE KNOWN GAPS ARE CLEARED. Its first run on the
# EN | pod staging found nine dashboards declared with no file - the orphan
# EN | room declarations nobody had decided on - and sensor.time missing.
# EN | Those are real and they are old; failing master over them today would
# EN | only teach everyone to ignore a red pipeline. It reports as a warning
# EN | until they are cleared, and then this line goes.
# FR | allow_failure LE TEMPS DE SOLDER LES ECARTS CONNUS. Son premier
# FR | passage sur la preproduction en pod a trouve neuf dashboards declares
# FR | sans fichier - les declarations de pieces orphelines que personne
# FR | n avait tranchees - et sensor.time manquant. C est reel et c est
# FR | ancien ; faire rougir master pour cela aujourd hui n apprendrait qu a
# FR | ignorer un pipeline rouge. Il avertit jusqu a ce que ce soit solde,
# FR | et alors cette ligne disparait.
preflight:staging:
  extends:
    - .preflight
    - .rules_staging
  needs: ["build"]
  variables:
    TARGET_URL: $STAGING_URL
    HA_TOKEN: $HA_TOKEN_STAGING

prepare:staging:
  extends:
    - .prepare
    - .rules_staging
  needs: ["build"]
  variables:
    TARGET_URL: $STAGING_URL
    HA_TOKEN: $HA_TOKEN_STAGING

# EN | The appliance staging has no token variable yet, so both of these ask
# EN | for HA_TOKEN_HAOS and simply do not appear until it exists. The deploy
# EN | needs them optionally for the same reason - a needs on a job that was
# EN | never created is a pipeline error, not a skipped gate.
# FR | La preproduction appareil n a pas encore de variable de jeton : ces
# FR | deux jobs demandent donc HA_TOKEN_HAOS et n apparaissent pas tant
# FR | qu elle n existe pas. Le deploiement les requiert en optionnel pour la
# FR | meme raison - un needs vers un job jamais cree est une erreur de
# FR | pipeline, pas une porte ignoree.
preflight:staging-haos:
  extends: .preflight
  needs: ["build"]
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "master" && $HAOS_SSH_KEY && $HA_TOKEN_HAOS
      when: on_success
  variables:
    TARGET_URL: $HAOS_URL
    HA_TOKEN: $HA_TOKEN_HAOS

prepare:staging-haos:
  extends: .prepare
  needs: ["build"]
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "master" && $HAOS_SSH_KEY && $HA_TOKEN_HAOS
      when: manual
  variables:
    TARGET_URL: $HAOS_URL
    HA_TOKEN: $HA_TOKEN_HAOS

preflight:production:
  extends:
    - .preflight
    - .rules_tag
  needs: ["build"]
  variables:
    TARGET_URL: $PROD_URL
    HA_TOKEN: $HA_TOKEN_PROD

prepare:production:
  extends:
    - .prepare
    - .rules_tag
  needs: ["build"]
  variables:
    TARGET_URL: $PROD_URL
    HA_TOKEN: $HA_TOKEN_PROD

verify:staging:
  extends:
    - .verify
    - .rules_staging
  needs: ["test:staging"]
  variables:
    TARGET_URL: $STAGING_URL
    HA_TOKEN: $HA_TOKEN_STAGING
    VSSP_DEPLOY_REF: dev-$CI_COMMIT_SHORT_SHA

# EN | The appliance staging has no token variable yet, so this job asks for
# EN | HA_TOKEN_HAOS and simply does not appear until it exists - the same
# EN | rule its deploy follows.
# FR | La preproduction appareil n a pas encore de variable de jeton : ce job
# FR | demande donc HA_TOKEN_HAOS et n apparait pas tant qu elle n existe pas
# FR | - la meme regle que son deploiement.
verify:staging-haos:
  extends: .verify
  needs: ["deploy:staging-haos"]
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "master" && $HAOS_SSH_KEY && $HA_TOKEN_HAOS
      when: on_success
  variables:
    TARGET_URL: $HAOS_URL
    HA_TOKEN: $HA_TOKEN_HAOS
    VSSP_DEPLOY_REF: dev-$CI_COMMIT_SHORT_SHA

test:production:
  extends:
    - .smoke_test
    - .rules_tag
  needs: ["deploy:production"]
  variables:
    TARGET_URL: $PROD_URL
    HA_TOKEN: $HA_TOKEN_PROD

verify:production:
  extends:
    - .verify
    - .rules_tag
  needs: ["test:production"]
  variables:
    TARGET_URL: $PROD_URL
    HA_TOKEN: $HA_TOKEN_PROD
    VSSP_DEPLOY_REF: $CI_COMMIT_TAG

# ============================================================================
# EN | 5. PRODUCTION ROLLBACK — manual
# FR | 5. ROLLBACK PRODUCTION — manuel
# ============================================================================
rollback:production:
  extends: .ssh_bootstrap
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  allow_failure: true
  environment:
    name: production
    url: $PROD_URL
  script:
    - echo "Restoring the pre-$CI_COMMIT_TAG backup"
    - |
      SLUG=$(ssh ha "ha backups --raw-json" \
        | jq -r ".data.backups[] | select(.name==\"pre-$CI_COMMIT_TAG\") | .slug" | head -1)
      if [ -z "$SLUG" ]; then echo "[ERR] Backup not found"; ssh ha "ha backups"; exit 1; fi
      echo "Slug: $SLUG"
      ssh ha "ha backups restore $SLUG --no-progress"
    - echo "[OK] Rollback complete"

# ============================================================================
# EN | 6. GitLab RELEASE / FR | 6. RELEASE GitLab
# ============================================================================
release:
  extends: .rules_tag
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["deploy:production", "package:hacs"]
  script:
    - echo "Release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Visio Sapiens $CI_COMMIT_TAG"
    description: "Deployed to HAOS - commit $CI_COMMIT_SHA"

########################################################################
# Visio Sapiens — ENERGY : configuration requise
#
# Ce fichier n'est PAS chargé tel quel : copiez chaque bloc dans le
# fichier indiqué en commentaire.
########################################################################


# ══════════════════════════════════════════════════════════════════════
# 1. DÉCLARATION DU DASHBOARD  →  configuration.yaml
#    (à ajouter sous la clé `lovelace:` existante, à côté de vssp-core)
# ══════════════════════════════════════════════════════════════════════
#
# lovelace:
#   mode: yaml
#   dashboards:
#     vssp-core:
#       mode: yaml
#       title: CORE
#       icon: mdi:server
#       show_in_sidebar: true
#       filename: dashboards/views/core.yaml
#
#     vssp-energy:                       # <── NOUVEAU
#       mode: yaml
#       title: ENERGY
#       icon: mdi:lightning-bolt
#       show_in_sidebar: true
#       filename: dashboards/views/energy.yaml
#
# ⚠️  L'URL résultante est /vssp-energy/energy — elle correspond
#     exactement aux `navigation_path` déjà présents dans la sidebar de
#     home.yaml et core.yaml. Rien d'autre à modifier côté navigation.
#
# ⚠️  Ne PAS décommenter `- !include views/energy.yaml` dans home.yaml :
#     energy.yaml est un dashboard autonome (avec son wrapper title/views),
#     pas une vue à fusionner. Les deux usages sont exclusifs.


# ══════════════════════════════════════════════════════════════════════
# 2. HELPERS  →  configuration.yaml
# ══════════════════════════════════════════════════════════════════════

input_select:
  # EN | ⚠ BREAKING CHANGE — the option VALUES moved from French to English.
  # EN | They are identifiers, not labels: the JS in energy.yaml.j2 compares
  # EN | them (state === 'Day'). The displayed tab label is translated
  # EN | separately through t('energy.tab.day'), so a French interface still
  # EN | reads Jour / Mois / Annee while the stored state stays Day.
  # EN |
  # EN | MIGRATION — the helper keeps its old state until you act:
  # EN |   1. apply this file, then restart Home Assistant
  # EN |   2. the helper still holds "Jour", which is no longer a valid
  # EN |      option, so the tabs will match nothing and the charts stay empty
  # EN |   3. set it once to Day (from the dashboard, Developer tools, or
  # EN |      Settings > Helpers) and it is done for good
  # FR | ⚠ CHANGEMENT CASSANT — les VALEURS d'options passent du francais a
  # FR | l'anglais. Ce sont des identifiants, pas des libelles : le JS de
  # FR | energy.yaml.j2 les compare (state === 'Day'). Le libelle d'onglet
  # FR | affiche est traduit separement via t('energy.tab.day'), donc une
  # FR | interface francaise affiche toujours Jour / Mois / Annee tandis que
  # FR | l'etat stocke reste Day.
  # FR |
  # FR | MIGRATION — le helper garde son ancien etat tant qu'on n'agit pas :
  # FR |   1. appliquer ce fichier, puis redemarrer Home Assistant
  # FR |   2. le helper contient encore « Jour », qui n'est plus une option
  # FR |      valide : les onglets ne correspondront a rien et les graphes
  # FR |      resteront vides
  # FR |   3. le repositionner une fois sur Day (depuis le dashboard, les
  # FR |      outils de developpement ou Parametres > Aides) et c'est regle
  vssp_energy_period:
    name: "Visio Sapiens — Energy period"
    options:
      - Day
      - Month
      - Year
    initial: Day
    icon: mdi:calendar-clock

input_number:
  # Capacité de production annuelle de l'installation (objectif)
  vssp_solar_capacity:
    name: Visio Sapiens — Capacité solaire annuelle
    min: 0
    max: 50000
    step: 100
    initial: 12500
    unit_of_measurement: kWh
    mode: box
    icon: mdi:solar-power

  # Tarif de rachat du surplus (€/kWh)
  vssp_tarif_revente:
    name: Visio Sapiens — Tarif revente
    min: 0
    max: 1
    step: 0.001
    initial: 0.20
    unit_of_measurement: "€/kWh"
    mode: box
    icon: mdi:cash


# ══════════════════════════════════════════════════════════════════════
# 3. CAPTEURS TEMPLATE  →  configuration.yaml (sous `template:`)
#    Calculent l'estimation de revente à partir du surplus exporté.
# ══════════════════════════════════════════════════════════════════════

template:
  - sensor:
      - name: "Visio Sapiens Revente Mois"
        unique_id: vssp_revente_mois
        unit_of_measurement: "€"
        state_class: total
        state: >
          {% set kwh = states('sensor.grid_export_energy_this_month') | float(0) %}
          {% set tarif = states('input_number.vssp_tarif_revente') | float(0.20) %}
          {{ (kwh * tarif) | round(2) }}

      - name: "Visio Sapiens Revente Annee"
        unique_id: vssp_revente_annee
        unit_of_measurement: "€"
        state_class: total
        state: >
          {% set kwh = states('sensor.grid_export_energy_this_year') | float(0) %}
          {% set tarif = states('input_number.vssp_tarif_revente') | float(0.20) %}
          {{ (kwh * tarif) | round(2) }}

      # Moyenne quotidienne de consommation sur le mois en cours
      - name: "Visio Sapiens Consommation Moyenne Quotidienne"
        unique_id: vssp_conso_moyenne_quotidienne
        unit_of_measurement: kWh
        state_class: measurement
        state: >
          {% set kwh = states('sensor.home_energy_this_month') | float(0) %}
          {% set jour = now().day %}
          {{ (kwh / jour) | round(1) if jour > 0 else 0 }}


# ══════════════════════════════════════════════════════════════════════
# 4. COMPTEURS PÉRIODIQUES  →  configuration.yaml
#    Si vos Shelly n'exposent qu'un cumul brut, utility_meter fournit
#    les totaux jour / mois / année attendus par le dashboard.
#    (Exemple pour un appareil — dupliquer pour chaque circuit.)
# ══════════════════════════════════════════════════════════════════════

utility_meter:
  shelly_chauffe_eau_energy_today:
    source: sensor.shelly_chauffe_eau_energy      # capteur cumulé du Shelly
    name: Chauffe-eau énergie du jour
    cycle: daily

  solar_energy_today:
    source: sensor.solar_energy_total             # cumul production
    name: Production solaire du jour
    cycle: daily
  solar_energy_this_month:
    source: sensor.solar_energy_total
    name: Production solaire du mois
    cycle: monthly
  solar_energy_this_year:
    source: sensor.solar_energy_total
    name: Production solaire de l'année
    cycle: yearly


# ══════════════════════════════════════════════════════════════════════
# 5. RÉCAPITULATIF DES ENTITÉS ATTENDUES PAR energy.yaml
#    Toutes sont marquées « # TODO » dans le dashboard.
# ══════════════════════════════════════════════════════════════════════
#
# PRODUCTION SOLAIRE
#   sensor.solar_power_production          kW   Production instantanée
#   sensor.solar_energy_today              kWh  Production du jour
#   sensor.solar_energy_this_month         kWh  Production du mois
#   sensor.solar_energy_this_year          kWh  Production de l'année
#   binary_sensor.solar_inverter_running   on/off  Statut onduleur
#
# CONSOMMATION MAISON
#   sensor.home_power_consumption          kW   Consommation instantanée
#   sensor.home_energy_today               kWh
#   sensor.home_energy_this_month          kWh
#   sensor.home_energy_this_year           kWh
#   sensor.home_energy_daily_average       kWh  (= template §3)
#
# RÉSEAU / EDF
#   sensor.grid_export_power               kW   Surplus injecté
#   sensor.grid_import_power               kW   Soutirage réseau
#   sensor.grid_export_energy_today        kWh
#   sensor.grid_export_energy_this_month   kWh
#   sensor.grid_export_energy_this_year    kWh
#   sensor.vssp_revente_mois           €    (= template §3)
#   sensor.vssp_revente_annee          €    (= template §3)
#
# APPAREILS — 8 lignes du tableau (puissance + énergie du jour)
#   sensor.shelly_<appareil>_power                kW
#   sensor.shelly_<appareil>_energy_today         kWh
#   appareils : chauffe_eau, clim_salon, lave_linge, four,
#               lave_vaisselle, refrigerateur, eclairage_salon, bureau
#
# CIRCUITS — 12 interrupteurs du tableau électrique
#   switch.shelly_chauffe_eau        switch.shelly_refrigerateur
#   switch.shelly_clim_salon         switch.shelly_eclairage_salon
#   switch.shelly_lave_linge         switch.shelly_eclairage_chambre
#   switch.shelly_four               switch.shelly_prises_salon
#   switch.shelly_lave_vaisselle     switch.shelly_bureau
#   switch.shelly_prises_cuisine     switch.shelly_piscine
